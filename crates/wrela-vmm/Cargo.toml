[package]
name = "wrela-vmm"
version.workspace = true
edition.workspace = true

[features]
# The product/validation artifact enables direct DRM/KMS presentation. The
# feature remains explicit so headless-only development builds do not compile
# Linux presenter code; both variants remain fully static and dependency-free.
native-presentation = []

[dependencies]
wrela-machine = { path = "../wrela-machine" }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
kvm-bindings = { version = "=0.14.1", default-features = false, features = ["fam-wrappers"] }
kvm-ioctls = { version = "=0.25.0", default-features = false }

[dev-dependencies]
# plans/M5.md item F: the clock-reading test image (record.rs's own unit
# tests) needs a handful of pinned A76 encodings to hand-assemble a tiny
# guest program that reads CLOCK_MMIO_ADDR twice — `wrela-compiler`'s
# `encode.rs` already has these, unit-tested and golden-pinned, so
# reusing them here (test-only, in-workspace, never linked into the
# production `wrela-vmm` binary) is strictly less risk than re-deriving
# the same bit patterns a second time by hand. CLAUDE.md's "a dependency
# is a liability" rule is about *external* liabilities; this is neither
# external nor shipped.
wrela-compiler = { path = "../wrela-compiler" }
