[workspace]
resolver = "2"
members = [
    "crates/wrela-machine",
    "crates/wrela-compiler",
    "crates/wrela-vmm",
    "crates/xtask",
    "crates/wrela-fieldprobe",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Keep this list short. A dependency is a liability the whole stack inherits.
[workspace.dependencies]
toml = "0.8"

# A release build keeps every internal invariant live. This is not a
# tuning knob — it is CLAUDE.md's "fail closed" rule applied to the one
# place a stripped assertion is worse than a crash: the aarch64 encoder
# and `layout.rs`'s placement bookkeeping state their invariants as
# `debug_assert!`, and with those compiled out an out-of-range immediate
# does not fail, it ORs into a neighbouring instruction field and ships a
# silently different instruction inside a sealed image (`encode.rs`'s own
# `ldr_str_imm`/`word_offset` doc comments: "so a bad offset fails loudly
# at encode time rather than silently truncating" — a promise the default
# release profile quietly withdraws). `overflow-checks` is here for the
# same reason: this compiler's address/offset arithmetic is `usize`/`u64`
# throughout, and a wrapped offset is a wrong image, not a slow one.
#
# The cost is irrelevant at this scale: `wrela` is a single-threaded batch
# compiler whose whole golden corpus lexes+parses inside one locked
# `xtask bench compiler` threshold. Cheapness is bought with a profile
# (CLAUDE.md's cleverness budget), and no profile has been produced that
# asks for these back.
[profile.release]
debug-assertions = true
overflow-checks = true

# The dev profile is not a debugging preference here — it is what every
# gate lane actually runs on. `cargo test`, `xtask golden`, `corpus`,
# `report-determinism`, `roundtrip` and every fuzz lane execute this
# compiler, not the release one, so an unoptimized `dev` is a tax paid
# once per lane per gate run.
#
# Measured 2026-07-30 (Apple M4, 4 performance + 6 efficiency cores, fresh
# target dir per row) against the worst single test in the suite,
# `cost::branch::tests::branch_terms_census_over_the_cost_corpus`, which
# was 94% of the compiler lib suite's wall time:
#
#   profile                     cold build   that test   target/
#   opt-level = 0 (default)          11.2s      395.0s     550MB
#   opt-level = 1                    35.9s       53.4s     727MB
#   opt-level = 2                    40.3s       56.9s     717MB
#   opt-level = 3                    39.6s       76.9s    1295MB
#   opt-level = 2, line-tables       30.8s       44.0s     567MB
#
# A current whole-static-corpus measurement on 2026-08-16 revisited the two
# viable levels after the compiler grew substantially. With the same
# line-table setting and an empty golden-output cache, compiler level 1
# completed the complete cold command in 93.5s versus 129s for level 2. A
# second end-to-end sweep found that leaving the control-only `xtask` crate at
# level 0, using 64 compiler codegen units, and returning renderer arenas via
# isolated children reduced fresh build + fully uncached static execution to
# 43.9s + 34.2s. The public `--assume-built` compatibility flag is included in
# that cold-static measurement; isolation has its own recursion guard, so the
# flag cannot silently select the slower arena-retaining path. Compiler level
# 0 built in 21.8s but made that same corpus take 102.5s, so it merely moved
# the wait. The VMM stays at level 2: a real cold
# Pixels guest at level 1 exceeded 90 seconds, so applying the compile-time
# trade globally merely moved the wait into every uncached boot. Three things
# the measurements decide:
# **3 is worse than 2** (more aggressive inlining on a large compiler crate
# costs more than it wins, and doubles the target directory), and level 1 is
# now the best end-to-end development setting. Also,
# **dropping full DWARF is free speed** — `line-tables-only` keeps file
# and line numbers in every panic backtrace, which is all this codebase
# reads out of a failing `debug_assert!`, while cutting both the codegen
# work and the linker's input.
#
# LTO is deliberately absent. It is the one lever that trades away
# incremental rebuilds, which is the number that governs the edit loop —
# and no profile has been produced asking for it (CLAUDE.md's cleverness
# budget applies to the build as much as to the compiler).
#
# `debug-assertions` and `overflow-checks` are on by default at this
# profile and are named here for the same reason `[profile.release]`
# names them: they are load-bearing, not incidental. `encode.rs`'s
# out-of-range immediates and `layout.rs`'s placement bookkeeping fail
# loudly only while they are live, and the goldens run on this binary.
[profile.dev]
opt-level = 2
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true

[profile.dev.package.wrela-compiler]
opt-level = 1
# The default dev profile's very wide codegen partition saves less than a
# second of frontend time but costs more in every compiler-heavy command.
# Sixteen units lost the saved build time again; 64 is the measured cold
# build + uncached corpus minimum on the baseline host.
codegen-units = 64

[profile.dev.package.xtask]
# The task runner coordinates already-optimized compiler code. Optimizing its
# own CLI/control layer adds cold codegen and link work without moving corpus
# execution time.
opt-level = 0
