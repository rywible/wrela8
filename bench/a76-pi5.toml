pessimistic = "hi"
tier = "T5"
source = "mechanism SOG §4.5 (avoid a store crossing a 16 B boundary); magnitude unpriced. Bracket is an engineering bound: >= 1 cycle, and no worse than a second L1D access (4)"

# The residual the v2 table hid inside `call = 4` / `abort_val = 3`:
# prologue/epilogue, pipeline drain, anything beyond the `BL` word itself.
# Removal-sensitive because deleting a call is inlining: a large residual
# over-credits inlining, a small one over-credits outlining, and neither
# direction may be favoured at the pinned point. The ∀ sweep is the gate.
[sweep.call_overhead]
lo = 0
hi = 16
pinned = 0
pessimistic = "lo"
removal_sensitive = true
ambiguity = "deleting a call is inlining and adding one is outlining; a large residual over-credits the first and a small one the second, so the pinned point favours neither and decision 1604's ∀ sweep decides"
tier = "T5"
source = "unpriced: the SOG prices `BL` (1 cycle, ports I+B) and nothing beyond it. Bracket is an engineering bound: 0 to 16 cycles of callee-side prologue/epilogue and drain"
