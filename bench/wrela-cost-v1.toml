# bench/wrela-cost-v1.toml — SUPERSEDED (plans/M20.md item A, 2026-07-29).
#
# Coarse ISA op-class latencies + dual-port / mem-reuse knobs, schema
# version=2 (no `issue_width`). Rank direction only, never host wall time.
#
# This file is **superseded by `bench/a76-pi5.toml`** and is **deleted in
# plans/M20.md item D**, the item that writes its replacement. The decision
# item A was asked to make, made here: two tables are two sources of truth,
# so there is never a moment where both exist — and deleting this one now,
# before D lands, would leave the tree unable to score at all. So it stays,
# marked, for exactly as long as it is the only table there is.
#
# Its rows are the pre-M20 model: 2 ALU / 2 mem ports against a real A76's
# 3 integer pipes, 2 AGUs, and 8-wide dispatch; `branch_penalty = 0`
# because the model had no predictor; no geometry at all. Every one of
# those is a thing item D through item I replace with a published-record
# row carrying its provenance tier.

version = 2

[ports]
alu = 2
mem = 2
max_issue_per_cycle = 2
# Fetch-redirect only — NOT a mispredict penalty. The model has no branch
# predictor and can never argue a branch is mispredicted, so charging
# mispredict cost here would over-credit *removing* a branch: it would
# make if-conversion (b.cond -> csel) look like a multi-cycle win, when on
# a predicted branch the real machine is unchanged at best and worse at
# hand (both arms always execute, serialized on NZCV). Proxy soundness
# (04 §5) says under-credit when unsure, so the credit for deleting a
# branch is `latency.branch` alone. The knob itself stays live and is
# exercised at a nonzero value by `score::tests::branch_pays_penalty`.
branch_penalty = 0
# Count of recent Load/Store ops in this fn — NOT bytes of cache.
mem_reuse_window = 8
# Distinct keys tolerated in the window before working_set_surcharge.
mem_working_set_cap = 4

# CostRule key → latency in proxy-cycles (u64). Every CostRule::ALL key
# must be present; the parser rejects missing keys. Load/Store leftovers
# are untagged-mem fallbacks (scorer treats missing MemRef as cold miss /
# store_cold).
[latency]
alu = 1
load = 12
store = 2
branch = 1
call = 4
abort = 1
abort_val = 3
mov_wide = 1
mul = 3
sdiv = 12
udiv = 12
adrp = 1
barrier = 1
system = 1
neon = 1

[mem]
load_stack_hit = 1
load_stack_miss = 4
load_cold_hit = 4
load_cold_miss = 12
store_stack = 1
store_cold = 2
# Charged per distinct key **over** mem_working_set_cap, not once flat: a
# flat charge prices 5 live addresses the same as 500, which under-costs
# footprint growth — the one direction 04 §5 forbids.
working_set_surcharge = 2
