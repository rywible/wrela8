# Locked bench thresholds (ROADMAP.md "cleverness budget": a threshold is
# a regression *lock*, not a performance target). Each is set once, by
# measuring on a real machine and rounding up generously — 10x the
# measured median — so the lock catches an algorithmic blowup (e.g. an
# accidental O(n^2) creeping into the lexer or parser) and never a false
# alarm from ordinary machine noise (thermal throttling, a busy laptop,
# a slower CI box). If the corpus grows enormously and legitimately needs
# more time, re-measure and re-lock deliberately, in its own commit, citing
# why — never widen this file to make a regression quietly pass.

[compiler]
# `cargo xtask bench compiler`: median wall time (microseconds) for one
# full pass — lex, then parse where the corpus rules call for it — over
# every doc/example corpus entry plus every tests/golden/*/input.wr (58
# entries as of this lock). Measured median on the locking machine, across
# several runs of 15 timed iterations each: ~5.5-5.7ms (5500-5700us). This
# threshold is 10x that, rounded up to a clean number — loose on purpose,
# so it catches an algorithmic blowup (e.g. an accidental O(n^2)) and never
# a false alarm from ordinary machine noise.
# Re-measured and re-locked at plans/M8.md item C1 (2026-07-25), for the
# identical reason (and by the identical methodology) as
# `check_golden_median_us`' own M6-A re-lock below: the corpus's legitimate
# growth across every milestone since the original 58-entry lock — 423
# entries now, of which item C1 itself added two (`boot-cross-core`,
# `err-placement-cross-core-send`) — had pushed the debug-build median past
# a threshold that was never re-measured as the corpus grew. Before/after
# on this machine, several runs of 15 timed iterations each: 421 entries
# median 52860us; 423 entries median 55954us, and 61360-62122us when the
# machine is already hot from the full `xtask check` run that precedes this
# lane (which is how it is always measured in the gate). Nothing in item C1
# touches the lexer or parser, which is all this lane times.
#
# Known, still-open methodology risk (GOAL.md's own "the compiler-lane locks
# are losing resolution"): a whole-corpus *absolute* lock dilutes every time
# a golden is added, so a real per-entry regression can hide inside corpus
# growth. The fix is to lock microseconds *per entry*; that is a methodology
# change and gets its own commit, deliberately not smuggled into this one.
full_corpus_median_us = 600000

# `cargo xtask bench compiler`'s check lane (plans/M2.md item I): median
# wall time (microseconds) for one full pass of lex+parse+`sema::check`
# over every tests/golden/*/input.wr that lexes and parses (both
# sema-success and sema-error outcomes are timed and counted; the golden
# inputs that are themselves lex/parse errors are excluded — see
# `bench_check_entries` in crates/xtask/src/main.rs; 154 entries as of
# this re-lock). Re-measured and re-locked at plans/M6.md item A
# (2026-07-24): the corpus's own legitimate growth across every milestone
# since the original 25-entry lock (now 154 check-lane entries — this
# item alone added 14: five `check-actor-*`/`check-group`/`check-deadline`/
# `check-await-self-path` accept goldens plus nine `err-*` async/actor
# rejection cases) pushed the debug-build median right to the edge of the
# old 40000us lock on this machine (several runs measured 39200-40400us,
# occasionally tripping it — ordinary corpus-size growth, not an
# algorithmic blowup: `cargo xtask bench compiler` itself, release-mode,
# stays comfortably under 13000us for the identical corpus). Per this
# file's own header ("if the corpus grows enormously and legitimately
# needs more time, re-measure and re-lock deliberately, in its own
# commit, citing why"): re-measured median on this machine, several runs
# of 15 timed iterations each: ~39.2-40.3ms (39200-40300us). This
# threshold is 10x that, rounded up to a clean number — same rationale as
# full_corpus_median_us above.
check_golden_median_us = 400000

# `cargo xtask bench compiler`'s eval lane (plans/M3.md item F): median
# wall time (microseconds) for one full pass of lex+parse+
# `sema::check_typed`+`eval::run_tests` over every test-bearing golden
# (the `check-tests-*` cases with a pinned `expected/test.txt` — 3 entries
# as of this lock — see `bench_eval_entries` in
# crates/xtask/src/main.rs). Measured median on the locking machine,
# across several runs of 15 timed iterations each: ~10.0-10.4ms
# (10000-10400us) — most of that cost is `check-tests-program`'s own
# iterative `fib`/`gcd` loops and `check-tests-arith`'s boundary-arithmetic
# suite, both running well inside their 20_000-step quota
# (comptime.eval.quotas) but still real evaluator work, unlike the check
# lane's mostly-static const/assert-only golden mix. This threshold is
# 10x that, rounded up to a clean number — same rationale as
# full_corpus_median_us/check_golden_median_us above.
eval_tests_median_us = 120000

[build]
# `cargo xtask bench build` (plans/M4.md item E): median wall time
# (microseconds) for one full pass of the whole build pipeline — loader
# (or the single-file fork) -> sema (`check_typed`/`check_program_typed`)
# -> `eval::interp::eval_image` -> `eval::image_checks::check_sealed` ->
# `report::render` — over the M4 example appliance (`tests/golden/appliance`,
# via `produce_report_text`, no file writes). Measured median on the
# locking machine, across several runs of 15 timed iterations each:
# ~1.6-1.8ms (1600-1800us). This threshold is 10x that, rounded up to a
# clean number — same rationale as the `[compiler]` thresholds above: loose
# on purpose, so it catches an algorithmic blowup (e.g. an accidental
# O(n^2) creeping into the loader, sema, or `@image` evaluation) and never
# a false alarm from ordinary machine noise.
build_appliance_median_us = 20000

[guest]
# `cargo xtask bench guest` (plans/M5.md item F, decision 14): median
# wall time (microseconds) for one boot of `tests/golden/boot-hello`'s
# own `@test(runtime)` image via the codesigned `wrela-vmm` binary (2
# warmup + 5 timed iterations — fewer than the compiler lanes' 3+15,
# since each iteration is a real `hv_vm_create`/1 GiB zeroed allocation/
# `hv_vm_map`/vCPU run/`hv_vm_destroy` cycle, not an in-process function
# call — see `bench_guest_lane` in crates/xtask/src/main.rs). Measured
# median on the locking machine (macOS/Apple Silicon, Hypervisor.
# framework): ~50-52ms (50000-52000us) across several runs of 5 timed
# iterations each — almost entirely `hv_vm_create`/the 1 GiB
# `alloc_zeroed`/`hv_vm_map`/`hv_vcpu_create`/`hv_vm_destroy` overhead,
# not the guest's own handful of instructions. This threshold is 10x that,
# rounded up to a clean number — same rationale as every other locked
# bench threshold in this file: loose on purpose, so it catches a real
# regression in the boot path (an accidental extra allocation, a VMM
# loop doing needless work per exit) and never a false alarm from
# ordinary machine noise. `bench guest` also asserts, across all 5 timed
# boots, byte-identical transcripts and identical exit codes/vCPU exit
# counts (decision 14's own "exact replay counts" half) — a threshold
# alone would miss a nondeterminism regression that happened to stay
# fast.
boot_hello_median_us = 600000
