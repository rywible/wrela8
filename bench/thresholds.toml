# Locked bench thresholds (ROADMAP.md "cleverness budget": a threshold is
# a regression *lock*, not a performance target). Each is set once, by
# measuring on a real machine and rounding up generously — 10x the
# measured median — so the lock catches an algorithmic blowup (e.g. an
# accidental O(n^2) creeping into the lexer or parser) and never a false
# alarm from ordinary machine noise (thermal throttling, a busy laptop,
# a slower CI box). If the corpus grows enormously and legitimately needs
# more time, re-measure and re-lock deliberately, in its own commit, citing
# why — never widen this file to make a regression quietly pass.
#
# METHODOLOGY CHANGE, 2026-07-25 (GOAL.md, "the compiler-lane locks are
# losing resolution"). The three `[compiler]` lanes time a *corpus*, and
# they used to lock the whole-corpus absolute median. That dilutes on
# every added golden: `check_golden_median_us` had already been re-locked
# 40000 -> 400000 while the corpus grew 25 -> 154 entries, and by today's
# 361 entries the measured median sat at 122ms against a 400ms lock — so a
# per-entry regression of nearly 3x could have landed without tripping
# anything. Those three keys are now **microseconds per entry**, which is
# corpus-size invariant: adding goldens does not move the number at all,
# and a lane that gets 2x slower per entry trips the lock whatever the
# corpus size. The lane's own absolute min/median/max is still printed
# every run, so nothing about the measurement became less visible.
#
# `[build]` and `[guest]` keep absolute locks on purpose: each times one
# fixed workload (the example appliance; one `boot-actors` boot), so there
# is no corpus to divide by and nothing to dilute.

[compiler]
# `cargo xtask bench compiler`: median wall time **per corpus entry**
# (microseconds) for one full pass — lex, then parse where the corpus
# rules call for it — over every doc/example corpus entry plus every
# tests/golden/*/input.wr (421 entries as of this lock; the count is no
# longer load-bearing, which is the point of the change).
#
# Before/after for the methodology change: the old lock was
# `full_corpus_median_us = 60000`, set at 58 entries against a measured
# ~5.5-5.7ms whole-corpus median. Re-measured today at 421 entries:
# whole-corpus median 38.0-41.2ms, i.e. **90-97us/entry** (the low end
# quiet, the high end with four agent worktrees compiling concurrently).
# This threshold is 10x the quiet measurement, rounded up to a clean
# number — same rationale as before, loose on purpose so it catches an
# algorithmic blowup (an accidental O(n^2)) and never machine noise.
full_corpus_per_entry_us = 1000

# `cargo xtask bench compiler`'s check lane (plans/M2.md item I): median
# wall time **per entry** (microseconds) for one full pass of
# lex+parse+`sema::check` over every tests/golden/*/input.wr that lexes
# and parses (both sema-success and sema-error outcomes are timed and
# counted; the golden inputs that are themselves lex/parse errors are
# excluded — see `bench_check_entries` in crates/xtask/src/main.rs; 361
# entries as of this lock).
#
# This is the lane that motivated the methodology change at the top of
# this file. Its absolute lock was set at 40000 (25 entries), re-locked to
# 400000 at plans/M6.md item A (154 entries), and by today's 361 entries
# the measured whole-corpus median was 121.7-138.9ms — a third of the lock,
# with the slack bought entirely by corpus growth rather than by the code
# getting faster. Per-entry today: **337us quiet, 384us with four agent
# worktrees compiling concurrently**. This threshold is 10x the quiet
# measurement, rounded up to a clean number.
#
# Honest caveat: per-entry is corpus-*size* invariant, not corpus-*content*
# invariant. This lane's own history shows both halves — from the M6-A
# re-lock (154 entries, ~40ms) to today (361 entries, ~122ms) the absolute
# median moved 3x while per-entry moved 260us -> 337us, about 30%, because
# the goldens added since are individually heavier (actor/hardware images,
# not const-and-assert files). So a corpus that grows in *weight* still
# drifts this number, and a drift that large again is worth reading as a
# question rather than as noise. What it can no longer do is hide a real
# per-entry regression behind a bigger denominator.
check_golden_per_entry_us = 4000

# `cargo xtask bench compiler`'s eval lane (plans/M3.md item F): median
# wall time **per entry** (microseconds) for one full pass of lex+parse+
# `sema::check_typed`+`eval::run_tests` over every test-bearing golden
# (the goldens with a pinned `expected/test.txt` — 37 entries as of this
# lock — see `bench_eval_entries` in crates/xtask/src/main.rs). Most of
# the cost is real evaluator work — `check-tests-program`'s iterative
# `fib`/`gcd` loops and `check-tests-arith`'s boundary-arithmetic suite,
# both well inside their 20_000-step quota (comptime.eval.quotas) —
# unlike the check lane's mostly-static const/assert-only golden mix,
# which is why this lane's per-entry number is an order of magnitude
# larger and why it keeps its own key.
#
# Before/after for the methodology change: the old lock was
# `eval_tests_median_us = 120000`, set at 3 entries against a measured
# ~10.0-10.4ms whole-corpus median. Re-measured today at 37 entries:
# whole-corpus median 67.7-83.4ms, i.e. **1829us/entry quiet, 2253us/entry
# with four agent worktrees compiling concurrently**. This threshold is
# 10x the quiet measurement, rounded up to a clean number.
eval_tests_per_entry_us = 20000

[build]
# `cargo xtask bench build` (plans/M4.md item E): median wall time
# (microseconds) for one full pass of the whole build pipeline — loader
# (or the single-file fork) -> sema (`check_typed`/`check_program_typed`)
# -> `eval::interp::eval_image` -> `eval::image_checks::check_sealed` ->
# `report::render` — over the M4 example appliance (`tests/golden/appliance`,
# via `produce_report_text`, no file writes).
#
# Re-locked plans/M10.md item B3: force-rooted `__wrela_fmt_dec` + helpers
# (unrolled digit extract/reverse) enter every runtime-bearing image's
# emit set, including the appliance. Measured median after B3 on the
# locking machine: ~30ms (30490us). Threshold is 10x that, rounded up —
# same rationale as every other lock in this file.
# M11 item H: generic boot_init/secondary + INIT pool grow the appliance
# build median (~454ms measured); lock admits that with headroom.
# M11 item J: enqueue/select as generic wrela + method stubs grow the
# appliance build median (~1377ms measured); lock admits that with headroom.
build_appliance_median_us = 2000000

[guest]
# `cargo xtask bench guest` (plans/M5.md item F, decision 14; workload
# change plans/M10.md decision 661): median wall time (microseconds) for
# one boot of `tests/golden/boot-actors`' own `@test(runtime)` image via
# the codesigned `wrela-vmm` binary (2 warmup + 5 timed iterations —
# fewer than the compiler lanes' 3+15, since each iteration is a real
# `hv_vm_create`/1 GiB zeroed allocation/`hv_vm_map`/vCPU run/
# `hv_vm_destroy` cycle, not an in-process function call — see
# `bench_guest_lane` in crates/xtask/src/main.rs).
#
# Workload change (not a raise of the old key): the previous lock was
# `boot_hello_median_us = 600000` on `tests/golden/boot-hello`, whose
# measured median sat ~50-78ms — almost entirely HVF create/1 GiB
# zeroing/destroy — and which declares **no actors**, so a scheduler
# regression of any size was invisible at any threshold. `boot-actors`
# is the M10 locked guest lane: two actors, mailbox FIFO, await
# park/resume, non-reentrancy (plans/M6.md item F flagship). Absolute
# lock kept — one fixed workload, no corpus to divide by (GOAL.md's
# "lock microseconds per entry" known-risk was the *compiler* lane,
# already done). Exact-count assertions (transcript bytes, exit code,
# exits, choices) still run across every timed boot.
#
# Measured pre-migration baseline on the locking machine (macOS/Apple
# Silicon, Hypervisor.framework), across five runs of 5 timed iterations
# each: medians 66644 / 70885 / 70084 / 67609 / 67287us (min across
# all timed boots 65916us, max 98364us). Quiet measured median ~67ms.
# This threshold is 10x that, rounded up to a clean number — same
# rationale as every other locked bench threshold in this file: loose
# on purpose, so it catches a real algorithmic blowup in the boot /
# scheduler path and never a false alarm from ordinary machine noise.
boot_actors_median_us = 700000
