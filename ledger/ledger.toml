note = "03-hardware.md §8: \"Device **control** values that can influence an index, length, allocation, or bound arrive as `Untrusted[T]` and cannot be used until checked-narrowed: `reported: Untrusted[usize] = completion.written_len` / `written = reported.checked_le(buffer.capacity())?`.\"\n\n**FLIPPED (plans/M7.md item E4 / decision 13 / decision 22).** `IoCompletion[P].written_len` is `Untrusted[usize]` from a real used-ring completion. `golden/boot-blk-roundtrip` runs both `checked_le` outcomes on that live value after a device read: `checked_le(512)` succeeds yielding buffer-facing `512`, and `checked_le(511)` fails (`512 > 511`). Hand-computed sector word `0xC0FFEE00BEEF42A1` is asserted on the payload the model wrote. `golden/err-boot-blk-roundtrip` is the vacuity control (inverted read-back assert). Dump oracles `golden/check-untrusted-narrowing` / `golden/check-iocompletion-type` remain.\n\n**Producer.** Bottom-half `drain` + sync `claim` (decision 22) — not ISR status (G declined that fork) and not a source-visible `Untrusted.mark`.\n\n**Rejected producers, recorded rather than half-built.** A source-visible `Untrusted.mark(v)` / `Untrusted(v)` constructor. An undirected `@layout(mmio)` `.read()` returning `Untrusted[T]` (overturns `golden/err-mmio-undirected-register`)."

[[clause]]
id = "hardware.irq.vector-binding"
doc = "03-hardware.md#6"
