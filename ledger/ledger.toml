  "golden/err-actor-handle-reply",
]
note = """M14 load-bearing rule (2026-07-27): `Actor[T]` handles are `@image`-wiring-only and never rebound — they cannot appear in a message, reply, collection, or mutable place that could replace the image-minted binding (02 \u00a79.1 / \u00a712.1, 05 \u00a72). Enforced by the existing message-shape / call-site refusals already pinned under `actors.messages.value-restrictions`; this clause names the rule as the progress theorem's floor rather than only as a message-legality quirk. Sibling: `image.graph.handle-dag` (mobility + declaration-order DAG)."""

[[clause]]
id = "image.graph.handle-dag"
doc = "02-language.md#12.1"
status = "gap"
note = """M14 load-bearing rule (2026-07-27): construction *and* handle edges form a DAG (02 \u00a712.1 capability cut — deletes \"handle edges may be cyclic\"). The shipped `check_construction_dag` already refuses all decl-reference cycles (see `image.graph.construction-dag`'s honest finding, now the law). The `Actor[T]` mobility class (`!crosses_actor`, `values.classes.computed`) preserves the DAG at runtime. Flip when the M6/M8 forward-reference refusal (`a = img.actor(A, peer=b)` above `b = img.actor(B, peer=a)` \u2192 `error[name]`) graduates from a recorded experiment to a source golden."""

[[clause]]
id = "image.graph.one-image"
doc = "04-compiler.md#1"
status = "test"
tests = ["golden/err-image-none", "golden/err-image-duplicate", "golden/err-image-two-modules"]
note = "plans/M4.md item C grows decision 6's own minimal item-B slice (`image.eval.comptime-context`'s own note) into its full \"zero or more than one is a named diagnostic listing every candidate\" form. Three cases, three mechanisms, unchanged from item B except the third: (1) zero reachable `@image` fns across the whole build closure — `bin/wrela.rs::run_image_stage`'s own `candidates.len() == 0` arm, message unchanged verbatim (`error[build]: no \\`@image\\` fn found in the build closure`, golden/err-image-none — trivially \"lists every candidate\": there are none to list); (2) two `@image` fns in the *same* module — `sema::bodies::check`'s own duplicate guard (unchanged, golden/err-image-duplicate, `error[build]: more than one \\`@image\\` fn in this module (...)`); (3) two (or more) `@image` fns reachable from *different* modules of one build closure — `run_image_stage`'s own `candidates.len() > 1` arm, grown this item from a `.`-joined list to `module.path::fn_name` per candidate (the `::` separator distinguishes the fn name from a dotted module path that may itself contain dots), joined in the `programs` map's own `BTreeMap` order (module path order) — `golden/err-image-two-modules` (a project: `src/main.wr` declares `build_main`, imports `other::MARKER` just to pull `src/other.wr` — which independently declares `build_other` — into the closure; neither module imports the other's `@image` fn itself, only an unrelated `const`, since nothing about reachability requires it) pins `error[build]: more than one \\`@image\\` fn reachable in the build closure (main::build_main, other::build_other)`. This is decided *before* any `@image` fn is ever evaluated (`eval::interp::eval_image` only ever runs once `candidates.len() == 1`), so there is no `ImageGraph` yet for a graph check to run over — `image.graph.construction-dag` and its siblings below are a distinct, later pass."

[[clause]]
id = "image.graph.construction-dag"
doc = "02-language.md#12.1"
status = "test"
tests = ["golden/image-basic", "golden/image-project", "golden/image-helper-accept"]
note = "02-language.md §12.1 (M14 cut): \"Construction and handle edges (moves, initialization order, and every `Actor[T]` wiring) must form a DAG.\" Prior text permitted cyclic handle edges; M14 deleted that permission — the shipped DFS already refused all cycles, and the doc now matches. `eval::image_checks::check_construction_dag` (run first in `check_sealed`'s fixed order, see `image.graph.seal-fully-bound`'s own note) builds the edge set from every device/driver/actor/pool/dma-pool declaration's own recorded arguments (`decl_refs_in_value` recurses into arrays/tuples/structs/enum payloads looking for a nested `Value::ImageDecl`) and rejects a cycle with a fixed-order DFS, printing the cycle in full — one `  <a> -> <b>` line per hop (`extra_lines`). Once evaluated, `decl.handle()`'s own result and a bare decl-reference argument are the identical `Value::ImageDecl` (`ImageDecl.handle`'s own eval arm is a pure passthrough of its receiver — `eval/interp.rs`'s own doc comment) — so every decl-reference argument is a construction/handle edge under the cut. A local can only ever be assigned from an *earlier* declaration's own return value (straight-line evaluation, program order), so every `ImageDeclRef` any later declaration's arguments can possibly name already exists earlier in that same graph's own construction order. A real, source-evaluated `ImageGraph` can therefore never actually contain a cycle. The check is real, dumb, correct code, and is exercised failing on two hand-built `ImageGraph`s in `eval/image_checks.rs`'s own `#[cfg(test)]` module (`a_hand_built_cycle_is_rejected`; `a_real_graph_with_only_backward_references_is_always_acyclic`). Every accept golden (`golden/image-basic`, `golden/image-project`, `golden/image-helper-accept`) runs this check as part of `check_sealed` and passes. Source-level forward-reference refusal golden: see `image.graph.handle-dag`."

[[clause]]
id = "image.graph.pools-bound-once"
doc = "05-library.md#9"
status = "test"
tests = ["golden/err-image-pool-double-bind", "golden/err-image-pool-unknown", "golden/err-image-pool-unbound"]
note = "05-library.md §9: \"bind the previously unbound pool name `P` exactly once ... binding a name twice, or constructing it as a value, is a build error.\" Three sub-cases, three mechanisms, each already the honest diagnostic for its own layer rather than one invented uniform message: (1) binding the same pool name twice — already rejected the instant the second `img.pool`/`img.dma_pool` call runs, at evaluation time (`eval::image::ImageGraph::declare_pool`'s own `Err`, landed with item B and already unit-tested there, `binding_the_same_pool_name_twice_is_rejected`) — the graph can never even be *built* with two entries under the same key, so nothing here needs to re-check it; `golden/err-image-pool-double-bind` (two `img.pool(name=Buffers, ...)` calls) pins the real diagnostic, `error[comptime]: pool \\`Buffers\\` is already bound` (`  while evaluating \\`build\\``); (2) binding a name with no `pool P` declaration at all — already rejected earlier still, at name resolution (`sema::bodies::check_intrinsic_args` only ever recognizes a *declared* pool name as its own `PoolName` leaf; an undeclared one falls through to the ordinary name resolver, which has never heard of it either — a pool name is never in any symbol table, `sema::bodies::build_module_ctx`'s own `module_pools` set is consulted only by this one special case); `golden/err-image-pool-unknown` (`img.pool(name=Ghost, ...)` with no `pool Ghost` declared) pins the real, pre-existing diagnostic this surfaces as, `error[name]: unknown name \\`Ghost\\` at 6:28` — `sema::symbols::resolve`'s own ordinary undeclared-name check, one pass earlier than typing, not a new mechanism this item invented; (3) \"constructing it as a value\" — the same ordinary name-resolution rejection as (2) covers this too (a pool name is never a resolvable value expression anywhere outside the one `name=` position `check_intrinsic_args` special-cases, so using one as a bare value elsewhere is simply an unknown/type-mismatched name, the identical `error[name]`/`error[type]` diagnostic family), so no separate mechanism or golden exists for it; (4) a `pool P` declared in source that is never bound by *any* call before `img.seal()` — the one case genuinely new to this item, since the graph itself only ever records *bound* pools (`ImageGraph::pools`/`dma_pools`) and so has no trace of an unbound one on its own. `TypedProgram::declared_pools` (new field, `sema::bodies::check`'s own copy of `ModuleCtx::module_pools`) carries the `@image` fn's own module's source-declared pool names forward to the post-seal pass; `eval::image_checks::check_pools_bound` (run second in `check_sealed`'s fixed order) names the first one (BTree order) with no bound/dma-bound entry: `golden/err-image-pool-unbound` (`pool Buffers` declared, never bound, `img.seal()` reached anyway) pins `error[build]: pool \\`Buffers\\` is declared but never bound by \\`img.pool\\`/\\`img.dma_pool\\` before \\`img.seal()\\`` — this golden doubles as `image.graph.seal-fully-bound`'s own evidence too (see that clause).\n\n**plans/M7.md item D audit finding.** Case (4) above \u2014 \"a `pool P` declared in source that is never bound by *any* call before `img.seal()`\" \u2014 was only ever checked against the `@image` fn's **own module's** `declared_pools`, while this very note said \"only the declaring module's own `declared_pools` can supply\" it, which is true of every declaring module and not just one. A `pool Q` declared in another module of the build closure, with `own[Q] T` signatures over it and no binding anywhere, passed. 02-language.md \u00a74 is unambiguous \u2014 \"An image pool is bound to a pool name \u2014 a module- or actor-scoped `pool Name` declaration that **the image binds** to exactly one pool node\" \u2014 so `check_sealed` now hands `check_pools_bound` the union of every module's declared pools. Found by item D's clause-honesty audit while tracing which pool names `check_pool_decls` could see; no golden moved, because no existing case declares a pool outside the `@image` fn's own module."

[[clause]]
id = "image.graph.init-args-match"
doc = "05-library.md#9"
status = "test"
tests = [
  "golden/err-image-init-extra-arg",
  "golden/err-image-init-missing-arg",
  "golden/err-image-field-unknown",
  "golden/boot-init-args",
  "golden/err-image-init-fallible",
  "golden/err-image-init-handle-substitution",
  "golden/err-image-init-arg-aggregate",
  "golden/image-basic",
  "golden/image-field-wired-accept",
