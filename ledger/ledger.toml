id = "hardware.queues.id-validation"
doc = "03-hardware.md#4"
status = "test"
tests = ["xtask:repro"]
note = "03-hardware.md §4: \"Completion is keyed by the device-reported ID and validated against generation and epoch; stale, duplicate, or unknown IDs are driver faults, never unchecked indexes.\" plans/M7.md item F reads that rule as binding the *device model* at least as hard as the driver, because this side of the ring is the one holding a raw pointer into guest DRAM. Every ring-shaped input is range-checked before it is ever used as an index, and each rejection is its own named `devices::BlkFault` with its own diagnostic rather than one opaque \"bad ring\" string: `AvailIndexJump` (stale — `avail.idx` advanced further than the queue is deep), `DescriptorIndexOutOfRange` (unknown — an `avail.ring[]` entry or a chain `next` naming a slot that does not exist), `DescriptorChainLoop` (duplicate — a chain revisiting a descriptor, caught by a visited set), `DescriptorChainTooLong` (the same non-termination caught by length, for a chain whose slots are all distinct), `IndirectNotNegotiated`, `ChainTooShort`, `BadRequestHeader`, `BadStatusDescriptor`, `DataDirectionMismatch`, `UnalignedDataLength`, `FlushWithData`. A fault fails the boot closed with a named `VmmError::GuestFault` (\"virtio-blk: ...\"); it is never a panic, never an approximation, and never a silently skipped operation.\n\nDeliberately distinct from an in-protocol **device error**, which is a real completion carrying `STATUS_IOERR` (a sector past the end of the disk, including one whose `sector * 512` overflows) or `STATUS_UNSUPP` (an unknown request type, or `Flush` without `VIRTIO_BLK_F_FLUSH` negotiated): the protocol has its own answer for those, and giving it is not approximating. Generation and epoch validation is **item H2b**'s (03 §9's reset produces the epoch; `golden/err-boot-epoch-stale` is the guest-side StaleId oracle). Named rather than silently claimed by this clause when item F landed.\n\nEvidence: `devices::tests::every_malformed_ring_shape_is_rejected_by_name` walks fourteen malformed shapes (a–n) and asserts the exact `BlkFault` for each; `every_fault_renders_a_distinct_diagnostic` pins that no two faults render the same text. `cargo xtask repro`'s blk lane is the citable end of it (a boot whose every ring word goes through the same checks)."

[[clause]]
id = "hardware.dma.pool-reachability"
doc = "03-hardware.md#3"
status = "test"
tests = ["xtask:repro", "golden/boot-blk-two-devices", "golden/err-boot-blk-cross-device-pool"]
note = "03-hardware.md §3: \"All memory a device can reach originates from its bound pools; targets with an IOMMU map only those pools.\" plans/M7.md decision 5 records what that degenerates to on the flagship (which has no IOMMU): \"the VMM maps exactly the declared pools and nothing else ... it is a *security* property on the flagship: the device model can reach declared pool pages and no other guest memory, enforced by what the VMM maps.\"\n\nItem F enforces it **structurally, not by review**: `devices::GuestMem` is the only thing in the VMM holding both the raw DRAM pointer and the declared pool windows, and every one of its accessors goes through one private `window_offset`, which admits `[addr, addr+len)` only if it lies wholly inside one declared window. There is no other guest-address-to-host-offset conversion in the device model to audit, so a descriptor naming the machine-info page, the image's own code, another actor's state, one byte before a pool, a range straddling a pool's end, an address past DRAM entirely, or an `addr + len` that overflows a `u64` all fail identically as `BlkFault::OutsidePool` — a diagnosable error, never an out-of-bounds read. The *configuration* is checked the same way before any boot: `BlkDevice::new` refuses a descriptor table, available ring, used ring or doorbell word that is not itself inside a declared window, and `GuestMem::new` refuses a window that is empty, outside guest DRAM, or overlapping another.\n\nEvidence: `devices::tests::every_malformed_ring_shape_is_rejected_by_name` case (e) sweeps five out-of-pool descriptor addresses; `a_ring_outside_every_declared_pool_is_refused_before_any_boot`, `no_ring_access_can_escape_the_declared_windows` and `overlapping_or_out_of_dram_pool_windows_are_refused` cover the configuration half; `tests::a_descriptor_outside_every_declared_pool_fails_the_boot_closed_over_hvf` proves it over a **real boot** (the identical conformance image with one descriptor repointed at the machine-info page — the boot fails closed naming the device and the rule, rather than reading a page no pool declares). `cargo xtask repro`'s blk lane boots the well-formed form of that same image.\n\n**plans/M8.md item P (2026-07-25): the sentence is per-device, and until this landed the enforcement was not.** \"*Its* bound pools\" is possessive, and the artifact carrying a window to the VMM said only `BlkPool name= base= size=` — so `parse_report` handed every declared window to the one `BlkDevice`, and two M7 post-closure build-time guards held the property shut by refusing images the language allows (see `hardware.dma.pool-backing`). Now: the line carries `device=device#N`, `PoolWindow` carries `device`, `GuestMem` carries the device whose view it is, and `window_offset` admits a range only if the window containing it is bound to *that* device — the single conversion site, unchanged in that respect. `BlkDevice::new` applies the identical predicate (`window_contains`, which gained the same device argument) to the ring and doorbell before any boot, so a ring placed in another device's pool is a refused *configuration*, not a later fault.\n\nThe two refusals are named apart: `BlkFault::OutsidePool` for a range in no window at all, `BlkFault::ForeignPool` for a range that is inside a real, placed, device-reachable window belonging to someone else — a post-mortem that could not tell those apart could not tell a broken driver from a broken image.\n\n**The oracle is a boot, and a negative one.** `golden/err-boot-blk-cross-device-pool` is a one-declaration twin of `golden/boot-blk-two-devices` (two devices, each with its own `@driver` and DMA pool, blk round trip green): the blk driver's payload pool is bound to device#1 instead of device#0, the image builds — an `own[P] T` payload handle carries no device in its type, and 03 §1's mint rule constrains the `DmaPool[P, N]` *capability*, not the handle — and the first descriptor the model reads is refused by name, failing the boot closed. Non-vacuity verified by mutation: deleting the `w.device != self.device` arm from `window_offset` turns that boot green (device#0 then reads and writes device#1's pool), and deleting the device term from `window_contains` makes `boot-blk-two-devices`'s own ring check accept a ring in a foreign pool.\n\n**What is deliberately untested, not quietly assumed:** the symmetric direction. 06-machine.md §6's device set is closed and machine v1 models exactly one device, so no access *by* device#1 exists for any boot to refuse. That half is a unit oracle — `devices::tests::a_window_bound_to_another_device_is_refused_by_name` builds both devices' views over one window list and checks each admits its own and refuses the other — and becomes bootable only when a second device model exists — which no rung of the ladder now schedules (ROADMAP's recorded intentions, 2026-07-25: display and input left the ladder; `net`/`sound`/`entropy` never had a rung), so this half stays a unit oracle until a human schedules a second device.\n\n**plans/M10.md decision 700 (2026-07-26): `ForeignPool` names a pool-relative offset, not an absolute guest address.** The diagnostic used to open `guest range [0x405042e0, +512)`, and that absolute address made this transcript — the only one in the whole 857-expectation corpus quoting one — a hostage to every layout change that moves a section ahead of `pooldata`: M10 item 0a's uniform turn stride alone shifted it. The address also carried no information, since the image report already states every pool's base. The variant now carries `offset` (`addr - w.base`, computed at the one conversion site) and the line reads `guest range [offset 0x0, +512) lies in pool `BlockPayloads`, ...` — stable under relayout, and the fact that actually localizes the access: `0x0` because the driver's only payload is that one-slot pool's only slot, so the refused range is the whole pool. Nothing else in the diagnostic moved (pool name, both device numbers, the length, the 03 §3 citation). `devices::tests::a_window_bound_to_another_device_is_refused_by_name` gained an assertion that a range eight bytes into the foreign window reports `offset: 8`, so pool-relativity is pinned by a unit oracle and not only by the transcript. `BlkFault::OutsidePool` keeps its absolute address deliberately — a range in no window has no pool to be relative to."

[[clause]]
id = "hardware.doorbell.no-trap"
doc = "06-machine.md#5"
status = "test"
tests = ["xtask:repro"]
note = "06-machine.md §5: \"Hot paths never trap ... guest→host notification is a shared-memory doorbell word per queue plus one host-visible wake; the VMM's I/O threads poll hot doorbells on their own host cores and arm wakes when idle.\" plans/M7.md item F wires exactly that and nothing more: `BlkQueueConfig::doorbell` is an ordinary guest-writable DRAM word inside a declared pool, the guest's store to it takes **no exit at all**, and `crate::service_blk` polls it from `boot_image_core`'s own loop.\n\nTwo poll sites, both deliberate: (1) the top of every exit-loop iteration — the dumbest correct placement, and the one that needs no synchronization with a running vCPU (there is one host thread here; 06 §5's dedicated I/O threads are a later performance question, and buying them now would need the profile the cleverness budget requires); (2) the park path, *before* the sleep decision — which is what makes a doorbell rung immediately before a park impossible to lose. A completion serviced there suppresses the sleep entirely (the same mask–arm–recheck discipline 06 §4 already requires for vectors, applied to completions) and, if the report declares a vector, raises it by setting one bit in core 0's own pending word. A device declared with no `vector=` is 03 §7's poll build: nothing is raised, and the used ring alone is the completion signal.\n\nOne pre-existing behaviour changed with this: the park path's own vector-0 raise was a plain store of `1` into the pending word, which is only safe while there is exactly one raiser. M7 gives the machine a second (a completion), so both now go through `crate::raise_vector`, an **OR** — a store would silently drop a completion vector raised moments earlier in the same park. `tests::park_conformance_wakes_at_the_deadline_and_resumes_over_hvf` still passes unchanged (a park with nothing else pending ORs bit 0 into a zero word, which is the same `1` it always was).\n\nEvidence: `cargo xtask repro`'s blk lane and `tests::blk_doorbell_write_then_read_completes_over_hvf` both assert, over a real boot, that the guest's pending word ends up holding **only** the blk vector bit and that the recorded choice sequence contains no `DeadlineWake` at all — which is what proves the completion genuinely suppressed the park's sleep rather than racing it."

[[clause]]
id = "hardware.features.negotiated"
doc = "03-hardware.md#9"
status = "test"
tests = ["xtask:repro", "golden/boot-device-bringup", "golden/err-device-negotiate", "golden/err-device-required-unoffered"]
note = "03-hardware.md §9: \"The image declares required features (`img.device`, 05 §9); boot still negotiates the real device.\" plans/M7.md decision 2 names feature negotiation as one of the three things that survive this machine's deletion of most of virtio. Item F implements the device half: `devices::negotiate` takes the feature set the image declares (carried to the VMM as the report's own `BlkDevice features=` field) and either returns the accepted set or refuses it by name — never a silent intersection, because a driver that believes it negotiated `Flush` and did not is precisely the bug the refusal exists to prevent. Two rules: no bit outside `DEVICE_FEATURES` (`VIRTIO_F_VERSION_1 | VIRTIO_BLK_F_FLUSH`) may be accepted, and `VIRTIO_F_VERSION_1` is mandatory (this machine has no legacy virtio transport to fall back to — it has no transport at all, 06 §3). A refusal happens at `BlkDevice::new`, before the vCPU ever runs, and fails the boot closed as `VmmError::BadImage`.\n\n**plans/M7.md item E1 / decision 14 — the guest half is now a build-time fact.** Both sides of the negotiation are build outputs (`img.device`'s `required_features=` vs `virtqueue::DEVICE_FEATURES`, which matches `devices::DEVICE_FEATURES` byte-for-byte), so an unofferable required feature fails the *build* (`eval::image_checks::check_blk_device_decls` / `virtqueue::accepted_features`) naming the feature and both sides' sets — never at runtime, and never silently narrowed. The guest's `negotiate(required=..., optional=...)` is a pure authority transition that always yields `Ok(FeaturesAcceptedDevice[D])` (06 §3: \"cold boot is a design property: there is nothing to negotiate\"). Rejected alternative (decision 14b): a declared window carrying the accepted set for a guest handshake — a runtime act this machine has no other use for.\n\nEvidence (device half, unchanged): `devices::tests::negotiation_accepts_the_offered_set_and_refuses_anything_else`, `a_device_declared_with_an_unoffered_feature_fails_construction_closed`, and `flush_completes_ok_when_negotiated_and_unsupported_when_not`; `cargo xtask repro`'s blk lane declares the full offered set and boots on it. Evidence (guest half, E1): `golden/boot-device-bringup` walks `negotiate` to `Running` over HVF; `golden/err-device-negotiate` pins the call-site shape (`required=`/`optional=` are feature lists)."

[[clause]]
id = "hardware.completions.recorded"
doc = "06-machine.md#8"
status = "test"
tests = ["xtask:repro"]
note = "06-machine.md §8: the VMM \"logs every device completion and DMA-written byte range ... and digests of every output (block writes, ...)\"; plans/M7.md decision 7: \"M6 shipped the `ChoiceEntry` format with `ClockRead`/`DeadlineWake`/`VectorRaise`/`Admission`; M7 adds the completion choice.\" (Filed under `hardware.*` with the rest of item F's clauses, per the item's own instruction, even though its normative sentence lives in chapter 06 — the `doc` field is what points at the normative text, and it does.)\n\nThe entry: `DeviceCompletion device=<name> queue=<n> head=<n> status=<n> len=<n> digest=<hex>` — `head` is the chain head, which is virtio's operation identity and the `id` the used ring reports; `status`/`len` are what the guest observes; `digest` (`record::digest_hex`, FNV-1a) fingerprints **every byte the operation wrote**, in write order: guest-memory writes first (read payload, then the status byte), then disk writes (a write request's own payload). One digest per completion covers both halves of §8's sentence — the DMA-written range and the block-write output — without putting payload bytes in the log. `record::tests::choice_log_format_is_pinned_including_every_tag` pins the text format with the new tag in it.\n\nThe record/replay split is the subtle part, and it is spelled out on `crate::service_blk` rather than left implicit: (1) the **model always runs**, in both modes — a completion is not a value the VMM invents, it is a deterministic function of the ring the guest published and the disk the VMM owns, and the payload bytes have to reach guest memory for a replayed guest to see anything at all (06 §8's \"replay feeds the log from virtual device models\" is exactly this: the models are still there); (2) the used-ring `len` and the status the driver branches on come **from the log** under replay, never from the fresh model run; (3) the `head` always comes from the **model**, never the log, because a chain's head is an identity the *guest itself* published in `avail.ring` — feeding it from an untrusted log would be precisely the unchecked index 03 §4 forbids; (4) any disagreement between the two is `Divergence::DeviceCompletionMismatch`, named with both entries, never silently taken. `Chooser::note_divergence` exists for exactly this one case — `choose_next` can only ever compare *tags* (a replayed clock value is *supposed* to differ from the host clock), and a device completion is the one choice whose value the machine can independently recompute.\n\nEvidence: `cargo xtask repro`'s own `repro_blk_completion_replay` records a real two-operation blk boot, replays it byte-stable, then flips one recorded completion's status from OK to IOERR and requires the replay to exit `EXIT_REPLAY_DIVERGENCE` (3) with `device completion mismatch` on stderr — the milestone's own exit criterion \"record → replay clean → tamper a device-completion choice → divergence\", reachable now with a hand-assembled driver in place of the compiled one items A–E/G/H will bring. `tests::blk_completions_record_and_replay_and_every_tamper_diverges` tampers all five fields (device, head, status, len, digest) individually and requires each to be caught."

[[clause]]
id = "hardware.mmio.typed-access"
doc = "03-hardware.md#2"
status = "test"
tests = [
  "golden/check-mmio-access",
  "golden/err-mmio-read-writeonly",
  "golden/err-mmio-write-readonly",
  "golden/err-mmio-unknown-register",
  "golden/err-mmio-register-not-a-value",
  "golden/err-mmio-undirected-register",
  "golden/err-mmio-endian-big",
  "golden/check-device-claim",
  "golden/boot-device-claim",
]
note = "plans/M7.md item C, 03-hardware.md §2's access rules: \"Raw integer-address MMIO does not exist in the safe language ... The compiler and target ABI check width, alignment, non-overlap, bounds, and endianness ... MMIO access is volatile and effectful: never elided, merged, or reordered across target I/O boundaries.\"\n\n**The surface is exactly two operations, and they are the docs' own.** `<mmio>.<register>.read()` and `<mmio>.<register>.write(v)`, over a declared field of the `@layout(mmio)` type an `Mmio[L]` names — §2's worked example verbatim, and `docs/language/examples/virtio-storage.wr`'s own `on_queue_irq` (lines 145/149) spelled identically. `sema::bodies::check_call_by_field` intercepts the shape before its receiver is typed as a value, because a register *selection* has no value form at all (`golden/err-mmio-register-not-a-value`): there is no way to bind, copy, pass, store or return a register, so a load exists exactly where the source wrote `.read()`.\n\n**Everything about the access comes from the declaration.** Direction is the register's own `ReadOnly[T]`/`WriteOnly[T]` (`golden/err-mmio-read-writeonly`, `golden/err-mmio-write-readonly`); an `mmio` field written as a bare scalar has *no* direction and therefore neither operation, rather than a permissive default (`golden/err-mmio-undirected-register`). Width is `T`: `read()`'s result type and `write(v)`'s argument type are the declared scalar, handed to `check_expr` as the expected type, so an integer literal takes the register's own width and every mismatch gets the ordinary `expected `u32`, found `u64`` rejection — `golden/check-mmio-access` carries a `u32` and a `u16` register in one driver so a single fixed width cannot pass both lines. Offsets/alignment/bounds are `check_layouts`' already-checked table (`hardware.layout.exact-bytes`), so there is no second bounds rule; naming a register the layout does not declare is `golden/err-mmio-unknown-register`, and the diagnostic lists what it does declare.\n\n**Endianness is checked against the target ABI, not merely recorded.** The wrela machine is little-endian A76 (06-machine.md §2), so an access to a `@layout(mmio, endian=big)` register would need a byte swap this compiler does not emit — it fails closed, naming the disagreement (`golden/err-mmio-endian-big`). The layout itself stays legal; it is the access on this target that does not exist.\n\n**Volatility: exactly what is guaranteed today, and by what mechanism.** No optimizer barrier was implemented, and none is claimed. What holds is structural, in two parts. (1) *Position*: a register has no value form, so there is no expression a compiler could hoist, sink, or common-subexpression — an access is a statement-level effect written where the author wrote it, and reading the same register twice is two `Mmio.read` nodes. (2) *Preservation*: `compiler.codegen.naive-locked` is this backend's own locked property — no liveness analysis, no register reuse across instructions, no peephole, no scheduling — so nothing downstream elides, merges or reorders anything, MMIO or otherwise. That is a real guarantee and a weak one: it holds because the backend is dumb, not because an access is marked. The day the cleverness budget buys an optimization pass, that pass must learn about these two node kinds, and this paragraph is the record that it has not had to yet.\n\n**The access reaches the backend once the sealed transport mints an `Mmio[L]`.** Item C typed and shape-checked the operations; item H1 is what gives them a base. `lower.rs` emits `Inst::MmioRead`/`Inst::MmioWrite` carrying the register's declared offset and width (`golden/check-device-claim/expected/mwir.txt`: `MmioRead ... offset=0x60 ty=u32`, `MmioWrite ... offset=0x100 ty=u16`), and `codegen` turns those into `ldr w`/`str w`/`ldrh`/`strh` of that width (`golden/check-device-claim/expected/asm.txt`). The mint itself is the transport's `claim`/`map_partition` (`hardware.transport.bring-up`); an `Mmio[L]` `init` parameter stays permanently refused (`golden/err-cap-mint-unminted`) because the field is where a partition lives, not a binding argument. The async half of the same keys still fails closed by name in `flowwir_lower` — an ISR or bottom-half access is plans/M7.md item G, and inventing a synchronous load there would be the wrong answer. The emitted half's own volatility claim is `hardware.mmio.volatile`.\n\n**The typed node** is `TypedExprKind::Intrinsic { key: \"Mmio.read\" | \"Mmio.write\" }` — the same vehicle `now`/`ms`/`Group.start`/the `@image` builder already use — with the `Mmio[L]` as receiver, the register's scalar as `type_arg`, and the register's name (plus, for a write, the value) as labeled args. `golden/check-mmio-access/expected/typed.txt` pins it, `type_arg` included. `eval::legal` gains an arm in *both* of its scans: a hardware touch for provenance, named by the operation rather than by the type it held (`legal::tests::an_mmio_access_is_a_hardware_touch_named_by_its_operation` — the reason text is what changes, since the receiver's own type marks the fn either way), and a comptime-illegal operation for legality (02-language.md §12: \"free of I/O ... and hardware effects\").\n\n**Self-audit, and what it found.** Method, in three passes. (1) Every branch this item added was enumerated from the diff and matched to a test that reaches it; anything unmatched was probed directly against the built compiler to decide whether it is reachable at all. (2) Every *accept* was perturbed to confirm it is load-bearing — nine perturbations of `golden/check-mmio-access` (both register names swapped, both directions inverted, the `u16` register widened, the write value narrowed, the two partitions moved on top of each other, a register misnamed, a register bound as a value, the layout's endianness flipped), every one rejected. (3) The reachable-but-untested arms found in pass 1 were given tests rather than a footnote.\n\nPass 1 found eleven arms with nothing reaching them. Eight were reachable and now have tests: a bare selection of an *unknown* register, `.poke()` on a register, a method on the `Mmio[L]` itself, `read()` with arguments, `write()` with zero and with two arguments, and a labeled `write(value=)` (all in `types::tests::mmio_access_shape_guards`) — plus the one that mattered, the *composite* arms of the claim walk. Three of its eight arms were covered by assumption; probing showed all eight are source-reachable (`Option`, an array, a tuple, `Result`, `Static`, `fn(..) -> ..`, `own[P] ..`, and a plain wrapper struct each put a live layout on a driver), and `types::tests::the_claim_walk_reaches_a_layout_through_every_composite` now names every one. `types::tests::a_struct_with_no_claim_partitions_nothing` covers the remaining reachable arm, the non-`@driver` skip, which is otherwise an invisible absence.\n\nThree findings stand as genuinely unreachable, recorded rather than papered over. (a) A post-hoc `types_eq` width guard was written and then **deleted**: no expression reaches it, because `check_expr` with an expected type has already rejected every mismatch, `never` included. (b) The comptime-illegal arm is **unreachable from source today** — reaching an MMIO access from a `const`/`comptime assert`/`@test` needs an `Mmio[L]` *value*, and nothing produces one — so it is pinned at `classify` directly (`legal::tests::an_mmio_access_is_comptime_illegal`), not by a golden that would only appear to cover it. (c) Four defensive arms are unreachable through a checked program and stay as named rejections rather than panics, with no test reaching any: `check_mmio_access`'s \"layout is not a declared `@layout(mmio)` type\" and \"no scalar register type\" (`validate_capability_args` and `layout_field_size` respectively already guarantee otherwise), `check_mmio_claims`' skip of a mint whose layout is absent from the `mmio` table (same guarantee), and `access::mmio_access_result`'s `None` returns (it only ever runs on a call `bodies` has already accepted).\n\nOne pre-existing golden moved: `golden/check-capabilities`' `RegsBundle` now wraps a second, disjoint layout (`VirtioConfigMmio` at 0x100) instead of a second copy of `VirtioIrqMmio`. That was not cosmetic — `hardware.mmio.no-alias` genuinely rejects the old shape, since `IrqPartition` held `Mmio[VirtioIrqMmio]` directly *and* through the wrapper, which is two live layouts aliasing every register. The fixture is stronger for it: it is now the accepting case for a partition reached through a wrapper struct."

[[clause]]
id = "hardware.mmio.no-alias"
doc = "03-hardware.md#2"
status = "test"
tests = [
  "golden/err-mmio-alias",
  "golden/err-mmio-alias-enum",
  "golden/check-mmio-access",
  "golden/check-capabilities",
]
note = "plans/M7.md item C's centre, 03-hardware.md §2: \"A driver or sealed protocol partitions its claim into declared, non-overlapping layouts ... Minting a layout consumes those byte ranges from the claim; two live layouts can never alias a register.\"\n\n**Where a claim lives.** A claim is a device's register map, reached through the `DeviceCap[D]` the image binding mints — §1: \"The device itself is named once, at the image binding (`img.driver(BlkDriver, device=blk_device)`), the single source of truth.\" A driver has at most one `DeviceCap` (`eval::image_checks::check_capability_substitution` already enforces that), so **a driver has exactly one claim**, and the claim needs no representation of its own beyond the driver that owns it: what a claim *is* comes from the image, what it is *partitioned into* comes from the driver's own declaration. That split is the whole design, and it is what lets the rule be a `sema` pass (`types::check_mmio_claims`) with no image graph in hand.\n\n**What mints, and what does not.** The partition is the driver's own declared `Mmio[L]`-typed **fields** — those, and nothing else, are what it holds *live* (§2's own word), including through a plain wrapper struct (the same reach `type_contains_capability` gives the containment rules). An `Mmio[L]` **parameter** is deliberately not a mint: it is how an already-minted layout is delivered to `init` or lent to a helper. Reading it as a second mint would make §1's own worked constructor — `take regs: Mmio[L]` assigned to a field of the same layout — self-aliasing, which is nonsense; `types::tests::an_mmio_parameter_delivering_a_field_is_not_a_second_mint` pins that acceptance.\n\n**What a mint consumes: registers, not extent.** A layout consumes exactly its declared field ranges, never its declared holes. §2's own example is the argument: its 0x60 bytes of leading padding belong to the sealed transport's partition, and §2's very next sentence says the transport protocol owns exactly that initialization/queue/status/config region. Consuming the hole would make the driver's ISR partition and the transport's collide by construction — the opposite of what the paragraph describes. `types::tests::a_declared_hole_consumes_nothing_from_the_claim` is that property alone; `golden/check-mmio-access` carries it end to end (a layout at 0x100 alongside one whose hole covers 0x0..0x60).\n\n**The rejection names both halves**, because the rule is about a pair: each field, its declared type, the layout it mints, the specific register each claims, and the exact bytes they share. `golden/err-mmio-alias` is the flagship — §2's own interrupt partition against the sealed transport's `device_status`, both at 0x060 — and it is `golden/check-mmio-access`'s driver with its two partitions moved on top of each other, so the accept and the reject differ by one `@offset`. Partial overlap is caught too, not just exact aliasing (a `u16` register inside a `u32` one), and so is the same layout minted twice under two field names.\n\n**One scope boundary, named rather than discovered later.** Two drivers bound to one device would share a claim, and this pass cannot see that — it is an image-graph question and the graph checks live in `eval::image_checks`. It is inert today for a concrete reason: nothing mints an `Mmio[L]` at a binding at all yet (`check_capability_substitution`'s `Mmio` arm still fails closed by name), so no two drivers can currently reach the same register map. It stops being inert the moment that arm lands, which is where the cross-driver half belongs.\n\n**Item I's sweep (2026-07-24) — the partition was under-counted, so the rule silently had no pair to check.** `collect_mmio_layouts` finds a driver's mints \"at any nesting, including through a plain wrapper struct\" — through a struct-only map, so an `Mmio[L]` inside an **enum variant payload** contributed no mint at all. A driver holding `held: Holder` (`enum Holder: Mapped(Mmio[VirtioIrqMmio]) | Unmapped(u32)`) plus a second, genuinely overlapping `Mmio[L]` field saw exactly one mint, formed no pair, and compiled clean with both layouts claiming 0x60..0x64 — `golden/err-mmio-alias` with one wrapper added, now pinned as `golden/err-mmio-alias-enum` (the diagnostic names the *field* carrying the wrapper, which is what a reader has to change). Same root cause and same fix as `hardware.capabilities.unforgeable`'s own item-I note: one `components_by_name` table over structs and enums alike. Also checked and genuinely held: two fields of the *same* `Mmio[L]` type (caught — self-overlap is still a pair), two mints inside one field's tuple (caught), and a cross-module `Mmio[L]` (unreachable — this compiler resolves no type name across modules at all, so a driver's partition cannot span the closure, which is what this pass's own per-module scope already assumed)."

