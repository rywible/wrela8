note = """05-library.md §9 (plans/M13.md item F / decision 3): `img.on_failure(policy=...)` exactly once per image — required-explicit, no default. `eval::image_checks::check_failure_policy` (run last in `check_sealed`'s structural block) rejects zero (`golden/err-image-no-failure-policy`: image has no `img.on_failure(policy=...)` failure policy) and more than one (`golden/err-image-two-failure-policies`: image declares `img.on_failure` more than once). Per-actor supervision (`img.supervise`, restart provisions, intensity, the `Restart` enum) is cut; policy is `Failure.Reboot` | `Failure.Halt`. Conformance goldens pin `Failure.Halt` until the durable-checkpoint idiom exists."""


[[clause]]
id = "image.graph.seal-fully-bound"
doc = "05-library.md#9"
status = "test"
tests = ["golden/err-image-pool-unbound", "golden/image-basic", "golden/image-project", "golden/image-helper-accept"]
note = "05-library.md §9: \"`img.seal()` consumes the builder and succeeds only when every declaration is fully bound.\" Decision recorded at item C execution (the plan's own \"pick one, document it\" instruction): this is a **post-evaluation pass**, not a per-intrinsic seal-time gate — `eval::image_checks::check_sealed` runs once, in `bin/wrela.rs::run_image_stage`, immediately after `eval::interp::eval_image` already returns a sealed `ImageGraph` (`graph.sealed` is always `true` by this point — an unsealed return is already its own distinct, pre-existing `error[comptime]` from `eval_image` itself, `image.eval.comptime-context`'s own `golden/err-image-unsealed`, and never reaches this pass at all) and before the graph is ever printed by `--stage=image`'s own dump. `check_sealed` *is* \"every declaration is fully bound\", not a separate mechanism layered on top of the others: it runs `check_construction_dag`, then `check_pools_bound`, then `check_init_args`, then `check_failure_policy`, in that fixed order, first failure wins (documented in `eval/image_checks.rs`'s own module doc comment, with the rationale for the order: DAG-shape is checked first since it needs no idea what a declaration *is*, only what it references; pool binding next since an init argument may reference a pool-backed handle, so it is a precondition for init-argument matching to mean anything; init-argument matching next, the deepest per-declaration check; failure policy last, since it says nothing about a declaration's own construction, only that the finished image named its abandonment response). `golden/err-image-pool-unbound` doubles as this clause's own seal-shape evidence exactly as the plan anticipated (an otherwise well-formed `@image` fn that reaches `img.seal()` with a source-declared `pool` never bound — `check_pools_bound`'s own rejection, `image.graph.pools-bound-once`'s clause covers the mechanism in full); no distinct seal-shape beyond that emerged. Every accept golden (`golden/image-basic`, `golden/image-project`, `golden/image-helper-accept`) is the positive witness: each reaches `img.seal()` and prints its full dump only because all four checks passed in this fixed order."

[[clause]]
id = "image.graph.dma-pools"
doc = "05-library.md#9"
status = "test"
tests = ["golden/check-dma-pool", "golden/err-dma-pool-payload-not-layout", "golden/err-dma-pool-payload-wrong-kind", "golden/err-dma-pool-no-device", "golden/err-dma-pool-device-not-a-device", "golden/err-pool-bound-twice-forms", "golden/err-pool-backing-too-large"]
note = "**Flipped gap -> test at plans/M7.md item D** (a milestone exit criterion: \"M4 checked the graph; M7 makes a pool real\"). What follows is the M4 record, kept verbatim because it is what the flip is measured against, then what item D actually built.\n\nM4 record. decision 10 (plans/M4.md): `img.dma_pool`'s `@layout(dma)` requirement is not validated until the hardware milestone, so `img.dma_pool` fails the whole build closed the instant it is called, naming this gap explicitly, rather than ever asserting against nothing (`eval::image::ImageGraph::declare_dma_pool`, landed with item B) — `golden/err-image-dma-pool` is the fail-closed witness (`error[comptime]: \\`img.dma_pool(name=Payloads, ...)\\` is recorded, but DMA pools are not implemented until the hardware milestone: \\`@layout(dma)\\` validation does not exist yet (gap \\`image.graph.dma-pools\\`)`). Because of this, `eval::image::ImageGraph::dma_pools` is always empty by the time any item-C graph check ever runs (a successful `@image` evaluation can never have called `img.dma_pool` at all) — none of `image.graph.construction-dag`/`pools-bound-once`/`init-args-match`/`failure-policy`/`seal-fully-bound` needs its own DMA-specific case yet either, and none invents one ahead of the milestone that can prove it (`check_pools_bound` does still consult `graph.dma_pools` defensively when deciding whether a declared pool is bound, so the day this gap closes and a real `dma_pools` entry can exist, that check already accounts for it with no further change). Flips when the hardware milestone lands `@layout(dma)` validation and `img.dma_pool` stops failing closed.\n\nM7 item D. It landed, and `img.dma_pool` stops failing closed. `ImageGraph::declare_dma_pool` is now an ordinary recorder returning an ordinary bound-pool handle; every rule moved to `eval::image_checks::check_pool_decls`, third in `check_sealed`'s fixed order (between pool binding and init-argument matching \u2014 a pool's declaration must be valid before an init argument naming its handle can mean anything, the same reason binding already ran before init matching). `pool_backings` resolves 05-library.md \u00a79's two forms into one `PoolBacking` per bound name, and that single value is what the checker, the placer (`layout::place_pools`) and the report (`layout::render_layout_section`) all read \u2014 one derivation, one place, because a second copy could disagree about *which bytes a device can reach*.\n\nRejections, each a golden: a payload with no `@layout` at all (`err-dma-pool-payload-not-layout` \u2014 `golden/err-image-dma-pool`'s direct successor, same source, real rule instead of the placeholder); a payload that is `@layout(wire)`/`@layout(mmio)` rather than `dma` (`err-dma-pool-payload-wrong-kind`); no `device=` (`err-dma-pool-no-device`); a `device=` naming something that is neither a declared device nor the driver bound to one (`err-dma-pool-device-not-a-device`); the same pool name bound by both forms (`err-pool-bound-twice-forms` \u2014 a case item D itself made *reachable*: before it, each recorder only consulted its own map, which was harmless only because the DMA form failed the build before a second call could run; `ImageGraph::bind_pool_name` is now one predicate over one name space); and backing past the placeable ceiling (`err-pool-backing-too-large`, `MAX_POOL_BYTES`, the same shape as the VMM's own `devices::MAX_DISK_BYTES`). Arms no `@image` fn can currently spell \u2014 a `device=` naming a driver that binds no device of its own, a `device=` naming an undeclared device index, an argument label belonging to the other form, a non-integer or non-positive capacity, a missing capacity \u2014 are real code with real unit tests in `eval/image_checks.rs` and no golden, the same discipline `image.graph.construction-dag`'s own cycle case already follows.\n\n**Clause-honesty audit** (plans/M7.md item D, method: for every arm this note claims, write the `.wr` file that should reach it and run the real compiler \u2014 never read the code for whether the arm exists). Four arms turned out to be reachable from real source with no golden and no unit test of their own, and each gained one: a `device=` that is an ordinary value rather than a declaration reference (`device=1`); an argument label belonging to the *other* pool form; backing whose `slots \u00d7 slot_bytes` does not fit a `u64` at all (caught before the ceiling comparison, which would otherwise be handed a wrapped number); and, on the `DmaPool[P, N]` mint, a bound written as a type rather than a const and a bound too large to read as a `u64`. Two arms are genuinely **unreachable and stay so**, recorded rather than tested into a false claim: `pool_count`'s `u64::try_from` (every value reaching it is already positive and came through an `i128` that a `Value` cannot exceed `u64::MAX` in) and `pool_device`'s driver-index bound check (`ImageGraph::declare_driver` pushes before it returns an index, so no out-of-range `Driver(i)` can exist). Both are kept as real errors anyway, because \"index out of range\" must never be a silent success.\n\n`golden/check-dma-pool` is the accept: one device, one driver, `img.dma_pool[BlkReqHeader](name=BlockControl, device=disk, count=8)` (03-hardware.md \u00a73's own worked `device=<driver>` spelling, resolved one hop through 03 \u00a71's \"the device is named once\"), an `img.pool` beside it, an `own[BlockControl] BlkReqHeader` signature, and the exact-bytes/placement/mapping facts all pinned in one report. `image.report.dma-pools` carries the accounting half; `hardware.dma.ownership-transfer` carries the `own[P] T` half."

[[clause]]
id = "image.report.stable"
doc = "04-compiler.md#7"
status = "test"
tests = ["golden/appliance", "golden/image-basic", "golden/image-project", "golden/image-helper-accept", "golden/check-regions-two-disciplines"]
note = "plans/M4.md item D, decision 8: the image report — `crates/wrela-compiler/src/report.rs` (new crate-root module, plan decision 12's own placement), rendering an already-sealed, already-checked `eval::image::ImageGraph` plus its own build inputs into one stable text artifact, the identical M1 dump style every earlier stage uses (`ImageReport v0` header, `Kind key=value` lines, two-space indent, fixed section order, facts only — a section with nothing to say is absent, never a placeholder). Fixed order (`report.rs`'s own module doc carries the full rationale for each choice): (1) build identity — `Compiler version=<this crate's own `CARGO_PKG_VERSION`>` (never a git SHA or timestamp — decision 8's own \"byte-stable across commits of this repo and across machines\" requirement rules both out), `Target value=...` (the build-affecting fact 04 §7/§8 and 02-language.md §2.1 both name), four `Quota` lines (`eval::quota::MAX_STEPS`/`MAX_MEMORY`/`MAX_CALL_DEPTH`/`MAX_EXHAUSTIVE_CASES` — 02-language.md §2.1's own \"language constants recorded in build identity\"), one `Input path=... sha256=...` line per file in the build closure; (2) the image's own `Name`/`Target` (from `Image(...)` alone, 02-language.md §12.1 — intentionally the same `Target` `Kind` as build identity's own line above, a real duplicate fact from two independent normative requirements, not a placeholder, `report.rs`'s own doc comment explains why both stay); (3) `Device` blocks, args verbatim; (4) `Driver`/`Actor` blocks — every non-handle, non-`mailbox` argument as an `Arg` line, `mailbox` pulled into its own `Mailbox` fact (\"declared mailboxes, recorded as-declared, no derivation\" per decision 8 — M6 does the real derivation); (5) `Edge from=<decl> to=<decl>` — every logical actor edge, one line per handle-valued argument found while walking (3)/(4) (own decision-8 sub-note on direction: `from` is the declaration whose own argument holds the handle, `to` is the declaration the handle names — the direction a later real call edge will take once actor bodies are typed, M6); (6) `Pool` blocks, args verbatim (capacities are just their own recorded args, same reasoning as `Device`); (7) `Supervise` blocks — `strategy`/`intensity` pulled onto the header line itself, `children` expanded into one `Child` line per member; (8) registered layout asserts — **never actually rendered**, see the decision-10 paragraph below. Every `Arg`/`Name`/`Target` line is rendered with `eval::image`'s own `render_value`/`push_line`/`render_bare_value` (bumped from private to `pub(crate)`, zero logic changed) rather than a second rendering mechanism, so the report's own facts are byte-identical in style to the raw `--stage=image` dump wherever the same fact appears in both.\n\nInput digests (decision 9): one hand-rolled SHA-256 (`report::sha256_hex`, ~140 lines, plain `u32` ops, FIPS 180-4, hex-lowercase output) — no new dependency, unit-tested against the two standard public vectors (empty string, `\"abc\"`) in `report.rs`'s own `#[cfg(test)]` module, both passing and cross-checked against Python's `hashlib.sha256` by hand during this item's own execution. A digest's own `path` field is never a real filesystem path: `report::address_to_relative_path` derives it from the module's own dotted closure address (`\"image\"` -> `image.wr`, `\"core.bytes\"` -> `core/bytes.wr`) — exactly the reverse of `loader::module_file_path`'s own forward construction, so the result is package-root-relative *by construction*, never the absolute-or-cwd-relative path actually used to invoke the compiler (which would bake one checkout's own location into a pinned golden, `loader.rs`'s own module doc already discloses the identical failure mode for the missing-module diagnostic). `bin/wrela.rs::run_report_stage` (the new `--stage=report` driver, structurally parallel to `run_image_stage` rather than refactored out from under it — CLAUDE.md: \"prefer long obvious files over deep indirection\") is the one place that reads real file bytes off disk and calls `sha256_hex`; `report.rs` itself does no I/O.\n\nDecision-10 report-boundary enforcement (this clause's own note carries it, per the task's own instruction): `render`'s first act is checking `graph.layout_asserts` — a registered (unrun) `@layout_assert` fails the *whole report* closed, naming M5, \"never asserted against nothing\" (`error[build]: the image report cannot be produced: 1 registered \\`@layout_assert\\` fn(s) (check_limits) — layout does not exist until the hardware/placement milestone (M5) ...`); the raw `--stage=image` graph dump is unaffected (it is the graph, not the report) — `golden/image-basic` (which already registers one `@layout_assert`, `check_limits`, for `image.eval.builder-intrinsics`'s own coverage) is reused verbatim for this, per the task's own \"reuse image-basic's shape\" instruction: no new golden case, just one more pinned expectation file, `golden/image-basic/expected/report.txt`, added to the existing fixture — its `--stage=image` (`expected/image.txt`) keeps succeeding unchanged while its `--stage=report` (`expected/report.txt`) is the one-line failure text above. `dma_pool`'s own identical fail-closed-before-seal behavior (`image.graph.dma-pools`) means a sealed graph can never carry a `dma_pools` entry either, so this boundary's only live trigger is `check_layout`.\n\n`golden/appliance` (new, project-shaped, `tests/golden/appliance/`) is this item's own flagship artifact: a real little block-storage system — one device (`BlockHw`, kept module-local since `img.device[D]`'s own bracketed type argument resolves through the ordinary type-annotation resolver, `sema::bodies::resolve_intrinsic_type_arg`, which stays module-local per item A's own disclosed gap, unlike `img.driver`/`img.actor`'s leading type argument), one driver (`StorageDriver`, imported from `driver.wr`) and two actors (`CacheActor`/`StatsActor`, imported from `cache.wr`/`stats.wr`) — cross-module imports exercising item A's own disclosed \"value/callee position only\" capability exactly as `golden/image-project`/`golden/image-helper-accept` already do, an image-declared pool (`CacheBuffers`, bound in the `@image` module itself, `img.pool[u32]`), and one `img.on_failure` group (`strategy=Restart.OneForAll`, `intensity=RestartIntensity(max=3, within=seconds(10))`) over all three declared driver/actors. Init wiring exercises every shape item C's own matching distinguishes in one build: a plain arg (`StorageDriver.init`'s own `sector_count`), a handle edge (`CacheActor`'s own `disk=disk.handle()`, `StatsActor`'s own `cache=cache.handle()` — two edges, one hop apart), and the reserved wiring args (`device=`/`mailbox=`, skipped by matching, pulled into `Edge`/`Mailbox` facts by the report instead of an ordinary `Arg` line). Both actors carry one real synchronous method apiece (`CacheActor.touch`, `StatsActor.record`) and the driver one (`StorageDriver.capacity`) — no `await`/`send`/`with` anywhere (M6 non-goal, actor-body typing). `expected/check.txt`/`expected/image.txt`/`expected/report.txt` all pinned; `expected/report.txt` is the flagship pin this clause names in its own title. `cargo xtask golden` confirms all three plus every pre-existing case (179 expectations total after this item, 0 moved beyond the additions this note itself lists).\n\nplans/M8.md item R (decision 12) adds `golden/check-regions-two-disciplines`, whose `expected/report.txt` is pinned for one specific line pair rather than for the report shape generally: `Pool name=Parts kind=image payload=u32 slots=4 slot_bytes=8 base=0x40502230 size=32 ...` beside `Totals actors=1 drivers=0 ready_queue=2 group_arena=1 bytes=1336`. Same image, same `async fn`, two binding disciplines, two different places to pay for a region — a pool is an address and a slot count in the image's own `pooldata` section, a group is an arena slot in `rtdata` (owner turn, deadline, cancelled flag: the wait machinery). 04-compiler.md §3's asymmetry is visible in the artifact the VMM is configured from, which is why the report is pinned here and not only the FlowWir dump.\n\nplans/M8.md item H Target A (2026-07-25): `wrela-vmm::parse_report` refuses forged configuration by name — `CoreEntry` outside `Section name=rtcode` (or with no rtcode section), `Ring` `cap`/`slot`/`bytes` triples that are not `bytes == cap*slot+24`, overlapping ring ranges, a ring overlapping a per-core stack, a `Placement core=` naming a core with no `CoreEntry`, and a `Placement id=` naming an actor the report's `Actor` lines do not declare. Oracle: `parse_report_refuses_placement_forgeries` (and the extended `parse_report_reads_request_rings_and_refuses_malformed_ones` / `parse_report_rejects_malformed_core_entries`).\n\nplans/M8.md item H Target A follow-up (2026-07-25): first pass closed per-line shapes; orchestrator spot-probe found set-level holes (unaligned/shared CoreEntry, overlapping Sections, duplicate Placement id). Closed in `validate_report_invariants` with an explicit invariant list; oracle rows (8)–(13) of `parse_report_refuses_placement_forgeries`."

