note = "The builder surface's own \"only inside `@image` evaluation\" restriction (plans/M4.md item B, decision 5) is `comptime.legality.inferred`'s own new mechanism (`eval::legal`, see that clause for how the exemption works) applied to its intended wrong-context corpus — this clause tracks the corpus, that one tracks the mechanism. Post-review addition: `golden/err-image-intrinsic-in-helper` (a same-module helper fn taking `mut img: Image` and calling a builder intrinsic, called once from the `@image` body — the disclosed \"helper fns are not exempted\" boundary, now actually enforced, `eval::check_image_legality`) and `golden/err-image-intrinsic-in-cross-module-helper` (the identical shape one module apart — the `@image` module importing that same helper — a second, distinct fail-closed diagnostic, since a cross-module callee is invisible to this module's own `classify` entirely; see `comptime.legality.inferred`'s own note for both diagnostics' exact text and why they differ). Five original named diagnostics, one apiece: `golden/err-image-intrinsic-in-test` (a `@test` fn whose body directly calls `Image(...)` — `error[comptime]: \\`@test\\` requires a comptime-legal closure, but \\`bad_test\\` is not comptime-callable`, extra line `  \\`bad_test\\` uses an \\`@image\\` builder intrinsic`, caught by `eval::check_test_legality` at ordinary `--stage=check`/`--stage=typed` time, not merely inside `wrela test`'s own report); `golden/err-image-intrinsic-in-const` (a `const`'s own initializer directly calls `Image(...)` — `error[comptime]: \\`const BAD\\` requires a comptime-legal initializer, but it directly uses an \\`@image\\` builder intrinsic`, `eval::check_consts`'s new `legal::scan_standalone`-based check, since a `const` is not a `classify`-tracked node and an intrinsic carries no `CalleeKey` for the existing callee-based check to catch); `golden/err-image-unsealed` (a well-typed `@image` fn that returns `img` without ever calling `img.seal()` — `error[comptime]: \\`@image\\` fn \\`build\\` returned without calling \\`img.seal()\\`\\``, `eval::interp::eval_image`'s own post-condition: `ctx.sealed_image` is `None` when the fn body completes without a `seal`); `golden/err-image-none` (a file with no `@image` fn at all — `error[build]: no \\`@image\\` fn found in the build closure`, `bin/wrela.rs::run_image_stage`'s own minimal slice of decision 6, item C's job to grow into the full \"list every candidate\" diagnostic); `golden/err-image-duplicate` (two `@image` fns in the same module — `error[build]: more than one \\`@image\\` fn in this module (...)`, `sema::bodies::check`'s own duplicate guard, the other minimal slice of decision 6 — a cross-module duplicate is `run_image_stage`'s own job and is deliberately the same code path as `err-image-none`'s \"count != 1\" branch, not a separate case). `cargo xtask check` green; none of these were reachable before this item (nothing illegal was representable in the typed tree at all, `eval::legal`'s own long-standing module doc) — every one is a genuinely new, exercised diagnostic path, not a re-pin of an existing one."

