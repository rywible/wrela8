id = "machine.clock.trap-logged"
doc = "06-machine.md#6"
status = "gap"
note = "plans/M5.md item E: honest partial — `wrela-vmm`'s own exit loop (`lib.rs`) fully implements the trap: a load from `mmio::CLOCK_MMIO_ADDR` returns `monotonic_ns()` (a process-local `std::time::Instant` epoch) into the faulting register (decoded via `hv.rs`'s own ESR data-abort decoder, unit-tested with hand-built ESR words per the plan's own \"keep it tiny + unit-tested\" instruction) and appends the value to `BootOutcome::clock_log`, in order — the *VMM* half of decision 13 is real and unit-tested (`hv::tests::decodes_a_64_bit_load` exercises the same decode path a real clock read would take). What stayed a gap at item E, honestly: no `@test(runtime)` fn could *issue* a clock read (the stdlib exposes no checkable `now()` surface at this milestone), so nothing in the generated runtime trapped `CLOCK_MMIO_ADDR` — `BootOutcome::clock_log` stayed empty on every golden.\n\nItem F update: its own named flip condition (\"item F's replay harness exercises the trap via a hand-written word sequence\") is now literally true — `crates/wrela-vmm/src/lib.rs`'s `record_replay_roundtrips_and_detects_every_divergence_shape` hand-assembles a ~12-word guest program (reusing `wrela-compiler::encode`'s own pinned encodings, a test-only dependency, `Cargo.toml`'s own comment) that issues two real `CLOCK_MMIO_ADDR` loads, boots it for real on HVF, and asserts `BootOutcome::clock_log.len() == 2` — the trap fires, decodes, and logs, driven by an actual guest instruction stream for the first time this milestone. This clause stays `gap` regardless, for a citability reason only, not a coverage one: `xtask ledger`'s own validator (and `machine.layout.v1-constants`'s own precedent, whose note names the identical situation for its six `wrela-machine` unit tests) accepts only `tests/` paths or a fixed `xtask:<command>` set, and this coverage lives entirely in a `cargo test` unit test with no golden or `xtask`-invokable counterpart — real, current, wired into `check` (`test_wrela_vmm_signed`), just not a citable `tests` entry. Flips to `test` the day a golden or `xtask` command reaches this same path (a future stdlib `now()` golden, most likely)."

[[clause]]
id = "machine.replay.clock-log"
doc = "06-machine.md#8"
status = "gap"
note = "plans/M5.md item F, decision 13/06 §8: the recorder/replayer (`crates/wrela-vmm/src/record.rs`, new) is real, not a stub — `RecordFile` (clock log + a non-cryptographic FNV-1a transcript digest + exit code + exits count, `to_text`/`parse` round-tripping a stable, timestamp-free `key=value` text format — the module's own doc names why it is a *recording*, never a golden: clock values are wall-clock-dependent and vary run to run, so nothing here is ever pinned), `record`/`replay` (boots live or replayed, via the shared `boot_image_core` this item added — `clock_feed: Option<&[u64]>` swaps `monotonic_ns()` for the recorded log in order), and `Divergence` (four named shapes: `ClockLogUnderrun`/`ClockLogOverrun`/`TranscriptDigestMismatch`/`ExitCodeMismatch`). `wrela-vmm`'s own binary gained `--record <path>`/`--replay <path>` (`main.rs`) so this is reachable from the command line, not only from Rust.\n\nOne unit test (`lib.rs::record_replay_roundtrips_and_detects_every_divergence_shape`) exercises every piece of this for real: a hand-assembled clock-reading image (above) is booted live to produce a `RecordFile`, replayed against it (asserts zero divergence), then replayed again against four independently tampered copies (a wrong digest, a wrong exit code, a truncated clock log, a padded clock log) — each one caught, by name, as the matching `Divergence` variant. This is a real in-test image exercising the full replay machinery end to end, exactly the condition the task's own instruction names for `test` status — but `status = \"gap\"` here anyway, for the same citability reason `machine.clock.trap-logged` (above) gives: `xtask ledger`'s validator has no way to cite a bare `cargo test` unit test (no `tests/` path, no `xtask:<command>` — `--record`/`--replay` are `wrela-vmm` CLI flags `xtask` never itself invokes standalone today), and this codebase's own established precedent (`machine.layout.v1-constants`) is to record such coverage honestly in the note rather than invent a citation. Flips to `test` the day a golden or `xtask` subcommand exercises `--record`/`--replay`/`record::replay` over a citable path."

