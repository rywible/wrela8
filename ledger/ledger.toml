id = "build.category.named-diagnostics"
doc = "02-language.md#2.1"
status = "test"
tests = ["golden/err-import-path-disagreement", "golden/err-import-missing-module", "golden/err-import-core-miss"]
note = "plans/M4.md item A opens this clause deliberately (item A's own brief): the `build` diagnostic category (`crates/xtask/src/main.rs`'s `SEMA_CATEGORIES`, extended by exactly one entry) covers every loader-level failure `crates/wrela-compiler/src/loader.rs` raises — root/file path disagreement and a missing file for an imported module path (both detailed under build.root-file-closure, which cites the same three goldens) — rendered through the identical one-line `error[build]: <message> at <line>:<col>` shape every other sema diagnostic uses (`sema::SemaError`, `wrela.rs::print_sema_error`, unchanged). Deliberately *not* covered by this category: a lex/parse failure in any file the closure reaches is that file's own `error[lex]`/`error[parse]`, unchanged (`loader::LoadError::Lex`/`::Parse`) — the loader only ever raises `build` for its own two obligations, never for a syntax error in a file it merely reads. The fuzzer's own `SEMA_CATEGORIES` well-formedness check never exercises this category directly (`cargo xtask fuzz sema` drives `sema::check` on one fuzzed file, never the loader), which is why it is listed here as a deliberate addition rather than something the fuzzer discovered — the three golden cases above are its whole corpus."
