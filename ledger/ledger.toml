note = "plans/M5.md item C: `mwir::MwirProgram` -> per-fn A76 machine code, `crates/wrela-compiler/src/codegen.rs` (new; `lib.rs` gains one `pub mod codegen;` line), dumped stably via `wrela dump --stage=asm` (`bin/wrela.rs`'s new stage arm, structurally parallel to `--stage=mwir`: lex/parse/`check_typed`/`lower::lower_program`, then `mwir::build_layout_ctx` — the one whole-program struct/enum field-type fact this stage needs beyond mwir itself — then `codegen::codegen_program`, then `codegen::dump`; a lowering or codegen rejection prints the same one-line `error[unimplemented]: ...` house style every other fail-closed stage already uses). The locked property this clause names is decision 4's own dumbness, not any cleverness: every mwir temp gets a fixed, 8-byte-aligned frame slot (`build_frame`, one region per temp in temp-number order, sized via `mwir::size_of`); every instruction loads its operands from slots into one of six fixed scratch registers (`x9`-`x14`), computes, stores the result slot back — no liveness analysis, no register reuse across instructions, no peephole, no instruction scheduling. The `--stage=asm` dump makes this observable directly: every one of the seven golden cases below shows the full spill/reload traffic for even a two-operand add, and the dump's own hex-first-per-line format (`NNNN: <hex u32>  <mnemonic>`) is the review surface a smarter emission would have to visibly break. Any future optimization pass is CLAUDE.md's own cleverness-budget path (a profile, a before/after on a recorded workload, a regression lock) — nothing here buys that budget, on purpose.\n\nEmission is two passes per fn (module doc's own worked rationale): pass 1 measures the fixed-shape prologue's own word count plus, for every mwir instruction, how many machine words it expands to (a static function of instruction shape/operand types — jump-target *values* never affect word count, only whether a target is reachable at all, which every function in scope here trivially is); pass 2 re-runs the identical per-instruction emission with the now-known `word_offsets` table, so every local `Jump`/`JumpIfFalse`/`Return`-to-epilogue resolves to a real PC-relative `B`/`CBZ`. A `Call`'s own target and every rodata reference stay symbolic at this stage (`Reloc::Call`/`Reloc::Rodata`, a placeholder `#0` immediate plus a fixup record item D's layout pass must resolve once the whole program is laid out into one flat blob) — the dump shows these as `bl <key>`/`adrp x9, rodata+0x18` exactly as the plan's own \"symbolic refs\" note describes.\n\n**Frame layout** (documented in full at the top of `codegen.rs`): SP-relative throughout (no frame pointer — `x29` is never touched, an internal-only ABI with no unwinder to satisfy), `[temps][self_ptr_save?][ret_ptr_save?][saved x30]`, rounded to 16; a frame whose rounded size would exceed 4095 bytes fails closed (the `ADD`/`SUB`-immediate `imm12` range), nothing in the required corpus comes close. **Calling convention** (AAPCS64-*shaped*, decision 4's own \"document the exact dumb rule\"): scalars by value in `x0`-`x7`/`x0`, aggregates by a bare pointer to the *caller's own* temp slot (never a defensive scratch copy — safe because a callee always copies an incoming aggregate's bytes into its own local slot at entry and only ever mutates that local copy, `codegen.rs`'s own \"canonical-slot\"/calling-convention doc section proves this in full), an aggregate result via `x8` pointing directly at the destination temp's own slot. More than 8 arguments fails closed (named, `CodegenError::unimplemented`); nothing in the required corpus needs stack args. `self_write_back`/`mut self`: proved (not merely asserted) to need no special call-site handling at all — the uniform bare-pointer rule plus the callee's own `MwirFn::receiver`-mode-driven epilogue write-back satisfies it automatically, so `Inst::Call::self_write_back` is read nowhere in this module; `asm-struct`'s own `Point.init`/`Point.shift` (both `mut self`) and `Point.sum` (`read self`, no write-back) are the golden proof each path does what it should.\n\n**The abort contract for item E** (`codegen.rs`'s own \"The abort contract\" doc section is the exact obligation, restated briefly here): `__wrela_abort(x0=msg_ptr, x1=msg_len) -> noreturn` for every fixed-at-compile-time message (ordinary/wrapping overflow, div/rem-by-zero, div `MIN/-1`, negation overflow, `.to[T]()` out-of-range, `<<` lost-bits, `assert`/`panic`/match-fallthrough); `__wrela_abort_val(x0=prefix_ptr, x1=prefix_len, x2=value, x3=value_signed, x4=suffix_ptr, x5=suffix_len) -> noreturn` for the two runtime-value-interpolated messages (`Shift`'s out-of-range count, `IndexGet`/`IndexSet`'s out-of-bounds index) — both called via `BL` with a placeholder target (`Reloc::AbortFixed`/`Reloc::AbortVal`), uniformly with every ordinary call, never inlined.\n\n**Overflow detection per op class** (`codegen.rs`'s own module doc has the full worked reasoning; summary): narrow (`<64`-bit) checked `+ - *` compute at full 64-bit width (always safe — sign/zero-extended `<64`-bit operands can never make the true sum/difference/product itself overflow 64 bits, the exact same trick `eval::value` plays with `i128`, one register width narrower) then bounds-check the raw result against the target type's own `[min,max]`; 64-bit-width `+ -` read `ADDS`/`SUBS` flags (`Vs` signed, `Cs`/`Cc` unsigned add/sub); 64-bit `*` uses `SMULH`/`UMULH` (new `encode.rs` functions, see below) to compare the product's high word against the low word's own sign-extension (signed) or zero (unsigned); `/ %` always check divisor-zero first, and signed `/` additionally does an *explicit* `lhs == MIN && rhs == -1` pre-check uniformly at every width (not a post-divide bounds check — ARM's `SDIV` silently wraps `i64::MIN / -1` back to `i64::MIN` itself at 64-bit width, defeating any check computed after dividing, so the explicit pre-check is the only form correct at every width, used at every width); shifts do the range check (`count < 0 || count >= bits`) as one *unsigned* compare (a negative signed count, reinterpreted unsigned, is always far larger than any `bits <= 64` — a correctness technique, not a profiled optimization) and `Shl`'s own \"lost nonzero high bits\" check guards `count == 0` first (the one case that would otherwise falsely trip at `bits == 64`, where a shift-by-a-multiple-of-64 is architecturally a no-op) before computing `bits - count` and testing the truncated value's own high bits. Every discrepancy this session found between 02-language.md §6.1's prose and `eval/value.rs`'s actual code: none — `int_bounds_i64`/`int_shape` and every check above were derived directly from `eval::value::eval_ordinary`/`eval_div_rem`/`eval_shift`/`eval_neg`/`eval_to_scalar`'s own Rust, not the doc prose, per CLAUDE.md's \"where interp.rs and the doc disagree, interp wins\" rule; no disagreement was found to arbitrate.\n\n**`encode.rs` extension**: `enc_smulh`/`enc_umulh` (two new pure functions, same `MUL`/`MSUB` \"Data-processing (3 source)\" ARM ARM class, `op31 = 0b010` instead of `0b000`, `Ra` fixed `31`) plus their own hand-verified unit tests (`smulh_umulh_forms`) — the one instruction class item A's subset genuinely omitted that 64-bit checked multiplication cannot be implemented without (no 128-bit register exists to hold a full widening product any other way); the existing `encoding_table_golden` test and every other existing `encode.rs` test are untouched. `compiler.encode.a76-pinned` (above) is flipped from `gap` to `test` in this same commit, citing these same seven goldens, exactly per that clause's own named flip condition.\n\n**Fail-closed list** (deliberately tiny — `codegen.rs`'s own module doc has the full reasoning): any floating-point value/operation (`encode.rs` never gained an FP/SIMD encoder subset; verified directly that none of the seven reused `mwir-*`/`asm-*` inputs declare an `f32`/`f64`); `ConstText`/`Static[Str]`/`Static[Bytes[N]]` (inherits `mwir::size_of`'s own already-disclosed \"bare `Str` has no static size\" gap rather than inventing a new layout); more than 8 call arguments; a frame over 4095 bytes; sizing a temp `mwir::size_of` itself cannot size (passed through as `mwir::size_of`'s own `Err`, unchanged).\n\n25 unit tests in `codegen.rs`'s own `#[cfg(test)]` module (frame-slot assignment for a plain scalar-only fn and one with a `mut`-receiver aggregate, a frame-too-large fail-closed case, an exact 13-word sequence for `fn answer() -> u64: return 42`, a symbolic-call-reloc test, narrow/wide/signed/unsigned overflow-branch-shape tests for `+ - * /`, a shift-range-check test, rodata content-dedup and cross-fn-sharing tests, a two-fresh-builds determinism test, and the float/too-many-args fail-closed tests) plus 163 total in `wrela-compiler` (up from 146 pre-item-C, encode.rs's own new pair included) all green. Golden family: `golden/asm-arith`/`asm-struct`/`asm-enum-match`/`asm-loop`/`asm-calls`/`asm-generic`/`asm-take` — each `input.wr` copied byte-for-byte from the matching `golden/mwir-*` case (never moved) so the mwir/asm dumps of the identical program stay co-reviewable side by side; `cargo xtask golden` confirms 201 expectations total (194 pre-existing unmoved + 7 new `asm.txt` additions).\n\n**Note-update, plans/M6.md item D/decision 6 (2026-07-24)**: the locked dumb shape now includes a checkpoint at every loop back-edge, sync fns included (turns run sync code too) — `codegen::is_loop_back_edge` (any backward `mwir::Inst::Jump`, the exact and only shape a `while`/`for`'s own repeat-jump ever takes) triggers a fixed, uniform 7-word sequence (`FnCtx::checkpoint`: `load_imm` the pending word's address, `ldr`, `cbz`-skip, `bl __wrela_checkpoint_service`) spliced in immediately before it — no bound proving, no elision, decision 6's own words. New `codegen::Reloc::CheckpointService`, resolved in both `layout::layout_program` and `layout::layout_test_image` against a shared `__wrela_checkpoint_service` stub that is a bare `ret` at this item (vectors unraisable until item E). `golden/asm-loop`/`golden/asm-take` moved once, reviewed: the only change in either dump is the new checkpoint sequence itself plus the resulting branch-offset shifts, confirmed line-by-line; the four report goldens with actors gained one additive `Section name=checkpoint ...` line."

[[clause]]
id = "compiler.lower.no-panics"
doc = "04-compiler.md#8"
status = "test"
tests = ["xtask:fuzz", "golden/err-mwir-if-else-scope-leak", "golden/err-assign-nonplace-unary", "golden/err-assign-nonplace-arith"]
note = "FLIPPED at M5-G finalization (2026-07-24): both lane-found bugs fixed (sema branch scoping, commit 5766861; non-place assignment targets, parser-level fix) and the smoke is wired into `check` alongside every other lane's; deep-clean verified at 2,000,000 iterations on five fresh seeds (31-35) post-fix, plus seeds 21-23 at 100k during the scoping fix's own verification. plans/M5.md item G, the lowering/codegen fuzz lane (`cargo xtask fuzz lower`, `crates/xtask/src/main.rs`'s \"fuzz: lower\" section) — the sixth fuzz lane, mirroring `comptime.eval.no-panics`'s own `fuzz eval` shape exactly: same corpus-mutation + token-soup strategies and the same seed inputs (`corpus_seed_inputs`, `mutate_seed_input`, `token_soup`), which since items B/C/E now include the `tests/golden/{mwir,asm}-*/boot-hello` golden inputs too (ordinary golden case dirs with their own `input.wr`, walked by the pre-existing `golden_case_dirs` scan exactly like every other golden — confirmed directly this session, not assumed). Pipeline, one stage further than `fuzz eval`'s own lex -> parse -> `sema::check_typed`: on a successful typecheck, `lower::lower_program`, then, on success, `codegen::codegen_program` — deliberately never `eval::run_tests` or the image pipeline (`fuzz eval` already covers those; this lane's whole point is the backend). Invariants, checked every iteration under `catch_unwind`: (a) never panics anywhere in `lower`/`codegen`; (b) deterministic — the whole pipeline runs twice and the mwir dump text (`mwir::dump`), the concatenated codegen'd words (every `CodegenFn`'s own `u32` half, `BTreeMap`-key order — a deliberately separate, word-level compare from the `--stage=asm` dump text, so a hypothetical dump-rendering bug could never mask a real byte-level divergence), and, whenever the program declares an `@test(runtime)` fn, the laid-out test-image blob/entry/sections (`layout::layout_test_image`, the exact path `bin/wrela.rs::test_cmd`'s own runtime tier calls, reused directly) are all byte-compared; (c) a lowering/codegen rejection is always the fixed `unimplemented` diagnostic category (neither `lower::LowerError` nor `codegen::CodegenError` carries a `category` field at all, unlike `sema::SemaError` — `bin/wrela.rs`'s own house style prints both uniformly as `error[unimplemented]: <message>`, so this lane checks the one fixed literal is still a member of `SEMA_CATEGORIES` rather than re-deriving one), **except** a message starting with the exact prefix `\"internal error: \"` — both error types (and `layout::LayoutError`) reserve that prefix for their own \"should be unreachable for any `check_typed`-accepted program\" producer-bug guards, so hitting one is itself an invariant violation (`LowerFuzzOutcome::Bug`), not a legitimate outcome; (d) every successfully codegen'd program passes a new, small, pure structural check, `codegen::validate(program: &CodegenProgram) -> Result<(), String>` (added to `codegen.rs` per the task's own explicit instruction, since re-decoding every emitted `u32` back into a mnemonic was explicitly rejected as too weak to matter — decision 5 already settled that HVF execution is the one real behavioral oracle for emitted bits, and item E's own `enc_umulh` bug is the concrete proof a self-consistent decode/encode round-trip would have missed anyway): every fn's own `code` is non-empty (a producer-bug-only condition — every `emit_fn` call always emits at least a prologue+epilogue), every `Reloc::Call`'s own word index is in range and its `key` names a fn this same `CodegenProgram` actually contains, every `Reloc::Rodata`'s own `word_adrp`/`word_adrp+1` pair is in range and its `byte_offset` is in range of the concatenated rodata, and every `Reloc::AbortFixed`/`AbortVal`'s own word index is in range — six new unit tests in `codegen.rs`'s own `#[cfg(test)]` module exercise both the accepting and every one of the five rejecting paths directly; (e) whenever the typechecked program declares one or more `@test(runtime)` fns, `layout::layout_test_image` is attempted (skipped, and counted, otherwise — booting stays diff-eval's/the guest bench lane's own job, never this in-process loop's, per the task's own explicit \"do NOT boot in the fuzz loop\" instruction) — its own internal `verify_section_sizes` call already re-derives the section table from scratch and turns any mismatch into an `Err` before this lane ever sees a successful `ImageLayout` back, so a `Built` outcome already *is* the section-size-verified proof this invariant asks for, with no second, redundant re-verification needed.\n\n**Status is `gap`, not `test`, and this is the load-bearing finding of this item** (plans/M5.md item G's own explicit \"pin as golden per house rule BEFORE fixing... if the root cause is in sema/eval, pin + report, don't fix out-of-scope\" instruction, followed to the letter): this lane's very first real exercise found a genuine, reproducible `sema::bodies` over-acceptance bug, pinned at `golden/err-mwir-if-else-scope-leak` — an `if`/`else` whose two branches each declare their own explicitly-typed local under the identical name (`value: u64 = 1` / `value: u64 = 2`, each syntactically its own fresh, block-scoped declaration — 02-language.md §8.1's own documented \"a conditional value is written by assigning in each arm, and definite-initialization analysis merges the arms\" idiom is for a *bare* assignment to an already-introduced name, and its own worked example never shows the name declared with an explicit type inside an arm) is wrongly accepted by `check_typed`: `--stage=typed`'s own dump on the pinned golden shows the `else` branch's own `value: u64 = 2` demoted to a plain `Assign` onto the `then` branch's already-declared local (not its own `Let`), and the name survives, wrongly, past the end of the whole `if`/`else` for the trailing `return value` to read. This is a real `sema::bodies` scoping defect, not a lowering gap: `lower.rs`'s own per-block, push/pop `LEnv` correctly does NOT see `value` as bound once both branches' own scopes have popped, so `env_lookup` fails and `lower.rs`'s own \"should be unreachable for any check_typed-accepted program\" internal guard (`LowerError::internal`) fires — proof lowering's own scoping is what is behaving correctly here, and sema's is not. Root cause confirmed out of this task's own permitted scope (sema/eval logic) — pinned and reported, not fixed here, per the task's own explicit instruction.\n\nSeverity, measured directly rather than assumed, is why this clause cannot honestly flip to `test` yet: `value` is an extremely common local name across the real seed corpus, so a single 1-4-op corpus mutation reaches this exact shape almost immediately at *every* seed tried this session — seeds 1 through 20, inclusive, every one crashed within 3_000 iterations (seed 7 crashed at iteration *0*, i.e. the very first mutated input already triggered it). There is consequently no seed/iteration budget, however small, that currently gives an honest clean smoke or deep run — every seed reproduces the *same* already-pinned bug, not a spread of distinct ones a different seed or a bigger corpus could dodge. Per the item's own \"fix or report finds first\" instruction (ahead of its required 3-fresh-seed deep-clean check), this session reports rather than fakes a clean run: `fuzz_lower_smoke` (`crates/xtask/src/main.rs`) exists, is fully implemented, and is directly callable (`cargo xtask fuzz lower --iters 1000 --seed 1`), but is deliberately **not** called from `check()` — the one other fuzz lane in this file not wired into the gate, alongside `diff-eval`/`profile`/`bench guest` before their own items landed, for the identical \"never fake a pass\" reason. `FUZZ_LOWER_DEEP_ITERS = 2_000_000` is chosen to match `fuzz sema`/`fuzz eval`'s own deep default exactly (the number this lane is *sized* for once the sema fix lands, landing in the identical \"roughly a minute or two\" band those two lanes' own comments target) rather than a number this session actually completed a clean run at. Per-iteration cost, measured anyway by aggregating 30 seeds' own pre-crash prefixes (31_126 total iterations across 1.69s wall time, minus each invocation's own ~5ms fixed corpus-load/startup cost): roughly 50-60us/iteration, consistent with `fuzz eval`'s own ~59us/iteration (this pipeline shares the identical lex/parse/`check_typed` prefix `fuzz eval` already pays for). This clause flips from `gap` to `test`, citing `xtask:fuzz` and `golden/err-mwir-if-else-scope-leak`, once (1) the `sema::bodies` if/else-branch scoping fix lands (a separately-scoped session's own job, out of this item's permitted `sema/`-logic boundary) and (2) `fuzz_lower_smoke` is wired into `check()` and the deep default is confirmed clean at three fresh seeds (21, 22, 23) — the exact verification this item's own task attempted and could not honestly claim.\n\nRelated: `compiler.lower.mwir-stable`/`compiler.codegen.naive-locked` (above) cover the *dump-stability*/*locked-dumbness* properties of these same two stages via hand-authored goldens; this clause covers their *robustness under adversarial input* instead — the same split `syntax.lexer.no-panics`/`syntax.parser.no-panics` already draw against the dump-shape clauses one stage earlier.\n\n**Second finding, post branch-scoping fix (this lane found it again, seeds 32/33; status left as `gap` here — the orchestrator, not this fix, owns any flip)**: once the above `sema::bodies` scoping bug was fixed and this lane's smoke was wired into `check()`, a full `--seed 32`/`--seed 33` run at `FUZZ_LOWER_DEEP_ITERS` surfaced a second, distinct `check_typed`-vs-`lower` disagreement — an `Assign` whose target is not place-shaped (`~total = a >> 1`, a unary-wrapped name; `i +2= 1`, a stray-digit typo that lexes as `i` `+` `2` `=` `1`, i.e. `Assign{target: i + 2, ...}`) typechecked clean and then hit `lower_place_write`'s own `internal error: expression is not an assignable place` guard, exactly this clause's own invariant (c) exception firing for real. Root cause and fix are on `syntax.diagnostics.parse-errors`/`sema.types.bodies` (parser-level: `parse_assign_or_expr_stmt` now requires `ast::is_place_expr(&target)`, matching the same check already used for `take`/`mut` operands) — minimized to golden/err-assign-nonplace-unary and golden/err-assign-nonplace-arith, the original four crash inputs (`target/fuzz/lower-crash-67.wr` through `-70.wr`) re-verified to now produce the named parse diagnostic instead. Post-fix: `cargo xtask fuzz lower --seed 32`/`--seed 33` both clean at the full 2_000_000-iteration deep default, and `cargo xtask fuzz sema --seed 32 --iters 200000` clean too. This does not by itself satisfy this clause's own stated flip condition (three *fresh* seeds, 21/22/23, at the deep default) — it re-confirms 32/33 clean after fixing what they found, which is a narrower claim; the flip stays the owning session's call.\n\n**Note-update (plans/M7.md item Y, 2026-07-24): this clause's \"lowering and codegen never panic\" claim now covers the *async* pipeline too — `flowwir_lower::lower_program` and `codegen::emit_flowwir_fn`, which had no fuzz coverage at all until this commit.** `attempt_layout`'s own doc comment has disclosed since M6-D that the `lower` lane never calls `flowwir_lower`/`codegen_program_with_async`, and `actors.runtime.static-tables`' own note named extending it as \"real, further, undated work\"; `cargo xtask fuzz async` (`crates/xtask/src/main.rs`'s \"fuzz: async\" section, the sixth lane in this file) is that work. Pipeline, mirroring `bin/wrela.rs::test_cmd`'s own runtime tier stage for stage: lex -> parse -> `sema::check_typed` -> `layout::merge_layout_ctx` -> `lower::lower_program` **+** `flowwir_lower::lower_program` -> `eval::interp::eval_image` (whenever the program declares an `@image`) -> `layout::actor_method_index_tables`/`resolve_runtime_test_args`/`count_with_group_sites` -> `codegen::codegen_program_with_async` -> `codegen::async_frame_sizes`/`compute_group_child_indices` -> `layout::layout_test_image` with a real `BootCtx` (never `None`, unlike the sync lane's own `attempt_layout`). Invariants are this clause's existing four, unchanged in kind: (a) no panic anywhere, both runs under `catch_unwind`; (b) determinism — the FlowWir dump (`flowwir::dump`), the concatenated codegen'd words, the laid-out image blob/entry/sections, and the measured reach itself, all compared between two fresh runs of the same input; (c) every rejection in the fixed `SEMA_CATEGORIES` set (a real `SemaError`'s own category, or — for `FlowError`/`LowerError`/`CodegenError`/`LayoutError`/`resolve_runtime_test_args`' bare `String`, none of which carries one — the fixed literal `bin/wrela.rs` actually prints for that exact stage, recorded per stage in `AsyncFuzzOutcome::Rejected`); (d) `\"internal error: \"` anywhere is a bug, extended here past the `lower` lane's own reach to *every* stage including the image evaluator, whose ~50 `internal error:` guards (`await`/`send`/`with group` reaching the comptime evaluator, an unbound local in place position, ...) are all \"unreachable for a `check_typed`-accepted program\" claims this lane is newly in a position to falsify. A `merge_layout_ctx` failure is likewise a bug, not a rejection — the identical judgement this clause's sync lane already makes about `mwir::build_layout_ctx`.\n\nGeneration is the one thing this lane does differently, and it had to: no token soup ever spells `@actor` + `pub fn` + `async fn` + `await` + `@image`, so mutation *bases* are the fixed, named `ASYNC_SEED_CASES` list (every accept-shaped async/actor golden: `flowwir-*`, `asm-async-*`, `boot-actor*`/`boot-actors`/`boot-send`/`boot-group-join`/`boot-deadline-*`/`boot-cancel-cleanup`/`boot-await-mailbox-full`, `check-actor-*`/`check-await-self-path`/`check-deadline`/`check-group`/`check-send-proven`), with whole-corpus splice donors one iteration in eight and plain token soup one in eight; `mutate_seed_input` gained a `mutate_seed_input_from(bases, donors)` sibling for exactly this, consuming the RNG in the identical order so no existing lane's seed changed meaning. **Measured reach, printed by every run rather than asserted** (seed 31, 400_000 iterations): 57_865 iterations type-checked (14.5%), 54_676 reached `flowwir_lower` (13.7%), 23_089 of those lowered at least one async fn (5.8% of all iterations, 40_953 async fns in total), 53_801 reached `codegen_program_with_async` (13.5%), and 18_788 laid out a real async `@test(runtime)` image through the whole `BootCtx` path (4.7%). Deep default 400_000 iterations (~250us/iteration in the `cargo xtask` alias' own debug build, ~100s — the same \"minute or two\" band every other lane targets); smoke (seeds 1/2, 1_000 iterations each) wired into `check` alongside every other live lane's. Clean-run evidence at commit time: 400_000 iterations on each of three fresh seeds (31, 32, 33) with the final invariant set, zero findings, plus 400_000 each on seeds 21/22/23 before invariants (d)/`merge_layout_ctx` were tightened — 2.4M iterations total.\n\n**One harness-side find, disclosed rather than routed around** (seed 1, iteration 13, an ordinary mutated `boot-*` program): `codegen::validate`'s own `Reloc::Call` arm asserts that every call target \"names another fn this same `CodegenProgram` actually contains\", which is true of the sync pipeline it was written for at M5-G and false of the async one — `codegen` emits a symbolic `bl <rt_enqueue X>` for every `await`/`send` through an `Actor[X]` handle (`codegen::rt_enqueue_symbol`), and that routine is hand-assembled by `layout.rs` into the harness section, never codegen'd into `program.fns`. `layout_test_image`'s own reloc resolution already knows both naming schemes (`fn_word_base`, then `glue_symbols`, then `unresolved_call_target` — whose `rt_enqueue` arm is a *named, user-reachable diagnostic* precisely because this shape is legitimate). So `validate` is stale relative to M6-D rather than wrong about anything the sync lane can see. The async lane re-implements that one arm with layout's own rule (`xtask`'s own `async_validate`: target in `program.fns` **or** a `codegen::rt_enqueue_actor` glue symbol, word index range-checked identically, anything else still a finding — strictly stricter than `validate`, since a genuinely dangling target is caught a stage before layout's own guard) and hands `validate` a glue-stripped clone for every other arm, so nothing is skipped and nothing beyond that single arm is duplicated. The tidy fix is `codegen::validate` growing the glue arm itself; that is compiler surface item Y does not own, and it is recorded here rather than silently worked around. **Done, at merge (orchestrator):** `codegen::validate`'s `Reloc::Call` arm now resolves a target either to a fn in `program.fns` or to an `rt_enqueue` glue symbol (`codegen::rt_enqueue_actor`, additionally required to name a non-empty actor, so a garbled synthetic key is still a finding), its doc comment's stale \"names another fn this same `CodegenProgram` actually contains\" line is corrected, and `xtask`'s own `async_validate` workaround plus its glue-stripped clone are deleted in favour of calling `codegen::validate` directly — the lane and the compiler now share one rule instead of two that must agree. Re-verified after the change: `fuzz async` clean at 8_000/seed 4242 and 15_000/seed 8811, and `cargo xtask check` green. Worth recording for its own sake: `validate` has no production caller at all — only the fuzz lanes reach it — which is exactly why a rule that went stale at M6-D survived unnoticed until a lane existed that drove the async pipeline."

[[clause]]
id = "image.layout.sections-verified"
doc = "04-compiler.md#8"
status = "test"
tests = [
  "golden/appliance",
  "golden/image-project",
  "golden/image-helper-accept",
  "golden/image-emit",
  "golden/boot-group-join",
  "golden/boot-actor-smoke",
  "golden/err-image-actor-undeclared",
  "golden/err-image-driver-message",
]
note = "Hardening (M6 finalization, 2026-07-24): the per-actor admission glue symbol was spelled `__rt_enqueue_<Actor>`, which is a lexically legal wrela identifier — and `layout.rs` resolves a `Reloc::Call` against compiled source fns BEFORE glue symbols, so a source fn with that name would have silently shadowed the real routine and emitted a wrong image (no diagnostic, wrong bytes). Closed by construction rather than by a reserved-name rule in the docs: synthesized symbols now contain a space (`rt_enqueue <Actor>`), which no identifier may contain, so the two namespaces cannot overlap whatever a fn is called. `codegen::symbol_is_synthetic` states the invariant one place for every future glue symbol, with a unit test asserting no source-shaped key is ever synthetic. Only two golden lines moved (the symbol's spelling inside asm dump comments). plans/M5.md item D: `crates/wrela-compiler/src/layout.rs` (new; `lib.rs` gains one `pub mod layout;` line) places a `codegen::CodegenProgram` into `wrela-machine`'s fixed layout contract as one flat blob loaded at `IMAGE_BASE` — no ELF, no linker — realizing 04-compiler.md §8's own \"emit and link\" as \"emit into one blob, then verify section sizes against the report\" (the exact phrase this clause's own doc anchor names). Section order (fixed, `layout.rs`'s own module doc carries the full rationale): `entry` (the placeholder entry stub, see the entry/abort contract below), `code` (every codegen'd fn's own words, `CodegenProgram::fns`'s BTreeMap key order, 4-byte aligned — trivially true, every word is 4 bytes), `rodata` (the codegen rodata pool's own bytes, concatenated in order, 8-byte aligned at its own section base — ABSENT when empty, the no-placeholder rule: today this only happens for a program with no checked arithmetic/panic/assert at all, since every abort call interns its own message text here), `data` (mutable globals — ALWAYS absent at M5, since `lower.rs` folds every module `const` to a literal at its use site; nothing in this milestone's surface can ever populate it, a fact recorded rather than a feature silently missing), `abort` (the two abort-routine stubs, `__wrela_abort` then `__wrela_abort_val`, 4-byte aligned, always present). The report's own new `Layout` section additionally prints the two fixed machine regions below `IMAGE_BASE` as `pages`/`stacks` facts (`wrela_machine::layout`/`console` constants directly, decision 7's own \"(code/rodata/data/stacks/pages)\" enumeration) even though this module places nothing there itself — that address range is the VMM's own to fill, item E.\n\nRelocation resolution (the four `codegen::Reloc` variants, item C's own fixups): `Reloc::Call`/`Reloc::AbortFixed`/`Reloc::AbortVal` all resolve to a real `BL` (`encode::enc_bl`), range-checked against the imm26 encoder's own +/-128 MiB reach *before* encoding — a genuine `Err(LayoutError)`, never a debug-only assertion a release build could silently skip past. `Reloc::Rodata` decodes its own live register directly out of the placeholder `ADRP`'s low 5 bits (codegen's own placeholder carries nothing else non-zero there) and re-encodes a real `ADRP`+byte-offset `ADD` pair against the rodata section's own now-known absolute base, range-checked against the imm21 page-count range the identical way. `verify_section_sizes` is this clause's own named \"teeth\": a real, load-bearing re-derivation (not a restatement) that every section starts where the previous one's own end plus at most a few bytes of alignment padding says it should, and that the emitted blob's own total length matches the last section's own end exactly — any future bug in this module's own bookkeeping trips it, proven by three dedicated unit tests (`verify_section_sizes_accepts_a_contiguous_table`, `_rejects_a_wrong_blob_length`, `_rejects_overlap`, `_rejects_first_section_not_at_image_base`).\n\nEntry/abort contract (frozen in `layout.rs`'s own module doc, item E's exact obligation to consume): entry = `IMAGE_BASE` installs core 0's own initial stack pointer (`sp = core_stack_base(0) + CORE_STACK_SIZE`) then falls into a shared halt sequence (`push_halt`) — materialize a documented placeholder exit code, store it to `machine_info::OFF_EXIT_CODE` (plain, non-trapping — visible in a raw memory dump even before any trap fires), store the same value to `mmio::EXIT_MMIO_ADDR` (the real \"I'm done\" signal, a data-abort VMM exit since that address is never backed by RAM), then `BRK #0` defensively. `__wrela_abort`/`__wrela_abort_val` leave their own incoming ABI registers (`x0`/`x1`, or `x0..x5`) exactly where the caller's `BL` put them — no console exists yet, decision 12/item E's own job — and fall into the identical shared halt sequence with their own distinct documented exit codes. Item E is expected to REPLACE entry's body (install the real test-running runtime) and EXTEND (not replace) the abort stubs' bodies (print the message over the console ring before the existing exit-code-store-then-trap tail).\n\n12 unit tests total in `layout.rs`'s own `#[cfg(test)]` module: BL reloc math including a negative offset and an out-of-range rejection, ADRP page math on the same page and crossing a page backward, section packing with and without a nonempty rodata section, a `Reloc::Call` resolving to the callee's own placed base (byte-verified directly against the blob), an unresolved call target failing closed, the four section-size-verification cases above, and a two-fresh-builds determinism check. `wrela dump --stage=report`/`wrela build` both call the identical `layout::try_layout_program` (via `build_report`, `bin/wrela.rs`) — a program's own reachable surface either fully lowers+codegens+lays out (appending the `Layout` section to both, `wrela build` additionally writing `<name>.img`) or it does not (the M4-era report, unchanged, decision D's own \"all or nothing,\" never a silent per-fn skip). `golden/appliance`/`golden/image-project`/`golden/image-helper-accept` (the three of the four M4 report goldens whose reachable methods fully lower — `golden/image-basic` never reaches layout at all, its own registered `@layout_assert` failing the report closed before rendering starts) gained their `Layout` section in this same commit, cited; `golden/image-emit` (new, a minimal two-fn program — `compute` calling `add_one`, `Reloc::Call` — over ordinary checked `+`, `Reloc::AbortFixed`/`Reloc::Rodata` via the shared overflow-message intern) is the dedicated byte-level review surface decision 5's own \"pinned bytes\" philosophy asks for, since none of the three appliance-family goldens' own reachable methods happen to call each other or trip a checked-arithmetic abort: `expected/build.txt`/`expected/report.txt` (with its own `Layout` section) plus `expected/img.hex` — a 16-bytes-per-line offset+hex dump (decision: more reviewable than raw binary in git, the task's own instruction), extending `xtask`'s `golden` runner with a fourth expectation-file meaning (`img.hex`, alongside `test.txt`/`build.txt`/`build-err.txt`) that reads the `build.txt` stage's own already-written `*.img` back off disk rather than invoking `wrela` a second time — the build-output directory's own removal moved from immediately-after-`build`/`build-err` to once, at the end of each case's own expectation-file loop, specifically so `img.hex` can still see it.\n\nNOTE-UPDATE (2026-07-24, plans/M6.md item F/G follow-up — a found-and-fixed defect, not a new plan item): **`layout_program` never emitted the runtime routines its own relocations needed, so no image that actually messaged an actor could be built or reported at all.** `wrela build` and `wrela dump --stage=report` both died with `error[build]: layout: internal error: call target `__rt_enqueue_Doubler` was never codegen'd` on `tests/golden/boot-group-join/input.wr` — and on every other `.wr` file whose source contains one `await`/`send` through an `Actor[T]` handle. Item C's own recorded rule (\"runtime tables are emitted for any image with actors, tests or not\") had been honored for the `rtdata` *reservation* only: `layout_test_image` built the per-actor `__rt_enqueue_*`/`rt_select_and_run` glue, the group-child poll routines, `rt_run_one` and boot-init, while `layout_program` built none of them, leaving codegen's own symbolic `codegen::rt_enqueue_symbol` call targets unresolvable. `golden/appliance` never caught it because its actors are declared and never messaged, so no such `Reloc::Call` is ever emitted at all.\n\nThe fix is one shared derivation and one shared assembler, used by both flavors: `layout::RuntimeWiring::derive(&BootCtx)` (runtime tables + per-actor dispatch keys + zero-arg `init` keys + the group-child index) and `layout::build_runtime_block(&RuntimeWiring, &RuntimePlacement, start)` (`build_runtime_glue_block`'s routines followed by `build_boot_init`'s, one contiguous run of position-independent words plus its own `Reloc::Call`s and glue symbols). `layout_program`'s signature changed from `runtime: Option<&RuntimeTables>` to `boot: Option<BootCtx>` — the identical parameter `layout_test_image` already took — so it now derives the tables itself instead of being handed them, and `try_layout_program` builds that `BootCtx` from facts it already had in scope (its one new call, `codegen::compute_group_child_indices`, is the same call `codegen_program_with_async` made one line earlier, so it introduces no new failure mode). What legitimately differs between the two paths is now *only* the entry driver: `layout_test_image` keeps its console harness + `@test(runtime)` roots and places the block inside its combined `entry` section; `layout_program` keeps `build_entry_stub`'s `EXIT_CODE_NO_RUNTIME` placeholder and places the block in its own new **`rtcode`** section, between `checkpoint` and `rtdata`. Every actor-bearing report golden gained exactly one additive `Section name=rtcode base=... size=...` line (plus the resulting `rtdata` base shift): `golden/appliance`, `golden/image-project`, `golden/image-helper-accept` — reviewed line by line, nothing else moved anywhere in the suite. That the block is unreachable in a `wrela build` image today (the entry stub halts before calling anything) is the same position `rtdata`'s own reservation already took and is recorded, not glossed: it is in the image because it is part of the image.\n\nNew coverage: `golden/boot-group-join` gained `expected/build.txt` + `expected/report.txt` — the messaged-actor image (`await` through an `Actor[Doubler]` handle, `with group(capacity=2)`, two `g.start` children) that could not be built at all before this fix, verified to fail before it (`internal error: call target `__rt_enqueue_Doubler` was never codegen'd`) and pass after; carrying an `expected/report.txt` also enrolls it in `compiler.repro.byte-identical`'s own `report_determinism` walk, so its emitted image bytes are now proven byte-reproducible across two fresh builds. `golden/boot-actor-smoke` gained `expected/report.txt` for the same reason and covers the other half of the block — an actor with a real zero-argument `init`, whose boot-init `Reloc::Call` now resolves on the build path too (verified directly against the emitted bytes: the `rtcode` section holds four `BL`s, two internal and two into `code` at `Store.get`/`Store.init`, and no unpatched `BL #0` placeholder anywhere).\n\n**Internal-error audit** (the second half of the same task: an `internal error:` had reached a user through an ordinary CLI path, which is what internal-error guards are explicitly not for). Every such guard in `layout.rs` was walked. Exactly one was genuinely user-reachable and it is now a real named diagnostic, `layout::unresolved_call_target`: a `Reloc::Call` at a `codegen::rt_enqueue_symbol` name with no matching declared actor. Two distinct source conditions reach it, both of which type-check and lower perfectly well — `Actor[T]` is a good type whether or not any `T` instance is declared — and both now say what to do instead of accusing the compiler: an `@actor` messaged but never declared (`golden/err-image-actor-undeclared`), and a declared `@driver` messaged through an `Actor[T]` handle (`golden/err-image-driver-message`) — the latter reusing `resolve_runtime_test_args`' own already-named M6-D driver floor rather than the wrong \"you never declared it\" advice. Both fire identically on the `wrela build`/`--stage=report` path and the `wrela test` path, since both now share the same helper. Every remaining guard was shown unreachable from any source program and now says why in a comment at its own site: `verify_section_sizes`' five (nothing there reads the program — every argument comes from one monotonic `cursor` and the identical byte counts that fixed it); the two checkpoint/runtime-block word-count guards in each fn (both blocks are built from identical shape inputs in both passes and differ only in the values a fixed four-word `load_imm` materializes); `Reloc::Rodata` with an empty pool (interning a literal is what fills the pool); `Reloc::TurnFrameAddr`/`Reloc::GroupArenaBase` with no tables (both are emitted only from async code, and a single async fn is already enough for `compute_runtime_tables` to size a non-empty table set, so the conditions are mutually exclusive; `turn_area_for` partitions the same `async_frames` map codegen keyed its relocs by); the two \"this section must never emit that reloc kind\" guards (structural — the builders in this file emit no such reloc); and the dispatch/init/harness `Call` guards (their keys are a declared actor's `pub` methods and its zero-argument `init`, read from the same module set `codegen` compiled, with a method that fails to lower stopping the whole attempt one layer up at `try_layout_program`'s \"all or nothing\" rule).\n\nOne hazard found in passing and disclosed rather than half-fixed (recorded on `codegen::rt_enqueue_actor`): `__` *is* a lexically legal identifier start, so a source fn literally named `__rt_enqueue_Doubler` would be found by the compiled-fn lookup first and silently shadow the real glue routine. No naming rule reserving that prefix exists in `docs/language/` today, so none is enforced; named as follow-up. **RESOLVED in the very next commit — see this note's own \"Hardening (M6 finalization)\" paragraph at the top**: the follow-up landed as a by-construction fix (synthesized symbols contain a space, which no identifier may contain) rather than as the reserved-prefix doc rule this paragraph was waiting on, so no naming rule was ever needed. Kept rather than deleted because it records what the disclosure looked like before it was closed; a reader must not take it as an open item."

