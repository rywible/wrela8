[[clause]]
id = "syntax.parser.no-panics"
doc = "02-language.md#8"
status = "test"
tests = [
  "xtask:fuzz",
  "golden/err-expr-nesting-depth",
  "golden/err-nesting-block-depth",
  "golden/err-nesting-type-depth",
]
note = "cargo xtask fuzz parser: seeded deterministic corpus-mutation + token-soup fuzzing through the lex-then-parse pipeline; never panics, result is a successful parse or exactly one error, deterministic across repeat runs; 100_000-iteration deep run clean across 15+ seeds (2.1M+ total iterations, no finds), smoke budget wired into xtask check.\n\nPost-M4 fuzz find (2026-07-24): `cargo xtask fuzz sema --seed 11`'s deep (2_000_000-iteration) run — reachable only once sema.check.roundtrip-stable's own const-closure-suite reparse bug, found at the same seed, was fixed and the run could get past iteration 955154 at all — aborted further in with a native `thread 'main' has overflowed its stack` (fatal: no catch_unwind around a real stack overflow, so no crash artifact was written; the deterministic seed+iteration replay this harness already gives every lane was still enough to bisect the crashing iteration range by `--iters N` and, under a temporary `WRELA_FUZZ_TRACE`-gated eprintln in the fuzz loop, read off the exact input — extracted, then reverted before commit, per house rule). Root cause: the recursive-descent expression precedence chain (`parse_or -> ... -> parse_unary -> parse_postfix -> parse_primary`, syntax/parser.rs) had no nesting-depth guard at all — unlike `sema::bodies::MAX_GENERIC_DEPTH`/`eval::quota::MAX_CALL_DEPTH`, both already fixed-constant-guarded one layer either side of this pass — so a deeply parenthesized/bracketed group or a long chain of unary prefixes (`-`/`~`/`await`/`take`/`send`, all self-recursive in `parse_unary`) recursed exactly as deep as the source nested, with nothing to stop it before it overflowed this process's own native stack; confirmed independent of any specific fuzz mutation by hand (`(((...(1)...)))` alone, no function calls, no comptime evaluation involved, blew the stack past roughly 350-400 levels of plain paren-nesting on the authoring machine's default thread stack). Fixed by a new `Parser::expr_depth: u32` counter, incremented/checked/decremented in a thin guard wrapping `parse_unary` (renamed grammar body `parse_unary_body`, `MAX_EXPR_DEPTH: u32 = 100` alongside `ParseError`): every recursive re-entry into the precedence chain — a parenthesized/bracketed group via `parse_primary`'s own recursive call back into `parse_or`, or a chained unary prefix via `parse_unary`'s own self-recursion — passes through this one guarded function exactly once per nesting level, so one counter at one checkpoint bounds native recursion depth regardless of which construct does the nesting; exceeding it is `error[parse]: expression nesting depth exceeded 100`, the ordinary parse-error path (no new diagnostic shape). 100 was chosen empirically (not measured/profiled — a safety constant, not a performance one): parsing plus the downstream AST dump/pretty-print/`sema::bodies::check_expr` walks (which recurse over the identical tree shape) stayed clean through roughly 350 levels and broke before 400, so 100 keeps a >3x margin while comfortably clearing every real corpus/golden expression (none come remotely close). Minimized to golden/err-expr-nesting-depth (101 nested parens around a bare `1` inside a `return`, the smallest depth that clears the new guard), pinning the parse-stage `ast.txt` diagnostic. `cargo xtask golden`/`cargo xtask corpus`/`cargo xtask roundtrip` all unchanged (184->186 golden expectations, no existing expectation moved) — nothing in the doc/example corpus or any existing golden nests anywhere near 100 deep. See comptime.eval.no-panics for the second, sibling native-stack finding the same deep run surfaced (the comptime evaluator's own `MAX_CALL_DEPTH`, guarded in name but not in native-stack fact).\n\n**Review find, fixed (plans/M9.md item RR, 2026-07-25, decision 547): the same hole in the parser's OTHER two recursive descents.** `MAX_EXPR_DEPTH` above bounded the expression precedence chain and nothing else, so the guard read as settled while two siblings stayed unbounded, both reproducible by hand with no fuzzing at all. (1) Nested indented suites: a body of ~800 nested `if true:` blocks recursed `parse_stmt -> parse_suite -> parse_stmts_until_dedent` all the way down and aborted `wrela dump --stage=ast` with `fatal runtime error: stack overflow` -- a SIGABRT and no diagnostic. (2) Nested type syntax: `Option[Option[...]]` ~300 deep PARSED fine and then aborted `sema::types::resolve_type` the same way at `--stage=check`; `render_type`, `mwir::size_of` and the layout walks all recurse over the identical shape, and the parser itself gave out before 1600. Neither is reachable by the fuzz lanes even in principle: all 33 of `xtask`'s guard sites are `std::panic::catch_unwind`, and a stack-overflow abort does not unwind, so every lane reports clean. Fixed with two more counters in the `MAX_EXPR_DEPTH` shape -- `Parser::block_depth` guarding `parse_stmts_until_dedent` (grammar body renamed `parse_stmts_until_dedent_body`) and `Parser::type_depth` guarding `parse_type` (body renamed `parse_type_body`) -- each a thin wrapper that increments, checks, and decrements around the unchanged grammar, at the single funnel every nested suite / nested type position must pass through exactly once per level. `MAX_BLOCK_DEPTH`/`MAX_TYPE_DEPTH` are both 100, chosen by the same empirical margin argument the expression constant records. Bounding the TYPE depth in the parser is what bounds sema, layout and codegen at once: no later pass can be handed a type the parser refused to build (generic instantiation can still synthesize deeper types, which is `sema::bodies::MAX_GENERIC_DEPTH`'s separate job). Both diagnostics use the ordinary parse-error path, no new shape: `error[parse]: block nesting depth exceeded 100` / `type nesting depth exceeded 100`. No existing golden or corpus entry nests anywhere near 100 deep -- all 855 expectations unchanged."

[[clause]]
id = "syntax.parser.roundtrip"
doc = "02-language.md#8"
status = "test"
tests = ["xtask:roundtrip", "golden/err-import-empty-list"]
note = "cargo xtask roundtrip: parse -> pretty-print (wrela dump --stage=pretty) -> reparse -> compare span-stripped AST dumps, for every corpus entry that parses and every ast-* golden input; the pretty-printer over-parenthesizes non-atomic expression children rather than computing precedence, per plans/M1.md item E\n\n**Soak find, fixed (plans/M6.md item H, 2026-07-24)**: `cargo xtask fuzz sema --seed 72` (a fresh seed in the M6 finalization soak) failed at iteration 576692 on `from a import()` \u2014 the parenthesized import form accepted an EMPTY name list, so the parser built an `Import` node with no names, the pretty printer faithfully rendered `from a import ` with nothing after it, and the reparse failed (`expected an imported name, found NEWLINE`). This oracle catching it is exactly its job: the defect is an unspellable AST node, and only a parse\u2192print\u2192reparse comparison can see one. 02-language.md \u00a72's grammar is `from path import Name [as Alias]` \u2014 at least one name, always \u2014 so `parse_import_names` now rejects the empty list by name (`golden/err-import-empty-list`) rather than letting the node exist. An M1-era hole, not an M6 defect; the bare (unparenthesized) form was never affected, since it always parses one name before looking for a comma. Counterexample run and confirmed: `from a import (x, y as z)` still parses and round-trips."

