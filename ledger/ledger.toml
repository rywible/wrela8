note = "plans/M5.md item D, decision 8's own reword: `report::render`'s decision-10 report-boundary diagnostic (a registered `@layout_assert` fails the whole report closed) used to name \"the hardware/placement milestone (M5)\" — a wording that would have become a lie the moment M5 itself landed layout+emission (this same commit) while `@layout_assert` still cannot run. Reworded to cite the real gap instead of a milestone number, `image.graph.dma-pools`'s own precedent (\"name the gap, not a milestone\"): \"registered @layout_assert fns cannot run yet: the stdlib ImageReport reflection type does not exist (gap image.report.layout-asserts)\". `golden/image-basic/expected/report.txt` (the one existing golden this diagnostic's exact text is pinned in) moved to the new wording in this same commit, cited here. This clause names the actual missing piece: 02-language.md §12's own `@layout_assert` (\"Post-layout build assertion over ImageReport\") needs a real stdlib `ImageReport` reflection type — a value a `@layout_assert` fn's own body could inspect (section bases/sizes, the machine revision, ...) — which does not exist yet and is stdlib-milestone territory, not this compiler item's to invent. `report::render`'s own decision-10 boundary keeps refusing unconditionally in the meantime (never a partial/fake `ImageReport` value), exactly as before this reword — only the *wording* changed, not the behavior, so no other golden moved. Flips to `status = \"test\"` once the stdlib actually defines `ImageReport` and a `@layout_assert` fn can genuinely run against it end to end, with its own pinned golden."
