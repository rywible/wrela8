note = "02 §9.4 / plans/M13.md item M / decision 1: where the compiler proves an operation's failure impossible, the result is its success type; otherwise the declared Result. Spelling never changes; failed proof surfaces at the use site with a why-chain. Instances: `send` (mailbox admission) and `VirtQueue.reserve` (descriptor capacity). Cross-ref `hardware.queues.reserve-proven`, `actors.send.statement-requires-proof`."

[[clause]]
id = "hardware.receipts.resolve-once"
doc = "03-hardware.md#5"
status = "test"
tests = [
  "golden/check-receipt-handoff",
  "golden/err-receipt-drop",
  "golden/err-permit-drop",
  "golden/err-handoff-no-transition",
  "golden/err-publish-take",
  "golden/boot-blk-roundtrip",
  "golden/err-boot-blk-roundtrip",
  "golden/boot-receipt-handoff",
  "golden/err-boot-receipt-handoff",
  "golden/err-receipt-await-twice",
]
note = "03-hardware.md §5: `Receipt[P] = Submitted | Committed | Resolved(P) | Recovery` — the one sealed resource state machine; \"a receipt resolves exactly once; dropping one is illegal in every state\"; the handoff calling convention; `publish`/`reject` as the producer transitions; admission commit before the handler runs.\n\nplans/M7.md item E3 / decision 16, closed by E4 / decision 22. **Types.** `Receipt[P]` and branded `QueueOp[P]` are prelude sealed authority (one opaque word; unforgeable; resources). Four receipt states are the type's sealed machine — no source constructor, no field projection; only `publish`/`reject` mint a word and only `drain` (then sync `claim` or `await receipt`) may resolve one.\n\n**Protocol consumption / handoff / publish write order.** Unchanged from E3 (`golden/check-receipt-handoff`, `err-receipt-drop`, `err-handoff-no-transition`, `err-publish-take`). Real DRAM ring stores land in E4's publish codegen.\n\n**E4 resolve path (decision 22).** The flagship holds the receipt in the driver and resolves it in `@task drain` via `VirtQueue.drain` + sync `VirtQueue.claim` — 03 §5's bottom-half sentence, not caller `await receipt`. `await receipt` is typed and lowered (park/wake against the same drain stash) but **not executed** by the flagship; the caller-side messaging that would park on a caller-owned receipt is the named M6-D driver-mailbox floor (`golden/err-image-driver-message` unchanged). Same dump-executed-later honesty E2's prepare and E3's publish used before a boot ran them.\n\n**Evidence.** `golden/boot-blk-roundtrip` (HVF write then read; live `written_len`; hand-computed sector word `0xC0FFEE00BEEF42A1`); `golden/err-boot-blk-roundtrip` vacuity twin.\n\n**Left closed, named.** Runtime admission-commit of a caller-owned receipt into a mailbox slot — needs messageable driver APIs (`05-library.md`), not a second completion mechanism.\n\n**plans/M8.md item E — the residue above is closed.** \"Runtime admission-commit of a caller-owned receipt into a mailbox slot\" is what `golden/boot-receipt-handoff` now boots on Hypervisor.framework: an ordinary `@actor` with no queue, no capability and no device stamps a word into the one DMA payload slot it owns, hands it to a `mailbox=4` `@driver` with `await self.disk.submit_write(...)` — 03 §5's signature-determined handoff — **parks on the `Receipt[P]` it gets back**, is woken with the completion the device produced, and then sends the same buffer out again as a read whose returned word is the one it wrote. That word (`0xD15EA5E0C0FFEE11`) exists nowhere in the image except the emulated disk.\n\n**\"Admission commit atomically moves `P` into the message *and* installs the caller-owned receipt, before the handler runs.\"** Decision 32: this is `layout::build_rt_enqueue`, unchanged, read for what it already does rather than duplicated. Between the capacity test and the `count += 1` that commits the slot it writes the method index, the **waker — the caller's own turn area, which is where the receipt will land** — and then the payload words, with no checkpoint, no scheduler entry and no other turn in between; the driver's `return queue.publish(...)` transitions that pre-existing pair when its turn runs. Nothing observable can interleave, so the atomicity is by construction and the window the sentence guards is empty. A second receipt object staged into a caller frame was **rejected** (decision 32): it would hold the same word, one turn earlier than any caller could look at it, and buy a second representation of a sealed one-word type that `is_aggregate` and `mwir::size_of` both assert is one opaque word.\n\n**The window that is not empty, and its oracle.** A completion can land between the driver's `publish` and the caller reaching `await receipt` — drain then finds `SLOT_META_WAITER == 0`, writes the completion into the stash and sets `RESOLVED`, and the caller's mask–arm–recheck takes it without parking. *(plans/M10.md item 0c3, 2026-07-26: `SLOT_META_WAITER` is now an `Option[TurnId]` — a `u32` whose `0` is the None niche — and `SLOT_META_REPLY_STAGE` a `(TurnId, intra-turn-area byte offset)` pair, both in the same words at +48/+56. Decision 560 fixed `TurnId` as a `u32` precisely so these two, which live in DMA-pool memory, need no new `@layout(dma)` field-type rule; `SLOT_META_BYTES` stays 64, so no pool window moves. The zero test this sentence turns on is unchanged in meaning and now `cbz w`.)* Both halves are live in this one boot, verified by mutation: forcing the recheck to always park (mask the `RESOLVED` test to 0) **hangs the boot** (`no core reported the guest exit protocol`), so at least one receipt was already resolved when awaited; forcing it never to park makes 2 of 3 tests fail, so at least one was not.\n\n**Exactly-once, caller side.** `await receipt` consumes the receipt (`sema::flow`'s own `Expr::Unary(Await, ..)` arm sets the place `Moved`), so a second resolution is unrepresentable rather than a race: `golden/err-receipt-await-twice` is `boot-receipt-handoff`'s source with one statement added and is `error[move]: `r1` was already taken`. The driver-side half (a slot retired so a second `claim`/`recover` meets the fail-closed abort) is `hardware.completion-outcome.no-auto-retry`'s, unchanged.\n\n**Why this is not the bottom-half `claim` dual** (the plan asks the question by name). `golden/boot-blk-roundtrip` resolves a receipt the driver minted, stored in its own `Option[Receipt[..]]` field, and consumed with the synchronous `VirtQueue.claim` inside its own `@task` — one principal, no mailbox, no suspension. Here the receipt is *owned by a different actor*, crosses a mailbox as a reply, is resolved by `await` (a real park: `the_parked_turn_really_left_and_re_entered` observes a `Ledger` reply that only a turn on a third actor could have produced, recorded between the caller's two halves), and `VirtQueue.claim` is never called anywhere in the image. The bottom half still runs — it is what resolves the receipt — but 03 §5's \"without re-entering anyone\" is now literal: it wakes a turn in an actor it has never heard of."

