  "golden/err-x-payload-mut-marker",
  "golden/err-x-closure-take-twice",
  "golden/check-x-closure-mut-receiver",
  "golden/err-x-init-flow-selfmethod",
]
note = "Pre-M3 adversarial sweep of feature *intersections* (M2's own goldens each test one feature singly; wrong-accepts live where passes hand off) across generics×flow, generics×access, closures×moves/exclusivity, defer×flow, match/patterns×moves, init×flow, `?`×moves, for/while×exclusivity, receiver-inference×generics, and struct-literal/enum-payload×access — roughly 30 probes plus their legal twins, classified CORRECT/WRONG-ACCEPT/WRONG-REJECT/PANIC. Four real bugs found and fixed narrowly (no existing golden's expectation changed): (1) `flow.rs`'s `place_type` returned `None` for any field reached through an *instantiated* generic struct (non-empty type args), silently skipping the resource overwrite-live and implicit-copy checks for e.g. `Box[DmaBlock].item` — fixed by substituting the field's type through the struct's own generics via a new `generics::subst_field_type`, widened `pub(crate)` for the reuse (golden/err-x-generic-flow-overwrite, golden/err-x-generic-flow-copy, golden/check-x-generic-flow-restore). (2) `check_takeable` only forbade a whole/field `take` when the underlying root was `mut`-mode, never `read`-mode; ordinary `take place` expressions are already rejected against a `read` root by `access.rs`, but a `take` written inside a `match`/`is` *pattern* payload (`Pattern::Take`, a different AST node `access.rs` never re-derives root mode for) bypassed that check entirely, letting a resource be stolen out of a merely-borrowed scrutinee — fixed by extending the same root-mode check in `check_takeable` to also reject `read` (golden/err-x-match-take-read). (3) the loop fixed-point re-walk (`walk_while`/`walk_for`) carried a resource local first bound *inside* the loop body forward across fixed-point passes as if it were live cross-iteration state, so `q = make(i)` inside any loop body spuriously failed `check_overwrite_live` starting on the second pass — fixed by pruning every path whose root wasn't present in the pre-loop state from the candidate before each pass (`prune_loop_locals`), since such a root is, semantically, reintroduced fresh every real iteration (golden/check-x-loop-fresh-resource). (4) a `mut` marker was accepted on a struct-literal field / enum payload / builtin pseudo-constructor argument — positions plan item D deliberately never mirrors against a declared parameter — which bypassed both the implicit-copy check (only checked for the unmarked/`Read` shape) and `take`'s own deinitialization, letting a resource end up with two simultaneously live owners; fixed by a new `access::check_payload_arg` (rejects `mut` outright; `take`/unmarked still legal per §3's \"a literal operand\") swapped in at the four synthetic/payload call sites (golden/err-x-payload-mut-marker). Two more intersections were judged correct-but-newly-covered and pinned without any fix: instantiated-generic-method call-site mirroring/receiver-mutability (golden/err-x-generic-access-mirror, golden/err-x-generic-access-receiver), a closure capturing a moved-from local and the same resource taken by two closures across separate calls (golden/err-x-closure-take-twice), a closure `mut` parameter that does not overlap its call's own lent place (golden/check-x-closure-mut-receiver), and `init`'s whole-`self` check firing even when the use is indirect, through a method call on `self` before every field is assigned (golden/err-x-init-flow-selfmethod). One further finding was judged structural (new cross-exit bookkeeping, not a missed condition) and is recorded, minimized, in plans/pre-M3-findings.md rather than patched: `defer`'s body is validated once at registration state, not re-checked against every real exit, so a place taken after registration on one path but not another is not caught. The sibling finding recorded alongside it — `for`/`while`'s `take_binding` AST field (`for take x in ...`) parsed and pretty-printed but never checked by any sema pass — has since been fixed (values.resource.move-spells-take's own note; golden/err-x-for-take-borrowed, golden/err-x-for-take-mismatch, golden/err-x-for-take-element-borrowed, golden/check-x-for-take-consume, golden/err-x-for-take-reuse) and is marked fixed in plans/pre-M3-findings.md rather than removed from that record."

# --- syntax hardening (post-M2, pre-M3) ------------------------------------

[[clause]]
id = "syntax.lexer.layout-islands"
doc = "02-language.md#1"
status = "test"
tests = [
  "golden/lex-layout-island",
  "golden/err-inline-suite-two-stmts",
  "golden/check-embedded-suite", "golden/err-empty-embedded-suite",
  "golden/err-closure-suite-comma-trail",
  "golden/check-closure-suite-non-last-arg",
  "xtask:fuzz",
  "xtask:roundtrip",
]
note = "Closes the roundtrip ambiguity plans/pre-M3-findings.md recorded as finding 3 (a place-postfix ambiguity inside a bracket-suppressed embedded suite lets a `take`/`mut` place's call-shaped postfix parse silently swallow the next, unrelated statement's leading token, found by `xtask fuzz sema` deep, seed=1, iteration=76076 mutating golden/err-x-closure-take-twice). Root cause was the lexer, not the parser: `()[]{}` fully suppress NEWLINE/INDENT/DEDENT, so a multi-statement suite embedded in an enclosing call's argument list (a closure body, docs/language/examples/virtio-storage.wr's `BlockCache.edit`/`peek`) had no separator token at all between its statements, and several tokens (`(`, `[`, `-`, `.`, `|`) both continue an expression and start a statement — genuinely ambiguous, not fixable by a smarter heuristic. Fix: layout islands in the lexer (crates/wrela-compiler/src/syntax/lexer.rs). A `:` immediately followed by a newline while bracket depth > 0 (checked via `last_token_is_colon`, so `:  # comment` before the newline still counts, and same-line content after `:` never triggers this) opens an island (`open_layout_island`): a fresh indentation sub-stack (`Island.indents`), seeded from whatever the innermost enclosing context's own current level already was (`innermost_indent`), pinned to the bracket depth the `:` was seen at (`Island.open_depth`). While `depth == open_depth` (`layout_active`), NEWLINE/INDENT/DEDENT tracking behaves exactly like the top-level stack (`apply_island_indent` mirrors `apply_top_level_indent`), so a multi-statement embedded suite now gets real separators instead of heuristics. A bracket opened deeper than the active island suppresses layout again immediately — no bookkeeping needed, `layout_active` just stops matching — and a further `:`-newline found there opens a nested island the same way, so islands stack arbitrarily deep; a `:`-newline seen while an island (or the top level) is already active is not a new island, just an ordinary deeper level on the same indent stack (ledger: a nested `if`/`while`/`defer` inside an already-open closure suite). An island closes two ways: (a) a later line's indentation falls back to (or below) its own base level, same dedent loop as the top level but stopping at the island's own floor and popping the `Island` itself instead of erroring; (b) a closing bracket drives `depth` below `open_depth` before the island's own indentation ever got a further line to dedent on — the `))`-on-one-line shape in `BlockCache.edit`/`peek` — force-emitting the balancing DEDENT/NEWLINE pairs immediately before that bracket's own token (`close_layout_islands_before_bracket_close`, called from `lex_operator`). Verified against the grammar and full corpus (docs/language/*.md fenced blocks + docs/language/examples/virtio-storage.wr + every tests/golden/*/input.wr) that no non-suite `:` inside brackets is ever immediately followed by a newline — the only bracket-nested colon-newline pairs found were the two multi-line closure suites already in virtio-storage.wr (`BlockCache.edit`/`peek`, now lexing through islands with byte-identical token positions and an unchanged ast-virtio golden) and golden/err-x-closure-take-twice's own two-statement closures; type-annotation colons (`const N: usize` inside `[...]`) are always followed by same-line content in every corpus instance, so no false-positive island ever opens there. Parser follow-up (crates/wrela-compiler/src/syntax/parser.rs): `parse_stmt_suite`'s `Newline` branch is unchanged and now handles every multi-line embedded suite via real INDENT/DEDENT, bracketed or not; `parse_inline_stmt_seq` (the no-`Newline` branch — now reachable only for a `:` followed by real content on the very same physical line, since any `:`-newline opens an island or an ordinary block instead) is restricted to exactly one statement — a second statement's leading tokens are rejected as `error[parse]: an embedded suite on one line holds one statement; use an indented block` (golden/err-inline-suite-two-stmts) rather than guessed at. `end_of_simple_stmt`'s `inline_depth` tolerance is unchanged (still needed: it lets the suite's one statement finish parsing without demanding a terminator token that was never going to exist; `parse_inline_stmt_seq` itself now does the actual end-of-suite check once that one statement returns) and its depth-0 nested-suite fallback (a top-level statement whose own trailing expression is a `|params|: suite`, ast-expressions golden) is untouched and still exercised. golden/lex-layout-island pins the token stream for a closure suite embedded in a call's argument list, including a nested inner call with its own multi-line argument list to prove suppression resumes correctly one bracket deeper, and exercises closing case (b) exactly (the closure's last statement and the enclosing call's own closing paren share one physical line). golden/check-embedded-suite pins a multi-statement embedded closure suite (three statements, the shape that was ambiguous) parsing and checking clean. All existing goldens — ast-virtio, ast-expressions, err-x-closure-take-twice, every lex-*/pretty-* expectation — are byte-identical with no `--update` needed: real content tokens' line:col are computed by the same source-scanning code as before, unaffected by the extra layout bookkeeping in previously-suppressed regions. `cargo xtask corpus` unchanged (lexed 30, parsed 23, fragments skipped 7). One further, genuinely new finding surfaced by this session's own required deep-fuzz gate (not by the two-statement ambiguity this clause was scoped to fix): `cargo xtask fuzz sema` (seed=2, 2_000_000 iterations) failed at iteration 1184050, mutating golden/check-embedded-suite, minimized to golden/err-closure-suite-comma-trail's own repro. Root cause was in the *printer*, not the lexer/parser: `print_closure`'s `Suite` variant (crates/wrela-compiler/src/syntax/printer.rs) unconditionally dropped the trailing newline `print_stmts` left, on the assumption (true for every prior corpus/golden case, where a suite-closure is always its call's last argument) that only closing delimiters ever follow — but a suite-closure can legally be a *non-final* call argument, and gluing a following `, next_arg` directly onto the suite's last statement's own printed line reintroduces the exact one-line-two-things ambiguity this clause closes, just from the printer's side: reparsing lands on the stray `,` with no statement boundary before it, `error[parse]: expected an expression, found ','`. Fixed by keeping the trailing newline unconditionally (removed the `out.pop()`): the suite's last statement always gets a real terminator before anything else continues, so a following `, next_arg)` or bare `)` lands on its own fresh line, closing the island via its ordinary dedent-to-base path first. Costs one blank line when a suite-closure is a whole statement's bare RHS (harmless — blank lines are layout-transparent, and no golden pins exact `pretty`-stage text). Confirmed this was reachable from hand-written source directly, independent of the printer (golden/err-closure-suite-comma-trail: a suite-closure's last statement followed, same physical line, by the enclosing call's own `, next_arg)` with no newline between them at all — genuinely ambiguous by the same reasoning as the inline single-statement case, so intentionally rejected rather than special-cased); the well-formed twin, the comma-continuation dedented onto its own line (exactly what the fixed printer now always produces), parses and checks clean (golden/check-closure-suite-non-last-arg). Verification at commit time: `cargo xtask check` green (98 golden expectations, all pre-existing ones byte-identical); `cargo xtask corpus` unchanged (lexed 30, parsed 23, fragments skipped 7); `cargo xtask roundtrip` clean (103 entries ok, 77 sema-roundtrip-checked); `cargo xtask fuzz sema` clean at both seed=1 and seed=2, 2_000_000 iterations each — seed=1 is the exact campaign that previously failed at iteration 76076 (the lexer/parser ambiguity this clause is named for) and seed=2 is the exact campaign that failed at iteration 1184050 (the printer finding just above), both re-run clean after both fixes; `cargo xtask fuzz lexer` (seed=1, 200_000 iterations) clean, its existing INDENT/DEDENT-balance invariant (`check_ok_invariants`) unchanged but now also exercising island bookkeeping on every bracket-nested iteration; `cargo xtask fuzz parser` (seed=1, 100_000 iterations) clean. plans/pre-M3-findings.md's finding 3 is marked fixed, pointing here. The normative doc sentence this clause hangs off (02-language.md §1: \"A newline ends a simple statement unless it is inside `()`, `[]`, or `{}`.\") already literally contradicted the docs' own multi-statement closure example (virtio-storage.wr's `BlockCache.edit`) before this session; one clarifying sentence was appended immediately after it in the same commit — flagged for human review as a normative change, per CLAUDE.md's doc-change rule."

# --- M3: the typed tree -----------------------------------------------------

[[clause]]
id = "sema.typed.dump-stable"
doc = "04-compiler.md#8"
status = "test"
tests = [
  "golden/check-bodies",
  "golden/check-decls",
  "golden/check-operators",
  "golden/check-generics",
  "golden/check-generic-use",
  "golden/check-match",
  "golden/check-defer-exits",
  "golden/check-x-for-take-consume",
  "golden/check-x-closure-mut-receiver",
  "golden/check-torture-block-cache",
]
note = "The typed tree (plans/M3.md item A, decision 1): sema's product, not an IR — a plain-enum mirror of `syntax::ast`'s `Expr`/`Stmt`/declaration shapes (crates/wrela-compiler/src/sema/typed.rs), no lowering/CFG/SSA/node-IDs/arena, produced by `bodies.rs`'s own `check_expr`/`check_stmt` (which now return a typed node — `TypedExpr`/`TypedStmt` — instead of a bare `Type`/`()`; `access.rs`/`flow.rs`/`matches.rs` are not retrofitted onto it, a recorded non-goal — they still call `check_expr`/`check_pattern` exactly as before and read `.ty` off the result wherever they previously got a bare `Type` back). Every expression node carries its resolved `Type` (reused directly from `sema::types`, no duplicate representation). A call carries a by-value `CalleeKey`: `Fn`/`Method` for a plain (never-generic) fn/method — a bare name or `(struct name, member name)` — and `FnInstance`/`MethodInstance` for an instantiated generic, spelled with `generics::canonical_key`'s own `\"kind:name[args]\"` string, identical to `TypedProgram::instantiations`'s own map key for the fn case (plus `.method` for a method reached through an instantiated struct) — one canonical spelling shared by both the call site and the instantiation's own storage, no second lookup scheme. Desugared operators (a user `Named` type's `+ - * / %` and `<`, 05-library.md §8) are already method-call-shaped (`OpCall`, carrying the resolved key); a builtin scalar/`bool`/`char` op (including `==`/`!=`, which never desugars even for a `Named` data type) stays the primitive `Binary` node — `build_binop_expr` (bodies.rs) is the one place that decides which shape a given operator+operand-type combination produces, replacing the old `check_binop_types` (which only ever returned a `Type`). Literals carry their settled scalar type (the i64/u64/f64 defaulting `synth_int_literal`/`synth_float_literal` already resolved) with their source text kept verbatim, unparsed — decoding is the evaluator's job (item B). `?` is one `Try` node carrying `Option<CalleeKey>`: `None` when the error type already matches (or for `Option`, which never converts), `Some(key)` naming the `<Target>.from`-shaped conversion — the identical key whether `From` came from an explicit `from` fn or `deriving(From)` (golden/check-bodies's `convert_wrapped`: `Try ty=u64 conv=WrapError.from`). Enum construction (`Some`/`Ok`/`Err`/leading-dot/`Enum.Variant`, including a bare no-payload variant reached through a plain field access) is one `EnumConstruct{enum_name, variant, args}` node, `enum_name` resolved to `\"Option\"`/`\"Result\"` for the two builtin sums or a user enum's own name (`resolved_enum_name`, also shared with `TypedPatternKind::Variant`). A closure carries its structural `fn` type on the wrapping node plus its own typed params/body (`TypedClosureParam`/`TypedClosureBody`). A fn/method/`init`'s own parameter defaults are typed once, on the declaration (`TypedParam::default`) — never re-typed per call site (a default may reference the callee's own `self`, which a caller's `FnCtx` does not have bound) — so a `Call`/`StructLiteral`'s own argument/field list carries only what that specific call site supplied (`Vec<Option<TypedExpr>>`/elided fields respectively), `None`/omission meaning \"use the callee's own stored default\"; a raw `fn(...)`-typed value call (`CallValue`) has no defaults to elide (a bare `fn` type carries none), so its args are always fully explicit. Struct/method/init/associated-fn bodies live on `TypedStruct` (`field_defaults`, `methods`, `assoc_fns`, `init`, all `BTreeMap`-keyed); a generic declaration's own (unchecked) body contributes nothing (`check_top_fn`/`check_struct_bodies` return `Ok(None)`), and each concrete instantiation's checked body is captured once, keyed by its canonical instantiation string, in `TypedProgram::instantiations` (`generics::check`, run last, now returns this map instead of `()`). `wrela dump --stage=typed` (crates/wrela-compiler/src/bin/wrela.rs, `sema::check_typed`/`sema::dump_typed`) pins the tree: one node per line, two-space indent, `Kind key=value ty=<type>` in the existing `--stage=ast` dump style (`typed.rs`'s own `dump`/`dump_expr`/`dump_stmt`/`dump_pattern`), no spans anywhere, `BTreeMap` iteration throughout (`Program`'s four maps, `TypedStruct`'s three) for determinism. Ten representative goldens pin it (chosen for feature coverage, not exhaustiveness — the M3.md plan's own \"roughly 8-15, not all ~104\"): check-bodies (plain bodies — literal defaulting including the u64-only-fits case and a negated-literal range check, `?` with and without a `From` conversion, `for` over both a range and a fixed array including the `take`-consuming form, closures and named-fn values passed positionally, an associated-fn value passed by name, `init`-bearing and plain struct construction including the Result-returning `init`, `defer`), check-decls (a resource struct's own `init`, an `own[P]` parameter, `async fn`, a private plain-`self` method), check-operators (every builtin scalar op including wrapping/shift/bitwise plus a user type's `add`/`less_than` shown both as an explicit call and as its desugared operator form side by side), check-generics/check-generic-use (a top-level generic `fn` instantiated both explicitly and by inference to the *same* canonical key/instantiation entry, a generic struct instantiated at three different argument shapes including a resource element type, field/method access through an instantiated struct value), check-match (every pattern shape — variant with/without payload, tuple, wildcard, literal, `|` alternation, `is` — against both a user enum and the builtin `Option`), check-defer-exits (defer registered before/after a conditional take-and-restore, at three different points relative to the restore), check-x-for-take-consume (a whole-array `for take` consuming loop next to a plain per-element read loan over the same resource-element array type), check-x-closure-mut-receiver (a closure passed as a `fn(mut T) -> R` parameter and called back through it), check-torture-block-cache (the one large multi-feature program the plan asks for: own[P] handle threading, take/restore, a generic struct instantiated once as data and once as a resource, private-method receiver inference, defer, match/`is` over a payload-carrying enum). Every dump was reviewed line-by-line against its source before being accepted (types, callee keys, and instantiation dedup all confirmed correct) — see the session report for the full review notes. `cargo xtask check`'s existing 102 pre-M3 golden expectations are byte-identical (`--update` only ever wrote the ten new, previously-empty `typed.txt` files — the touch convention: an empty `expected/typed.txt` means `xtask golden` generates and compares it, same as any other stage)."

[[clause]]
id = "comptime.legality.inferred"
doc = "02-language.md#12"
status = "gap"
note = "Legality inference (plans/M3.md item C, decision 7): whole-graph comptime-callable classification computed directly from the typed tree's own callee keys, no annotation, no constraint solver — crates/wrela-compiler/src/eval/legal.rs. `classify(&TypedProgram) -> Legality` registers one node per classifiable key (a top-level fn by its bare name, a plain struct's method/assoc-fn/init as `Struct.member`, and every `TypedProgram::instantiations` entry — a struct instantiation's own methods the same `key.member` way — all identical to `CalleeKey::spelling()`'s own strings, one shared namespace), scans each node's own body once for a decision-7 illegal operation and for its own direct callees (folding any `TypedExprKind::Closure` encountered straight into the enclosing node's scan — decision 4: a closure has no graph node of its own), then propagates illegality through the callee graph to a fixed point (recursion/cycles are legal per decision 7; a plain whole-pass-per-iteration fixpoint terminates in at most one pass per node since illegality only ever grows). `require_legal(&Legality, key, context, span) -> Result<(), SemaError>` is the M3-D/E-facing consumer: `Verdict::Legal` is `Ok`; `Verdict::Illegal{path, reason}` renders `error[comptime]: \\`<context>\\` requires a comptime-legal closure, but \\`<key>\\` is not comptime-callable at <line>:<col>` (the context's own span, since a typed node carries none of its own — typed.rs decision 1) plus one extra line per call-chain hop (`  \\`a\\` calls \\`b\\``) ending `  \\`z\\` uses <reason>`, the generics requirement-chain diagnostic's own extra_lines/omit_location mechanism (sema/mod.rs), reused verbatim rather than grown a second way. Left `status = \"gap\"` rather than `\"test\"` deliberately: `xtask ledger`'s own validator (crates/xtask/src/main.rs) requires every `status = \"test\"` clause's `tests` entries to be an `xtask:<known-command>` or an existing path under `tests/` — golden dirs, always — and this item ships no golden (the plan's own item C scope: `comptime if`/`comptime assert`/const-initializer surfaces that would make `classify`/`require_legal` observable through a pinned dump land in M3-D); citing bare Rust unit test names would not satisfy that check (they run via `cargo test`, already part of `xtask check`, but are not a `tests/`-rooted path), and inventing one to satisfy the format would be exactly the kind of gamed coverage the ledger exists to catch. The actual coverage today is eleven unit tests in `eval/legal.rs`'s own `#[cfg(test)] mod tests`, built from real source through the real `sema::check_typed` pipeline wherever the construct is representable (`plain_fn_is_legal`, `transitive_chain_is_legal`, `recursion_is_legal`, `mutual_recursion_is_legal`, `method_calls_are_classified_by_struct_dot_member_key`, `generic_fn_instantiation_is_classified_independently`, `generic_struct_instantiation_method_is_classified_independently`, `closure_body_folds_into_enclosing_fn_closure_set` — this one asserts the scan's own callee set directly, not just the (trivially Legal either way) verdict, to prove a closure's inner call is actually captured — `require_legal_accepts_a_legal_key`, `unknown_key_defaults_to_legal`), plus one (`require_legal_reports_illegal_verdicts_with_a_call_path_diagnostic`) that exercises the diagnostic's own multi-hop rendering against a hand-built `Legality` value, since no real program can produce an `Illegal` verdict yet to build a fixture from. That gap is real and named here rather than argued around: every operation decision 7 names as illegal — `await`/`send`/actor calls, `with` group/pool, pool operations, `@image` bodies — is still unrepresentable in the typed tree (`bodies.rs` fails closed — `error[unimplemented]` — on each before a typed node is ever built: `Expr::Unary(_, UnaryOp::Await, _)`, `Expr::Send`, `Stmt::With`, `is_image_fn`; golden/err-unimplemented-await already pins the first), so `sema::check_typed` never returns `Ok` for a program containing one — `classify` cannot classify what cannot exist yet. `eval/legal.rs`'s own illegal-op scan (`expr_illegal_reason`/`stmt_illegal_reason`) is an exhaustive match over every current `TypedExprKind`/`TypedStmtKind` variant (not a wildcard), so it stops compiling — rather than silently defaulting new variants to \"legal\" — the moment M5 lifts any of those fail-closed diagnostics and typed.rs gains a real node for one; that is the honest present shape of \"the illegal-op detection for the node kinds that can appear\" the M3-C task asked for. Flips to `status = \"test\"` citing real goldens once M3-D's `comptime if`/`comptime assert`/const-initializer surfaces make a `require_legal` diagnostic (and a genuinely reachable `Illegal` verdict, once M5 lifts a fail-closed case) pinnable end to end."

[[clause]]
id = "sema.typed.roundtrip"
doc = "04-compiler.md#8"
status = "test"
tests = ["xtask:roundtrip", "xtask:fuzz"]
note = "The typed-roundtrip oracle (plans/M3.md decision 3): `typed(x) == typed(pretty(parse(x)))` byte-for-byte replaces the check-dump comparison as sema's own agreement oracle — strictly stronger (the typed dump embeds every resolved type/callee key/instantiation the check dump's declaration-signature-only view never showed), same machinery. `xtask`'s shared `sema_outcome_summary` (used by both `xtask roundtrip` and the `fuzz sema` invariant, `sema.check.roundtrip-stable`'s own mechanism) now runs `sema::check_typed`/`sema::dump_typed` instead of `sema::check`/`sema::dump`: on success the `Ok` variant now carries the full typed-program dump instead of just the resolved-signature one; on failure the `Err` variant is unaffected (byte-identical to plain `check`'s, since `check_typed` runs the exact same pass pipeline in the same order, only additionally threading the typed program through — any diagnostic it produces comes from the identical call to the identical pass function). No other code changed: `sema_outcomes_agree`'s comparison rule (two `Ok`s need a byte-identical dump; two `Err`s need the same category/message/`extra_lines`-with-position-tails-stripped/`omit_location`) is untouched, and the item-rotation acceptance invariance check (`check_sema_roundtrip_and_rotation`) still calls plain `sema::check` directly, since it only ever compares accept/reject, never dump content. Verification: `cargo xtask roundtrip` clean (106 entries ok, 26 skipped fragment/parse-error, 80 sema-roundtrip-checked — now comparing typed dumps under the hood); `cargo xtask fuzz sema --iters 200000` clean (seed=1); `cargo xtask check`'s own smoke budget unaffected. No new bug found by the strengthened oracle during this session — the parallel `check_expr`/`check_stmt` typed-production path added in the same commit is exercised by every corpus/golden entry this oracle already walks, so a producer-side nondeterminism or a printer/checker disagreement specific to the typed tree would have surfaced here exactly like the pre-existing check-dump oracle's own findings did in earlier sessions."
