id = "sema.typed.roundtrip"
doc = "04-compiler.md#8"
status = "test"
tests = ["xtask:roundtrip", "xtask:fuzz"]
note = "The typed-roundtrip oracle (plans/M3.md decision 3): `typed(x) == typed(pretty(parse(x)))` byte-for-byte replaces the check-dump comparison as sema's own agreement oracle — strictly stronger (the typed dump embeds every resolved type/callee key/instantiation the check dump's declaration-signature-only view never showed), same machinery. `xtask`'s shared `sema_outcome_summary` (used by both `xtask roundtrip` and the `fuzz sema` invariant, `sema.check.roundtrip-stable`'s own mechanism) now runs `sema::check_typed`/`sema::dump_typed` instead of `sema::check`/`sema::dump`: on success the `Ok` variant now carries the full typed-program dump instead of just the resolved-signature one; on failure the `Err` variant is unaffected (byte-identical to plain `check`'s, since `check_typed` runs the exact same pass pipeline in the same order, only additionally threading the typed program through — any diagnostic it produces comes from the identical call to the identical pass function). No other code changed: `sema_outcomes_agree`'s comparison rule (two `Ok`s need a byte-identical dump; two `Err`s need the same category/message/`extra_lines`-with-position-tails-stripped/`omit_location`) is untouched, and the item-rotation acceptance invariance check (`check_sema_roundtrip_and_rotation`) still calls plain `sema::check` directly, since it only ever compares accept/reject, never dump content. Verification: `cargo xtask roundtrip` clean (106 entries ok, 26 skipped fragment/parse-error, 80 sema-roundtrip-checked — now comparing typed dumps under the hood); `cargo xtask fuzz sema --iters 200000` clean (seed=1); `cargo xtask check`'s own smoke budget unaffected. No new bug found by the strengthened oracle during this session — the parallel `check_expr`/`check_stmt` typed-production path added in the same commit is exercised by every corpus/golden entry this oracle already walks, so a producer-side nondeterminism or a printer/checker disagreement specific to the typed tree would have surfaced here exactly like the pre-existing check-dump oracle's own findings did in earlier sessions."

