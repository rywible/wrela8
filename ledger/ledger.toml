note = "plans/M7.md item A, 03-hardware.md §1's fourth sentence: \"The compiler checks provenance transitively — a function that touches MMIO, DMA, or IRQ state must be reachable through the owning driver's authority.\"\n\n**The mechanism, and why it is not a new one.** plans/M7.md decision 3: \"Provenance ... is the same whole-graph reachability `eval::legal::classify` already computes for comptime legality — reuse its shape, a second color.\" Taken literally: `eval::legal::check_provenance` builds the *same* `build_nodes` graph from the same typed callee keys and runs the same dumb whole-pass fixed point. Only the direction and the seed differ, and both differences are the sentence's own. Legality propagates backwards (a caller inherits its callee's illegality); provenance propagates forwards from a seed (a callee inherits its caller's authority), which is what \"reachable through\" means. The seed is every `Struct.member` key of a `@driver` — \"the owning driver's authority\".\n\nThree inputs the typed tree cannot answer are computed once by `sema::types::capability_authority` and handed over as data: which structs are `@driver` (`TypedStruct` carries no such bit and this item did not add one), each key's declaration span (a typed node has none — `typed.rs` decision 1 drops spans), and the flattened set of named types that carry a capability at any nesting (so the reachability walk asks a set question instead of keeping a second copy of `type_contains_capability`'s recursion through struct fields — one walk, in the file that owns it).\n\n**What \"touches MMIO, DMA, or IRQ state\" means at this milestone, exactly.** The fn's own signature or body names a capability-typed value: a parameter whose type carries one at any nesting, or an evaluated expression whose type does. Nothing narrower is available and nothing wider would be honest — at item A there is *no MMIO access, no DMA operation and no IRQ binding in the language at all*. Item C owns register access, item D owns pools, item G owns vectors.\n\nThis is the real rule's base, not a stand-in for it: holding the authority is the precondition for every operation C/D/G will add, so the set of fns this check admits is exactly the set those operations will be permitted in. **How C and D plug in**, stated now so it is not rediscovered: each adds an arm to `expr_hardware_reason`, which is written as an exhaustive match over `TypedExprKind` for precisely this reason — a new typed node for an MMIO load/store or a DMA publish will not compile until it answers the hardware question, the same discipline `expr_illegal_reason` already enforces for legality. The seed, the propagation, the roots and the diagnostic are already whole; only the touch predicate grows.\n\n**Both touch arms have teeth and an accept case.** The signature arm: `golden/err-cap-provenance` is a free fn taking `IrqCap[u32]` that no driver calls. The body arm: `golden/err-cap-provenance-body` is a method whose signature names no capability at all (`read self` is a receiver, not a parameter) on a plain struct that holds one, so evaluating `self` is evaluating a capability-bearing value. `golden/check-capabilities` accepts both declarations *unchanged*, with one call added apiece from `BlkDriver.service` — so the accept case is not vacuous: removing exactly one line from it produces each rejection. Transitivity itself (two hops from the driver, and the same graph with the middle call removed, where the diagnostic must name the severed *tail* rather than the still-reachable hop) is `eval::legal`'s own `authority_reaches_transitively_through_the_callee_graph` / `a_severed_tail_is_rejected_and_named`.\n\n**The reading taken, and why it is sound rather than lax.** \"Reachable through the owning driver's authority\" is read as *at least one path from some driver*, not *every path*. A caller that is not itself authorized cannot construct the capability argument such a call needs — no source construct produces one (`hardware.capabilities.unforgeable`) — so its only possible source is its own parameter or field, which makes that caller a touching node under this same rule. The chain bottoms out at a driver or at a rejection, whichever comes first. An `@actor` is deliberately *not* a root (`an_actor_is_not_an_authority_root`): §1 says \"the owning driver's\", and the containment rule keeping an actor from holding a capability would be pointless if calling out of one conferred authority anyway.\n\n**Scope boundary, disclosed rather than discovered later.** This runs per module, because the callee graph does: a `CalleeKey` names a local spelling, and an imported callee resolves to no node in the importing module's graph (`sema::check_program_typed`'s splice copies a declaration's *shape* under the local name, not an edge). So a capability-touching helper in a module that declares no `@driver` is rejected even when a driver in another module calls it. That is the fail-closed direction and it was chosen over the alternative deliberately: merging every module's graph under bare keys would silently *accept* a touching fn merely because some other module declared a same-named fn that a driver happens to call — a false accept in a rule whose whole job is refusing unauthorized access. The diagnostic says \"in this module\", so the boundary is in the message and not only here. Lifting it needs real cross-module edge resolution and belongs to whichever item first splits a driver across modules; today 03 §1's own example, and every M7 driver, is one struct with its helpers in one module.\n\n**Not claimed.** That any function reads a register, owns DMA memory, or binds a vector — none of those operations exists. That a capability *value* exists at runtime: nothing constructs one yet (see `hardware.capabilities.unforgeable`'s own floor note), so every fn this check admits or rejects today is reasoning about types, and the check will start reasoning about real values at the same moment items C/D give it operations to see.\n\n**Item I's sweep (2026-07-24) — a whole input to this check was silently empty.** `capability_in_type` asks `authority.capability_bearing`, the flattened set `sema::types::capability_authority` computes, and that fn has an explicit `DeclItem::Enum` arm whose entire job is to put a capability-bearing enum's name into it. The arm was dead: it called `contains_capability`, which consulted a struct-only map, so `structs.get(<enum name>)` was always `None` and **no enum ever entered `capability_bearing`**. A fn taking a capability wrapped in an enum variant payload was therefore not \"a function that touches MMIO, DMA, or IRQ state\" as far as this check was concerned, and needed no driver's authority at all (`golden/err-cap-provenance-enum` is `golden/err-cap-provenance` with the `IrqCap[u32]` moved one wrapper deep — it compiled clean). Code that is written, reads correctly, and cannot fire is the hardest arm of all to audit by reading; this one was found by running it. Fixed by the shared `components_by_name` table (`hardware.capabilities.unforgeable`'s own item-I note has the whole finding)."

