note = "03-hardware.md §6: \"The ownership unit is a **vector**: exactly one handler per vector, possibly several vectors per driver (one per queue, plus configuration) ... The vector table is generated from the image graph; source cannot bind an unowned vector.\"\n\nplans/M7.md item G's first green boundary; decision 12 freezes what an `IrqCap[V]` is at runtime under decision 11's one-word rule.\n\n**Decision 12: the runtime word is the vector bit index (`1..=63`).** Bit 0 is reserved for M6's deadline/cancel vector (`__wrela_vector0_service`, 06-machine.md §4). A device declares ownership with optional `vector=N` on `img.device[...](...)`; omitting it is 03 §7's poll build (no vector exists for that device). `claimed.take_irq()` yields `IrqCap[u32]` whose word is that index (`Inst::LoadIrqVector` / `Reloc::IrqVector`, patched by layout from the sealed graph); an `IrqCap` `init` parameter is the same mint at the image binding. `IrqCap.bind(handler)` accepts 03 §6's `self.on_queue_irq` / `Driver.on_queue_irq` spelling as a method reference (not a value — `sema::flow` does not treat it as a place) and records an `IrqCap.bind` intrinsic whose handler is a `FnRef`; `unmask()` is the sibling. Bind and unmask are build-time facts; runtime dispatch is `hardware.isr.checkpoint-dispatch`.\n\n*Rejected: an opaque build-time index into a side table.* Same rejection decision 11 already made for addresses — the pending-word bit *is* the identity the VMM and the guest share.\n\n*Rejected: a fat value (bit + device id, or a handler key).* Ownership and the handler table are sealed-graph facts; a second runtime encoding would disagree with them.\n\n**Named rejections.** (1) Unowned (`golden/err-irq-unowned-vector`). (2) A vector bound twice (`golden/err-irq-vector-bound-twice`). (3) Two vectors to one handler (`golden/err-irq-two-vectors-one-handler`). (4) `vector=0` (`golden/err-irq-vector-0`). (5) `vector>63` (`golden/err-irq-vector-range`). (6) Two devices share a bit (`golden/err-irq-vector-duplicate`). The accept is `golden/check-irq-bind`. An `IrqCap` `init` param with no `device=` is source-unreachable for a wired `@driver` and is unit-tested in `eval::image_checks::tests::every_still_unminted_capability_names_the_item_that_mints_it`.\n\n**`golden/check-device-take-irq` is the H1 vacuity that opened.** H1's self-audit pinned `take_irq` as fail-closed naming item G; the same input now type-checks, and the seal-time half lives in `err-irq-unowned-vector`.\n\n**Item H soak (2026-07-25) — `LoadIrqVector` without an `@image`.** A `@driver` that binds an IRQ plus `@test(runtime)` and no `@image` used to surface as `internal error:` from `layout::driver_irq_vector` (fuzz lower seed 8103). Now a named `error[build]` (`golden/err-test-image-driver-irq-no-image`).\n\n**Left closed, named.** Receipt-shaped work (item E). See sibling G clauses.\n\n**Item I's sweep (2026-07-25) — \"Receipt-shaped work (item E)\" left-closed line is stale.** E4 closed receipts/completions on the bottom half; caller-side `await receipt` execution remains the named mailbox floor."
