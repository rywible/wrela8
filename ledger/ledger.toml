note = "03-hardware.md §7: \"Driver mode is a const generic (`BlkDriver[DriverMode.Irq]`) whenever it changes the ISR/actor/effect graph — never a runtime option, so the analyzed graph is the emitted graph. A poll build eliminates the ISR and vector entirely and runs its bounded poll task every loop pass … callers and receipts are identical in every mode.\"\n\nplans/M7.md item G, **decision 18**.\n\n**Decision 18: `DriverMode { Irq, Poll }` is a prelude enum; MODE-gated `comptime if` expands per instantiation.** Same prelude vehicle as `Target`/`Restart` (`builtin_enum_variants` + annotation resolution). A member or statement `comptime if` whose condition names the enclosing struct's const generics is deferred by `sema::specialize` and expanded in `generics::instantiate_struct` under the concrete argument (`expand_deferred_members`). Module-scope `comptime if` still cannot name a generic parameter (`err-comptime-if-not-comptime`).\n\n**Artifact proof (not types alone).** `golden/check-driver-mode-irq` vs `golden/check-driver-mode-poll` are the same driver shape under opposite modes:\n- Irq: device `vector=1`, report `IrqHostInject`, mwir has `on_queue_irq`, checkpoint size 336.\n- Poll: no `vector=`, no `IrqHostInject`, mwir has no `on_queue_irq`, checkpoint size 256 (wake-drain path only).\nBoth keep `@task drain` with the same signature — §7's \"callers … are identical\" for the bottom half; receipts stay item E.\n\n**Seal contradictions.** `golden/err-driver-mode-poll-vector` (Poll + `vector=`); `golden/err-driver-mode-irq-no-vector` (Irq without `vector=`).\n\n**Left closed, named.** Per-loop poll scheduling of `@task` (the §7 \"every loop pass\" sentence — today's Poll build eliminates the ISR/vector; the scheduler poll-trigger attribute is not yet emitted). Receipts (item E)."

[[clause]]
id = "hardware.reset.epoch-invalidates"
doc = "03-hardware.md#9"
status = "test"
tests = [
  "golden/err-boot-epoch-stale",
  "golden/check-device-reset",
  "golden/err-queue-reset-unoffered",
  "golden/err-device-unknown-op",
  "golden/err-device-required-unoffered",
]
note = "03-hardware.md §9: \"publication requires `Running`, and reset consumes it, producing a new epoch that invalidates all prior receipts\" / \"per-queue reset (when negotiated) or full reset establishes quiescence\".\n\nplans/M7.md item H2b / **decision 23**.\n\n**What machine v1 can do.** Full reset: `RunningDevice.reset(queue=mut q) -> RunningDevice` — consumes `Running`, bumps the queue's live `current_epoch` in control-pool bookkeeping, yields `Running` again. Claim/negotiate/start are authority-only on this target (06 §3; H1/E1), so re-walking the chain would invent a second `configure` for a queue that already exists. Per-queue reset: **fail closed by name** — `VirtQueue.reset` rejects citing `RingReset`, which `DEVICE_FEATURES` does not offer (`golden/err-queue-reset-unoffered`; required-feature twin `golden/err-device-required-unoffered`).\n\n**The epoch check.** `prepare_block` stamps `current_epoch` into `SLOT_META_EPOCH`; `drain` compares it to the live book word in `validate_completion_id`'s order (UnknownId → StaleId → DuplicateId) so a reset that leaves `INFLIGHT` set still surfaces as `CompletionFault::StaleId`, not DuplicateId. `golden/err-boot-epoch-stale` is the HVF oracle: publish → device completes → `@task` resets then drains → abort message is exactly StaleId's (`driver fault: stale used-ring id (03-hardware.md §4)`). Vacuity: `golden/boot-blk-roundtrip` is the same shape without the reset and its drain succeeds. Unit `completion_id_unknown_duplicate_and_stale_are_distinct_faults` keeps the four `CompletionFault` abort messages pairwise-distinct (UnknownId / DuplicateId / StaleId / BadLength).\n\n**Dump oracle.** `golden/check-device-reset` pins `DeviceReset` in mwir. `golden/err-device-unknown-op` pins that `reset` on a pre-Running state is a typed rejection naming `RunningDevice`.\n\n**Named gaps (not flipped here).** (1) `CompletionOutcome` / no-auto-retry — **closed** by plans/M8.md item G; see `hardware.completion-outcome.no-auto-retry`, which reuses this clause's own epoch machinery as its `Unknown` producer. (2) Quarantine of DMA slots and \"never reclaim possibly device-owned memory\" — **closed** by plans/M8.md item F (`hardware.dma.reclaim-after-quiescence`), which also made this clause's reset the point at which the *device* is quiesced: `RunningDevice.reset` now traps to `mmio::QUIESCE_MMIO_ADDR` before it bumps the epoch, and the VMM finishes and then stops its model there. `golden/err-boot-epoch-stale` is unchanged and still aborts `StaleId`, which is the evidence the epoch path survived that addition — the alternative quiesce semantics (dropping outstanding chains unexecuted) was rejected precisely because it deleted this golden's own case, verified by running it. Still open: generated recovery turns (`hardware.cancellation.recovery-turn`), region quarantine, sibling epoch-carrying reset errors (structurally singular on a single-flight queue), and the \"declared quiescence bound\" policy arm; M7 driver faults stay image-fatal. (3) Slot-reuse generation for multi-flight (decision 20's free-list) — single-flight uses `INFLIGHT` for the duplicate half."

[[clause]]
id = "hardware.dma.reclaim-after-quiescence"
doc = "03-hardware.md#9"
status = "test"
tests = [
  "golden/boot-dma-reclaim",
  "golden/err-boot-dma-reclaim-early",
  "golden/err-reclaim-payload-not-dma",
  "golden/err-reclaim-pool-mismatch",
  "golden/err-reclaim-pool-if-leak",
  "golden/err-reclaim-pool-if-leak-two-brand",
  "golden/err-boot-dma-region-handoff-group",
  "golden/err-boot-epoch-stale",
]
note = "03-hardware.md \u00a79: \"affected regions and DMA slots are quarantined, per-queue reset (when negotiated) or full reset establishes quiescence, and **only then is memory reclaimed** and the cancellation resolved\" / \"If the target cannot prove quiescence within its declared bound, it quarantines the device and pool under an explicit policy or goes target-fatal; it **never reclaims possibly device-owned memory**.\" Also 04-compiler.md \u00a71's Hardware paragraph: \"DMA ownership transitions are valid and **no reclaim precedes quiescence**.\"\n\nplans/M8.md item F / **decisions 36\u201340**. Opened and flipped here; before it, `VirtQueue.recover` retired a slot and left its payload where it was, so a recovered pool slot leaked by construction (`hardware.completion-outcome.no-auto-retry`'s own thin list said so, and `golden/boot-receipt-recover` spends a second DMA block precisely because the first is unreclaimable).\n\n**Quiescence is the host's answer, not the guest's assertion (decision 36).** The device on this machine *is* the VMM, so a guest that bumps a word and calls it quiescence has proved nothing. `RunningDevice.reset` now performs a trapping store to `mmio::QUIESCE_MMIO_ADDR` **before** it bumps the epoch, naming this queue's own quiesce-count word; 06-machine.md \u00a75 blesses the trap in the same sentence that forbids hot-path ones (\"MMIO-shaped register access exists only on setup/**reset** paths, where a trap is fine\"), so no normative edit was owed. The VMM's handler refuses any address but the queue's own (`BlkFault::QuiesceWrongWord`), refuses a quiesce on an image with no `blk` device, and otherwise **finishes then stops**: `BlkDevice::quiesce` executes every chain the guest has made available \u2014 returning the completions for the ordinary recorder / used-ring path, so a straggler still surfaces and still meets the epoch check \u2014 and leaves `last_avail_idx == avail.idx` with the doorbell clear, after which no descriptor published before the call can ever be walked. Only then does it increment the count word in guest memory. `SLOT_BOOK_QUIESCED` is the one word on this machine nothing in the guest writes.\n\n**Rejected: drop the outstanding chains unexecuted**, which is what a hardware reset does. It is a defensible reading and cheaper to argue, but it deletes the only route by which a stale completion can reach a driver \u2014 the case \u00a79 spends a clause on and M7 pinned `golden/err-boot-epoch-stale` for (verified by experiment: with the dropping form, that golden's drain finds nothing and the boot fails its own assert instead of aborting `StaleId`). Finishing is also strictly stronger for the property being established: the device is provably *done* with the buffer rather than provably never going to start.\n\n**The gate (decision 37).** `recover` now *quarantines* rather than merely retires: `SLOT_FLAG_QUARANTINED` goes up and the live quiesce count is copied into `SLOT_BOOK_QUARANTINE_STAMP`. `queue.reclaim(pool=P, payload=T) -> own[P] T` refuses unless the count has moved since \u2014 `virtqueue::reclaim_gate` is the one pure function `codegen::emit_queue_reclaim` emits compare for compare, and its two refusals are separately named (\"reclaim of a slot that is not quarantined\" / \"reclaim before quiescence\"). Quarantine is unconditional across all three `CompletionOutcome`s on purpose: a `Completed` slot's descriptor did come back, but making the gate depend on the outcome puts the fail-open reading one branch away, and nothing in \u00a79 asks for it. `reclaim` takes no receipt \u2014 `recover` consumed it (\u00a75, resolve-exactly-once) \u2014 so the payload's brand is *declared* by two bare names, exactly as `img.dma_pool[T](name=P, ...)` declares the same pair when the pool is created.\n\n**Oracles, and what each mutation does.** `golden/boot-dma-reclaim` is the HVF flagship and is built so the mechanism is load-bearing rather than decorative: the image declares **one** DMA block (`count=1`) and the driver holds no spare, so its second publish exists only because the first block came back. Phase 1 recovers (`Completed`, slot quarantined), resets (trap \u2192 quiesce \u2192 count 0\u21921), reclaims \u2014 asserting the reclaimed block still carries the first write's MAGIC, which is the evidence the handle is the abandoned buffer and not a fresh address \u2014 rewrites it and republishes to sector 1; phase 2 claims the result the ordinary way. `golden/err-boot-dma-reclaim-early` is that file with **one line deleted**, the reset, and must abort by name. Mutation-verified, each independently: delete the quiesce store in `codegen::emit_device_reset` \u2192 the count never moves and `boot-dma-reclaim` **aborts**; delete the quiescence compare in `emit_queue_reclaim` \u2192 `err-boot-dma-reclaim-early` **goes green** and its golden fails; stop raising `SLOT_FLAG_QUARANTINED` in `emit_queue_recover` \u2192 `boot-dma-reclaim` aborts \"not quarantined\"; stop incrementing the count in `BlkDevice::quiesce` \u2192 `boot-dma-reclaim` aborts. Unit oracles for the device half: `devices::tests::a_quiesce_finishes_outstanding_work_and_bumps_the_host_written_count`, `no_chain_published_before_a_quiesce_is_ever_executed_after_it` (wipe the buffer, re-ring the doorbell, and the model still writes nothing \u2014 the \"stop\" half, which fails if `quiesce` skips `execute_available`), `a_quiesce_naming_any_other_word_is_refused_by_name`; plus `virtqueue::tests::reclaim_is_refused_until_a_quiescence_separates_it_from_the_quarantine` and `the_book_words_do_not_overlap_and_fit_the_book`. Sema shape: `golden/err-reclaim-payload-not-dma` (the flagship with `payload=` pointing at a `@layout(wire)` struct).\n\n**Thin / deferred, each with an owner.**\n- **~~`reclaim`'s `pool=`/`payload=` unchecked against the queue~~ — CLOSED by plans/M8.md item H attack 1 (2026-07-25), then the if-leak follow-up the same day.** A wrong `pool=` was a real hole: `golden/err-reclaim-pool-mismatch` is `boot-dma-reclaim` with `pool=OtherPayloads` and no later `publish`/`Receipt` store; before the fix it typechecked, booted, and an `own[OtherPayloads] DmaBlock` handle pointed at `BlockPayloads`'s bytes. The first fix restored `quarantined_by_queue` only across `match` arms and **shipped with a hole**: a brand recorded inside `if`/`while` leaked past the branch (`golden/err-reclaim-pool-if-leak` — `recover` inside `if status != 0`, `reclaim` outside; typechecked on the broken tree). With two brands the leak re-opened the original confusion at runtime (`golden/err-reclaim-pool-if-leak-two-brand`: if/else recovers BP vs OP, stashes the other receipt; sema accepted `reclaim(OtherPayloads)` from the leaked else brand; HVF boot with `status != 0` asserted MAGIC through `own[OtherPayloads]` over BlockPayloads bytes). Fixed by folding the map restore into `scoped()` — the same push/pop every `if`/`elif`/`else`/`while`/`for`/`match`-arm already uses — so the next control-flow construct cannot forget it. The *device* half of decision 39 / item P decision 27 is untouched.\n- **Only DMA *slots* are quarantined, not regions — still true, and the affected-region case is unconstructible at revision 0.1 (plans/M8.md item H attack 2).** \u00a79 says \"affected regions **and** DMA slots\". A region here is one of 04 \u00a73's two disciplines (group region anonymous/inferred; pool region nominal — image pool or scoped `with pool`). Enumerated attempts: (1) `with pool(...)` \u2192 `error[unimplemented]: \\`with pool\\` (scoped pools) is not checked yet` (`golden/err-with-pool-unimplemented`); (2) a live handoff/`Receipt` await in any image that also declares `with group` \u2192 `error[unimplemented]: codegen for a handoff \\`await\\` ... inside an image that declares a \\`with group\\` ... must go to 03-hardware.md \u00a79's recovery turn` (`golden/err-boot-dma-region-handoff-group`, one `with group` away from `boot-receipt-handoff`); (3) a bare image-pool region has no source-level region handle distinct from its slots — `DmaShared` is not image-minted and control-pool bytes are not a reclaim surface. **Flip when** a golden boots (or is refused only after) a cancelled `with group` whose frame holds a live `Receipt[P]` (or other device-owned region value) through cancellation/reset and shows the *group region* quarantined separately from DMA slot quarantine — which is exactly `hardware.cancellation.recovery-turn`'s flip condition; until then the \u00a79 \"regions\" half is named, fail-closed, and not silently approximated.\n- **The generated highest-band recovery turn on the owning driver (04 \u00a74) does not exist.** `recover`/`reclaim` run in whatever turn the source calls them from \u2014 for the flagship, the driver's own `@task` bottom half. 04 \u00a74's full teardown order (close admission, cancel child registrations recursively, transfer in-flight receipts to a recovery turn, cleanup nodes in reverse source order, resolve `Cancelled` only when the cleanup graph is empty) is unbuilt; it is also unreachable today, because a device receipt is only ever held in a driver field and caller-side `await receipt` does not execute (plans/M8.md item E). Recorded as a gap under `compiler.cancellation.teardown-order`.\n- **An abandon is still image-fatal** (plans/M6.md decision 12 / M7 decision 8 / M8 shape decision 4). This item lifted the reclaim floor, not the supervision one.\n- **\"Sibling\" reset errors are structurally singular at revision 0.1.** \u00a79's \"a reset may fail sibling requests; every affected owner gets the same epoch-carrying reset error\" has exactly one owner to reach on a single-flight queue (M7 decision 20's free-list is what would create siblings). The one owner does get the epoch-carrying error \u2014 `recover` reports `Unknown` \u2014 so the sentence is satisfied at n=1 and untested above it.\n- **\u00a79's declared quiescence *bound* has no analogue here.** Quiescence is established synchronously inside a trap, so there is no window in which it can time out; the failure mode is the VMM refusing the quiesce, which fails the boot closed \u2014 \u00a79's \"goes target-fatal\" arm. Nothing implements the \"quarantines the device and pool under an explicit policy\" alternative.\n- **`reclaim` is unreachable from `async` code**, failing closed by name in `flowwir_lower` exactly as `claim` and `recover` do.\n- **The VMM mirrors `SLOT_BOOK_QUIESCED`'s offset** (`BlkDevice::quiesce_count_addr`) the same way it already mirrors `DESC_SIZE`/`avail_bytes`/`DEVICE_FEATURES`. A disagreement is not silent: the guest names the address it intends to gate on and the VMM refuses any other, so a drift aborts every reclaim rather than passing one.\n\nplans/M8.md item H Target D (2026-07-25): item F second-quiesce claim verified (a_second_quiesce_bumps_the_count_twice_and_is_not_refused); double-quiesce-before-quarantine cannot open reclaim while stamp==count (double_quiesce_before_quarantine_cannot_satisfy_a_reclaim_that_should_refuse); quiesce finishes every outstanding chain before bumping (a_quiesce_finishes_every_outstanding_chain_before_bumping)."

[[clause]]
id = "hardware.cancellation.recovery-turn"
doc = "03-hardware.md#9, 04-compiler.md#4"
status = "gap"
note = "04-compiler.md \u00a74's device half, and 03-hardware.md \u00a79's \"the receipt moves to a generated high-priority recovery turn on the owning driver\" \u2014 opened as an explicit gap by plans/M8.md item F (2026-07-25) rather than left implied inside a clause that only covers the group half.\n\n**Why it is its own clause.** `actors.groups.cancellation-order` covers 04 \u00a74's group teardown as M6 shipped it, and `hardware.dma.reclaim-after-quiescence` now covers \u00a74's \"quarantines affected regions and pool slots\" for **DMA slots**. What neither covers, and what nothing implements, is the *generated node* half of the same sentence: a highest-band recovery turn synthesized on the owning driver, in-flight device receipts transferred to it, unrelated work running while the driver establishes quiescence, `Cancelled` resolved to the parent only once the cleanup graph is empty and every child is consumed, and recovery turns being included in actor, budget and wait-for analyses.\n\n**What exists instead.** `VirtQueue.recover` and `VirtQueue.reclaim` are ordinary sealed operations the *source* calls, from whatever turn it likes \u2014 for every flagship today, the driver's own `@task` bottom half (`golden/boot-dma-reclaim`). That is a driver protocol, which is what 03 \u00a79 asks for (\"cancelling in-flight work is a driver protocol, not a dropped future\"), but it is not a *generated* one, so nothing transfers a receipt on the author's behalf and nothing is scheduled at a distinct band.\n\n**Why nothing fails open in the meantime.** The transfer has no reachable source shape to be wrong about: a `Receipt[P]` is only ever held in a driver field, because caller-side `await receipt` is typed and lowered but does not execute (plans/M8.md item E, floor `golden/err-driver-message-receipt`), so no group frame can hold one to be transferred when it is cancelled. And an abandon on a driver fault is still image-fatal with a diagnosable line (plans/M6.md decision 12 / M7 decision 8 / M8 shape decision 4), so there is no survivable path that quietly skips a teardown step.\n\n**Flip condition.** Item E makes a receipt reachable from a cancellable frame; a golden then cancels a group with a device operation in flight and shows (a) the receipt arriving at a generated recovery turn on the owning driver rather than at the cancelled frame, (b) unrelated turns running while that driver establishes quiescence, and (c) `Cancelled` resolving to the parent only after the last cleanup node. Owner: not plans/M8.md item F, which deliberately scoped to reclaim; the earliest honest home is a milestone that also owns supervision, since the same sentence's `NotAdmitted`-with-payloads-returned half needs the `CallError` composition plans/M6.md item H3 already names as missing.\n\n**M13 item C cut 8 (2026-07-27).** Normative wording no longer promises a generated highest-band recovery turn: each in-flight receipt is delivered to the owning driver's existing bottom-half `@task` (04 §4 / 03 §9). Flip condition unchanged (first cancellation-under-load golden); the mechanism when it flips is simpler — no generated turn kind, no band."

[[clause]]
id = "hardware.completion-outcome.no-auto-retry"
doc = "03-hardware.md#9"
status = "test"
tests = [
  "golden/boot-receipt-recover",
  "golden/err-boot-receipt-recover",
  "golden/check-completion-outcome",
  "golden/err-completion-outcome-partial",
  "golden/err-retry-after-unknown",
  "golden/err-retry-after-unknown-hoisted",
  "golden/err-retry-after-unknown-wildcard",
]
note = "03-hardware.md §9: `CompletionOutcome = Completed | NotCompleted | Unknown`; \"Source must not auto-retry a non-idempotent operation on `Unknown`\".\n\nplans/M8.md item G / **decisions 17 and 18**. Opened as a gap by plans/M7.md decision 24, whose two flip conditions are met here:\n\n**(a) The receipt resolve path carries the discriminant.** `VirtQueue.recover(receipt=take r) -> CompletionOutcome` is 03 §5's `Recovery` transition: it consumes the receipt (receipts resolve exactly once; dropping one is illegal in every state) and reports what is known about the operation's effect. `CompletionOutcome` is a prelude enum with 03 §9's three variants **in the doc's own declaration order**, and source matches it with the ordinary machinery — `golden/err-completion-outcome-partial` is `check-completion-outcome` with the `Unknown` arm deleted, rejected by the same exhaustiveness pass every module-declared enum gets (`error[match]: match is not exhaustive: missing .Unknown`). No stringly-typed anything and no hand-compared `u8`: `virtqueue::OUTCOME_*` are positions in `prelude::builtin_enum_variants(\"CompletionOutcome\")`, and unit `outcome_tags_match_the_prelude_enum_order` is the lock.\n\n**`Unknown` has a real producer, not a test hook.** `virtqueue::recover_outcome` reports `Unknown` when the slot's stamped epoch is not the queue's live epoch (M7's reset/epoch path — `hardware.reset.epoch-invalidates`) or when the slot is still `INFLIGHT`; `Completed`/`NotCompleted` come from the virtio-blk status byte of a slot the device returned under the live epoch. `golden/boot-receipt-recover` is the HVF oracle and reaches two of the three on one queue: phase 1 publishes a write, the device completes it, `drain` resolves it and `recover` reports **Completed**; phase 2 publishes a second write, `drain` resolves it, then `RunningDevice.reset` bumps the epoch and `recover` reports **Unknown** — 03 §9's \"After a reset, a write may have happened\", staged so the epoch test is the only thing that can produce it (the pre-reset drain had already resolved the slot). Vacuity: `golden/err-boot-receipt-recover` inverts phase 2's expectation and must abort; because phase 2 is only entered after phase 1's `Completed` arm ran, that one abort proves both arms are reached. Mutation-checked: deleting the epoch compare in `codegen::emit_queue_recover` makes the boot golden fail.\n\n**`recover` returns no payload, deliberately.** §9 forbids reclaiming possibly device-owned memory, so the retired slot's `own[P] T` stays where it is. That is why the outcome rides on `recover` rather than on `IoCompletion` (whose `payload` field 03 §3 normatively returns ownership through) — `claim` remains the resolved path and is unchanged.\n\n**(b) Re-issue after `Unknown` is a named rejection.** An operation is declared non-idempotent by a **required** `idempotent=` literal on `prepare_block` — the compiler cannot infer it (a fixed-bytes write to a fixed sector is idempotent, an append is not, and both spell the same call), and a default in either direction would be the compiler guessing. The declaration is carried by the operation's *type* (`QueueOp[P, <idempotent>]`), so both sites are covered: `golden/err-retry-after-unknown` rejects a `prepare_block(idempotent=false)` written inside a `CompletionOutcome.Unknown` arm, and `golden/err-retry-after-unknown-hoisted` rejects the `publish` of an operation prepared *outside* the arm. `golden/err-retry-after-unknown-wildcard` pins the over-approximation: any arm that *can* match `Unknown` (a wildcard, a plain binding) counts, because the fail-open reading is the one that lets a write land twice. `golden/check-completion-outcome` is the positive twin — the identical source with `idempotent=true`, which is legal.\n\n**Thin, and named as such.** The rule is lexical over match arms, so a re-issue laundered through a *helper call* made from an `Unknown` arm is not caught (the helper's own body has no arm around it); closing that needs an effect-style propagation this milestone did not buy. `NotCompleted` and the still-`INFLIGHT` `Unknown` arm are live in `recover_outcome` and unit-tested, but no boot golden reaches them (the VMM's blk model returns status OK for every valid request, and the flagship drains before recovering); `RecoverOutcome::NotRecoverable`'s abort is likewise unit-covered only. `prepare_block`'s own `idempotent=` shape rejections (duplicate label, `take`/`mut` mode, non-literal) follow the existing labelled-argument family and are covered as one by `golden/err-prepare-block-take`. DMA reclaim after a recovery — quarantine — was this item's own re-homed residue and is **closed** by plans/M8.md item F: `recover` now raises `SLOT_FLAG_QUARANTINED` and stamps the queue's host-written quiesce count, and `VirtQueue.reclaim` hands the payload back only once that count has moved (`hardware.dma.reclaim-after-quiescence`). Nothing else about `recover` changed — it still returns no payload."

