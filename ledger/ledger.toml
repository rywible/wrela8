id = "comptime.eval.quotas"
doc = "02-language.md#12"
status = "test"
tests = ["golden/err-comptime-quota", "xtask:bench"]
note = "Finite step/memory/call-depth budgets (plans/M3.md decision 6), fixed revision-0.1 constants (`crates/wrela-compiler/src/eval/quota.rs`; 02 \u00a72.1 revised 2026-07: revision 0.1 has no build configuration, so these constants are the language-defined quotas — an override mechanism arrives only with a demonstrated need): `MAX_STEPS = 20_000` (every loop iteration and function/method/init/closure call ticks one — `Interp::tick_step`, called from `Interp::enter` so calls and `const` cross-references are covered uniformly, plus directly at each `while`/`for` iteration), `MAX_MEMORY = 10_000_000` (`Value`-weight units — `Value::weight`, one level deep plus children, charged at every aggregate construction site: array/tuple/struct/enum literals, decoded string/byte-string text — `Interp::charge`), `MAX_CALL_DEPTH = 1_000` (this module's own addition beyond the plan's decision text, for the same reason `sema::bodies::MAX_GENERIC_DEPTH` exists one layer up: a single step can itself recurse arbitrarily deep with no loop in sight, so the step quota alone cannot promise this process's own native stack never overflows first — `Interp::enter` depth-checks every call/const-reference frame against it). Exceeding either budget is the same `error[comptime]` build-error shape as any other abandonment (comptime.eval.abandonment-is-build-error), naming the hottest stack (04-compiler.md §8's own \"a build error with the hottest stack\"), no wall clock anywhere. `MAX_STEPS` is deliberately kept far below the plan's own \"e.g. 1,000,000\" suggestion: `xtask bench compiler`'s check lane (plans/M2.md item I) locks lex+parse+`sema::check` — now including const evaluation — over the *whole* golden corpus against one combined threshold (`bench/thresholds.toml`), so a single quota-exhausting golden case's own runtime has to stay a small fraction of that budget rather than dominate it; 20,000 steps keeps golden/err-comptime-quota (an unconditional `while true` loop in a `const`-called `fn`) at roughly 1-2ms, well inside headroom (`bench compiler (check lane)`: median ~27ms against the locked 40ms threshold, verified at commit time). golden/err-comptime-quota: `error[comptime]: step quota exceeded (20000 steps)`, naming the two-deep stack (`RESULT`, `spin`) — the loop never reaches integer overflow (`total`'s own u64 range) before the quota fires, so this pins the quota path specifically, not arithmetic abandonment."

[[clause]]
id = "comptime.tests.build-tier"
doc = "02-language.md#12.2"
status = "test"
tests = ["golden/check-tests-arith", "golden/check-tests-program", "golden/check-tests-mixed", "golden/err-test-params", "golden/err-attr-duplicate-marker", "golden/err-attr-marker-on-method"]
note = "M4-F sweep fix (2026-07-23): `bodies::check_marker_attr_shape` — the `@test`/`@image` marker family is at most one per fn (a duplicate or a conflicting pair used to collapse silently through `find`/`any`) and only valid on a top-level fn (on a struct member the marker used to be ignored entirely, never registering the fn as a test or image candidate — a silent accept). golden/err-attr-duplicate-marker, golden/err-attr-marker-on-method. `wrela test <file.wr>` (plans/M3.md item E, decision 9): runs sema (`sema::check_typed`), then every `@test` fn's own verdict, in *declaration* order, each under its own fresh `Quota`, printing a pinned report to stdout — never fail-fasts across tests (every declared test always gets a line; a `FAILED` line anywhere still means the report itself is the complete, stable dump). Sema (`crates/wrela-compiler/src/sema/bodies.rs::test_attr_kind`, wired into `bodies::check`'s existing per-`Item::Fn` loop) is the *only* attribute-shape validation this milestone adds — before this item, `@test`/`@test(runtime)` (like every attribute besides `@image`) went completely unvalidated: parsed onto `ast::Attr`, carried onto every declaration's `attrs: Vec<Attr>`, and never read again by any pass. `test_attr_kind` recognizes bare `@test` (`TestKind::Comptime`) and `@test(runtime)` (`TestKind::Runtime`, the bare argument name `runtime`, nothing else), rejects a `@test` fn declared with parameters (`error[type]: \\`@test\\` fn \\`<name>\\` takes no arguments` — decision 9's own \"@test fns with parameters: diagnose\"; golden/err-test-params) and a malformed attribute argument (`error[type]`, same category — `xtask`'s fixed `SEMA_CATEGORIES` set, plans/M2.md decision 1, is not extended for this), and fails a generic `@test` fn closed (`error[unimplemented]: \\`@test\\` on a generic fn is not checked yet`, symmetric with `@image`'s own whole-body fail-closed a few lines up in the same loop) rather than silently registering nothing. A validated `@test` fn's own body is checked exactly like any other fn's (decision 9's own \"ordinary fn checking\"): no new analysis. The typed tree gains one small, honest producer addition mirroring `TypedStruct::fields`/`TypedProgram::enums`'s own precedent (`sema/typed.rs`): `TypedProgram::tests: Vec<TestDecl>` (`TestDecl{name, kind}`), appended in the same per-item loop that already walks `module.items` in source order — declaration order, not `BTreeMap` order, is the one fact `wrela test` needs that nothing in the typed tree recorded before this — not rendered by `--stage=typed`'s own `dump` (no `check-tests-*` case has a `typed.txt` at all, only `check.txt`/`test.txt`; `cargo xtask golden --update` touched zero pre-existing expectation files, confirming the `--stage=typed` grammar is untouched by this item). The evaluator side is two small additions to the existing M3-B/M3-C machinery, no new abstraction: `eval::interp::eval_test(program, name)` (a fresh `Interp`/`Quota` per test, calling the already-existing `run_call` on the resolved zero-param fn — mirrors `eval_const`'s own top-level entry point) and `eval::run_tests(program)` (the report itself: classifies the whole program once via `legal::classify` — decision 7/M3-C, already merged — then for each `TestDecl` in order: `Runtime` always prints `test <name>: FAILED \\`@test(runtime)\\` is not run yet (M5: generated image tests)` per decision 10's own named M5 gap (the declaration is legal per 02 §12.2 — a generated image test on the wrela machine runner — sema accepts its body normally; this is the one place that declines to *run* it, not a build error); `Comptime` first re-checks `legal::require_legal` against that same key — `Illegal` prints `test <name>: FAILED <require_legal's own message> (M5: illegal-closure tests run as image tests)`, today unreachable end-to-end (no illegal operation is representable in the typed tree yet — `eval::legal`'s own module doc — so this path is wired through, not exercised by a golden, the identical honest gap `comptime.legality.inferred` already discloses) — then actually evaluates via `eval_test`, printing `test <name>: ok` on success or `test <name>: FAILED <first line of the abandonment message>` on any `EvalError`). Report format (chosen once, pinned by every `golden/check-tests-*`/`err-test-params` case's own `expected/test.txt`, never varied): `test <name>: ok` / `test <name>: FAILED <message>` per test, one final `<N> passed, <M> failed` summary line; a file with zero `@test` fns prints only that summary (`0 passed, 0 failed`) — verified directly (not golden-pinned, since no golden case needs a zero-test file) against `check-const-eval`'s own input. `crates/wrela-compiler/src/bin/wrela.rs::test_cmd` is the CLI surface (`wrela test <file.wr>`): a lex/parse/sema failure prints that stage's own diagnostic and exits `FAILURE` with no test report at all (there is no checked program to run tests out of); otherwise prints `run_tests`'s report and exits `FAILURE` iff any line is `FAILED`. `crates/xtask/src/main.rs`'s golden runner (`golden`) learns one more expectation-file meaning alongside every `--stage=<name>` one: `test.txt` means \"run `wrela test <input.wr>`, compare its stdout\" — and, uniquely among expectation files, a nonzero exit is *not* itself pinned as a failure (decision 9: `wrela test` exits nonzero exactly when some test failed, an expected outcome `golden/check-tests-mixed`/`golden/err-test-params` deliberately exercise, not a runner malfunction) — `xtask check` already calls `golden(false)`, so this ran inside `check` with no separate wiring needed. Four goldens: golden/check-tests-arith (the required boundary-arithmetic acceptance suite, 02 §6.1 — u8 wrap past `MAX`/`0` via `+%`/`-%`, `i64`/`i8` `MIN`/`MAX` wrap identities, truncating-toward-zero division/modulo sign at a negative dividend and a negative divisor, a truncating div/rem identity — all seven `@test`s `ok`), golden/check-tests-program (loops — an iterative `fib`/`gcd` — a `mut self` struct method, `match` over a payload-carrying enum, a `for` over a fixed array folding `+%`, and a generic `identity[T]` fn, seven hand-verified `@test`s, all `ok`), golden/check-tests-mixed (the report's other three lines: an ordinary failing `assert`, a quota-exhausted `while true`, and a `@test(runtime)` declaration — `1 passed, 3 failed`, `wrela test` exiting nonzero, exactly what decision 9 asks the report to still show stably), golden/err-test-params (the arity diagnostic, at the `check`/`typed` stages same as any other sema error — `@test` never reaches `wrela test`'s own report when sema itself already rejects the file). A real evaluator bug surfaced building golden/check-tests-arith's own `i64::MIN`/`i8::MIN` wrap identities and was fixed in the same commit (`eval::interp`'s `TypedExprKind::Neg` arm): a negated integer literal (`-128`, `-9223372036854775808`, the only shape `sema::bodies::check_unary_neg`'s `Expr::Int` arm ever produces) stored its *positive* magnitude at the outer `Neg`'s own already-range-checked target type; evaluating that positive magnitude as a standalone `Value` first (`value::make_int` truncating it to the target width) before negating silently two's-complement-wrapped exactly the `MIN` literals' own positive magnitude to `MIN` already, so negating a second time abandoned an operation sema had already proved legal (`const MIN8: i8 = -128` used to fail `error[comptime]: arithmetic overflow in unary \\`-\\`` — verified by hand before the fix, then fixed by decoding the literal's own signed value directly in `i128` and negating before ever truncating to the target width). `cargo xtask fuzz sema --iters 200000` clean (seed=1) — this item's own `@test`/`test_attr_kind` sema footprint is exercised by the fuzzer's corpus-mutation/rotation passes exactly like every other declaration shape."

