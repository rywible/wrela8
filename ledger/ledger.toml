id = "comptime.eval.scalar-exact"
doc = "02-language.md#6.1"
status = "test"
tests = ["golden/check-const-eval", "golden/check-const-arg-eval"]
note = "The comptime evaluator's own scalar arithmetic (plans/M3.md item B, `crates/wrela-compiler/src/eval/`): `value.rs`'s `Value` is one plain enum, scalars stored at target width (a distinct Rust integer type per wrela scalar type — `U8(u8)` .. `Isize(i64)` — rather than one wide host integer plus a tag, mirroring `sema::types::Type`'s own \"dumb, no seams\" shape). Ordinary `+ - *` and unary `-` abandon on overflow (checked in `i128` against the target type's own bounds — `eval_ordinary`/`eval_neg`); `+% -% *%` wrap modulo `2^width` (`eval_wrapping`, native `wrapping_*` then masked to width/signedness — `mask_to_width`); division/remainder truncate toward zero and abandon on division by zero and the signed `MIN / -1` overflow case (`eval_div_rem` — bounds-checked *after* the `i128` division, not via `checked_div`'s own native-width overflow detection, since running the division in `i128` is wide enough that `i32::MIN / -1` never overflows `i128` itself; this exact gap was caught live by this item's own unit test, `eval::value::scalar_arithmetic_tests::signed_min_div_neg_one_abandons`, before it ever reached a golden); shifts abandon on an out-of-range count or (`<<` only) lost high bits, `>>` is arithmetic (sign-filling) for signed types and logical for unsigned (`eval_shift`); `.to[T]()` is a checked conversion (`eval_to_scalar`). `crates/wrela-compiler/src/eval/value.rs`'s own `scalar_arithmetic_tests` module pins 20 hand-computed cases against 02 §6.1's own rule table directly (overflow/wrap boundaries at `u8`/`i8`/`u16`/`i32` widths, truncating-division sign, division-by-zero, `MIN / -1`, shift lost-bits/out-of-range/arithmetic-vs-logical, bitwise, NaN comparison, checked `.to` in- and out-of-range) — the required \"at least a dozen\" table, run via `cargo test -p wrela-compiler`. golden/check-const-eval exercises this end-to-end through the integration surface (comptime.eval.abandonment-is-build-error's own note): a `const` initializer computing `BASE * 2` and a separate `const` calling a recursive `fn factorial` both evaluate and accept cleanly (`--stage=check`/`--stage=typed`), proving real arithmetic and real calls now run at comptime rather than only type-checking. golden/check-const-arg-eval proves the *other* integration surface — `sema::generics::eval_const_expr` (M2-H's own literal/const-name/fieldless-variant-only subset, plans/M2.md decision 4) now runs the real evaluator too: `Slot[u64, FOUR]` instantiates where `FOUR`'s own initializer is `TWO + TWO` — under the old code this failed closed (`eval_const_expr`'s `Expr::Binary` case was an explicit `error[unimplemented]`, golden/err-generic-const-arg's own `Ring[u64, 4 + 4]` pins that this still holds for an *inline* arithmetic argument, since the call-site bracket grammar itself — `resolve_call_type_arg` — was deliberately left untouched, decision \"if [the parser doesn't accept expression const args], an evaluated const-name chain is fine\"); the typed dump shows `List ty=[Option[u64]; 4]` — the real evaluated length, not a symbolic one. `generics.rs`'s own const-argument evaluation is deliberately scoped narrower than a plain `const`'s (`build_consts_program`, a throwaway consts-only `TypedProgram` built from `ModuleCtx` on every call — it is not threaded the fully assembled program, since half of `eval_const_expr`'s own callers run *during* that program's assembly, before it exists): a const-generic argument that calls a plain `fn` is not yet supported and fails closed, naming the missing callee, exactly like any other unimplemented construct — 02-language.md §6.3's own value vocabulary (`bool`/`char`/an integer/a fieldless enum) never needed a function call to produce one in the first place, so this is a documented, narrow boundary, not a silent approximation."

[[clause]]
id = "comptime.eval.abandonment-is-build-error"
doc = "02-language.md#6.1"
status = "test"
tests = ["golden/err-comptime-overflow", "golden/err-comptime-assert-in-const"]
note = "Comptime abandonment — overflow, a failed `assert`, out-of-bounds access, an explicit `panic` — is a build error, never a runtime panic (02-language.md §6.1: \"build error at comptime, abandonment at runtime\"; plans/M3.md decision 5). Mechanism (`crates/wrela-compiler/src/eval/interp.rs`): every evaluation function threads one `Unwind` error channel through Rust's own `?` (`Unwind::Error(EvalError)` alongside the ordinary, non-diagnostic `Return`/`Break`/`Continue` control-flow variants — only `Error` ever reaches a caller outside the module); `Interp::abandon` builds an `EvalError{message, stack}` capturing the *live* comptime call stack at the exact point of failure (outermost — the `const`/generic-argument context that kicked off evaluation — first, innermost last; `Interp::enter`/`leave` push/pop one frame per call *and* per `const` cross-reference, so a `const`-to-`const` cycle fails closed the same way unbounded call recursion does). `eval/mod.rs::to_sema_error` renders one `EvalError` as a `sema::SemaError` with category `comptime`: typed nodes carry no spans (decision 1), so — reusing the same two fields `sema::generics`'s own multi-line requirement-chain diagnostic already introduced, rather than growing a second error shape — the primary line carries no ` at L:C` (`omit_location = true`) and each stack frame is one `extra_lines` entry (`  while evaluating \\`name\\``). Integration surface (`sema::mod::check_typed`, after `generics::check` so a `const` calling into a generic-fn instantiation can resolve it): every module-level `const`'s own initializer is evaluated once (`eval::check_consts`), fail-fast in `BTreeMap` (name) order; `sema::mod::check` now delegates to `check_typed` and discards the typed program (its own doc comment already promised identical diagnostics/behavior either way), so a `const` that abandons is a build error at both the `check` and `typed` stages. golden/err-comptime-overflow: `const OVERFLOWED: u8 = BIG + 10` where `BIG = 250` — `error[comptime]: arithmetic overflow in \\`+\\`` naming the one live frame (`OVERFLOWED`; `BIG`'s own reference frame is already popped by the time the addition itself overflows, since it evaluated cleanly). golden/err-comptime-assert-in-const: a plain (non-`comptime`) `assert` inside a plain `fn` called from a `const` — `error[comptime]: assertion failed: must be non-negative`, naming the two-deep stack (`RESULT`, then `check_range`), proving abandonment inside a *called* fn's own body, not just a bare initializer expression, is caught and diagnosed with its full call path. `xtask fuzz sema`'s own fixed diagnostic-category set (plans/M2.md decision 1) is extended with `comptime` in the same commit (`crates/xtask/src/main.rs`'s `SEMA_CATEGORIES`), since `sema::check` can now legitimately produce it."

[[clause]]
id = "comptime.eval.import-closure"
doc = "02-language.md#12"
status = "test"
tests = ["golden/check-import-comptime-struct", "golden/check-import-comptime-decls", "golden/check-import-comptime-cycle", "golden/err-import-comptime-private-decl", "golden/err-import-comptime-shadowed-decl"]
note = "plans/M9.md item A1b, and a defect that predates it: 02 \u00a712 says `comptime` evaluates *ordinary typed wrela*, and 02 \u00a72 says every name that is not prelude or a scalar \"is imported\" and that \"import cycles between modules are legal\". Taken together, a comptime context must be able to reach a declaration in another module of the build closure, without ordering the modules. The evaluator could not: `sema::bodies::check` fills `TypedProgram::consts`/`fns`/`structs`/`enums` from *this* module's own `module.items` only, and `eval::interp` is handed one `TypedProgram` and nothing else \u2014 so a comptime-reachable construction of an imported `struct` abandoned with `error[comptime]: internal error: struct \\`Pair\\` not found`, a read of an imported `const` with `internal error: const \\`K\\` not found`, a call to an imported `fn` with the generic-instantiation boundary message (which named the wrong cause), and an imported `enum`'s variant with `evaluating a generic enum instantiation's variant ... is not supported yet` (also the wrong cause). Reachable from ordinary source since M4 item A; two of the four were `internal error:`, which CLAUDE.md calls a bug rather than an outcome and which `cargo xtask fuzz` treats as a find. No fuzz lane found it because every lane operates on a single file and no single file can construct a multi-module closure \u2014 recorded here because that is a statement about the lanes, not about this defect.\n\nMechanism (decision 13): `TypedProgram::imported` (`sema::typed::ImportedDecls`) is the evaluator's read-only window onto the rest of the closure \u2014 `consts`/`fns`/`structs`/`enums` keyed by the importing module's own local (possibly aliased) spelling, which is the same key the typed tree uses (sema.names.imported-types, decision 9), plus the exporter's `instantiations` under their own canonical-key spelling. `sema::mod::splice_imported_decls` fills it after every module's `bodies::check`/`generics::check` has finished, from bindings alone \u2014 read-only reuse of already-finished output, never a re-check, exactly like the `ModuleCtx` splice one layer up, which is what keeps import cycles free (golden/check-import-comptime-cycle: two mutually importing modules whose comptime evaluation crosses the cycle in *both* directions \u2014 module `a`'s `const` constructs `b`'s struct and calls `b`'s fn, whose body constructs `a`'s struct and calls its method; the evaluated result, 6, is pinned as `Arg label=depth value=6`). It is a separate field rather than extra entries in the four maps above because `lower`/`flowwir_lower`/`layout`/`codegen` all iterate those maps to emit each declaration exactly once; merging would emit an imported fn once per importer. `eval::interp`'s five lookups (`resolve_fn`, `resolve_struct_by_type`, `struct_of`, `variant_index`, the `Const` arm) and `eval::mod`'s two exhaustive-test enum lookups read \"own, else imported\". All four declaration kinds are fixed and each one's *value* is pinned, not merely its acceptance: golden/check-import-comptime-struct (an imported struct constructed at comptime, a field read and a method call on it \u2014 the exact reported repro \u2014 pinned as `Arg label=mailbox value=16`) and golden/check-import-comptime-decls (`base value=5` from an imported `const`, `scaled value=15` from an imported `fn`, `weighted value=7` from an imported `enum`'s variant passed to an imported `fn` that matches on it in its own module).\n\nDecision 14: `eval::check_comptime` and the two `eval::legal` whole-program checks move out of `check_program_typed`'s per-module loop into their own loop after the splice \u2014 the splice needs every module's `TypedProgram` complete. The visible consequence is diagnostic *ordering* across a closure with errors in more than one module: the first diagnostic is now the earliest in pass order, then module order, which is what the single-module pipeline this mirrors already does. No existing golden moved.\n\nDecision 15, the fail-closed half, stated as a boundary rather than discovered later: the evaluator walks one `TypedProgram`'s flat name tables and has no notion of which module a body came from, so an *imported body* is evaluated against the *importing* module's tables. Two shapes follow, and both are named rather than approximated. (1) A name only the exporting module has \u2014 a private helper, const, or type \u2014 is absent from the importer's tables; `splice_imported_decls` precomputes every such name in `ImportedDecls::unresolvable` and `Interp::abandon_missing` prints it instead of `internal error:` (golden/err-import-comptime-private-decl). (2) Worse, a name the exporting module has *and the importer resolves differently* would silently resolve to the importer's declaration \u2014 a wrong value, not a missing one \u2014 so a body-bearing splice (`const`/`fn`/`struct`; an `enum` is a variant-name list with no body and always crosses) from a module that shadows any name with its importer is **withheld**, turning the wrong value back into a named miss (golden/err-import-comptime-shadowed-decl). Shadowing is tested by *value*, not by declaring module, because `bodies::check` injects the six fixed prelude enums (`Target`, `Restart`, `BootError`, `IoError`, `DriverMode`, `CompletionOutcome`) into every module's own `TypedProgram::enums`, so every pair of modules in every build \"declares\" all six; two structurally identical declarations are also indistinguishable to the evaluator, so value equality is the honest test. Making the evaluator evaluate each body against its own module's program is the real fix and is not A1b's \u2014 it changes every `eval::` entry point's signature; A1b's contract is exactly \"the declarations a module *names* are evaluable, and everything else says so out loud\". Also left standing deliberately: `eval::legal::classify` stays module-local, so plans/M4.md item B's own pinned refusal of a cross-module callee *from an `@image` fn* (golden/err-image-intrinsic-in-cross-module-helper) is unchanged \u2014 an `@image` fn may read an imported `const` (not a call) but still may not call across a module boundary. Cross-module comptime *legality* is a separate question from cross-module *resolution* and is not opened here."

[[clause]]
id = "compiler.lower.import-closure"
doc = "04-compiler.md#3"
status = "test"
tests = ["golden/check-import-lower", "golden/err-import-lower-body-helper", "unit:backend_fn_key_census_matches_the_written_down_table"]
note = """plans/M9.md item EE (half 1): the backend sees the import closure the evaluator already saw after A1b.

**The defect, measured at `ab85f36`.** Three shapes, all ordinary source through a project root, all with a working comptime tier (`wrela test` ok): an imported struct's method (`p.sum()`), an imported plain fn (`twice(21)`), and an imported struct's fields (`p.a + p.b`). The first two failed closed at `--stage=mwir`/`asm` blaming \"an unresolved generic instantiation\" — the wrong cause (`lower::resolve_fn` never consulted `TypedProgram::imported`). The third was worse and a bug by house rule: `error[unimplemented]: internal error: struct \\`Pair\\` not found`, reachable from ordinary source — the exact shape A1b fixed for the evaluator, never for lower. A2's decision 82 had wired *enums* into `lower`/`flowwir_lower` because `check-stdlib-loaded` needed it; structs and fns were left.

**Mechanism (decisions 90–91).** `lower::resolve_fn` / `resolve_struct` / `field_index` and `flowwir_lower::resolve_callee_fn` / `field_index` / StructLiteral lookup read \"own, else imported\", mirroring `eval::interp`. Emission still does not merge into `TypedProgram::fns`/`structs` (decision 13 rejected that — `try_layout_program` lowers every module and would emit once per importer). Instead `lower_program` / `flowwir_lower::lower_program` also walk `imported.fns`/`structs`/`instantiations` and emit under the *local* spelling (decision 9), so a Call keyed `Pair.sum` / `twice` / `Duo.sum` resolves in the importer's own MWIR without inventing a second name table. An unaliased name that also exists in the exporter's own lower may collide at `merge_mwir_programs` last-wins — already disclosed there. Genuine residue fails closed naming the import closure or the splice's own `unresolvable` note — never \"an unresolved generic instantiation\" for a plain imported name, and never `internal error: struct \\`X\\` not found` from ordinary source.

**Pinned.** golden/check-import-lower covers all three shapes in one case, dumped at `--stage=mwir` and `--stage=asm`, with comptime `@test`s plus guest `@test(runtime) guest_import_lower` (plans/M9.md item KK) so mwir/asm pin `Pair.sum` / `twice` / `drive` / `field_sum` / `method_sum`, and `Arg label=mailbox value=71142` (fields=7, method=11, fn=42 → `7*10000 + 11*100 + 42`) so \"accepted\" and \"correct\" are different results. `cargo xtask diff-eval` agrees on all four once half 2 widens the oracle (clause `compiler.eval.matches-backend`).\n\nplans/M9.md item FF closes the aliased-layout residue decision 95 recorded: `merge_layout_ctx` now installs the local spelling, so `check-import-alias-method`/`check-import-alias-pattern` are `diff-eval` agreements rather than lowering-skips. See `sema.names.imported-types` for the four-layer sequence.

**Body-only helper at lower (plans/M9.md item D3, decisions 321–322).** An imported body's call to a name present only in the exporter (not in any imported signature) refuses with the splice's `unresolvable` note via `LowerError::named` / `FlowError::named` — never `unimplemented`'s \"lowering … not implemented yet\" wrapper, which doubled the suffix (`… is not supported yet not implemented yet`). Pinned: `err-import-lower-body-helper`. Same-spelling free fns across modules remain last-wins at `merge_mwir_programs`; that collision is currently unreachable behind this refusal, and whoever lifts the refusal must fix merge keying in the same commit.

**H3 host-only keying (plans/M9.md item KK, decision 366).** `is_host_only_fn` must compare the full CalleeKey against `@image` / comptime-`@test` names — bare-member comparison (`build` from `Maker.build`) falsely dropped every `*.build` method. Guest restore of `check-import-reachable-type` surfaced it."""

