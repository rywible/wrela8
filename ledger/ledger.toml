id = "image.report.dma-pools"
doc = "03-hardware.md#3"
status = "test"
tests = ["golden/check-dma-pool", "golden/appliance", "golden/image-project", "golden/boot-device-bringup", "golden/check-pool-two-devices", "xtask:report-determinism"]
note = "03-hardware.md \u00a73: \"A DMA pool is declared in the image with size, purpose, device reachability, alignment, and coherency policy.\" DMA pool accounting in the image report is a plans/M7.md exit criterion; this clause is it.\n\n**Two line kinds, and the split is the whole point.** `layout::render_layout_section` appends, after the actor tables, one `Pool name= kind= payload= slots= slot_bytes= base= size= align= coherency= device=` line per bound pool \u2014 the *accounting* line, carrying all five declared facts \u2014 and then one `BlkPool name= device= base= size=` line per **device-reachable** pool and no others \u2014 the *mapping* line, in the exact format `wrela-vmm`'s own `parse_report` already reads (plans/M7.md item F). A pool with no `device=` never produces a `BlkPool` line, so no device can reach it. plans/M8.md item P added the mapping line's own `device=device#N` (and `BlkDevice`'s), which is what makes 03 \u00a73's possessive real \u2014 see `hardware.dma.pool-reachability`. The set stays *every* device-reachable pool rather than only the modelled device's: the VMM has to know a window exists in order to refuse it to a device that does not own it. `report::render` separately gained the `DmaPool name=... type=...` declaration block it never had (`graph.dma_pools` was unreachable before item D, so the renderer walked `graph.pools` only and would have silently dropped a real declaration); a DMA pool's `device=` renders as an ordinary `Arg` line rather than a section-5 `Edge`, because reachability is a property *of the pool*, not one of section 5's \"logical actor edges\", and section 5 is already written by the time pools are rendered.\n\n**Where each of the five facts comes from, honestly.** 05-library.md \u00a79's intrinsic surface spells three arguments, not five, and inventing the other two would be worse than deriving them (`eval::image_checks`' own section comment states this once, in code): *size* is derived exactly \u2014 `count \u00d7 sizeof(T)` where `sizeof` is item B's exact-bytes layout (`hardware.layout.exact-bytes`), or `slots \u00d7 max_payload` for the plain form; *purpose* is the form itself, a two-valued fact reported as `kind=dma`/`kind=image` rather than free text nothing supplies; *device reachability* is the DMA form's own `device=`, resolved to a declared device index; *alignment* is derived from the payload's widest scalar field (`layout_alignment`), which is exactly the alignment `check_one_layout` already *enforces* on every explicit `@offset` \u2014 deriving it from the rule that enforces it means the two cannot disagree; *coherency policy* is one value, `coherent`, and it is a machine fact rather than a per-pool one (plans/M7.md decision 5: the flagship has no IOMMU and pools are host-mapped directly, so the machine implements exactly one policy and no source surface anywhere declares a second). Reported because it is normative; not selectable because nothing can select it.\n\n**Determinism** (`image.report.deterministic`, a hard requirement): the only ordering input is `pool_backings`' `BTreeMap` key, so declaration order in the `@image` fn cannot move a window \u2014 `layout::tests::pools_are_placed_in_name_order_each_at_its_own_alignment` places the same set twice and byte-compares, and `cargo xtask report-determinism` re-renders every report-bearing golden twice in-process. Evidence: `golden/check-dma-pool` pins both line kinds for a device-reachable pool and a plain one side by side; `golden/appliance`/`golden/image-project` each gained a `pooldata` section and one `Pool ... device=none` line, which is the whole diff those two moved by; `layout::tests::only_device_reachable_pools_become_blkpool_windows` is the property; `golden/check-pool-two-devices` pins two devices' worth of both line kinds with distinct `device=` fields.\n\n**What is not here.** The *runtime* report `wrela test` writes (`bin/wrela.rs`, hand-built: `Machine revision=`/`Input`/`Section`/`Entry`) does not go through `render_layout_section` and so carries no `Pool`/`BlkPool` line \u2014 an image with a DMA pool still reserves its backing there (`layout_test_image` places `pooldata` too, so the two image flavors never emit different memory maps for the same source) but does not hand the VMM a window. That is inert today and named rather than discovered: an image with a configure'd queue emits `BlkDevice`/`BlkQueue`/`BlkPool`/`BlkAccounting` beside the pool windows (plans/M7.md item E1; `golden/boot-device-bringup`); `parse_report` still refuses a `BlkPool` with nothing to bind it to \u2014 which plans/M8.md item P made per-device: a `BlkDevice device=device#N` with no `BlkPool device=device#N` is refused, while a window naming a device this machine models nothing for is carried and never mapped."

