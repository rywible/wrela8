**G1 (landed).** `DeclField` carries `is_pub`; warn-only census shipped.

**G2 (landed).** Migratable packages gained `pub` where needed; residual was solely the intentional census shape pin.

**G3 (landed).** Cross-module construct/read/write/pattern-bind of a non-`pub` field is `error[sema]` naming the declaring module (`sema/bodies.rs`). Census aggregate flips from warn-only to fail. Goldens: `err-field-private-construct`, `err-field-private-read`, `check-field-pub-cross-module`, `err-field-private-instant`; G1's census shape pin is now `err-field-visibility-census`. Pattern-bind remains a counted column with no revision-0.1 surface."""

[[clause]]
id = "library.time"
doc = "05-library.md#5"
status = "test"
tests = [
  "golden/check-duration-arith",
  "golden/check-time-prelude-types",
  "golden/err-duration-overflow",
  "golden/err-now-in-comptime",
  "golden/err-now-in-isr",
  "golden/err-now-default-in-comptime",
  "golden/err-now-default-in-isr",
  "golden/boot-instant-monotonic",
  "golden/boot-deadline-cancel",
  "xtask:repro",
]
note = """05-library.md §5: `Duration` constructors are ordinary phase-neutral functions; Instant is opaque and monotonic; `now() -> Instant` is a sealed effect forbidden in comptime and ISR context and recorded/replayed.

**plans/M9.md item E (2026-07-25, decisions 300–309).** The doc-vs-code defect: `ms`/`seconds` were compiler intrinsic arms while `ns`/`us`/`minutes`/`hours` did not exist. E deletes those two arms (AA surface 44→42) and lands all six constructors plus `Duration`/`Instant` methods in `stdlib/core/time.wr`. Names stay prelude-visible via `IMAGE_BUILDER`/`ACTOR_SURFACE` so ~194 `seconds(...)` goldens need no import reshape (decision 300); item I still owns whether that auto-visibility survives deleting `prelude.rs`.

**plans/M9.md item LL (2026-07-25, decisions 330–334).** Type-position prelude visibility for `Duration`/`Instant` (const annotation, fn param/return, struct field, local) is the same inject `check_program_typed` already did for value-position constructors — but `--stage=check`'s dump re-ran `declare` without that table and panicked. Fix: `check_dump` / `check_program_dump` render from the DeclItems check produced; dump sites return `SemaError` instead of `expect`. Pinned by `golden/check-time-prelude-types` (check dump + value test). **Docs (scaffolding dissolution Wave 0):** 02-language.md §2 now names the fixed prelude (`Option`/`Some`/`None`/`Result`/`Ok`/`Err`/`panic`/`CallError`/`Admission`), scalar builtins, compiler intrinsic/hardware type names, and toolchain auto-binds for `Duration`/`Instant`+ctors plus AUTO_VISIBLE stdlib enums — matching `sema::prelude_scope` (REVIEW-QUEUE M9-I).

**Constructors.** Ordinary checked `*` overflow — `error[comptime]: arithmetic overflow in '*'` while evaluating `ms` (`golden/err-duration-overflow`). Arith pinned by value in `golden/check-duration-arith` (equality against `ns(...)`, not `.nanos` peeks).

**`now()`.** Stays intrinsic. Comptime refusal unchanged (`golden/err-now-in-comptime`: "`is_ready` uses `now()` (a runtime-only clock read)"). ISR refusal via `eval::legal::check_isr_effects` (`golden/err-now-in-isr`: "uses a runtime clock read (`now()` — not in the ISR effect set)"). Guest lowering: FlowWir `Now` → `codegen::emit_now` trapping load at `CLOCK_MMIO_ADDR`; VMM returns `monotonic_ns()` and logs `ChoiceEntry::ClockRead` (reuses M6's entry — no new tag). Monotonicity proven by `golden/boot-instant-monotonic` (two successive `now()` reads; `Instant.less_than` asserts order) plus existing `xtask:repro` clock-log tamper on `boot-deadline-cancel`.

**plans/M9.md item K1 (decisions 540–544).** Parameter defaults are scanned with the fn for both comptime legality and ISR effects. Call sites store `None` for an omitted slot, so `now()` in `TypedParam::default` was invisible to a body-only scan — `fn stamp(t: Instant = now())` looked Legal/ISR-clean while an omitted-arg call still evaluated `now()`. Pinned: `golden/err-now-default-in-comptime` (clean `error[comptime]`, not the pre-fix `internal error:`), `golden/err-now-default-in-isr` (`on_queue_irq -> stamp`). Field defaults remain the disclosed `eval::legal` scope boundary.

**Instant opacity.** Public API is `now()` + methods; fields are non-`pub`. Cross-module field privacy is a pre-existing language gap (not opened here); Instant struct-literal construction from outside is currently possible and recorded as residue.

**InterruptCell.** Confirms AA: ops need compiler knowledge; constructor is weak; unchanged."""

[[clause]]
id = "comptime.eval.try-propagation"
doc = "02-language.md#8.2, 02-language.md#7.4"
status = "test"
tests = [
  "golden/check-try-err-propagates",
  "golden/check-try-none-propagates",
  "golden/check-try-ok-unwraps",
  "golden/check-try-some-unwraps",
  "golden/check-try-import",
]
note = """02-language.md §8.2, verbatim: "`?` applies to `Result` (and, in `Option`-returning functions, to `Option`): `Err(e)?` runs lexical teardown, applies the target's `from` conversion if needed, and returns from the enclosing function." §7.4 supplies the desugaring half (`Err(e)?` needing conversion becomes `TargetError.from(take e)`). This clause holds the *evaluation* of that sentence, in both implementations of it.

Opened by plans/M9.md item BB (decisions 60-62), which fixed a defect A1b found in passing and the orchestrator reproduced independently at `102e523`.

**The defect.** `eval::value` numbers both builtin sums from zero — `OPTION_NONE`/`RESULT_OK` = 0, `OPTION_SOME`/`RESULT_ERR` = 1 — so a variant index alone does not say which sum it belongs to, let alone whether it is the success arm. `eval::interp`'s `Try` arm asked exactly that: `idx == OPTION_SOME || idx == RESULT_OK`, true for **every** index either sum can carry. Two consequences, both from ordinary single-module source with no imports:

- `Err(e)?` took the success branch and yielded `e` as the **success value**. A silent wrong answer at build time — the worst outcome this project recognizes, since nothing reports anything.
- `None?` took the same branch and popped a payload off an empty `None`: `thread panicked at crates/wrela-compiler/src/eval/interp.rs`, `"Some/Ok always carries one payload value"`. A compiler panic is never an acceptable outcome (CLAUDE.md).

**The fix (decision 60).** Read the sum from the operand's own static type, `inner.ty`, never from the index. `sema::bodies::check_try` has already proved the operand is exactly `Option[T]` or `Result[T, E]` *and* that the enclosing fn returns the same sum, so the type is both available and authoritative; anything else at that node is a named internal error rather than a guess. The two `expect()` calls on the payload became fail-closed `abandon`s in the same edit — a panic is not a diagnostic. Rejected: branching on `expr.ty` as originally suggested, which is the *success* type (`u32` for a `Result[u32, u32]`) and cannot distinguish the two sums at all.

**The backend was already correct, and that is the interesting half (decision 63).** Both lowering paths — `lower::lower_try_sync` (sync bodies) and `flowwir_lower::lower_try_check` (async) — destructure the operand's type first, compare the runtime tag against `RESULT_OK`, and reject a non-`Result` operand with a named `unimplemented`. So `?` on `Option` has never lowered at all, and `?` on `Result` has always lowered correctly. The divergence was one-sided: the comptime evaluator was wrong where the backend was right. `xtask diff-eval` is the oracle built for exactly this class and did not catch it, for a reason worth stating — it compares only `@test` fns that *both* tiers can run, and no golden in the corpus had a `@test` whose comptime evaluation crossed a failing `?`. An oracle that compares two implementations still needs a case that exercises the disagreement; `check-try-err-propagates` and `check-try-ok-unwraps` are now that case (their `@test` fns lower cleanly, so full `diff-eval` boots and compares them), and the two `Option` cases are honest lowering-skips.

**The audit for the same confusion elsewhere (decision 60's second half): clean.** Every use of the four constants was read. `interp::variant_index` and `lower::variant_index` dispatch on the enum *name* first; `eval::image::render_value` and `sema::generics::value_to_const_arg_expr` likewise; `interp::run_init` is guarded by the callee's declared `Type::Result` return; `lower`/`flowwir_lower`/`codegen`/`layout`'s uses are all `Result`-only construction sites in `Result`-typed contexts (fallible `init`, actor reply composition, `Untrusted.checked_le`). `TypedExprKind::Try` was the only place a builtin sum's variant index was tested without the type that gives it meaning.

**Pinned by value, not by acceptance.** Each `check-try-*` case carries a `@test` fn *and* an `@image` whose actor arguments are consts computed through the `?` in question, so `expected/image.txt` pins the evaluated numbers: 1005 (an `Err(5)` propagated, `settle` adding 1000 to a failure so success and failure can never land on the same number), 777 (a `None` propagated), 7/12/1 (`Ok` unwrapping a scalar, a struct, and `unit` in statement position), 30/20 (`Some` unwrapping a scalar and a struct). `check-try-import` runs all four outcomes through an *imported* body — the path plans/M9.md item A1b made live one item earlier, and the path where the defect panicked the compiler rather than merely lying.

**`?`'s `from` conversion closed by plans/M9.md item B.** Decision 61's named gap (`err-try-from-underived`) is retired: `golden/check-deriving-from` and `golden/check-from-explicit` under clause `library.from.conversion` pin the conversion by value in both tiers. The evaluator no longer has a fail-closed arm that cites item B."""

[[clause]]
id = "comptime.eval.mut-param-writeback"
doc = "02-language.md#5.1"
status = "test"
tests = [
  "golden/check-mut-param-writeback",
  "golden/check-mut-param-nested",
  "golden/check-mut-param-properties",
  "golden/err-mut-param-defaulted-writeback",
]
note = """02-language.md §5.1, verbatim: "Non-receiver `mut` and `take` are **mirrored at the call site**, and the operand must be an explicit place." This clause holds the *evaluation* half of that mirroring for `mut`: after a call returns, each non-receiver `mut` parameter's final value is written back into the call-site place.

Opened by plans/M9.md item CC (decisions 68–71 for the evaluator; backend generalization is CC2 under the same clause).

**The defect.** `eval::interp::run_call` returned `(result, final_self)` and removed only `"self"` from the callee frame. `eval_call` therefore had nothing to write back for a non-receiver `mut` parameter, so `bump(mut c)` left the caller's `c` at its pre-call value — a silent wrong answer at build time. Sema already required an explicit place and already rejected non-places (`err-access-nonplace`); the analysis was fine, the evaluator just dropped the result.

**The fix (decision 68).** `run_call` hands back every non-receiver `mut` parameter's final value (declaration order, with its param index). `eval_call` writes each into the matching call-site place via the existing `place_mut` (Local / Field / Index — the same shapes sema accepts). `CallValue` (fn values and closures) does the same; pre-evaluating every argument into a `Value` first would lose the place and reintroduce the silent drop (decision 70).

**Fail-closed residue (decision 69).** A `mut` parameter with a default, called with the argument elided, has no place to mirror into. That is reachable from ordinary source (`fn bump(mut x: u32 = 0): ...` then `bump()`). It now abandons by name (`writing back `mut` parameter `x` through a defaulted argument is not supported`) rather than silently discarding the mutation. Pinned as `err-mut-param-defaulted-writeback`. There is no unaddressable *place* shape: every operand sema accepts as a `mut` argument is a Local / Field / Index chain, and `place_mut` already addresses those three.

**Pinned by value.** `check-mut-param-writeback` has no `@test` (deliberately — the backend is still wrong the same way, so a `@test` would make full `diff-eval` knowingly red between CC1 and CC2). Evidence is the `@image` actor args: `agg=7`, `sca=42`, `nest=9`, `field=11`, `chain=8`, `mix=9`. `mix` is the settle: `mixed(mut a, b, take c) + a` is 9 when `a` is written back to 3 and 7 when it is not, so acceptance alone cannot pass.

**Backend still wrong.** `Inst::Call` still carries only `self_write_back`; non-receiver `mut` has no write-back mechanism in `lower`/`codegen`. That is why `diff-eval` never saw this defect: both tiers agreed on the wrong answer. CC2 owns the generalization.

**CC2 (backend).** `Inst::Call::self_write_back` generalized to `write_backs: Vec<(usize, Temp)>` (args-index → place temp). `MwirFn`/`FlowWirFn` params carry `AccessMode`. Mut params (including scalars) pass by pointer; the callee epilogue writes them back through saved pointers — the same mechanism `mut self` already used. `check-mut-param-nested` carries `@test` fns; full `diff-eval` agrees on all five.

**`check-mut-param-properties` pins the properties, not the cases (orchestrator review).** A directed item closes the shapes it was shown, so this case is written the other way round — as the five ways a write-back mechanism is classically wrong, each with an expected value no other branch reaches. A callee that never assigns its `mut` parameter must leave it alone (5, not 0 and not 6). An early `return` before the assignment must not publish it (3), while falling through to it must (77), and an assignment before an explicit `return` must survive (88). Write-back must compose through nested `mut` frames (2 → 20 → 200). Two `mut` parameters in one signature must not cross-write (102, where a crossed write is 201 and a single write is 100 or 2). A `defer` that touches the parameter after the body's own assignment must be included (31, not 30). Repeated calls in a caller loop must each land (5). A sibling field the callee never assigned must survive (96, where a whole-struct clobber is 90). Full `diff-eval` agrees on all ten between the evaluator and real guest execution, so this is a two-tier property lock, not an evaluator test."""

[[clause]]
id = "library.stdlib.loaded"
doc = "02-language.md#2"
status = "test"
tests = ["golden/check-stdlib-loaded", "golden/err-stdlib-missing", "golden/check-stdlib-prelude-enums", "golden/err-stdlib-enum-corrupt"]
note = """plans/M9.md item A2: the stdlib is loaded as ordinary wrela source.

**What moved.** `IoError` left `sema/prelude.rs` (`HARDWARE_SURFACE`, `builtin_enum_variants`, the per-module `TypedProgram::enums` injection, and `types::resolve_named`'s special arm) and now lives at `stdlib/core/io_error.wr` as `pub enum IoError: OutOfRange` — declaration order preserved bit-for-bit (one unit variant, tag 0). Source that constructs `IoError.OutOfRange` writes `from core.io_error import IoError` (02-language.md §2: the fixed prelude is `Option`/`Result`/`panic`; everything else is imported). Compiler-synthesized `Type::Named("IoError")` sites (`IoCompletion.status`, `reject`'s expected type) keep working by name; `mwir::size_of` still special-cases the unit-tag layout for programs that never import it.

**How it loads.** Explicit only — the loader's existing `from core.X import ...` path (M4 item A) finds `stdlib/core/` via the two-candidate rule, now nested under `core/` (decision 78): sibling `pkgroot.parent()/stdlib/core`, else `CARGO_MANIFEST_DIR/../../stdlib/core`. The module is compiled by the ordinary pipeline ahead of (as part of) the user module's closure; `--stage=check`/`typed`/`mwir` all reach it (golden/check-stdlib-loaded pins `Module path=io_error` / `Enum IoError` / `MakeEnum tag=0`).

**Fail-closed when the tree is missing.** Sibling `stdlib/` without a `core/` subdirectory shadows the toolchain fallback and yields `error[build]: stdlib not found: sibling stdlib/ exists but has no core/ directory` (golden/err-stdlib-missing) — a named diagnostic, not a panic and not `internal error:`. The toolchain-missing half is the same diagnostic with different wording; reachable if the baked-in path is deleted, unit-tested via `core_root`'s Result.

**CLI stages that used to refuse imports.** `--stage=typed`/`mwir`/`flowwir`/`asm` and `wrela test` now share `check_closure` with `check`/`image`/`report`. `golden/err-import-typed-stage` retired; `check_typed`'s API-level fail-closed remains (`unit:check_typed_rejects_imports`). `lower::variant_index` / `flowwir_lower::variant_index` now read `prog.imported.enums` the way `eval::interp` already did after A1b — without that, an imported `IoError.OutOfRange` failed closed as a "generic enum instantiation".

**plans/M9.md item I (2026-07-25):** `sema/prelude.rs` deleted. Five more enums (`Target`/`Failure`/`BootError`/`DriverMode`/`CompletionOutcome`) live in `stdlib/core/*.wr`; variant order is read by `sema::stdlib_enums` (auto-visible without import so goldens stay put; explicit import pinned by golden/check-stdlib-prelude-enums). Option/Result stay language builtins (02 §2). Intrinsic bare names resolve via `intrinsics::is_bare_resolvable`; compiler type names via `types::is_builtin_type_name`.

**plans/M9.md item QQ (2026-07-25):** `stdlib_enums` no longer panics on a corrupt/missing enum file and no longer hardcodes the toolchain tree. Load failures are `error[build]:` naming `stdlib/core/<stem>.wr` (golden/err-stdlib-enum-corrupt; unit `corrupt_enum_file_is_build_error_not_panic`). Location uses `loader::stdlib_core_root` — same sibling-first rule as ordinary `from core.X` imports — so a project's sibling stdlib cannot disagree with the five auto-visible enums (unit `load_table_reads_the_core_it_is_given`)."""

