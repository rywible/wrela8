[[clause]]
id = "docs.examples.wrela-blocks-sema"
doc = "02-language.md#1"
status = "test"
tests = ["xtask:corpus"]
note = """plans/M9.md item J3 (2026-07-25, decisions 536–538): every parseable docs/language ```wrela block and docs/language/examples/*.wr file is sema-classified under `cargo xtask check` / bare `corpus`. Twenty-two blocks typecheck; two are pinned accepted disagreements, each citing an open ledger gap (`values.regions.two-binding-disciplines` for `:206` scoped `with pool`; `actors.messages.take-non-own-resource` for `:656` message `take` of a non-`own` resource). Prior: `:530`/`276e58180606` method-owned generics flipped ok by plans/M13.md item Q; `:604`/`f56a6f9b7f60` and `:674`/`84c332141ae2` (`?` on actor await) flipped ok by plans/M13.md item I (`actors.calls.callerror-nameable`). The gate is the pin in `crates/xtask/src/corpus_sema_census.rs`, not `disagreements == 0`: a new disagreement fails (`ok-decay`); an accepted row that starts typechecking fails (`accepted-disagreement-cleared`, naming the gap); every cited gap must still be `status = \"gap\"` in this file. ASPIRATIONAL whole-file examples stay lex/parse-only (decision 516). `--sema` prints the verbose report only — same classification path. Prior history: J1 measure-behind-flag; J1b/J1c instrument trust; J2a–J2d fixed what could be fixed.

plans/M10.md item A3 (2026-07-26, decisions 710–712): **both pinned tables were keyed by absolute line number, and that key was silently wrong.** `corpus_sema_context.rs` matched `(doc, start_line)`, `corpus_sema_census.rs` matched `path:start_line` — so inserting *anything* above a fence shifted its line and detached its declaration preamble with no diagnostic at all. M10 item A hit it inserting 03 §3.1: three later fences lost their stubs and produced three fresh "disagreements" that had nothing to do with the edit, and in the census the same shift makes a pinned accepted disagreement stop matching, which J3's gate above reported as *pin decay* — the wrong cause entirely. Fixed by keying both tables on **the block's own content**: `corpus_sema_context::block_key` is the first 12 hex chars of SHA-256 (reusing `report::sha256_hex`, no new dependency) over the exact fence body. An edit *above* a block cannot move its key. An edit *to* a block does move it, so the stub and the pin both stop matching and the harness says so by name (`pin-lost` / `unpinned block` / stale-stub), stating that the changed block's classification must be re-reviewed and repinned — deliberately fail-closed, because a changed block's pinned classification genuinely does need re-review (decision 711). `loc` in the census and `doc`/`line` in the context table are retained as human-facing audit aids only; they never participate in matching and are allowed to go stale after an insertion. Three new fail-closed guards, all in `xtask` `corpus`: content keys must be unique and 12-hex across the live set and both tables (a collision or two byte-identical fences would make a pin ambiguous); every declaration stub must attach to some live block (the old silent detach is now an error); and the stub and census checks both run so one edited block reports both rows. `corpus --sema` now prints every block's classification, content key, live `path:line`, and section — humans hand-write these keys, so a key the report does not print is a key nobody can pin (decision 712). Classifications unchanged by the re-key at A3 (18 ok / 5); plans/M13.md item Q later flipped §8.3 method-owned generics → 20 ok / 4; item I flipped CallError-nameable awaits → 22 ok / 2. Rejected: keying by fence *ordinal* within the doc — it survives prose insertions but not the insertion of a new fence, and it silently remaps to the wrong block instead of failing (decision 710)."""

[[clause]]
id = "syntax.diagnostics.parse-errors"
doc = "02-language.md#8"
status = "test"
tests = ["golden/err-bad-dedent", "golden/err-five-space-indent", "golden/err-unterminated-string", "golden/err-unterminated-paren", "golden/err-missing-colon", "golden/err-take-rvalue", "golden/err-lone-else", "golden/err-stray-ellipsis", "golden/err-unmatched-close", "golden/err-keyword-as-name", "golden/err-assign-nonplace-arith", "golden/err-assign-nonplace-unary", "golden/err-assign-nonplace-closure"]
note = "M5 finalization soak follow-up (seeds 41-43): the closure short-body parse (`parse_closure_short_body`) was the one remaining assignment parse without the place check, so `|x| 5 = true` was accepted while its own pretty-printed suite form re-parsed through the guarded statement path and was rejected — a roundtrip asymmetry, fixed with the identical check; golden/err-assign-nonplace-closure. ten representative syntax errors (bad dedent, five-space indent, unterminated string/paren, missing colon, take rvalue, lone else, stray ellipsis, unmatched close, keyword as a declared name); a Keyword token is rejected wherever a fresh name is declared or a type is named (fn/method/struct/enum/pool/const/variant/field names, parameters, local assignment targets, closure params, generic params, import aliases), message `keyword <kw> cannot be used as a name`, with **four** narrow exceptions: after `.` (member access/call, Enum.Variant paths), argument labels (`name=`), `pool` as a callable in primary-expression position (the `with pool(...)` intrinsic), and — plans/M9.md item B decision 105 — the keyword `from` as a declared `fn` name (`parser::expect_fn_name`: after `fn` only; an import's `from` is statement-initial and never overlaps). Dotted import paths keep accepting keyword segments.\n\n`cargo xtask fuzz lower` (post the branch-scoping fix, seeds 32/33) found a second, distinct `check_typed`-vs-`lower`/`eval` disagreement: `parse_assign_or_expr_stmt` parsed `target op= value`/`target = value` for *any* `target` expression, never checking it was place-shaped, so a stray unary/binary wrapper on the left of `=` parsed clean and reached `sema::bodies::check_assign` (which also never checked): `~total = a >> 1` (`total` wrapped in a unary `~`, golden/err-assign-nonplace-unary, minimized from `target/fuzz/lower-crash-68.wr`/`-70.wr`) and `i +2= 1` (a stray-digit typo that lexes as `i` `+` `2` `=` `1`, i.e. `Assign{target: i + 2, value: 1}`, golden/err-assign-nonplace-arith, minimized from `target/fuzz/lower-crash-67.wr`/`-69.wr`) both typechecked successfully, then `lower::lower_place_write`'s own `_ => Err(LowerError::internal(\"expression is not an assignable place\"))` guard fired — an internal, should-be-unreachable error, not a diagnostic. `eval/interp.rs::place_mut` carries the identical guard and the identical message (`ctx.abandon(\"internal error: expression is not an assignable place\")`) and is equally reachable through `wrela test`/`@test` — checked directly (`wrela test` on a two-line `@test` probe of each shape) before the fix: both shapes produced `test <name>: FAILED internal error: expression is not an assignable place` rather than crashing, i.e. eval is exactly as strict as lower, never accidentally tolerant, but reports the wrong (internal-error) diagnostic just the same. Fixed one layer upstream of both, at the parser (not in `sema::bodies`, and not by restricting the parser's own expression-statement/assignment split — the existing `target = self.parse_or()` grammar is fine as written): `parse_assign_or_expr_stmt` now checks `ast::is_place_expr(&target)` — the same shallow (`Name`/`Field`/`Index`) check `parse_unary_body`'s `take` operand and `parse_call_args`'s `mut`/`take` operands already require, syntax.parser.expressions' own \"place-expression checked\" note — the moment an assign-op is recognized, before constructing an `AssignStmt` at all: `error[parse]: the left side of an assignment must be a place expression (name, field, index)`. This closes the gap at its narrowest correct layer — no `AssignStmt` with a non-place target can be built at all, so `sema::bodies::check_assign`'s existing \"a non-name target (field, index) already exists\" assumption (previously silently false for a `Unary`/`Binary` target) is now actually guaranteed, and neither `lower.rs` nor `eval/interp.rs` can ever see the shape again — the typed tree is unrepresentable post-fix, matching how `sema.types.bodies`'s own note already reasons about lower-rejected shapes it doesn't itself construct. All four original crash inputs (`lower-crash-67.wr` through `-70.wr`) now produce the named parse diagnostic instead of the internal error; `cargo xtask fuzz lower --seed 32`/`--seed 33` at the full 2_000_000-iteration deep default and `cargo xtask fuzz sema --seed 32 --iters 200000` are all clean post-fix. No existing golden expectation moved: `cargo xtask golden` reports 215 pre-existing expectations plus these 2 new cases (217 total), confirmed by re-running against the pre-fix parser (`git stash`), which fails only the 2 new cases and leaves the other 215 untouched — nothing in the doc/example corpus or any prior golden used a non-place assignment target."

[[clause]]
id = "sema.bounds.loops"
doc = "02-language.md#8.1"
status = "gap"
tests = ["golden/check-budget-sync-loop", "golden/check-budget-const-bound", "golden/err-budget-sync-unbounded", "golden/err-budget-const-unresolvable", "golden/err-budget-const-zero"]
note = "every loop in a synchronous fn needs a finite bound and async loops checkpoint unless @budget-proven (02 \u00a78.1, 04 \u00a72).\n\n**M11 item A (decision 721) — sync half narrowed, clause stays gap:** normative discharge is `@budget(bound=N)` immediately preceding a sync `for`/`while`, `N` a comptime-known integer \u2265 1; missing attribute is `error[sema]`; acceptance emits a hidden trip counter that aborts if the body runs more than `N` times (fail-closed runtime bound, no cost model). Goldens: accept a budgeted sync loop; reject an unbounded sync loop that previously slipped through; async checkpoint behaviour unchanged.\n\n**M11 item H (decision 810) — event-loop carve-out named, not a silent gap:** force-rooted runtime event-loop entry keys (exact name `__wrela_rt_secondary_entry` and `__wrela_rt_primary_entry`) may omit sync `@budget` — see clause `sema.bounds.loops.event-loop-entry`. Ordinary sync loops in `runtime.wr` still require `@budget`.\n\n**M12 item B (decisions 871–874) — const-name bound form:** `N` may be an integer literal or the name of a module-level (or imported) `const` whose comptime value is one or more — 03 \u00a73.1's array-length wording reused verbatim; resolved via the same `mctx.consts` / `mctx.const_values` maps layout lengths use (`collect_length_consts` rule). Goldens: `check-budget-const-bound` (typed dump shows resolved N); `err-budget-const-unresolvable`; `err-budget-const-zero`. `runtime.wr` ring/init/boot (and irq/wake) pool-shadowing literals migrated to the imported pool consts; trip-counter values unchanged where consts equal the old literals.\n\n**Still gap (honest):** async half (budget that replaces a checkpoint) and ISR-bound half remain unimplemented as discharge; cycle proofs / latency stay human-gated under ROADMAP's \"Cost proofs\" intention and are deliberately not M15's cycle proxy (M12 is the representation rung; M13 is vocabulary). Do not flip this clause to `test` until those halves land or are explicitly carved out.\n\n**M13 item C cut 9 (2026-07-27).** Async checkpoint elision under a proven `@budget` is reworded in 04 §1 as an optimization the report discloses, not a semantic; the legality rule (async loop needs a budget or a suspension) is untouched. Still gap for the async discharge half itself.\n\n**M13 item N (2026-07-27) — sync + event-loop halves discharged:** the event-loop name allowlist is deleted; observation discharge (clause `sema.bounds.loops.observation-discharge`) covers intentional unbounded park/run loops structurally. **Still gap (honest):** async budget-elision and ISR-bound halves."

