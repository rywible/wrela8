]
note = "plans/M7.md item B (the first `hardware.*` clause in this file): `@layout(kind, endian=...)` is checked and laid out by `sema::types::check_layouts` (`crates/wrela-compiler/src/sema/types.rs`), realizing 03-hardware.md §3's whole sentence — \"`@layout(kind, ...)` is the one exact-bytes mechanism, with four kinds ... and rejects anything implicit or target-dependent\" — under plans/M7.md decision 4's reading: reports exact bytes or fails; no implicit padding, no target-dependent field, no inference.\n\n**The rule, exactly.** A `@layout` struct declares its kind (`dma`/`mmio`/`wire`/`runtime`; `runtime` adds two field shapes of its own and is laid out since plans/M10.md item A2 — see `hardware.layout.runtime-class`) as its one positional argument and its byte order as `endian=little`/`endian=big`, and nothing else — every `@layout` argument that exists changes the reported bytes, so an unrecognized one (`packed=`/`alignment=`/`version=`, which appear in the aspirational `docs/language/examples/virtio-storage.wr` sketch and in no normative rule) is a rejection rather than a silent ignore (`golden/err-layout-unknown-arg`). Fields carry an exact byte size or they are rejected: `u8`/`u16`/`u32`/`u64` and their signed forms, plus 03 §2's `ReadOnly[T]`/`WriteOnly[T]` register wrappers in an `mmio` layout only (`golden/err-layout-mmio-wrapper`). Each field starts where the previous one ended unless it writes `@offset(n)`; an explicit offset may skip ahead, and the hole it leaves is *declared* padding — reported, not rejected (`golden/check-layout-wire`, `golden/check-layout-mmio`). Total size is the end of the last field: no trailing padding, no alignment round-up.\n\n**Sizes here are encoding sizes, not machine sizes.** `mwir::size_of` answers \"how many bytes does the machine give this value\" (one 8-byte slot per scalar); this answers \"how many bytes does this field occupy in the register map / on the wire\". The two deliberately disagree, which is exactly why `@layout` needs its own table rather than reusing that one.\n\n**Every rejection, and why each is the rule it is** (each a golden, each naming the field and what is wrong): no exact byte size — `bool` has no byte encoding pinned anywhere in the docs, so an exact one cannot be reported without inventing it (`golden/err-layout-no-exact-size`); target-dependent — `usize`/`isize` are the target's word size by definition (`golden/err-layout-target-dependent`), and `f32`/`f64` join them on 02-language.md §6.1's own wording, \"`f32 f64` where the target enables them\", which is a target-dependent field in a chapter that forbids them; a capability type inside a layout — 03 §3 forbids it inside `wire` by name (`golden/err-layout-wire-capability`), and the `dma`/`mmio` arms reject the same thing for the more basic reason that no capability has a byte encoding at all; implicit padding — a field whose natural offset its own width does not divide is exactly where a conventional compiler silently inserts bytes, and this one refuses and reports how many it would have had to invent (`golden/err-layout-implicit-padding`); overlap — 03 §2's \"non-overlap\", enforced as \"declared in ascending offset order and never overlapping\", one rule covering both an aliasing offset and a backwards one (`golden/err-layout-overlap`); a misaligned explicit offset — 03 §2's \"alignment\" (`golden/err-layout-unaligned-offset`); a missing or unrecognized `endian=` — decision 4's \"no inference\", since 03 §3 requires the compiler to *report* endianness and there is no default to report (`golden/err-layout-endian-missing`, `golden/err-layout-endian-value`); a non-field member — a `@layout` type is an encoding, not behavior, and its methods/`init`/pools are surface this item does not check, so they fail closed rather than being silently accepted and silently unchecked (`golden/err-layout-member`); a nested `@layout` field — fail-closed by name, since the composite request-plus-status shapes that need one belong to plans/M7.md item E, and rejected with that scope limit rather than with the \"no exact size\" message it is not (`golden/err-layout-nested`); and `@offset` on a struct that is not a `@layout` at all — 02-language.md §13 defines it as a field offset *inside* a `@layout` declaration, and an ignored `@offset` is an author's belief about the bytes that the compiler never checked (`golden/err-layout-offset-outside`). The declaration-shape guards with no source-shaped story of their own (unknown kind, two `@layout` attributes, a generic `@layout` struct, a non-literal or duplicated `@offset`, an unknown field attribute) are unit-tested in `sema::types`' own `declaration_shape_guards` table instead of each getting a golden that would say nothing a reader could not predict.\n\n**Pass order — a real decision, recorded because it is unusual.** This pass runs *before* `symbols::resolve`, i.e. before name resolution, unlike every other check in `sema/types.rs`. Two reasons: (1) a `@layout` field's type is not an ordinary annotation but an encoding drawn from a closed set, so inside a `@layout` struct an unknown name is not \"unknown\", it is \"not an exact-bytes type\"; (2) 03 §3 forbids a capability inside a `wire` layout by name, and no capability type exists yet (plans/M7.md item A mints `DeviceCap`/`Mmio`/`IrqCap`/`DmaPool`) — checked after resolution that rule would be dead code today and would report `error[name]: unknown name `DmaPool``, a diagnostic naming the wrong cause. Checked here it is live now and keeps producing the better diagnostic once item A lands. Consequence, stated rather than discovered later: everything the pass reads is raw ast (rendered with `printer::print_type_bare`, a new sibling of `print_expr_bare`), never a resolved `types::Type`. Diagnostics use the existing `type` category — `xtask`'s `SEMA_CATEGORIES` is a fixed set (plans/M2.md decision 1) and this item does not extend it, exactly as `bodies::check_marker_attr_shape` does not for a malformed `@test`.\n\n**Typing only for `ReadOnly[T]`/`WriteOnly[T]`.** They resolve (`sema::prelude`'s own `MMIO_WRAPPERS`, `resolve_named`'s new arm) and they size, and that is all: reading or writing one has no operation of any kind. Volatile typed access and claim partitioning are plans/M7.md item C.\n\n**Not claimed.** (a) 03 §2's \"two live layouts can never alias a register\" — this clause proves non-overlap *within* one layout only; the claim-partitioning half is item C's `hardware.mmio.no-alias`. (b) \"checked against the target ABI\" for `dma` — there is one target and its ABI does not constrain a packed byte layout beyond the natural-alignment rule enforced here; a real second target would have to revisit it. (c) `Bytes.read_wire[W]` decoding (03 §3, 05-library.md §9) — not implemented, not needed to read a block, and named as absent rather than approximated. (d) `@layout_assert`/`img.check_layout` — untouched, still the open gap `image.report.layout-asserts`. (e) That any of these bytes reach a device: nothing here mints a capability, maps a partition, or emits a load or store.\n\n**Diagnostic-accuracy fix at merge (orchestrator).** One checker condition (`offset < cursor`) covers two genuinely different violations, and the first draft reported both as an overlap. A field declared after its predecessor may sit entirely *before* it and share no byte with it at all: `@offset(0x010) later: u32` then `@offset(0x000) earlier: u32` occupy 0x10..0x14 and 0x0..0x4, which do not intersect. Calling that an overlap asserts something a reader can check and find false — the rule being enforced (03 §2's ascending declaration order) is right either way, but a diagnostic that misdescribes the violation spends the trust that makes the rest of the message worth reading. The two cases are now distinguished by whether the field's own extent actually reaches the predecessor's start, and each carries its own wording and its own golden (`golden/err-layout-overlap` for a real overlap, `golden/err-layout-order` for pure misordering); both messages print the predecessor's full `start..end` range so the claim is checkable on its face. Found by probing the rule with fresh inputs rather than by reading the code — the same way the item's own self-audit found four arms with no oracle.\n\n**Item I's sweep (2026-07-24) — one arm this note over-claimed, now real.** \"the compiler reports exact size, offsets, padding\" was true for every input except one: `@offset(n)` decodes any `n` a `u64` holds, and `check_one_layout` then computed `offset + size` twice unchecked (once for the overlaps-vs-ordering diagnostic split above, once to advance the layout cursor). `@offset(0xFFFFFFFFFFFFFFFF) z: u8` **panicked** `wrela dump --stage=layout-types` in a debug build (`attempt to add with overflow`), and would have *wrapped* in a release one — reporting `size=0` for a layout with two declared fields, hence a `@layout(dma)` payload of zero bytes, hence `img.dma_pool(count=N)`'s own `N × 0` bytes of backing for N slots. A crash on one profile and a fail-open on the other, from a declaration a user can write. Both additions now go through one `checked_add` whose failure is a named rejection about the fact that is actually wrong — the field's last byte does not exist (`golden/err-layout-offset-overflow`). No existing golden moved."

