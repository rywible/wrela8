note = "plans/M6.md item B, decision 2: `sema::typed::TypedProgram` -> `flowwir::FlowWirProgram`, the suspension-explicit state-machine form between the typed tree and `mwir`, for **async fns/methods only** — a sync fn/method never reaches this file at all and keeps the exact M5 `typed` -> `mwir` path unchanged (verified directly: every pre-existing `mwir`/`asm` golden expectation is byte-identical after this item, `cargo xtask golden` shows 0 moved beyond the new additions this note lists). Two new files (`crates/wrela-compiler/src/flowwir.rs`, the shape + `--stage=flowwir` dump; `flowwir_lower.rs`, the typed-tree walk), `lib.rs` gains `pub mod flowwir;`/`pub mod flowwir_lower;`, `bin/wrela.rs` gains the `\"flowwir\"` stage arm (structurally parallel to `--stage=mwir`: lex/parse/`check_typed`, then `flowwir_lower::lower_program`, then `flowwir::dump`; a lowering rejection prints the same `error[unimplemented]: ...` house style). `mwir.rs` gains one visibility bump (`fn fmt_inst` -> `pub(crate) fn fmt_inst`, logic unchanged) so the dump can format an embedded `mwir::Inst` without a second formatter.\n\n**Shape decisions** (this item's own \"yours to finalize\", full reasoning lives in `flowwir.rs`'s own module doc): `FlowWirProgram { fns: BTreeMap<key, FlowWirFn> }`, one entry per async fn/method (same `CalleeKey::spelling()` convention as `mwir::MwirProgram::fns` — a plain top-level fn's bare name, a method's `Struct.member`; a generic instantiation is never walked at all, since no async generic exists in the M6 surface, a disclosed boundary, not silently narrowed). `FlowWirFn { receiver, params, ret, frame: FrameLayout, states: Vec<State> }`; `State { ops: Vec<FlowInst>, transition: Transition }`, `states[0]` always the entry state.\n\n**Embed vs. parallel instruction set — embedded** (the plan's own preferred option, taken): `FlowInst::Mwir(mwir::Inst)` wraps every non-suspending straight-line op verbatim (arithmetic, comparisons, struct/enum construction and projection, pattern-test sub-tests, local `Jump`/`JumpIfFalse`, `Return`, `AssertFail`) — `mwir::Inst`'s own shape already covered everything an async body's non-suspending ops need, so no parallel enum was invented. Five ops have no `mwir::Inst` counterpart and get their own `FlowInst` variants: `SelfPath` (self-rooted path re-derivation, below), `Now`/`Duration` (the `now()`/`ms(n)` intrinsics, decision 11 — both treated as opaque `u64` tick counts at M6, an `Instant + Duration` add lowers to a plain wrapping `u64` `ArithWrapping`; the real unit-scale conversion is item D's job, recorded as a dumb, deliberate placeholder, not a proof), `Send` (`send actor.method(...)` — non-suspending, never a state split, unlike `await`), `GroupCreate`/`GroupStart`/`GroupClose` (a `with group`'s own open/child-start/close brackets).\n\n**Frame rule — everything gets a slot, no liveness analysis**: `FrameLayout::temp_types` is one uniform table covering *every* temp this fn ever allocates, suspension-crossing or not (spill-everything's own sibling, the plan's own words) — a real liveness pass is exactly the kind of cleverness CLAUDE.md's budget gates behind a profile, not spent here. `lineage_group_slot`/`lineage_deadline_slot` are always `Temp(0)`/`Temp(1)`, allocated before `self`/every param/every ordinary local — the ambient-lineage pair 02-language.md §9.5 says every async fn/method implicitly carries; nothing in this item's own required goldens reads or writes them yet (item F's job), they exist so every later item has a stable slot to target.\n\n**Intra-state control flow**: an `if`/`while`/`match`/`for` containing no `await` anywhere inside (`flowwir_lower::expr_contains_await`/`block_contains_await`, a conservative-only-in-the-recognized-constructs walk) lowers exactly like `lower.rs`'s own logic, ported and adapted (`lower_if_intra`/`lower_while_intra`/`lower_match`/`lower_for`, `lower_pattern_test`/`collect_pattern_bindings`) — local `Jump`/`JumpIfFalse` fixups stay indices into the *current state's own* `ops`, never a cross-state reference, and `return`/`break`/`continue` embed as ordinary `Mwir(Inst::Return)`/`Mwir(Inst::Jump)` ops (mirroring `mwir::Inst::Return`'s own mid-list legality — nothing after an always-taken embedded `Return` is ever reached, so the state's own trailing `Transition` is dead code there, exactly like `lower.rs::lower_fn`'s own harmless trailing bare `Return`). An `if`/`while` whose body/branch *does* contain an `await` splits into real states (`lower_if_split`/`lower_while_split`): `Transition::Branch` for the `if` case, and for `while`, a genuine state cycle — a dedicated `cond_state` re-checked every iteration, `Branch`ing into a fresh `body_state` or the loop's own `after_state`, the body's own natural end jumping back to `cond_state` (\"loop back-edge with an await inside = state cycle,\" the plan's own words, pinned by `golden/flowwir-loop-await`'s 5-state dump). `match`/`for` stay intra-state-only — an `await` inside either fails closed, named (no required golden needs the generality). A subtlety the fix-up loop this item's own first hand-test found: a state that \"diverges\" via an *embedded* op (a plain `return`, or an intra `if`/`match` every arm of which itself ended that way) still needs *some* `Transition` to satisfy \"every state ends in one\" — `FlowBuilder::finish_if_unset` (a finish-only-if-nothing-already-did helper) papers exactly that seam, at the fn's own top level and at every intra/inter branch-end/loop-body-end join point; without it the very first hand-built golden (`flowwir-basic`) hit `internal error: state 1 never got a transition` — caught immediately, not shipped.\n\n**Lineage/deadline plumbing**: explicit two-slot frame reservation, above — the real inheritance/narrowing mechanism is item F's; this item only carries the slots.\n\n**`with group` -> explicit create/close + cleanup edges**: `GroupCreate`/`GroupClose` bracket the scope; `GroupClose::cleanup_states: Vec<usize>` names this group's own `defer` cleanup chain, reverse registration order, each a dedicated `State` (`flowwir_lower::build_cleanup_chain`) rather than inlined — specifically so a later item (cancellation, item F) can jump into the identical graph out of band, from a path this walk's own top-down normal lowering never takes; empty when the group's own body registered no `defer`. A `defer` *outside* any group inlines its body as ordinary ops at its own natural block-scope exit instead (`drain_defers_inline`, mirrors `lower.rs::run_defers` exactly) — not part of any cancellation domain at M6, so nothing needs to reference it independently. `golden/flowwir-defer` pins the cleanup-chain shape directly: `GroupClose group=t9 cleanup=[2]` followed by `Transition Jump target=2` (the cleanup state) then `Transition Jump target=3` (the real continuation) — the group's own natural-exit path *runs through* the same chain a cancellation path would later jump into, not a separate inlined copy. Disclosed gap, named rather than silently handled: an early `return` from inside a `with group`'s own body never runs its `GroupClose`/cleanup chain at M6 (item F's real cancellation-aware teardown ordering); `finish_if_unset` still keeps the IR well-formed on that path (a harmless dead-code placeholder), it just does not claim to model the real semantics there.\n\n**Self-rooted paths across `await`** (02-language.md §9.2): a local bound to a self-rooted field chain (`before = self.cache.value`) is kept in the lowering environment as the *path itself* (`flowwir_lower::Binding::SelfPath(Vec<String>, Type)`, field names only, no temp) rather than a computed `Temp` — every later read re-derives it fresh, via the dedicated `FlowInst::SelfPath` op, in whatever state the read actually happens in, before or after a suspension. `golden/check-await-self-path` (item A's own accept golden, given a `flowwir.txt` alongside its existing `check.txt`/`typed.txt` since its program shape — a two-level `self.cache.value` read both before and after one `await`, inside an `await`-free `match` — suits directly, per this item's own \"reuse where it fits\" instruction) pins three independent `SelfPath dst=_ path=self.cache.value` ops, one per read (`before`'s own two uses — once in the `.Ok` arm, once again in the `.Err` arm — and `after`'s own one use), never a single cached value carried across the suspension.\n\n**Lowering fail-closed set** (full reasoning and the complete list live in both files' own module docs): a plain (non-actor, non-group) fn/method call inside an async body's expression position (no required golden needs one — every call here is an actor call, a `send`, or a group child, each with its own dedicated lowering path); `Option`-typed `?` (only `Result`); a `?` needing a real `From` conversion (`conv: Some(_)`) — a real, disclosed finding: `CallError` is not yet a *declarable* type name anywhere in source (`sema::types::resolve_named` recognizes `Actor`/`Group`/`Instant`/`Duration`/`Rejected` but not `CallError` — verified directly, `-> Result[u64, CallError[never]]` as a written return type rejects with `error[name]: unknown name \\`CallError\\``), so a caller's own declared error type can never *already match* an awaited actor call's composed `CallError[E]` and `?`'s own `conv` is therefore always `Some(_)` for that shape today — `golden/flowwir-chain`'s own \"a chain of fallible awaited steps\" is built with explicit sequential `match`es instead of literal `?` for exactly this reason (still a real four-state chain: entry, then one resume-and-match state per step); an `elif` chain, or an `if`'s own condition, containing an `await`; a `defer` body containing an `await`; an `|` (or) pattern; a nested field/index chain deeper than one level (mirrors `lower.rs`'s own identical restriction) unless reached through a `let`-bound self-path; `g.start`'s callee naming a `self`-method (only a bare top-level `async fn` name is exercised — `resolve_callee_fn` resolves either shape, but nothing threads an implicit `self` into a `self`-method child's own call, a disclosed gap for whichever item first needs it); an `await`/`send`/group-child nested any deeper inside a larger expression (only a direct `let`/assignment/`return`/bare-statement operand is recognized as suspending).\n\nplans/M8.md item R adds one more (`golden/check-regions-two-disciplines`, decision 12): `run_both` discharges an `own[P] T` handle's whole region obligation and opens a `with group` four instructions apart in one state, so the dump shows the two binding disciplines' *lowerings* side by side with no second program to hand-wave about — an ordinary `Mwir Call` for the pool's reclaim, a `Transition Await what=GroupJoin{...}`/`GroupClose` pair for the group's close. Nothing new in this pass produced it; it is added here because a FlowWir dump is the artifact that shows it.\n\n**Goldens**: `golden/flowwir-basic` (one async method, one `await`, 2 states), `golden/flowwir-chain` (three sequential awaited steps, 4 states — see the `?`-unspellable-`CallError` finding above for why this is `match`-based, not literal `?`), `golden/check-group` (`with group(capacity=...) as g`, two `g.start` children, `await g.join_all()`, an `await`-free `for`+`match` over the joined array, `flowwir.txt` added alongside item A's own `check.txt` — reused verbatim per this item's \"reuse where it fits\" instruction), `golden/check-deadline` (`with group(deadline=now()+ms(50))`, no `as` binding, `flowwir.txt` added the same way), `golden/flowwir-defer` (`defer` inside a `with group` body, across one `await`, pinning the cleanup-chain shape), `golden/flowwir-branch-await` (`if`/`else` with the `await` in the `then` arm only, 5 states), `golden/flowwir-loop-await` (`while` containing an `await`, 5 states, the back-edge state cycle), `golden/check-await-self-path` (self-path re-derivation, `flowwir.txt` added alongside item A's own `check.txt`/`typed.txt`). Every new/added `flowwir.txt` reviewed directly; `cargo xtask golden` confirms 0 pre-existing expectations moved.\n\nUnit tests (`flowwir_lower.rs`'s own `#[cfg(test)]` module): state-count assertions for each of the seven golden shapes above (`lower_program` invoked directly on a parsed+checked module, `.states.len()` compared against the exact counts this note lists); frame-layout determinism (`lower_program` run twice over the same program, the two `FlowWirFn::frame.temp_types` compared field-by-field, plus `lineage_group_slot`/`lineage_deadline_slot` asserted `Temp(0)`/`Temp(1)` on every fn); a dedicated self-path-across-`await` test (asserts the resume state's own ops contain three independent `FlowInst::SelfPath` entries, never a cached temp, for `check-await-self-path`'s own program). `cargo xtask check` green (fmt, tests, golden, ledger)."

