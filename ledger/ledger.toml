id = "image.graph.one-image"
doc = "04-compiler.md#1"
status = "test"
tests = ["golden/err-image-none", "golden/err-image-duplicate", "golden/err-image-two-modules"]
note = "plans/M4.md item C grows decision 6's own minimal item-B slice (`image.eval.comptime-context`'s own note) into its full \"zero or more than one is a named diagnostic listing every candidate\" form. Three cases, three mechanisms, unchanged from item B except the third: (1) zero reachable `@image` fns across the whole build closure — `bin/wrela.rs::run_image_stage`'s own `candidates.len() == 0` arm, message unchanged verbatim (`error[build]: no \\`@image\\` fn found in the build closure`, golden/err-image-none — trivially \"lists every candidate\": there are none to list); (2) two `@image` fns in the *same* module — `sema::bodies::check`'s own duplicate guard (unchanged, golden/err-image-duplicate, `error[build]: more than one \\`@image\\` fn in this module (...)`); (3) two (or more) `@image` fns reachable from *different* modules of one build closure — `run_image_stage`'s own `candidates.len() > 1` arm, grown this item from a `.`-joined list to `module.path::fn_name` per candidate (the `::` separator distinguishes the fn name from a dotted module path that may itself contain dots), joined in the `programs` map's own `BTreeMap` order (module path order) — `golden/err-image-two-modules` (a project: `src/main.wr` declares `build_main`, imports `other::MARKER` just to pull `src/other.wr` — which independently declares `build_other` — into the closure; neither module imports the other's `@image` fn itself, only an unrelated `const`, since nothing about reachability requires it) pins `error[build]: more than one \\`@image\\` fn reachable in the build closure (main::build_main, other::build_other)`. This is decided *before* any `@image` fn is ever evaluated (`eval::interp::eval_image` only ever runs once `candidates.len() == 1`), so there is no `ImageGraph` yet for a graph check to run over — `image.graph.construction-dag` and its siblings below are a distinct, later pass."

[[clause]]
id = "image.graph.construction-dag"
doc = "02-language.md#12.1"
status = "test"
tests = ["golden/image-basic", "golden/image-project", "golden/image-helper-accept"]
note = "02-language.md §12.1: \"Construction edges (moves, initialization order) must form a DAG; handle edges may be cyclic.\" `eval::image_checks::check_construction_dag` (run first in `check_sealed`'s fixed order, see `image.graph.seal-fully-bound`'s own note) builds the edge set from every device/driver/actor/pool/dma-pool declaration's own recorded arguments (`decl_refs_in_value` recurses into arrays/tuples/structs/enum payloads looking for a nested `Value::ImageDecl`) and rejects a cycle with a fixed-order DFS, printing the cycle in full — one `  <a> -> <b>` line per hop (`extra_lines`), the wait-cycle diagnostic precedent named in the plan. Honest finding, recorded here rather than faked: once evaluated, `decl.handle()`'s own result and a bare decl-reference argument are the identical `Value::ImageDecl` (`ImageDecl.handle`'s own eval arm is a pure passthrough of its receiver — `eval/interp.rs`'s own doc comment) — there is no way to tell which spelling a source argument used from the evaluated value alone, so this check conservatively treats every decl-reference argument as a construction edge rather than trying (and failing) to exempt \"handle edges\" specifically. This is sound and, more importantly, harmless: a local can only ever be assigned from an *earlier* declaration's own return value (straight-line evaluation, program order — no forward references exist in the language yet), so every `ImageDeclRef` any later declaration's arguments can possibly name already exists earlier in that same graph's own construction order. A real, source-evaluated `ImageGraph` can therefore never actually contain a cycle, of either kind, no matter how this check treats the two — a source-level failing golden is consequently unrepresentable today, not skipped: the check is real, dumb, correct code, and is exercised failing on two hand-built `ImageGraph`s in `eval/image_checks.rs`'s own `#[cfg(test)]` module (`a_hand_built_cycle_is_rejected` wires an *earlier* index's own argument to reference a *later* one, the one way to close a cycle at all when construction order can be bypassed by hand; `a_real_graph_with_only_backward_references_is_always_acyclic` pins the converse) — the only way to construct a cycle at all pending forward references. Every accept golden (`golden/image-basic`, `golden/image-project`, `golden/image-helper-accept`) runs this check as part of `check_sealed` and passes, so the check's *accepting* behavior is golden-exercised on every real build; its *rejecting* behavior is unit-tested only, and this note says so rather than pretending otherwise. This clause flips fully (a source-level `err-image-*-cycle` golden lands) once forward references make a real cycle constructible."

[[clause]]
id = "image.graph.pools-bound-once"
doc = "05-library.md#9"
status = "test"
tests = ["golden/err-image-pool-double-bind", "golden/err-image-pool-unknown", "golden/err-image-pool-unbound"]
note = "05-library.md §9: \"bind the previously unbound pool name `P` exactly once ... binding a name twice, or constructing it as a value, is a build error.\" Three sub-cases, three mechanisms, each already the honest diagnostic for its own layer rather than one invented uniform message: (1) binding the same pool name twice — already rejected the instant the second `img.pool`/`img.dma_pool` call runs, at evaluation time (`eval::image::ImageGraph::declare_pool`'s own `Err`, landed with item B and already unit-tested there, `binding_the_same_pool_name_twice_is_rejected`) — the graph can never even be *built* with two entries under the same key, so nothing here needs to re-check it; `golden/err-image-pool-double-bind` (two `img.pool(name=Buffers, ...)` calls) pins the real diagnostic, `error[comptime]: pool \\`Buffers\\` is already bound` (`  while evaluating \\`build\\``); (2) binding a name with no `pool P` declaration at all — already rejected earlier still, at name resolution (`sema::bodies::check_intrinsic_args` only ever recognizes a *declared* pool name as its own `PoolName` leaf; an undeclared one falls through to the ordinary name resolver, which has never heard of it either — a pool name is never in any symbol table, `sema::bodies::build_module_ctx`'s own `module_pools` set is consulted only by this one special case); `golden/err-image-pool-unknown` (`img.pool(name=Ghost, ...)` with no `pool Ghost` declared) pins the real, pre-existing diagnostic this surfaces as, `error[name]: unknown name \\`Ghost\\` at 6:28` — `sema::symbols::resolve`'s own ordinary undeclared-name check, one pass earlier than typing, not a new mechanism this item invented; (3) \"constructing it as a value\" — the same ordinary name-resolution rejection as (2) covers this too (a pool name is never a resolvable value expression anywhere outside the one `name=` position `check_intrinsic_args` special-cases, so using one as a bare value elsewhere is simply an unknown/type-mismatched name, the identical `error[name]`/`error[type]` diagnostic family), so no separate mechanism or golden exists for it; (4) a `pool P` declared in source that is never bound by *any* call before `img.seal()` — the one case genuinely new to this item, since the graph itself only ever records *bound* pools (`ImageGraph::pools`/`dma_pools`) and so has no trace of an unbound one on its own. `TypedProgram::declared_pools` (new field, `sema::bodies::check`'s own copy of `ModuleCtx::module_pools`) carries the `@image` fn's own module's source-declared pool names forward to the post-seal pass; `eval::image_checks::check_pools_bound` (run second in `check_sealed`'s fixed order) names the first one (BTree order) with no bound/dma-bound entry: `golden/err-image-pool-unbound` (`pool Buffers` declared, never bound, `img.seal()` reached anyway) pins `error[build]: pool \\`Buffers\\` is declared but never bound by \\`img.pool\\`/\\`img.dma_pool\\` before \\`img.seal()\\`` — this golden doubles as `image.graph.seal-fully-bound`'s own evidence too (see that clause)."

[[clause]]
id = "image.graph.init-args-match"
doc = "05-library.md#9"
status = "test"
tests = [
  "golden/err-image-init-extra-arg",
  "golden/err-image-init-missing-arg",
  "golden/image-basic",
  "golden/image-project",
]
note = "05-library.md §9: `img.driver`/`img.actor` arguments \"must match `A.init` ... after generated capabilities and handles are substituted\"; the same section's \"a resource `init` argument without one recovery source is a build error\" (M4's own reading of it, decision-7 sub-note below) falls out of the identical mechanism, not a second one. Decision-7 sub-note (recorded at item C execution, 2026-07-23 — the plan's own \"decide the dumb exact rule, record it\" instruction; mechanism: `eval::image_checks::check_init_args`/`check_one_decl`, run third in `check_sealed`'s fixed order): every intrinsic argument is first sorted into *reserved* (belongs to the image's own wiring metadata, never checked against `init`: `device`/`core` for `img.driver`, `mailbox`/`core` for `img.actor`, `reserved_args`) or *ordinary*. Every ordinary argument must name a same-named `init` parameter — naming none is `err-image-init-extra-arg`'s own error, `` `driver#0` passes `queue_depth=...` to `Blk`, but `Blk.init` has no parameter named `queue_depth` `` (`Blk.init` here takes no parameters at all). An ordinary argument whose already-evaluated value is itself a decl reference (`Value::ImageDecl` — with or without its own `.handle()`, indistinguishable once evaluated, `image.graph.construction-dag`'s own note) satisfies its matching parameter with **no further type check**: `ImageDecl` is opaque, so this is the most this milestone can ever verify of a \"handle\" substitution — `golden/image-basic`/`golden/image-project` both exercise this directly (`Store.init(mut self, disk: u32)`'s own `disk` parameter is satisfied by `disk=disk.handle()`, an `ImageDecl` value, despite the parameter's own declared type being a plain `u32` placeholder — see below for why). Every other ordinary argument's evaluated *value* must fit the parameter's declared type (`value_fits_param_type`): the parameter's type is compared first for plain equality against the argument's own recorded static type, falling back to a numeric range check on the evaluated `Value` itself when both sides are integer-shaped — the one accommodation this item's own scope forced: a builder intrinsic argument is type-checked by `sema::bodies::check_intrinsic_args` with **no expected type** (item B's own documented scope line: \"item C's own job is validating them against the real target\"), so a bare integer literal like `queue_depth=8` is always recorded at its no-context default (`i64`), never the real target width (`u32`) — comparing recorded static types alone would wrongly reject every literal argument against any narrower parameter type, so this item's own dumb-and-correct fix reaches past the recorded type to the literal's own numeric value for exactly this one shape (unit-tested directly: `an_int_literal_argument_fits_a_narrower_declared_param_type`). Every `init` parameter *not* covered by an explicit ordinary argument above must still be satisfiable by a *substitution source* to be legal: a parameter whose declared type is named `DeviceCap`/`DmaPool`/`Mmio`/`IrqCap` (recognized by name, decision 7's own instruction) is satisfied by the declaration's own device wiring; one named `Actor` is satisfied by an actor-handle substitution the same way — **neither type name resolves as a real type annotation anywhere in this compiler yet** (`sema::types::resolve_named`'s own fixed arm list has no case for any of the five — `Actor[T]`/`DeviceCap[D]`/`DmaPool[P,N]`/`Mmio[L]`/`IrqCap[V]` are all still aspirational surface, matching 03-hardware.md's own worked example, which this milestone does not implement), so this half of decision 7 is currently **unrepresentable from real source** and is exercised only by this module's own hand-built unit tests (`a_capability_typed_init_param_is_satisfied_by_name_with_no_argument`, `a_handle_argument_satisfies_its_named_param_with_no_type_check`) — recognized defensively by name anyway, exactly like `image.graph.construction-dag`'s own cycle case, ready for the day either type resolves. A parameter satisfied by *neither* an explicit argument nor a recognized substitution source is `err-image-init-missing-arg`'s own error, `` `driver#0` is missing `Blk.init`'s own `queue_depth: u32` — no `queue_depth=...` argument and no wiring substitution source `` — and this is exactly 05 §9's own \"a resource `init` argument without one recovery source is a build error\" too: a resource-typed `init` parameter with no explicit argument and no recognized capability/handle substitution is precisely this same missing-parameter case, so `image.graph.init-args-match` covers both sentences with one mechanism, not two (the decision-7 sub-note this item was asked to record if this is how it fell out — it is). Honesty note on the two pre-existing accept goldens this item's own check forced to grow (per the plan's own explicit instruction, reviewed in the same commit): `golden/image-basic` and `golden/image-project` both previously passed `queue_depth=8`/`disk=disk.handle()` against a bare `init(mut self)` taking no parameters at all — a real, if previously unchecked, mismatch item B's own scope explicitly deferred (\"item C's own job is validating them\"). Both structs' `init`s grew a real parameter apiece (`Blk.init(mut self, queue_depth: u32)`, `Store.init(mut self, disk: u32)`, the latter's own doc comment explaining the `u32` placeholder honestly: `Actor[T]` cannot be spelled yet) so both goldens are now a *true* accept case for this exact rule — a plain matched parameter (`queue_depth`) plus a handle-substituted one (`disk`) in the same struct, satisfying the plan's own \"an accept case with a real init taking a plain param + a handle param\" requirement without a new fixture. `golden/image-helper-accept` needed no init changes (its own `Store.init` already took no parameters and its own `img.actor` call passes only the reserved `mailbox=`) but did need an `img.supervise` call added — an unrelated, unavoidable consequence of `image.graph.supervision-one-parent` landing in the same item, not this clause; recorded there."

[[clause]]
id = "image.graph.supervision-one-parent"
doc = "05-library.md#9"
status = "test"
tests = ["golden/err-image-unsupervised", "golden/err-image-two-parents"]
note = "05-library.md §9: \"exactly one parent per actor/task.\" `eval::image_checks::check_supervision` (run last in `check_sealed`'s fixed order) counts, for every declared driver/actor, how many `img.supervise(children=[...])` groups' own `children` list names it (recursing into the evaluated list value exactly like the construction-DAG check recurses into an argument value, `decl_refs_in_value`, shared code) — zero is `golden/err-image-unsupervised`'s own orphan error (`` `actor#0` is not supervised by any `img.supervise(children=[...])` group ``), more than one is `golden/err-image-two-parents`'s own double-parent error (`` `driver#0` is supervised by more than one `img.supervise(children=[...])` group ``), naming the offending declaration in fixed (driver-then-actor, index) order so a program with more than one violation fails on the first deterministically. Devices and pools are never nodes here (05-library.md §9 names only \"actor/task\"). Decision 7's own \"the image root is the implicit parent of top-level `supervise` groups\" needs no separate mechanism this milestone: `img.supervise` itself returns `Unit` (decision 5's own sub-note — there is nothing composable to nest a group under another group), so *every* `img.supervise` call an M4 `@image` fn can even construct is already top-level; the implicit-root rule is consequently satisfied trivially by construction, and this item's own plain \"every driver/actor is in exactly one group\" check is the whole of what 05 §9 requires until a nested-supervision surface exists to need a second case (recorded per the plan's own \"pin the doc's exact rule in goldens\" instruction — there is exactly one shape to pin at M4). `golden/image-helper-accept` needed a real `img.supervise(children=[storage], ...)` call added to stay an honest accept case once this check landed (its own `Store` actor was previously never supervised at all — an M4-item-B-era fixture predating this rule, not previously exercising it) — reviewed and cited here, the one image-* golden this clause (rather than `image.graph.init-args-match`) forced to move."

[[clause]]
id = "image.graph.seal-fully-bound"
doc = "05-library.md#9"
status = "test"
tests = ["golden/err-image-pool-unbound", "golden/image-basic", "golden/image-project", "golden/image-helper-accept"]
note = "05-library.md §9: \"`img.seal()` consumes the builder and succeeds only when every declaration is fully bound.\" Decision recorded at item C execution (the plan's own \"pick one, document it\" instruction): this is a **post-evaluation pass**, not a per-intrinsic seal-time gate — `eval::image_checks::check_sealed` runs once, in `bin/wrela.rs::run_image_stage`, immediately after `eval::interp::eval_image` already returns a sealed `ImageGraph` (`graph.sealed` is always `true` by this point — an unsealed return is already its own distinct, pre-existing `error[comptime]` from `eval_image` itself, `image.eval.comptime-context`'s own `golden/err-image-unsealed`, and never reaches this pass at all) and before the graph is ever printed by `--stage=image`'s own dump. `check_sealed` *is* \"every declaration is fully bound\", not a separate mechanism layered on top of the others: it runs `check_construction_dag`, then `check_pools_bound`, then `check_init_args`, then `check_supervision`, in that fixed order, first failure wins (documented in `eval/image_checks.rs`'s own module doc comment, with the rationale for the order: DAG-shape is checked first since it needs no idea what a declaration *is*, only what it references; pool binding next since an init argument may reference a pool-backed handle, so it is a precondition for init-argument matching to mean anything; init-argument matching next, the deepest per-declaration check; supervision last, since it says nothing about a declaration's own construction, only about the tree drawn over already-valid declarations). `golden/err-image-pool-unbound` doubles as this clause's own seal-shape evidence exactly as the plan anticipated (an otherwise well-formed `@image` fn that reaches `img.seal()` with a source-declared `pool` never bound — `check_pools_bound`'s own rejection, `image.graph.pools-bound-once`'s clause covers the mechanism in full); no distinct seal-shape beyond that emerged. Every accept golden (`golden/image-basic`, `golden/image-project`, `golden/image-helper-accept`) is the positive witness: each reaches `img.seal()` and prints its full dump only because all four checks passed in this fixed order."

[[clause]]
id = "image.graph.dma-pools"
doc = "05-library.md#9"
status = "gap"
note = "decision 10 (plans/M4.md): `img.dma_pool`'s `@layout(dma)` requirement is not validated until the hardware milestone, so `img.dma_pool` fails the whole build closed the instant it is called, naming this gap explicitly, rather than ever asserting against nothing (`eval::image::ImageGraph::declare_dma_pool`, landed with item B) — `golden/err-image-dma-pool` is the fail-closed witness (`error[comptime]: \\`img.dma_pool(name=Payloads, ...)\\` is recorded, but DMA pools are not implemented until the hardware milestone: \\`@layout(dma)\\` validation does not exist yet (gap \\`image.graph.dma-pools\\`)`). Because of this, `eval::image::ImageGraph::dma_pools` is always empty by the time any item-C graph check ever runs (a successful `@image` evaluation can never have called `img.dma_pool` at all) — none of `image.graph.construction-dag`/`pools-bound-once`/`init-args-match`/`supervision-one-parent`/`seal-fully-bound` needs its own DMA-specific case yet either, and none invents one ahead of the milestone that can prove it (`check_pools_bound` does still consult `graph.dma_pools` defensively when deciding whether a declared pool is bound, so the day this gap closes and a real `dma_pools` entry can exist, that check already accounts for it with no further change). Flips when the hardware milestone lands `@layout(dma)` validation and `img.dma_pool` stops failing closed."

[[clause]]
id = "image.report.stable"
doc = "04-compiler.md#7"
status = "test"
tests = ["golden/appliance", "golden/image-basic", "golden/image-project", "golden/image-helper-accept"]
note = "plans/M4.md item D, decision 8: the image report — `crates/wrela-compiler/src/report.rs` (new crate-root module, plan decision 12's own placement), rendering an already-sealed, already-checked `eval::image::ImageGraph` plus its own build inputs into one stable text artifact, the identical M1 dump style every earlier stage uses (`ImageReport v0` header, `Kind key=value` lines, two-space indent, fixed section order, facts only — a section with nothing to say is absent, never a placeholder). Fixed order (`report.rs`'s own module doc carries the full rationale for each choice): (1) build identity — `Compiler version=<this crate's own `CARGO_PKG_VERSION`>` (never a git SHA or timestamp — decision 8's own \"byte-stable across commits of this repo and across machines\" requirement rules both out), `Target value=...` (the build-affecting fact 04 §7/§8 and 02-language.md §2.1 both name), four `Quota` lines (`eval::quota::MAX_STEPS`/`MAX_MEMORY`/`MAX_CALL_DEPTH`/`MAX_EXHAUSTIVE_CASES` — 02-language.md §2.1's own \"language constants recorded in build identity\"), one `Input path=... sha256=...` line per file in the build closure; (2) the image's own `Name`/`Target` (from `Image(...)` alone, 02-language.md §12.1 — intentionally the same `Target` `Kind` as build identity's own line above, a real duplicate fact from two independent normative requirements, not a placeholder, `report.rs`'s own doc comment explains why both stay); (3) `Device` blocks, args verbatim; (4) `Driver`/`Actor` blocks — every non-handle, non-`mailbox` argument as an `Arg` line, `mailbox` pulled into its own `Mailbox` fact (\"declared mailboxes, recorded as-declared, no derivation\" per decision 8 — M6 does the real derivation); (5) `Edge from=<decl> to=<decl>` — every logical actor edge, one line per handle-valued argument found while walking (3)/(4) (own decision-8 sub-note on direction: `from` is the declaration whose own argument holds the handle, `to` is the declaration the handle names — the direction a later real call edge will take once actor bodies are typed, M6); (6) `Pool` blocks, args verbatim (capacities are just their own recorded args, same reasoning as `Device`); (7) `Supervise` blocks — `strategy`/`intensity` pulled onto the header line itself, `children` expanded into one `Child` line per member; (8) registered layout asserts — **never actually rendered**, see the decision-10 paragraph below. Every `Arg`/`Name`/`Target` line is rendered with `eval::image`'s own `render_value`/`push_line`/`render_bare_value` (bumped from private to `pub(crate)`, zero logic changed) rather than a second rendering mechanism, so the report's own facts are byte-identical in style to the raw `--stage=image` dump wherever the same fact appears in both.\n\nInput digests (decision 9): one hand-rolled SHA-256 (`report::sha256_hex`, ~140 lines, plain `u32` ops, FIPS 180-4, hex-lowercase output) — no new dependency, unit-tested against the two standard public vectors (empty string, `\"abc\"`) in `report.rs`'s own `#[cfg(test)]` module, both passing and cross-checked against Python's `hashlib.sha256` by hand during this item's own execution. A digest's own `path` field is never a real filesystem path: `report::address_to_relative_path` derives it from the module's own dotted closure address (`\"image\"` -> `image.wr`, `\"core.bytes\"` -> `core/bytes.wr`) — exactly the reverse of `loader::module_file_path`'s own forward construction, so the result is package-root-relative *by construction*, never the absolute-or-cwd-relative path actually used to invoke the compiler (which would bake one checkout's own location into a pinned golden, `loader.rs`'s own module doc already discloses the identical failure mode for the missing-module diagnostic). `bin/wrela.rs::run_report_stage` (the new `--stage=report` driver, structurally parallel to `run_image_stage` rather than refactored out from under it — CLAUDE.md: \"prefer long obvious files over deep indirection\") is the one place that reads real file bytes off disk and calls `sha256_hex`; `report.rs` itself does no I/O.\n\nDecision-10 report-boundary enforcement (this clause's own note carries it, per the task's own instruction): `render`'s first act is checking `graph.layout_asserts` — a registered (unrun) `@layout_assert` fails the *whole report* closed, naming M5, \"never asserted against nothing\" (`error[build]: the image report cannot be produced: 1 registered \\`@layout_assert\\` fn(s) (check_limits) — layout does not exist until the hardware/placement milestone (M5) ...`); the raw `--stage=image` graph dump is unaffected (it is the graph, not the report) — `golden/image-basic` (which already registers one `@layout_assert`, `check_limits`, for `image.eval.builder-intrinsics`'s own coverage) is reused verbatim for this, per the task's own \"reuse image-basic's shape\" instruction: no new golden case, just one more pinned expectation file, `golden/image-basic/expected/report.txt`, added to the existing fixture — its `--stage=image` (`expected/image.txt`) keeps succeeding unchanged while its `--stage=report` (`expected/report.txt`) is the one-line failure text above. `dma_pool`'s own identical fail-closed-before-seal behavior (`image.graph.dma-pools`) means a sealed graph can never carry a `dma_pools` entry either, so this boundary's only live trigger is `check_layout`.\n\n`golden/appliance` (new, project-shaped, `tests/golden/appliance/`) is this item's own flagship artifact: a real little block-storage system — one device (`BlockHw`, kept module-local since `img.device[D]`'s own bracketed type argument resolves through the ordinary type-annotation resolver, `sema::bodies::resolve_intrinsic_type_arg`, which stays module-local per item A's own disclosed gap, unlike `img.driver`/`img.actor`'s leading type argument), one driver (`StorageDriver`, imported from `driver.wr`) and two actors (`CacheActor`/`StatsActor`, imported from `cache.wr`/`stats.wr`) — cross-module imports exercising item A's own disclosed \"value/callee position only\" capability exactly as `golden/image-project`/`golden/image-helper-accept` already do, an image-declared pool (`CacheBuffers`, bound in the `@image` module itself, `img.pool[u32]`), and one `img.supervise` group (`strategy=Restart.OneForAll`, `intensity=RestartIntensity(max=3, within=seconds(10))`) over all three declared driver/actors. Init wiring exercises every shape item C's own matching distinguishes in one build: a plain arg (`StorageDriver.init`'s own `sector_count`), a handle edge (`CacheActor`'s own `disk=disk.handle()`, `StatsActor`'s own `cache=cache.handle()` — two edges, one hop apart), and the reserved wiring args (`device=`/`mailbox=`, skipped by matching, pulled into `Edge`/`Mailbox` facts by the report instead of an ordinary `Arg` line). Both actors carry one real synchronous method apiece (`CacheActor.touch`, `StatsActor.record`) and the driver one (`StorageDriver.capacity`) — no `await`/`send`/`with` anywhere (M6 non-goal, actor-body typing). `expected/check.txt`/`expected/image.txt`/`expected/report.txt` all pinned; `expected/report.txt` is the flagship pin this clause names in its own title. `cargo xtask golden` confirms all three plus every pre-existing case (179 expectations total after this item, 0 moved beyond the additions this note itself lists)."

[[clause]]
id = "image.report.deterministic"
doc = "04-compiler.md#8"
status = "test"
tests = ["xtask:report-determinism", "golden/appliance", "golden/image-basic", "golden/image-project", "golden/image-helper-accept"]
note = "plans/M4.md item D, decision 9: \"report determinism is an oracle from day one.\" `cargo xtask report-determinism` (new subcommand, wired into `cargo xtask check` immediately after `golden` — `crates/xtask/src/main.rs`) walks every golden case carrying a pinned `expected/report.txt` and calls `produce_report_text` (this command's own small, deliberately parallel copy of `bin/wrela.rs`'s `--stage=report` driver — that binary's own driver functions are not a library surface `xtask` can call into, so this is its own honest duplicate rather than a refactor across a binary/library boundary, `golden`'s own pinned expectations are the tripwire that would catch silent drift between the two) *twice* per case, entirely in-process — fresh `lex`/`parse`/`sema::check_typed`-or-`loader::load_closure`+`sema::check_program_typed`/`eval::interp::eval_image`/`eval::image_checks::check_sealed`/`report::render` every call, no caching, no shared state, no parallelism (the task's own \"keep it dumb\" instruction) — and byte-compares the two outputs, printing the first differing line on any mismatch. This is the M4 down-payment on 04-compiler.md §8's own \"identical declared inputs ... produce a byte-for-byte identical ... image and report\" (`compiler.repro.byte-identical`, which stays an explicit gap until the binary image itself exists at M5 — there is no linked artifact yet for that clause to cover); this clause instead proves the *report* half of that sentence, provable today. `report::render` itself is architecturally why this holds: no I/O, no wall clock, no random iteration order anywhere in `report.rs` (every collection walked is already a `BTreeMap` or a program-order `Vec`, `eval::image::ImageGraph`'s own construction discipline) — it is a pure function of its own arguments, and the digest (`report::sha256_hex`) is a pure function of bytes, so two fresh runs over identical declared inputs cannot disagree short of a real bug. Verified this session: `cargo xtask report-determinism` reports `4 case(s) reproduced byte-for-byte across two runs` (`golden/appliance`, `golden/image-basic` — including its own decision-10 failure-text report, proving the oracle is equally meaningful on a rejected report as an accepted one — `golden/image-project`, `golden/image-helper-accept`); `cargo xtask check` green with the new step wired in, right after `golden` and before `corpus`."

