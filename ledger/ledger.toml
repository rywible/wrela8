# --- sema -------------------------------------------------------------

[[clause]]
id = "sema.check.dump-stable"
doc = "02-language.md#2"
status = "test"
tests = ["golden/check-module"]
note = "wrela dump --stage=check pins the check dump format (plans/M2.md decision 8): `Module path=<dotted.path>` then one two-space-indented `<Kind> <name>` line per module-level item, source order, no spans; item A's dump was names only (Const/Fn/Struct/Enum/Pool) — item B graduates it to full resolved signatures (sema.types.declarations): `data`/`resource` on Struct/Enum (+ `deriving(...)` when present), every field/variant/param/return type spelled fully with every access mode explicit (including the default `read`), receiver first (`mut self`/`take self` always explicit; a `pub` method's or `init`'s `read self` is explicit too — the one case the AST cannot tell apart from a private method's plain `self`, which prints bare `self` until item D infers its real effect), generics as `[T, const N: usize]`, `init`/methods nested two more spaces under their struct/enum"

[[clause]]
id = "sema.names.resolution"
doc = "02-language.md#3.2"
status = "test"
tests = ["golden/check-module", "golden/err-name-unknown", "golden/err-name-duplicate", "golden/err-name-shadow"]
note = "collect + resolve (plans/M2.md item A): every module-scope const/fn/struct/enum/pool name is unique (duplicate is an error at the second declaration); every identifier in every body binds to the prelude, a module declaration, or a local introduced by assignment/parameter/pattern binding/for binding/closure param, or is `error[name]: unknown name \\`x\\` at L:C`; shadowing an outer local (only a closure introduces a new scope) is `error[name]: \\`x\\` shadows an outer local at L:C`; type names in annotations resolve the same way. Member/method names after `.` and leading-dot enum variant refs do not resolve yet (need type information, item B)"

[[clause]]
id = "sema.types.declarations"
doc = "02-language.md#6"
status = "test"
tests = ["golden/check-decls", "golden/err-type-unknown", "golden/err-type-deriving"]
note = "the `Type` enum (plans/M2.md decision 4: one plain enum, structural `derive(PartialEq, Eq, Clone, Debug)`, no interning — `syntax::ast` now derives `PartialEq, Eq` throughout so `Expr` can sit unevaluated inside `Type` for array lengths/`Bytes[N]`/generic const args, item H evaluates the literal subset) and the declare pass (types.rs): every fn/async fn/init/method signature, struct field, enum variant payload, and const's declared type resolves against the M2 prelude (scalars, `[T; N]`, tuples, `Option`/`Result`, `own[P] T` with `P` resolved to a declared pool, `Static[T]`, `Str`, `Bytes[N]`/bound-elided bare `Bytes` in parameter position only) or a user struct/enum name, with generic-argument-list arity checked against the declared generic parameter count; an unresolvable name is `error[type]: unknown type \\`X\\` at L:C`. Data-vs-resource classification is transitive and memoized: `resource struct`/`@actor`/`@driver` is a resource by fiat, `own[P] T` is always a resource, `Static[T]` is always data, and any struct/enum/array/tuple/`Option`/`Result` containing a resource is a resource; direct or mutual by-value recursion (no indirection exists in M2 besides `own`/`Static`, which are handles and do not recurse) is `error[type]: \\`X\\` is infinitely sized (recursive by value) at L:C`, reported at the back-edge field. `deriving(...)` validates against the closed list (`Format`; `From` requiring exactly one variant with exactly one field/payload, or a one-field struct) — any other name is `error[type]: unknown deriving \\`X\\` at L:C`. A dotted `own[Owner.Name]` pool path fails closed (`error[unimplemented]`, actor scoping is M6+); everything else unresolvable at this stage (bodies, generic instantiation correctness) is out of scope for this item"

[[clause]]
id = "sema.names.imports"
doc = "02-language.md#2"
status = "gap"
note = "`check` operates on one file (plans/M2.md decision 6); resolving an import's target needs the manifest walk and package loading (a later milestone) — until then every `from ... import ...` fails closed (sema.unimplemented.fail-closed)"

[[clause]]
id = "sema.unimplemented.fail-closed"
doc = "02-language.md#2"
status = "test"
tests = ["golden/err-unimplemented-import", "golden/err-unimplemented-await"]
note = "the shared `error[unimplemented]: <subject> not checked yet at L:C` helper (plans/M2.md decision 7); item A's only user is `from ... import ...` (sema.names.imports); item C adds `await`/`send`/`with`/f-strings/`comptime if`/`comptime assert`/`@image` bodies/generic instantiation/`checked_to`/`truncate_to` in bodies.rs (golden/err-unimplemented-await pins `await`); later items reuse the same helper for their own fail-closed constructs"

[[clause]]
id = "sema.types.bodies"
doc = "02-language.md#8"
status = "test"
tests = ["golden/check-bodies", "golden/err-type-mismatch", "golden/err-type-cond", "golden/err-type-question", "golden/err-type-resource-eq"]
note = "the body-typing pass (plans/M2.md item C, sema/bodies.rs): assignment introduction/reassignment (same type — `error[type]: expected \\`T\\`, found \\`U\\` at L:C`), unconstrained-literal defaulting (`i64` unless only `u64` fits, `f64`) with range-checking against an expected scalar type (including the combined-sign reading of a negated literal), `if`/`elif`/`while`/`assert` conditions typed as `bool`, `for` over ranges (equal integer endpoint types, a bare literal endpoint deferring to its concrete sibling) and fixed arrays (`take`-consuming form types the same as the lending form — move legality is items E/F), `return` checked against the declared return type (unit fns may fall off the end; exhaustive-return checking is item G's — not checked here), `assert`'s message required to be a text literal, struct/enum construction (named-field literal with defaults, positional one-field shorthand, `init`-bearing types, `Enum.Variant`/leading-dot construction, both fed by the same `types::declare` signatures), field access and calls (arity/label checking shared by fn/method/init/struct-literal/variant construction), closures typed structurally from their call-site's expected `fn` type only (never storable — assigning one to a local is `error[type]`), `?` on `Result`/`Option` with the one-hop `from` conversion (user-written or `deriving(From)`-generated), `match`/`is` pattern typing against the scrutinee (exhaustiveness is item G's), and the fail-closed set beyond imports (`await`, `send`, `with`, f-strings, `comptime if`/`comptime assert`, `@image` bodies, generic instantiation, `checked_to`/`truncate_to` — sema.unimplemented.fail-closed). A generic declaration's own body (struct, enum has none, fn/method) is skipped, not type-checked (item H); `Type`'s derived `PartialEq` compares the unevaluated length `Expr` array/`Bytes` embed span-and-all, so bodies.rs uses its own span-insensitive `types_eq` throughout instead (comparing a literal length by value, a bare name by name) — pinned by every array-parameter case in golden/check-bodies rather than a dedicated golden, since without it almost any array-typed call would spuriously mismatch"

[[clause]]
id = "sema.types.calls"
doc = "02-language.md#5.1"
status = "test"
tests = ["golden/check-bodies", "golden/check-operators", "golden/err-type-arity", "golden/err-type-label"]
note = "call checking (plans/M2.md item C): arity, each argument bound at most once — by label (looked up against the callee's parameter names) or positionally (the next not-yet-bound parameter) — a parameter with a default may be omitted, argument types checked against parameter types; access-mode markers on arguments are parsed but not validated (mirroring call-site markers against signatures is item D). Operator desugar (02-language.md §7.4, 05-library.md §8): builtin scalar `+ - * / %`, wrapping `+% -% *%`, shifts, bitwise, and comparisons never desugar (same-type operands; wrapping/shifts/bitwise integers only); a user (`Named`) type's `+ - * / %` and `<` resolve to the matching method, shape-checked (`read self`, one same-type param, `<`'s method must return `bool`); structural `==`/`!=` are generated for every data type — comparing a resource-classified type is `error[type]` (golden/err-type-resource-eq). Named functions and no-receiver associated functions are typed as `fn(...)` values so they can be passed where a matching function type is expected."

[[clause]]
id = "sema.match.exhaustive"
doc = "02-language.md#7.2"
status = "test"
tests = ["golden/check-match", "golden/err-match-nonexhaustive", "golden/err-match-redundant-wildcard", "golden/err-match-or-bindings"]
note = "match exhaustiveness (plans/M2.md item G, sema/matches.rs): a whole-module re-walk (after bodies.rs) that finds every `match` statement and `is` expression and re-derives each scrutinee's type via `bodies::check_expr` (widened to `pub(crate)`, the one function bodies.rs uses to synthesize an expression's type in a local context — real reuse of its typing machinery, not a reimplementation; `bodies::check_pattern`/`ModuleCtx`/`FnCtx`/`types_eq`/`decl_variant_payload_types`/`literal_array_len` are widened the same way). Exhaustiveness is a plain recursive usefulness check over a `Vec<RPat>` pattern matrix (decision 4: no unification, no Maranget-style optimization beyond what correctness needs), compositional over closed enums (`Option`/`Result` included, as ordinary two-variant sums), `bool`, `unit`, tuples, and fixed arrays with literal lengths (component-wise); integers, `char`, strings, `Static`/`Bytes`, non-literal-length arrays, and anything else this pass does not enumerate constructors for require an explicit wildcard/binding arm. A non-exhaustive `match` is `error[match]: match is not exhaustive: missing <witness> at L:C`, the witness the first uncovered pattern in declaration order (`.Absent`, `(.None, _)`, ...); an arm (including a wildcard) matched by no value not already covered by earlier arms is `error[match]: unreachable arm at L:C`; a guarded arm is never checked for its own uselessness and never contributes to coverage. `|` alternatives must bind the same names at the same types (`error[match]`) at every nesting depth, checked independently of any guard. `is` demands no exhaustiveness but its own uselessness check applies to a top-level `|`'s alternatives (2-language.md §7.2: refutable by design; a pattern that can never match its scrutinee type is already a bodies.rs type error, not double-reported here). One documented gap: a closure's body is only re-walked (for a nested `match`/`is`) when every parameter carries an explicit type annotation (its type then comes straight from `mctx.resolve_type`, still real reuse) — deriving an unannotated closure parameter's type needs the call-site expected-type context bodies.rs's call-checking machinery owns, which this pass does not duplicate; such a closure is left unwalked (not an error — bodies.rs already checked it — just unchecked for this pass, like a generic body is)."

