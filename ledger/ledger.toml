note = "03-hardware.md §6: \"All substantive work happens in the driver's **bottom half** — a high-priority `@task` turn that consumes the level signal, drains a bounded number of completions, validates IDs/generations/epochs/lengths, resolves receipts, and re-wakes itself if work remains.\" §7: \"It never stays active while waiting, so submission turns are not re-entered.\" §6 also: \"Parking on a level predicate uses the runtime's mask–arm–recheck primitive, so a wake before, during, or after publication is never lost.\"\n\nplans/M7.md item G, closed for receipts by E4 / decision 22.\n\n**`@task` and `wake`.** A `@driver` method marked `@task` is the bottom half. `wake(Driver.method)` requires `@task` (`golden/err-wake-not-task`); sites must be ISR or `@task` (`golden/err-wake-outside-isr`). An `async` `@task` is refused (`golden/err-task-async`).\n\n**How the checkable claims are tested.**\n\n1. *Re-wakes if work remains.* `golden/check-interrupt-cell`'s `@task drain` re-wakes when the level signal was nonzero; checkpoint fixed-point consumes the sticky bit.\n2. *Never stays active while waiting.* `golden/err-task-async`; `check_bottom_half` forbids `await`/`send`/`with group` inside `@task`.\n3. *Wake not lost.* Publish-then-wake order; clear-before-call + `did_work` recheck (`hardware.isr.checkpoint-dispatch`). `golden/boot-irq-isr` / `err-boot-irq-isr-runs`.\n4. *Resolves receipts.* Decision 22: `@task` may hold `Receipt`/`IoCompletion` and sync-`claim` after `drain` (`golden/boot-blk-roundtrip` / `err-boot-blk-roundtrip`). Unit `bottom_half_forbidden_reason_names_await_send_not_receipt` pins that await/send stay forbidden while Receipt is allowed.\n\n**Evidence.** G's interrupt-cell / ISR goldens above, plus E4's flagship round trip.\n\n**Left closed, named.** Caller-side `await receipt` execution — plans/M8.md item E. The driver-mailbox half of this line is **done** (item D, `library.driver.messageable`): a `@driver` declared `mailbox=n` is messageable, and a messageable driver replying `Receipt[P]` is refused by name pointing at item E (`golden/err-driver-message-receipt`).\n\n**M13 item C cuts 6–7 (2026-07-27).** `@task(priority=)` / `@task(budget=)` are `error[type]` (`golden/err-task-priority-removed`); `trigger=` / `poll=` stay for the ISR gate. 03 §6's \"high-priority `@task`\" wording becomes \"`@task`\"."

[[clause]]
id = "hardware.interrupt-cell"
doc = "03-hardware.md#6"
status = "test"
tests = [
  "golden/check-interrupt-cell",
  "golden/err-isr-plain-field",
  "golden/err-interrupt-cell-elem",
  "golden/boot-irq-isr",
]
note = "03-hardware.md §6: \"`InterruptCell[T]` is the sole ISR/ordinary-code channel: `load_acquire`, `store_release`, `swap_acquire`, `fetch_or_release`, and friends, interrupt-atomic with respect to every vector that may touch the cell. A plain field is not a communication channel.\"\n\nplans/M7.md item G, decision 17 freezes representation and address discipline under decision 11's one-word rule and 06-machine.md §4's checkpoint-only delivery.\n\n**Decision 17: one 64-bit word in driver state; ops address the live word at `self_ptr + field_off`.** The cell is an 8-byte slot in the `@driver`'s state aggregate (`mwir::size_of` / `codegen::is_aggregate`, same builtin-pseudo-type vehicle as `Actor[T]`). Construction is `InterruptCell(v)` (source-visible — not a capability). Methods are `load_acquire` / `store_release` / `swap_acquire` / `fetch_or_release`. Revision 0.1 admits only `T = u32` (the worked example); every other `T` fails closed by name (`golden/err-interrupt-cell-elem`). Every method and every assign of a cell field of `self` lowers to an instruction that RMW's / stores through the prologue's saved receiver pointer plus the field's byte offset — never through the frame copy of `self` alone. A `mut self` epilogue write-back **skips** `InterruptCell` fields so an ISR update that landed at a checkpoint during the turn cannot be stomped by writing a stale frame copy back over the live word.\n\n*Rejected: RMW on the frame copy.* Checkpoints fire between ordinary instructions (06 §4); an ISR can update the live cell while a `mut self` bottom half holds a stale frame; epilogue write-back of that frame would erase the ISR's bits. That is exactly the bug class live addressing closes.\n\n*Rejected: a side table of cells.* Same rejection decision 11/12 already made — the cell *is* a field of the driver; a second table would disagree with the aggregate layout.\n\n**What atomicity means on this machine (honest, not overclaimed).** 06 §4 delivers vectors only at compiler-emitted checkpoints. On a single core with no nesting (03 §6 rev 0.1 masks the current vector on entry), an ISR and ordinary code never interleave *mid-instruction*, and the compiler emits **no checkpoint inside** an `InterruptCell` RMW sequence. That makes LDAR / compute / STLR structurally sufficient for every named op: the value observed is whatever the last STLR published, acquire/release ordering is exactly what those instructions provide relative to other memory ops around them, and no ISR can OR bits between the load and the store of one ordinary RMW. It does **not** claim multicore or nested-ISR ordering — those would need LDAXR/STLXR (or an atomic RMW) because a second observer could interleave a store. HVF on the flagship host data-aborts `LDAXR` against guest DRAM, which is an independent reason revision 0.1 emits the non-exclusive forms only; the exclusive encoders stay unit-tested for the day that constraint changes.\n\n**Encodings.** `encode::{enc_ldar_w,enc_stlr_w,enc_ldaxr_w,enc_stlxr_w}` (and the X forms) are pinned against `as -arch arm64` on macOS — unit test `encode::tests::interrupt_cell_acquire_release_and_exclusive_forms` holds the hand-computed words (`ldar w0,[x1]` = `0x88dffc20`, `stlr w0,[x1]` = `0x889ffc20`, `ldaxr w0,[x1]` = `0x885ffc20`, `stlxr w2,w0,[x1]` = `0x8802fc20`, plus a second register triple). Codegen emits only the LDAR/STLR forms. The width=8 codegen arms exist for the day `T` widens; revision 0.1 never emits them (`T = u32` only).\n\n**Evidence.** `golden/check-interrupt-cell` (construct, ISR `fetch_or_release`, bottom-half `swap_acquire`; mwir pins the three Inst forms at `field_off=16`). `golden/err-isr-plain-field` is the plain-field channel rejection. `golden/err-interrupt-cell-elem` is the non-`u32` rejection. `golden/boot-irq-isr` is the executing oracle.\n\n**Left closed, named.** Multicore / nested delivery; `T` other than `u32`."

[[clause]]
id = "hardware.isr.checkpoint-dispatch"
doc = "03-hardware.md#6"
status = "test"
tests = [
  "golden/boot-irq-isr",
  "golden/err-boot-irq-isr-runs",
  "golden/check-irq-bind",
  "golden/check-interrupt-cell",
]
note = "03-hardware.md §6 + 06-machine.md §4: vectors fire only at compiler-emitted checkpoints; the ISR masks handled bits, acknowledges, publishes an `InterruptCell` level signal, and `wake`s the bottom half; the bottom half consumes that signal.\n\nplans/M7.md item G's executing oracle.\n\n**Multi-vector checkpoint.** `layout::build_checkpoint_and_vector_stub_ex(group, irq_vectors, wake_drains)`: empty irq/wake lists stay **byte-identical** to the M6 single-vector / whole-word-clear loop (unit test `layout::tests::checkpoint_empty_irq_wake_is_byte_identical_to_m6_path` — also asserts the multi path emits BIC and two `Reloc::Call`s). Non-empty: per-bit dispatch (`BL` ISR with `x0 = driver_state`), `BIC` clear of only the serviced bits (a raise that lands mid-dispatch is kept), then a sticky wake-pending drain that clears the bit **before** calling the `@task` and re-walks until no wake bit remains (fixed-point — §6's \"re-wakes itself if work remains\"). A trailing `did_work` recheck closes the mask–arm–recheck window for a raise or wake that arrived during the drains. `encode::enc_bic_reg` is hand-checked (`bic x0, x1, x2` = `0x8a220020`).\n\n**Host inject.** A sealed image with at least one bound vector emits `IrqHostInject base=… offset=0x60 status=0xa501 vector=N` (`IRQ_HOST_STATUS_MAGIC = 0xA501`, `IRQ_STATUS_OFFSET = 0x60` — the worked virtio ISR status word). The VMM writes that u32 into guest DRAM at `base+offset` and `raise_vector`s the bit **before** the first guest instruction, so init's `interrupt_status.read() == 42241` cannot be a value the guest produced.\n\n**Evidence — every assertion, hand-computed.**\n\n`golden/boot-irq-isr`:\n1. init: `interrupt_status.read() == 42241` (`0xA501`). Catches: host write never landed, wrong claim base, or Mmio window not the inject window.\n2. ISR: `handled = status & 1` then `fetch_or_release(handled)` / `interrupt_ack.write(handled)` / `wake(drain)`. Undefined bits `0xA500` must not be published or acked (03 §6).\n3. `@task drain`: `swap_acquire(0) == 1`. Catches: ISR never ran, never saw bit 0, never woke, or wake drain never scheduled the bottom half.\n4. test: two `mark` awaits then `read_marks() == 42`. Surviving means every assert above held across real checkpoint delivery.\n\n`golden/err-boot-irq-isr-runs` is the vacuity twin (`err-boot-driver-init-runs` pattern): identical image, drain asserts `status == 0` inverted. Pins `FAILED assertion failed: INVERTED ON PURPOSE: this is the vacuity control`. An all-zeros assertion set that never delivered the vector would still report `ok` on the green twin — this file is the lesson that the green path really ran.\n\n**How §6/§7 claims are checkable here.** Re-wake: drain loop is fixed-point over the sticky bit (unit shape in `check-interrupt-cell`'s source re-wake; this boot proves the scheduler consumes it). Never stays active while waiting: `@task` is sync (still `err-task-async`). Wake not lost: clear-before-call + `did_work` recheck in the checkpoint service; publish-then-wake order pinned in mwir.\n\n**Left closed, named.** Receipt resolve (item E); multicore / nested delivery.\n\n**Item I's sweep (2026-07-25) — \"Receipt resolve (item E)\" left-closed line is stale.** E4's flagship resolves on the bottom half after checkpoint delivery; multicore/nested delivery remains named."
