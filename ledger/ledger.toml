]
note = "plans/M7.md item H1, 03-hardware.md §9: \"Device bring-up is a typed state chain (for virtio: `Reset -> Acknowledged -> DriverClaimed -> FeaturesNegotiated -> FeaturesAccepted -> QueuesConfigured -> Running`); publication requires `Running`, and reset consumes it ... Each fallible transition **consumes** its input state\". Decision 10 found the mint is this chain's operation, not item C's: `docs/language/examples/virtio-storage.wr` spells `claimed = VirtioBlock.claim(cap=take cap)` then `self.irq_regs = claimed.map_partition(VirtioIrqMmio)`, and nothing between C and H minted an `Mmio[L]`.\n\n**What a bring-up state is at runtime.** Decision 11's one word (`hardware.capabilities.runtime-word`): one 64-bit guest base address — the same representation as `DeviceCap[D]` and `Mmio[L]`. A `DriverClaimedDevice[D]` holds the device's `devregs` window base; every later state of the chain would hold that same base. The seven type names (`ResetDevice[D]` .. `RunningDevice[D]`) resolve as sealed-authority types beside §1's capabilities (undeclarable, unimportable, unconstructible, a resource by fiat, no byte encoding, an `@actor` may not hold one), and `mwir::size_of`/`codegen::is_aggregate` carry each as one opaque word.\n\n**`claim` emits no status writes on machine v1.** 06-machine.md §3: \"device topology is a *build output*, not a probed fact\" and \"cold boot is a design property: there is nothing to negotiate\". The VMM has no virtio MMIO status register file (`MagicValue`/`DeviceID`/`Status`/`QueueSel` — `wrela-vmm::devices`' own module doc; `BlkConfig` *is* the transport configuration, parsed out of the report). So `<Device>.claim(cap=take cap)` is a pure authority transition: it consumes a `DeviceCap[D]` (`take` is load-bearing — 03 §9's \"each fallible transition consumes its input state\") and yields a `DriverClaimedDevice[D]` carrying the same base. Lowering is one `Copy` (`golden/check-device-claim/expected/mwir.txt`), not a sequence of status stores invented against a register file that does not exist.\n\n**`map_partition(L)` is restricted to the driver's declared `Mmio[L]` fields.** 03 §2: \"A driver or sealed protocol partitions its claim into declared, non-overlapping layouts\". The layouts a `@driver` may map are exactly the ones its declared `Mmio[L]` fields name — the same set `types::check_mmio_claims` proves pairwise disjoint (`hardware.mmio.no-alias`) and the same set `layout::device_register_windows` sizes the claim's `devregs` window from. A partition mapped outside that set would be a live layout no rule ever ranged over and a window derived differently from the access that uses it. `check_map_partition` enforces the restriction at the call site (callable only inside a `@driver`, layout must be `@layout(mmio)`, layout must appear among the owner's mints).\n\n**Evidence.** `golden/check-device-claim` is the dump oracle: `--stage=check`/`typed` pin `Device.claim` and two `Device.map_partition` intrinsics; `--stage=mwir`/`asm` pin the MMIO they make possible at two widths. `golden/boot-device-claim` is the executing oracle on Hypervisor.framework (`test device_claimed_image: ok`), and `golden/err-boot-driver-init-runs` is its vacuity control (an inverted assertion aborts with a diagnosable `FAILED` line — which also pins that `layout::build_entry_driver` arms the test continuation *before* boot, so an abort inside a boot-time `init` is image-fatal rather than a fault at `pc=0x0`).\n\n**plans/M7.md item E1 — the rest of the chain to `Running`.** Decision 14: `negotiate` is a build-time fact (`required_features=` vs `virtqueue::DEVICE_FEATURES`); the guest call is a pure authority transition. `VirtQueue.configure` places the split ring inside a declared DMA pool (one geometry derivation in `virtqueue::place_ring`, shared by checker/placer/report/`verify_ring_windows`) and mints the queue word; the mut device local becomes `QueuesConfiguredDevice[D]`. `read_capacity_sectors` lowers to the image-declared `capacity_sectors=` constant. `start()` yields `RunningDevice[D]`. A fallible `init` returning `Result[unit, BootError]` is real — boot allocates a reply slot, and `Err` is image-fatal through the same `__wrela_abort` path an `assert` failure inside `init` uses (`FAILED {Driver}.init returned Err`; `golden/err-boot-device-bringup`). `golden/boot-device-bringup` is the HVF oracle: the VMM constructs `BlkDevice` from the emitted `BlkDevice`/`BlkQueue`/`BlkPool` lines and the guest walks the chain to `Running`.\n\n**Item G opened `take_irq()`.** Vector binding is `hardware.irq.vector-binding` (decision 12); H1's `golden/check-device-take-irq` now type-checks, and seal-time unowned lives in `golden/err-irq-unowned-vector`. **Left closed past `Running` when E1 landed (E2/E3 since closed their halves).** `drain`, completion validation, `IoCompletion[P]` — E4. `suppress_interrupts`/`poll_sources` remain with E4/G's remaining closed surface.\n\n**Self-audit (item H1's second commit).** Every arm the item added was enumerated from the diff and matched to a test. Source-shaped rejections gained `err-*` goldens: claim arity/label/`take` (`golden/err-claim-*`); every remaining transition and the unknown-op arm (`golden/err-device-*`); every `map_partition` rejection (`golden/err-map-partition-*`); signed-register and out-of-immediate-reach offsets (`golden/err-mmio-signed-register`, `golden/err-mmio-offset-out-of-reach`); and the async MMIO/bring-up path (`golden/err-async-mmio`). Internal guards gained unit tests in the same file as the code: `codegen::tests::mmio_access_width_fail_closed_arms` (including the alignment `internal`, unreachable from source because `check_layouts` already refuses a misaligned `@offset`), `lower::integration_tests::mmio_register_offset_fail_closed_arms` (cross-module arm — not reachable from a single-module golden, pinned by constructing an empty layouts table — and the missing-register `internal`), and `mmio_access_names_internal_guards` (five defensive arms `check_mmio_access` already makes impossible).\n\nTwo arms stand as genuinely unreachable from source and are recorded rather than papered over. (a) `check_device_claim`'s post-`check_expr` \"authority over *this* device\" and non-`Named` arms: `check_expr` is handed `Some(&DeviceCap[D])` as the expected type, so every wrong capability is already rejected with the ordinary `expected DeviceCap[D], found ...` diagnostic before those arms run — the same shape item C deleted its post-hoc `types_eq` width guard for. (b) `mmio_access_width`'s alignment `internal` and `mmio_access_names`/`mmio_register_offset`'s missing-register internals, as above."
