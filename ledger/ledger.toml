note = """**Retargeted by M14 (2026-07-27)** from \"build a unified wait-for-graph analyzer\" to the constructive progress theorem now normative in 04 \u00a71. History preserved below.

**Current subject.** 04 \u00a71 Progress proves progress constructively, per wait-edge kind — no graph analyzer. FlowWir `AwaitKind` dispositions: actor-call await (handle DAG + `Actor[T]` `!crosses_actor` mobility); group join (reduces to the same); receipt await (external-event carve-out + deadline/quarantine). Non-suspension: admission is fail-fast `NotAdmitted`; no blocking acquire (`reserve` sync); cleanup/recovery introduce no actor wait edge; starvation is FIFO+RR + loop-discharge. Upward-edge rule stated: downward = handle, upward = resolution or vector. Fail-closed refusal for future handle-rebind / blocking-acquire. Witnesses: `image.graph.construction-dag` (DAG check, now law for handles too), `actors.messages.value-restrictions` / `actors.handles.image-wiring-only` (never rebound via message/collection), `values.classes.computed` (`Actor` \u2192 `!crosses_actor`). Forward-reference cyclic wiring remains unconstructible by declaration-order evaluation (`error[name]`); source golden graduation is `image.graph.handle-dag`'s remaining pin.

**History (opened 2026-07-25, M8 item R).** Originally a ledger completeness hole: \u00a71 Progress had no clause while naming a unified wait-for graph, cycle diagnostics, and (then) priority/deadline inheritance. Inheritance cut by M13 item C. The analyzer was never built; M14 (human-directed 2026-07-26, crash-only register) deleted the analyzer as the wrong kind of dumb and replaced the paragraph with the constructive theorem. Prior flip condition (\"graph built + golden prints a full cycle for a source-reachable cyclic wait\") is superseded — cycles of that kind are unconstructible by the capability cut of 02 \u00a712.1."""

