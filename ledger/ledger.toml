  "unit:string_bound_size_is_length_word_plus_n_byte_slots",
]
note = """02-language.md §6.2: `String[..N]` is owned UTF-8 with capacity `N`; the `..N` prefix always means bounded runtime occupancy. plans/M9.md item C1 (decision 201).

**Representation (decision 201).** One `usize` occupied-length word plus `N` byte slots, each a machine slot (`size_of = 8*(1+N)`), matching `Bytes[N]`'s slot-per-byte convention so `Project`/`MakeAggregate` need no second layout rule. Rejected alternative: dense `align8(8+N)` packing — smaller, but a distinct stride from every other aggregate. No heap / fat pointer: capacity is a build-time fact.

**Surface.** Text literals coerce into `String[..N]` when the expected type asks and the occupied byte length ≤ `N` (else a type error, not truncation). `.len` is the occupied length; `[i]` with a literal index projects byte slot `1+i`. Exact `String[N]` and bare `String` (bound-elided) refuse by name. `Bytes[..N]` does **not** fall out of this change and stays `unimplemented_at`.

**Pinned.** `check-string-bound`: settle `2104105` (len=2, 'h'=104, 'i'=105), image arg `settled=2104105` (eval/value pins); guest `@test(runtime) guest_string` restores mwir pins for `occupied` / `byte0` / `byte1` / `probe` (plans/M9.md item KK). Capacity and exact-form refusals pinned separately."""

[[clause]]
id = "library.format.contract"
doc = "05-library.md#6"
status = "test"
tests = [
  "golden/check-format-bound",
  "golden/check-format-fstring-guest",
  "golden/err-format-conflict",
  "golden/err-format-secret",
  "golden/err-format-payload-enum",
  "golden/check-import-deriving-format",
  "golden/check-import-alias-deriving-format",
]
note = """05-library.md §6 / 02-language.md §7.5: the static `Format` contract and `deriving(Format)`. plans/M9.md item C2 (decisions 202–206). Does **not** flip `comptime.fstring.bounds` (item D).

**Contract (decision 202).** Associated `max_formatted_len() -> usize` and method `format(read self) -> String[..N]` with `N == max_formatted_len()`. Empty-spec only: `{expr:spec}` is comptime syntax for f-strings (item D), not a runtime parameter. Rejected: typing a runtime `spec: u64` (02 §1.1 writes spec as syntax after a colon); rejected: inventing a `FormatSpec` type this milestone does not need.

**Scalars (decision 203).** Core scalars have standard Format — `u8`/`u16`/`u32`/`u64`/`usize`, signed peers, `bool`, `char` — via builtin `.format() -> String[..K]` with fixed `K` (decimal digit ceilings; `bool` 5; `char` 4). Both tiers: eval formats to `Value::Str`; lower emits `Inst::FormatScalar`.

**Concatenation (decision 204).** `String[..N] + String[..M] -> String[..N+M]` (text literals coerce to `String[..len]` in this position). Eval concatenates byte vectors; lower emits `Inst::StringConcat`. This is the primitive f-strings (D) sum with.

**`deriving(Format)` (decision 205).** Fieldless structs and unit enums format their names. Fieldful structs generate `\"Name(f1=\" + self.f1.format() + \", f2=\" + ... + \")\"` with bound = name + punctuation + each field's scalar Format bound. Payload-bearing enums refuse by name. Conflict with an explicit `format` / `max_formatted_len` refuses (same rule as `deriving(From)` vs explicit `from`). `Secret` has no Format (05 §6) — deriving or hand-declared.

**Pinned.** `check-format-bound`: scalar `42` → settle `2052050`; literal `42.format()` and inferred `a = 42; a.format()` → `2052050` (item D2); `true` → `4116114`; `\"hi\"+\"!\"` → `3104105`; `Point(x=3,y=7).format()` → `15080111` with bound `33`; `Hue.Red` → `3082101` (eval/value pins); guest `@test(runtime) guest_format` restores mwir pins for `Point.format` / `Hue.format` / scalar Format / concat (plans/M9.md item KK). Import / alias goldens pin `Tag(n=9)` → `8084097` with guest paths restoring `Tag.format` / `Label.format` asm.

**Guest tier (plans/M9.md item D3, decision 320; item KK).** `check-format-fstring-guest`: `@actor` `pub fn fmt_len` builds `f\"pt={Pt(x=3, y=7)} n={self.n}\"`, returns `.len`; mwir pins `FormatScalar`/`StringConcat`/`Call key=Pt.format`, asm pins `Pt.format` frame=1440 / `Store.fmt_len` frame=2096, boot asserts `19`. Measured frames do not threaten the 1 MiB per-core stack under realistic nesting (decision 323). Fn-key ratchet: `guest_fn_key_census.rs`."""

[[clause]]
id = "sema.names.imports"
doc = "02-language.md#2"
status = "test"
tests = ["golden/multi-module-accept", "golden/import-cycle-accept", "golden/err-import-missing-name", "golden/err-import-nonpub", "golden/err-import-collision", "golden/err-import-collision-local", "golden/err-import-submodule"]
note = "plans/M4.md item A: `sema::imports::resolve_imports` (crates/wrela-compiler/src/sema/imports.rs) replaces the old blanket fail-closed. `sema::check_program` (mod.rs) builds one whole-program export table first — every module in the closure's own `symbols::collect` table plus its `pub const`/`fn`/`struct`/`enum` subset (`pool` is grammatically `pub`-less, 02-language.md §4, so never importable; `pub from ... import ...` re-export is *not* implemented — a module's exports are only its own declarations, a real, narrow, disclosed gap no required golden needs) — then resolves each module's own `from path import Name [as Alias]` against it: the target module always exists (`crate::loader` already guaranteed every import's module path loaded, or the build never got this far — a missing module cannot surface here); a missing declaration is `error[name]: module \\`X\\` has no item \\`Y\\`` (golden/err-import-missing-name); one that exists but is not `pub` is `error[name]: \\`Y\\` in module \\`X\\` is not \\`pub\\`` (golden/err-import-nonpub); a local name bound twice — by two imports, or by an import and a local declaration — is `error[name]: import \\`Y\\` is bound more than once` / `... collides with a local declaration` respectively (golden/err-import-collision, golden/err-import-collision-local), checked in source order (fail-fast, decision 1's existing discipline) against `symbols::collect`'s own table plus every earlier import in the same file. A bare `from core import <name>` (no further segment) names a *submodule*, not a declaration (02-language.md §2's own \"from core import time\" reading — `core` has no declaration to look inside, so this shape is unambiguous the moment the path is exactly `[\"core\"]`) and fails closed via the existing `unimplemented_at` helper (golden/err-import-submodule; sema.unimplemented.fail-closed) rather than building the different kind of binding (name -> whole module) it would need — a real, disclosed scope carve-out, not silently approximated. `symbols::resolve` (symbols.rs) is extended, not replaced: its `Resolver` now also carries this module's own `ImportBindings` and checks them in `resolve_name` (after locals/symtab, before the prelude) — every single-module caller (the plain `check`/`check_typed` entry, `specialize.rs`'s const skeleton, the sema fuzzer) passes an empty map, so a module with no imports resolves byte-identically to before this item (no existing golden moved). *Consuming* an import beyond name resolution — calling an imported `fn`, reading an imported `const`, constructing/field-accessing an imported `struct`/`enum` — is `sema::check_program`'s own splice step (mod.rs): the exporting module's already-built `bodies::ModuleCtx` entry (fn/const/struct/enum, each independently and completely built per module, needing nothing from any other module) is cloned into the importing module's own `ModuleCtx` under the (possibly aliased) local name, read-only reuse never a re-check — which is exactly what makes import cycles free (golden/import-cycle-accept: two modules each importing and calling a fn from the other). M4 item A's disclosed scope line — an imported `struct`/`enum` name usable as a *value* but not as an explicit type annotation — is **closed** by plans/M9.md item A1; see clause sema.names.imported-types for what replaced it. golden/multi-module-accept: three modules, nested directories (`app.main`, `app.util`, `app.lib.constants`), a `from ... import ... as` alias (`double as twice`), a private sibling declaration (`app.util::secret`) never imported, proving pub/non-pub coexist untouched."

[[clause]]
id = "sema.names.imported-types"
doc = "02-language.md#2"
status = "test"
tests = ["golden/check-import-type-position", "golden/err-import-type-not-pub", "golden/check-import-type-cycle", "golden/err-import-type-cycle-sized", "golden/check-import-alias-method", "golden/check-import-alias-pattern", "golden/err-import-alias-method-missing", "golden/check-import-alias-sig-param", "golden/check-import-alias-sig-return", "golden/check-import-alias-sig-generic", "golden/check-import-alias-sig-swap", "golden/check-import-alias-sig-dual", "golden/check-import-sig-peer", "golden/err-import-alias-sig-swap-comptime", "golden/check-import-reachable-type", "golden/check-import-reachable-chain", "golden/check-import-reachable-field-generic", "golden/check-import-reachable-alias", "golden/check-import-reachable-private", "golden/check-import-reachable-alias-generic", "golden/check-import-reachable-enum-payload"]
note = "plans/M9.md item A1: 02-language.md \u00a72's \"Everything else is imported\" means an imported `struct`/`enum` name is legal **wherever a type is legal**, not only in value position (which is all M4 item A delivered \u2014 see sema.names.imports for the gap this closes). Six positions, each with a case in golden/check-import-type-position: fn parameter (`take_pair(p: Pair)`), fn return (`-> Pair`), struct field (`p: Pair`), `const`'s declared type (`NO_PAIR: Option[Pair]`), `let`-style annotation in a body (`q: Pair = p`), and generic argument (`Option[Pair]`, `[Pair; 2]`, plus the imported *generic* `Box[u32]` as the constructor itself). Mechanism (decision 8): `imports::declared_type_shapes`/`imported_type_shapes` build one local-name -> generic-arity table off **raw AST on both sides** \u2014 this module's `import` statements and the exporting module's `struct`/`enum` headers \u2014 which `types::declare_with_imports` merges into its own module-local `shapes` table and `bodies::build_module_ctx` merges into `ModuleCtx::shapes` (the same table `ModuleCtx::resolve_type` reads for body annotations). Because both halves are raw AST, the table is complete before any module's `declare` runs, so 02 \u00a72's \"import cycles between modules are legal\" is preserved exactly as `sema::check_program_typed`'s splice note states it: no module's type table waits on another's (golden/check-import-type-cycle \u2014 two modules each naming the other's `struct` in a fn signature). Decision 9: an imported type resolves to `Type::Named(<local name>)`, the possibly-aliased spelling the author wrote, which is the same key the splice already installs in `ModuleCtx::structs`/`enums`.\n\nDecision 10, the half that is not just a name table: data-vs-resource classification (sema.types.declarations) is transitive, so a local struct with a field of an *imported* `resource struct`/`@actor` type is a resource \u2014 a fact no module-local pass can compute. `types::classify_closure` therefore recomputes every module's classification over the whole closure, between the declare loop and the splice, on the same read-only-of-finished-output footing (`golden/check-import-type-position`'s `HoldsTicket` prints `resource` from a single imported field; verified transitively across three modules through an alias by hand). Its `in_progress` set is keyed `(module, name)`, so a by-value cycle that closes *across* modules gets the identical `error[type]: \\`X\\` is infinitely sized (recursive by value)` it already gets within one (golden/err-import-type-cycle-sized). `sema::dump_program` runs the same two whole-closure inputs, so the `check` dump prints the same `data`/`resource` word sema used rather than a module-local re-derivation; `layout.rs`'s and `mwir.rs`'s post-sema re-derivations of `declare` get the arity table too (`layout::closure_imported_types`), or a signature naming an imported type would fail one layer down as a `LayoutError`.\n\nEvery *validity* question about the import itself is unchanged and still answered by `imports::resolve_imports` before `declare` ever runs, so the distinct diagnostics survive into type position: a non-`pub` type named as a type is still `error[name]: \\`Hidden\\` in module \\`app.shapes\\` is not \\`pub\\`` (golden/err-import-type-not-pub), never `unknown type`; a missing name is still \"module `X` has no item `Y`\"; and aliasing a sealed authority type name (03-hardware.md \u00a71, \"no address, import, or cast creates one\") is still rejected at the import \u2014 verified by hand with `from b import Thing as Mmio` used in a fn signature, which reports the capability rejection, not a type-position acceptance (golden/err-cap-import pins the mechanism).\n\nDecision 11: the table is built over **specialized** modules at every site, including `layout::closure_imported_types`, because a `struct`/`enum` declared inside a module-level `comptime if` exists only after `specialize` \u2014 an earlier raw-AST version accepted such a type at `--stage=check` and would have rejected the same program one layer down as a `LayoutError`, which is two passes disagreeing about what type names exist. One shape does stay module-local and fail closed rather than approximate, named here so it is not rediscovered (decision 12): `Actor[T]`/capability-argument validation still requires `T` to name a struct declared in the *same* module (`types::validate_actor_handles`/`validate_capability_types`), so an imported `@actor` struct in `Actor[T]` is rejected by the existing named diagnostic \u2014 cross-module actor handles are a milestone question (02-language.md \u00a79.1), not a side effect of a type-name table.\n\nplans/M9.md item DD (decisions 86\u201389): decision 9's last unfinished consumers. Construction (`bodies::check_struct_construction` / enum construct) and the two splices still stamped the *exporter's* spelling into `Type::Named` / `DeclStruct::name` / typed method bodies, so `from lib import Pair as Duo` then `Duo(...).sum()` looked up `Pair` in a table that only held `Duo` (`error[type]: type \\`Pair\\` has no method \\`sum\\`` \u2014 construction worked; only method lookup missed). Fix is one spelling at the splice: `types::rekey_decl_struct_name` on the ModuleCtx clone and `typed::rekey_struct_name` on the TypedProgram clone when `local != target_name`, plus construction/enum-construct sites reading the local lookup key rather than `decl.name`. Method lookup itself was already correct against `Type::Named`. Goldens: `check-import-alias-method` (read / assoc / mut / take under alias, settle `217`), `check-import-alias-pattern` (annotated + constructed scrutinee, settle `210` \u2014 locks the pattern half A1 made work and the construction-as-scrutinee shape DD closed), `err-import-alias-method-missing` (absent method names the author's `Duo`, not `Pair`). Extended this clause rather than opening a new one: the rule is still decision 9's one local spelling; DD was an unfinished consumer, not a distinct rule.\n\nplans/M9.md item FF (decisions 100\u2013104): the **third and last layer** of the same bug. After A1 (annotations), DD (construction/patterns/method lookup), and EE (lower/flowwir_lower emission under the local spelling), `layout::merge_layout_ctx` still keyed layouts by the exporter's AST name (`Counter`/`Color`/`Pair`) while the typed tree and MWIR used the local alias (`Cnt`/`Hue`/`Duo`). Measured at `f3a8fb6`: unaliased imports reached `--stage=asm` with real `bl <Pair.sum>`; the same shape under an alias reported `error[unimplemented]: codegen for unknown struct/enum \\`Duo\\`/\\`Cnt\\`/\\`Hue\\` in this layout context is not implemented yet`, and `xtask diff-eval` counted `check-import-alias-method`/`check-import-alias-pattern` as lowering-skips (EE decision 95 deliberately left that visible). Fix: after the own-decl merge, `install_aliased_import_layouts` copies each `from M import T as A` (only when `A != T`) under key `A` and re-keys self-`Type::Named` inside field/payload types via `types::rekey_type_name` — one spelling at the place the layout context is built, never a `get(local).or_else(|| get(exporter))` at a use site. The same two goldens now pin `expected/asm.txt` (`Fn key=Cnt.*` / real `bl <Cnt.bump>` etc.; enum match under `Hue`) and become `diff-eval` agreements. Fourth-layer audit below codegen (report renderer, `verify_section_sizes`, placement/`mwir::size_of`, boot harness, VMM layout_ctx call sites) found no further exporter-spelling key: all consume the `LayoutCtx` this install fills. No `err-*` residue. Extended this clause again: still decision 9's one local spelling, now enforced at every layer.\n\nplans/M9.md item GG (decisions 147–154): a **breadth** finding inside the same decision-9 rule, not another layer. DD/FF re-keyed only the *owning* type of an imported declaration; every other `Type::Named` in its signature (parameter, return, field, generic argument, const type, free-fn signature) kept the exporter's spelling. Measured at `c4f7fc7`: peer aliased in parameter position reported `expected \\`Src\\`, found \\`Item\\``; peer aliased in return position reported the mismatch the other way (`expected \\`In\\`, found \\`Inner\\``); owner-aliased with peer unaliased already worked (FF's golden). Not deriving-specific — a hand-written associated fn failed identically. Fix: at both splices and in `install_aliased_import_layouts`, build one exporter→local map from the importer's bindings for that exporting module (`imports::alias_subs_for_exporter`) and apply it in a single simultaneous pass over the whole signature (`rekey_decl_struct_names` / `rekey_struct_names` / `rekey_type_names`). Unaliased bindings are absent from the map, so the exporter spelling is kept exactly where the importer has no alias — the unaliased case stays working (`golden/check-import-sig-peer`). Rejected again: a fallback that tries local then exporter (DD 86 / FF 100). The earlier entries in this family (A1/DD/EE/FF) were *layer* findings; this one is *breadth* within one layer. Goldens: peer-aliased param (`value=305`, asm `Grip.make`), return (`value=305`), generic argument (`Box[Item]`, `value=406`), true adversarial name-swap typecheck (`check-import-alias-sig-swap`), dual-alias asymmetric settle (`value=403711`, asm), unaliased regression lock (`value=305`), and the A1b shadow withhold when the true swap is evaluated (`err-import-alias-sig-swap-comptime`).\n\nplans/M9.md item HH (decisions 155–164): the importer's type universe was only the explicitly imported names, so a value whose type was reachable through an imported declaration but never named by the importer failed field lookup with the false diagnostic `error[type]: type \\`Box\\` has no field \\`n\\`` (and the sibling comptime construction path abandoned with `internal error: struct \\`Box\\` not found`). 02 §2 says imports are compile-time name bindings — a binding is required to *spell* a name, not to use a value whose type the importer never wrote. Fix: after each explicit import splice, close `ModuleCtx` and `TypedProgram::imported` over every type reachable through imported declarations' signatures, chasing the *defining* module so a two-module chain still resolves; decision 13 stands (reachable entries live only in the importer's lookup tables, never merged into declaration emission). Spelling still requires an import (`symbols::resolve` / `imported_type_shapes`); a non-`pub` type remains refused by name at `resolve_imports` (golden/err-import-type-not-pub), while using a value of a reachable non-pub type is allowed (golden/check-import-reachable-private). Aliasing cannot apply to a name the importer never wrote (golden/check-import-reachable-alias). Goldens: `check-import-reachable-type` (`value=305`, asm), `check-import-reachable-chain` (`value=215`, asm), `check-import-reachable-field-generic` (`value=12013`, asm), `check-import-reachable-alias` (`value=305`, asm `Builder.build`), `check-import-reachable-private` (`value=305`).\n\nplans/M9.md item II (decisions 165–172): HH finding #1 — a reachable generic whose peer type is *aliased* by the importer (`Src as Item` + `wrap_box` without importing `Box`) left instantiation keys under the exporter spelling (`struct:Box[Src]`) after the fn body was re-keyed to `Box[Item]`, so comptime eval abandoned with `internal error: struct \\`Box\\` not found`. Fix: apply the same `alias_subs_for_exporter` map to imported instantiation payloads *and* their canonical-key spellings (and to `CalleeKey::FnInstance`/`MethodInstance` inside re-keyed bodies); `enrich_layout_ctx_with_instantiations` also folds `imported.instantiations` so guest sizing sees `Box[Item]`. Pinned by `check-import-reachable-alias-generic` (`value=406`, asm `wrap_box`/`peel_box`). The no-reachable-`internal error:` ratchet itself is clause `compiler.diagnostics.no-reachable-internal-error`.\n\nplans/M9.md item JJ (decisions 179–186): HH's typed reachability half missed enum variant payloads — `TypedEnum` stored only variant names, while Decl-side already walked payloads for ModuleCtx. A struct reachable only as `Good(Payload)` stayed outside `TypedProgram::imported`, so comptime construction inside an imported body refused a program whose single-module twin evaluates to `406` (and whose sibling `Option[Inner]` shape already worked). Fix: `TypedEnum` carries `variant_payload_types`; the typed collector and re-key walk them. Neighbouring edges (tuple / fixed-array / nested struct fields / `Good(Box[Payload])`) ride the existing `collect_named_type_names` walk once payloads are visible; `own[P] T` in an enum payload is refused by the language itself (pool-binding check does not cover enum payloads — hold it in a struct field). Pinned by `check-import-reachable-enum-payload` (`value=406`, asm). Body-only private-helper refusal remains (`err-import-comptime-private-decl`) with a diagnostic that no longer cites closed item A1b.\n\nplans/M9.md item KK (decisions 360–367): after H3, the reachable-* / alias / import-method asm dumps collapsed to `Store.init` because features were only comptime-reachable. Guest `@test(runtime)` (or actor `pub` for the two generic fixtures whose runtime-test layout refuses `Box[...]`) restores the backend pins named above; `guest_fn_key_census.rs` ratchets the required `Fn key=` spellings so a silent collapse cannot recur."

[[clause]]
id = "sema.unimplemented.fail-closed"
doc = "02-language.md#2"
status = "test"
tests = ["golden/err-unimplemented-await", "golden/err-generic-const-arg", "golden/err-unimplemented-bodyless", "golden/err-import-submodule", "golden/err-with-pool-unimplemented", "unit:check_typed_rejects_imports"]
note = "the shared `error[unimplemented]: <subject> not checked yet at L:C` helper (plans/M2.md decision 7); M4 item A verification also pinned the *single-module entry* half of the old blanket rule: `check_typed` cannot bind imports (only the loader-fed `check_program` can), so an import-bearing module there fails closed naming the entry — never reaching resolution with empty bindings, which would misreport the import as `unknown name`. **plans/M9.md item A2 retired `golden/err-import-typed-stage`**: the CLI's `--stage=typed` / `mwir` / `flowwir` / `asm` / `wrela test` now use the same `load_closure` fork `check`/`image`/`report` already used, so that golden's surface no longer exists through the CLI; the fail-closed arm on `check_typed` itself remains and is pinned by `unit:check_typed_rejects_imports` (direct API call). item A of M2 used it for a blanket `from ... import ...` fail-closed (sema.names.imports) — superseded by M4 item A's real whole-program import resolution, so that use is gone (the case that pinned it, golden/err-unimplemented-import, is retired with it: its module path/file path already disagreed, per the flat-input convention every other golden case uses, so once the loader started running on any import-bearing file it produced a `build`-category disagreement instead of ever reaching this helper — the case simply no longer tests what its name says); M4 item A gives the helper a narrower, still-real user of its own — a *submodule* import (`from core import <name>`, or any bare `from <pkg> import <name>` shaped the same way, 02-language.md §2's own \"from core import time\" reading) binds a name to a whole module, not a declaration, which this item does not build (golden/err-import-submodule; `sema::imports`'s own module doc has the full reasoning). item C adds `await`/`send`/`with`/f-strings/`comptime if`/`comptime assert`/`@image` bodies/`checked_to`/`truncate_to` in bodies.rs (golden/err-unimplemented-await pins `await`); item H narrows \"generic instantiation\" from a blanket fail-closed subject to the specific residual gaps it still owns — a generic *method*'s own type/const parameters (never instantiated), a nested/deep generic-argument shape at a call site, and a non-literal const generic argument (golden/err-generic-const-arg: `Ring[u64, 4 + 4](...)`, decision 4 — arithmetic/calls are not evaluated); later items reuse the same helper for their own fail-closed constructs.\n\nplans/M8.md item R (decision 12) closes a case where this helper's own rejection existed but was **unreachable**: `bodies::check_with` had carried a fail-closed `with pool` arm since M6, but `sema::symbols::resolve` runs first and `pool` had no prelude entry, so 02-language.md §10's second intrinsic scope was reported as `error[name]: unknown name \\`pool\\`` — a typo diagnostic for a construct the lexer keywords and the parser has a dedicated expression arm for. One prelude entry (`sema::prelude::ACTOR_SURFACE`, beside `group`, which was there for exactly this reason) makes it reachable and pins it (golden/err-with-pool-unimplemented). The lesson generalizes and is worth stating once: a fail-closed arm behind an earlier pass's name resolution is not fail-closed, it is dead code, and only a golden distinguishes the two — every other construct on this clause's list is reachable because something pins it."

