note = "plans/M5.md item E: the generated runtime's `__wrela_ring_write` (`layout.rs`) publishes one virtio-shaped split-ring descriptor per printed report line (decision 12); `wrela-vmm`'s own console model (`drain_console`, `lib.rs`) reads the ring only after the guest halts, walking descriptors `0..avail.idx` directly by index (a disclosed M5 simplification: this producer never reorders or skips an index, so `avail.ring[]` itself is never populated or read) and copying each one's own bytes into the transcript, in order. `golden/boot-hello`'s own `expected/test.txt` pins the resulting merged stdout (`wrela test`'s own decision-1 shape: comptime lines, then runtime lines, then one summary) byte-for-byte, proven stable across 5 repeated `cargo xtask golden` runs in this session. Two disclosed M5 bounds this clause's own note names honestly rather than claiming full virtio-console conformance: at most `console::QUEUE_SIZE` (16) `__wrela_ring_write` calls (in practice, printed report lines) per boot, and an over-long write silently truncates to whatever `console::DATA_SIZE` room remains rather than emitting a marker line — neither is exercised by any golden today, both are `layout.rs`'s own module-doc-disclosed simplifications, not silently assumed."

