note = "plans/M5.md item A, decision 6: the machine layout contract v1 now lives entirely in `crates/wrela-machine/src/lib.rs` as documented `pub const`s — `layout` (`DRAM_BASE`/`DRAM_SIZE` unchanged from the pre-M5 stub, `MACHINE_INFO_BASE`, `STACKS_BASE`/`CORE_STACK_SIZE`/`core_stack_base(core)`, `IMAGE_BASE`), `machine_info` (the info page's field offsets: `OFF_REVISION` — a fixed 32-byte NUL-padded slot for `MACHINE_REVISION_STR` — `OFF_WALL_SEED`, `OFF_NEXT_DEADLINE` (06 §5's park protocol, reserved, unused until M6), `OFF_EXIT_CODE`), `console` (a virtio-shaped split ring: `QUEUE_SIZE=16`, `DESC_TABLE_OFFSET`/`AVAIL_OFFSET`/`USED_OFFSET`/`DOORBELL_OFFSET` within one ring metadata page, plus a separate 4-page `DATA_BASE`/`DATA_SIZE` byte-buffer region), and `mmio` (`CLOCK_MMIO_ADDR`, `EXIT_MMIO_ADDR` — both below `DRAM_BASE` entirely, in a physical range the VMM never backs with RAM, so any access necessarily traps). `MACHINE_REVISION_STR = \"wrela-machine-v1\"` is new alongside the pre-existing numeric `MACHINE_REVISION: u32` (unchanged — still consumed by `bin/wrela.rs`'s `version` command and `wrela-vmm`'s own mismatch check, neither touched by this item). The old stub's `PV_PAGES_BASE` (a placeholder for 06 §4/§5 per-core vector/doorbell pages, never referenced by any other crate) is retired: M5 is sync-only (plans/M5.md's own non-goals list — no async/actor/checkpoint machinery until M6), so there is nothing for a vector page to hold yet; the console doorbell above already gives decision 6 its one required doorbell address, and a real per-core vector-page layout is left for whichever M6 item actually needs one, rather than reserved speculatively.\n\nCoherence is proved by six unit tests in `wrela-machine/src/lib.rs`'s own `#[cfg(test)]` module: `regions_do_not_overlap` (the item's own required oracle — walks every declared region, RAM and MMIO alike, sorted by base, and asserts each ends at or before the next one starts), `ram_regions_fit_inside_dram` (every RAM region sits inside `DRAM_BASE..DRAM_BASE+DRAM_SIZE`; both MMIO registers sit strictly below it), `image_base_leaves_room_before_dram_end`, `console_ring_metadata_fits_the_ring_page` (432 of 4096 bytes used), `machine_info_fields_fit_the_page_and_do_not_overlap`, and `machine_revision_str_fits_its_fixed_field`.\n\nFLIPPED from `gap` to `test` at plans/M5.md item D's own execution: this clause's own older note recorded the gap as \"nothing yet *uses* these constants behaviorally\" and named its own flip condition as item E's boot golden. Item D changes the premise that note stood on — `layout.rs` (new) now genuinely *emits real bytes* against every one of these constants, byte-verified by golden diffs, not merely declared: `IMAGE_BASE` is the placement base every emitted blob starts at (`golden/appliance`/`golden/image-project`/`golden/image-helper-accept`/`golden/image-emit`'s own pinned `Entry base=0x40500000` report lines); `core_stack_base(0)`/`CORE_STACK_SIZE` are materialized into the entry stub's own `sp`-install sequence, present in `golden/image-emit`'s pinned `img.hex`; `machine_info::OFF_EXIT_CODE`/`mmio::EXIT_MMIO_ADDR` are materialized into the shared halt sequence every entry/abort stub ends in, likewise byte-pinned there; `STACKS_BASE`/`console::DATA_BASE`/`console::DATA_SIZE`/`MACHINE_INFO_BASE` appear directly in every successful report's own new `Section name=pages`/`Section name=stacks` lines (`layout::render_layout_section`, reading the same constants this clause names). This is the *layout* half of the gap this clause's own note distinguished — real, and now provable — not the *boot* half (the VMM actually starting vCPU 0 there, reading the machine-info page live, draining the console ring): that half remains item E's, honestly still ungiven a golden, and `machine.boot.no-discovery` (below) is the clause that names it, unmoved by this flip. Citing `golden/appliance`/`golden/image-project`/`golden/image-helper-accept`/`golden/image-emit` above satisfies `xtask ledger`'s own validator (every one is a real `tests/golden/...` path, unlike the six `wrela-machine`-crate unit tests, which stay real, current, and wired into `cargo xtask check`, but still not citable here for the same reason the old note gave).\n\n**plans/M11.md item C (2026-07-26):** adds `layout::RTDATA_BASE` (`IMAGE_BASE + 64 KiB` = `0x4051_0000`) and `layout::RTDATA_SIZE_MAX` (256 KiB). Measured peak `code+rodata+abort+checkpoint` over the golden corpus was 28014 bytes (span from `IMAGE_BASE` through checkpoint end `0x6dc4` / 28100); the 64 KiB packing window is deliberate headroom. `layout_program` / `layout_test_image` steer the cursor to `RTDATA_BASE` rather than bump-allocating; `verify_section_sizes` accepts a >=8-byte gap only when the next section is `rtdata` at exactly that constant (steered packing window — not a vague exemption). Builds whose packed prefix would overrun the base, or whose `rtdata` alone exceeds `RTDATA_SIZE_MAX`, fail closed (mailbox-capacity blowup tripwire; peak golden `rtdata` today is 6664). Guest-visible pages/stacks/entry unchanged — `MACHINE_REVISION` / `MACHINE_REVISION_STR` not bumped (decision 722 / 752; REVIEW-QUEUE). Every actor-bearing report golden's `Section name=rtdata base=` line moves to `0x40510000`.\n\n**plans/M11.md item H (2026-07-26, decision 818):** ratchets `RTDATA_BASE` to `IMAGE_BASE + 128 KiB` (`0x4052_0000`) after generic runtime bodies overflowed the 64 KiB window (measured packed peak ~0xea34; runtime-test images crossed `0x40510000`). Still no `MACHINE_REVISION` bump. Report goldens' `rtdata base=` lines move to `0x40520000`.\n\n**plans/M11.md item K (2026-07-26, decision 858):** ratchets `RTDATA_BASE` to `IMAGE_BASE + 256 KiB` (`0x4054_0000`) after primary test-runner bodies overflowed the 128 KiB window (measured packed end ~0x23640 on `check-format-fstring-guest`). Still no `MACHINE_REVISION` bump — packing constant only (reaffirms 722/752/818). Report goldens' `rtdata base=` lines move to `0x40540000`. REVIEW-QUEUE packing line records the same ratchet."

