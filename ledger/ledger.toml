]
note = """03-hardware.md §3 names **four** layout kinds, not three: `dma`, `mmio`, `wire`, and `runtime`. §3.1 defines the fourth — "`@layout(runtime)` describes the machine's own tables ... Every rule above applies to it unchanged ... It adds one allowance the other three kinds do not have: a field of a `runtime` layout may be another `@layout(runtime)` type, or a fixed-length array of one ... A `runtime` layout is not device-visible ... and it carries no capability."

**Shipped (plans/M10.md item A2, decision 580): the class, laid out.** Item A (decision 561) landed the wording plus a blanket `error[unimplemented]` at the declaration; item A2 landed the field types §3.1 defines the class *in terms of*, and removed the blanket. `sema::types::lay_out_struct` (`crates/wrela-compiler/src/sema/types.rs`) now computes each field's size **and its alignment** — the two are the same number for a sized integer or a register wrapper, which is why this pass carried only a size before — and 03 §3.1's two shapes separate them:

- **Fixed-length array fields**, `runtime` only (`array_field_bytes`). Size is `N * size_of(T)`, elements back to back with no stride rounding and no trailing padding; the array's alignment is its *element's*, so `[TurnArea; 4]` is 32 bytes at 4-byte alignment and lands at 0x8 straight after a `u64` rather than being over-aligned to 32 (`golden/check-layout-runtime` pins exactly that offset). `T` is a sized integer or a nested `runtime` layout, and nothing else — one closed rejection covering `[usize; 4]`, `[bool; 4]`, `[[u32; 2]; 2]` and a capability element. An element whose width is not a multiple of its own alignment is refused too: every element after the first would need padding between elements, which a `@layout` never invents. An array field in a `dma`/`mmio`/`wire` layout is a named rejection rather than the false "no exact byte size" (`golden/err-layout-array-not-runtime`) — `[u32; 4]` has a perfectly exact size; those kinds simply may not have one.
- **Nested `@layout(runtime)` struct fields**, with recursive size/offset computation (`nested_field_bytes`): the nested type is laid out from scratch at each mention (no cache — this pass is a pure function of the ast), its size becomes the field's, and its alignment is the widest among its own fields. Nesting is exclusive in **both** directions: `golden/err-layout-runtime-nests-dma` pins a `runtime` layout reaching for a `dma` one, and `declaration_shape_guards` pins the reverse, each distinct from the M7 item E gap (`golden/err-layout-nested`: a `dma` layout nesting a `dma` layout is still a missing feature, not a rule, and that message is unchanged).
- **Cycles and depth fail closed, not by stack overflow.** A nesting chain is refused the moment it revisits a name, naming the whole chain (`golden/err-layout-runtime-cycle`, a two-step transitive loop rather than the trivial self-reference a single equality test would also catch), and a chain deeper than `MAX_LAYOUT_NEST_DEPTH` = 16 is refused by name (`a_deep_nesting_chain_fails_closed` generates a 200-deep chain: cycle detection already makes the recursion finite, but finite is not small). A third bound is the one the depth cap misses: because a nested type is sized from scratch at every mention, sixteen layouts each naming the next *four* times expand `4^15` layouts from twenty lines, so `MAX_LAYOUT_NEST_EXPANSIONS` = 1024 caps total expansions per top-level declaration (`a_wide_nesting_graph_fails_closed`). Counted rather than memoized on purpose: a cache is the clever fix and needs a profile to buy, a budget is the dumb one and fails closed. All three matter because `check_layouts` is on the `sema` fuzz lane's path on every iteration.
- **`usize` is still rejected in every kind, including this one** (decision 563: `rr_cursor` is `u64`). No `runtime` exemption was added and none is needed — one target-dependent layout class would break the property `@layout` exists for. `golden/err-layout-target-dependent` still pins the scalar case; the array-element case is in `declaration_shape_guards`.
- **§3.1's two closing clauses are now *reachable*, and pinned.** "Not device-visible" was enforced only by the blanket refusal of the whole kind; `Mmio[L]`/`DmaShared[P, L]`/`img.dma_pool[T]` have always demanded `@layout(mmio)`/`@layout(dma)`, so a `runtime` type named there is refused by rules that already existed (`golden/err-layout-runtime-device-visible`). "Carries no capability" likewise had an unreachable arm; `golden/err-layout-runtime-capability` reaches it *through the recursion* (the offending field is in the nested table, and the nesting table is declared first).

**Shipped (plans/M10.md item A2b, decision 581): a `const` array length, via
a second pass.** 03 §3.1's own example spells `turns: [TurnArea; N_TURNS]`, and
item A2 **refused** it (decision 580: `check_layouts` runs before name
resolution and evaluates nothing, so a `const`-named length was inference by
another name — the same rule `@offset(n)` states). That bound blocked the
milestone's central mechanism: M10's tables are sized per image (`n_turns`,
`reply_ring_capacity`), so a literal length cannot spell one, and by
ground-truth rule 1 a docs-versus-code disagreement means the code is wrong.
Item A2b lifts it **without touching the early pass's purity**, which is what
decision 581 chose over the two alternatives decision 580 had already rejected:

- `sema::types::check_layouts` still runs before name resolution and still
  evaluates nothing. Meeting a `const`-named length it **defers**: the layout
  comes back with `size: None`, no entries and no padding, having checked every
  rule that does not need a byte count — kind, `endian=`, the element type
  (`[usize; N]` is refused there, exactly as `[usize; 4]` is), `@offset` shape
  and count, the field-attribute rule, the nesting/kind rules, cycles, and the
  depth and expansion bounds. `golden/err-layout-wire-capability` therefore
  keeps its better diagnostic, which is one of the two stated reasons the pass
  runs early; verified, its expectation is byte-identical.
- `sema::types::complete_layouts` runs after `eval::check_comptime` — the
  earliest point at which a `const` has a value, and before anything reads
  `TypedProgram::layouts` — and re-lays every deferred struct out through the
  *same* `lay_out_struct`, with the resolved lengths supplied. So every
  size-dependent rule (overlap, ordering, alignment, implicit padding, total
  bytes) applies to the completed table: postponed, never weakened. Both sema
  entries call it (single module and whole closure), as do `wrela dump
  --stage=layout-types`, `bin/wrela.rs`'s report and `xtask`'s determinism
  oracle, so the dump and the report show the completed sizes.
- **Resolution reads the one real const table**, `TypedProgram::consts`,
  through `eval::interp::eval_const` — the evaluator a plain module-level
  `const` already runs through. There is still no second name resolver
  anywhere in this pass, which is what makes decision 580's rejected
  alternative (ii) stay rejected. Consequences, each tested: a length that
  depends on another `const` (`const N = BASE * 3`) works, because the
  evaluator evaluates it; a length naming a `const` that `specialize` removed
  with its unselected `comptime if` branch is `error[name]: unknown name`, from
  the real resolver, before this pass runs, while the *selected* branch's
  `const` works normally.
- **`@offset(n)` did not move**, deliberately: decision 580's reasoning holds
  for it unchanged, and only lengths are what the tables need. Do not "finish
  the job".
- **Four fail-closed rejections**, each a named `error[type]`: a length that is
  a name resolving to something that is not a module-level `const`
  (`golden/err-layout-runtime-len-not-const`); a `const` whose value is zero
  (`golden/err-layout-runtime-len-zero` — zero is **illegal**, the same answer
  a literal `0` already got, since a zero-byte field is the fail-open 03 §3
  exists to prevent) or negative (same rule, unit-tested) or not an integer
  (unit-tested); and a length that is neither a literal nor a bare name —
  arithmetic in the length position, a field access, a call — which is refused
  in *both* passes rather than deferred into an expression the pass would have
  to type-check (`declaration_shape_guards`' `[u32; -1]` case, which parses as
  a unary expression).
- **A new bound, in the same commit: `MAX_LAYOUT_BYTES` = 16 MiB** on one
  `@layout` type's total size (`golden/err-layout-runtime-len-too-big`, a
  `2^40`-element table). Needed *because* lengths can now arrive from a
  `const`: `2^43` bytes fits a `u64` fine, so nothing else would have caught
  it, and every number downstream of a `@layout` size is a real allocation on
  a 1 GiB machine. A fail-closed floor, like the two nesting bounds; raise it
  in the item that has an image needing more.
- **An uncompleted layout cannot report a size.** `LayoutType::size` is
  `Option<u64>`, so the deferred state is unrepresentable-as-a-number rather
  than a plausible `0`, and `LayoutType::require_size` is the named rejection
  every consumer of a byte count goes through — the `layout-types` dump, the
  report's exact-bytes section, and `img.dma_pool`'s backing computation
  (`push_layout_lines_refuses_an_uncompleted_layout`,
  `the_report_refuses_an_uncompleted_layout`). Requirement 4 of the item, and
  the reason the type changed rather than a flag being added beside it.

**03 §3.1's prose gained one sentence** (its `@layout(runtime)` paragraph): an
array's length "is an integer literal or the name of a module-level `const`
whose comptime value is one or more", and `@offset(n)` stays a literal. Item
A2 could not make that edit — the corpus-sema tables keyed doc blocks by line
number then, so inserting a sentence detached later blocks' preambles; item A3
re-keyed them by content, and `cargo xtask corpus` is clean across this edit.
`plans/REVIEW-QUEUE.md` carries the line.

**The *other* half of §3.1** — `@placed` and module-level `static` — landed later (plans/M10.md item A2c, decisions 586–589): `hardware.layout.placed-static` / `hardware.layout.placed-verified` are both `test` below. (This note's earlier "both still `gap`" tail was trimmed in M10 item M, sweep find L-17 — it predated A2c.)"""

