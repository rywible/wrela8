[[clause]]
id = "syntax.parser.declarations"
doc = "02-language.md#7"
status = "test"
tests = ["golden/ast-declarations"]
note = "const (typed/untyped), fn/async fn (generics, receiver/params with access modes, one-line/suite/bodyless forms), struct/resource struct (fields with pub/defaults, methods, init, actor-scoped pool, deriving), enum (tuple and named-field payloads, deriving), module- and member-scope pool, comptime if/else at module and member scope, structured @attr(args) — and the full type grammar of §6 (generic args, arrays, tuples, own[P], fn types, bound forms)"

[[clause]]
id = "syntax.parser.statements"
doc = "02-language.md#8.1"
status = "test"
tests = ["golden/ast-statements"]
note = "assignment (introduction, compound ops), if/elif/else, match/case with guards, for (incl. take-consuming), while, break/continue/return/pass, assert with optional message, defer (expr and suite forms), with-as, send (statement and expression positions), comptime if/else and comptime assert in statement position"

[[clause]]
id = "syntax.parser.expressions"
doc = "02-language.md#8.2"
status = "test"
tests = ["golden/ast-expressions", "golden/ast-fstring"]
note = "the full precedence ladder as a chain of parse functions (member/call/index; unary - ~ await take; postfix ?; * / % *%; + - +% -%; << >>; & ^ |; ranges; comparisons and is; not; and; or), call arguments with labels and mirrored mut/take (place-expression checked), leading-dot enum refs, closures (expression and suite bodies), list/tuple literals, and f-string segmentation into Literal/Interp parts (interp contents kept raw per plans/M1.md item D)"

[[clause]]
id = "syntax.parser.patterns"
doc = "02-language.md#7.2"
status = "test"
tests = ["golden/ast-patterns"]
note = "_, literals (incl. negative numbers), bindings, .Variant(...)/Enum.Variant(...) with positional payload binding, take in payload position, tuple and fixed-array destructuring, | alternatives, if guards on match arms, and is as an expression-position pattern test"

[[clause]]
id = "syntax.parser.no-panics"
doc = "02-language.md#8"
status = "test"
tests = ["xtask:fuzz"]
note = "cargo xtask fuzz parser: seeded deterministic corpus-mutation + token-soup fuzzing through the lex-then-parse pipeline; never panics, result is a successful parse or exactly one error, deterministic across repeat runs; 100_000-iteration deep run clean across 15+ seeds (2.1M+ total iterations, no finds), smoke budget wired into xtask check"

[[clause]]
id = "syntax.parser.roundtrip"
doc = "02-language.md#8"
status = "test"
tests = ["xtask:roundtrip"]
note = "cargo xtask roundtrip: parse -> pretty-print (wrela dump --stage=pretty) -> reparse -> compare span-stripped AST dumps, for every corpus entry that parses and every ast-* golden input; the pretty-printer over-parenthesizes non-atomic expression children rather than computing precedence, per plans/M1.md item E"

[[clause]]
id = "docs.examples.wrela-blocks-parse"
doc = "02-language.md#1"
status = "test"
tests = ["xtask:corpus", "golden/ast-virtio"]
note = "every docs/language ```wrela block and every docs/language/examples/*.wr file parses (xtask corpus reports lexed/parsed/fragments-skipped counts) except a block whose body contains the literal substring `...` (a doc fragment, lex-only); the virtio-storage.wr worked example parses in full and its exact ast dump is pinned by golden/ast-virtio (an intentional duplicate of the example file — the corpus covers the original)"

[[clause]]
id = "syntax.diagnostics.parse-errors"
doc = "02-language.md#8"
status = "test"
tests = ["golden/err-bad-dedent", "golden/err-five-space-indent", "golden/err-unterminated-string", "golden/err-unterminated-paren", "golden/err-missing-colon", "golden/err-take-rvalue", "golden/err-lone-else", "golden/err-stray-ellipsis", "golden/err-unmatched-close", "golden/err-keyword-as-name"]
note = "ten representative syntax errors (bad dedent, five-space indent, unterminated string/paren, missing colon, take rvalue, lone else, stray ellipsis, unmatched close, keyword as a declared name); a Keyword token is rejected wherever a fresh name is declared or a type is named (fn/method/struct/enum/pool/const/variant/field names, parameters, local assignment targets, closure params, generic params, import aliases), message `keyword <kw> cannot be used as a name`, with three narrow exceptions: after `.` (member access/call, Enum.Variant paths), argument labels (`name=`), and `pool` as a callable in primary-expression position (the `with pool(...)` intrinsic); dotted import paths keep accepting keyword segments"

