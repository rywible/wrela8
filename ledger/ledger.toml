note = "03-hardware.md §8: \"wrela has one **marked value** mechanism — a sealed wrapper that gates use of a payload until an explicit, typed transition — with three instances: `Untrusted[T]` (must be checked before use as a bound), `Validated[F, T]` (proof a declared parser ran), and `Secret[T]` (must never leak into the image, logs, or control flow; 02 §12). One mechanism, three policies; no other gating wrappers exist.\" 05-library.md §6 repeats the same three as \"taint in / proof out / never out\".\n\nplans/M7.md item H2a built the mechanism; plans/M9.md item G (split G1/G2/G3, decisions 350–356) owns it in the stdlib milestone. `Validated[F, T]` and `Secret[T]` remain refuse-by-name at `sema::types::resolve_named` so the refusal is the *same* mechanism rejecting an unimplemented policy, not an unknown-type miss (`golden/err-validated-out-of-scope`, `golden/err-secret-out-of-scope`) — deferred in writing by G2/G3 (decisions 353–355), not silently half-built.\n\n**`Untrusted[T]` is sealed (G1).** No source-visible constructor (`golden/err-untrusted-construct`): a device control value arrives marked, and the only transition out is a checked narrowing. Ordinary use as an array index (including `String[..N]` / `Bytes`), a range bound, an arithmetic operand, a comparison, a length argument, an allocation size (`capacity=`/`size=`), or a plain expected type (return / arg / `Ok` wrap / struct field) is a rejection naming `.checked_le(bound)` — never a silent coercion (`golden/err-untrusted-index`, `err-untrusted-string-index`, `err-untrusted-bound`, `err-untrusted-arith`, `err-untrusted-compare`, `err-untrusted-length`, `err-untrusted-alloc`, `err-untrusted-return`, `err-untrusted-ok-wrap`). The narrowing's own `bound` must itself be unmarked (`err-untrusted-checked-le-bound`). The one narrowing 03 §8 spells — `checked_le(bound)` → `Result[T, unit]` — type-checks, lowers to `Compare`/`JumpIfFalse`/`MakeEnum`, and evaluates as a pure compare at comptime (`golden/check-untrusted-narrowing`, `check-untrusted-try`, `check-untrusted-narrow-index`, unit `untrusted_checked_le_ok_and_err`); any other `checked_*`, a non-method name, a non-integer payload, or a wrong arity fails closed by name.\n\n**Sizing.** `Untrusted[T]` is a transparent newtype at the ABI (`mwir::size_of` equals `size_of(T)`); the wrapper adds no field beyond what the check requires.\n\n**Producer.** `IoCompletion[P].written_len` is the live producer (`hardware.untrusted.checked-narrowing` / `golden/boot-blk-roundtrip`). Source-visible `Untrusted.mark` stays rejected.\n\n**G2/G3 residue.** `Validated` needs `FormatValidator[F, T].validate` + `into_value`; `Secret[T]` needs secret-preserving transforms + 02 §12 non-serialization. Name-only Format refusal on a type spelled `Secret` (`err-format-secret`) is the recorded hazard until G3 lands.\n\n**Updated by plans/M13.md item P.** `Validated` demoted: not a prelude marked-value policy. 03 §8 is one mechanism, two policies (`Untrusted` / `Secret`); proof-out is the `resource(manual)` idiom (`golden/check-validated-idiom`). Ledger `values.marked.validated` deleted."

[[clause]]
id = "values.marked.secret"
doc = "05-library.md#6"
status = "gap"
note = "05 §6 / 03 §8: `Secret[T]` \"admits only secret-preserving transforms\" and \"must never leak into the image, logs, or control flow\" (02 §12). No sealed `Secret[T]` exists — only a *name-based* Format refusal on a type spelled `Secret` (`golden/err-format-secret`, `golden/err-secret-out-of-scope`). The hazard that follows is recorded rather than papered over: a user `struct Secret` inherits the Format refusal it never asked for, while a real secret gets no protection at all, because there is nothing to protect it with. Wants: the sealed wrapper, the secret-preserving transform set, and 02 §12 non-serialization enforcement. Deferred deliberately by plans/M9.md item G3 (decisions 353–355). Related soft spot found by G1's adversarial sweep and carried here so it is not lost: `match reported: case _:` accepts a marked value today, which is harmless for `Untrusted`'s bound policy but is exactly the control-flow leak `Secret` must refuse — whoever implements this clause starts there."

