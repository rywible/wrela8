id = "compiler.repro.byte-identical"
doc = "04-compiler.md#8"
status = "test"
tests = ["xtask:repro", "xtask:report-determinism", "golden/appliance", "golden/image-basic", "golden/image-helper-accept", "golden/image-project", "golden/image-emit"]
note = "plans/M5.md item D, decision 10: FLIPPED from `gap` to `test` — image emission now exists (`crates/wrela-compiler/src/layout.rs`, new), so 04-compiler.md §8's own \"identical declared inputs ... produce a byte-for-byte identical image and report\" is provable, not just assertable. `xtask`'s `produce_report_and_image` (grown from the M4-era `produce_report_text`, itself renamed) mirrors `bin/wrela.rs`'s own `build_report` tail end to end — `layout::merge_layout_ctx` (one `mwir::LayoutCtx` per module in the build closure, merged, since `bodies::check` only ever populates a module's own `TypedProgram::fns`/`structs` from *that module's own* AST items — an imported struct's own field types live only in its *declaring* module's raw `ast::Module`, never copied into an importer's, so a project case needs every module's own ctx merged, not just the `@image`-owning one's) then `layout::try_layout_program` (per-module `lower::lower_program`, merged via a rodata-reindexing `merge_mwir_programs`, then `codegen::codegen_program`, then `layout::layout_program`) — and `report_determinism` (renamed in spirit, not in `xtask`'s own subcommand name: `cargo xtask report-determinism`/`cargo xtask repro` now both call the identical fn) runs the whole thing *twice*, fresh, in-process, per report-bearing golden case, comparing both the rendered report text and the emitted image bytes byte-for-byte. `cargo xtask repro` (previously `fail_closed`) is now simply `report_determinism()` called standalone — plans/M5.md decision 10's own \"no separate full-corpus form yet\" call, recorded here: every report-bearing golden is already the whole population either name covers at this milestone's scale, so inventing a second, larger population to walk would be gamed coverage, not real breadth. Verified this session: `cargo xtask repro` and `cargo xtask report-determinism` both print `5 case(s) reproduced byte-for-byte (report + image where present) across two runs` (`golden/appliance`, `golden/image-basic` — its own decision-10 refusal text, proving the oracle is equally meaningful on a rejected report — `golden/image-helper-accept`, `golden/image-project`, `golden/image-emit`), wired into `cargo xtask check` immediately after `golden`, unchanged from M4's own wiring point. Coverage note (the clause's own \"record what's covered now\" instruction, carried forward from decision 10's own text): this flip covers the *unsigned* image + report only — the signed triple (a real signature over the emitted bytes) is M8+ territory, not attempted here, and no wording in this note claims otherwise."

