note = "FLIPPED from `gap` to `test` at plans/M5.md item C's own merge, exactly per the flip condition this clause's own older note named (\"once codegen, item C, emits `--stage=asm` dumps that themselves go through golden coverage and exercise every one of these encodings end to end from real lowered code, at which point this clause could cite that golden instead of standing alone\"). `codegen.rs` (new, `compiler.codegen.naive-locked` below) calls `encode.rs`'s pure `enc_*` functions directly, and `wrela dump --stage=asm`'s stable hex+mnemonic dump makes every encoded byte review-visible; the seven `golden/asm-*` cases above (byte-identical mwir-* inputs, item B's own family, reused verbatim so the two stages' goldens stay co-reviewable) exercise, end to end from real lowered fn bodies: `enc_ldr_x_imm`/`enc_str_x_imm` (every scalar/aggregate load-store, the spill-everything frame itself), `enc_movz`/`enc_movk` (`load_imm`'s uniform four-word constant materialization), `enc_add_imm`/`enc_sub_imm` (prologue/epilogue `sp` adjustment, frame-slot addressing), `enc_add_reg`/`enc_sub_reg`/`enc_mul` (checked/wrapping arithmetic), `enc_smulh`/`enc_umulh` (64-bit checked multiply overflow — new this item, see `compiler.codegen.naive-locked`'s own note), `enc_sdiv`/`enc_udiv`/`enc_msub` (checked division/remainder), `enc_and_reg`/`enc_orr_reg`/`enc_eor_reg` (bitwise ops, `BitNot`'s XOR-with‑`-1` idiom, `BoolAnd`), `enc_lsl_imm`/`enc_lsr_imm`/`enc_asr_imm` (`narrow_to_width`'s canonicalization, exercised by every narrow-width checked/wrapping op and `Point`'s own `u64` fields staying canonical), `enc_lsl_reg`/`enc_lsr_reg`/`enc_asr_reg` (the array-loop's own index/accumulator wrapping-add path touches the register shift forms transitively through `narrow_to_width`; the dedicated `shift_*` codegen unit tests exercise the mnemonic directly, `asm-loop`/`asm-take` exercise the surrounding frame/index machinery the same shifts run inside), `enc_cmp_reg`/`enc_cset` (`Compare`, every