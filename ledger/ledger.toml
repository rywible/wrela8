id = "hardware.queues.split-ring"
doc = "03-hardware.md#4"
status = "test"
tests = ["xtask:repro", "xtask:diff-blk"]
note = "plans/M7.md item F, decision 2 (\"what remains is the split ring, feature negotiation, and the per-device request formats\"): `crates/wrela-vmm/src/devices.rs` is the virtio-blk device model — descriptor table, available ring, used ring, and the `struct virtio_blk_req` format (16-byte type/reserved/sector header, data descriptors, a device-writable status byte), including `Flush` (06-machine.md §6's own device row) and multi-descriptor scatter chains. Backed by an in-memory disk the VMM owns (there is no host file behind it, which is also why 06 §8's \"replay ... suppresses real outputs\" needs no separate mechanism here: a block write has no external output to suppress).\n\nDeliberately **not** implemented, because 06 deletes it from this machine and no driver here can use it: MMIO transport discovery (06 §3 — the report's own `BlkDevice`/`BlkQueue`/`BlkPool` lines *are* the transport configuration, preconfigured before the vCPU runs, so there is no `MagicValue`/`QueueSel`/`QueueReady` register file at all), an interrupt controller (06 §4 — a completion sets one bit in the core's pending word, or none at all in 03 §7's poll build), `VIRTIO_F_INDIRECT_DESC`, `VIRTIO_RING_F_EVENT_IDX`, and per-queue reset (03 §9's epochs are **item H2b** — full `RunningDevice.reset` only; `RingReset` stays unoffered).\n\nEvidence: `cargo xtask repro`'s own `repro_blk_completion_replay` boots a hand-assembled driver that publishes a `T_OUT` chain and then a `T_IN` chain over the identical ring and checks every byte of the round trip on real Hypervisor.framework (the guest folds one bit per failed check into its exit code, so a regression names which check broke). `wrela-vmm`'s own `#[cfg(test)]` suites carry the fuller coverage that `xtask ledger`'s validator cannot cite (no `tests/` path, no `xtask:<command>` — `machine.layout.v1-constants`' own established precedent): `devices::tests` (17 tests: negotiation, configuration rejection, write/read round trip, scatter chains, two chains under one doorbell, an unrung doorbell, `Flush` both ways, unknown request types, out-of-range sectors, digests) and `tests::blk_doorbell_write_then_read_completes_over_hvf`.\n\n**The QEMU differential oracle (plans/M7.md decision 2a), built and passing**: `cargo xtask diff-blk`. Decision 2a's argument is that QEMU's virtio-blk is a *second implementation* to disagree with, and that this gets permanently harder once QEMU retires (06 §1) — so it exists now. One ring, two devices: `xtask`'s own `fill_blk_ring` writes the identical descriptor chains, request headers, poisoned status bytes and payload into **both** guests' data regions (one function, so \"the same ring\" is a fact and not a claim); each guest then publishes them through its own transport — this machine's shared-memory doorbell on one side, QEMU's trapping `QueueNotify` MMIO write on the other — and nine facts are compared field by field: `used.idx`, both `(id, len)` used entries, both status bytes, and an FNV-1a digest over the transferred payload plus its status byte, computed identically on both sides (`record::digest_hex` in Rust; the same loop hand-assembled in the QEMU guest). Result at this commit: **9 of 9 agree** against QEMU 11.0.2 (`used.idx=2`, write `(id=0, len=1, status=0)`, read `(id=3, len=513, status=0)`, both digests `d344cd9ab28c63df`).\n\nThe QEMU side is a bare-metal virtio-mmio v2 driver, hand-assembled with `wrela_compiler::encode` and loaded by QEMU's generic loader: transport scan across all 32 `virt` slots for `DeviceID=2`, the full `Reset -> ACKNOWLEDGE -> DRIVER -> features -> FEATURES_OK -> queue -> DRIVER_OK` bring-up, publish/notify/poll twice, then FNV and hex-print over the PL011 UART. Every way it can fail prints its own marker (`NODEV`, `FEAT`, `TMO1`, `TMO2`) instead of hanging, and the lane refuses to compare anything until a trivial smoke guest has proved QEMU runs this harness's own code at all — an oracle that silently degraded into \"QEMU printed nothing, so nothing disagreed\" would be worse than none. Two findings recorded while building it: QEMU's virtio-mmio still defaults to the **legacy** transport (`-global virtio-mmio.force-legacy=false` is required, and without it the guest honestly reports `NODEV` rather than negotiating a ring 03 §1 does not name), and the oracle's own sensitivity was verified by mutation rather than assumed — deleting the status byte from `Completion::digest` made it report `write/read: payload digest: wrela says 6404ff35e8dec725, QEMU says d344cd9ab28c63df`, and shortening the used-ring `len` was caught even earlier, by the wrela guest's own checks.\n\n**Deliberately not wired into `cargo xtask check`** (and therefore run explicitly): 06 §1 has QEMU \"used until the wrela VMM boots images, then retired\", so making the gate depend on a tool scheduled to go away would turn its removal into a gate failure. It fails closed rather than skipping when QEMU is absent. **Scope, stated rather than implied**: it compares *ring handling and the request format*, which is what decision 2a asks for — not the transport (this machine has none) and not the doorbell (QEMU's notification is a trap, the very thing 06 §5 deletes). It covers **one workload** (a 512-byte write followed by a read-back). One behavioural difference is already known by reading rather than by running, and a second workload should pin it: a data length that is not a whole number of sectors is `BlkFault::UnalignedDataLength` here — image-fatal, per decision 8's one-driver-fault story — where QEMU's own `virtio_blk_sect_range_ok` completes it with `VIRTIO_BLK_S_IOERR`. That difference is deliberate (a sealed queue API cannot express a partial-sector transfer, so one means the driver is broken) and is recorded here so it is never mistaken for an oversight.\n\n**plans/M7.md item E1 — the report half.** An image with a `VirtQueue.configure` emits `BlkDevice`/`BlkQueue`/`BlkPool`/`BlkAccounting` (`golden/boot-device-bringup`); `verify_ring_windows` re-derives every reported ring region from `virtqueue::place_ring` against the declared pool. Ring *publication* and completion validation remain E2–E4."

