[[clause]]
id = "sema.names.resolution"
doc = "02-language.md#3.2"
status = "test"
tests = ["golden/check-module", "golden/err-name-unknown", "golden/err-name-duplicate", "golden/err-name-shadow", "golden/check-if-else-scoping", "golden/err-scope-use-after-if", "golden/err-scope-shadow-branch"]
note = "collect + resolve (plans/M2.md item A): every module-scope const/fn/struct/enum/pool name is unique (duplicate is an error at the second declaration); every identifier in every body binds to the prelude, a module declaration, or a local introduced by assignment/parameter/pattern binding/for binding/closure param, or is `error[name]: unknown name \\`x\\` at L:C`; shadowing an outer local is `error[name]: \\`x\\` shadows an outer local at L:C`; type names in annotations resolve the same way. Member/method names after `.` and leading-dot enum variant refs do not resolve yet (need type information, item B).\n\nFind+fix (2026-07-24, `cargo xtask fuzz lower` pinned golden/err-mwir-if-else-scope-leak): this clause's own note previously read \"only a closure introduces a new scope\" — true of `symbols::Resolver` as originally built, and mirrored verbatim by `sema::bodies::FnCtx` (typing), `sema::flow`'s own re-walk (definite init), and `sema::matches`' own re-walk (exhaustiveness), all four sharing one flat, function-level scope model. The bug: a *typed* declaration (`name: T = value`) inside one `if`/`elif`/`else` branch, `while`/`for` body, or `match` arm was wrongly visible to a sibling branch (reused as a reassignment instead of erroring or shadowing) and to code after the whole construct (`golden/err-mwir-if-else-scope-leak`'s own `if`/`else`, each branch declaring its own `value: u64`, then `return value` — accepted by `check_typed`, but `lower.rs`'s own correct per-block `LEnv` scoping then failed its \"unreachable for any check_typed-accepted program\" internal guard, since `value` is not actually bound once both branches' real scopes have popped). Fixed: `Resolver`/`FnCtx` (and their own mirrors) now push a real scope per branch/body/arm (`bodies::scoped`, `Resolver::scoped`), popped again once that suite finishes — `golden/err-scope-use-after-if` pins the resulting `error[name]: unknown name` once a branch-local is read past its own branch (then/elif/else, all three), `golden/check-if-else-scoping` pins the accepted sibling (same name, typed, declared independently in each of two branches, read only within each). A *plain*, untyped assignment (`name = value`) is unaffected — it still reaches outward across whatever scopes are open (`lookup_local`/`reassign_or_introduce`, not `lookup_innermost`/`introduce`) to reuse a binding from an enclosing scope, which is how the pre-existing arm-merge idiom (02-language.md §8.1, sema.init.definite) keeps working; `golden/check-flow`'s own `conditional_init` — previously (wrongly) accepted via two *typed* per-branch declarations — is now written the idiom's actual documented way (pre-declared, then reassigned untyped in each arm) since the old shape is exactly the bug. Shadowing decision: an outer local plus an inner *typed* re-declaration of the same name is still `error[name]: ... shadows an outer local` (`golden/err-scope-shadow-branch`) — 02-language.md §3.2 states this rule without a branch-scoping exception, and the dumbest reading is one shadowing rule, not two. The evaluator (`eval::interp`) had the identical flat-`env` model (`env_insert` always into `env.last_mut()`, no push/pop around `if`/`while`/`for`/`match`); since `check_typed` (once this fix landed) never accepts a program that reads a branch-local past its own branch, this was never an *observed* wrong runtime result on any accepted program — fixed anyway (`scoped_env`, mirroring `bodies::scoped`/`Resolver::scoped` exactly), so the evaluator's own env model no longer silently depends on that observation staying true."

[[clause]]
id = "sema.types.declarations"
doc = "02-language.md#6"
status = "test"
tests = ["golden/check-decls", "golden/err-type-unknown", "golden/err-type-deriving", "golden/err-deriving-from-two-fields"]
note = "the `Type` enum (plans/M2.md decision 4: one plain enum, structural `derive(PartialEq, Eq, Clone, Debug)`, no interning — `syntax::ast` now derives `PartialEq, Eq` throughout so `Expr` can sit unevaluated inside `Type` for array lengths/`Bytes[N]`/generic const args, item H evaluates the literal subset) and the declare pass (types.rs): every fn/async fn/init/method signature, struct field, enum variant payload, and const's declared type resolves against the M2 prelude (scalars, `[T; N]`, tuples, `Option`/`Result`, `own[P] T` with `P` resolved to a declared pool, `Static[T]`, `Str`, `Bytes[N]`/bound-elided bare `Bytes` in parameter position only, and — plans/M9.md item C1 — `String[..N]`) or a user struct/enum name, with generic-argument-list arity checked against the declared generic parameter count; an unresolvable name is `error[type]: unknown type \\`X\\` at L:C`. Data-vs-resource classification is transitive and memoized: `resource struct`/`@actor`/`@driver` is a resource by fiat, `own[P] T` is always a resource, `Static[T]` is always data, and any struct/enum/array/tuple/`Option`/`Result` containing a resource is a resource; direct or mutual by-value recursion (no indirection exists in M2 besides `own`/`Static`, which are handles and do not recurse) is `error[type]: \\`X\\` is infinitely sized (recursive by value) at L:C`, reported at the back-edge field. `deriving(...)` validates against the closed list (`Format`; `From` requiring exactly one variant with exactly one field/payload, or a one-field struct) — any other name is `error[type]: unknown deriving \\`X\\` at L:C`. A dotted `own[Owner.Name]` pool path fails closed (`error[unimplemented]`, actor scoping is M6+); everything else unresolvable at this stage (bodies, generic instantiation correctness) is out of scope for this item. See `language.types.string-bound` for the `String[..N]` layout and value pins."

