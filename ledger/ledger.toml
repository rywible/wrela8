[[clause]]
id = "sema.types.enum-methods"
doc = "02-language.md#5, 02-language.md#7.5, 05-library.md#6"
status = "test"
tests = [
  "golden/check-enum-methods",
  "golden/check-enum-method-properties",
  "golden/check-import-enum-method",
  "golden/check-import-alias-enum-method",
  "golden/err-enum-init",
  "golden/err-enum-field-member",
  "golden/err-enum-pool-member",
]
note = """02-language.md §5's receiver/access-mode rules and §7.5's "`deriving(...)` on a struct or enum generates methods" require an enum to have a declared-method surface. 05-library.md §6's "Types implementing the static Format contract declare ..." is the same surface. plans/M9.md item B2 (decisions 121–135) adds it.

**`check-enum-method-properties` pins what is new about a sum receiver (orchestrator review, decision 136).** `check-enum-methods` covers the four receiver shapes; this case covers the thing a product receiver never had — `mut self` on an enum may change **which variant is live**. Seven properties, each with a value no other outcome reaches, because the three variants score in disjoint ranges (`Idle` → 1, `Running(n)` → 200+n, `Done(n)` → 30000+n) so a wrong variant can never coincide with a right one: a variant change is observable by the caller (205, where a dropped write-back is 1); two `mut self` calls compose (`Idle` → `Running(5)` → `Done(50)` → 30050); a `mut self` method that keeps the variant does not clobber the payload (30004); `take self` on a sum (79); an associated fn constructs (206); a method calls a sibling method (402); and item CC's non-receiver `mut` write-back holds when the parameter is a sum (208). All seven are `diff-eval` agreements, so each is a two-tier lock rather than an evaluator test — which matters here specifically, because B2's own five-consumer audit found a reachable `internal error: unknown struct` in `write_back_mut_self`, i.e. the `mut self` path for enums was the one that had never run.

**Parser.** An enum body distinguishes a variant (Ident) from a method (`fn`/`pub`/`async` Keyword) by the next token — unambiguous; before B2 the variant-list parser fed every line to `expect_ident`, so `pub fn` / `fn` surfaced as `keyword <kw> cannot be used as a name`. `init`, `pool`, and field-shaped `name: Type` refuse by name (`err-enum-init`/`err-enum-pool-member`/`err-enum-field-member`).

**Receivers.** All three modes (`read`/`mut`/`take self`) and associated fns, unchanged from structs (02 §5.1). `mut self` may reassign the whole sum (`self = OtherVariant`); pinned by value in `check-enum-methods` (`M=11`) and the alias golden (`M=2`).

**Five consumers.** Sema resolution; both `imported` splices (ModuleCtx + TypedProgram, with local-spelling re-key); `lower`/`flowwir_lower` resolve_fn + enum-member emission; layout/codegen inherit via MWIR keys. Import and alias goldens prove the multi-module path.

**Pinned by value.** `check-enum-methods` settle `217`; `check-import-enum-method` settle `12`; `check-import-alias-enum-method` settle `1222`. Guest `@test(runtime)` paths (plans/M9.md item KK) restore mwir/asm pins for `Cell.empty`/`Cell.value`/`Cell.fill`/`Cell.into_n` and the import/alias twins (`Color.*` / `Hue.*`) after H3 dropped comptime-only callees."""

[[clause]]
id = "compiler.diagnostics.no-reachable-internal-error"
doc = "04-compiler.md#7"
status = "test"
tests = [
  "unit:internal_error_site_count_matches_the_written_down_census",
  "golden/check-import-reachable-alias-generic",
]
note = """04-compiler.md §7 requires diagnostics to carry a stable category. CLAUDE.md's house rule — every fuzz lane checks each iteration for messages that begin with the producer-bug prefix, and each such message is a **bug, not an outcome** — is the complementary half of that sentence: a conforming diagnostic is never that prefix. The house rule has no home in `docs/language/`; this clause anchors it on §7's diagnostic surface and enforces it with a ratchet (plans/M9.md item II, decisions 165–178).

**Why a ratchet, not an audit.** Measured 2026-07-25: 162 sites of the producer-bug prefix under `crates/wrela-compiler/src/` (`layout.rs` 71, `eval/interp.rs` 70, and smaller counts elsewhere). Most are genuine invariant assertions on paths ordinary source cannot reach — which is what they are for. Converting them wholesale into user-facing diagnostics would hide real bugs. Four sites this milestone alone *were* reachable, every one multi-module (A1b's comptime construction of an imported struct; EE's lower of an imported struct's fields; HH's `resolve_struct_by_type` miss for a reachable-but-unimported type; HH#1's aliased-peer + reachable-generic instantiation-key mismatch). No prior fuzz lane constructs a multi-module closure, so every lane's per-iteration check had never once seen an import.

**The ratchet, three pieces.**

1. **`cargo xtask fuzz imports`** — a multi-module generator with a fixed set of shapes (comptime construct of an imported struct; imported fields+method; reachable-unimported type; aliased peer + reachable generic; two-deep chain; aliased owner), filled from the seeded RNG, run through `check_program_typed` + `eval::run_tests` + `lower::lower_program`. An occurrence of the producer-bug prefix anywhere is a finding. Deep default 200_000; smoke (2 seeds × 1_000) wired into `check`. This is the piece that would have caught all four finds.
2. **Census** — `crates/wrela-compiler/src/internal_error_census.rs` locks the count and per-file distribution (162 sites). Adding a site without updating the list fails `cargo test`. Deliberately *not* a per-site "why unreachable" annotation table: a false unreachable claim is worse than none, and the four finds proved how easy those claims would have been to get wrong.
3. **Golden surface** — `cargo xtask golden` refuses any `expected/*.txt` that contains the producer-bug prefix, so pinning a bug as an expected diagnostic fails the gate.

**Closed by this item.** HH finding #1: instantiation keys now re-key under the importer's aliases alongside the bodies (golden/check-import-reachable-alias-generic, `value=406`). The other three finds were closed by A1b/EE/HH; this clause's fuzz lane is what keeps them closed.

**plans/M9.md item F3 decision 349**: census 164 → 170. Six new `eval/interp.rs` sites in `eval_array_map_take` — defensive abandons after sema; ordinary `check-try-map-take-unwind` source typechecks and evaluates without firing any of them."""

[[clause]]
id = "library.collections.bounded"
doc = "05-library.md#7"
status = "test"
tests = [
  "golden/check-slotmap-key-discipline",
  "golden/err-slotmap-stale-key",
  "golden/check-list-bounded",
