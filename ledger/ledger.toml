]
note = "05-library.md §9: `img.driver`/`img.actor` arguments \"must match `A.init` ... after generated capabilities and handles are substituted\"; the same section's \"a resource `init` argument without one recovery source is a build error\" (M4's own reading of it, decision-7 sub-note below) falls out of the identical mechanism, not a second one. Decision-7 sub-note (recorded at item C execution, 2026-07-23 — the plan's own \"decide the dumb exact rule, record it\" instruction; mechanism: `eval::image_checks::check_init_args`/`check_one_decl`, run third in `check_sealed`'s fixed order): every intrinsic argument is first sorted into *reserved* (belongs to the image's own wiring metadata, never checked against `init`: `device`/`core` for `img.driver`, `mailbox`/`core` for `img.actor`, `reserved_args`) or *ordinary*. Every ordinary argument must name a same-named `init` parameter — naming none is `err-image-init-extra-arg`'s own error, `` `driver#0` passes `queue_depth=...` to `Blk`, but `Blk.init` has no parameter named `queue_depth` `` (`Blk.init` here takes no parameters at all). An ordinary argument whose already-evaluated value is itself a decl reference (`Value::ImageDecl` — with or without its own `.handle()`, indistinguishable once evaluated, `image.graph.construction-dag`'s own note) satisfies its matching parameter with **no further type check**: `ImageDecl` is opaque, so this is the most this milestone can ever verify of a \"handle\" substitution — `golden/image-basic`/`golden/image-project` both exercise this directly (`Store.init(mut self, disk: u32)`'s own `disk` parameter is satisfied by `disk=disk.handle()`, an `ImageDecl` value, despite the parameter's own declared type being a plain `u32` placeholder — see below for why). Every other ordinary argument's evaluated *value* must fit the parameter's declared type (`value_fits_param_type`): the parameter's type is compared first for plain equality against the argument's own recorded static type, falling back to a numeric range check on the evaluated `Value` itself when both sides are integer-shaped — the one accommodation this item's own scope forced: a builder intrinsic argument is type-checked by `sema::bodies::check_intrinsic_args` with **no expected type** (item B's own documented scope line: \"item C's own job is validating them against the real target\"), so a bare integer literal like `queue_depth=8` is always recorded at its no-context default (`i64`), never the real target width (`u32`) — comparing recorded static types alone would wrongly reject every literal argument against any narrower parameter type, so this item's own dumb-and-correct fix reaches past the recorded type to the literal's own numeric value for exactly this one shape (unit-tested directly: `an_int_literal_argument_fits_a_narrower_declared_param_type`). Every `init` parameter *not* covered by an explicit ordinary argument above must still be satisfiable by a *substitution source* to be legal: a parameter whose declared type is named `DeviceCap`/`DmaPool`/`Mmio`/`IrqCap` (recognized by name, decision 7's own instruction) is satisfied by the declaration's own device wiring; one named `Actor` is satisfied by an actor-handle substitution the same way — **neither type name resolves as a real type annotation anywhere in this compiler yet** (`sema::types::resolve_named`'s own fixed arm list has no case for any of the five — `Actor[T]`/`DeviceCap[D]`/`DmaPool[P,N]`/`Mmio[L]`/`IrqCap[V]` are all still aspirational surface, matching 03-hardware.md's own worked example, which this milestone does not implement), so this half of decision 7 is currently **unrepresentable from real source** and is exercised only by this module's own hand-built unit tests (`a_capability_typed_init_param_is_satisfied_by_name_with_no_argument`, `a_handle_argument_satisfies_its_named_param_with_no_type_check`) — recognized defensively by name anyway, exactly like `image.graph.construction-dag`'s own cycle case, ready for the day either type resolves. A parameter satisfied by *neither* an explicit argument nor a recognized substitution source is `err-image-init-missing-arg`'s own error, `` `driver#0` is missing `Blk.init`'s own `queue_depth: u32` — no `queue_depth=...` argument and no wiring substitution source `` — and this is exactly 05 §9's own \"a resource `init` argument without one recovery source is a build error\" too: a resource-typed `init` parameter with no explicit argument and no recognized capability/handle substitution is precisely this same missing-parameter case, so `image.graph.init-args-match` covers both sentences with one mechanism, not two (the decision-7 sub-note this item was asked to record if this is how it fell out — it is). Honesty note on the two pre-existing accept goldens this item's own check forced to grow (per the plan's own explicit instruction, reviewed in the same commit): `golden/image-basic` and `golden/image-project` both previously passed `queue_depth=8`/`disk=disk.handle()` against a bare `init(mut self)` taking no parameters at all — a real, if previously unchecked, mismatch item B's own scope explicitly deferred (\"item C's own job is validating them\"). Both structs' `init`s grew a real parameter apiece (`Blk.init(mut self, queue_depth: u32)`, `Store.init(mut self, disk: u32)`, the latter's own doc comment explaining the `u32` placeholder honestly: `Actor[T]` cannot be spelled yet) so both goldens are now a *true* accept case for this exact rule — a plain matched parameter (`queue_depth`) plus a handle-substituted one (`disk`) in the same struct, satisfying the plan's own \"an accept case with a real init taking a plain param + a handle param\" requirement without a new fixture. `golden/image-helper-accept` needed no init changes (its own `Store.init` already took no parameters and its own `img.actor` call passes only the reserved `mailbox=`) but did need an `img.on_failure` call added — an unrelated, unavoidable consequence of `image.graph.failure-policy` landing in the same item, not this clause; recorded there.\n\nM6-A update (the placeholder this note's own paragraph above named retires): `Actor[T]` now resolves as a real type (`sema::types::resolve_named`'s new arm, `actors.calls.callerror-composition`'s own clause carries the full mechanism) — `golden/image-basic`'s `Store.disk: u32`/`init(mut self, disk: u32)` placeholder becomes the honest `Store.disk: Actor[Blk]`/`init(mut self, disk: Actor[Blk])`, its own doc comment rewritten to say so plainly instead of explaining why it couldn't yet. This retirement needed **no change at all** to `eval::image_checks`'s own substitution mechanism: `is_handle_type_name`/`value_fits_param_type` (this clause's own code) already matched a parameter's declared type by its bare outer name only (`if let Type::Named(name, _) = &p.ty { if is_handle_type_name(name) ... }`), never by structural equality against the argument's evaluated value — so `Actor[Blk]` (a `Type::Named(\"Actor\", [TypeArg::Type(Blk)])`) is recognized by exactly the same `name == \"Actor\"` check that used to match nothing real at all; the `Value::ImageDecl` short-circuit at the top of the ordinary-argument loop is unaffected either way. `golden/image-basic/expected/check.txt`/`expected/typed.txt` are the only two lines that moved (`u32` -> `Actor[Blk]`, both field and init-param); `expected/image.txt`/`expected/report.txt` are byte-identical, confirming the substitution behavior itself never depended on the placeholder. `DeviceCap`/`DmaPool`/`Mmio`/`IrqCap` remain exactly as unrepresentable as this note's own paragraph above already said — 03-hardware.md's own surface, untouched by M6.\n\nM7 correction (2026-07-24): this clause claimed a rule it only half-implemented, and the missing half rejected legal programs. 05-library.md §9's own sentence is `img.driver`/`img.actor` arguments \"must match `A.init` **(or its literal constructor)** after generated capabilities and handles are substituted\" — every paragraph above silently dropped the parenthetical, and so did the code: `find_init`'s own `None` arm handed `check_one_decl` an *empty* `TypedParam` slice, so for a struct declaring no `init` at all, **every** non-reserved wiring argument was rejected as naming no parameter. A struct with no `init` is constructed by its literal constructor — its own declared fields — so an argument naming a field is exactly what the doc allows. Three flagship boot goldens were hit: `golden/boot-actors` (`` `actor#1` passes `led=...` to `Worker`, but `Worker.init` has no parameter named `led` ``, `Worker.led: Actor[Ledger]`), `golden/boot-actor-chain` (`inner=...` to `Outer`) and `golden/boot-actor-reply-struct` (`led=...` to `Store`) — none of them could reach `--stage=image`, `--stage=report` or `wrela build` at all, while all three ran green under `wrela test`. Mechanism now (`eval::image_checks::find_constructor`/`Constructor`): a struct any module in the closure gives an `init` is matched against that `init`'s parameters — byte-identical search to the old `find_init`, so every rule and diagnostic above is unchanged for it; a struct no module gives an `init` is matched against its own declared fields, in declaration order, name and declared type alike. Field types come from `sema::typed::TypedStruct::field_types`, a new by-name map built by the same `sema::bodies::check_struct_members` walk that already builds `fields`/`field_defaults` (the resolved `Type` is already in hand there — it is the expected type that walk checks a field's own default against); like `fields`, it is checker/evaluator bookkeeping never rendered by `dump`, which is why not one pinned golden's text moved for it. Everything else is untouched and still enforced on both halves: reserved args skip first; a `Value::ImageDecl` argument satisfies its slot by name with no further type check; any other value must fit the slot's declared type (`value_fits_param_type`, including the integer-literal range accommodation, which now reaches a field's declared type the same way it reaches a parameter's); an argument matching neither is an error. The diagnostics name only what exists — `` `X.init` has no parameter named `f` `` for the init half but `` `X` declares no `init` and has no field named `f` `` for the field half, and likewise `` does not fit `X.init`'s own `f: T` `` versus `` does not fit `X`'s own field `f: T` `` — a message naming `X.init` for a struct that has none would be a lie. **The missing-slot direction runs for a declared `init` only**, recorded here rather than assumed: an unwired *field* is not a missing argument, because `layout::build_boot_init` zero-initializes every actor's whole state slot before any turn runs and only ever calls a *zero-argument* `init` (its own disclosed floor — materializing `ActorDecl::args` against a real parameter list is named, deferred work), so an unsupplied field already has a defined value; requiring one would reject `golden/boot-actors`'s own `Ledger.marks: u64`, an actor wired with nothing but the reserved `mailbox=`. 05 §9's own \"a resource `init` argument without one recovery source is a build error\" names `init` arguments, and that is exactly the scope kept. A struct name *no* module in the closure declares keeps the pre-existing behavior verbatim (an empty init slot list, so every ordinary argument is still rejected by name) — today the only shape that reaches there is a generic instantiation, whose checked body lives in `TypedProgram::instantiations` rather than `structs`. New evidence: `golden/image-field-wired-accept` is the accept case, pinned through `--stage=report` specifically because the report path is what was broken (an actor wired `led=led` against a no-`init` struct's own `Actor[Ledger]` field, with `Worker.pending`/`Ledger.marks` deliberately left unwired so the missing-direction boundary above is pinned too); `golden/err-image-field-unknown` is the reject case (`queue_depth=8` against a `Store` declaring neither an `init` nor such a field). Five new `#[cfg(test)]` cases in `eval/image_checks.rs` cover what no source golden pins: the field type-fit accept and reject, and that a declared `init` still wins over the same struct's fields (05 §9's \"or\" is exclusive). The three boot goldens above now also exercise this clause's accept path from their own `test.txt`, via the placement fix below.\n\nSame commit, the opposite failure — the fail-open half. `eval::image_checks::check_sealed` now also runs from `wrela test` (`bin/wrela.rs::test_cmd`), immediately after that command evaluates the `@image` fn whose graph it is about to lay out and boot. Until now it ran only from `--stage=image`/`--stage=report`/`wrela build`, so the one path that actually *builds and boots* an image never ran the graph checks at all — precisely the placement mistake `sema::send_proof`'s own module doc already records for a sibling pass (\"that pass only runs from `--stage=image`/`report`/`build` ... Fail closed: the rejection has to live where every consumer of the checked program passes through it\"). Demonstrated before the fix rather than argued: an actor wired `nonesuch=7` — an argument naming nothing at all, which `wrela build` rejects — compiled, booted and printed `1 passed, 0 failed` under `wrela test`. Two boundaries, disclosed rather than silently narrowed: (1) a file with no `@image` fn is not checked, because its graph is `ImageGraph::default()` and checking that against the module's own `declared_pools` would invent a rejection for a program that binds nothing precisely because it declares no image — the same condition `run_image_stage`/`build_report` already apply; (2) a file with no `@test(runtime)` fn never reaches the check, because `test_cmd` returns after the comptime tier without building, laying out or booting any image — there is no consumer of the graph on that path, which is the same tier `--stage=check`/`--stage=typed` occupy. `golden/err-image-field-unknown` carries both an `image.txt` and a `test.txt` expectation pinning the identical diagnostic from both paths, and is the standing oracle that this placement stays fixed. Wiring it turned up no other latent failure: all 20 `test.txt` goldens still pass byte-for-byte, and `cargo xtask golden --update` rewrote all 291 expectations byte-identically apart from this item's own four new files.\n\n**The other half, found by probing rather than by reading (orchestrator verification of this same commit): matching an `init` parameter was never the same as *running* that `init`.** `layout::build_boot_init` can only call a **zero-argument** `init`; one that declares parameters is not called at all, and the actor's state stays plain zero-initialized. Combined with the acceptance rule above, that was a silent wrong answer, not a missing feature: an actor declaring `init(mut self, depth: u32)` wired `depth=7` in the image booted with `depth == 0`, every assertion over it read 0, and all three tiers reported success. Verified by running it — the probe is now `golden/err-image-init-arg-unmaterialized`.\n\nCLAUDE.md's \"fail closed: an unimplemented path errors loudly; it never approximates\" governs, and a code comment disclosing a floor is not the same as failing closed. `RuntimeWiring::derive` now rejects any image that declares an instance of an actor whose `init` takes parameters, naming the actor, the parameter count, and why. The rule is keyed on the *declared actor's* `init` rather than on the wiring arguments (an `init` with parameters is uncallable by boot whatever the image passes) and never on plain data structs (`Pair.init(lo, hi)` in `golden/boot-actor-reply-struct` is ordinary legal code).\n\n**Scoped to the image flavor that actually boots** (`layout_test_image`), not to `layout_program`, and that is a real distinction rather than a convenience: `layout_program`'s entry stub halts with `EXIT_CODE_NO_RUNTIME` and never calls the runtime block at all, so a `wrela build` image cannot run an `init` of *any* shape today. Its report therefore stays a description of the image's declared wiring — which is what it claims to be — and `golden/appliance`/`golden/image-project` keep their report coverage unchanged. The first draft of this guard was placed in the shared path and destroyed both of those goldens; that is recorded here because the placement, not the rule, was the thing that needed getting right.\n\n**Not claimed at the time this was written**: that init arguments work. They were rejected, not implemented — and the M7 item W paragraphs below are the commit that makes that sentence false, so it is retracted here rather than left standing over a claim it no longer describes. Handle wiring to a *field* is unaffected either way, because a handle is routed by actor type rather than by the field's stored value (`golden/err-image-actor-ambiguous` is the fail-closed guard that makes that routing unambiguous).\n\n**plans/M7.md item W (2026-07-24): init arguments work now.** Boot calls each declared actor's `init` with its declared arguments, and the guard above — `ActorInitShapes::parameterized`, the `reject_parameterized_init` flag, and `golden/err-image-init-arg-unmaterialized` — is deleted in the same commit that makes it unreachable. The evidence is `golden/boot-init-args`, a real boot: three actors, ten hand-computed values across `u8`/`u16`/`u32`/`u64`/`i32`/`bool` plus both handle spellings, each read back through a `pub` method and asserted, and each expected value perturbed one at a time to confirm the assertion fails with its own message. `Gauge.peer` is the sharpest of them: it is wired `relay.handle()`, and `Relay` is actor#**1**, so the value plain zero-initialization would have left behind is the *perturbation* rather than the expectation.\n\nMechanism (`layout::actor_inits`/`build_boot_init_calls`/`boot_init_arg_word`/`build_boot_init`): every struct's declared `init` is collected as (call key, parameter list, return type); then for each `ActorDecl` in `graph.actors` order — which is `RuntimeTables::actors` order, one entry per declaration — one argument word is materialized per declared parameter, **in the `init`'s own declaration order rather than the image's wiring order**, by finding the wiring argument whose label matches the parameter's name. Reserved labels are skipped through `eval::image_checks::is_reserved_actor_arg`, the same predicate this clause's acceptance half uses, shared rather than restated precisely so the two can never disagree about which label is image-wiring metadata. `build_boot_init` loads word `i` into `x{i+1}` and the actor's own state address into `x0`, then calls. That ABI is `codegen::emit_prologue`'s, derived from it and not assumed: the prologue spills the receiver from `x0`, then each non-aggregate parameter from the next register up in declaration order, refusing past `x8` — and a real boot of an eight-parameter `init` confirms the eighth argument lands in `x8`. The value encodings are `codegen`'s own too (`Inst::ConstInt`'s `load_imm(value as i64)`, so a negative argument arrives sign-extended; `Inst::ConstBool`'s 0/1; `Inst::ConstChar`'s code point), unit-tested directly.\n\nA `Value::ImageDecl` argument materializes to its own construction-order index within its kind — the identical number `layout::build_test_root_args` already hands a `@test(runtime)` root for an `Actor[T]` parameter. What that number is *not*, recorded so it is never later mistaken for more: nothing in the machine reads a handle's value yet, because `codegen` routes every `await`/`send` statically by actor type to that actor's own `rt_enqueue` routine (`codegen::rt_enqueue_symbol`), so the word is the build-time identity the report already prints as `actor#0`/`driver#0` — not an address, not a mailbox. It is materialized rather than skipped because the guest can store and compare it (`golden/boot-init-args` does exactly that), and because the day handles become dynamic, `boot_init_arg_word` is the one place that has to change.\n\n`build_boot_init` also became two passes instead of one interleaved walk: every actor's state slot is zeroed, and only then is any `init` called. The word count is identical either way — this is a sequencing guarantee, not a size change — and it is what makes an `init` handed another actor's handle independent of the order the image happened to declare them in.\n\n**No flavor-conditional behavior survives.** `RuntimeWiring::derive` lost its `reject_parameterized_init` parameter. Scoping the old guard to `layout_test_image` was justified by a true fact — `layout_program`'s entry stub halts with `EXIT_CODE_NO_RUNTIME` and never calls the runtime block — and was still the wrong shape, because plans/M6.md item F/G's own found-and-fixed defect established that the runtime block **is** part of the image, tests or not, so the day `layout_program` grows a real entry it must find the identical boot sequence `wrela test` already boots. Both paths now materialize the same arguments and fail closed on the same shapes; `golden/err-image-init-fallible` pins that agreement from both tiers at once (`test.txt` from `wrela test`, `build-err.txt` from `wrela build`). The consequence is a reviewed, arithmetically exact diff on the two `--stage=report` goldens whose actors declare parameterized `init`s and were therefore never constructed at all before: `golden/appliance`'s `rtcode` grows 1824 -> 1928 bytes (26 words: two 2-argument `init` calls at 13 words each — two argument `load_imm`s, the `x0` `load_imm`, one `BL`) and `golden/image-project`'s 912 -> 948 (9 words: one 1-argument call). `rtdata` shifts by exactly that much with its size unchanged; nothing else in either report moved, and no other pinned golden of any kind moved.\n\n**Left closed, each with its own named diagnostic, each verified by running it** — never `internal error:` (that spelling is reserved for a producer bug) and never a zero. (1) A **fallible `init`** (`-> Result[...]`) names plans/M7.md item H and 03-hardware.md §9's consuming transition chain (`golden/err-image-init-fallible`). This arm also closed a live defect predating item W: a *zero-argument* `init` returning an aggregate was already reachable, and the old boot sequence called it with no `x8` (this machine's aggregate-return pointer register), so the callee wrote its reply through whatever `x8` held — booting straight into `wrela-vmm: guest fault: unhandled exception ... ipa=0x0`, reproduced before the fix. (2) Any other **non-`unit` `init` return**. (3) An **`Actor[T]` parameter with no explicit argument** — 05 §9's substitution-by-type half, which `check_one_decl` accepts and boot does not materialize (`golden/err-image-init-handle-substitution`). (4) A **capability parameter** (`DeviceCap`/`DmaPool`/`Mmio`/`IrqCap`, recognized by name exactly as this clause's acceptance half recognizes them) names plans/M7.md item A, which is what mints one; unrepresentable from source, so unit-tested rather than pinned, exactly like the acceptance half. (5) An **argument value with no register representation** — an aggregate, a float, a pool handle (`golden/err-image-init-arg-aggregate` uses a user enum, which `codegen::is_aggregate` classifies as an aggregate and whose `Fast` variant is index 0, so a silent zero would have *looked* right there and been wrong for `Slow`). (6) **More than eight arguments**: `codegen`'s own prologue reaches that shape first (`error[unimplemented]: codegen for more than 8 call arguments`), so no source golden can pin boot's own restatement of the same register budget and a unit test carries it instead.\n\n**plans/M7.md item D: item W's residual is closed.** Item W left this named rather than discovered later: \"A handle wired through an `init` *parameter* now carries its real construction index; a handle wired straight to a *field* (05-library.md \u00a79's literal-constructor path, which has no `init` to call) still arrives as the zero the state-fill leaves. The two paths genuinely disagree.\" Item D was named as its owner, with two options: materialize into the field's own offset, or fail closed on a nonzero index.\n\n**Failing closed, and the rule generalized to its exact form**: *a field-wired argument must equal the zero the state-fill leaves* (`layout::check_field_wired_args`). Exact, not conservative \u2014 a field wired to `actor#0` already agrees with the state-fill byte for byte, which is why `golden/image-field-wired-accept` stayed green untouched \u2014 and it covers the half item W did not find: a *scalar* wired to a field of a no-`init` struct (`img.actor(Store, seed=8)` against `Store.seed: u32`) was silently zero at boot for exactly the same reason. \"Nonzero index\" and \"nonzero value\" are one rule. A value with no register representation is rejected too, since this compiler cannot show it is zero either. Evidence: `golden/err-image-field-handle-unmaterialized` (the handle half, `actor#1` wired to a field \u2014 pinned as a `build-err.txt` rather than a `report.txt` case, because a `LayoutError` is a hard failure of `xtask report-determinism`'s own driver rather than report text, and pinning it as a report would break that lane) and `layout::tests::a_field_wired_scalar_must_also_equal_the_state_fills_zero` (the scalar half, plus the accepting zero and the reserved-label case).\n\n**Why not materialize** (the other option, and the reason it was not taken): `codegen` routes every `await`/`send` statically by actor *type*, so nothing reads a handle word at runtime \u2014 storing one into a field offset would be an unobservable write, a mechanism built ahead of the thing that needs it. It also could not be done inside item D's own file boundary without either touching `codegen.rs` (whose `field_offset_size` is the only field-offset rule) or duplicating that rule, and a second copy of a byte-offset computation is exactly the shape this repo refuses. When an `Actor[T]` becomes comparable, storable or sendable, this rejection is what fails and points at the work.\n\n**It was load-bearing, not hypothetical**: two flagship boot goldens relied on it. `golden/boot-actor-reply-result` and `golden/boot-actor-reply-struct` each wired `store=<actor#1>` to a no-`init` `Probe.store` field, so both booted with a handle the image did not declare \u2014 correct only because nothing read it. Both now declare `Probe.init(mut self, store: Actor[Store])`, item W's own marshalling materializes the real index, and every pinned transcript is byte-identical, which is the evidence that the value really was unread before."

