note = "plans/M7.md item B, the second half of 03-hardware.md §3's sentence: \"For every `@layout` type the compiler reports exact size, offsets, padding, and endianness.\"\n\n**`wrela dump --stage=layout-types`** (plans/M7.md decision 4 named the stage with \"name TBD in item B\"; kept, since the artifact is exactly a table of the build closure's `@layout` *types*). M1 dump style throughout: a versioned header (`LayoutTypes v0`), `Kind key=value` lines, two-space indent per level. One `Module path=<dotted address>` block per module that declares at least one `@layout` type — a module with nothing to say is absent entirely, and a closure with no `@layout` type at all is just the header (facts only, never a placeholder). Under each: `Layout name=... kind=... endian=... size=... padding=...`, then its `Field name=... type=... offset=... size=...` and `Padding offset=... size=...` entries in ascending offset order. Byte offsets print as hex and byte counts as decimal — the same split the report's own memory-map section already uses for `base=`/`size=`: an offset is an address inside the map, a size is a count. The stage takes the identical single-file/whole-closure fork `--stage=check` does, and runs the full sema check first: a program that does not check has no layout table worth printing, and its own diagnostic is the honest dump. Landed before any driver uses a layout, per CLAUDE.md's \"every pipeline stage gets a stable text dump and golden coverage before it gets features\".\n\n**Determinism** (`image.report.deterministic`'s own property, checked here rather than assumed): the renderer (`sema::types::push_layout_lines`, shared so the dump and any later consumer cannot drift) is a pure function of its argument — no I/O, no clock, no hashing, no iteration order of its own — and its input is deterministic because `check_layouts` is a pure function of one specialized ast module and every caller walks the closure in `BTreeMap` key order. Pinned by `sema::types`' own `check_layouts_is_a_pure_function_of_its_module` and `the_dump_grammar_is_fixed` unit tests as well as by the goldens.\n\n**Not claimed**: that anything *uses* a reported layout. Nothing mints a capability, maps a partition, or emits a load or store against these bytes — see `hardware.layout.exact-bytes` for the rules, and plans/M7.md items C/D/E for the access, ownership and composition that follow.\n\n**Note-update (same item, next commit — the report section).** The other artifact 03 §3's \"the compiler reports\" asks for: the image report's own exact-bytes section (`report::render_exact_bytes_section`, `report.rs`'s section 8b), the same `Layout`/`Field`/`Padding` lines at the report's depth, from the same renderer so the two can never drift — same facts, same spelling, different indentation. `bin/wrela.rs::build_report` appends it between `report::render`'s own sections and the M5 memory map: declaration facts before emission facts. Appended by the caller for the same reason the M5 memory map is (`layout::render_layout_section`): the facts come from the closure's own ast, which a sealed `ImageGraph` does not carry. `golden/check-layout-mmio` gained `expected/report.txt`, 03 §2's own `VirtioIrqMmio` example reported inside a real image; `report.rs`'s own `the_exact_bytes_section_is_a_pure_appending_function` pins both the grammar and the purity.\n\n**Population**: every `@layout` type declared in the build closure. 03 §3 says \"the image reaches\", and today that cannot be narrowed honestly — no capability type exists yet (plans/M7.md item A mints them), so nothing in an image can *hold* a layout, and an invented reachability rule would be worse than a stated over-approximation. Narrowing it belongs to the item that makes `Mmio[L]` bind a layout to a device. No existing report golden moved when this landed, because no existing image closure declares a `@layout` type and an empty section prints nothing.\n\n**Honestly scoped gap, disclosed rather than papered over**: `xtask`'s `report_determinism`/`repro` oracle reproduces the report pipeline in-process and does *not* call `render_exact_bytes_section` (it duplicates `build_report` stage for stage, and item B could not touch `crates/xtask/**`). Its two fresh runs therefore agree about a report text that omits this section, so the section's determinism rests on the unit and golden pins above rather than on that oracle. Wiring it in is one line in `produce_report_and_image` and is named here as real, undated follow-up work — not a silent hole.\n\n**Oracle hole closed at merge (orchestrator), disclosed by the item itself rather than found later.** `bin/wrela.rs` appends this section to the report, but `xtask`'s own `produce_report_and_image` — the function `repro`/`report_determinism` build their two fresh runs from — duplicated the report pipeline stage for stage *without* the section. The determinism lane was therefore comparing a report text in which this section did not appear, so a nondeterminism inside it was invisible to the one lane whose entire job is catching nondeterminism. `produce_report_and_image` now mirrors the production path exactly (same module walk in `BTreeMap` key order, same `check_layouts` call, same append position). The duplication itself is the real hazard and is recorded as such: two report pipelines that must agree is a shape this repo would normally refuse, and it survives here only because `report::render`'s signature is fixed by its other callers."

