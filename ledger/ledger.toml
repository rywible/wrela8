note = "plans/M7.md item H1 (flipped from item C's deliberate gap), 03-hardware.md §2's last-but-one sentence: \"MMIO access is volatile and effectful: never elided, merged, or reordered across target I/O boundaries.\"\n\n**The source-level half, unchanged and still structural.** A register has no value form (`hardware.mmio.typed-access`), so an access exists exactly where the author wrote one and cannot be hoisted, sunk or CSE'd out of it; `compiler.codegen.naive-locked` still guarantees nothing downstream elides, merges or reorders anything. That half was never this clause's gap. What this clause required — and what item H1 now supplies — is the *emitted* half: a real load/store of a register's declared width, against a base that is not the zero a state-fill leaves, witnessed by a Hypervisor.framework boot.\n\n**The three things the gap named, each now satisfied and checkable.** (1) *A mint that gives an `Mmio[L]` a real base at boot.* Decision 11's one word (`hardware.capabilities.runtime-word`): a capability is a guest base address. Boot materializes a `DeviceCap[D]` as the device's `devregs` window base; `<Device>.claim(cap=take cap)` carries that word forward as a `DriverClaimedDevice[D]`; `<state>.map_partition(L)` yields an `Mmio[L]` holding the same base (`golden/check-device-claim/expected/mwir.txt`: each is one `Copy`). The address is not invented at use — it is the window `layout::device_register_windows` sized from the driver's declared `Mmio[L]` fields, the same set item C's no-alias rule partitions. (2) *An emitted load/store of the register's declared width.* `lower.rs` produces `Inst::MmioRead`/`Inst::MmioWrite` with the register's `@offset` and scalar type; `codegen::mmio_access_width` picks the unsigned width (`u8`/`u16`/`u32`/`u64`/`usize`) and `encode` emits `ldrb`/`ldrh`/`ldr w`/`ldr x` (and the matching stores), including the halfword forms this item added (`enc_ldrh_imm`/`enc_strh_imm`). `golden/check-device-claim` carries both a `u32` access (`ldr w`/`str w` at offsets 0x60/0x64) and a `u16` access (`strh` at 0x100) in one driver, so a backend that used one fixed size cannot pass both lines. (3) *A Hypervisor.framework boot transcript in which a guest-visible register read and write actually happen.* `golden/boot-device-claim` is that transcript: the driver's `init` claims, partitions, then reads and writes real `devregs` bytes — a `u32` store at 0x100 must not clobber its neighbour at 0x104, a `u16` store at 0x108 must not clobber 0x10a, and every store must land at its declared offset rather than at the claim's base — and the transcript reports `test device_claimed_image: ok`. Its vacuity control is `golden/err-boot-driver-init-runs`: the same image with one assertion inverted, whose expected output is the single `FAILED assertion failed: INVERTED ON PURPOSE...` line plus `0 passed, 1 failed`. Without that control, every \"still reads 0\" assertion in the accept golden would also pass on a boot that never called `init` at all.\n\n**Volatility itself remains structural, not annotated.** No optimizer barrier was implemented and none is claimed. What holds is the same two facts item C recorded: position (a register has no value form) and preservation (`compiler.codegen.naive-locked`). The day the cleverness budget buys an optimization pass, that pass must learn about `MmioRead`/`MmioWrite`, and this paragraph is the record that it has not had to yet. What is *new* is that those node kinds now have a real backend emission and a real boot that exercises them — so the sentence's \"never elided, merged, or reordered\" claim is no longer vacuously true of a path that did not exist.\n\n**Left closed, named.** The async MMIO path (`flowwir_lower` on `Mmio.read`/`Mmio.write`) fails closed by name — an ISR or 03 §7 bottom-half task is plans/M7.md item G, and a synchronous load invented there would be the wrong answer. `negotiate`/`start`/`read_capacity_sectors`/`take_irq` are named rejections of the bring-up chain (`hardware.transport.bring-up`): each names the transition, the state it would consume, and the machinery that is genuinely missing. A signed register width and an offset outside the unsigned-immediate encoder's scaled reach fail closed in `codegen::mmio_access_width` — no sign-extending load exists, and silently zero-extending one (or inventing a base-plus-register form) would be a wrong answer, not a missing feature."

