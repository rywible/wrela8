note = """03-hardware.md §4 + plans/M13.md item M / decision 1: `VirtQueue.reserve` is proof-conditioned — declared `Result[QueuePermit, CapacityError]`; whole-image proof success lets a use site collapse to `QueuePermit`; proof failure at a collapsed use site is refused with a why-chain (queue, depth, in-flight bound, image fact — 04 §7 causality). Sites that keep the Result stay legal; item L (`sema.errors.no-silent-discard`) refuses silent `Err` discard of `CapacityError`.

**History.** Formerly `reserve_proven` yielding only `QueuePermit` with a hard whole-image rejection when the proof failed (plans/M7.md item E2 / decision 6). Id kept; the `*_proven` naming law in 05 §10 was deleted by item M.

**The proof** remains `sema::reserve_proof` (send_proof shape): count static `VirtQueue.reserve` sites, at-most-once per root turn, `count <= floor(queue_depth / descriptors)`. Machine v1 virtio-blk op is `DESCRIPTORS_PER_BLK_OP = 3`. Occupancy `floor(128/3) = 42` / `floor(8/3) = 2` pinned by `golden/check-queue-occupancy`, `golden/boot-device-bringup`, `golden/check-reserve`. Dump oracle: `golden/check-reserve`. Capacity/collapse rejections: `err-reserve-capacity`, `err-reserve-in-loop`. Shape: `err-reserve-descriptors`, `err-prepare-block-take`. Silent Result discard: `err-reserve-unproven-discarded`.

**Decision 15 / E3 / E4 / item G.** Unchanged: prepare packages; publish writes; runtime backpressure proxy remains item G."""


