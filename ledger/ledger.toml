note = "03-hardware.md §6: \"The binding — not a keyword — makes the compiler restrict the function's transitive effects to the ISR set: read/write its device's typed MMIO and acknowledge its source; read/write that driver's `InterruptCell[T]` state; call helpers whose inferred effects fit the same set; and `wake(...)` a statically bound task. It cannot allocate, await, block, call another actor, touch device-owned DMA payloads, drain unbounded work, use floating point, or format.\"\n\nplans/M7.md item G, decision 3: the same whole-graph reachability `eval::legal::classify` already computes — a third color. Seeds are every `IrqCap.bind` handler `FnRef` in the module (`collect_isr_roots`); forward reachability marks the ISR's transitive closure; any node in that closure whose signature or body carries a forbidden effect is rejected, with the call path from the ISR root naming the effect (`eval::legal::check_isr_effects`, wired beside `check_provenance` in `sema::check_typed`).\n\n**Allowed today.** Typed MMIO read/write (`golden/check-irq-bind`). `InterruptCell[T]` (`golden/check-interrupt-cell`). `wake` (`hardware.bottom-half`).\n\n**Source-shaped rejections.** Floating point (`golden/err-isr-float` / `err-isr-float-via-helper`); `while` (`golden/err-isr-while`) and `for` (`golden/err-isr-for`) as \"drain unbounded work\"; DMA/`own` (`golden/err-isr-dma`); plain field channel (`golden/err-isr-plain-field`). Bring-up transitions, `IrqCap.bind`/`unmask`, `Group.*`, and `now()` inside the closure are also named forbidden. plans/M9.md item K1: `now()` in a parameter default is scanned with the callee (`golden/err-now-default-in-isr`); direct body use remains `golden/err-now-in-isr`.\n\n**Unrepresentable in a sync ISR's transitive closure today.** An ISR must be a plain `fn`; a plain `fn` cannot `await`/`send`/`with group` (earlier diagnostics). Those arms are unit-tested in `eval::legal::tests::isr_forbidden_reason_names_every_doc_effect`. **Format** fails closed at `bodies` (`f-strings are not checked yet`). **Allocate** has no runtime allocator node yet. Both stay left closed, named, until a typed node exists for the exhaustive match to refuse.\n\n**Left closed, named.** Receipts (item E).\n\n**Item I's sweep (2026-07-25) — \"Receipts (item E)\" left-closed line is stale.** E4 closed receipt resolve on `@task`; format/allocate remain unrepresentable as noted."
