note = "Stays a gap: `cargo xtask profile` (plans/M5.md item F, live as of this session) prints the compiler's own per-phase wall time building `tests/golden/boot-hello` plus one real boot's own guest counts (wall time, vCPU exits, transcript bytes, clock reads) — a *measurement* report, not a *predicted-vs-measured* one. The report itself (`report::render`) predicts no costs anywhere yet, so there is nothing for `profile` to diff its measurements against.\n\n**Owner (ladder renumber 2026-07-28 / M16 activation):** ROADMAP **M18** (the cycle proxy; was M16 before stdlib-maturity + entropy were inserted, M15 before variable-cores became M15, and earlier still M14/M13/M12/M11 under prior insertions). Flips to `test` on proxy A/B ranking oracles + semantic exact-matches (choice entries, exits, transcript bytes, exit status) — **not** on device exit-rate report lines (06 §5), which remain a separate unscheduled report feature. Until M18 activates, the flip condition above is the standing rewrite of this note's earlier owner wording."

[[clause]]
id = "compiler.bench.compiler-lane-locked"
doc = "04-compiler.md#7"
status = "test"
tests = ["xtask:bench"]
note = "cargo xtask bench compiler runs three in-process lanes in one command, each 3 warmup + 15 timed iterations, each reporting its own min/median/max whole-corpus total and each locked separately so one lane's regression never masks another's: (1) lex+parse over every doc/example corpus entry plus every tests/golden/*/input.wr, also reporting the median for the largest single entry (the virtio worked example); (2) plans/M2.md item I's check lane, lex+parse+sema::check over every golden input that lexes and parses (both sema-success and sema-error outcomes are timed; lex/parse-error inputs are excluded); (3) plans/M3.md item F's eval lane, lex+parse+sema::check_typed+eval::run_tests over every test-bearing golden, so a regression in the evaluator's own hot path (loop-heavy @test bodies) is caught on its own rather than averaged away inside the check lane. Wired into xtask check after roundtrip. wrela --timings reports the same per-phase wall clock (read/lex/parse/dump/total) to stderr only, so goldens comparing stdout are unaffected.\n\n**Methodology change, 2026-07-25** (GOAL.md, \"the compiler-lane locks are losing resolution\"; its own commit with before/after numbers and a plans/REVIEW-QUEUE.md line, per that rule). All three lanes time a *corpus*, and all three used to lock a whole-corpus absolute median. That dilutes on every added golden: check_golden_median_us had already been re-locked 40000 -> 400000 as the corpus grew 25 -> 154 entries, and at today's 361 check-lane entries the measured median sat at ~122ms against the 400ms lock, so a per-entry regression of nearly 3x could have landed without tripping anything. The keys are now microseconds **per entry** — full_corpus_per_entry_us (1000; measured 90us/entry quiet over 421 entries), check_golden_per_entry_us (4000; measured 337us/entry quiet over 361), eval_tests_per_entry_us (20000; measured 1829us/entry quiet over 37) — each 10x the quiet measurement rounded up, the same rounding rule the file always used. Per-entry is corpus-size invariant: adding goldens does not move the number, and a lane 2x slower per entry trips the lock whatever the corpus size. enforce_per_entry_lock compares median_ns against threshold_us * 1000 * entries rather than dividing the measurement, so the lock keeps full timer resolution however small a per-entry median becomes, and it fails closed on a zero-entry corpus (a lane that silently benchmarks nothing). bench build and bench guest keep absolute locks on purpose: each times one fixed workload, so there is no corpus to divide by and nothing to dilute."

[[clause]]
id = "compiler.bench.build-lane-locked"
doc = "04-compiler.md#7"
status = "test"
tests = ["xtask:bench", "golden/appliance"]
note = "plans/M4.md item E: cargo xtask bench build — its own subcommand (`bench build`), not a fourth key inside `bench compiler`, since it times a different pipeline tail: in-process, `produce_report_text` (the identical in-process build pipeline `report-determinism` already runs twice per case to prove determinism, reused here timed instead — loader/single-file fork -> sema (`check_typed`/`check_program_typed`) -> `eval::interp::eval_image` -> `eval::image_checks::check_sealed` -> `report::render`, no file writes anywhere in that call chain) over the M4 example appliance (`tests/golden/appliance`, resolved through the same `golden_case_target` the golden runner itself uses), same 3 warmup + 15 timed shape every other bench lane already uses, reporting min/median/max total wall time and comparing the median against the locked threshold in `bench/thresholds.toml`'s own `[build]` table (`build_appliance_median_us`, kept in its own section rather than folded into `[compiler]`, for the same reason the check/eval lanes' own thresholds are kept separate from each other and from the lex+parse lane's — one lane's regression must never mask another's). Measured median on the locking machine, across several runs of 15 timed iterations each: ~0.95-1.9ms (950-1900us, noisier than the other lanes simply because the whole pipeline — including a real `@image` evaluation and all four `image.graph.*` checks — is a shorter, less-amortized total than the corpus-wide lanes above). This threshold is 10x the higher end of that observed range, rounded up to a clean number (20000us) — same rationale as every other locked bench threshold in this file: loose on purpose, so it catches an algorithmic blowup (e.g. an accidental O(n^2) in the loader's closure walk or `@image` evaluation) and never a false alarm from ordinary machine noise. Wired into `cargo xtask check`, immediately after `bench compiler` (`check`'s own call order: `bench_compiler()?; bench_build_lane()?;`)."

