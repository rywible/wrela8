# clauses today. Every one is opened here"). Item F opens the VMM-side half —
# the device model, its ring validation, its doorbell, and its completions in
# the recorded choice sequence. The guest-side clauses the milestone's own exit
# criteria name (`hardware.capabilities.unforgeable`, `hardware.layout.
# exact-bytes`, `hardware.mmio.no-alias`, `hardware.dma.ownership-transfer`,
