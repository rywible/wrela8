id = "hardware.dma.pool-backing"
doc = "05-library.md#9"
status = "test"
tests = ["golden/check-dma-pool", "golden/appliance", "golden/boot-dma-pool", "golden/err-pool-backing-too-large", "golden/pool-slot-stride", "golden/check-pool-two-devices", "golden/check-pool-driverless-device", "golden/err-blk-config-on-another-device", "golden/err-blk-config-two-devices", "golden/err-layout-name-collision"]
note = "05-library.md \u00a79: both pool intrinsics \"reserve exact backing\". plans/M7.md item D: the reservation is a `pooldata` section of zeroed image bytes \u2014 exactly like `rtdata`'s actor tables, and for the identical reason (there is no allocation anywhere in this machine; every byte is sized at build time). It is the final section of both image flavors (`layout::layout_program` and `layout::layout_test_image` alike, so a `wrela build` image and a `wrela test` image of the same source have the same memory map \u2014 plans/M6.md item F/G's own rule). Absent entirely for an image that binds no pool, which is why no golden without one moved when this landed.\n\nOne section, not one per pool, deliberately: a section is a *report* fact the VMM presence-checks, a pool window is a *mapping* fact it enforces, and the per-pool `Pool`/`BlkPool` lines already carry each window's own base and size (`image.report.dma-pools`), so nothing is lost. It also keeps `verify_section_sizes`' \"every gap is alignment padding\" rule intact, which a 1-byte-aligned pool next to an 8-byte-aligned one would otherwise break.\n\n`place_pools` walks `pool_backings`' `BTreeMap` in name order, rounding each pool to its own declared alignment; `MAX_POOL_BYTES` (16 MiB) caps the total, because pool backing is emitted image bytes and guest DRAM is 1 GiB (06-machine.md \u00a72) \u2014 the same shape and the same reasoning as the VMM's own `devices::MAX_DISK_BYTES` (`golden/err-pool-backing-too-large`). Evidence: `golden/check-dma-pool` pins a 128-byte DMA pool and a 256-byte plain pool placed back to back inside one 384-byte `pooldata` section; `golden/appliance`'s 8 \u00d7 4 KiB `img.pool` is the largest real one; `layout::tests::pools_are_placed_in_name_order_each_at_its_own_alignment`, `an_image_with_no_pool_reserves_no_pooldata_section` and `pool_backing_placed_inside_an_existing_section_is_refused` are the unit oracles.\n\n**The real-boot oracle** (plans/M7.md's A\u2013H note: dump review alone misses what only running finds). `golden/boot-dma-pool` declares both pool forms \u2014 384 bytes of backing \u2014 and runs an ordinary actor conversation over the resulting image on Hypervisor.framework. Nothing there reads pool memory (nothing constructs an `own[P] T`), so what a green transcript proves is precisely that reserving and placing the backing left every runtime table where it was: every actor's state, mailbox and turn record lives in the section `pooldata` now follows. It is load-bearing, verified by perturbation: deleting the one line that advances the placement cursor past `rtdata` (the bug this item's own first draft had) makes `--stage=report` fail with `pool backing would be placed at 0x..., inside a section that ends at 0x...`. That guard exists because the symptom without it was a `debug_assert` inside serialization \u2014 a panic in a debug build and silence in a release one.\n\n**Not yet reserved: the initial handles.** 05 \u00a79 also says the pool intrinsics \"create the initial handles\", and `img.dma_pool` does return one \u2014 as a build-time `Value::ImageDecl`, which an `init` argument may name. Materializing that into a *runtime* value (03-hardware.md \u00a71's `DmaPool[P, N]`, or the `[own[P] T; N]` array 02-language.md \u00a74's worked example passes) is not done: `layout::build_boot_init_calls` fails closed by name on a pool-handle argument rather than passing a zero, and 03 \u00a71's `DmaPool[P, N]` parameter fails closed by name in `eval::image_checks::check_capability_substitution`. Both are named rejections with the item that owns them, never a silent zero.\n\n**Item I's sweep (2026-07-24) — two findings, one corrected claim and one new fail-closed guard.**\n\n(a) **The alignment claim was true of slot 0 only.** This note said deriving the pool's alignment from `layout_alignment` (the payload's widest scalar field) \"means the two cannot disagree\", because that is the same rule item B enforces on every explicit `@offset`. It relates the *base* to the payload's alignment and says nothing about the **stride**, which is `slot_bytes` with no round-up — 03 §3's own \"no trailing padding and no alignment round-up\". The two agree only when `slot_bytes % align == 0`. `golden/pool-slot-stride` pins the counterexample as an *accepting* case with its numbers spelled out: a `@layout(dma)` payload of `sector: u64` + `status: u8` is 9 exact bytes with `align=8`, so slot 1 lands at `base + 9` and its `u64` field is not 8-byte aligned; slot 2 at `base + 18`, and so on. **Not fixed** — nothing turns a slot index into an address yet (that is `own[P] T`'s runtime handle, plans/M7.md item E), and the three available answers (reject such a payload; pad the stride and report it separately from `slot_bytes`; keep the packed stride and require the payload to tolerate it) are a design choice that belongs to the item that needs one. Pinned so item E meets the numbers rather than rediscovering them.\n\n(b) **Decision 5's security property is per-device; the artifact was not.** The `BlkPool name= base= size=` mapping line carried no device, and `wrela-vmm::parse_report` collected every one into a single `Vec<PoolWindow>` for its one `BlkDevice` — so an image declaring `img.dma_pool(..., device=a)` alongside `img.dma_pool(..., device=b)` rendered two windows the one device model would treat as equally reachable. Item I fell closed by refusing the image: `eval::image_checks::pool_backings` rejected two or more distinct pool-bearing devices. **Superseded 2026-07-25 by plans/M8.md item P — see the closing paragraph of this note.** The guard is gone; the line carries `device=`, the VMM binds per device, and two pool-bearing devices is an ordinary image (`golden/check-pool-two-devices`).\n\n(c) **A `@layout` type\u2019s identity is its bare name, and two modules could each own one.** `closure_layouts` unions every module\u2019s already-checked `@layout` table into one `BTreeMap` keyed by the bare type name, and that table is what `img.dma_pool[T](name=P, ...)` reads to answer how many bytes a device can reach. It resolved a same-name collision last-module-wins, disclosed in a comment as \"the identical, already-recorded simplification `layout::merge_layout_ctx` makes\". The disclosure understated it, and both arms were verified by running: with the other module\u2019s `Ctl` spelled `@layout(dma)` over three `u64` fields, an image binding `img.dma_pool[Ctl](name=Control, count=4)` against its *own* one-byte `Ctl` reserved 4 x 24 bytes and reported `slot_bytes=24` \u2014 from a type that module cannot name and its author never wrote, which is a wrong answer about exactly the bytes decision 5 calls a security property; with it spelled `@layout(mmio)`, the build was *rejected* for a kind the complaining module\u2019s own `Ctl` does not have and cannot see. The real fix is cross-module type identity, which this compiler has nowhere \u2014 no type name resolves across a module boundary at all, so neither module could name the other\u2019s type even deliberately \u2014 so until that exists two `@layout` types with one name in one build closure is a build error naming both modules rather than a coin flip (`golden/err-layout-name-collision`). The accepting control was checked as well: renaming one of them builds and reports `DmaPool name=Control type=Ctl` unchanged, so the rule refuses the ambiguity and nothing else.\n\n**Post-closure M7 sweep port (2026-07-25) — a pool on a driverless device still minted a mapping window.** The two-devices guard above caught pools on *two* devices. A pool bound to a device that *no* `@driver` binds at all sailed through: verified by running, `img.dma_pool(..., device=other)` with `other` unbound by any driver rendered `Pool name=Control ... device=device#1` (correct accounting) *and* `BlkPool name=Control base=... size=...` (a mapping window). device#1 had no driver; device#0 did. With item E1/E4 live those bytes became reachable from the wrong model, so a second fail-closed guard refused that shape too — but only when the image already had a driven device. Found on orphaned branch `m7-sweep-2` (`0a34f2f`); the branch never merged and the defect was still live on master after M7 closed. **Superseded the same day by item P** (below). `golden/err-dma-pool-mint-wrong-device` keeps the second driver that sweep gave it; the mint mismatch it pins is unaffected either way.\n\n**plans/M8.md item P (2026-07-25) — what actually shipped, replacing both guards above.** The `BlkPool` mapping line now reads `BlkPool name=<n> device=device#N base= size=` and `BlkDevice` reads `BlkDevice device=device#N capacity_sectors= features= [vector=]`; the blk device's identity is derived from the pool the image's single `VirtQueue.configure` site consumes, not from a scan (`layout::derive_blk_report`). `devices::PoolWindow` carries `device`, `devices::GuestMem` carries the device whose view it is, and `window_offset` — still the single guest→host conversion site in the VMM — refuses a range inside another device's window as `BlkFault::ForeignPool`, named apart from `OutsidePool`. `GuestMem` deliberately holds **every** declared window rather than a pre-filtered list, so the device check has something to refuse and a mutation of it is observable. See `hardware.dma.pool-reachability` for the runtime oracles.\n\nBoth guards are therefore deleted from `pool_backings`, and each relaxation is pinned by the accepting golden that replaces its `err-` case: `golden/check-pool-two-devices` (two devices, two drivers, two pools, distinct `device=` on both `Pool` and `BlkPool` lines) and `golden/check-pool-driverless-device` (a pool on a device no `@driver` binds, in an image where another device *is* driven). The driverless case is not re-refused on 03 §1 capability grounds — that argument does not single it out: it applies identically to `golden/boot-dma-pool`, a deliberately pinned legal M7 shape with a pool on a device and no driver at all, so applying it uniformly would be a widening of the rule rather than the relaxation this item is, and would need its own normative sentence. What 03 §1 does refuse is unchanged and one pass later: a driver bound to device#Y taking `DmaPool[P, N]` for a pool declared reachable from device#X (`golden/err-dma-pool-mint-wrong-device`).\n\n**What legalizing two devices newly required (decision 25).** With one pool-bearing device, \"the device that declares `capacity_sectors=`/`required_features=`\" and \"the device whose pool hosts the ring\" were the same device by construction, so `blk_capacity_sectors`/`blk_accepted_features` could scan the device list in declaration order — and the lowerer reads the first through `TypedProgram::blk_capacity_sectors`, where no configure site is in scope to disambiguate with. Rather than grow a second, device-scoped derivation that could disagree with the lowerer's, `eval::image_checks::check_blk_config_names_the_blk_device` refuses the only shape in which they could: blk configuration declared on a device that is not the blk device (`golden/err-blk-config-on-another-device`, a one-line twin of `golden/boot-blk-two-devices`). 06-machine.md §6's device set is closed and machine v1 has exactly one `blk`. **plans/M8.md item H attack 3 (2026-07-25):** the no-configure early return used to evaporate the whole check, so two devices could both declare `capacity_sectors=`/`required_features=` with no configure site and build — `derive_blk_report` emitted no `BlkDevice` line, and `blk_capacity_sectors` would have returned the first declaration in order. Closed: with no configure site the check now refuses any image in which more than one device declares those labels (`golden/err-blk-config-two-devices`, one label away from `golden/check-pool-two-devices`). A single device declaring unused blk config with no configure remains legal."

[[clause]]
id = "hardware.dma.ownership-transfer"
doc = "03-hardware.md#3"
status = "test"
tests = ["golden/check-dma-pool", "golden/err-dma-pool-own-mismatch", "golden/err-dma-pool-own-in-enum", "golden/check-torture-block-cache", "golden/check-torture-frame-ledger", "golden/check-dma-shared"]
note = "03-hardware.md \u00a73: \"**Transfer payloads** are `own[P] T` where `P` is a device-bound DMA pool and `T` is `@layout(dma)`. While the CPU owns the handle, code reads and mutates the payload normally. Publishing to the device consumes the handle; the source owns a `Receipt[own[P] T]` instead, and touching the payload while the device owns it is unrepresentable.\"\n\nplans/M7.md item D owns the first two sentences; the third is item E3 (`publish` / `Receipt[P]`) — see the E3 paragraph below and `hardware.receipts.resolve-once`. What is true here:\n\n**The handle is a resource and moves.** `own[P] T` is a resource by fiat (`types::resource_propagates`, unchanged since M2), so every ownership rule 02-language.md \u00a73.1 states applies to it with no hardware-specific mechanism: `golden/check-torture-block-cache` and `golden/check-torture-frame-ledger` are the pre-existing, deliberately adversarial witnesses \u2014 handles moved through `take` parameters, `take self` methods, `Option[own[P] T]` slots, arrays, struct fields, a swap-and-return, a use-after-take rejection. Those cases predate this item and are cited rather than reproduced, because the move rules are not what item D adds.\n\n**The handle's payload type is the pool's.** What item D adds is the rule that makes the pool name mean something: `own[P] U` is legal only when `U` is the payload type `P` was bound with (02-language.md \u00a74: \"a handle to a `T` allocated from *that* pool\"), and for a DMA pool that type is `@layout(dma)` with exact bytes, so the disagreement is a slot of the wrong shape for a device to read or write. This is a whole-*image* fact \u2014 which pool a name is bound to is decided by the `@image` fn \u2014 so it lives in `eval::image_checks::check_pool_decls` beside the other graph checks, not in per-module typing. `golden/err-dma-pool-own-mismatch` is the rejection; `golden/check-dma-pool` is the accept.\n\n**Scope of that check, exactly.** It walks the closure's *declaration* surface \u2014 const types, fn signatures, struct fields, **enum** variant payloads and methods/assoc fns, and every `init`/method/assoc fn of a struct or a generic instantiation, recursing through `Option`/`Result`/arrays/tuples/fn types/named-type arguments (`own_handles_in_closure`, unit-tested for the nesting). It does **not** walk bodies, and that is exact rather than a hedge: nothing in this language constructs an `own[P] T` \u2014 no literal, no cast, no intrinsic, no pool-allocation API (02-language.md \u00a74's `net_pool.get(capacity=...)` does not exist) \u2014 so every handle a body can hold arrived through one of the declarations walked here.\n\n**Unforgeability.** The same argument is the unforgeability claim, and it is a completeness claim about a closed surface rather than a check: the only origins of an `own[P] T` value are a parameter, a field, or a call's return, each of which is a declaration this check already sees. The image-side origin (05-library.md \u00a79's \"create the initial handles\") is a build-time `Value::ImageDecl`, and `layout::build_boot_init_calls` fails closed by name on one rather than passing the pool's construction index as if it were a handle (`hardware.dma.pool-backing`'s own closing note).\n\n**E3 closed the publish half of the third sentence.** `queue.publish` / `Receipt[P]` type-check and lower (`hardware.receipts.resolve-once`); touching the payload while the device owns it remains unrepresentable because the handle is consumed into the sealed `QueueOp` and never returned. Real DRAM descriptor stores and an executing payload still wait on E4 (no pool-backed `own[P] T` address yet). `values.resource.protocol-consumption` is flipped for capabilities, §9 states, and the queue/receipt surface (DmaPool/DmaShared scoped out — see that clause).\n\n**Item I's sweep (2026-07-24) / scaffolding dissolution Wave 0.** An **enum variant payload** used to escape `own_handles_in_closure` because `TypedProgram::enums` was names-only; a declaration-site ban (`validate_enum_own_handles`) refused the shape meanwhile. Enums now carry `variant_payload_types` (and methods/assoc_fns), so the walk covers them and `golden/err-dma-pool-own-in-enum` rejects at report time with the same pool-binding diagnostic as `golden/err-dma-pool-own-mismatch`. The stale declaration ban is deleted."

