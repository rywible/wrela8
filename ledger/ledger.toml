note = """plans/M12.md item F (decisions 886–889): `GROUP_MAX_CHILDREN` / `GROUP_SLOT_SIZE` are image facts — `max(FLOOR=2, max g.start children over the image's group sites)` and `64 + N*16` — generated into rtconfig (`GroupSlot` childN_* fields, `__wrela_child_store_result` ladder) and consumed by codegen/layout. Floor 2 preserved for empty-arena images. 02 §9.5's `capacity=4` example is runnable via `golden/boot-group-four-children` (four distinct callees, join_all, transcript pinned). Item A's gap closed here.

**Note-update (resource-by-read / Index-across-await, 2026-07-27).** 02 §9.3 resources in messages must move with `take`: call-site (`check_message_args`) and declaration (`validate_message_shape` via `message_param_ty_is_resource`, including `Option[own[…]]`). Goldens: `err-actor-msg-own-read`, `err-actor-msg-param-own-read`, `err-actor-msg-resource-read`, `err-actor-msg-send-own`, `err-actor-msg-option-own`. 02 §9.2 Index roots through `root_local_name` (`err-await-external-index`) — bare `input[0]` after await is refused like `input.value`.
"""

