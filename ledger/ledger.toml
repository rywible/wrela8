note = "plans/M5.md item D: `crates/wrela-compiler/src/layout.rs` (new; `lib.rs` gains one `pub mod layout;` line) places a `codegen::CodegenProgram` into `wrela-machine`'s fixed layout contract as one flat blob loaded at `IMAGE_BASE` — no ELF, no linker — realizing 04-compiler.md §8's own \"emit and link\" as \"emit into one blob, then verify section sizes against the report\" (the exact phrase this clause's own doc anchor names). Section order (fixed, `layout.rs`'s own module doc carries the full rationale): `entry` (the placeholder entry stub, see the entry/abort contract below), `code` (every codegen'd fn's own words, `CodegenProgram::fns`'s BTreeMap key order, 4-byte aligned — trivially true, every word is 4 bytes), `rodata` (the codegen rodata pool's own bytes, concatenated in order, 8-byte aligned at its own section base — ABSENT when empty, the no-placeholder rule: today this only happens for a program with no checked arithmetic/panic/assert at all, since every abort call interns its own message text here), `data` (mutable globals — ALWAYS absent at M5, since `lower.rs` folds every module `const` to a literal at its use site; nothing in this milestone's surface can ever populate it, a fact recorded rather than a feature silently missing), `abort` (the two abort-routine stubs, `__wrela_abort` then `__wrela_abort_val`, 4-byte aligned, always present). The report's own new `Layout` section additionally prints the two fixed machine regions below `IMAGE_BASE` as `pages`/`stacks` facts (`wrela_machine::layout`/`console` constants directly, decision 7's own \"(code/rodata/data/stacks/pages)\" enumeration) even though this module places nothing there itself — that address range is the VMM's own to fill, item E.\n\nRelocation resolution (the four `codegen::Reloc` variants, item C's own fixups): `Reloc::Call`/`Reloc::AbortFixed`/`Reloc::AbortVal` all resolve to a real `BL` (`encode::enc_bl`), range-checked against the imm26 encoder's own +/-128 MiB reach *before* encoding — a genuine `Err(LayoutError)`, never a debug-only assertion a release build could silently skip past. `Reloc::Rodata` decodes its own live register directly out of the placeholder `ADRP`'s low 5 bits (codegen's own placeholder carries nothing else non-zero there) and re-encodes a real `ADRP`+byte-offset `ADD` pair against the rodata section's own now-known absolute base, range-checked against the imm21 page-count range the identical way. `verify_section_sizes` is this clause's own named \"teeth\": a real, load-bearing re-derivation (not a restatement) that every section starts where the previous one's own end plus at most a few bytes of alignment padding says it should, and that the emitted blob's own total length matches the last section's own end exactly — any future bug in this module's own bookkeeping trips it, proven by three dedicated unit tests (`verify_section_sizes_accepts_a_contiguous_table`, `_rejects_a_wrong_blob_length`, `_rejects_overlap`, `_rejects_first_section_not_at_image_base`).\n\nEntry/abort contract (frozen in `layout.rs`'s own module doc, item E's exact obligation to consume): entry = `IMAGE_BASE` installs core 0's own initial stack pointer (`sp = core_stack_base(0) + CORE_STACK_SIZE`) then falls into a shared halt sequence (`push_halt`) — materialize a documented placeholder exit code, store it to `machine_info::OFF_EXIT_CODE` (plain, non-trapping — visible in a raw memory dump even before any trap fires), store the same value to `mmio::EXIT_MMIO_ADDR` (the real \"I'm done\" signal, a data-abort VMM exit since that address is never backed by RAM), then `BRK #0` defensively. `__wrela_abort`/`__wrela_abort_val` leave their own incoming ABI registers (`x0`/`x1`, or `x0..x5`) exactly where the caller's `BL` put them — no console exists yet, decision 12/item E's own job — and fall into the identical shared halt sequence with their own distinct documented exit codes. Item E is expected to REPLACE entry's body (install the real test-running runtime) and EXTEND (not replace) the abort stubs' bodies (print the message over the console ring before the existing exit-code-store-then-trap tail).\n\n12 unit tests total in `layout.rs`'s own `#[cfg(test)]` module: BL reloc math including a negative offset and an out-of-range rejection, ADRP page math on the same page and crossing a page backward, section packing with and without a nonempty rodata section, a `Reloc::Call` resolving to the callee's own placed base (byte-verified directly against the blob), an unresolved call target failing closed, the four section-size-verification cases above, and a two-fresh-builds determinism check. `wrela dump --stage=report`/`wrela build` both call the identical `layout::try_layout_program` (via `build_report`, `bin/wrela.rs`) — a program's own reachable surface either fully lowers+codegens+lays out (appending the `Layout` section to both, `wrela build` additionally writing `<name>.img`) or it does not (the M4-era report, unchanged, decision D's own \"all or nothing,\" never a silent per-fn skip). `golden/appliance`/`golden/image-project`/`golden/image-helper-accept` (the three of the four M4 report goldens whose reachable methods fully lower — `golden/image-basic` never reaches layout at all, its own registered `@layout_assert` failing the report closed before rendering starts) gained their `Layout` section in this same commit, cited; `golden/image-emit` (new, a minimal two-fn program — `compute` calling `add_one`, `Reloc::Call` — over ordinary checked `+`, `Reloc::AbortFixed`/`Reloc::Rodata` via the shared overflow-message intern) is the dedicated byte-level review surface decision 5's own \"pinned bytes\" philosophy asks for, since none of the three appliance-family goldens' own reachable methods happen to call each other or trip a checked-arithmetic abort: `expected/build.txt`/`expected/report.txt` (with its own `Layout` section) plus `expected/img.hex` — a 16-bytes-per-line offset+hex dump (decision: more reviewable than raw binary in git, the task's own instruction), extending `xtask`'s `golden` runner with a fourth expectation-file meaning (`img.hex`, alongside `test.txt`/`build.txt`/`build-err.txt`) that reads the `build.txt` stage's own already-written `*.img` back off disk rather than invoking `wrela` a second time — the build-output directory's own removal moved from immediately-after-`build`/`build-err` to once, at the end of each case's own expectation-file loop, specifically so `img.hex` can still see it."

