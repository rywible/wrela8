note = "plans/M4.md item D, decision 9: \"report determinism is an oracle from day one.\" `cargo xtask report-determinism` (new subcommand, wired into `cargo xtask check` immediately after `golden` — `crates/xtask/src/main.rs`) walks every golden case carrying a pinned `expected/report.txt` and calls `produce_report_text` (this command's own small, deliberately parallel copy of `bin/wrela.rs`'s `--stage=report` driver — that binary's own driver functions are not a library surface `xtask` can call into, so this is its own honest duplicate rather than a refactor across a binary/library boundary, `golden`'s own pinned expectations are the tripwire that would catch silent drift between the two) *twice* per case, entirely in-process — fresh `lex`/`parse`/`sema::check_typed`-or-`loader::load_closure`+`sema::check_program_typed`/`eval::interp::eval_image`/`eval::image_checks::check_sealed`/`report::render` every call, no caching, no shared state, no parallelism (the task's own \"keep it dumb\" instruction) — and byte-compares the two outputs, printing the first differing line on any mismatch. This is the M4 down-payment on 04-compiler.md §8's own \"identical declared inputs ... produce a byte-for-byte identical ... image and report\" (`compiler.repro.byte-identical`, which stays an explicit gap until the binary image itself exists at M5 — there is no linked artifact yet for that clause to cover); this clause instead proves the *report* half of that sentence, provable today. `report::render` itself is architecturally why this holds: no I/O, no wall clock, no random iteration order anywhere in `report.rs` (every collection walked is already a `BTreeMap` or a program-order `Vec`, `eval::image::ImageGraph`'s own construction discipline) — it is a pure function of its own arguments, and the digest (`report::sha256_hex`) is a pure function of bytes, so two fresh runs over identical declared inputs cannot disagree short of a real bug. Verified this session: `cargo xtask report-determinism` reports `4 case(s) reproduced byte-for-byte across two runs` (`golden/appliance`, `golden/image-basic` — including its own decision-10 failure-text report, proving the oracle is equally meaningful on a rejected report as an accepted one — `golden/image-project`, `golden/image-helper-accept`); `cargo xtask check` green with the new step wired in, right after `golden` and before `corpus`."

