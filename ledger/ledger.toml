[[clause]]
id = "sema.coverage.torture"
doc = "02-language.md#3"
status = "test"
tests = ["golden/check-torture-block-cache", "golden/check-torture-rate-limiter", "golden/check-torture-command-parser", "golden/check-torture-frame-ledger"]
note = "four large (140-175 line), coherent, sema-valid programs — the biggest the checker has faced (prior check-* goldens top out around 80 lines) — pinning the resolved-signature dump for cross-feature combinations no single small golden exercises together, and doubling as fuzz-mutation seeds (plans/M2.md item I) that enrich the sema fuzzer's corpus with realistic structure. check-torture-block-cache: a fixed-capacity DMA block cache with eviction — own[P] handles threaded through field take/restore cycles and take-self consuming methods, a generic struct (Slot[T, const N]) instantiated once as data (Slot[u64,2]) and once as a transitive resource (Slot[Handle,2]), private methods with inferred receiver effect. check-torture-rate-limiter: a token-bucket rate limiter driving a gate state machine — operator methods (add/subtract/less_than) on a user struct, a generic fn (earlier[T]) instantiated at two distinct struct types both explicitly and inferred, a Result-returning init, deriving(From) chained through two hops consumed by `?`, closures as scoped accessors (fn(mut TokenBucket) -> bool/unit params), exhaustive match with a guard and a `|` alternative over enum payloads, a resource (Ticket) moved through Result[Option[_], _]. check-torture-command-parser: a command parser over fixed byte arrays with validation results — named-field enum variants, a second Result-returning init and deriving(From) chain, exhaustive match with guard and multi-arm `|` (including a three-way alternative with no bindings), a resource (Reply) moved through a tuple (constructed and later destructured via a `take`-marked tuple pattern) and through Option, a generic fn instantiated over array element type at two different concrete types. check-torture-frame-ledger: a double-buffered frame ledger with resource handoff — own[P] handles again, the front/back double-buffer flip implemented as the textbook take-swap-take-restore over two resource fields, field take/restore split across match arms in one arm only, a resource-carrying enum variant (PresentOutcome.Delivered(FrameSlot), enum itself classified resource), a second generic struct (Cell[T, const N]) instantiated data and resource, defer-based cleanup. All four check clean via `wrela dump --stage=check` with no changes needed to any existing golden, compiler source, or xtask. Two checker-vs-doc disagreements were found and minimized while writing these (both routed around here, not silently accepted): (1) a struct method's own generic parameter (02-language.md §8.3's own `fn entry[R](mut self, ..., body: fn(mut Item) -> R) -> R` worked example) hits `error[unimplemented]: generic instantiation is not checked yet` — this one is already the documented scope boundary sema.generics.structural's note calls out (\"a method's own generic parameters ... are never instantiated\"), independently rediscovered here via the doc's own example; (2) unlike that documented case, using an already-constructed generic-struct value's concrete instantiation outside the generic's own re-checked body does not appear to substitute the type argument — `struct Slot[T, const N: usize]: items: [Option[T]; N]` then `slots = Slot[u64, 2]([None, None]); v = slots.items[0]` reports `error[type]: expected \\`Option[u64]\\`, found \\`Option[T]\\`` at the field access, and returning a fresh `Slot[u64, 2](...)` construction from a function declared to return `Slot[u64, 2]` reports `error[type]: expected \\`Slot[u64, 2]\\`, found \\`Slot\\`` — i.e. the construction expression's own synthesized type does not carry its instantiation args either. golden/check-generics never accesses a field or matches an expected type against an instantiated generic value (only binds the construction to an untyped local and discards it), so this call-site substitution path looks untested rather than deliberately scoped out; not fixed here per this session's remit (no compiler-source changes), so both torture programs bind generic-struct instantiations to untyped locals without further field/method use or expected-type matching, mirroring check-generics' existing pattern. Fixed in a later session (sema.generics.structural's own note; golden/check-generic-use) — the torture programs themselves are left unchanged (still binding to untyped locals) since regenerating them would touch goldens outside this fix's narrow scope, but the underlying gap they describe is closed."

