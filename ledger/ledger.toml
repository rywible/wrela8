note = "plans/M7.md item A, 03-hardware.md §1's first three sentences: the four capability types exist, no source construct produces one, and an `@actor` cannot hold one where a `@driver` can.\n\n**The types.** `DeviceCap[D]`, `Mmio[L]`, `IrqCap[V]`, `DmaPool[P, N]` resolve as ordinary type annotations (`sema::types::resolve_named`, arity from the one shared list `eval::image_checks::CAPABILITY_TYPES` — the same list `layout::build_boot_init_calls` and `sema::types::check_layouts` already read, extended with each name's arity rather than copied). Arguments resolve through the general `resolve_type_arg`, so `DmaPool[BlockControl, 256.KiB]`'s `N` stays an unevaluated const exactly as a user struct's own const argument does. They are **resources** by fiat (`classify_named`), which is 03 §1's own word — \"unforgeable resource values\" — and is load-bearing: a plain struct holding one is a resource by composition, which is what makes the containment walk see through a wrapper (`golden/check-capabilities`' own `RegsBundle resource` line). 03 §1's fifth bullet, \"target-specific narrow capabilities (queue notifiers, ...)\", is deliberately absent from the list: no normative rule names one yet, and a list entry with nothing behind it is worse than an absence.\n\n`Mmio[L]`'s own argument rule (03 §2, \"a typed register layout\") is checked: `L` must name an `@layout(mmio)` struct (`golden/err-cap-mmio-layout` uses an `@layout(wire)` type — exact bytes, emphatically not a register map). The other three arguments are left structural on purpose, each because the rule that would constrain it belongs to a later item: `DeviceCap[D]`'s device set is 06-machine.md §6's closed stdlib list, which does not exist (`img.device[D](...)` accepts any declared struct today, `golden/appliance`'s own `BlockHw`); `IrqCap[V]`'s vector is bound from the image graph by item G; `DmaPool[P, N]`'s pool identity is item D.\n\n**Unforgeable, and how the list of routes is known to be complete.** The claim is not \"these six spellings are rejected\" but the stronger, mechanical one: *the only declaration positions a capability-typed value can originate from are a `@driver`'s own fields and a fn's own parameters.* A typed expression's type comes from exactly one of (a) a literal — never a named type; (b) a declared annotation read back (field, parameter, local, `const`); (c) a callee's declared return type; (d) a builtin intrinsic's fixed result type — `sema::bodies`' intrinsic table has no capability in it; (e) a composition of those, which introduces no new named type. So closing (b) for `const`s and (c) for every fn, plus the routes that would manufacture a value with no annotation at all, leaves exactly fields and parameters. Locals need no arm of their own: a local's type is its initializer's, by induction on the same list.\n\nEvery route, and its rejection: a struct-literal construction `DeviceCap[Blk](...)` (`golden/err-cap-construct` — before this item it reported `error[unimplemented]: generic instantiation is not checked yet`, a fail-closed rejection naming the wrong cause); a bare call `Mmio(0x1000)` (`golden/err-cap-call`, previously the true-but-silent \"`Mmio` is not callable\"); a conversion `addr.to[Mmio[L]]()`, which is this language's *only* cast — 02-language.md §6.1 has no cast operator — and therefore exactly the address-to-capability cast §1 names (`golden/err-cap-cast`); a module declaration under the name, the subtlest route and the one that genuinely worked before this item, since every *other* prelude name in this language may be shadowed harmlessly by a declaration but a `struct DmaPool` would hand an author a real constructible value (`golden/err-cap-declared`, `symbols::collect`); an import binding one — checked on the *local* name, because the alias is the whole point (`from regs import RawRegs as Mmio`) and the exporting module could never have declared the name itself (`golden/err-cap-import`, `imports::resolve_imports`); a signature claiming to return one, at any nesting (`golden/err-cap-return`); and a `const` declared as one, since no comptime evaluation produces a capability (`golden/err-cap-const`). The arity and argument-kind guards with no source-shaped story of their own are the `capability_shape_guards` unit table in `sema::types`, and the completeness argument above is itself a table — `no_source_construct_produces_a_capability`, eight cases, one per route.\n\n**The return-type arm is deliberately wider than any sentence §1 spells out**, and this is the one place to look when a later item starts failing: *no* fn may declare a capability return type, not merely a driver's `pub` one. Nothing in the source language produces a capability, so a signature claiming to return one is either unimplementable or laundering one it received. Item C (partitioning an `Mmio[L]` out of a claim) and item D (sub-allocating a pool) are the first real minting operations, and this arm is what has to learn about them.\n\n**Containment, and the asymmetry that makes it a rule.** `sema::types::validate_capability_types` runs in `declare`, immediately after `validate_actor_handles`, over the same ast-alongside-`DeclItem` zip, with the same cycle-guarded \"at any nesting\" recursion through arrays/tuples/`Option`/`Result`/`own`/`fn`-types and through a named struct's own declared fields — plans/M7.md decision 3's \"extend that pass; do not build a second mechanism\", followed literally. An `@actor` may hold a capability in no field (`golden/err-cap-actor-field`, which hides it two composites deep inside an array of a plain wrapper struct, so the walk rather than a shallow type equality is what rejects it) and in no parameter of any member, `pub` or private (`golden/err-cap-actor-param`). A `@driver` **may** hold them — 03 §1's own worked example declares `irq_regs: Mmio[VirtioIrqMmio]` — and `golden/check-capabilities` pins that acceptance alongside the rejections, so the containment rule cannot be satisfied by banning capabilities everywhere (also asserted directly, both directions in one test, by `a_driver_may_hold_a_capability_and_an_actor_may_not`). Neither may *export* one: a `pub` method of either is a message shape (02-language.md §9.4), so a capability in its parameters (`golden/err-cap-driver-message`) or its return (`golden/err-cap-driver-export`) is exactly \"a driver may export safe actor APIs but never raw capabilities\".\n\n**`init` is not exempt here, unlike the `Actor[T]` rule it extends.** An `init`'s parameters are image wiring rather than a message, which is precisely what makes a *driver*'s `init` the one legitimate way a capability enters a program (03 §1's own constructor signature). For an `@actor` the same reasoning inverts, and the arm is not decorative: `eval::image_checks`' init-argument substitution (plans/M4.md decision 7) accepts an unwired capability parameter for `img.actor(...)` exactly as it does for `img.driver(...)`, recognized by type name with no actor/driver distinction — so before this item an `@actor` could declare `init(mut self, take cap: DeviceCap[D])` and the image checker would call it satisfied \"by the declaration's own device wiring\" (`golden/err-cap-actor-init`).\n\n**Not claimed, each named rather than implied.** (a) *Captures.* §1's sentence lists \"fields, parameters, messages, or captures\"; with fields and parameters both closed there is no expression of capability type an actor body can name at all, so no capture can exist — the arm would be dead code and is deliberately absent rather than written and untested. The moment an actor can name a capability, `validate_capability_types` is where it goes. (b) *A capability field can be declared but not initialized.* A field must be fully initialized by any `init` its struct declares (02-language.md §3) and item A produces no capability *value*, so a `@driver` holding `Mmio[L]` can have no `init` yet — `golden/check-capabilities` splits §1's single worked example across two drivers for exactly this reason, in the fixture rather than by omission. (c) *A plain (non-actor, non-driver) struct may hold one.* §1 restricts `@actor`, not every struct, and this follows the doc: whether a fn reading such a field is legitimate is a provenance question, not a containment one. (d) Nothing here reads or writes a register, owns memory, or binds a vector — items C, D and G.\n\n**Note-update (same item, third commit — the mint at image binding).** §1's remaining sentence: capabilities are \"minted while the image binds a declared device to a `@driver` ... The device itself is named once, at the image binding (`img.driver(BlkDriver, device=blk_device)`), the single source of truth.\"\n\n**Which half shipped, exactly: the typed one, and that is all.** `eval::image_checks::check_capability_substitution` decides whether a declared capability `init` parameter has a real minting source in this image. It produces no runtime value, because there is nothing yet to produce one — `layout::build_boot_init_calls` walks `graph.actors` only, so a driver's `init` is never called at boot at all (M6-D's floor, untouched by this item). The parameter's provenance is checked; its bytes are items D and E.\n\nWhat this replaces is not nothing: plans/M4.md decision 7's substitution rule recognized a capability parameter *by type name* and called it \"satisfied by the declaration's own device wiring\" whether or not any wiring existed, with no actor/driver distinction. Its own unit test asserted exactly that acceptance and is replaced, not deleted, by a table asserting the real rule. Now: `DeviceCap[D]` is minted by this declaration's `device=` argument, and `D` must be the bound device's own declared type (`golden/check-cap-mint` is the accept — a real `wrela build`-able image whose report already carries the binding as `Edge from=driver#0 to=device#0`, so the mint has evidence in the artifact and not only in a diagnostic; `golden/err-cap-mint-no-device` removes the binding, `golden/err-cap-mint-device-mismatch` points it at a different device type). `Mmio[L]`, `IrqCap[V]` and `DmaPool[P, N]` each fail closed naming the item that mints them — C (a claim to partition), G (a vector bound from the image graph), D (a real pool) — `golden/err-cap-mint-unminted`. An `img.actor(...)` declaration mints nothing at all: it binds no device, and its reserved labels do not include `device=`, so a capability parameter there has no possible source; sema already rejects an `@actor` *declaring* one, and this arm covers the shape sema cannot see — an `img.actor(...)` naming a struct that is not an `@actor`. One binding mints at most one `DeviceCap` (§1: authority over *one* device instance), a fail-closed floor rather than minting the same authority twice. The two arms no `@image` fn can currently spell — a second `DeviceCap`, and a `device=` that is not a declared device — are unit tests in `eval::image_checks` rather than goldens, for the same reason the construction-DAG cycle case already is.\n\n**plans/M7.md item D audit note** (item D ran the same self-audit items A and B each ran, over the arms item A left it). Two findings, both real, both fixed in item D's own commit rather than reported and left. (1) The `DmaPool[P, N]` arm of `check_capability_substitution` \u2014 the one item A named as \"that is plans/M7.md item D\" \u2014 was **unreachable from source**, not merely untested by a golden: `DmaPool`'s first generic argument is a *pool name* (03-hardware.md \u00a71's own `DmaPool[BlockControl, 256.KiB]`), and `sema::types::resolve_named` resolved every capability argument as a type, so `DmaPool[BlockControl, ...]` failed at `error[type]: unknown type` long before any mint check ran. `golden/err-cap-mint-unminted` reaches the arm with an `Mmio[L]`, which is why nothing caught it. Item D added `TypeArg::Pool` and the position-0 resolution, which is what made the arm reachable at all \u2014 and then replaced it with the real mint (`hardware.dma.pool-backing`, `image.graph.dma-pools`). (2) `sema::types` carried its **own second copy** of the capability name list (a private `const CAPABILITY_TYPES: &[&str]`, read by `check_layouts`) alongside the shared one this clause's note calls \"one list, in one place ... several copies could disagree; one cannot\". They had not yet disagreed; they would have the moment `DmaShared` landed, since only one of them would have gained it. `check_layouts` consults `is_capability_type_name` now, and the duplicate is deleted.\n\n**Audit method** (recorded so the next item can repeat it): for every arm this clause's note claims, write the source that should reach it and run the real compiler on it \u2014 not read the code for whether the arm exists. Both findings above are invisible to code reading (each arm is present, correct, and unit-tested) and immediate under execution. `DmaShared[P, L]` inherits every arm of this clause with no new code (`hardware.dma.shared-control`), and the arms were re-run against it the same way.\n\n**Item I's sweep (2026-07-24) — \"at any nesting\" was false, and this note said it twice.** Every arm above rests on `type_contains_capability`'s walk through \"a named type's own declared components\". That walk consulted a `BTreeMap<String, &DeclStruct>`, so `structs.get(name)` returned `None` for **every enum**, and the recursion stopped dead at an enum variant payload. `enum Holder: Armed(DeviceCap[D])` therefore laundered a capability past three separate arms of this clause at once: an `@actor` could hold one in a field (`golden/err-cap-actor-enum-field`), an ordinary fn could declare one as its return type — §1's unforgeability floor (`golden/err-cap-enum-return`), and a `@driver`'s `pub` method could export one as a reply (`golden/err-cap-enum-driver-export`). All three compiled clean before this sweep. The same one-word hole disabled `hardware.capabilities.provenance`, `hardware.mmio.no-alias` and `actors.messages.value-restrictions` — see each. Fix: `sema::types::components_by_name`, one table over structs *and* enums (`DeclEnum::component_types` is exactly the variant payloads), read by all three walks in that file. Deliberately a second map alongside the struct one, which still answers the genuinely struct-shaped questions (`is_actor`, `layout_kind`) an enum has no answer to. **No existing golden moved** — the fix is purely additive in behavior."

