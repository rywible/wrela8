[[clause]]
id = "sema.unimplemented.fail-closed"
doc = "02-language.md#2"
status = "test"
tests = ["golden/err-unimplemented-import", "golden/err-unimplemented-await", "golden/err-generic-const-arg", "golden/err-unimplemented-bodyless"]
note = "the shared `error[unimplemented]: <subject> not checked yet at L:C` helper (plans/M2.md decision 7); item A's only user is `from ... import ...` (sema.names.imports); item C adds `await`/`send`/`with`/f-strings/`comptime if`/`comptime assert`/`@image` bodies/`checked_to`/`truncate_to` in bodies.rs (golden/err-unimplemented-await pins `await`); item H narrows \"generic instantiation\" from a blanket fail-closed subject to the specific residual gaps it still owns — a generic *method*'s own type/const parameters (never instantiated), a nested/deep generic-argument shape at a call site, and a non-literal const generic argument (golden/err-generic-const-arg: `Ring[u64, 4 + 4](...)`, decision 4 — arithmetic/calls are not evaluated); later items reuse the same helper for their own fail-closed constructs"

[[clause]]
id = "sema.types.bodies"
doc = "02-language.md#8"
status = "test"
tests = ["golden/check-bodies", "golden/err-type-mismatch", "golden/err-type-cond", "golden/err-type-question", "golden/err-type-resource-eq"]
note = "the body-typing pass (plans/M2.md item C, sema/bodies.rs): assignment introduction/reassignment (same type — `error[type]: expected \\`T\\`, found \\`U\\` at L:C`), unconstrained-literal defaulting (`i64` unless only `u64` fits, `f64`) with range-checking against an expected scalar type (including the combined-sign reading of a negated literal), `if`/`elif`/`while`/`assert` conditions typed as `bool`, `for` over ranges (equal integer endpoint types, a bare literal endpoint deferring to its concrete sibling) and fixed arrays (`take`-consuming form types the same as the lending form — move legality is items E/F), `return` checked against the declared return type (unit fns may fall off the end; exhaustive-return checking is item G's — not checked here), `assert`'s message required to be a text literal, struct/enum construction (named-field literal with defaults, positional one-field shorthand, `init`-bearing types, `Enum.Variant`/leading-dot construction, both fed by the same `types::declare` signatures), field access and calls (arity/label checking shared by fn/method/init/struct-literal/variant construction), closures typed structurally from their call-site's expected `fn` type only (never storable — assigning one to a local is `error[type]`), `?` on `Result`/`Option` with the one-hop `from` conversion (user-written or `deriving(From)`-generated), `match`/`is` pattern typing against the scrutinee (exhaustiveness is item G's), and the fail-closed set beyond imports (`await`, `send`, `with`, f-strings, `comptime if`/`comptime assert`, `@image` bodies, `checked_to`/`truncate_to` — sema.unimplemented.fail-closed). A generic declaration's own body (struct, enum has none, fn/method) is skipped here, not type-checked directly — item H (sema.generics.structural) checks it concretely, once per unique instantiation, by substituting a copy of the declaration and re-running this same pass over it; `Type`'s derived `PartialEq` compares the unevaluated length `Expr` array/`Bytes` embed span-and-all, so bodies.rs uses its own span-insensitive `types_eq` throughout instead (comparing a literal length by value, a bare name by name) — pinned by every array-parameter case in golden/check-bodies rather than a dedicated golden, since without it almost any array-typed call would spuriously mismatch"

[[clause]]
id = "sema.types.calls"
doc = "02-language.md#5.1"
status = "test"
tests = ["golden/check-bodies", "golden/check-operators", "golden/err-type-arity", "golden/err-type-label"]
note = "call checking (plans/M2.md item C): arity, each argument bound at most once — by label (looked up against the callee's parameter names) or positionally (the next not-yet-bound parameter) — a parameter with a default may be omitted, argument types checked against parameter types; access-mode markers on arguments are parsed but not validated (mirroring call-site markers against signatures is item D). Operator desugar (02-language.md §7.4, 05-library.md §8): builtin scalar `+ - * / %`, wrapping `+% -% *%`, shifts, bitwise, and comparisons never desugar (same-type operands; wrapping/shifts/bitwise integers only); a user (`Named`) type's `+ - * / %` and `<` resolve to the matching method, shape-checked (`read self`, one same-type param, `<`'s method must return `bool`); structural `==`/`!=` are generated for every data type — comparing a resource-classified type is `error[type]` (golden/err-type-resource-eq). Named functions and no-receiver associated functions are typed as `fn(...)` values so they can be passed where a matching function type is expected."

[[clause]]
id = "sema.no-panics"
doc = "02-language.md#2"
status = "test"
tests = ["xtask:fuzz"]
note = "cargo xtask fuzz sema (plans/M2.md item I): the parser fuzzer's two strategies — mutation of every doc/example corpus entry and every tests/golden/*/input.wr (via the shared corpus_seed_inputs/mutate_seed_input, which already includes the sema-valid check-* goldens as seeds) plus token-soup — run through lex -> parser::parse -> sema::check. Invariants every iteration under catch_unwind: sema never panics; the outcome is a successful dump or exactly one SemaError whose category is one of the fixed set (name, type, access, move, init, overlap, match, generic, unimplemented); the whole pipeline is deterministic across two runs on the same input (identical dump, or identical error stage/category/message/line/col); on success, sema::dump is itself panic-free and byte-identical across two separate calls. Deep default 2_000_000 iterations (measured ~38-39us/iteration on the authoring machine — 500_000 iters in ~19.4s, 2_000_000 in ~78s — so the deep run lands at roughly a minute and a quarter, the plan's 'minute or two' target); a clean run at that budget (seed=1, 2_000_000 iterations, zero finds) is checked into this commit's history. Smoke budget (seeds 1/2, 1_000 iterations each, well under a second) wired into xtask check after the parser smoke. Every pass the pipeline currently runs (collect/resolve/declare/bodies as of this item; access/flow/matches/generics as sibling items land) is exercised as-is — the invariants are pass-agnostic and hold regardless of which passes exist yet."

[[clause]]
id = "sema.match.exhaustive"
doc = "02-language.md#7.2"
status = "test"
tests = ["golden/check-match", "golden/err-match-nonexhaustive", "golden/err-match-redundant-wildcard", "golden/err-match-or-bindings"]
note = "match exhaustiveness (plans/M2.md item G, sema/matches.rs): a whole-module re-walk (after bodies.rs) that finds every `match` statement and `is` expression and re-derives each scrutinee's type via `bodies::check_expr` (widened to `pub(crate)`, the one function bodies.rs uses to synthesize an expression's type in a local context — real reuse of its typing machinery, not a reimplementation; `bodies::check_pattern`/`ModuleCtx`/`FnCtx`/`types_eq`/`decl_variant_payload_types`/`literal_array_len` are widened the same way). Exhaustiveness is a plain recursive usefulness check over a `Vec<RPat>` pattern matrix (decision 4: no unification, no Maranget-style optimization beyond what correctness needs), compositional over closed enums (`Option`/`Result` included, as ordinary two-variant sums), `bool`, `unit`, tuples, and fixed arrays with literal lengths (component-wise); integers, `char`, strings, `Static`/`Bytes`, non-literal-length arrays, and anything else this pass does not enumerate constructors for require an explicit wildcard/binding arm. A non-exhaustive `match` is `error[match]: match is not exhaustive: missing <witness> at L:C`, the witness the first uncovered pattern in declaration order (`.Absent`, `(.None, _)`, ...); an arm (including a wildcard) matched by no value not already covered by earlier arms is `error[match]: unreachable arm at L:C`; a guarded arm is never checked for its own uselessness and never contributes to coverage. `|` alternatives must bind the same names at the same types (`error[match]`) at every nesting depth, checked independently of any guard. `is` demands no exhaustiveness but its own uselessness check applies to a top-level `|`'s alternatives (2-language.md §7.2: refutable by design; a pattern that can never match its scrutinee type is already a bodies.rs type error, not double-reported here). One documented gap: a closure's body is only re-walked (for a nested `match`/`is`) when every parameter carries an explicit type annotation (its type then comes straight from `mctx.resolve_type`, still real reuse) — deriving an unannotated closure parameter's type needs the call-site expected-type context bodies.rs's call-checking machinery owns, which this pass does not duplicate; such a closure is left unwalked (not an error — bodies.rs already checked it — just unchecked for this pass, like a generic body is)."

[[clause]]
id = "sema.access.call-mirroring"
doc = "02-language.md#5.1"
status = "test"
tests = ["golden/check-access", "golden/err-access-missing-mut", "golden/err-access-extra-take", "golden/err-access-wrong-marker", "golden/err-access-nonplace"]
note = "the access pass (plans/M2.md item D, sema/access.rs), run after bodies.rs on an already-type-checked module: every non-receiver call argument's marker is mirrored against its bound parameter's declared mode — a `read` parameter takes an unmarked argument, a `mut`/`take` parameter requires the matching marker exactly; a missing, extra, or wrong marker is `error[access]: parameter \\`name\\` requires/takes ..., found ... at L:C` (or `this argument ...` for a positional call through a raw `fn(...)`-typed value/closure parameter). The receiver is the one exception (`cache.clear()` needs no second marker) — it is checked separately (sema.access.receiver-inference). A `mut`/`take` operand must be a full place expression — a name, or a field/index chain rooted in one, checked recursively (`is_full_place`): the parser's own `is_place_expr` only looks at the outermost node, so an outer `Field`/`Index` whose *base* is not itself a place (`f().field`, `take (f().field)`) slips past it and is caught here instead (golden/err-access-nonplace). The same `take` rule applies wherever `take` appears, not just inside a call argument (an assignment source, a `return`, a tuple/array element, ...), since 02-language.md §3 lists an argument, an assignment source, a literal operand, and a pattern payload as one rule. A struct literal's fields and an enum variant's payload carry no declared parameter mode (`DeclField`/`DeclVariantPayload` have none) so they are never mirrored, only place-checked."

[[clause]]
id = "sema.access.receiver-inference"
doc = "02-language.md#5.1"
status = "test"
tests = ["golden/check-access", "golden/err-access-pub-receiver"]
note = "every `pub` method must spell its receiver effect (02-language.md §5.1); the AST cannot distinguish a plain `self` from an explicit `read self` (types.rs's `DeclReceiver` doc comment), so the rule is checked the only honest way available: a `pub` method whose receiver mode is the ambiguous `read` is `error[access]: pub method \\`name\\` needs an explicit \\`mut self\\`/\\`take self\\` receiver at L:C` exactly when its body's inferred requirement exceeds `read` (golden/err-access-pub-receiver); a `pub` method that already spells `mut self`/`take self` is never second-guessed. A private plain-`self` method gets the least effect inferred instead, shown in the check dump (`fn peek(read self) -> u64`, not bare `self`, once inference actually ran): a whole-module fixpoint starting every candidate at `read`, escalating to `mut` (a field of `self` assigned; `self` or a field of `self` passed as a `mut` argument; a field of `self` taken — restorable per 02-language.md §3.2, so needing `mut` access, not full ownership; a `mut self`/`take self` method called directly on `self`) or `take` (`self` itself, whole, taken; a `take self` method called directly on `self`). Inside a body, a `read` binding (a parameter, or `self` under its effective mode) is a loan: it can never be assigned, have a field assigned, or be passed onward as `mut`/`take` (`error[access]`, mode-local — no CFG, full flow analysis is items E/F). Calling through a receiver checks the receiver expression's own binding: a `mut self` method needs a mutable place (not a `read` binding), a `take self` method needs an owned place (not a `read` or `mut` binding) — `error[access]` naming what was found instead. A private method that needs more than a direct `self.method()`/`self.field = ...` pattern to reach its true requirement (e.g. escalating through a nested `self.field.mutate()` call) is not chased further by inference; such a method must spell its receiver explicitly, exactly like a `pub` method would — the receiver-mutability check above still enforces it correctly either way, so this is a documented scope limit, not a soundness gap."

[[clause]]
id = "sema.init.definite"
doc = "02-language.md#3.2"
status = "test"
tests = ["golden/check-flow", "golden/err-init-unassigned", "golden/err-init-merge", "golden/err-init-field-restore", "golden/err-init-missing-return"]
note = "the flow pass's definite-initialization half (plans/M2.md items E/F, sema/flow.rs): a per-body structural CFG walk (no explicit graph — `walk_block` is a direct interpreter over the structured, loop-free-except-`for`/`while` AST) tracks each storage path's state (`Uninit`/`Init`/`Moved`, paths.rs) on every edge; `if`/`match` clone the entering state once per branch/arm and *meet* the results back together, so a name is initialized after the join only when every non-diverging branch initialized it (`return`/`break`/`continue` drop out of the merge) — golden/err-init-merge: initialized in one `if` arm only, then read, is `error[init]: \\`value\\` is not initialized here at L:C`. `for`/`while` re-run their own body from a candidate entry state that starts at the pre-loop state and is replaced, each real (error-raising) pass, by the meet of the loop's own back edges (fallthrough plus every `continue`), until it stops changing or a small fixed cap is hit — golden/err-init-unassigned: a local assigned only inside a `while` that may run zero times is still `Uninit` after it. Reading an unassigned local, or a `self`/parameter root used whole while one of its own fields is still `Moved`/`Uninit`, is `error[init]`; a `mut`-mode root's not-yet-restored field is checked again at every function-level exit (`return`, or the implicit end of a `unit`-returning body) — golden/err-init-field-restore. `init` (02-language.md §7.1) seeds each declared field of `self` as its own `Uninit` local rather than seeding `self`'s own root at all, so \"self used whole\" naturally falls back to this pass's ordinary default until every field is assigned; an `init`'s own `return Err(...)` is recognized syntactically as tearing down whatever was initialized so far (§7.1's own words) and carries no field-completeness obligation of its own. A value-returning body (`fn`/method/`init`) that can still fall off the end is `error[init]: missing return of type \\`T\\` on some path at L:C` (golden/err-init-missing-return) — deliberately conservative for loops (a `for`/`while` never counts as guaranteeing a return, even one that syntactically always does, so a function relying on an infinite loop's own `return` to be total is rejected here; not exercised by any golden in this corpus). `match`'s own arm set is assumed exhaustive for merging purposes without re-deriving exhaustiveness (matches.rs, sema.match.exhaustive, runs after flow in the frozen pass order) — a genuinely non-exhaustive match is still rejected, just by that later pass's own diagnostic, so this is never an acceptance gap. `defer`'s own per-exit re-validation (02-language.md §10) is values.teardown.defer-valid-at-exit's own clause, not this one — this note previously flagged it as validated once, at registration, only; that gap is now closed there."

[[clause]]
id = "sema.generics.structural"
doc = "02-language.md#6.3, 02-language.md#7.3"
status = "test"
tests = ["golden/check-generics", "golden/check-generic-use", "golden/err-generic-missing-method", "golden/err-generic-const-arg", "golden/err-generic-uninferable"]
note = "structural generic instantiation (plans/M2.md item H, sema/generics.rs): typing a `Generic[Args]` use (a call, a construction, a field/method/variant lookup through an already-typed value) resolves its concrete arguments and enqueues the instantiation into a module-wide worklist (`bodies::ModuleCtx::generics_queue`, keyed by a canonical `\"<kind>:<name>[<args>]\"` string — decision 1's `BTreeSet`, realized as a `BTreeMap` so `Type`/`Expr` never need an `Ord` of their own); `mod.rs::check` drains it to a fixed point after bodies/access/matches, substituting a copy of the declaration (`Type::Generic` -> the concrete argument, throughout fields/params/return/array-and-`Bytes` lengths) and re-running those same three passes over it (each widened `pub(crate)` for exactly this reuse — no restructuring), including data-vs-resource reclassification with the concrete argument types (golden/check-generics: `Ring[DmaBlock, 2]` is a resource though `Ring[T, const N]` itself, un-instantiated, is not). A generic `fn` called without explicit `[Args]` infers its type arguments the dumbest honest way (item 2): a type parameter used directly as a parameter's own type is inferred from that argument's synthesized type; anything else (a const parameter, a parameter never naming a bare type parameter directly, or two inferred occurrences that disagree) is `error[generic]: ... requires explicit \\`[Args]\\`: ...` naming the parameter (golden/err-generic-uninferable). A missing requirement discovered inside an instantiation's substituted body reports the one pinned multi-line exception (decision 2, 02-language.md §7.3 verbatim): `` error[generic]: `Name[Args]` requires `Type.method(read self) -> R` `` with no ` at L:C` suffix, then two-space-indented `` required by `expr` at file:line `` (the original, unsubstituted declaration's own call site) and one `instantiated at file:line` per chain level, innermost first (golden/err-generic-missing-method pins the exact format against 02 §7.3's own `hash_pair[Sector]` example); any other failure inside an instantiated body keeps its ordinary one-line message with the same `instantiated at` chain appended. Const generic arguments (decision 4, 02-language.md §6.3) evaluate only as a literal, a `const` name (recursively), or a fieldless-enum variant path — anything else (arithmetic, a call) is `error[unimplemented]` (sema.unimplemented.fail-closed, golden/err-generic-const-arg). A fixed instantiation-chain depth cap (64) rejects runaway/cyclic recursion as `error[generic]: instantiation depth exceeded ...`. Documented scope boundary, not silently approximated: a *method*'s own generic parameters (beyond its struct's, if any) are never instantiated — such a call fails closed via the existing `unimplemented_at` helper, exactly as it did before this item; the requirement-chain diagnostic itself is only derived for a top-level generic `fn` whose body returns, directly or through one builtin same-type-result binary operator, a zero-argument method call on a bare type parameter (02 §7.3's own example shape) — anything deeper falls back to the ordinary-message-plus-chain case rather than fabricating a signature. Pre-M3 finding (plans/pre-M3-findings.md, sema.coverage.torture's own note) fixed: call-site substitution is now real. `bodies::check_struct_construction`'s synthesized type carries the instantiation's own resolved args (`Type::Named(\"Slot\", [u64, 2])`, not a bare `Type::Named(\"Slot\", [])`) instead of dropping them, so a construction's result type-checks against an expected instantiated type (golden/check-generic-use's `construction_expected_type`) and, since field/method lookup through a `Type::Named(name, args)` with non-empty `args` already substituted via `generics::instantiate_struct` before this fix (only the construction's own result type was wrong), a field reached through an instantiated value now resolves to its substituted type end-to-end (golden/check-generic-use's `field_through_instance`) and a method called on one still enqueues the concrete instantiation for whole-declaration checking, unchanged (golden/check-generic-use's `method_through_instance`). `types_eq` already compared two `Type::Named`s' args structurally (including a `const` arg via the existing span-insensitive `same_len_expr`), so no change was needed there. `access.rs`'s own best-effort type tracker had the identical construction-result gap (its own `check_struct_construction`) plus a stricter one: `check_field` refused to even attempt a field's type through a `Type::Named` with non-empty args at all, which — once a value's tracked type legitimately carries real args — made a chained method call through that field wrongly fail closed (`error[unimplemented]: mirroring a method call through this base expression is not checked yet`); fixed the same way, reusing `generics::subst_field_type` (already `pub(crate)` for `flow.rs`'s own reuse) instead of duplicating substitution logic a third time."

