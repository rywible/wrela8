note = "the compiler-recognized builder surface (plans/M4.md item B: `Image(name, target)`, `img.device[D]`, `img.driver`, `img.actor`, `img.pool[T]`, `img.dma_pool[T]`, `img.on_failure`, `img.check_layout`, `decl.handle()`, `img.seal()`) — opened at item B launch; flips when intrinsic evaluation lands with goldens. Opened one commit early to carry a doc reconciliation made at orchestration time (2026-07-23): 05 §9 spelled sealing `seal(take builder)` while 02 §12.1's own example and the worked example (virtio-storage.wr:639) both spell it `img.seal()` — an internal doc contradiction predating this milestone's execution. Tiebreak per the standing rule (prefer the reading consistent with existing pinned artifacts): the method form wins two sources to one, including the only executable-shaped witness (the corpus-tested worked example), so 05 §9's one line moved to `img.seal()` consuming the builder receiver; nothing else in either doc changed. plans/REVIEW-QUEUE.md carries the audit line.\n\nM4-B update (flips to `test`): every intrinsic 05 §9 names is recognized by callee spelling (`sema::bodies`'s new arms in `check_call_by_name`/`check_call_by_field`/`check_call_index`, exactly like the existing `Some`/`Ok`/`Err`/`panic` prelude machinery — no traits, no registry) and produces one dedicated typed node, `sema::typed::TypedExprKind::Intrinsic{key, receiver, type_arg, args}` — no declared parameter list exists for any of these to align positionally against, so every argument keeps its own source label; `img.pool`/`img.dma_pool`'s own `name=` argument is the one that is not an ordinary value expression (a bound `pool` name, otherwise only ever spelled inside `own[P] T`) and gets its own `PoolName` leaf instead. Evaluating the one reachable `@image` fn (`eval::interp::eval_image`, a new top-level entry point mirroring `eval_test`) builds one plain `eval::image::ImageGraph` — BTreeMaps keyed by the bound pool name (`pools`/`dma_pools`, the one declaration kind 05 §9 itself names by an identifier) plus construction-order `Vec`s for everything else (`devices`/`drivers`/`actors`/`supervisions`/`layout_asserts`), every argument a fully evaluated `Value` (`eval::value::Value::ImageDecl` is the new variant a declaration's own handle takes, `eval::image::ImageDeclRef` naming which one) alongside its own static `Type` (needed only so the dump can render an enum construction or list by name). `img.dma_pool` records its own entry into `ImageGraph::dma_pools` and then always fails closed naming the hardware milestone and gap `image.graph.dma-pools` (decision 10) — `golden/err-image-dma-pool` pinned both halves (the recorded-then-failed ordering was also unit-tested directly in `eval/image.rs`) \u2014 both retired at plans/M7.md item D, which made `img.dma_pool` real; `golden/check-dma-pool` is this clause's evidence that the intrinsic is recognized and evaluated now, and `image.graph.dma-pools` carries the change in full. `img.check_layout` registers a `@layout_assert` fn's own callee spelling into `layout_asserts` and runs nothing (decision 10's other half) — `golden/image-basic` exercises it. `wrela dump --stage=image` (`bin/wrela.rs`'s new `run_image_stage`, forking single-module/whole-closure exactly like `--stage=check` already does) prints the graph in the M1 dump style — `ImageGraph v0` header, `Kind key=value` lines, two-space indent, deterministic order throughout, no placeholder sections. `golden/image-basic` (single-module: a device, a driver, an actor, a pool, `check_layout`, `supervise`, `seal`, every declaration cross-referencing an earlier one by its own `eval::image::ImageDeclRef` rendering, e.g. `Arg label=device value=device#0`) and `golden/image-project` (the identical shape as a project — the `@image` module importing an actor struct from another module, `img.actor(Store, ...)` resolving `Store` through `mctx.structs` directly rather than the ordinary type-annotation resolver, since only the former is spliced from an import — plans/M4.md item A's own disclosed scope line, exercised here in the direction it explicitly permits: value/callee position) both pin `--stage=image`'s exact byte-for-byte output; `golden/image-basic` additionally pins `--stage=typed`, showing every `Intrinsic`/`PoolName` node's own dump grammar. `cargo xtask check` green confirms none of the 150 pre-existing goldens moved."

