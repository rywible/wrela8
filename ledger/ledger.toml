id = "hardware.capabilities.runtime-word"
doc = "03-hardware.md#1"
status = "test"
tests = ["golden/check-cap-mint", "golden/check-dma-shared", "golden/appliance", "golden/err-cap-mint-unminted", "golden/err-device-two-drivers"]
note = "03-hardware.md \u00a71: capabilities are \"unforgeable resource values minted while the image binds a declared device to a `@driver`\". plans/M7.md item H1 answers the question every earlier item deferred \u2014 **what a capability is at runtime** \u2014 and gives one bytes at boot for the first time.\n\n**Decision 11: a capability is one 64-bit word holding a guest base address.** `DeviceCap[D]` is the base of device `D`'s own declared register window; `Mmio[L]` is that same base, with each register's `@offset` supplied by the declaration; `DmaPool[P, N]` is the base of pool `P`'s backing in `pooldata`; every 03 \u00a79 bring-up state is the state's own device base. `mwir::size_of` and `codegen::is_aggregate` carry it through the builtin-pseudo-type vehicle `Actor[T]` already sits in \u2014 8 bytes, `is_aggregate` false, passed by value in a register.\n\n*Rejected: an opaque build-time index with the address in a side table* (`Actor[T]`'s own representation). An index buys dynamism nothing needs \u2014 there is exactly one instance of each capability per binding and its address is a build-time constant \u2014 so the table would only ever map a constant to a constant. `Actor[T]` needs an index because a handle is compared and routed by identity; a capability is only ever *used*, and using one means addressing memory.\n\n*Rejected: a fat value (base + length, or base + device id)*. Bounds are a build-time property of the declared layout, already checked exactly (`hardware.layout.exact-bytes`, `hardware.mmio.no-alias`); carrying them at runtime would be a second source of truth that could disagree with the first. It would also make every capability an aggregate, which boot cannot pass to an `init` at all (item W's own register-budget limit).\n\n*Rejected: erasing the value entirely* (a capability as a pure type-level token, every address inlined at its use site). That works only while every capability is reachable as a build-time constant from its declaring driver \u2014 and 03 \u00a71's own worked constructor already passes one as an `init` parameter, where there would be nothing to pass.\n\n**Where a `DeviceCap[D]`'s address comes from: the `devregs` section.** One declared register window per device an `img.driver(..., device=...)` binds, sized from the exact set item C's no-alias rule partitions (`types::driver_mmio_mints` + `types::mmio_consumed_end` \u2014 one walk, so the window a claim hands out and the ranges the rule proves disjoint can never be derived differently), rounded to 8 and never below one word. Zeroed image bytes, placed after `rtdata` and before `pooldata` in both image flavors, reported as `Section name=devregs` plus one `DeviceRegs device= type= driver= base= size=` line. `verify_device_windows` re-derives, from the finished section table, that every window is non-empty, inside `devregs`, and disjoint from every other \u2014 `verify_pool_windows`' sibling, for item D's own security reason: device-reachable memory is disjoint from this image's instructions and from every actor's state and mailbox, so a register window gets its own section rather than bytes interleaved with `rtdata`.\n\n**Why a declared shared-memory window and not a trapping address.** 06-machine.md \u00a73: the VMM \"preconfigures every device, queue, and shared-memory window the report declares \u2014 device topology is a *build output*, not a probed fact\", and \"cold boot is a design property: there is nothing to negotiate\". Machine v1 has no virtio MMIO transport at all (`wrela-vmm::devices`' own module doc: no `MagicValue`/`DeviceID`/`QueueSel` register file exists, because `BlkConfig` *is* the transport configuration, parsed out of the report), and 06 \u00a75's notification mechanism is already a shared-memory doorbell word rather than a trap. `wrela_machine::mmio` reserves exactly three trapping registers \u2014 clock, exit, park \u2014 and nothing else in that window is mapped, so a register file placed there would fault the boot rather than trap into a model. This machine's device registers are therefore a declared window, the same kind of thing its doorbell already is.\n\n**Boot calls a `@driver`'s `init`.** `layout::build_boot_init_calls` walked `graph.actors` only \u2014 decision 10's second prerequisite \u2014 so no capability of any kind had bytes. `RuntimeTables` gains `drivers` (state bytes only: a driver still has no mailbox, no ring and no turn area, M6-D's floor unchanged, and printing `mailbox=0 slot=0 frame=0` would have read as three decisions this milestone has not made), `RuntimePlacement` places each driver's state after every actor's region, and `build_boot_init` zero-fills every state slot and then calls **drivers first** \u2014 06 \u00a73 step 3's \"typed driver and actor initialization in image dependency order\", applied to the one ordering fact this machine has (an actor may hold an `Actor[Driver]` handle; 03 \u00a71 forbids the reverse).\n\nA substituted argument whose address is not known until sections are placed travels as `BootInitArg::DeviceRegsBase`/`PoolBase` and is resolved at the address pass. The word count is identical in both passes \u2014 a `load_imm` is four words whatever it loads \u2014 which is the invariant both image flavors' two-pass assembly already asserts; the sizing pass is handed structurally real, address-free placements rather than an empty list, so `resolve`'s \"no placed window\" guard stays a live guard in both.\n\n**Evidence.** `golden/check-cap-mint` is the shape 03 \u00a71's own driver has: a `@driver` taking `take cap: DeviceCap[BlockHw]`, whose report now carries `rtcode`/`rtdata`/`devregs` sections, a `Driver name=BlkDriver state=8` line and a `DeviceRegs ... base=0x40500230 size=8` line \u2014 an image that, before this item, could not be laid out at all (`mwir::size_of` refused the parameterized type). `golden/check-dma-shared` is the same for a `DmaPool[P, N]` parameter, which item D minted typed and nothing could pass. `golden/appliance` gains the section, the driver line and the window. `golden/boot-device-claim` is the executing oracle (`hardware.mmio.volatile`). Unit oracles: `layout::tests::a_driver_device_cap_materializes_its_devices_register_window` (the unresolved argument, its resolution, and its internal-error arm), `a_device_cap_with_no_device_binding_fails_closed`, `every_other_capability_and_every_state_still_fails_closed`.\n\n**Left closed, named.** An `Mmio[L]` `init` parameter is still refused \u2014 and that refusal is now *permanent* rather than pending: decision 10 found the old text (\"nothing mints a `Mmio` yet \u2014 that is plans/M7.md item C\") stale, because an `Mmio[L]` is minted, by the sealed transport's `map_partition`, and never at the image binding. The message says so and names where to put the field instead (`golden/err-cap-mint-unminted`). `IrqCap[V]` is minted from a device's declared `vector=` (decision 12 / `hardware.irq.vector-binding`); `DmaShared[P, L]` is minted by `VirtQueue.configure` (plans/M7.md item E1) and still refused as an image-bound `init` parameter (`golden/err-dma-shared-unminted`); a bring-up state as an `init` parameter is refused by name (a state is produced by a transition inside the driver, never handed to it).\n\n**Post-closure M7 sweep port (2026-07-25) \u2014 \"one window per device\" was held shut only by habit.** Decision 11's `DeviceCap[D]` is the base of device `D`'s own declared register window, and `layout::DeviceRegs` recorded \"one per device: `eval::image_checks` already refuses a second binding of the same device, so this is not a list\". The refusal did not exist. Verified by running: two `img.driver(..., device=blk)` declarations on one `img.device` rendered two `DeviceRegs device=device#0` lines at two different bases, and boot would have handed each a different word for \"authority over one device instance\". Item A's mint check had the per-driver half (at most one `DeviceCap` parameter); the per-device half of \u00a71's \"named once ... the single source of truth\" was the missing walk. Fixed by `check_device_bound_once` in `check_sealed`'s fixed order, before init-argument minting (`golden/err-device-two-drivers`). Found on orphaned branch `m7-sweep-2` (`a35b05a`) while M7 was still open; the branch never merged, and the defect was still live on master after M7 closed. No existing golden moved."

