note = "The typed tree (plans/M3.md item A, decision 1): sema's product, not an IR — a plain-enum mirror of `syntax::ast`'s `Expr`/`Stmt`/declaration shapes (crates/wrela-compiler/src/sema/typed.rs), no lowering/CFG/SSA/node-IDs/arena, produced by `bodies.rs`'s own `check_expr`/`check_stmt` (which now return a typed node — `TypedExpr`/`TypedStmt` — instead of a bare `Type`/`()`; `access.rs`/`flow.rs`/`matches.rs` are not retrofitted onto it, a recorded non-goal — they still call `check_expr`/`check_pattern` exactly as before and read `.ty` off the result wherever they previously got a bare `Type` back). Every expression node carries its resolved `Type` (reused directly from `sema::types`, no duplicate representation). A call carries a by-value `CalleeKey`: `Fn`/`Method` for a plain (never-generic) fn/method — a bare name or `(struct name, member name)` — and `FnInstance`/`MethodInstance` for an instantiated generic, spelled with `generics::canonical_key`'s own `\"kind:name[args]\"` string, identical to `TypedProgram::instantiations`'s own map key for the fn case (plus `.method` for a method reached through an instantiated struct) — one canonical spelling shared by both the call site and the instantiation's own storage, no second lookup scheme. Desugared operators (a user `Named` type's `+ - * / %` and `<`, 05-library.md §8) are already method-call-shaped (`OpCall`, carrying the resolved key); a builtin scalar/`bool`/`char` op (including `==`/`!=`, which never desugars even for a `Named` data type) stays the primitive `Binary` node — `build_binop_expr` (bodies.rs) is the one place that decides which shape a given operator+operand-type combination produces, replacing the old `check_binop_types` (which only ever returned a `Type`). Literals carry their settled scalar type (the i64/u64/f64 defaulting `synth_int_literal`/`synth_float_literal` already resolved) with their source text kept verbatim, unparsed — decoding is the evaluator's job (item B). `?` is one `Try` node carrying `Option<CalleeKey>`: `None` when the error type already matches (or for `Option`, which never converts), `Some(key)` naming the `<Target>.from`-shaped conversion — the identical key whether `From` came from an explicit `from` fn or `deriving(From)` (golden/check-bodies's `convert_wrapped`: `Try ty=u64 conv=WrapError.from`). Enum construction (`Some`/`Ok`/`Err`/leading-dot/`Enum.Variant`, including a bare no-payload variant reached through a plain field access) is one `EnumConstruct{enum_name, variant, args}` node, `enum_name` resolved to `\"Option\"`/`\"Result\"` for the two builtin sums or a user enum's own name (`resolved_enum_name`, also shared with `TypedPatternKind::Variant`). A closure carries its structural `fn` type on the wrapping node plus its own typed params/body (`TypedClosureParam`/`TypedClosureBody`). A fn/method/`init`'s own parameter defaults are typed once, on the declaration (`TypedParam::default`) — never re-typed per call site (a default may reference the callee's own `self`, which a caller's `FnCtx` does not have bound) — so a `Call`/`StructLiteral`'s own argument/field list carries only what that specific call site supplied (`Vec<Option<TypedExpr>>`/elided fields respectively), `None`/omission meaning \"use the callee's own stored default\"; a raw `fn(...)`-typed value call (`CallValue`) has no defaults to elide (a bare `fn` type carries none), so its args are always fully explicit. Struct/method/init/associated-fn bodies live on `TypedStruct` (`field_defaults`, `methods`, `assoc_fns`, `init`, all `BTreeMap`-keyed); a generic declaration's own (unchecked) body contributes nothing (`check_top_fn`/`check_struct_bodies` return `Ok(None)`), and each concrete instantiation's checked body is captured once, keyed by its canonical instantiation string, in `TypedProgram::instantiations` (`generics::check`, run last, now returns this map instead of `()`). `wrela dump --stage=typed` (crates/wrela-compiler/src/bin/wrela.rs, `sema::check_typed`/`sema::dump_typed`) pins the tree: one node per line, two-space indent, `Kind key=value ty=<type>` in the existing `--stage=ast` dump style (`typed.rs`'s own `dump`/`dump_expr`/`dump_stmt`/`dump_pattern`), no spans anywhere, `BTreeMap` iteration throughout (`Program`'s four maps, `TypedStruct`'s three) for determinism. Ten representative goldens pin it (chosen for feature coverage, not exhaustiveness — the M3.md plan's own \"roughly 8-15, not all ~104\"): check-bodies (plain bodies — literal defaulting including the u64-only-fits case and a negated-literal range check, `?` with and without a `From` conversion, `for` over both a range and a fixed array including the `take`-consuming form, closures and named-fn values passed positionally, an associated-fn value passed by name, `init`-bearing and plain struct construction including the Result-returning `init`, `defer`), check-decls (a resource struct's own `init`, an `own[P]` parameter, `async fn`, a private plain-`self` method), check-operators (every builtin scalar op including wrapping/shift/bitwise plus a user type's `add`/`less_than` shown both as an explicit call and as its desugared operator form side by side), check-generics/check-generic-use (a top-level generic `fn` instantiated both explicitly and by inference to the *same* canonical key/instantiation entry, a generic struct instantiated at three different argument shapes including a resource element type, field/method access through an instantiated struct value), check-match (every pattern shape — variant with/without payload, tuple, wildcard, literal, `|` alternation, `is` — against both a user enum and the builtin `Option`), check-defer-exits (defer registered before/after a conditional take-and-restore, at three different points relative to the restore), check-x-for-take-consume (a whole-array `for take` consuming loop next to a plain per-element read loan over the same resource-element array type), check-x-closure-mut-receiver (a closure passed as a `fn(mut T) -> R` parameter and called back through it), check-torture-block-cache (the one large multi-feature program the plan asks for: own[P] handle threading, take/restore, a generic struct instantiated once as data and once as a resource, private-method receiver inference, defer, match/`is` over a payload-carrying enum). Every dump was reviewed line-by-line against its source before being accepted (types, callee keys, and instantiation dedup all confirmed correct) — see the session report for the full review notes. `cargo xtask check`'s existing 102 pre-M3 golden expectations are byte-identical (`--update` only ever wrote the ten new, previously-empty `typed.txt` files — the touch convention: an empty `expected/typed.txt` means `xtask golden` generates and compares it, same as any other stage).\n\nNote-update (plans/M6.md item G, 2026-07-24): `TypedStmtKind` grew one node, `BareSend { span, expr }` — the bare `send` *statement* form (02-language.md §9.4's proof-conditioned form), dumped as a `BareSend` line over the ordinary `Send` expression node it wraps (`golden/check-send-proven`'s own `typed.txt`). Its `span` is the second and last deliberate exception to decision 1's \"no spans anywhere\" (the first being `ComptimeAssert`, for the identical reason: a verdict produced long after the body walk still needs a real `at L:C`) and is deliberately NOT rendered by the dump, so no golden moves when an unrelated line above it shifts."

