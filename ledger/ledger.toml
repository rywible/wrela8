id = "sema.types.bodies"
doc = "02-language.md#8"
status = "test"
tests = ["golden/check-bodies", "golden/err-type-mismatch", "golden/err-type-cond", "golden/err-type-question", "golden/err-type-resource-eq"]
note = "the body-typing pass (plans/M2.md item C, sema/bodies.rs): assignment introduction/reassignment (same type — `error[type]: expected \\`T\\`, found \\`U\\` at L:C`), unconstrained-literal defaulting (`i64` unless only `u64` fits, `f64`) with range-checking against an expected scalar type (including the combined-sign reading of a negated literal), `if`/`elif`/`while`/`assert` conditions typed as `bool`, `for` over ranges (equal integer endpoint types, a bare literal endpoint deferring to its concrete sibling) and fixed arrays (`take`-consuming form types the same as the lending form — move legality is items E/F), `return` checked against the declared return type (unit fns may fall off the end; exhaustive-return checking is item G's — not checked here), `assert`'s message required to be a text literal, struct/enum construction (named-field literal with defaults, positional one-field shorthand, `init`-bearing types, `Enum.Variant`/leading-dot construction, both fed by the same `types::declare` signatures), field access and calls (arity/label checking shared by fn/method/init/struct-literal/variant construction), closures typed structurally from their call-site's expected `fn` type only (never storable — assigning one to a local is `error[type]`), `?` on `Result`/`Option` with the one-hop `from` conversion (user-written or `deriving(From)`-generated), `match`/`is` pattern typing against the scrutinee (exhaustiveness is item G's), and the fail-closed set beyond imports (`await`, `send`, `with`, f-strings, `comptime if`/`comptime assert`, `@image` bodies, `checked_to`/`truncate_to` — sema.unimplemented.fail-closed). A generic declaration's own body (struct, enum has none, fn/method) is skipped here, not type-checked directly — item H (sema.generics.structural) checks it concretely, once per unique instantiation, by substituting a copy of the declaration and re-running this same pass over it; `Type`'s derived `PartialEq` compares the unevaluated length `Expr` array/`Bytes` embed span-and-all, so bodies.rs uses its own span-insensitive `types_eq` throughout instead (comparing a literal length by value, a bare name by name) — pinned by every array-parameter case in golden/check-bodies rather than a dedicated golden, since without it almost any array-typed call would spuriously mismatch.\n\nCross-reference (`cargo xtask fuzz lower` seeds 32/33, full finding and fix on `syntax.diagnostics.parse-errors`): `check_assign` here never verified an `Assign` target was place-shaped (a name, or a field/index chain) before typing it — its own \"a non-name target (field, index) already exists\" branch happily ran `check_expr` on *any* non-`Name` expression, including a `Unary`(`~total = ...`)/`Binary`(`i + 2 = ...`, from a stray `i +2= 1` typo) target, and typechecked it clean. That silently broke an assumption `lower::lower_place_write`/`eval/interp.rs::place_mut` both hard-code (their own `_ => internal error: expression is not an assignable place` guard) — the two passes disagreed about what a `check_typed`-accepted program's `Assign` targets look like. Fixed one layer earlier, in the parser (`parse_assign_or_expr_stmt`, `ast::is_place_expr`), not here — see `syntax.diagnostics.parse-errors` for the full note, the two pinned goldens (golden/err-assign-nonplace-unary, golden/err-assign-nonplace-arith), and the eval-side check (`wrela test` on an `@test` probe of each shape hit the identical internal-error message, never silently tolerated it). Because no `AssignStmt` with a non-place target can be built past the parser now, `check_assign`'s own non-name branch has this invariant restored without needing its own explicit re-check."

[[clause]]
id = "sema.types.calls"
doc = "02-language.md#5.1"
status = "test"
tests = ["golden/check-bodies", "golden/check-operators", "golden/err-type-arity", "golden/err-type-label"]
note = "call checking (plans/M2.md item C): arity, each argument bound at most once — by label (looked up against the callee's parameter names) or positionally (the next not-yet-bound parameter) — a parameter with a default may be omitted, argument types checked against parameter types; access-mode markers on arguments are parsed but not validated (mirroring call-site markers against signatures is item D). Operator desugar (02-language.md §7.4, 05-library.md §8): builtin scalar `+ - * / %`, wrapping `+% -% *%`, shifts, bitwise, and comparisons never desugar (same-type operands; wrapping/shifts/bitwise integers only); a user (`Named`) type's `+ - * / %` and `<` resolve to the matching method, shape-checked (`read self`, one same-type param, `<`'s method must return `bool`); structural `==`/`!=` are generated for every data type — comparing a resource-classified type is `error[type]` (golden/err-type-resource-eq). Named functions and no-receiver associated functions are typed as `fn(...)` values so they can be passed where a matching function type is expected."

[[clause]]
id = "sema.no-panics"
doc = "02-language.md#2"
status = "test"
tests = ["xtask:fuzz"]
note = "cargo xtask fuzz sema (plans/M2.md item I): the parser fuzzer's two strategies — mutation of every doc/example corpus entry and every tests/golden/*/input.wr (via the shared corpus_seed_inputs/mutate_seed_input, which already includes the sema-valid check-* goldens as seeds) plus token-soup — run through lex -> parser::parse -> sema::check. Invariants every iteration under catch_unwind: sema never panics; the outcome is a successful dump or exactly one SemaError whose category is one of the fixed set (name, type, access, move, init, overlap, match, generic, unimplemented); the whole pipeline is deterministic across two runs on the same input (identical dump, or identical error stage/category/message/line/col); on success, sema::dump is itself panic-free and byte-identical across two separate calls. Deep default 2_000_000 iterations (measured ~38-39us/iteration on the authoring machine — 500_000 iters in ~19.4s, 2_000_000 in ~78s — so the deep run lands at roughly a minute and a quarter, the plan's 'minute or two' target); a clean run at that budget (seed=1, 2_000_000 iterations, zero finds) is checked into this commit's history. Smoke budget (seeds 1/2, 1_000 iterations each, well under a second) wired into xtask check after the parser smoke. Every pass the pipeline currently runs (collect/resolve/declare/bodies as of this item; access/flow/matches/generics as sibling items land) is exercised as-is — the invariants are pass-agnostic and hold regardless of which passes exist yet."

[[clause]]
id = "sema.match.exhaustive"
doc = "02-language.md#7.2"
status = "test"
tests = ["golden/check-match", "golden/check-generic-enum", "golden/err-match-nonexhaustive", "golden/err-match-redundant-wildcard", "golden/err-match-or-bindings"]
note = "match exhaustiveness (plans/M2.md item G, sema/matches.rs): a whole-module re-walk (after bodies.rs) that finds every `match` statement and `is` expression and re-derives each scrutinee's type via `bodies::check_expr` (widened to `pub(crate)`, the one function bodies.rs uses to synthesize an expression's type in a local context — real reuse of its typing machinery, not a reimplementation; `bodies::check_pattern`/`ModuleCtx`/`FnCtx`/`types_eq`/`decl_variant_payload_types`/`literal_array_len` are widened the same way). Exhaustiveness is a plain recursive usefulness check over a `Vec<RPat>` pattern matrix (decision 4: no unification, no Maranget-style optimization beyond what correctness needs), compositional over closed enums (`Option`/`Result` included, as ordinary two-variant sums — and, plans/M9.md item J2c, a generic-instantiated user enum such as `Lookup[u32]`, via `generics::instantiate_enum` in `shape_of`), `bool`, `unit`, tuples, and fixed arrays with literal lengths (component-wise); integers, `char`, strings, `Static`/`Bytes`, non-literal-length arrays, and anything else this pass does not enumerate constructors for require an explicit wildcard/binding arm. A non-exhaustive `match` is `error[match]: match is not exhaustive: missing <witness> at L:C`, the witness the first uncovered pattern in declaration order (`.Absent`, `(.None, _)`, ...); an arm (including a wildcard) matched by no value not already covered by earlier arms is `error[match]: unreachable arm at L:C`; a guarded arm is never checked for its own uselessness and never contributes to coverage. `|` alternatives must bind the same names at the same types (`error[match]`) at every nesting depth, checked independently of any guard. `is` demands no exhaustiveness but its own uselessness check applies to a top-level `|`'s alternatives (2-language.md §7.2: refutable by design; a pattern that can never match its scrutinee type is already a bodies.rs type error, not double-reported here). One documented gap: a closure's body is only re-walked (for a nested `match`/`is`) when every parameter carries an explicit type annotation (its type then comes straight from `mctx.resolve_type`, still real reuse) — deriving an unannotated closure parameter's type needs the call-site expected-type context bodies.rs's call-checking machinery owns, which this pass does not duplicate; such a closure is left unwalked (not an error — bodies.rs already checked it — just unchecked for this pass, like a generic body is)."

[[clause]]
id = "sema.access.call-mirroring"
doc = "02-language.md#5.1"
status = "test"
tests = ["golden/check-access", "golden/err-access-missing-mut", "golden/err-access-extra-take", "golden/err-access-wrong-marker", "golden/err-access-nonplace"]
note = "the access pass (plans/M2.md item D, sema/access.rs), run after bodies.rs on an already-type-checked module: every non-receiver call argument's marker is mirrored against its bound parameter's declared mode — a `read` parameter takes an unmarked argument, a `mut`/`take` parameter requires the matching marker exactly; a missing, extra, or wrong marker is `error[access]: parameter \\`name\\` requires/takes ..., found ... at L:C` (or `this argument ...` for a positional call through a raw `fn(...)`-typed value/closure parameter). The receiver is the one exception (`cache.clear()` needs no second marker) — it is checked separately (sema.access.receiver-inference). A `mut`/`take` operand must be a full place expression — a name, or a field/index chain rooted in one, checked recursively (`is_full_place`): the parser's own `is_place_expr` only looks at the outermost node, so an outer `Field`/`Index` whose *base* is not itself a place (`f().field`, `take (f().field)`) slips past it and is caught here instead (golden/err-access-nonplace). The same `take` rule applies wherever `take` appears, not just inside a call argument (an assignment source, a `return`, a tuple/array element, ...), since 02-language.md §3 lists an argument, an assignment source, a literal operand, and a pattern payload as one rule. A struct literal's fields and an enum variant's payload carry no declared parameter mode (`DeclField`/`DeclVariantPayload` have none) so they are never mirrored, only place-checked."

[[clause]]
id = "sema.access.receiver-inference"
doc = "02-language.md#5.1"
status = "test"
tests = ["golden/check-access", "golden/err-access-pub-receiver"]
note = "every `pub` method must spell its receiver effect (02-language.md §5.1); the AST cannot distinguish a plain `self` from an explicit `read self` (types.rs's `DeclReceiver` doc comment), so the rule is checked the only honest way available: a `pub` method whose receiver mode is the ambiguous `read` is `error[access]: pub method \\`name\\` needs an explicit \\`mut self\\`/\\`take self\\` receiver at L:C` exactly when its body's inferred requirement exceeds `read` (golden/err-access-pub-receiver); a `pub` method that already spells `mut self`/`take self` is never second-guessed. A private plain-`self` method gets the least effect inferred instead, shown in the check dump (`fn peek(read self) -> u64`, not bare `self`, once inference actually ran): a whole-module fixpoint starting every candidate at `read`, escalating to `mut` (a field of `self` assigned; `self` or a field of `self` passed as a `mut` argument; a field of `self` taken — restorable per 02-language.md §3.2, so needing `mut` access, not full ownership; a `mut self`/`take self` method called directly on `self`) or `take` (`self` itself, whole, taken; a `take self` method called directly on `self`). Inside a body, a `read` binding (a parameter, or `self` under its effective mode) is a loan: it can never be assigned, have a field assigned, or be passed onward as `mut`/`take` (`error[access]`, mode-local — no CFG, full flow analysis is items E/F). Calling through a receiver checks the receiver expression's own binding: a `mut self` method needs a mutable place (not a `read` binding), a `take self` method needs an owned place (not a `read` or `mut` binding) — `error[access]` naming what was found instead. A private method that needs more than a direct `self.method()`/`self.field = ...` pattern to reach its true requirement (e.g. escalating through a nested `self.field.mutate()` call) is not chased further by inference; such a method must spell its receiver explicitly, exactly like a `pub` method would — the receiver-mutability check above still enforces it correctly either way, so this is a documented scope limit, not a soundness gap."

[[clause]]
id = "sema.init.definite"
doc = "02-language.md#3.2"
status = "test"
tests = ["golden/check-flow", "golden/err-init-unassigned", "golden/err-init-merge", "golden/err-init-field-restore", "golden/err-init-missing-return", "golden/err-mwir-if-else-scope-leak"]
note = "the flow pass's definite-initialization half (plans/M2.md items E/F, sema/flow.rs): a per-body structural CFG walk (no explicit graph — `walk_block` is a direct interpreter over the structured, loop-free-except-`for`/`while` AST) tracks each storage path's state (`Uninit`/`Init`/`Moved`, paths.rs) on every edge; `if`/`match` clone the entering state once per branch/arm and *meet* the results back together, so a name is initialized after the join only when every non-diverging branch initialized it (`return`/`break`/`continue` drop out of the merge). `for`/`while` re-run their own body from a candidate entry state that starts at the pre-loop state and is replaced, each real (error-raising) pass, by the meet of the loop's own back edges (fallthrough plus every `continue`), until it stops changing or a small fixed cap is hit. Reading an unassigned local, or a `self`/parameter root used whole while one of its own fields is still `Moved`/`Uninit`, is `error[init]`; a `mut`-mode root's not-yet-restored field is checked again at every function-level exit (`return`, or the implicit end of a `unit`-returning body) — golden/err-init-field-restore. `init` (02-language.md §7.1) seeds each declared field of `self` as its own `Uninit` local rather than seeding `self`'s own root at all, so \"self used whole\" naturally falls back to this pass's ordinary default until every field is assigned; an `init`'s own `return Err(...)` is recognized syntactically as tearing down whatever was initialized so far (§7.1's own words) and carries no field-completeness obligation of its own. A value-returning body (`fn`/method/`init`) that can still fall off the end is `error[init]: missing return of type \\`T\\` on some path at L:C` (golden/err-init-missing-return) — deliberately conservative for loops (a `for`/`while` never counts as guaranteeing a return, even one that syntactically always does, so a function relying on an infinite loop's own `return` to be total is rejected here; not exercised by any golden in this corpus). `match`'s own arm set is assumed exhaustive for merging purposes without re-deriving exhaustiveness (matches.rs, sema.match.exhaustive, runs after flow in the frozen pass order) — a genuinely non-exhaustive match is still rejected, just by that later pass's own diagnostic, so this is never an acceptance gap. `defer`'s own per-exit re-validation (02-language.md §10) is values.teardown.defer-valid-at-exit's own clause, not this one — this note previously flagged it as validated once, at registration, only; that gap is now closed there.\n\nFind+fix (2026-07-24, sema.names.resolution's own note has the full story — `golden/err-mwir-if-else-scope-leak`): golden/err-init-merge and golden/err-init-unassigned previously pinned this pass's own `error[init]: ... is not initialized here` for a *typed* declaration made in only one `if` arm (no `else`) / only inside a `while` body, then read afterward. Both examples relied on the same flat-scope over-acceptance the find above fixed: `value`/`x` is now out of scope entirely by the time that later `return` is reached, so `sema::symbols::resolve` now rejects both first, as `error[name]: unknown name`, before this pass ever runs — both goldens' `expected/check.txt` moved to match (still exercising the identical *shape* of program; the diagnostic category is simply earlier and more precise now, since there genuinely is no local of that name in scope on the failing path, not merely one this pass could not prove initialized). This pass's own arm/loop-merge logic is otherwise unchanged and still real: it is what makes the untyped arm-merge idiom (a name pre-declared, then plainly reassigned — no type annotation — in every arm) resolve to \"definitely initialized\" after the join, per this clause's own first paragraph; `golden/check-flow`'s `conditional_init` (rewritten as part of the same fix, see sema.names.resolution) is exactly that idiom, not a per-arm typed declaration."

[[clause]]
id = "sema.generics.structural"
doc = "02-language.md#6.3, 02-language.md#7.3"
status = "test"
tests = ["golden/check-generics", "golden/check-generic-use", "golden/check-generic-enum", "golden/err-generic-missing-method", "golden/err-generic-const-arg", "golden/err-generic-uninferable", "golden/err-generic-enum-infer"]
note = "structural generic instantiation (plans/M2.md item H, sema/generics.rs): typing a `Generic[Args]` use (a call, a construction, a field/method/variant lookup through an already-typed value) resolves its concrete arguments and enqueues the instantiation into a module-wide worklist (`bodies::ModuleCtx::generics_queue`, keyed by a canonical `\"<kind>:<name>[<args>]\"` string — decision 1's `BTreeSet`, realized as a `BTreeMap` so `Type`/`Expr` never need an `Ord` of their own); `mod.rs::check` drains it to a fixed point after bodies/access/matches, substituting a copy of the declaration (`Type::Generic` -> the concrete argument, throughout fields/params/return/array-and-`Bytes` lengths) and re-running those same three passes over it (each widened `pub(crate)` for exactly this reuse — no restructuring), including data-vs-resource reclassification with the concrete argument types (golden/check-generics: `Ring[DmaBlock, 2]` is a resource though `Ring[T, const N]` itself, un-instantiated, is not). A generic `fn` called without explicit `[Args]` infers its type arguments the dumbest honest way (item 2): a type parameter used directly as a parameter's own type is inferred from that argument's synthesized type; anything else (a const parameter, a parameter never naming a bare type parameter directly, or two inferred occurrences that disagree) is `error[generic]: ... requires explicit \\`[Args]\\`: ...` naming the parameter (golden/err-generic-uninferable). A missing requirement discovered inside an instantiation's substituted body reports the one pinned multi-line exception (decision 2, 02-language.md §7.3 verbatim): `` error[generic]: `Name[Args]` requires `Type.method(read self) -> R` `` with no ` at L:C` suffix, then two-space-indented `` required by `expr` at file:line `` (the original, unsubstituted declaration's own call site) and one `instantiated at file:line` per chain level, innermost first (golden/err-generic-missing-method pins the exact format against 02 §7.3's own `hash_pair[Sector]` example); any other failure inside an instantiated body keeps its ordinary one-line message with the same `instantiated at` chain appended. Const generic arguments (decision 4, 02-language.md §6.3) evaluate only as a literal, a `const` name (recursively), or a fieldless-enum variant path — anything else (arithmetic, a call) is `error[unimplemented]` (sema.unimplemented.fail-closed, golden/err-generic-const-arg). A fixed instantiation-chain depth cap (64) rejects runaway/cyclic recursion as `error[generic]: instantiation depth exceeded ...`. Documented scope boundary, not silently approximated: a *method*'s own generic parameters (beyond its struct's, if any) are never instantiated — such a call fails closed via the existing `unimplemented_at` helper, exactly as it did before this item (ledger gap `sema.generics.method-params`, corpus `:530`); the requirement-chain diagnostic itself is only derived for a top-level generic `fn` whose body returns, directly or through one builtin same-type-result binary operator, a zero-argument method call on a bare type parameter (02 §7.3's own example shape) — anything deeper falls back to the ordinary-message-plus-chain case rather than fabricating a signature. Pre-M3 finding (plans/pre-M3-findings.md, sema.coverage.torture's own note) fixed: call-site substitution is now real. `bodies::check_struct_construction`'s synthesized type carries the instantiation's own resolved args (`Type::Named(\"Slot\", [u64, 2])`, not a bare `Type::Named(\"Slot\", [])`) instead of dropping them, so a construction's result type-checks against an expected instantiated type (golden/check-generic-use's `construction_expected_type`) and, since field/method lookup through a `Type::Named(name, args)` with non-empty `args` already substituted via `generics::instantiate_struct` before this fix (only the construction's own result type was wrong), a field reached through an instantiated value now resolves to its substituted type end-to-end (golden/check-generic-use's `field_through_instance`) and a method called on one still enqueues the concrete instantiation for whole-declaration checking, unchanged (golden/check-generic-use's `method_through_instance`). `types_eq` already compared two `Type::Named`s' args structurally (including a `const` arg via the existing span-insensitive `same_len_expr`), so no change was needed there. `access.rs`'s own best-effort type tracker had the identical construction-result gap (its own `check_struct_construction`) plus a stricter one: `check_field` refused to even attempt a field's type through a `Type::Named` with non-empty args at all, which — once a value's tracked type legitimately carries real args — made a chained method call through that field wrongly fail closed (`error[unimplemented]: mirroring a method call through this base expression is not checked yet`); fixed the same way, reusing `generics::subst_field_type` (already `pub(crate)` for `flow.rs`'s own reuse) instead of duplicating substitution logic a third time. plans/M9.md item F1 decision 341: TypeArg::Bound (`..N`) is accepted for const generic parameters (occupancy spelling of the same const); Bound and Const compare equal in type_args_eq after subst prints Bound as Const. plans/M9.md item J2c (2026-07-25, decisions 525–527): generic-enum *variant construction* (`Lookup.Absent` / `Lookup.Found(x)` under an expected `Lookup[u32]`) now calls the already-existing `instantiate_enum` instead of the blanket `unimplemented` refusal; missing expected type is `error[type]: cannot infer type arguments for \\`Name\\` variant construction` (golden/err-generic-enum-infer); exhaustiveness over an instantiated enum is ordinary closed-sum checking (golden/check-generic-enum; see also sema.match.exhaustive)."

# --- actors ---------------------------------------------------------------

[[clause]]
id = "actors.turns.non-reentrant"
doc = "02-language.md#9.2"
status = "test"
tests = ["golden/boot-actors", "golden/boot-actor-chain"]
note = "plans/M6.md item F (2026-07-24), decision 4: flipped on a real Hypervisor.framework boot of real `.wr` source, not on a dump. 02-language.md \u00a79.2's rule (\"the actor keeps it until the handler returns, errors, or abandons; awaiting a dependency lets other actors run but admits no new message into this actor\") is **structural** in the shipped runtime rather than checked: `layout::build_rt_select_and_run_core`'s readiness prologue reads the actor's own turn-record `busy` word (`codegen::OFF_TURN_BUSY`) first and, when it is set, will only ever *resume* the in-flight activation (`busy && suspended && resume_ready`) \u2014 it never reaches the mailbox-pop path at all. `busy` is set at fresh selection and cleared only at completion, so it spans the whole turn including every suspension; a suspending await returns `TURN_STATUS_SUSPENDED` to the scheduler with `busy` deliberately left set (`codegen::emit_await_suspend`). Admission is deliberately independent of it (`build_rt_enqueue` never reads `busy`): a message to a busy actor QUEUES, which is what makes the witness below constructible at all.\n\n**The flip witness, `golden/boot-actors`**: `Ledger.marks` is a decimal trace, one digit appended per `mark(n)` turn, so the digit order is exactly the Ledger mailbox's own admission order (04-compiler.md \u00a72's \"selection is FIFO per mailbox by admission order\"). The root `send`s `Worker.slow` and then `Worker.quick` before awaiting anything, so `quick` sits in Worker's mailbox for the entire span `slow` is parked on its first await \u2014 the exact shape decision 4 names. Non-reentrancy forces `slow` to finish first: marks = **123**. A reentrant actor would have admitted `quick` while `slow` was parked, enqueueing its `mark(3)` behind `mark(1)` but ahead of `mark(2)`: marks = 132. One assertion separates the two schedules, and it is not vacuous \u2014 the same image with the assertion changed to `132` fails loudly (verified). `golden/boot-actor-chain` is cited alongside it for the nested case (root \u2192 Outer \u2192 Inner, each turn carrying its own waker), where the same `busy` word holds two independent suspended turns at once.\n\nNot claimed beyond the evidence: multi-core admission ordering (M8), mailbox capacity *derivation* (declared `mailbox=` is the bound at M6), and restart's own \"the bounded mailbox may keep accepting within the proven restart window\" (04 \u00a75, M7+) are all out of scope here and unchanged by this flip."

[[clause]]
id = "actors.send.statement-requires-proof"
doc = "02-language.md#9.4"
status = "test"
tests = [
  "golden/check-send-proven",
  "golden/boot-send",
  "golden/check-actor-send",
  "golden/err-send-capacity-short",
  "golden/err-send-in-loop",
  "golden/err-send-in-child",
  "golden/err-send-no-image",
  "golden/err-send-multi-caller",
]
note = "plans/M6.md item G (2026-07-24), decision 5, shipped exactly. 02-language.md §9.4 is the whole rule: \"One-way messages have a single form. `send actor.method(...)` enqueues a unit-returning method; its type is `Result[unit, CallError[never]]` (plans/M13.md item J / decision 5 — was `Result[unit, Rejected[...]]` until J folded Rejected into NotAdmitted) with the moved payloads handed back in the error — an ordinary storable value. When mailbox analysis proves admission cannot fail (including during a restart window), the error type is `never` and `send` stands as a bare statement; otherwise the result must be consumed\" / \"This is the language's one proof-conditioned form: the same spelling is infallible exactly where the compiler has proved it, mirroring the library's `*_proven` convention.\"\n\n**Note-update (plans/M13.md item J, 2026-07-27)**: `send`'s error type is now `CallError[never]`; the unproven-send diagnostic names that type; `Type::Named(\"Rejected\")` is deleted. Payload handback on enqueue-fail reuses item H's `emit_not_admitted_local`. See `actors.send.notadmitted-unified`.\n\n**THE SHIPPED PROOF CONDITION, VERBATIM** (plans/M6.md decision 5's own words, recorded here as that decision requires): \"admission cannot fail iff the target mailbox's declared capacity >= the whole-image count of static send/call sites targeting it AND every such site sits outside any loop and outside any `g.start` child (so each executes at most once per root turn) AND root turns are serial (decision 1 guarantees this at M6).\"\n\n**Where it runs, and why that placement** (the item's own recorded decision): `sema::send_proof::check`, called as the last step of BOTH `sema::check_typed` (single-module) and `sema::check_program_typed` (whole closure) — a whole-image pass over already-typed programs, living in `sema/` and producing an ordinary `error[actor]` sema diagnostic. Two placements were rejected for named reasons. (a) Inside a body-checking pass: impossible — a mailbox capacity is a *declared* value inside the `@image` fn (`img.actor(T, mailbox=N)`), which does not exist until the whole-image builder has been evaluated, and `bodies.rs` runs before the program it would evaluate is finished. (b) In `eval::image_checks::check_sealed` (the existing post-image graph-check home): fail-open — that pass only runs from `--stage=image`/`report`/`build`, so a bare `send` would type clean at `--stage=check`/`typed`/`mwir`/`asm` and `wrela test` and only be rejected later, AND a program with *no* `@image` fn at all (which can prove nothing, so its bare sends must be rejected) never reaches that pass in the first place. The chosen placement is the only one every consumer of a checked program passes through. It therefore evaluates the one reachable `@image` fn itself (`eval::interp::eval_image`, the same entry `--stage=image` uses) — **only when the build closure actually contains a bare `send` statement**, so every other program in the corpus pays nothing and changes by zero bytes. The disclosed cost, recorded rather than glossed: for a bare-send-bearing program the `@image` fn is evaluated twice (once here, once by `--stage=image`/`report`/`build`/`test`); evaluation is a deterministic, quota-bounded pure function of the typed program, so the two can never disagree.\n\n**The counting rule, precisely.** A *message site* is any typed `send h.m(...)` or `await h.m(...)` whose receiver is an `Actor[T]` handle — both enqueue one message into `T`'s single mailbox and occupy one slot there, so both count (decision 5's own \"send/call sites\"; `await g.join_all()` is not a message and is not counted). A site is attributed to the actor *type* `T`, never to an instance: a handle's static type is all the compiler knows, so an image with two `Foo` instances could route every site to whichever one it likes. `capacity(T)` is therefore the **minimum** declared `mailbox=` over every declared instance of `T` (a declaration with no readable `mailbox=` contributes `0` — \"unknown bound\" must never read as \"big enough\"), and `N(T)` counts *every* message site targeting `T` anywhere in the build closure. The proof for a bare send targeting `T` requires `capacity(T) >= N(T)` and requires **every one of those `N(T)` sites** (not only the bare one) to be provably at-most-once per root turn — a site in a loop elsewhere could flood the mailbox and make this send fail.\n\n**Multiplicity / call-graph attribution** (`send_proof::at_most_once`, the answer to \"how do you handle a send inside a fn called from two places, recursion, a callee reached through several paths\"): a site is at-most-once iff it is outside every `while`/`for` body and outside every closure body *in its own holder* AND its holder (the fn/method/instantiation whose body it sits in) is itself at-most-once. A holder is at-most-once iff: it is not reachable from a `g.start` callee through ordinary call edges (decision 5's own \"outside any `g.start` child\", read transitively — a *message* edge is deliberately not an ordinary call edge, since a turn started by a message does not run inside its sender's frame); it is not on a recursion cycle, direct or mutual (a plain in-progress stack in the memoized DFS answers \"no\" for every node on a cycle); and it has zero static invocation sites (it either never runs, or it is a root — `@test(runtime)` is M6's only root, and decision 1 makes root turns serial) or exactly one, which is itself at-most-once. Two or more invocation sites: not at-most-once. An *invocation site* is any typed callee occurrence naming the key — an ordinary `Call`/`FnRef`/`OpCall`/`Try`-conversion, a `g.start` callee argument, or a message site (an actor method's invocations *are* the messages sent to it: the uniformity that makes one rule cover actor methods too). Keys are `CalleeKey::spelling()`s merged across modules, so two modules each declaring `fn helper` share one key and their call sites add up — conservative in the safe direction, recorded rather than fixed (the typed tree carries no module-qualified keys).\n\n**The one deliberate deviation from decision 5's own text, and why it is a narrowing not a widening**: decision 5's parenthetical \"(so each executes at most once per root turn)\" states the intent; its two lexical tests (outside any loop, outside any `g.start` child) are *necessary but not sufficient* for it. A send sitting outside every loop in an actor method that is itself targeted by two `send` sites executes twice per root turn — counting static sites alone would under-count, which is exactly the soundness bug that would let a real image drop a message. So this pass implements the intent (the holder rule above) and treats the two lexical tests as the first two of its conditions rather than all of them. Strictly fewer programs are accepted than decision 5's literal text would accept; none more. `golden/err-send-multi-caller` pins exactly this case and is the reason the refinement exists.\n\n**02 §9.4's \"(including during a restart window)\", answered honestly**: vacuous at M6 and recorded as such rather than quietly satisfied — there is no restart runtime (plans/M6.md decision 12: an actor abandon is image-fatal, restart mechanics are M7+), so no restart window exists for admission to have to survive. When one does, this condition grows a conjunct; nothing here silently claims to cover it today.\n\n**Soundness (why no under-count is possible)**: every message into `T`'s mailbox originates at some static message site in the build closure — `bodies::check_send`/`check_await` are the only producers of `TypedExprKind::Send`/`Await`-of-actor-call, and `codegen::emit_send`/the await suspend tail are the only `rt_enqueue` callers, so there is no other spelling that enqueues. The scan walks every statement and expression of every fn, method, `init` and instantiation of every module in the closure with an exhaustive match (a new typed node kind stops the file compiling until it gets a real arm), so `N(T)` counts them all. Each is required at-most-once per root turn, so at most `N(T)` messages exist per root turn; root turns are serial and each drains the scheduler before the next begins (decision 1), so no two root turns' messages are live together; `capacity(T) >= N(T)` therefore leaves a free slot for every one and `rt_enqueue` can never reject. Anything the pass cannot see contributes no *edge*, but never a proof it should not: an unseen caller makes a holder look caller-free (at-most-once), which is sound only because `N(T)` is a count of static source sites, not of dynamic paths — no call graph can add a site to it.\n\n**Typed-tree change**: a bare `send` statement is now its own node, `TypedStmtKind::BareSend { span, expr }` (dumped as `BareSend` over the ordinary `Send` expression, span never rendered), rather than an `ExprStmt` wrapping a `Send`. Two reasons, both recorded: the proof must find exactly these statements and never the always-legal expression form; and — like `ComptimeAssert`, and for the identical reason — it is the second and last deliberate exception to plans/M3.md decision 1's \"no spans anywhere\", because its rejection is produced long after the body walk that could have supplied a location, and `at L:C` on a `send` the author actually wrote is worth one field. Nine exhaustive matches over `TypedStmtKind` grew a real arm (`eval::legal` illegal-reason + scan, `eval::interp` abandon, `eval::check_comptime_asserts`, `lower.rs` fail-closed, `flowwir_lower` lowering + `expr_contains_await`, `bodies::check_cross_await`); `sema::flow` and `sema::matches` replaced their item-A `unreachable!`/no-op `Stmt::Send` arms with the same real walk `Stmt::Expr` already gets.\n\n**Lowering is deliberately unchanged**: a proven bare `send` emits the identical `FlowInst::Send` -> `codegen::emit_send` -> `rt_enqueue` sequence the consumed form does, into a fresh temp nothing reads (`golden/check-send-proven`'s `flowwir.txt` shows both). The proof is a legality verdict, never a codegen switch — a proven send and an unproven one must execute identically, so `codegen` never learns the proof exists. Correspondingly, 02 §9.4's `never` *erasure* is NOT shipped: the node's type stays `Result[unit, Rejected]` in both forms (decision 8's own \"erasure shipped: none\" at M6, recorded rather than silently narrowed) — the bare statement simply discards it.\n\n**Goldens**: accept — `golden/check-send-proven` (two bare sends + one `await`, `mailbox=4` >= 3 sites; `check.txt`/`typed.txt`/`flowwir.txt`) and `golden/boot-send`, the runtime half, booted for real on Hypervisor.framework: two bare sends plus one consumed-`Result` send plus a trailing `await read_total()` that can only read `7` if all three turns really ran (FIFO per mailbox, 04 §2). Both counterexamples were verified to fail rather than assumed: asserting `3` fails, and deleting one bare send fails. err — `golden/err-send-capacity-short` (capacity 2 < 3 sites), `golden/err-send-in-loop`, `golden/err-send-in-child`, `golden/err-send-no-image` (the fail-closed floor: nothing to prove against), `golden/err-send-multi-caller` (the counting rule's own soundness case). The consumed-`Result` form did not move anywhere (`golden/check-actor-send` byte-identical). `golden/err-send-bare-unproven` is retired into `golden/err-send-no-image` (same program below the module line; the old name named item A's blanket floor, a rule that no longer exists) — see `actors.messages.value-restrictions`'s own note-update.\n\n**Fuzz/roundtrip coverage, checked rather than assumed**: `xtask`'s fuzz seed corpus and the roundtrip lane both walk every `tests/golden/*/input.wr` (`corpus_seed_inputs`/`roundtrip`), so all seven new async/actor goldens joined both automatically; `roundtrip`'s sema oracle calls `sema::check_typed`, which now *includes* this pass, so the pretty/reparse roundtrip really does cover the bare-`send` statement form and its new diagnostics (the printer emits `send x.y(...)` at statement position and it reparses identically — verified per new golden). `cargo xtask check` green; fuzz lower/eval/sema 200_000 iterations x 2 fresh seeds, clean."

