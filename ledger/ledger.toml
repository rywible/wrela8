note = "02-language.md §3.1's second bullet: \"If its only consumers are protocol operations (capabilities, permits, receipts), every control-flow path must explicitly consume, return, or transfer it, or cover it with a `defer` that does (§10). Forgetting one is a compile error naming the path.\"\n\nplans/M7.md item E3 flips this. `sema::flow::check_protocol_consumption` rejects a still-`Init` **owned** root (`take` parameter or local — `read`/`mut` loans are skipped) of a protocol-consuming type at every function exit.\n\n**Predicate (plans/M13.md item O).** Re-derived from the computed `must_consume` class (`sema::classes`); the legacy `is_protocol_consuming_type_name` name list is deleted. Leaf set unchanged: `DeviceCap` / `Mmio` / `IrqCap`; every §9 bring-up state; `VirtQueue` / `QueuePermit` / `QueueOp` / `Receipt`. `DmaPool` / `DmaShared` stay out (first-bullet reclaim / no sink). **New:** `resource(manual) struct` is `must_consume` by fiat (02 §3.1 third bullet) — `golden/err-manual-resource-dropped` / `golden/check-manual-resource-consumed`.\n\n**Oracles.** `golden/err-cap-drop` / `golden/err-mmio-drop` (dropped `DeviceCap` / minted `Mmio` — path named); `golden/err-receipt-drop` / `golden/err-permit-drop`; `golden/check-receipt-handoff` / `golden/check-cap-mint` (accept paths that store or return). Bring-up consuming transitions (`negotiate`/`start`/`take_irq`) Take the receiver in flow so a completed chain does not falsely leave `claimed` live.\n\n**Also fixed here.** `types_eq`'s `TypeArg::Pool` arm (item D left Pool vs Pool as `false`), so `Option[DmaShared[P, L]] = None` / `Some(take pool)` compare honestly — unit-tested beside `types_eq_is_span_insensitive`.\n\n**Item I's sweep (2026-07-25) — the predicate was one wrapper deep.** `is_protocol_consuming_type` answered only a root `Named` leaf, so `Option[DeviceCap[D]]`, `[DeviceCap[D]; 1]`, and a plain `struct CapBundle { cap: DeviceCap[D] }` were droppable without claim — the same shape as `DmaShared`'s lend hole. Fixed in `sema::flow::protocol_resource_carried` (Option/array/tuple/`Result`/named fields, `Actor[T]` cut); matching a *wrapper* that carries a protocol resource moves the scrutinee so `Option[Receipt]` destructuring in `golden/boot-blk-roundtrip` is not a false drop. Oracles: `golden/err-cap-drop-option`, `golden/err-cap-drop-wrapped`."

