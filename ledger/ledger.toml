note = "plans/M5.md item D, decision 10: FLIPPED from `gap` to `test` — image emission now exists (`crates/wrela-compiler/src/layout.rs`, new), so 04-compiler.md §8's own \"identical declared inputs ... produce a byte-for-byte identical image and report\" is provable, not just assertable. `xtask`'s `produce_report_and_image` (grown from the M4-era `produce_report_text`, itself renamed) mirrors `bin/wrela.rs`'s own `build_report` tail end to end — `layout::merge_layout_ctx` (one `mwir::LayoutCtx` per module in the build closure, merged, since `bodies::check` only ever populates a module's own `TypedProgram::fns`/`structs` from *that module's own* AST items — an imported struct's own field types live only in its *declaring* module's raw `ast::Module`, never copied into an importer's, so a project case needs every module's own ctx merged, not just the `@image`-owning one's) then `layout::try_layout_program` (per-module `lower::lower_program`, merged via a rodata-reindexing `merge_mwir_programs`, then `codegen::codegen_program`, then `layout::layout_program`) — and `report_determinism` (renamed in spirit, not in `xtask`'s own subcommand name: `cargo xtask report-determinism`/`cargo xtask repro` now both call the identical fn) runs the whole thing *twice*, fresh, in-process, per report-bearing golden case, comparing both the rendered report text and the emitted image bytes byte-for-byte. `cargo xtask repro` (previously `fail_closed`) is now simply `report_determinism()` called standalone — plans/M5.md decision 10's own \"no separate full-corpus form yet\" call, recorded here: every report-bearing golden is already the whole population either name covers at this milestone's scale, so inventing a second, larger population to walk would be gamed coverage, not real breadth. Verified this session: `cargo xtask repro` and `cargo xtask report-determinism` both print `5 case(s) reproduced byte-for-byte (report + image where present) across two runs` (`golden/appliance`, `golden/image-basic` — its own decision-10 refusal text, proving the oracle is equally meaningful on a rejected report — `golden/image-helper-accept`, `golden/image-project`, `golden/image-emit`), wired into `cargo xtask check` immediately after `golden`, unchanged from M4's own wiring point. Coverage note (the clause's own \"record what's covered now\" instruction, carried forward from decision 10's own text): this flip covers the *unsigned* image + report only — the signed triple (a real signature over the emitted bytes) is M8+ territory, not attempted here, and no wording in this note claims otherwise."

[[clause]]
id = "compiler.eval.matches-backend"
doc = "04-compiler.md#6"
status = "test"
tests = ["xtask:diff-eval", "golden/boot-hello", "golden/check-tests-arith", "golden/check-tests-program"]
note = "plans/M5.md item F, decision 9: FLIPPED from `gap` to `test` — `cargo xtask diff-eval` (`crates/xtask/src/main.rs`) is the batch oracle: for every golden case whose input typechecks and declares at least one bare `@test` (`TestKind::Comptime` — decision 2's own \"the comptime tier's own set\"; `@test(exhaustive)` is deliberately excluded from the comparison itself and counted in its own `exhaustive-skips` category instead, per the plan's own decision-2 sub-note), it compiles those same test fns into one runtime-test image (`layout::layout_test_image`, item E's own harness, reused verbatim — a bare `@test` fn is exactly the zero-arg shape that harness already runs), boots it once via the codesigned `wrela-vmm` binary, and compares each guest-printed report line against `eval::run_tests`'s own line for the same fn, byte for byte. Output: `diff-eval: <N> test(s) agree across <C> case(s), <S1> lowering-skips, <S2> exhaustive-skips, <S3> quota-skips` (every skip counted AND printed as it happens, never silent — the plan's own instruction). Full-corpus run this session: `16 test(s) agree across 3 case(s), 1 lowering-skips, 6 exhaustive-skips, 1 quota-skips` — zero disagreements found (the two implementations of the evaluator's own executable subset genuinely agree on every comptime-legal test that can be compared). The `1 lowering-skips` is `check-const-generic-struct`'s own already-disclosed item-B gap (\"lowering a struct-valued module `const` is not implemented yet\" — one of decision 2's sub-note's own named \"exotic const shapes\"), not a new finding. The `6 exhaustive-skips` are `check-tests-exhaustive`/`check-tests-exhaustive-counterexample`'s six `@test(exhaustive)` fns, per decision 2's own sub-note.\n\nA genuine, plan-unanticipated finding made while building this oracle, disclosed rather than silently worked around: `check-tests-mixed`'s `test_quota_exceeded` (a bare `while true: total = total + 1`) is comptime-legal and fails the evaluator with `eval::quota::MAX_STEPS`' own \"step quota exceeded\" — but the step/memory quota is a *comptime-tier-only* resource bound with no backend equivalent whatsoever (the naive A76 codegen has no step counter), so this fn lowers and codegens perfectly cleanly, then would spin forever on real hardware rather than ever disagree meaningfully. `diff_eval_over_cases` detects this from `eval::run_tests`'s own report line (the fixed substring `\"quota exceeded\"`) *before* ever building an image, excludes the fn from the image entirely, and counts it in a third, plan-unanticipated `quota-skips` category (`DiffEvalTally::quota_skips`, its own doc comment names this reasoning in full) rather than either attempting to boot it (a 30-second `WALL_CAP` timeout on every run, and a category error even if it completed) or silently folding it into `lowering-skips` (a materially different, dishonest reason: lowering does not fail here at all). Recorded here since the plan's own decision 9/2 text named only two skip categories; a third was a genuine, load-bearing discovery, not an invented one.\n\nSmoke subset wired into `check` (`diff_eval_smoke`, `DIFF_EVAL_SMOKE_CASES`): `boot-hello` (proves the whole build+sign+boot chain still works end to end on every `check` run, even though it contributes zero comptime tests of its own — decision 1's own runtime-only scope), `check-tests-arith`, `check-tests-program` (15 comptime tests between them: checked/wrapping arithmetic at every named boundary, structs, enums, `match`, loops, a generic fn) — the plan's own item-F text names these three cases by name. Smoke result this session: `14 test(s) agree across 2 case(s), 0 lowering-skips, 0 exhaustive-skips, 0 quota-skips`, `cargo xtask check` green with this step wired in immediately after `report-determinism`.\n\n**Note-update (plans/M6.md item H, decision 10 — \"diff-eval extended or honestly scoped for async tests\", the exit criterion this records): scoped, not extended, and the scoping needed no code at all.** The evaluator does not execute async (M3 scope, unchanged at M6), so an async `@test(runtime)` fn has no evaluator twin to compare against; nothing that CAN run in both tiers stopped being compared. The selection this fn already had turns out to express that exactly: a case contributes only its `TestKind::Comptime` fns, so M6's ten `boot-*` cases and `check-send-proven` reach the `comptime_names.is_empty()` arm and are **printed** as `no comptime-legal @test fn(s) ... — out of scope`, one line each, never silently dropped. Verified by a full-corpus run this session rather than assumed: `16 test(s) agree across 3 case(s), 1 lowering-skips, 6 exhaustive-skips, 1 quota-skips` — byte-identical totals to the item-F run above, i.e. the whole M6 async corpus joined the golden set without adding one disagreement, one silent skip, or one new skip category. The one shape that could have gone wrong and did not: a case mixing a bare `@test` with an async `@test(runtime)` (`check-tests-mixed` is exactly that, its runtime test sync; `err-test-async-bare-illegal` is the async-plus-bare case, and it is a *build error* by `comptime.legality.inferred`'s own rule, so it never reaches this oracle at all) — the comptime half is still compared normally, the runtime half still ignored, no interaction.\n\n**Note-update (plans/M9.md item BB, 2026-07-25): a real evaluator-vs-backend divergence that this oracle did not catch, and why that is a corpus fact rather than an oracle defect.** `?` was evaluated wrongly at comptime — `Err(e)?` yielded the error payload as the success value, `None?` panicked the compiler — while both lowering paths (`lower::lower_try_sync`, `flowwir_lower::lower_try_check`) were correct all along, since each destructures the operand's `Type::Result` before comparing the tag against `RESULT_OK`. A one-sided divergence in the tier this oracle exists to police, sitting in the tree while `diff-eval` reported full agreement every run. The cause is not the comparison: it is that no golden case carried a comptime-legal `@test` whose evaluation crossed a *failing* `?`, so there was nothing to disagree about. An oracle over a corpus is exactly as strong as the corpus, and \"N tests agree\" is evidence about the N, never about the language. plans/M9.md item BB's `check-try-err-propagates` and `check-try-ok-unwraps` close this specific hole — their `@test` fns lower cleanly, so a full-corpus `diff-eval` now boots and byte-compares them — and `check-try-none-propagates`/`check-try-some-unwraps` are counted as honest lowering-skips, `?` on `Option` having never lowered at all. Recorded here rather than only in comptime.eval.try-propagation because the finding is about *this* clause's reach: the number this oracle prints is a floor on agreement, not a proof of it.\n\n**Note-update (plans/M9.md item EE, 2026-07-25): the sharper version of BB's corpus sentence — the oracle was advertising a scope it did not have.** Before EE, `typecheck_single_module` returned `None` on `!module.imports.is_empty()` and the caller `continue`d with **no output and no tally entry**. Every multi-module golden this milestone produced — `check-try-import`, the `check-import-comptime-*` family, `check-stdlib-loaded`, DD's alias cases, and from A2 the entire stdlib path — contributed nothing, while the summary line printed `N test(s) agree` with no hint that a whole compilation mode was outside it. That is BB's \"an oracle over a corpus is exactly as strong as the corpus\" one level worse: here the oracle claimed a scope it silently refused. EE's preferred half replaces the silent skip with `loader::load_closure` + `sema::check_program_typed` (the same fork `bin/wrela.rs::check_closure` / `produce_report_and_image` already use, deliberately parallel rather than a third library surface) and compares evaluator against guest on multi-module cases that declare comptime `@test`s. Summary line gains `import-skips` so a residual that genuinely cannot build is never silent again. Verified this session: before EE `37 test(s) agree across 8 case(s), ...`; after, `41 test(s) agree across 9 case(s), 13 lowering-skips, ..., 0 import-skips` — the +4 are `check-import-lower`'s four `@test`s (the first time the stdlib's guest path has an oracle at all for an imported struct/fn). DD's two alias cases newly *enter* scope and fail closed at codegen (`unknown struct/enum \\`Cnt\\`/\\`Hue\\` in this layout context`) — counted as lowering-skips, named, not divergences: `merge_layout_ctx` keys layouts by the exporter's AST name, while the typed tree uses the local alias (decision 9), so layout never sees `Cnt`/`Hue`. Recorded rather than papered over by narrowing the scope just widened."

[[clause]]
id = "compiler.costs.predicted-vs-measured"
