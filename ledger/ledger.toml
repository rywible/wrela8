note = "plans/M5.md item C: `mwir::MwirProgram` -> per-fn A76 machine code, `crates/wrela-compiler/src/codegen.rs` (new; `lib.rs` gains one `pub mod codegen;` line), dumped stably via `wrela dump --stage=asm` (`bin/wrela.rs`'s new stage arm, structurally parallel to `--stage=mwir`: lex/parse/`check_typed`/`lower::lower_program`, then `mwir::build_layout_ctx` — the one whole-program struct/enum field-type fact this stage needs beyond mwir itself — then `codegen::codegen_program`, then `codegen::dump`; a lowering or codegen rejection prints the same one-line `error[unimplemented]: ...` house style every other fail-closed stage already uses). The locked property this clause names is decision 4's own dumbness, not any cleverness: every mwir temp gets a fixed, 8-byte-aligned frame slot (`build_frame`, one region per temp in temp-number order, sized via `mwir::size_of`); every instruction loads its operands from slots into one of six fixed scratch registers (`x9`-`x14`), computes, stores the result slot back — no liveness analysis, no register reuse across instructions, no peephole, no instruction scheduling. The `--stage=asm` dump makes this observable directly: every one of the seven golden cases below shows the full spill/reload traffic for even a two-operand add, and the dump's own hex-first-per-line format (`NNNN: <hex u32>  <mnemonic>`) is the review surface a smarter emission would have to visibly break. Any future optimization pass is CLAUDE.md's own cleverness-budget path (a profile, a before/after on a recorded workload, a regression lock) — nothing here buys that budget, on purpose.\n\nEmission is two passes per fn (module doc's own worked rationale): pass 1 measures the fixed-shape prologue's own word count plus, for every mwir instruction, how many machine words it expands to (a static function of instruction shape/operand types — jump-target *values* never affect word count, only whether a target is reachable at all, which every function in scope here trivially is); pass 2 re-runs the identical per-instruction emission with the now-known `word_offsets` table, so every local `Jump`/`JumpIfFalse`/`Return`-to-epilogue resolves to a real PC-relative `B`/`CBZ`. A `Call`'s own target and every rodata reference stay symbolic at this stage (`Reloc::Call`/`Reloc::Rodata`, a placeholder `#0` immediate plus a fixup record item D's layout pass must resolve once the whole program is laid out into one flat blob) — the dump shows these as `bl <key>`/`adrp x9, rodata+0x18` exactly as the plan's own \"symbolic refs\" note describes.\n\n**Frame layout** (documented in full at the top of `codegen.rs`): SP-relative throughout (no frame pointer — `x29` is never touched, an internal-only ABI with no unwinder to satisfy), `[temps][self_ptr_save?][ret_ptr_save?][saved x30]`, rounded to 16; a frame whose rounded size would exceed 4095 bytes fails closed (the `ADD`/`SUB`-immediate `imm12` range), nothing in the required corpus comes close. **Calling convention** (AAPCS64-*shaped*, decision 4's own \"document the exact dumb rule\"): scalars by value in `x0`-`x7`/`x0`, aggregates by a bare pointer to the *caller's own* temp slot (never a defensive scratch copy — safe because a callee always copies an incoming aggregate's bytes into its own local slot at entry and only ever mutates that local copy, `codegen.rs`'s own \"canonical-slot\"/calling-convention doc section proves this in full), an aggregate result via `x8` pointing directly at the destination temp's own slot. More than 8 arguments fails closed (named, `CodegenError::unimplemented`); nothing in the required corpus needs stack args. `self_write_back`/`mut self`: proved (not merely asserted) to need no special call-site handling at all — the uniform bare-pointer rule plus the callee's own `MwirFn::receiver`-mode-driven epilogue write-back satisfies it automatically, so `Inst::Call::self_write_back` is read nowhere in this module; `asm-struct`'s own `Point.init`/`Point.shift` (both `mut self`) and `Point.sum` (`read self`, no write-back) are the golden proof each path does what it should.\n\n**The abort contract for item E** (`codegen.rs`'s own \"The abort contract\" doc section is the exact obligation, restated briefly here): `__wrela_abort(x0=msg_ptr, x1=msg_len) -> noreturn` for every fixed-at-compile-time message (ordinary/wrapping overflow, div/rem-by-zero, div `MIN/-1`, negation overflow, `.to[T]()` out-of-range, `<<` lost-bits, `assert`/`panic`/match-fallthrough); `__wrela_abort_val(x0=prefix_ptr, x1=prefix_len, x2=value, x3=value_signed, x4=suffix_ptr, x5=suffix_len) -> noreturn` for the two runtime-value-interpolated messages (`Shift`'s out-of-range count, `IndexGet`/`IndexSet`'s out-of-bounds index) — both called via `BL` with a placeholder target (`Reloc::AbortFixed`/`Reloc::AbortVal`), uniformly with every ordinary call, never inlined.\n\n**Overflow detection per op class** (`codegen.rs`'s own module doc has the full worked reasoning; summary): narrow (`<64`-bit) checked `+ - *` compute at full 64-bit width (always safe — sign/zero-extended `<64`-bit operands can never make the true sum/difference/product itself overflow 64 bits, the exact same trick `eval::value` plays with `i128`, one register width narrower) then bounds-check the raw result against the target type's own `[min,max]`; 64-bit-width `+ -` read `ADDS`/`SUBS` flags (`Vs` signed, `Cs`/`Cc` unsigned add/sub); 64-bit `*` uses `SMULH`/`UMULH` (new `encode.rs` functions, see below) to compare the product's high word against the low word's own sign-extension (signed) or zero (unsigned); `/ %` always check divisor-zero first, and signed `/` additionally does an *explicit* `lhs == MIN && rhs == -1` pre-check uniformly at every width (not a post-divide bounds check — ARM's `SDIV` silently wraps `i64::MIN / -1` back to `i64::MIN` itself at 64-bit width, defeating any check computed after dividing, so the explicit pre-check is the only form correct at every width, used at every width); shifts do the range check (`count < 0 || count >= bits`) as one *unsigned* compare (a negative signed count, reinterpreted unsigned, is always far larger than any `bits <= 64` — a correctness technique, not a profiled optimization) and `Shl`'s own \"lost nonzero high bits\" check guards `count == 0` first (the one case that would otherwise falsely trip at `bits == 64`, where a shift-by-a-multiple-of-64 is architecturally a no-op) before computing `bits - count` and testing the truncated value's own high bits. Every discrepancy this session found between 02-language.md §6.1's prose and `eval/value.rs`'s actual code: none — `int_bounds_i64`/`int_shape` and every check above were derived directly from `eval::value::eval_ordinary`/`eval_div_rem`/`eval_shift`/`eval_neg`/`eval_to_scalar`'s own Rust, not the doc prose, per CLAUDE.md's \"where interp.rs and the doc disagree, interp wins\" rule; no disagreement was found to arbitrate.\n\n**`encode.rs` extension**: `enc_smulh`/`enc_umulh` (two new pure functions, same `MUL`/`MSUB` \"Data-processing (3 source)\" ARM ARM class, `op31 = 0b010` instead of `0b000`, `Ra` fixed `31`) plus their own hand-verified unit tests (`smulh_umulh_forms`) — the one instruction class item A's subset genuinely omitted that 64-bit checked multiplication cannot be implemented without (no 128-bit register exists to hold a full widening product any other way); the existing `encoding_table_golden` test and every other existing `encode.rs` test are untouched. `compiler.encode.a76-pinned` (above) is flipped from `gap` to `test` in this same commit, citing these same seven goldens, exactly per that clause's own named flip condition.\n\n**Fail-closed list** (deliberately tiny — `codegen.rs`'s own module doc has the full reasoning): any floating-point value/operation (`encode.rs` never gained an FP/SIMD encoder subset; verified directly that none of the seven reused `mwir-*`/`asm-*` inputs declare an `f32`/`f64`); `ConstText`/`Static[Str]`/`Static[Bytes[N]]` (inherits `mwir::size_of`'s own already-disclosed \"bare `Str` has no static size\" gap rather than inventing a new layout); more than 8 call arguments; a frame over 4095 bytes; sizing a temp `mwir::size_of` itself cannot size (passed through as `mwir::size_of`'s own `Err`, unchanged).\n\n25 unit tests in `codegen.rs`'s own `#[cfg(test)]` module (frame-slot assignment for a plain scalar-only fn and one with a `mut`-receiver aggregate, a frame-too-large fail-closed case, an exact 13-word sequence for `fn answer() -> u64: return 42`, a symbolic-call-reloc test, narrow/wide/signed/unsigned overflow-branch-shape tests for `+ - * /`, a shift-range-check test, rodata content-dedup and cross-fn-sharing tests, a two-fresh-builds determinism test, and the float/too-many-args fail-closed tests) plus 163 total in `wrela-compiler` (up from 146 pre-item-C, encode.rs's own new pair included) all green. Golden family: `golden/asm-arith`/`asm-struct`/`asm-enum-match`/`asm-loop`/`asm-calls`/`asm-generic`/`asm-take` — each `input.wr` copied byte-for-byte from the matching `golden/mwir-*` case (never moved) so the mwir/asm dumps of the identical program stay co-reviewable side by side; `cargo xtask golden` confirms 201 expectations total (194 pre-existing unmoved + 7 new `asm.txt` additions)."

