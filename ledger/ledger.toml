id = "build.root-file-closure"
doc = "02-language.md#2.1"
status = "test"
tests = ["golden/multi-module-accept", "golden/import-cycle-accept", "golden/err-import-path-disagreement", "golden/err-import-missing-module", "golden/err-import-core-miss", "golden/appliance"]
note = "plans/M4.md item A: `crates/wrela-compiler/src/loader.rs` — no manifest (02 §2.1, rewritten 2026-07 by human decision, replacing the wrela.toml schema): a build (and, per this item, any tool resolving imports — `wrela dump --stage=check` once the target module has any) is pointed at one root file; its declared `module a.b.c` path must agree with its file path (the file name is the path's last segment, each enclosing directory innermost-first is the next segment up, whatever directory remains once every segment is consumed is the package root — applied to *every* file the closure reaches, not just the root: `loader::anchor_package_root`/`loader::check_agrees`), and disagreement anywhere is `error[build]: module \\`X\\` disagrees with its file path: ...` (golden/err-import-path-disagreement: a root declaring `module app.main` sitting at `src/app/other.wr`). The module graph is the transitive import closure of the root: each `from path import ...` maps to `<pkgroot>/<path with dots as slashes>.wr` (`loader::module_file_path`), loaded if not already visited — a missing file is `error[build]: module \\`X\\` not found: no such file` (golden/err-import-missing-module; deliberately omits the resolved filesystem path from the message — see below) — and the visited set (the loaded map's own keys) makes import cycles between modules free (decision 3, amended 2026-07-23: 02-language.md §2 already settles this, \"import cycles between modules are legal\" — golden/import-cycle-accept, two modules importing each other, loads and checks cleanly). `core` resolves under its reserved alias with no declaration (02-language.md §2): `from core.X import ...` strips the `core` segment and maps the rest onto the toolchain's `stdlib/` tree (`stdlib/README.md`: the whole tree *is* the `core` package, so `stdlib/bytes.wr` declares plain `module bytes`, agreeing with its own path under `stdlib/` as *its* package root); locating `stdlib/` itself uses the dumbest deterministic two-candidate rule, in this fixed priority, no environment variable, no search path (`loader::core_root`, unit-tested directly): (1) a directory literally named `stdlib` sitting next to the package root (lets a self-contained project — this repo's own golden fixtures included — ship its own), else (2) the real toolchain `stdlib/`, baked in at compile time via `crates/wrela-compiler`'s own `CARGO_MANIFEST_DIR` (`.../../../stdlib`) — wherever the compiled `wrela` binary actually runs from. Importing anything from `core` that does not exist on disk fails the same missing-file diagnostic (golden/err-import-core-miss: `from core.nothing import X`) — deliberately never printing the resolved path here either: candidate (2) bakes in *this checkout's own absolute location* at compile time, which would make a pinned golden fail in any other clone the moment that location differs, so both missing-file messages cite only the dotted module path (stable everywhere) and never `Path::display()`. `wrela dump`'s own wiring (bin/wrela.rs): a module with no imports takes the exact single-file path unchanged (the hard constraint every pre-M4 golden depends on — none moved); a module with any import loads its whole closure through the loader instead, since resolving even one import needs the package root and every module it reaches — golden/multi-module-accept exercises 3 modules across nested directories, aliased imports, and a private (non-imported) sibling declaration side by side with a real accepting build. Unit tests (`loader.rs`, `#[cfg(test)]`, pure — no process spawn): the path-agreement rule at one/two/three segments and its two failure shapes (stem disagreement, directory disagreement), `module_file_path`'s dots-as-slashes join, `core_root`'s sibling-first-else-fallback priority (using real temp directories, since the rule itself is a filesystem check), and the visited-set walk's own cycle termination in isolation from any real file.\n\nplans/M4.md item E note (2026-07-23): the loader now has a real CLI end to end, not just `wrela dump --stage=check`/`--stage=image`/`--stage=report` inspection stages — `wrela build <file.wr> [--out-dir <dir>]` (`bin/wrela.rs::build_cmd`) runs the identical single-file/whole-closure fork this clause already covers, then the shared `build_report` pipeline tail (`run_report_stage`'s own former body, now factored out so `wrela dump --stage=report` and `wrela build` can never silently drift apart), and — unlike every `dump` stage, which stays exit-0-by-convention even for an error dump — exits nonzero on any diagnostic, the loader's own `build`-category ones included. `golden/appliance/expected/build.txt` is the flagship end-to-end proof: `wrela build tests/golden/appliance/src/image.wr` against a fresh, deterministically-named `--out-dir` (`crates/xtask/src/main.rs`'s golden runner, extended with a `build.txt`/`build-err.txt` case shape) succeeds, writes `storage-appliance.report.txt` byte-identical to the pinned `expected/report.txt`, and prints the fixed summary lines `build: name=storage-appliance target=Target.wrela_machine_v1` / `build: devices=1 drivers=1 actors=2 pools=1` / `build: report written to <path>` — the report path printed exactly as derived from the invocation's own `<file.wr>`/`--out-dir` argument text, never canonicalized, so it stays golden-stable. `golden/err-image-unsupervised`/`golden/err-image-dma-pool` each grew their own `expected/build-err.txt` (image.graph.supervision-one-parent's and image.graph.dma-pools' own rejection text, verbatim, exit nonzero) proving the CLI's failure path end to end too."

