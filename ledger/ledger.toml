**Shipped (plans/M10.md item A2c, decision 588).** The image report publishes `PlacedStatic name= type= addr= size=` for every placed static (`layout::collect_placed_statics` / `render_layout_section`). Machine-page placements are verified by publishing the address used in codegen rather than writing image-blob bytes (the VMM already owns those pages). Duplicate ADDR is a named build error (`golden/err-placed-duplicate-addr`). Positive pin: `golden/check-placed-machine-info` (`PlacedStatic ... addr=0x40000000` plus asm movz/movk + ldr at offset)."""
