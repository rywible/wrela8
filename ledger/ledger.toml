# --- value model ----------------------------------------------------------

[[clause]]
id = "values.data.copies-implicitly"
doc = "02-language.md#3"
status = "test"
tests = ["golden/check-flow", "golden/err-move-copy-resource"]
note = "the flow pass (plans/M2.md items E/F, sema/flow.rs) is the one place decision 9's \"data may copy implicitly, taking data is not\" and \"copying a resource implicitly is the error\" are both enforced by the same rule: any binding/storing use of a place (an assignment source, a `return` expression, a struct-literal/enum-variant/pseudo-constructor field, a tuple/array/list element) that is a bare place expression without `take` is `error[move]: ... is a resource; use \\`take\\` to move it here` exactly when that place's type classifies as a resource (types.rs's classification, reused as-is); a data-typed place in the same position is never flagged (golden/check-flow's `copy_data_freely` copies the same `u64` local twice with no marker) — the *loan* forms (`read`/`mut` through a real declared parameter) are unaffected either way, since a loan was never a copy to begin with (golden/check-flow's `inspect_packet(p: Packet)` observes a resource by plain read)."

[[clause]]
id = "values.resource.move-spells-take"
doc = "02-language.md#3"
status = "test"
tests = ["golden/check-flow", "golden/err-move-use-after-take", "golden/err-move-overwrite-live", "golden/err-move-index", "golden/err-x-for-take-borrowed", "golden/err-x-for-take-mismatch", "golden/err-x-for-take-element-borrowed", "golden/check-x-for-take-consume", "golden/err-x-for-take-reuse"]
note = "`take place` (sema/flow.rs's `check_takeable`) deinitializes its place — reading a since-taken place is `error[move]: \\`place\\` was already taken at L:C` (golden/err-move-use-after-take); overwriting a place that currently holds a live resource without first moving it is `error[move]: ... still holds a live resource; move it or finish it before overwriting at L:C` (golden/err-move-overwrite-live, 02-language.md §3.1's \"move it or finish it first\" — overwriting live *data* is never checked, decision 9); moving out of an array through a runtime (non-literal) index is always `error[move]` (golden/err-move-index — a constant-literal index, golden/check-flow's `const_index_move`, is fine). A `take` of a field of `self`/a parameter must be restored (every not-`Init` path under it resolved) before that root is next used whole or the function returns — but only for a `mut`-mode (borrowed) root; a `take`-mode parameter or an ordinary local is owned outright, so a partial move surviving to its own exit is fine (values.resource.protocol-consumption's own \"no consume obligation\" reasoning, decision 5) and is deliberately not flagged. Per decision 9, `take` moves a data place exactly the same as a resource one (golden/check-flow's `take_data_too`); a match/`is` pattern's `take` payload moves the whole scrutinee place (exact for an enum — a sum type has one active payload; a conservative, sound over-approximation for a tuple/array pattern, flagged in the session report). Pre-M3 finding #2 (plans/pre-M3-findings.md) fixed: `for`/`while`'s `take_binding` AST field is now read — `access::check_for` requires the binding's own `take` and the iterable expression's `take` to agree (02-language.md §3.2's \"Consume an array whole with `for take x in take array`\" names exactly one sanctioned combination; a `take` binding over a non-`take` iterable would move elements out through a runtime index, forbidden regardless of ownership — golden/err-x-for-take-borrowed; a `take`n iterable with a plain binding is the mirrored mismatch — golden/err-x-for-take-mismatch), and a *plain* (non-`take`) binding over a resource-typed array element is bound as a `read`-mode loan (blocking a further `take` on it — golden/err-x-for-take-element-borrowed, the original minimized repro) rather than an unrestricted owned local; a data element stays an ordinary unrestricted copy. The sanctioned `for take x in take array` form (golden/check-x-for-take-consume, alongside the legal plain-read-loan form) was already correctly deinitializing the whole iterable place via the ordinary take-expression path in `flow.rs`'s `walk_for` (verified, not changed) — reusing the array afterward is `error[move]: ... was already taken` (golden/err-x-for-take-reuse)."

[[clause]]
id = "values.exclusivity.no-overlap"
doc = "02-language.md#3"
status = "test"
tests = ["golden/err-overlap-two-muts", "golden/err-overlap-mut-read"]
note = "02-language.md §8.2's evaluation-order rule, scoped to exactly what it documents (call-expression argument lists plus the receiver, nothing invented beyond it): a receiver evaluates first (its access activates per the callee's effective receiver mode, `access::resolve_receiver_mode` reused verbatim), then arguments in source order; once an operand activates `mut`/`take` on a storage path (paths.rs), any later operand in the same call whose path overlaps it — another `mut`, a `take`, or a plain read — is `error[overlap]: \\`a\\` overlaps \\`b\\`, still exclusively active earlier in this call at L:C` (golden/err-overlap-two-muts: two overlapping `mut` arguments; golden/err-overlap-mut-read: a `mut` argument followed by a later plain read of the same path). Two plain reads never conflict (a read is a loan, `02-language.md` §3's own table)."

[[clause]]
id = "values.teardown.defer-valid-at-exit"
doc = "02-language.md#10"
status = "test"
tests = ["golden/err-defer-moved-at-exit", "golden/err-defer-taken-by-defer", "golden/check-defer-exits"]
note = "Closes plans/pre-M3-findings.md finding 1: a `defer`'s named places are now re-validated against every real exit its registration is still in scope for (02-language.md §10: \"its accesses activate when it runs, not when it is registered ... the compiler verifies the places it names are valid at every exit\"), not just once at registration state. Mechanism (sema/flow.rs): `walk_block` threads a `DStack` — a true call stack of `&DeferStmt`, in registration order — through the whole body walk; `Stmt::Defer` pushes onto it (no check at registration anymore); a block's own normal completion (`walk_block`'s own end, before it pops back to its entry length) and every `return`/`?`/`break`/`continue` reached after a defer's registration re-validates the currently active defers via `check_active_defers`, which reuses the same `walk_expr`/`walk_block` machinery that checks an ordinary statement (no separate place-collection pass). Reverse-registration-order sequencing (02-language.md §10's \"in reverse registration order\"): at one exit, the defers active there are walked back-to-front, threading one running state clone through each one's own body-walk in turn, so a later-registered/earlier-run defer's own effects (a `take`, say) are visible to whichever earlier-registered/later-run defer is checked next — golden/err-defer-taken-by-defer pins exactly this (the second-registered defer takes the place the first-registered one only reads; the first-registered one, checked second per reverse order, sees it already gone). golden/err-defer-moved-at-exit pins the finding's own minimized repro (a defer reads a place a conditional branch takes before returning — rejected now, where it was silently accepted before this clause). golden/check-defer-exits pins the legal twins: take-then-restore on every path before each of two real exits, a place restored unconditionally before the defer is even registered, and a defer registered after a conditional take+restore (every path already coherent by the time it's registered). Block scoping: a defer is scoped to its own literal enclosing block (registered/popped by that one `walk_block` call) — once that block's own exit is checked, the defer is no longer active for code that follows outside it (matching \"registers ... against the enclosing block\" literally); `return`/`?` always check the *whole* active stack (they exit the entire function, unwinding every enclosing block), while `break`/`continue` check only the slice registered since the nearest enclosing loop was entered (a `loop_marker` index) — a defer registered outside the loop stays pending for a later real exit (verified: a defer outside a loop, violated by a `take` right before a `break`, is correctly NOT caught at the `break` but IS caught at the function's own later `return`). Loops: a defer inside a `for`/`while` body registers fresh every fixed-point re-walk of that body (the same `walk_block` call each pass) and is popped at that same call's own end, so it validates per-iteration exactly like any other statement the fixed point re-walks — no separate bookkeeping needed. Diagnostics reuse the underlying `check_readable`/`check_takeable` category/message/span verbatim (`error[init]`/`error[move]`, same voice as every err-init-*/err-move-* golden) with one added `extra_lines` entry naming the defer and which exit ran it (`this \\`defer\\` must be valid at every exit, including a \\`return\\`/\\`?\\`/\\`break\\`/\\`continue\\` exit` or `this block's own normal completion`) — deliberately with no raw `line:col` text in that added line (unlike the primary message/span), since `sema.check.roundtrip-stable`'s oracle compares diagnostics with spans erased and only strips the one `\" at <path>:<line>\"` tail shape sema/generics.rs's own chain diagnostic uses; embedding a bare `L:C` here made an otherwise-identical diagnostic disagree after a pretty/reparse round trip (caught live by `cargo xtask fuzz sema`, seed=1, iteration 110, during this session — fixed before landing, not a residual gap). No wrong-reject found against 02-language.md §10's own \"a deferred action that needs a moved-and-returning resource simply waits for it\" clause: that sentence describes the *runtime* cleanup-dependency-graph's scheduling (04-compiler.md §4, M4/M6 machinery — a moved-out-and-later-returned resource's cleanup is deferred until it's back, not rejected), not a static legality question, and every case actually probed here (plain moved-place-at-exit bugs, per the findings doc's own framing) is a genuine, permanent move with no returning path in scope, so the dumb static rule (valid after applying earlier-run defers' effects, at every exit) never collides with it in the M2 corpus."

[[clause]]
id = "values.resource.protocol-consumption"
doc = "02-language.md#3.1"
status = "gap"
note = "every M2-expressible resource type is a \"plain resource struct\" (or a pool handle) — a compiler-known, non-failing reclaim the compiler runs automatically at block exit/`?`/cancellation/abandonment (02-language.md §3.1's first bullet) — so no M2 type ever needs the second bullet's consume-on-every-path obligation (protocol resources: capabilities, permits, receipts). Flow (sema/flow.rs) therefore never requires a live resource to be explicitly consumed/`defer`-covered before a block/function exits; a live resource at exit is fine, full stop (a partially-moved `mut`-mode self/param field is the only thing flow does still require restored — values.resource.move-spells-take — and that is a coherence obligation to the borrow's caller, not a consumption one). Protocol resources are stdlib/M7 types with no M2 constructor, so this stays an explicit, honest gap rather than a silently-passing test until the stdlib milestone introduces one."

