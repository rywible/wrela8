note = "plans/M6.md item A: sema now types the actor-call surface `await` composes over — `Actor[T]` (`sema::types::resolve_named`'s new arm, arity 1, structural — a whole-module post-declare pass, `validate_actor_handles`, rejects any `Actor[T]` whose `T` does not name an `@actor`/`@driver` struct, since the classification bit that answers that — `DeclStruct::is_actor`, this item's own addition, distinct from `is_resource_fiat`, which conflates plain `resource struct` with actor/driver — is not known until every item in the module has been declared); `await` (`sema::bodies::check_await`), scoped to exactly the doc's own two awaitable shapes at M6 — a public method call through an `Actor[T]` handle, or a `with group(...) as g:`'s own `g.join_all()` — anything else (a bare free-fn call, a self-call to an async method, a private method through a handle) is a named `error[actor]`/`error[type]`, not a silent widening. Composition is the CallError table verbatim (`bodies::compose_call_error`): declared `R -> Result[R, CallError[never]]`; declared `Result[T, E] -> Result[T, CallError[E]]`. `CallError[E]` is carried as a plain `Type::Named(\"CallError\", [TypeArg::Type(E)])` (not a dedicated `Type` variant like `Option`/`Result` — its own generic argument is exactly one type, same shape either representation would need, and `Type::Named` is already the established vehicle for every other M6 builtin pseudo-type — `Actor`/`Group`/`Instant`/`Duration`/`Rejected`/`Admission`/`Peer`); its own five fixed variants (`Op(E)`/`Cancelled`/`DeadlineExceeded`/`NotAdmitted(Admission)`/`PeerFailed(Peer)`) are recognized directly wherever a scrutinee's type says `CallError` by name — `bodies::variant_payload_types_for`'s new arm (pattern typing) and `matches::shape_of`'s own mirror (exhaustiveness) — the `builtin_enum_variants` precedent (`Target`/`Restart`), extended to non-empty payloads (which those two fieldless enums never needed). `Admission`/`Peer` are opaque builtin payload types (M7 grows their own fields; matching the *variant* is the whole of M6's job, per the plan's own scope line). Variant erasure (decision 8) ships nothing at M6: no whole-image analysis proves a variant unreachable yet, so every composition keeps the full five-variant sum — recorded, not silently narrowed. `g.join_all()`'s own raw (pre-`await`) type is `[R; N]`/`[Result[T,E]; N]` (`N` the number of *static* `g.start` call sites found in the `with`-body — `bodies::compute_group_children`, a pure recursive scan over the raw ast, deliberately **not** an incremental count threaded through `sema::bodies::FnCtx` as the body is walked: `matches.rs`/`flow.rs` both re-derive their own separate `FnCtx` and re-invoke `bodies::check_expr` on individual sub-expressions out of full sequence — a plain assignment's inferred type, a `match` scrutinee — never replaying the whole preceding body through it, so any state a `g.start` call would otherwise need to mutate incrementally could never reach a later `join_all` checked by one of those other passes; a pure, order-independent pre-scan, computed identically and independently by all three passes at their own `with`-block entry, is what actually works); `await` then composes `CallError` element-wise over the array. Every child `g.start` call in one group must share one declared return type (M6 scope, named if violated). Cross-await access rule (02-language.md §9.2 — \"a whole-value access rooted at the current actor may live across `await`... but an access rooted in an external argument may not\"): shipped as the dumbest sound approximation, `bodies::check_cross_await` — a straight-line forward scan over an async body's already-typed statements threading one `seen_await` flag (conservatively shared across sibling branches: an `await` in one `if` arm taints every statement lexically after the whole `if`, even a sibling arm with none — over-rejects a little, never under-rejects); any nested `Field`-chain access whose root local is not exactly `self`, found once `seen_await` is set, is rejected (`golden/err-await-external-path`, `omit_location: true` since the typed tree carries no spans, decision 1, so no real `L:C` exists for this diagnostic); a self-rooted chain crossing the same await is accepted (`golden/check-await-self-path`). `await`/`send`/`with group` all additionally require the enclosing fn/method to itself be `async` (`FnCtx::in_async`, set once from `is_async` everywhere a body-checking pass builds its own `FnCtx` — `bodies::check_top_fn`/`check_struct_members`, and their `matches.rs`/`flow.rs` mirrors, all three needed since each pass re-derives its own `FnCtx`) — a plain `fn` \"never suspends\" (02-language.md §5), so `await` inside one is a named rejection (`golden/err-await-outside-async`), not merely unrepresentable. `now()`/`ms(n)` (decision 11): both a `TypedExprKind::Intrinsic` (the `img.*`/`seconds`/`RestartIntensity` precedent, `sema::bodies::check_call_by_name`) — `ms(n)` is a pure, comptime-legal `Duration` constructor (evaluated for real, `eval::interp::eval_intrinsic`'s own new arm, mirroring `seconds` one order of magnitude down); `now()` is runtime-only, a dedicated new `eval::legal` illegal-reason arm (`golden/err-now-in-comptime`, reached transitively through a helper fn a `comptime assert` calls — the identical propagation `comptime.legality.inferred`'s own note already describes for `@image` intrinsics). A group's `deadline=now() + ms(...)` is checked directly (`bodies::check_deadline_expr`), not through the ordinary same-type-operand `check_binary` (which decision 4 requires both sides to share one type — `Instant + Duration` deliberately is not that): the primitive `Binary` node is reused for the sum regardless, confined to this one call site. Decision: free (top-level, module-level) `async fn`s ARE in-scope (02-language.md §5's own worked example; §9.5's `g.start(fetch_part, ...)` names exactly this shape — a same-module top-level `async fn` started as a group child); what is *not* a documented shape is an `async fn` with no receiver *inside* a struct (`error[unimplemented]`, `golden/err-async-free-fn` — an associated fn is neither an actor method nor a spellable `g.start` target). `eval::legal::classify`'s own `insert_fn_node` gained a new unconditional rule: an `async fn`'s own color is itself an async operation (02-language.md §12: \"free of ... async/actor operations\" names the fn, not merely its statements) — illegal for comptime regardless of body content (`comptime.legality.inferred`'s own note carries the resulting `check_test_legality` interaction, `golden/err-test-async-bare-illegal`: a bare `@test` on an `async fn` is a hard build error, the existing M4-B `check_test_legality` mechanism's first real exercise of this exact shape, not a new rule). `TypedFn` grows `is_async: bool` (mirrors `types::DeclFn::is_async`, not rendered by `--stage=typed`'s own dump — bookkeeping only, same reasoning as `TypedStruct::fields`) so `classify` can read it directly. `cargo xtask check` green (fuzz sema/eval/lower each 200_000 iterations × 2 seeds, clean); every pre-existing golden byte-identical except the two explicitly cited in `image.graph.init-args-match`'s own note (the M4-C `Actor[T]` placeholder retirement) and `golden/err-unimplemented-await` (now a real, more precise `error[actor]` rejection instead of the old blanket `error[unimplemented]`, since `await` genuinely type-checks now).\n\n**Note-update (plans/M6.md item H, 2026-07-24, an orchestrator verification probe — a fail-closed violation, fixed): `validate_actor_type` discarded `Actor[...]`'s own inner type arguments** (`let Type::Named(actor_name, _) = inner`), so a handle naming a *generic instantiation* — `Actor[Box[u64]]` for an `@actor pub struct Box[T]` — passed well-formedness on the strength of the generic base struct's own `is_actor` bit alone, and the type arguments then existed nowhere downstream. Two symptoms, both reproduced from ordinary source before the fix, neither disclosed anywhere: (a) when the awaited method's declared return type mentions the parameter (`pub async fn get(read self) -> T`), the reply composed as `Result[T, CallError[never]]` with `T` *unsubstituted*, surfacing as `error[type]: expected `u64`, found `T`` — a wrong-cause diagnostic naming a type parameter that is not in scope at the use site; (b) when the return type is concrete (`-> u64`), `--stage=typed` **accepted the program** and `--stage=flowwir` then failed with `error[unimplemented]: internal error: unknown struct `Box`` — `flowwir_lower`'s own \"should be unreachable for any `check_typed`-accepted program\" producer-bug guard, i.e. exactly the `\"internal error: \"` prefix `compiler.fuzz.lower-lane`'s own invariant (c) classifies as `LowerFuzzOutcome::Bug`, reached from plain source. Identical for a sync method through the same handle (`--stage=mwir` renders an empty `Program`: the actor-call path never registers a `TypedInstantiation` for `Box[u64]` at all, which is the shared root cause of both symptoms — the callee key spells the generic *base* name). Fixed at the one choke point that still has the type arguments in hand: a non-empty argument list on the inner named type is now a named `error[actor]` (`golden/err-actor-generic-handle`), the M6 surface's own already-disclosed \"no async generic exists\" boundary (`flowwir.rs`'s module doc) failing closed instead of open. Counterexample run and confirmed failing-as-intended: the byte-identical program with `[T]`/`[u64]` dropped lowers to FlowWir cleanly, so the rejection is scoped to the type arguments, not to actor handles generally. The `@image` path was probed too and was already honest (`error[unimplemented]: generic instantiation is not checked yet`, `eval::image_checks`) — this hole was reachable only through the stage dumps and `check`, which is why no boot golden ever saw it. Why no fuzz lane caught it in 2,000,000 iterations × 3 fresh seeds: `attempt_layout`'s own doc comment already discloses that the lower lane never calls `flowwir_lower::lower_program` at all, so the async pipeline has no fuzz coverage whatsoever — a pre-existing, named gap (\"Extending this lane to the async pipeline is real, further work\"), left for the post-roadmap coverage pass rather than grown into item H; this golden at least puts the generic-actor shape into `corpus_seed_inputs`' own mutation material.\n\n**Note-update (plans/M6.md item H1, 2026-07-24) \u2014 this clause was claiming more than it proved, and the gap held a wrong answer.** Every test cited above is a `check-*`/`err-*` sema or dump golden: they prove the *typing* of `declared Result[T, E] -> Result[T, CallError[E]]` and never once its runtime value. The adversarial sweep booted it, and both paths arrived as `.Ok`: the turn record carries ONE scalar reply word, an aggregate return is passed by pointer under this machine's calling convention, and `Await`'s composition re-labelled that raw pointer as `Ok(<guest address>)` \u2014 so a declared `Err(FsError.Bad(107))` was observed as a success carrying an address. Reproduced independently by the orchestrator with its own minimal program; the comptime evaluator runs the identical source correctly, so the two tiers genuinely disagreed. No oracle spanned them: no golden boots an actor method declaring `Result[T, E]`, and decision 10 gives async runtime tests no evaluator twin, so `diff-eval` cannot see it either.\n\nFixed by failing closed at the declaration, where the author can act: `validate_message_shape` now rejects a `pub` actor method whose reply does not fit the one-word slot (`golden/err-actor-reply-aggregate`). The predicate is `codegen::is_aggregate` itself, made `pub(crate)` and called directly rather than copied \u2014 the rule exists *because* of the ABI, so one shared definition is the only way the two cannot drift (rejected alternative: a sema-local predicate plus an agreement unit test \u2014 more machinery for a weaker guarantee). A plain struct reply was equally broken and is covered by the same rule. What remains true and tested is narrower than before and now honest: the composition *table* is right, and every reply shape that compiles delivers its declared value. The wider reply transport that would let `Result[T, E]` methods compile again is real, named work, not a gap this milestone can close by relabelling.\n\n**Note-update (plans/M6.md item H3, 2026-07-24) \u2014 `CallError::NotAdmitted` does not exist at M6, and this is where to find that out.** 02-language.md \u00a79.4 names the variant by name (`NotAdmitted(Admission)  # never ran: mailbox full`). Composing it is real, unshipped work; the limit is legitimate for this milestone. What was not legitimate is how it failed: an `await` whose enqueue was refused executed a bare `codegen::BRK_AWAIT_ACTOR_REJECTED`, a real EL1 exception into a vector table this machine never installs, so the operator saw `esr=0x82000006, ipa=0x200, pc=0x200` and nothing else. It is reachable from ordinary source \u2014 fill a two-slot mailbox with consumed-`Result` sends, then `await` \u2014 and its ONLY disclosure was a comment on the constant pointing at item G, which shipped without the composition; the constant appears in neither `plans/M6.md` nor this file (checked by grep), so no reader could have looked it up. Not a disclosed floor, therefore: an undisclosed fail-open-shaped failure of a documented path.\n\nIt now aborts through the ordinary `abort_fixed` path, which prints over the console ring before halting \u2014 the actor is named, the cause is named, and the scope limit is named (`golden/boot-await-mailbox-full` pins the transcript). Cost, reviewed word by word before `golden --update`: one `brk` word becomes the seven-word abort sequence, so the guarding `cbz` skip grows `#8`\u2192`#32`, every later word index in that fn shifts by +6 with branch offsets recomputed to match, and the message interns at rodata 0 pushing the pre-existing one to 0x7a \u2014 `golden/asm-async-basic`/`golden/asm-async-loop-checkpoint` moved by exactly that, and `golden/boot-actor-smoke`/`golden/boot-group-join`'s reports by exactly `code +24`/`+48` bytes (one and two `await` sites \u00d7 6 words) plus the interned string. `BRK_ACTOR_TURN_CANCELLED` is deliberately left as a `BRK`: unlike this one it is unreachable by construction at M6 (its own doc comment carries the proof), so making it legible would be ceremony for a path no program can enter. The golden moves the day `NotAdmitted` becomes real, which is exactly the signal that change should produce.\n\n**plans/M7.md item Z1 note-update (2026-07-24) — the composition's aggregate half now really runs, and the rejection narrows to the one shape that needs more than transport.** M6 item H1 rejected *every* aggregate reply at declaration (`sema::types::validate_message_shape`) because the turn record carried one scalar word and the caller's composition re-labelled a returned *pointer* as `Ok(<guest address>)`. Item Z1 built the transport that rule was waiting on (`actors.runtime.static-tables`' own note-update carries the mechanism and its invariant), so the check now rejects exactly one shape: a declared `Result[T, E]`. 02-language.md §9.4 maps its `Err(e)` to `Err(CallError.Op(e))` — a re-*tagging*, not a copy, so the delivered value and the caller's composed value genuinely have different shapes, and a straight copy through the staging slot would be wrong in precisely the way H1 found. That recomposition is plans/M7.md item Z2; `golden/err-actor-reply-aggregate` still pins the rejection, now naming Z2 and the missing recomposition instead of \"must be a scalar at M6\" (that golden is *replaced* by Z2, not by this item).\n\n**What executes now**, proven by a real Hypervisor.framework boot (`golden/boot-actor-reply-struct`): the awaiting turn publishes its staging slot before `rt_enqueue`, the callee writes its declared aggregate straight into the awaiting frame through `x8`, and the resume stub composes `Ok(<those bytes>)` by copying the staged value into the composed `Result`'s payload area and zeroing whatever the error arm makes wider. Both dispatch arms are separately wired, so both are exercised: `Ledger.origin`/`Store.snapshot` are sync (their return IS completion; `x8` spilled by the ordinary sync prologue), and `Store.tally` is async and *parks* on its own inner await before returning its aggregate — so the return pointer had to survive the suspension in the persistent frame (`emit_async_entry` spills `x8` on the fresh path only; a resume has no `x8` and needs none, because a parked caller cannot have changed it). `Store.tally` is also a caller of an aggregate-reply method, so the value crosses the transport twice — `Ledger.origin` -> `Store.tally`'s staging slot -> `Probe.fetch`'s staging slot — and `Probe.fetch`'s two await sites share one slot, which is decision 9b's own claim. Values are hand-computed and pairwise distinct with no `lo`/`hi` swap surviving: 42/4103 through the sync path, 507/1007 through the async one. **The assertions are not vacuous, checked by running:** each of the four expected values was perturbed by one in turn, the boot failed with that assertion's own message every time (`test struct_replies: FAILED assertion failed: ...`), and the value was restored.\n\nThe golden reads each reply back through the actor's own *sync* methods rather than inline in the awaiting fn, because 02-language.md §9.2's cross-await path rule rejects every non-`self`-rooted field access anywhere after an `await` in the same fn (`sema::bodies::scan_await_cross_stmts`) — and an awaiting fn has one by construction. Storing the whole reply into `self` and reading its fields from a plain sync method is the rule-abiding shape, and it proves the same fact: the bytes are correct where the *caller* can see them, not merely where the callee wrote them.\n\n**Not claimed, disclosed instead of tested.** Where a group arena exists, an aggregate reply is composed slightly differently from a scalar one: a scalar rides the existing `csel` between the delivered reply and `CALL_ERROR_TAG_CANCELLED`, but an `Ok` payload of several words and an `Err` payload of one tag word cannot share one `csel`, so the cancelled answer is composed unconditionally and the `Ok` overwrite is skipped when the flag is set — one forward branch, both outcomes fully deterministic. No golden exercises that combination (an aggregate reply awaited inside a cancelled group); it is reasoned and recorded here rather than proven, exactly like `codegen::enum_payload_offset`'s own multi-field-variant generalization. **Still closed, by name:** a *free* async fn returning an aggregate — a `@test(runtime)` root or a `g.start` child — keeps failing closed in `codegen::emit_flowwir_fn` (decision 9d), because the entry driver has no staging slot to offer and the group arena's child result slots are one word wide; the message names both reasons and names Z1 as what widened the method case. No golden pins that text: no source shape in today's surface was found that reaches it (an async body can neither construct an aggregate nor obtain one except from an `await`), so it is a guard against a future widening, not a diagnosable path today.\n\n**plans/M7.md item Z2 note-update (2026-07-24) — a declared `Result[T, E]` reply recomposes through `CallError`, and the sentence above about this clause's own evidence stops being true.** Item H1's note-update said, accurately at the time, that \"every test cited above is a `check-*`/`err-*` sema or dump golden ... they prove the *typing* ... and never once its runtime value.\" That is no longer the case. `golden/boot-actor-reply-result` is a real Hypervisor.framework boot of the very program H1 booted — `Store.load(key) -> Result[u64, FsError]`, `Ok(42)` for key 1 and `Err(FsError.Bad(key + 100))` otherwise — and it asserts BOTH arms by value. `golden/err-actor-reply-aggregate`, which pinned the fail-closed rejection of that same program, is deleted in this commit: the rejection no longer exists, and `sema::types::validate_message_shape`'s reply rules are back to the pre-existing set (no `Actor[T]` at any nesting, in a parameter or a reply), with H1's whole history kept as a comment where the check used to stand.\n\n**Why `Result` needed its own item, and what is emitted.** 02-language.md §9.4's composition is a re-*tagging*, not a copy: staged `Ok(v)` becomes composed `Ok(v)`, staged `Err(e)` becomes composed `Err(CallError.Op(e))`. So the delivered value and the caller's composed value have different shapes *and* different sizes — the staged declared value is `8 + max(size(T), size(E))` while the composed temp's payload area is only `max(size(T), 8 + max(size(E), 8))`. `codegen::emit_recompose_staged_result` therefore recomposes field-wise and never bulk-copies. Its emitted shape is the same one the group-cancelled path already used, for the same reason (an `Ok` payload of several words and an `Err` payload of a tag plus `E` cannot share one `csel`): compose the `Err` answer unconditionally — `str xzr` at the composed payload slot for `CallError`'s own `Op` tag (variant 0, `sema::bodies::call_error_variant_index`), the staged payload copied word by word into `Op`'s payload slot, zero-fill to the end of the temp, then `1` (`value::RESULT_ERR`) into the tag — then load the staged declared `Result`'s own tag and `cbnz` past the `Ok` overwrite, which copies `size(T)` bytes into the composed payload slot, zero-fills, and stores `0` into the tag. One forward branch; both outcomes leave every word of the temp deterministic rather than half-written. Under a group arena the whole recomposition sits inside the cancelled-flag skip, so cancellation still wins over whatever the callee staged: a cancelled await resolves `Err(CallError.Cancelled)` and never `Err(CallError.Op(e))`. **Every offset comes from the offset authority, none is hand-assumed:** `codegen::enum_payload_offset` places the staged `Result`'s payload slot, the composed `Result`'s payload slot and `Op`'s payload slot inside the `CallError[E]` occupying it, and `mwir::size_of` sizes `T` and `E`. That helper grew a `CallError` arm to make this possible — `CallError[E]` is the one enum carried as an *instantiated* `Type::Named`, so the generic-instantiation rejection would otherwise have left the authority a hole exactly where this item needs it; the pre-existing literal `+8`/`+16` in the group-cancelled arm were replaced by the same derivation (identical bytes, derived instead of assumed). `codegen::aggregate_reply_of_await`/`flow_reply_stage_size` needed no change at all, verified rather than assumed: a declared `Result` is already `is_aggregate`, and the `--stage=asm` dump of the new golden shows four `str x9, [x28, #48]` staging-slot publishes for its four `Result`-reply awaits and none for its scalar ones.\n\n**The wide-`T` trap, and the evidence the Z1 follow-up's guard never fires.** The golden's second method is `Store.wide -> Result[Triple, FsError]` with `Triple` three `u64`s: `T` = 24 bytes, `E` = 16, so the staged value is 32 bytes against a composed payload area of 24 — genuinely wider than its destination, the precise shape commit `096a4eb` added `emit_copy_staged_reply`'s bounds check for. Checked by running, not by reading: routing a declared `Result` back through that copy path (a one-word local patch, reverted) makes the build fail with `internal error: a staged reply of 32 byte(s) does not fit the composed result's own 24-byte payload area`, exactly the numbers that commit predicted. With the recomposition in place the guard is never reached, because `emit_compose_staged_reply` routes a declared `Result[T, E]` to `emit_recompose_staged_result` and only a non-`Result` declared reply to the copy. The guard is left exactly as it was, wording included: it is the tripwire for anyone who later re-widens the copy path.\n\n**What the golden proves.** Both dispatch arms return a declared `Result`: `Store.load` is sync (its return IS its turn's completion, `x8` spilled by the ordinary sync prologue) and `Store.wide` is async and *parks* on an inner `await` before returning its `Result`, so the staging pointer has to survive the suspension. `Probe.run`'s five await sites share one 32-byte staging slot (decision 9b), so the narrower `Result[u64, FsError]` and the two plain scalar replies ride the same frame area — a recomposition reading past a narrow staged value would pick up the previous await's bytes. Values are hand-computed and pairwise distinct, none of them 0 (so a zeroed or stale slot cannot pass as plausible), and no permutation of `Triple`'s fields survives: `Ok(42)` and `Err(FsError.Bad(107))` through the sync method; `Ok(Triple(1001, 2002, 3003))` and `Err(FsError.Bad(4004))` through the async one; plus `707` from an ordinary scalar reply in the same image, asserted because it proves the M6 scalar path is untouched inside the very image that exercises the wide one. **Both `Err` payloads are read out from INSIDE the `CallError.Op` payload**, not merely observed to be `Err` — an `Err` carrying a guest address would have passed the weaker check, which is exactly the bug H1 found. **The assertions are not vacuous, checked by running:** each of the seven expected values was perturbed by one in turn, the boot failed with that assertion's own message every time (`test result_replies: FAILED assertion failed: ...`), and the value was restored. No existing golden moved at all — `cargo xtask golden` reported 287 expectations ok with no update, since nothing about a scalar or non-`Result` aggregate await's emitted bytes changed; `golden/boot-actor-reply-struct` (Z1's oracle for the non-`Result` path) is byte-identical.\n\n**One enabling change outside item Z2's own files, disclosed rather than folded in.** No program could observe `Err(CallError.Op(e))` at all before this commit: `flowwir_lower::variant_index` had no `CallError` arm, so `match e: case .Op(fe):` inside an async body — the only place a `CallError` value can exist, since only an `await` produces one and `await` requires `async` — died on `error[unimplemented]: matching a generic enum instantiation's variant is not implemented yet`. sema already typed such an arm (`bodies::variant_payload_types_for`/`matches::shape_of`); only the numbering was missing. The numbering is not restated there: `sema::bodies::call_error_variant_index` is the single table, placed beside the composition it belongs to, and `codegen::CALL_ERROR_TAG_CANCELLED` (= 1) and `enum_payload_offset`'s new arm are cross-checked against it in their own doc comments. `lower::variant_index` (the sync pipeline) is deliberately left rejecting: a sync fn cannot hold a `CallError` value, so an arm there would be untested surface.\n\n**Not claimed, disclosed instead of tested — the same three items Z1 left, unchanged in kind.** (1) A `Result` reply awaited inside a *cancelled* group is reasoned, not pinned — but less of it is untested than at Z1, and the line is worth drawing precisely. Probed out of tree and passing: the identical golden program with a `with group(...)` added, which flips `arena_capacity` for the whole build and so makes every await take the group arm (the `Cancelled` answer composed unconditionally, the staged recomposition emitted inside the `cbnz` skip), boots and passes all seven assertions unchanged. So the group arm's emitted sequence really runs; what nothing forces is its *cancelled* outcome. The golden itself keeps the no-group shape deliberately, because a group anywhere in the image would take the no-group arm — the M6 sequence every earlier golden pins — out of coverage entirely. Cancellation winning over a staged `Err` is structural rather than tested: the `Cancelled` answer is composed before and outside the skip that guards the whole recomposition, so there is no ordering in which a staged `Op` could overwrite it. (2) A *free* async fn returning an aggregate still fails closed by name in `codegen::emit_flowwir_fn` (decision 9d). (3) `CallError`'s other four variants still do not compose: `Cancelled` is real (§9.5), and `Op` is real as of this commit, but `DeadlineExceeded`, `NotAdmitted(Admission)` and `PeerFailed(Peer)` are unshipped exactly as item H3's note-update records. Two shapes the language pushes back on are worked with rather than fought, and are recorded in the golden's own header: §9.2's cross-await rule (so the assertions read replies back through plain sync methods after the awaiting fn stores them into `self`), and `flowwir_lower` lowering neither a struct construction nor an `Ok(..)`/`Err(..)` construction inside an async body (so `Store.wide` returns one of two `Result` fields a sync method built earlier, and `Store` carries no `init` because its `clerk` field is image-bound).\n\n**Item I's sweep (2026-07-24) — the composition table is not injective, and item Z1's transport made that a wrong answer.** §9.4's two rows collide at `E = never`: `declared Result[T, never] -> Result[T, CallError[never]]` is character-for-character `declared T -> Result[T, CallError[never]]`, so the composed type carries no evidence of which row produced it. `sema::bodies::decompose_call_error` — whose own doc comment asserted the pair was total \"for every `t`, both arms\", and which item Z1 chose precisely *because* inverting the composition is cheaper than threading the declared type through `flowwir_lower` a second time — answers the bare-`T` row. The two ends of one `await` are then read through two different predicates (`codegen::flow_reply_stage_size` caller-side vs. `codegen::is_aggregate(&f.ret)` in `layout.rs`'s own `reply_is_aggregate` callee-side), and they disagree here and nowhere else. Both halves verified on real HVF boots: with an aggregate `T` the caller reserves `sizeof(T)` while the callee writes `sizeof(Result[T, never])`, so a declared `Ok(Triple(1001, 2002, 3003))` was read back as `a=0` (the tag), `b=1001`, `c=2002` — every field shifted one word — with the extra word landing past the staging slot on the frame's `lr` save (masked only because the resume path re-saves `lr` on entry); with a scalar `T` the caller never publishes a staging address while the callee's dispatch arm still loads the never-written `OFF_TURN_REPLY_SLOT` (zero) into `x8` and writes through it, observed as `guest fault ... ipa=0x0`. **Refused rather than resolved**: which row `Result[T, never]` belongs to is a language question §9.4 does not answer, and the docs are normative, so `sema::types::validate_message_shape` rejects the declaration by name (`golden/err-actor-reply-never-error`) and the diagnostic names the one-line rewrite. A `never` nested deeper (`Result[T, Option[never]]`) composes and decomposes exactly and is untouched. **This is the same failure shape M6-H1 found and item Z2 fixed for `Result[T, E]` generally — a declared value arriving as different bytes than were sent — surviving in the one reply shape neither item's oracle spelled.** No existing golden moved.\n\n**The one exemption, added by plans/M8.md item E (decision 32; 02-language.md §9.4 gained a paragraph naming it, REVIEW-QUEUE'd).** A call to a `@driver` method carrying 03-hardware.md §5's handoff calling convention — public, synchronous, exactly one `take p: P`, result `Receipt[P]` — is **not** composed: its result is `Receipt[P]` as declared. §5 states that result by name and calls the shape a different *convention*, and the receipt is the caller's endpoint on work no handler has done yet, so the failure vocabulary that applies to it is the receipt's own state machine (reached by awaiting it), not `CallError`. The predicate is `sema::handoff::is_handoff_signature` — the same one that already prints `handoff fn ...` in the check dump and enforces the `publish`/`reject` body rule; there is no second notion of \"handoff-shaped\". Everything else about the call is unchanged: an ordinary mailbox admission, an ordinary park, an ordinary scalar reply word.\n\nThis is not a convenience. Without it the convention is **unreachable from source**, and that was verified by mutation rather than assumed: with the composition restored, `golden/boot-receipt-handoff` does not type-check at all, because the receipt is sealed inside a `Result` the language cannot open here — `flowwir_lower` does not lower a `match` containing an `await` in an arm, and `CallError` is not a source-nameable type, so `?` cannot convert it either. Both are real, separate floors; neither is item E's to lift, and neither is papered over.\n\n**Still composed, deliberately:** every non-handoff driver method (`golden/boot-driver-message`'s `capacity`/`sector_bytes`/`ready`/`scaled_capacity`), and every `@actor` method — `boot-receipt-handoff`'s own `await self.led.mark(n=7)` sits four statements from an uncomposed handoff and is matched as a `Result` in the same body.\n\n**Thin, named:** a handoff `await` inside an image that declares a `with group` is refused by name in codegen (`emit_await_resume`) — 02 §9.5's `Cancelled` has no error slot in a bare `Receipt[P]`, and forging one would hand back a receipt word for work nobody submitted. The honest repair is 03 §9's recovery turn, plans/M8.md item F. A rejected admission (mailbox full) still aborts exactly as every other `await` does — M6 item H3's pre-existing disclosed floor, unchanged and not narrowed here.\n\n**Note-update (plans/M9.md item J2d, 2026-07-25, decisions 534-535):** 02-language.md §9.2 / 04 §1 restrict whole-value accesses that *live across* / *survive* an `await`, not every field access lexically after one. `bodies::check_cross_await` now tracks locals bound after `seen_await` (Let / match-arm / for / `with ... as` / post-await Assign-to-local) and allows a `Field`-chain rooted at those names — the 03 §3 shape `completion = await receipt; ... completion.status?` and `golden/check-await-result-path`. An external argument / pre-await local that spans stays refused (`golden/err-await-external-path`, unchanged pre- and post-fix). Corpus `03-hardware.md:85` flips disagreement → ok (8→7 disagreements / 15→16 ok of 23); stub also switched the fake `Queue.publish -> Receipt` DeclStruct to real `VirtQueue`/`QueueOp` under a `@driver` authority root (handoff.rs forbids Receipt returns on non-`@driver` — latent under the prior first-error).\n\n**Review find, fixed (plans/M9.md item RR, 2026-07-25, decision 546): the #9.2 cross-await rule under-rejected across a loop back edge.** `bodies::check_cross_await` is a straight-line forward scan whose own doc claimed it 'over-rejects a little, never under-rejects'. That was false for `while`/`for`: an external-rooted access placed lexically BEFORE the body's only `await` never had `seen_await` set when the scan reached it, yet every iteration after the first reads it on the far side of the previous iteration's suspension -- exactly what #9.2 forbids. Confirmed against the compiler: the loop spelling compiled clean while its own unrolled two-iteration equivalent (`golden/err-await-external-path`) was rejected, same program, same semantics. Note `sema::access` already got the analogous case right -- a `take` in a loop body reports `error[move]` -- so this was an inconsistency inside sema, not settled milestone scope. Fixed by modelling the back edge: a `while`/`for` whose body can suspend now enters that body with `seen_await` set and the per-suspension exemption cleared, so the whole body is treated as following a suspension. 'Can this body suspend' is answered by `loop_body_suspends`, which replays the same scan in a new `probe` mode rather than adding a second shadow traversal to keep in step with the grammar; `probe` also suppresses the loop rule itself, which keeps a nest of `d` loops linear instead of `2^d`. A `for`'s loop variable is re-inserted into the exemption set after the clear, since the header rebinds it before the body on every iteration. Pinned both ways: `golden/err-await-external-path-loop` (reject) and `golden/check-await-loop-post-suspension-local` (accept -- a value bound after the body's suspension, a `self`-rooted access, and a loop with no `await` in it at all). No existing expectation moved: nothing in the corpus relied on the hole.\n\n**plans/M10.md item 0c1 (decisions 557/565/567): the waker in this ABI is an index, not an address.** `rt_enqueue`'s waker argument was the awaiting turn's raw turn-area address in `x3`, with a cross-core send OR'ing `(src_core + 1) << 61` into its top three bits and every reader masking that back off. It is now two typed fields: `x3 = Option[TurnId]` (1-based index into the one contiguous `RT.turns` array item 0b laid down; `0` = no waker) and a new `x4 = Option[CoreId]` (`0` = local, else `src_core + 1`). They occupy the two `u32` halves of exactly the word the tagged address occupied -- in the mailbox slot (`[8]=waker_turn`, `[12]=waker_core`) and in the turn record (`+32`/`+36`) alike -- so `slot_size`, `REPLY_SLOT_SIZE` and `TURN_RECORD_SIZE = 56` are every one unchanged. A separate 64-bit word would have cost 8 bytes on every mailbox slot and every cross-core request-ring slot image-wide, because the pair rides the whole `xsend -> ring -> mailbox -> turn record` chain. A cross-core reply-ring slot's word 0 is likewise the destination `TurnId` (no core field beside it: a reply ring's consumer *is* the destination core by construction). `OFF_TURN_REPLY_SLOT` is the one reference that does NOT reduce to an index -- it names a frame-interior address whose offset is the *caller's* per-fn `Frame::reply_stage_off` and whose reader is a different fn -- so it is stored as `(TurnId at +48, byte offset within that turn area at +52)`. Every deref site converts by one rule (`RuntimePlacement::turn_addr`, emitted as `push_turn_addr_from_id`: `load_imm` the turn base, `sub #1`, `lsl #log2_stride`, `add` -- two words, not ROADMAP's single shifted-register add, since `encode::enc_add_reg` is shift-0 only and buying the encoder form here would be an unmeasured optimization); the `lsr`/`load_imm`/`bic` untag chain is deleted outright. Behaviour-preserving, and checked as such: zero `expected/test.txt` moved and zero `frame=`/`slot=`/`Turns`/`Totals bytes=` report lines moved -- only `code`/`rtcode` sizes and the section bases after them. `BRK_REPLY_SLOT_NO_WAKER` and `BRK_XREPLY_UNKNOWN_CORE` are both still emitted; they die in items D/F, not here.\n\n**Note-update (plans/M10.md item J, 2026-07-26, decisions 559/665/666):** `OFF_TURN_REPLY_TAG` closes the representation gap. `TURN_RECORD_SIZE` 56→64; writers (`.deliver` / `rt_drain` / `rt_xreply`) and the rejected-`await` path write `(tag, reply)` with `0=Ok`, `1=Cancelled`, `3=NotAdmitted`; `emit_await_resume` reads them. `BRK_ACTOR_TURN_CANCELLED` is removed. `golden/boot-await-mailbox-full` moves abort→`ok` (`Err(NotAdmitted)`). Cross-core reply slots pack the tag into word 0's spare high half (`REPLY_SLOT_SIZE` stays 16). `Admission.Full` is opaque reason code 0.\n\n**Note-update (plans/M13.md item H, 2026-07-27, decision 4):** local enqueue-fail on an awaited call builds `Err(CallError.NotAdmitted(Admission.Full, (take_args...)))` in the caller's frame (`codegen::emit_not_admitted_local`) — the caller still owns the argument words; enqueue did not commit. `NotAdmitted`'s pattern payload is `(Admission, args-tuple)`; take-arg types ride CallError's optional second type argument (empty → `()`). Dead `BRK_AWAIT_ACTOR_REJECTED` deleted. `golden/boot-await-rejected` fills a mailbox, awaits with `take code: u64`, and recovers `99` from the NotAdmitted arm. Reply_tag path still delivers tag-3/Admission for empty-args / resume composition."

[[clause]]
id = "actors.messages.value-restrictions"
doc = "02-language.md#9.3"
status = "test"
tests = [
  "golden/check-actor-send",
  "golden/check-group",
  "golden/check-actor-private-handle-helper",
  "golden/err-actor-msg-mut-loan",
  "golden/err-actor-msg-closure",
  "golden/err-actor-handle-in-message",
  "golden/err-actor-handle-in-enum-message",
  "golden/err-actor-handle-param",
  "golden/err-actor-handle-reply",
  "golden/err-send-no-image",
  "golden/err-actor-msg-own-read",
  "golden/err-actor-msg-param-own-read",
  "golden/err-actor-msg-resource-read",
  "golden/err-actor-msg-send-own",
  "golden/err-actor-msg-option-own",
  "golden/err-await-external-index",
]
note = "plans/M6.md item A: `send actor.method(...)` (02-language.md §9.4), both forms — statement (`Stmt::Send`) and expression (`Expr::Send`, `match send x.y(...): ...`'s own operand) — now type-check (`sema::bodies::check_send`/`check_send_call`) instead of failing closed unconditionally; the target method must be `pub` and declared `-> unit` exactly (`send`'s own contract, 02-language.md §9.4: \"enqueues a unit-returning method\" — `Rejected` carries no slot for a declared error type, so a non-`unit` target is a named rejection, not a silent narrowing), composing to `Result[unit, Rejected]` (`Rejected` an opaque builtin, the take-args-back payload story left opaque at M6, the moved-payload typing arriving with M7's real resource messages). The item-A floor (decision 5, plan's own words): **every** bare `send` statement is rejected — `bodies::check_send_stmt` types the inner call fully first (so a genuine mistake in the call itself reports *that* error), then unconditionally demands the result be consumed (`golden/err-send-bare-unproven`) — the send-proof analysis that can make some of them infallible is item G's own job; this is the conservative floor decision 5 asks item A to ship. New fixed diagnostic category `actor` (`xtask::SEMA_CATEGORIES`, added deliberately) covers this floor plus every message-value-restriction diagnostic below (`missing_method`/mut-loan/closure/handle rejections stay category `type`/`unimplemented` where they already had a home; `actor` is for the genuinely new actor-specific rules with no prior category). Message-value restrictions (02-language.md §9.3 — \"data, copied in... `Static[T]` handles... resources moved with `take`\"; \"cannot contain `mut` loans, lent closures, or object identity\") are checked once, shared between `await`'s own actor-call composition and `send` (`bodies::check_message_args`, a message-restricted sibling of the ordinary `check_call_args` — duplicated rather than threaded through it, since `check_call_args` never returns which source `Arg`/`AccessMode` filled which slot, which this restriction needs per argument): a `mut`-mode argument is rejected outright (`golden/err-actor-msg-mut-loan`); an argument whose resolved type is `Type::Fn(...)` (a closure) is rejected (`golden/err-actor-msg-closure`); an argument whose resolved type is `Actor[T]` (any `T`) is rejected — 02-language.md §9.1's own \"handles cannot appear in messages\" (`golden/err-actor-handle-in-message`); a `take`-mode argument whose resolved type is itself a resource (`bodies::is_resource_type`, already computed) is M7 territory, fail closed named, deliberately distinct from the flat `mut`/closure/handle rejections above (a different message, `` `take` of a resource in a message is not checked yet ``, category `unimplemented` — the plan's own \"distinct message from the flat rejection\"); `take` of plain (non-resource) data and a bare `Static[T]`/plain-data argument are both ordinary, accepted exactly like any other call (`golden/check-actor-send`'s `code=code`, `golden/check-group`'s `index=0`/`index=1`). `cargo xtask check` green; fuzz sema/eval/lower 200_000 iterations × 2 seeds each, clean, exercising this new category alongside every pre-existing one.\n\nPost-review fix (2026-07-24, verification's own probe — 02-language.md §9.1: \"Handles cannot appear in messages, replies, or runtime collections\"): the call-site check above (`check_message_args`'s own `Actor[T]`-argument rejection) left the *declaration* that makes the violation possible silently acceptable — a public actor method's own parameter list *is* the message shape, and its return type *is* the reply shape (02 §9.4: an awaitable composes exactly the declared type), so a declaration carrying `Actor[T]` there can never be legally called or replied to at all; accepting it was dead surface that only errored lazily, the first time anyone dared call it. Fixed at declaration, in `sema::types::declare`'s own post-declare pass (`validate_message_shape`, run alongside `validate_actor_handles` — the M6-A `Actor[T]`-well-formedness check this note's sibling clause already describes): for every `pub` method (`ast::FnItem::is_pub`, receiver required — an associated fn is not a message either way, `actors.calls.callerror-composition`'s own note on that shape) of an `@actor`/`@driver` struct (`DeclStruct::is_actor`), every parameter type and the return type are walked for an `Actor[T]` occurrence *at any nesting* — `type_contains_actor_handle`, which recurses through every composite `validate_actor_type` already does (array/tuple/`own`/`Static`/`Option`/`Result`/`fn`) plus one more: a *named struct's own declared fields* (`component_types`, `BTreeSet`-guarded against a cyclic type), so a plain data struct carrying an `Actor[T]` field, passed by value, is caught too (\"struct-of-handle\"). `init` is exempt: an `init`'s own parameters are the image's wiring arguments (`img.actor(A, disk=disk.handle(), ...)`), substituted at build time by `eval::image_checks`'s own decl-reference mechanism, never admitted through a mailbox — `golden/image-basic`'s own `Store.disk: Actor[Blk]`/`init(mut self, disk: Actor[Blk])` (the M4-C retirement) stays green precisely because `init` is a distinct `DeclMember` variant this new check never visits. Decision on non-`pub` methods (recorded, not merely assumed): 02-language.md §9.2's own \"calls on self are ordinary calls\" means only a `pub` method is ever reachable through an `Actor[T]` handle at all (the identical `mf.is_pub` gate `check_await_actor_call`/`check_send_call` already enforce) — a private method's parameter list is therefore never a message shape, so it may freely take/return `Actor[T]` (a same-actor helper handed a peer handle already held elsewhere, e.g. a field); `golden/check-actor-private-handle-helper` pins this as a real accept case (a `pub async fn deliver(mut self) -> u64` with no handle parameter of its own, calling a private `fn forward(read self, target: Actor[Relay]) -> u64` via an ordinary `self.forward(self.peer)` — the typed dump shows a plain `Call` node, not `Await`, confirming this never goes through the message path at all). Two new goldens pin the declaration-time rejection directly: `golden/err-actor-handle-param` (verification's own probe, a parameter) and `golden/err-actor-handle-reply` (a return type). `golden/err-actor-handle-in-message` (this clause's own pre-existing case) now fails at its `Outer.relay` *declaration* (line 12) instead of at `Hub.forward`'s own call site (line 21) — re-goldened to the earlier diagnostic; its own doc comment records why `Hub`/`forward` are kept in the file (they demonstrate the shape this golden used to trigger on) even though they are now unreached (`declare()` fails before `bodies::check` ever runs). Call-site reachability, checked directly rather than assumed: `check_message_args`'s own `Actor[T]`-argument check only ever fires when `vt.ty` (the *argument's* synthesized type, checked against the *callee's declared* param type by ordinary `check_expr(&a.value, Some(&pty), ...)`) is itself `Actor[T]` — which requires the callee's own declared param type to already be `Actor[T]` (nothing coerces an `Actor[T]`-typed value into a differently-typed parameter), the exact shape declaration-time validation now blocks for every `pub` actor method before any call site is ever reached. **The call-site arm is therefore unreachable in practice for this exact shape** — kept as an internal defense-in-depth guard (the module's own \"never approximate\" discipline: a producer bug that somehow let a bad declaration through must still be caught at the use site, not silently accepted), not deleted, and not claimed to be exercised by any golden beyond what it already shares with the mut-loan/closure checks in the same fn. `cargo xtask check` green; `golden/image-basic`/every M4/M6 accept golden byte-identical except the two cited moves above; fuzz sema 200_000 iterations × 2 seeds, clean.\n\n**Note-update (plans/M6.md item G, 2026-07-24)**: the item-A floor this clause describes — \"every bare `send` statement is rejected\" — is retired, replaced by the real whole-image proof (`sema::send_proof`, `actors.send.statement-requires-proof`). `bodies::check_send_stmt` now types the inner call exactly as before and then *builds a node* (`TypedStmtKind::BareSend { span, expr }`) instead of returning `Err`; the rejection, when it comes, comes from the proof pass at the end of `sema::check_typed`/`check_program_typed`. Everything this clause pins about the message-value restrictions themselves is unchanged and unmoved (`check_message_args` runs identically for both `send` forms). The cited golden `golden/err-send-bare-unproven` is retired into `golden/err-send-no-image` — the same program, byte-identical below its module line, renamed to the condition it now actually pins (a closure with no `@image` fn can prove nothing, so its bare `send` is still rejected — the fail-closed floor), since the old name named a rule that no longer exists.\n\n**plans/M7.md item I's sweep (2026-07-24) — an M6 hole found by an M7 audit.** 02-language.md §9.1's \"Handles cannot appear in messages, replies, or runtime collections\" is enforced at declaration by `type_contains_actor_handle`, whose recursion through a named type's components used a struct-only map. An `Actor[T]` inside an **enum variant payload** was invisible: a `pub` actor method declaring `h: Holder` (`enum Holder: Live(Actor[Peer]) | Dead(u32)`) — whose parameter list *is* the message shape — compiled clean, and `Holder` was even classified `data` rather than `resource`. Pinned as `golden/err-actor-handle-in-enum-message`, the sibling of `golden/err-actor-handle-in-message`. This clause was not the sweep's target; it shares one root cause with three `hardware.*` clauses that were (see `hardware.capabilities.unforgeable`'s own item-I note for the mechanism and the fix, `sema::types::components_by_name`)."

[[clause]]
id = "actors.groups.cancellation-order"
doc = "02-language.md#9.5, 04-compiler.md#4"
status = "test"
tests = [
  "golden/boot-cancel-cleanup",
  "golden/boot-deadline-cancel",
  "golden/boot-deadline-inherit",
  "golden/boot-group-join",
  "golden/err-group-capacity-exceeded",
  "golden/err-group-capacity-default-zero",
  "golden/err-group-start-in-loop",
  "golden/err-group-budget",
]
note = "plans/M6.md item F (2026-07-24), decision 8: the cancellation/teardown subset 04-compiler.md §4 orders, as shipped, with every reading recorded rather than implied.\n\n**The one distinction the whole design turns on** (`codegen::OFF_GROUP_OWNER_TURN`, new): a cancelled group does different things to different activations. A `g.start`ed **child** is terminated — \"the cancelled frame never resumes\" (04 §4) — at its very next checkpoint, reporting `TURN_STATUS_CANCELLED`. The group's **owner** (the frame that executed `GroupCreate`, i.e. the `with`-block's own body) is deliberately NOT terminated: 02 §9.5 requires that \"source sees only `CallError` and its own `defer`s running\", which is impossible if the block's own body dies where it stands. So each group records its owner's turn at creation, and every observation site compares against it (`codegen::emit_group_cancelled_flags`, one shared read producing both `is-cancelled` and `is-owner`). *(plans/M10.md item 0c2, 2026-07-26: what is recorded is that turn's `TurnId` \u2014 a `u32` index into the one contiguous `RT.turns` array \u2014 not its raw area address. Both readers compare for equality only, so neither needs an address: `emit_group_cancelled_flags` compares against the observing fn's own relocated id and `layout::emit_deadline_scan_and_delivery` against the build-time id of the turn its unrolled arm is about. The group's `join_waiter` (`codegen::OFF_GROUP_JOIN_WAITER`) becomes an `Option[TurnId]` in the same commit, with `0` the None niche, and its one reader \u2014 `layout::build_group_child_poll`'s wake \u2014 derefs it through the single index\u2192address rule. The distinction this note turns on is unchanged; only the representation is.)*\n\n**04 §4's order, item by item, as executed.** (1) *Closes admission*: `emit_group_start` reads the group's `cancelled` word before doing anything else and, if set, never runs the child at all — its result slot resolves straight to `Cancelled` and `active_children` is never incremented, so a `join_all` already parked on the group is not made to wait for a child that will never run. Disclosed floor: 04 §4 says a closed-admission attempt gets `NotAdmitted` with payloads returned; M6's composition floor has exactly one non-`Ok` variant, and `g.start`'s arguments are plain scalars with nothing to hand back. (2) *Cancels child registrations recursively*: performed by the same single arena scan, not by a separate propagation pass — and this is a reading, not an omission. Deadlines only narrow (`emit_group_create` stores `min(ambient, own)`, and a group declaring none inherits the ambient one unchanged), so every descendant of an expired group is itself expired at the same instant the one linear pass examines it; deadline expiry is also M6's *only* cancellation source (no `race`, no explicit cancel API, abandon is image-fatal per decision 12). A separate pass would be dead code today and unsound unless iterated to a fixed point, since a child group can occupy a lower arena index than its parent. `golden/boot-deadline-inherit` is the witness: the inner group declares a five-second deadline inside an outer zero-budget one and is cancelled at the outer's instant anyway — with a far-future outer deadline the child completes instead (verified). (3) *Device receipts / quarantine*: no device receipts exist at M6 (decision 8's own scope line), so the teardown graph is defers plus child joins only. (4) *Runs every ready cleanup node in deterministic reverse source order*: the group's `defer` chain, wired by `flowwir_lower::lower_with_group` since item B as an independently-jumpable chain reached by the natural fall-through from `GroupClose`. `golden/boot-cancel-cleanup` pins it — `defer` cannot print (02 §10), so two defers each append a digit to a local the owning frame holds, and the trace reads `21`, never `12` (asserting `12` fails). (5) *Resolves `Cancelled` to the parent only when the cleanup graph is empty*: at M6 the parent IS the owner frame, and it observes `Cancelled` through `g.join_all()`'s own composed array (a harvested child's `Cancelled` status becomes an `Err` element) *before* its cleanup runs at `GroupClose`. Recorded as a deviation in ordering and an equivalence in the observable contract: nothing *outside* the group can observe the outcome before cleanup completes, because control cannot leave the `with`-block without passing through the cleanup chain — which is what 02 §9.5's \"a caller never observes a winner while a loser still owns memory\" actually promises.\n\n**Cancellation at an `await`, not only at a checkpoint**: an `ActorCall` resume inside a cancelled group composes `Err(CallError::Cancelled)` rather than the reply that happened to arrive (02 §9.5: \"cancellation becomes observable at `await` and checkpoints\") — for the owner this is the only way it ever observes the cancellation, since its frame is not terminated. Disclosed floor: a *new* actor call issued by an owner frame inside an already-cancelled group is still enqueued and still runs on the target; only its result is resolved as `Cancelled`. No required M6 golden constructs that shape.\n\n**Fail-closed edge, named rather than approximated**: an *actor* turn that reports `TURN_STATUS_CANCELLED` to `rt_select_and_run` hits a named `BRK` (`codegen::BRK_ACTOR_TURN_CANCELLED`). The turn record carries one scalar reply word and no error channel, so there is nothing honest to deliver to the awaiting turn. It is unreachable at M6 by construction — `rt_select_and_run` now zeroes a freshly selected turn's own lineage slots, so an actor turn's ambient group is only ever one its own method opened, and that group's owner IS that turn, which the observation site exempts.\n\n**Note-update (plans/M6.md item H2, 2026-07-24) \u2014 the declared `capacity=` was inert.** 02-language.md \u00a79.5 gives a group \"up to `capacity` child activations (default zero)\"; the adversarial sweep found that nothing enforced it. `capacity=` type-checked as a `Usize` and was stored into the group arena at `codegen::OFF_GROUP_CAPACITY`, which has exactly three occurrences in the crate \u2014 the definition, that one store, and the store's own disassembly string \u2014 and **zero loads** (verified by grep, then by booting it). So `capacity=0`, and an omitted `capacity` (the documented default), each started and completed a child. `golden/boot-group-join` could not see it: it declares `capacity=2` with exactly two children, so an enforced capacity and an ignored one are indistinguishable there \u2014 the same coincidence-of-numbers blind spot item F's own two lineage bugs hid behind.\n\nFound while reproducing it, and the reason the fix can be static at all: a `g.start` inside a **loop** compiled clean, was counted **once**, started two children, and then deadlocked in `join_all` waiting on a count of one (`golden/err-group-start-in-loop`). Every consumer downstream \u2014 `join_all`'s array length, the admission accounting, and now the capacity check \u2014 is built from the number of *static* `g.start` sites, so `compute_group_children` now rejects a looped site by name, exactly the discipline decision 5 already applies to a bare `send` (\"outside any loop... each executes at most once per root turn\"). With that rule in place the static site count IS the activation count, and `check_group_capacity` compares it against the declared literal at build time (`golden/err-group-capacity-exceeded`, `golden/err-group-capacity-default-zero`).\n\nStatic enforcement is a recorded choice, not an oversight. The runtime alternative \u2014 refuse the activation and hand back `NotAdmitted`, which is what 04 \u00a74's \"atomically closes admission\" describes \u2014 needs a `CallError` composition that does not exist at M6 (item H3 is that same missing piece surfacing at a full mailbox), so the only runtime option actually available today would be an abort. A build error is dumber, strictly more useful, and exact. A capacity that is not an integer literal fails closed as `unimplemented` rather than being silently skipped. Every pre-existing group golden still compiles unchanged: the four boot flagships and `check-group` all declare a capacity at least as large as their static child count, and the bare deadline scopes (`check-deadline`, `flowwir-defer`, `ast-virtio`, `boot-deadline-inherit`'s outer) start zero children, which the check skips.\n\n**M13 item C cut 4 (2026-07-27).** `group(budget=)` deleted from 02 §9.5 / 05 §4; sema already refused unknown group args (`capacity=`/`deadline=` only) — `golden/err-group-budget` pins the refusal."


