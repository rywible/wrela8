[[clause]]
id = "machine.boot.no-discovery"
doc = "06-machine.md#3"
status = "test"
tests = ["golden/boot-hello", "golden/check-tests-mixed"]
note = "plans/M5.md item E: FLIPPED from `gap` to `test` — the *boot* half item D's own note on this clause left open (\"the VMM actually starting vCPU 0 there, reading the machine-info page live, draining the console ring\") is now real, on real Hypervisor.framework, on this machine. `wrela-vmm` (new crate content: `hv.rs`'s raw FFI, `lib.rs`'s `boot_image`) consumes exactly two inputs — the compiler-emitted image blob and its own report text — with no discovery whatsoever: `parse_report` reads the machine revision, the input digest line(s), the section table, and the entry address; `boot_image` allocates and zeroes one host DRAM region (`06 §3`'s own \"zeroes the declared reservations\"), `hv_vm_map`s it at the fixed `DRAM_BASE`, copies the image blob to `IMAGE_BASE`, writes the machine-info page (revision string + a wall-seed of `0`, deterministic at M5), points `x0` at it, sets `PC`/`CPSR`/`CPACR_EL1`, and runs vCPU 0 — no negotiation, no probing, exactly 06 §3's own three boot steps. `golden/boot-hello` (new) is the dedicated golden: three `@test(runtime)` fns (checked arithmetic, a struct paired with an exhaustive `match` over an enum, and one deliberate `assert`-with-message failure exercising the landing-pad path, plans/M5.md decision 15) boot for real, in declaration order, five repeated `cargo xtask golden` runs byte-identical. `golden/check-tests-mixed` (moved, cited above too) is the second, pre-existing case this same boot path now actually executes for the first time (`test_needs_the_machine`, a trivially passing `@test(runtime)`, previously pinned as the M5 fail-closed placeholder `wrela test`'s own comptime tier prints when no runtime tier exists — decision 1/9's own boundary, unchanged in wording, now genuinely superseded because a runtime tier exists).\n\nA real, previously undetectable bug surfaced by this exact oracle (06 §9/decision 5's own \"HVF execution is the behavioral oracle\", not a hypothetical): `encode.rs`'s `enc_umulh` had the signed/unsigned distinction in the wrong bit field (`op54` instead of `op31`'s own top bit) — self-consistent with its own hand-derived unit tests (same reasoning error baked into both), so `cargo test` passed while every 64-bit unsigned checked multiplication decoded as a different, unrelated instruction on real silicon. No dump-only golden from items A-D ever caught it (nothing before this item ever *executed* emitted bytes); the boot golden did, immediately, the first time a `u64` checked `*` was exercised through it. Fixed and re-verified against `clang -target arm64-apple-macos`'s own assembler output for two independent register triples (`crates/wrela-compiler/src/encode.rs`); `golden/asm-calls`/`golden/asm-enum-match` moved their own pinned `umulh` hex word accordingly (the only bytes affected)."

