[[clause]]
id = "machine.boot.secondary-core-release"
doc = "06-machine.md#3"
status = "test"
tests = [
  "golden/boot-cross-core",
  "golden/check-placement-cross",
]
note = "06-machine.md §3 step 3: \"the entry installs per-core state, **releases the other vCPUs**, runs typed driver and actor initialization in image dependency order, opens mailboxes atomically, and enters the per-core event loops.\" plans/M8.md item C1 (2026-07-25) makes every clause of that sentence real for the first time — before it, `boot_image_core` created exactly one `hv_vcpu`.\n\n**Mechanism.** A cross-core image (any `core=` >= 1; the same live-domain predicate `actors.placement.deterministic`'s single-core floor already uses) emits one entry block per secondary core into its runtime section, and the report publishes each as `CoreEntry core=N base=0x...` beside the existing `Entry base=` line. Core 0's entry writes its own bring-up mark, then rings `mmio::RELEASE_MMIO_ADDR` with the number of cores the image brings up; the VMM refuses a count that disagrees with the `CoreEntry` lines, a release from any core but 0, a second release, and a `CoreEntry` set that is not contiguous from core 1. Each released core installs its own stack (`layout::core_stack_base(n)`), writes its own mark, runs its own event loop, and parks.\n\n**The mark is the oracle, and it is guest-written.** `machine_info::OFF_CORE_MARK` holds `VCPUS` words; core `n` stores `n + 1` — never a bare `1` (a core that ran *another* core's entry block would otherwise be indistinguishable from a correct boot) and never `0` (which is what the zeroed reservation already holds). After the guest halts, `wrela-vmm::check_core_marks` refuses any boot in which a released core's mark is missing or wrong. A released-but-dead core is a machine silently running an image on fewer cores than it claims, which is exactly the failure this item exists to make impossible.\n\n**A single-core image emits nothing**: no secondary entry blocks, no `CoreEntry` lines, no release store, no mark — which is the mechanical reason every M5-M7 boot transcript, report and recording is byte-identical across this item (verified: `cargo xtask check`'s whole golden set moved exactly one file, `check-placement-cross`, whose rtcode/rtdata grew by the emitted secondary blocks and per-core scheduler stripes).\n\n**Mutation-tested, not assumed** (each break was applied and the named oracle observed to fail): emitting no secondary entry blocks -> `core 0 released 3 core(s) but this image's report declares 1`; dropping the mark store -> `core 1 was released but never ran its own entry block`; dropping the release store -> the same; not handing the baton over at the release -> the same; pointing core 2's `CoreEntry` at core 1's block -> caught by the `n + 1` mark (`tests::a_miswired_core_entry_fails_the_boot_closed_over_hvf`). Unit evidence: `wrela-vmm::tests::three_cores_come_up_on_a_cross_core_image_over_hvf` (marks `[1, 2, 3]` on a cross-core boot, `[0, 0, 0]` on the single-core control), `tests::a_fault_on_a_secondary_core_names_that_core_over_hvf`, `tests::parse_report_rejects_malformed_core_entries`.\n\n**Scope of the mark check, corrected 2026-07-25 (orchestrator).** The check is keyed on the release doorbell the guest actually rang (`Shared::released`), not on the report's declared `CoreEntry` count. A `wrela build` (production) image of a cross-core program halts with `EXIT_CODE_NO_RUNTIME` before any release — `layout_program`'s entry stub never calls `build_entry_driver`, so the release block that also writes core 0's own mark is never emitted — yet the image still carries `CoreEntry` lines, because it still *contains* the secondary entry blocks. Keying off the declared count therefore failed such a boot by naming a release that never happened, and turned a clean exit 1 into a bad-image exit 2. Found by building the cross-core golden with `wrela build` by hand and booting it; the single-core twin of the same program exits 1. `sched.state` cannot answer the question — every core is `Finished` by the time marks are checked — which is why the doorbell is recorded rather than inferred. Pinned by `wrela-vmm::tests::a_production_cross_core_image_halts_with_no_runtime_not_a_bring_up_fault`, which asserts the program image still declares its secondary entries so it cannot pass for the wrong reason; the sibling `a_miswired_core_entry_fails_the_boot_closed_over_hvf` still pins the check itself, and the mutation deleting the secondary mark store still fails both cross-core boots — narrowing the scope did not weaken the oracle."

[[clause]]
id = "actors.scheduling.per-core-loop"
doc = "04-compiler.md#2"
status = "test"
tests = [
  "golden/boot-cross-core",
  "golden/boot-cross-core-call",
  "golden/boot-cross-core-two-senders",
  "golden/boot-cross-core-ring-full",
  "golden/err-cross-core-aggregate-reply",
  "golden/err-cross-core-checkpoint",
  "golden/err-cross-core-checkpoint-free-fn",
  "xtask:repro",
]
note = "04-compiler.md §2: \"The reference executor is a cooperative event loop — **one per core**, over the actors placed there. Scheduling is FIFO per mailbox and round-robin across ready actors. There is no cross-core work stealing and no migration; cross-core edges are the generated bounded rings of §3, and the only scheduling nondeterminism in the whole machine is cross-core admission order at each mailbox.\" plans/M8.md item C1 (2026-07-25) ships the per-core loop half; the rings and the admission choice are items C2/C3, and this clause records exactly where the line is drawn.\n\n**One loop per core, over the actors placed there.** `build_runtime_glue_block` emits one `rt_run_one` per live core, scanning only the actors the report's Placement section puts on that core, each with **its own** round-robin cursor and ready-queue stripe (`RuntimeTables::cores`, uniformly strided in `place_runtime_tables`). A shared cursor would make one core's selection depend on another's, which is the migration the chapter forbids. With one live core every actor is on core 0, so core 0's routine is word-for-word the pre-C1 one — the reason no existing golden moved.\n\n**A cross-core edge fails closed, loudly.** Codegen lowers `send`/`await` through an `Actor[X]` handle to the same-core `__rt_enqueue_X` call; until item C2 lowers cross-core edges to 04 §3's bounded SPSC rings, an edge whose sender and target are on different cores is refused at layout time (`layout::check_cross_core_edge`, both image flavors), naming both cores and the item that lifts it. This closed a live hole: before C1, `img.actor(Off, core=1)` awaited from a core-0 root turn *passed* — the report said `core=1` and every one of that actor's turns ran on core 0 (two truths, plans/M8.md shape decision 2). `golden/err-placement-cross-core-send` pins the refusal; with the check removed the same image reports a runtime deadlock instead (verified), which is a different wrong answer, not a right one. A `@driver` placed off core 0 is refused for the sibling reason (its ISR, `@task` and `init` all run in core 0's checkpoint service and boot sequence).\n\n**Determinism is preserved by construction** (plans/M8.md decision 11): Hypervisor.framework binds a vCPU to its creating thread, so there are three host threads, but a single baton means exactly one is inside `hv_vcpu_run` at any instant. The baton changes hands at exactly two **guest** actions — the release doorbell and a park — and `next_core` picks the next core in ascending order from guest-visible state only (which cores were released, which parked, and their own pending words); no host clock, thread id, or address participates. Every parked core is descheduled rather than polled, so nothing spins. Evidence: `cargo xtask repro` green (report determinism over 56 cases, boot-hello record/replay, the blk completion tamper lane), every pre-existing recording replays unchanged, and `bench guest` still reports identical transcripts/exit codes/exit counts across five boots.\n\n**Item C2 (2026-07-25) — the rings are real, and the refusal it replaced is retired.** §2's \"cross-core edges are the generated bounded rings of \u00a73\" now describes shipped code rather than a plan. A `send`/`await` whose call site and target are on different cores has its `Reloc::Call` **redirected** at layout time from `__rt_enqueue_<A>` to `__rt_xsend_<src core>_<A>` (`layout::resolve_cross_core_edge`), a routine with byte-for-byte the same ABI and the same rejection contract; codegen emits one symbolic call and never learns which it got, which is how \u00a73's \"identical message semantics\" holds by construction rather than by two paths agreeing. `golden/err-placement-cross-core-send` — the C1-era guard this clause used to cite — is **retired**, because the thing it refused now lowers; its exact program is `golden/boot-cross-core-call`, whose header records the retirement. What genuinely still must be refused moved to two goldens named for what they refuse (`golden/err-cross-core-aggregate-reply`, `golden/err-cross-core-checkpoint`; see `actors.placement.deterministic` for both arguments). The off-core `@driver` refusal is unchanged.\n\n**Live defect found and fixed (2026-07-26, during M10 planning reconnaissance).** The checkpoint refusal above — a loop back-edge inside a turn placed on a secondary core — was attributed through `layout::caller_core`, whose `None => 0` fallback reads \"a free key is a free turn, and free turns are core 0's\". That is true of a free *turn* and false of a free *function*, which is an ordinary callee running on whatever core called it; both have the same key shape (no `Actor.` prefix), so `turn_owner` cannot tell them apart. Hoisting the identical loop out of a core-1 actor method into a free fn therefore passed the guard, built, and hung at boot: core 1 ran the loop, its checkpoint polled and whole-word-cleared **core 0's** pending word, ate the wake `build_rt_xreply` had just raised for core 0, and the VMM reported \"every core is parked with an empty pending word\" — precisely the failure the guard's own diagnostic text describes, reached by the one path it did not cover. Not a missing policy: a hole in the attribution. Fixed by splitting `attributed_core` out of `caller_core` and having the guard fail closed on `None` as well as on a nonzero core, with free *turns* (`RuntimeTables::free_turns` — the `@test(runtime)` roots and free `async fn`s) still positively attributed to core 0 per 06 §3. Pinned by `golden/err-cross-core-checkpoint-free-fn`, whose header records both vacuity controls the orchestrator ran: move the loop inline and the original \"runs on core 1\" diagnostic returns; delete the loop and the same program boots green. Note the fix is deliberately conservative — an unattributed free fn with a loop is now refused in any multi-core image even if every caller is on core 0, which is the safe side of a check whose job is to *prove* core 0. Separately observed, not fixed, no witness constructed: the group deadline raise at `layout.rs:862-864` stores `1` rather than OR-ing bit 0, which would drop IRQ/wake bits on a multi-vector build.\n\n**M13 item C cut 6 / decision 13 (2026-07-27).** 04 §2 is rewritten: FIFO-per-mailbox + RR across ready actors is *the* semantics, not a degenerate band lattice. `must_service_within`, priority bands, and priority/deadline inheritance leave the normative text for ROADMAP's post-cut re-additions (cleverness-budget only)."

[[clause]]
id = "library.driver.messageable"
doc = "05-library.md#2"
status = "test"
tests = [
  "golden/boot-driver-message",
  "golden/err-boot-driver-message",
  "golden/err-image-driver-message",
  "golden/err-driver-message-capability",
  "golden/err-driver-message-receipt",
  "golden/err-driver-message-task-pub",
  "golden/err-driver-message-isr-pub",
  "golden/err-driver-message-isr-sends",
  "golden/err-driver-message-interrupt-cell",
  "golden/err-driver-message-interrupt-cell-arg",
  "golden/err-interruptcell-in-message",
