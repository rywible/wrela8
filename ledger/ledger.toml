note = "03-hardware.md \u00a73: \"**Shared control memory** (descriptor tables, rings) is `DmaShared[P, L]`: permanently shared, exposing only field-wise typed operations that carry the target's volatile/cache/ordering semantics. It cannot be read as bytes or lent as a plain value.\"\n\nplans/M7.md item D makes the type real and pins both of the sentence's rejections; the field-wise typed operations themselves are item E (03 \u00a73 names them: `write_descriptors`, `publish_available`, `load_used_index`, `notify_queue`).\n\n**It resolves, and its arguments mean what \u00a73 says.** `DmaShared[P, L]`'s first argument is a bound **pool name** \u2014 the same `pool Name` declaration `own[P] T` names, which needed a new `sema::types::TypeArg::Pool` because a pool name is neither a type nor a const expression (`DmaPool[P, N]` takes one in the same position, which is why 03 \u00a71's own `DmaPool[BlockControl, 256.KiB]` could not be spelled at all before this item \u2014 see `hardware.capabilities.unforgeable`'s item-D audit note). **Equality gap from item D, closed in E3:** `types_eq`'s `type_args_eq` left `TypeArg::Pool` vs `Pool` as `false`, so `Option[DmaShared[P, L]] = None` failed with identical expected/found renderings. `golden/check-pool-typearg-eq` is the oracle (fails without the Pool arm, passes with it). `L` must be an `@layout(dma)` struct, checked in `validate_capability_args` beside `Mmio[L]`'s identical rule, for the identical reason: a device reads it, so its bytes are exact and reported (`hardware.layout.exact-bytes`).\n\n**Rejection 1, \"cannot be read as bytes\"** (`golden/err-dma-shared-bytes`): a `@layout` field typed `DmaShared[P, L]`. A `@layout` field is exactly a byte view, and declaring one asks the compiler to say which bytes shared control memory *is*. Permanent, not a fail-closed floor \u2014 no later item makes shared control memory describable as bytes \u2014 and the diagnostic names the fix (name the control structure's own `@layout(dma)` type as `L`).\n\n**Rejection 2, \"or lent as a plain value\"** (`golden/err-dma-shared-lend`): a `read`/`mut` parameter carrying a `DmaShared[P, L]` at any nesting. A loan hands out an ordinary borrow that carries none of the volatile/cache/ordering semantics \u00a73 requires \u2014 an ordinary load or store of a descriptor ring, the whole class of bug the sealed queue operations exist to make unwritable (\u00a73: \"Ordering never appears as freestanding fences in driver source\"). `take` is untouched, since moving the handle is how it reaches a driver at all, and the rule never stands in item E's way: the field-wise operations are methods on the builtin type, which no source can declare.\n\n**Everything else it inherits, deliberately.** `DmaShared` is on `eval::image_checks::CAPABILITY_TYPES` even though it is not one of 03 \u00a71's four capabilities, because every consumer of that list asks it the same question and gets the same right answer: it is unforgeable (`hardware.capabilities.unforgeable`'s forgery arms cover it with no new code \u2014 `no_source_construct_produces_a_capability` gained the `const C: DmaShared[Slots, Ctl]` case), a fn holding one touches DMA state for provenance (`hardware.capabilities.provenance` \u2014 `golden/check-dma-shared` had to move its `install_ring` onto the driver because a free fn taking one is rejected), an `@actor` may not hold one and a `@driver` may, and it has no byte encoding. The one place the distinction is load-bearing is its mint diagnostic, which names it separately.\n\n**plans/M7.md item E1 \u2014 the mint is `VirtQueue.configure`.** `golden/err-dma-shared-unminted` still refuses an image-bound `DmaShared` parameter; the message names where to mint one (`VirtQueue.configure(pool=take ..., ...)`). Decision 11's one word for the queue is the pool base, and ring geometry is one derivation in `virtqueue::place_ring`. Field-wise typed ops on shared control memory remain E2/E3. Deliberately a different message from `Mmio`'s and `IrqCap`'s.\n\n**Item I's sweep (2026-07-24) — the lend rejection was one wrapper deep.** \"lent as a plain value\" was enforced by `dma_shared_in_type`, which walked a type structurally (arrays, tuples, `Option`, `Result`, `fn`, and a named type's *type arguments*) but never into a named type's declared **fields** — unlike `type_contains_capability`, which has had exactly that reach since item A built it for \"at any nesting\". So `read bundle: RingBundle` (a plain struct with one `DmaShared[P, L]` field) handed out precisely the ordinary borrow of a descriptor ring the sentence forbids, carrying none of the target's volatile/cache/ordering semantics. Why it survived: `DmaShared` *is* one of the five `CAPABILITY_TYPES`, so the containment rules — which do walk fields — already caught the wrapper on an `@actor` field, an `@actor` parameter, any `pub` method of either kind, and any fn return. The only surface left is a `@driver`'s own **private** method, which containment deliberately permits (§1's `@driver`-may/`@actor`-may-not asymmetry) — and that is exactly where a real driver would write one. Fixed by giving this walk the shared `components_by_name` table and a cycle guard, so it now reaches through structs and enum variant payloads alike; the diagnostic names the parameter's declared type *and* what it carries, since a bare `RingBundle` would not say why it is refused (`golden/err-dma-shared-lend-wrapped`). `golden/err-dma-shared-lend`'s own message is unchanged (declared type and found type coincide there), and no existing golden moved."

