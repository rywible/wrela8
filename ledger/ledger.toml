[[clause]]
id = "syntax.parser.no-panics"
doc = "02-language.md#8"
status = "test"
tests = ["xtask:fuzz", "golden/err-expr-nesting-depth"]
note = "cargo xtask fuzz parser: seeded deterministic corpus-mutation + token-soup fuzzing through the lex-then-parse pipeline; never panics, result is a successful parse or exactly one error, deterministic across repeat runs; 100_000-iteration deep run clean across 15+ seeds (2.1M+ total iterations, no finds), smoke budget wired into xtask check.\n\nPost-M4 fuzz find (2026-07-24): `cargo xtask fuzz sema --seed 11`'s deep (2_000_000-iteration) run — reachable only once sema.check.roundtrip-stable's own const-closure-suite reparse bug, found at the same seed, was fixed and the run could get past iteration 955154 at all — aborted further in with a native `thread 'main' has overflowed its stack` (fatal: no catch_unwind around a real stack overflow, so no crash artifact was written; the deterministic seed+iteration replay this harness already gives every lane was still enough to bisect the crashing iteration range by `--iters N` and, under a temporary `WRELA_FUZZ_TRACE`-gated eprintln in the fuzz loop, read off the exact input — extracted, then reverted before commit, per house rule). Root cause: the recursive-descent expression precedence chain (`parse_or -> ... -> parse_unary -> parse_postfix -> parse_primary`, syntax/parser.rs) had no nesting-depth guard at all — unlike `sema::bodies::MAX_GENERIC_DEPTH`/`eval::quota::MAX_CALL_DEPTH`, both already fixed-constant-guarded one layer either side of this pass — so a deeply parenthesized/bracketed group or a long chain of unary prefixes (`-`/`~`/`await`/`take`/`send`, all self-recursive in `parse_unary`) recursed exactly as deep as the source nested, with nothing to stop it before it overflowed this process's own native stack; confirmed independent of any specific fuzz mutation by hand (`(((...(1)...)))` alone, no function calls, no comptime evaluation involved, blew the stack past roughly 350-400 levels of plain paren-nesting on the authoring machine's default thread stack). Fixed by a new `Parser::expr_depth: u32` counter, incremented/checked/decremented in a thin guard wrapping `parse_unary` (renamed grammar body `parse_unary_body`, `MAX_EXPR_DEPTH: u32 = 100` alongside `ParseError`): every recursive re-entry into the precedence chain — a parenthesized/bracketed group via `parse_primary`'s own recursive call back into `parse_or`, or a chained unary prefix via `parse_unary`'s own self-recursion — passes through this one guarded function exactly once per nesting level, so one counter at one checkpoint bounds native recursion depth regardless of which construct does the nesting; exceeding it is `error[parse]: expression nesting depth exceeded 100`, the ordinary parse-error path (no new diagnostic shape). 100 was chosen empirically (not measured/profiled — a safety constant, not a performance one): parsing plus the downstream AST dump/pretty-print/`sema::bodies::check_expr` walks (which recurse over the identical tree shape) stayed clean through roughly 350 levels and broke before 400, so 100 keeps a >3x margin while comfortably clearing every real corpus/golden expression (none come remotely close). Minimized to golden/err-expr-nesting-depth (101 nested parens around a bare `1` inside a `return`, the smallest depth that clears the new guard), pinning the parse-stage `ast.txt` diagnostic. `cargo xtask golden`/`cargo xtask corpus`/`cargo xtask roundtrip` all unchanged (184->186 golden expectations, no existing expectation moved) — nothing in the doc/example corpus or any existing golden nests anywhere near 100 deep. See comptime.eval.no-panics for the second, sibling native-stack finding the same deep run surfaced (the comptime evaluator's own `MAX_CALL_DEPTH`, guarded in name but not in native-stack fact)."

