id = "build.root-file-closure"
doc = "02-language.md#2.1"
status = "test"
tests = ["golden/multi-module-accept", "golden/import-cycle-accept", "golden/err-import-path-disagreement", "golden/err-import-missing-module", "golden/err-import-core-miss", "golden/appliance", "golden/check-stdlib-loaded", "golden/err-stdlib-missing"]
note = "plans/M4.md item A: `crates/wrela-compiler/src/loader.rs` — no manifest (02 §2.1, rewritten 2026-07 by human decision, replacing the wrela.toml schema): a build (and, per this item, any tool resolving imports — `wrela dump --stage=check` once the target module has any) is pointed at one root file; its declared `module a.b.c` path must agree with its file path (the file name is the path's last segment, each enclosing directory innermost-first is the next segment up, whatever directory remains once every segment is consumed is the package root — applied to *every* file the closure reaches, not just the root: `loader::anchor_package_root`/`loader::check_agrees`), and disagreement anywhere is `error[build]: module \\`X\\` disagrees with its file path: ...` (golden/err-import-path-disagreement: a root declaring `module app.main` sitting at `src/app/other.wr`). The module graph is the transitive import closure of the root: each `from path import ...` maps to `<pkgroot>/<path with dots as slashes>.wr` (`loader::module_file_path`), loaded if not already visited — a missing file is `error[build]: module \\`X\\` not found: no such file` (golden/err-import-missing-module; deliberately omits the resolved filesystem path from the message — see below) — and the visited set (the loaded map's own keys) makes import cycles between modules free (decision 3, amended 2026-07-23: 02-language.md §2 already settles this, \"import cycles between modules are legal\" — golden/import-cycle-accept, two modules importing each other, loads and checks cleanly). `core` resolves under its reserved alias with no declaration (02-language.md §2): `from core.X import ...` strips the `core` segment and maps the rest onto the toolchain's `stdlib/core/` tree (plans/M9.md item A2 nested the package root under `core/` — see clause `library.stdlib.loaded`; `stdlib/README.md`: `stdlib/core/io_error.wr` declares plain `module io_error`); locating `stdlib/core/` itself uses the dumbest deterministic two-candidate rule, in this fixed priority, no environment variable, no search path (`loader::core_root`, unit-tested directly): (1) a directory literally named `stdlib/core` sitting next to the package root (lets a self-contained project — this repo's own golden fixtures included — ship its own), else (2) the real toolchain `stdlib/core/`, baked in at compile time via `crates/wrela-compiler`'s own `CARGO_MANIFEST_DIR` (`.../../../stdlib/core`) — wherever the compiled `wrela` binary actually runs from. A sibling `stdlib/` without a `core/` subdirectory fails closed as `error[build]: stdlib not found: ...` (golden/err-stdlib-missing) rather than falling through to the toolchain. Importing anything from `core` that does not exist on disk fails the same missing-file diagnostic (golden/err-import-core-miss: `from core.nothing import X`) — deliberately never printing the resolved path here either: candidate (2) bakes in *this checkout's own absolute location* at compile time, which would make a pinned golden fail in any other clone the moment that location differs, so both missing-file messages cite only the dotted module path (stable everywhere) and never `Path::display()`. `wrela dump`'s own wiring (bin/wrela.rs): a module with no imports takes the exact single-file path unchanged (the hard constraint every pre-M4 golden depends on — none moved); a module with any import loads its whole closure through the loader instead, since resolving even one import needs the package root and every module it reaches — golden/multi-module-accept exercises 3 modules across nested directories, aliased imports, and a private (non-imported) sibling declaration side by side with a real accepting build. Unit tests (`loader.rs`, `#[cfg(test)]`, pure — no process spawn): the path-agreement rule at one/two/three segments and its two failure shapes (stem disagreement, directory disagreement), `module_file_path`'s dots-as-slashes join, `core_root`'s sibling-first-else-fallback priority (using real temp directories, since the rule itself is a filesystem check), and the visited-set walk's own cycle termination in isolation from any real file.\n\nplans/M4.md item E note (2026-07-23): the loader now has a real CLI end to end, not just `wrela dump --stage=check`/`--stage=image`/`--stage=report` inspection stages — `wrela build <file.wr> [--out-dir <dir>]` (`bin/wrela.rs::build_cmd`) runs the identical single-file/whole-closure fork this clause already covers, then the shared `build_report` pipeline tail (`run_report_stage`'s own former body, now factored out so `wrela dump --stage=report` and `wrela build` can never silently drift apart), and — unlike every `dump` stage, which stays exit-0-by-convention even for an error dump — exits nonzero on any diagnostic, the loader's own `build`-category ones included. `golden/appliance/expected/build.txt` is the flagship end-to-end proof: `wrela build tests/golden/appliance/src/image.wr` against a fresh, deterministically-named `--out-dir` (`crates/xtask/src/main.rs`'s golden runner, extended with a `build.txt`/`build-err.txt` case shape) succeeds, writes `storage-appliance.report.txt` byte-identical to the pinned `expected/report.txt`, and prints the fixed summary lines `build: name=storage-appliance target=Target.wrela_machine_v1` / `build: devices=1 drivers=1 actors=2 pools=1` / `build: report written to <path>` — the report path printed exactly as derived from the invocation's own `<file.wr>`/`--out-dir` argument text, never canonicalized, so it stays golden-stable. `golden/err-image-unsupervised`/`golden/err-image-dma-pool` each grew their own `expected/build-err.txt` (image.graph.failure-policy's and image.graph.dma-pools' own rejection text, verbatim, exit nonzero) proving the CLI's failure path end to end too (the `err-image-dma-pool` half retired at plans/M7.md item D, when `img.dma_pool` stopped failing closed; `golden/err-image-unsupervised` still carries this evidence)."

[[clause]]
id = "build.category.named-diagnostics"
doc = "02-language.md#2.1"
status = "test"
tests = ["golden/err-import-path-disagreement", "golden/err-import-missing-module", "golden/err-import-core-miss", "golden/err-stdlib-missing"]
note = "plans/M4.md item A opens this clause deliberately (item A's own brief): the `build` diagnostic category (`crates/xtask/src/main.rs`'s `SEMA_CATEGORIES`, extended by exactly one entry) covers every loader-level failure `crates/wrela-compiler/src/loader.rs` raises — root/file path disagreement, a missing file for an imported module path, and (plans/M9.md item A2) a missing `stdlib/core/` tree — rendered through the identical one-line `error[build]: <message> at <line>:<col>` shape every other sema diagnostic uses (`sema::SemaError`, `wrela.rs::print_sema_error`, unchanged). Deliberately *not* covered by this category: a lex/parse failure in any file the closure reaches is that file's own `error[lex]`/`error[parse]`, unchanged (`loader::LoadError::Lex`/`::Parse`) — the loader only ever raises `build` for its own obligations, never for a syntax error in a file it merely reads. The fuzzer's own `SEMA_CATEGORIES` well-formedness check never exercises this category directly (`cargo xtask fuzz sema` drives `sema::check` on one fuzzed file, never the loader), which is why it is listed here as a deliberate addition rather than something the fuzzer discovered — the golden cases above are its whole corpus."
[[clause]]
id = "values.regions.two-binding-disciplines"
doc = "04-compiler.md#3"
status = "gap"
note = "Groups and pools are one region model with two binding disciplines, deliberately not one construct (04 \u00a73, added 2026-07 with this clause per the house rule, resolving the unification question ROADMAP's M4 note recorded): a pool is nominal and compile-time (`own[P] T` carries the binding through signatures \u2014 the half already partially exercised by values.resource.move-spells-take's own[P] goldens and M2's pool-name plumbing), never in the wait-for graph, with reclaim obligations of its own (DMA reclaim gates on device quiescence, not scope exit; reset touches no concurrency machinery); a group's region is anonymous and inferred, and its close is a join node with cancellation/deadline inheritance. M4's image.graph.pools-bound-once pins pool-name binding (bound exactly once, never a value); M6's group clauses (actors.groups.cancellation-order) pin the group half.\n\n**plans/M8.md item R (2026-07-25, decision 16): worked, and deliberately NOT flipped.** The asymmetry now has a direct golden \u2014 golden/check-regions-two-disciplines, one `async fn` that discharges an `own[Parts] u32` handle's whole region obligation and opens a `with group(capacity=2)` four instructions apart, so the negative half is not a claim about a second program. FlowWir: the pool's reclaim is `0002: Mwir Call key=retire dst=t6 args=[t3]`, an ordinary synchronous call in the same state, and the pool's only other trace anywhere in the dump is the *type* `Temp t3 ty=own[Parts] u32` \u2014 no create/close op, no transition, no lineage entry, nothing a wait-for edge could attach to; the group's close is `Transition Await what=GroupJoin{group=t8,children=2} resume=1` plus `0030: GroupClose group=t8 cleanup=[]`, and it is what makes the function `states=2` rather than 1. Report: `Pool name=Parts kind=image ... base=0x40502230 size=32` (a placed region in `pooldata`) beside `Totals ... group_arena=1` (a runtime arena slot in `rtdata`: owner turn, deadline, cancelled flag). Mutation-tested both ways \u2014 deleting the `with group` block drops `group_arena` to 0 and removes the join transition; deleting the pool half removes the `Call key=retire` op and the `Pool` report lines \u2014 so neither half of the comparison is vacuous.\n\n**Why that is not yet a flip, in three parts, none of which is a judgement call.** (1) The old flip condition's own witness is *unconstructible*, not merely unwritten. There is no wait-cycle diagnostic anywhere in this compiler: 04 \u00a71's Progress paragraph (\"The unified wait-for graph ... is acyclic ... Diagnostics print the full cycle\") is unimplemented and, separately, has no ledger clause of its own \u2014 a coverage hole named here, owned by nobody, deliberately left alone by item R. And no wait cycle is reachable from source even in principle: M6 item D's recorded finding (`layout::emit_deadline_scan_and_delivery`'s own doc comment; `wrela-vmm`'s `deadlock_diagnostic_prints_the_named_line_and_exits_nonzero_over_hvf`) is that `@image` wiring is the only way to hand out an `Actor[T]`, its arguments evaluate in declaration order with no forward reference and no post-hoc rebinding, so the handle graph is acyclic by construction \u2014 re-verified by experiment 2026-07-25: `a = img.actor(A, peer=b)` written above `b = img.actor(B, peer=a)` is `error[name]: unknown name `b``, one pass before any progress analysis could exist. The parenthetical was a witness borrowed from the archived v0.1 draft's unified wait-for graph (docs/archive/v0.1-draft/04-actors-and-async.md \u00a73.1), which this compiler has not built; it was never satisfiable by a golden and is retired as this clause's condition. It is not *discarded* \u2014 it belongs to whatever clause eventually covers 04 \u00a71, because a cycle diagnostic tests the progress analysis, not the region model. (2) `with pool` \u2014 the scoped-pool half of \u00a73's own two-construct comparison \u2014 is `error[unimplemented]` (golden/err-with-pool-unimplemented, which item R made *reachable*: it was previously reported as `error[name]: unknown name `pool``, see sema.unimplemented.fail-closed). So \u00a73's last sentence, \"A scoped pool is a named, typed window over the same region machinery a group gets implicitly \u2014 not a group with a budget\", has no code to test, and the genuinely same-shaped pair (`with group(...)` beside `with pool(...)`, differing only in which discipline is used) cannot be written; check-regions-two-disciplines uses an *image* pool instead, which is the discipline this note already counted as pinned by image.graph.pools-bound-once. (3) \u00a73's \"a DMA pool's reclaim is gated on device quiescence, not on scope exit\" **has since landed** \u2014 plans/M8.md item F, `hardware.dma.reclaim-after-quiescence`: `VirtQueue.reclaim` refuses until the host-written quiesce count has moved past the quarantine's stamp, pinned by `golden/boot-dma-reclaim` and its one-line-deleted negative twin. That half of condition (ii) below is therefore satisfied. \"Reset reuses slots without touching any concurrency machinery\" still needs the scoped-pool reset from (2). Three of this paragraph's sentences are therefore untestable today; flipping to status=test would claim coverage of a normative paragraph a third of which no oracle touches.\n\n**Flips when** (i) `with pool` is implemented and check-regions-two-disciplines gains a twin differing from it in exactly one construct \u2014 `with pool(capacity=N)` where it says `with group(capacity=N)` \u2014 pinning that the pool twin has no join transition, no arena slot, and one fewer state; and (ii) \u007e\u007equiescence-gated DMA reclaim lands\u007e\u007e \u2014 **done 2026-07-25**, plans/M8.md item F. Only (i) remains, and it is an ordinary work item with an owner, not an open question."

[[clause]]
id = "comptime.tests.exhaustive"
doc = "02-language.md#12.2"
status = "test"
tests = [
  "golden/check-tests-exhaustive",
  "golden/check-tests-exhaustive-counterexample",
  "golden/err-test-exhaustive-param",
]
note = "`@test(exhaustive)` (02-language.md §12.2, added post-M3 with this clause in the same commit per the house rule): a comptime-legal `fn` with parameters has its entire input domain enumerated — every parameter must be default-mode and of an enumerable type (`bool`, `u8`, `i8`, or a fieldless non-generic module enum; `sema::bodies::check_exhaustive_test_params`, validated against the resolved declaration, golden/err-test-exhaustive-param), the product of the domain sizes is capped by `eval::quota::MAX_EXHAUSTIVE_CASES = 65_536` (a fixed revision-0.1 constant like every other quota; `u8 × u8` exactly admitted; over the cap fails that test's own report line naming the count — never sampling, golden/check-tests-exhaustive-counterexample's `domain_over_cap`), and the body runs once per case, each under its own fresh `Quota` (`eval::interp::eval_test_case`, `eval_test`'s twin with parameters bound). Enumeration order is fixed and pinned: per-parameter canonical order (`false` before `true`, numeric ascending, enum variants in declaration order), cartesian product with the rightmost parameter varying fastest — so a failing test's first counterexample is deterministic and reported in the FAILED line as `[param=value, ...]` (golden/check-tests-exhaustive-counterexample pins both a single-parameter and a two-parameter counterexample, the latter proving the rightmost-fastest order: `[flag=true, x=3]` means every `flag=false` case ran first... rightmost `x` varies fastest *within* `flag=false` before `flag` advances, so the first failure is the first `flag=true` case with `x >= 3`). A passing run prints `test <name>: ok (<N> cases)` — the case count is part of the pinned report (`xtask`'s `test_line_well_formed` accepts exactly this one new success shape; the fuzz-eval well-formedness invariant covers it every iteration). golden/check-tests-exhaustive: three passing tests — a u8 wrap round-trip (256 cases), an i8 wrapping double-negation identity (256 cases), and an enum×bool range property (6 cases) — each a §6.1 statement verified for every input, which is the point: bounded domains + the build evaluator make a test a proof, at the cost of one loop (the mechanism is `eval/mod.rs::run_exhaustive_test`, an odometer over `param_domain` vectors — no new architecture)."

[[clause]]
id = "comptime.specialize.selected-branch-only"
doc = "02-language.md#12"
status = "test"
tests = [
  "golden/check-comptime-if-module",
  "golden/check-comptime-if-member",
  "golden/check-comptime-if-stmt",
  "golden/err-comptime-if-not-bool",
  "golden/err-comptime-if-not-comptime",
]
note = "`comptime if` specialization (plans/M3.md item D, decision 8: \"the unselected branch is dropped before body checking, so the graph that is checked is the graph that exists\") — `crates/wrela-compiler/src/sema/specialize.rs`, run as the very first step of `sema::mod::check_typed`/`sema::mod::dump`, before `symbols::collect` even sees the module. All three surface forms land: module scope (`Item::ComptimeIf`), member scope (`Member::ComptimeIf`, struct bodies only — an enum has no member list to gate, see below), and statement scope (`Stmt::ComptimeIf`, inside any `fn`/`init`/method body, recursively through `if`/`match`/`for`/`while`/`defer`/`with` blocks). Every `comptime if` node in the whole module is replaced, in place, by its own selected branch's items/members/statements (the other branch — and the `comptime if` node itself — is simply never spliced back in), so every later pass (`collect`/`resolve`/`declare`/`bodies`/`access`/`flow`/`matches`/`generics`) only ever walks the already-specialized module; none of those passes needed to change to \"support\" specialization, since a specialized module is, by construction, indistinguishable from one that never had a `comptime if` in it. My own explicit reading of the normative ordering, pinned by the goldens below (`specialize.rs`'s own module doc states the full reasoning): the doc (02 §12) requires a condition to be \"comptime-evaluable with the real evaluator\" but does not order that evaluation against the rest of the pipeline, and the obvious ordering is circular (a module/member-scope branch may itself declare the very `const`s a sibling condition needs, and a plain `const`'s own value is not evaluated until `eval::check_consts`, which runs at the very end of `check_typed` — long after specialization would need to already be done). This pass breaks the circularity with one dedicated, deliberately narrow rule instead of general const-propagation: a `comptime if` condition (any of the three scopes, one shared rule) may reference only literals and plain top-level `const` items declared directly in the module (never nested inside any `comptime if` branch, selected or not) combined with unary/binary/logical operators — no fn calls, no locals, no `self`, no generic type/const parameters (so the worked example's own `comptime if MODE == DriverMode.Irq:`, gated on a struct's own generic const parameter, is out of scope here — it needs per-instantiation specialization, a materially harder feature; the same documented boundary decision 10 already draws around \"generic methods' own type parameters\"). Mechanically: `compute_known_consts` harvests every `comptime if` condition anywhere in the raw module (both branches, conservatively) and computes the transitive closure of top-level const names they reference; `build_const_skeleton` builds one throwaway `Module` containing only those specific consts and runs it through the ordinary `collect -> resolve -> declare -> bodies` pipeline to get one small `TypedProgram` + `ModuleCtx`; every condition in the file is then type-checked (`bodies::check_expr`, expecting `bool` — the real per-expression typing machinery, not a hand-rolled duplicate) and evaluated (`eval::interp::eval_standalone`, the real evaluator) against that one shared skeleton in a single left-to-right expansion walk. A condition reaching outside this vocabulary — a const hidden inside another (still-unresolved) `comptime if` branch, a local, a call, a generic parameter — fails closed via `check_comptime_vocabulary`'s own pre-scan rather than attempting a wrong answer (`error[comptime]: comptime if condition references \\`<name>\\`, which is not comptime-visible here...\", or `error[unimplemented]` for an unsupported expression form entirely). Legality (plans/M3.md item C): this vocabulary has no fn calls at all, so a condition can never reach a callee — nothing for `eval::legal::require_legal` to gate here (item D's legality wiring instead lands on `const` initializers and `comptime assert`, both of which do support calls — see `comptime.assert.build-error` below and `eval/mod.rs`). 02-language.md §7.2 (\"match is exhaustive, checked after comptime specialization\") becomes literal, not just orderable: golden/check-comptime-if-member selects a module-scope `enum Status` between a 2-variant and a 3-variant declaration (`WITH_EXTRA: bool = false` picks the 2-variant one) and a `match` over it with arms for exactly those 2 variants — `matches::check` (which re-walks the already-specialized module, unchanged) accepts it as exhaustive; had specialization not dropped the 3-variant branch, or had it run after (rather than before) `matches`, this same program would either need a third arm or would wrongly reject the two-arm match as non-exhaustive. The same golden's `Counter.bonus` method is member-scope-specialized (struct body). golden/check-comptime-if-module selects between two whole `fn label()` versions at module scope, and its `typed.txt` (plans/M3.md decision 2's touch convention) pins that the typed dump shows only the selected body (`return 1`), never the dropped one. golden/check-comptime-if-stmt specializes a statement-scope `comptime if` picking which of two assignments to `y` runs. golden/err-comptime-if-not-bool: a condition typed `u64` — the ordinary `error[type]: expected \\`bool\\`, found \\`u64\\`` (`bodies::check_expr`'s own existing expected-type gate, reused verbatim, no new diagnostic shape). golden/err-comptime-if-not-comptime: a statement-scope condition referencing a local (`y`, bound two lines above by an ordinary assignment) — the vocabulary pre-scan's own diagnostic, since `y` was never harvested as (and is not) a top-level const. `cargo xtask fuzz sema --iters 200000` clean at seed=1 (the typed-roundtrip oracle, `sema.typed.roundtrip`, already exercises every corpus/golden entry containing a `comptime if`, `specialize` included, since it sits ahead of `check_typed` unconditionally); `cargo xtask roundtrip` clean (127 golden entries, sema-roundtrip-checked). What this pass does not attempt, disclosed rather than silently gapped (`specialize.rs`'s own module doc, \"What this pass deliberately does not specialize\"): a `comptime if` nested inside a closure literal embedded in an expression (not a `fn`/`init`/method's own statement list) is not rewritten — it still fails closed via `bodies.rs`'s own residual `error[unimplemented]: \\`comptime if\\` is not checked yet`, kept in `bodies.rs`/`flow.rs`/`matches.rs` as an unreachable defense-in-depth net now that `specialize` normally eliminates every such node first."

[[clause]]
id = "comptime.assert.build-error"
doc = "02-language.md#12"
status = "test"
tests = [
  "golden/check-comptime-assert-pass",
  "golden/check-comptime-assert-call",
  "golden/err-comptime-assert-fail",
  "golden/err-comptime-assert-param",
  "golden/err-comptime-assert-local",
  "golden/err-comptime-assert-loop",
  "golden/err-comptime-assert-field",
  "golden/err-comptime-assert-self",
  "golden/err-comptime-assert-for-var",
]
note = "`comptime assert` (plans/M3.md item D, decision 8: \"`comptime assert` evaluates after typing; failure is a build error with the message\"). Only a statement-scope form exists in this grammar (`Stmt::ComptimeAssert`, frozen at M1) — there is no module-scope `comptime assert` item node to lift a fail-closed on, so this clause covers exactly the representable surface. `bodies.rs`'s own long-standing `error[unimplemented]` on `Stmt::ComptimeAssert` is lifted: `check_comptime_assert` (mirroring `check_assert`'s own shape exactly — condition typed as `bool`, message required to be a text literal) now produces a real `TypedStmtKind::ComptimeAssert{span, cond, message}` node instead of erroring — the one deliberate exception to decision 1's \"no spans anywhere\" (typed.rs's own doc comment on the variant explains why: this node is checked exactly once, unconditionally, independent of any call graph, so its own build-error needs a real `L:C` the way nothing else in the typed tree does). Evaluation is a *separate*, whole-program pass (`eval::check_comptime_asserts`, called from `sema::mod::check_typed` right after `generics::check`, alongside `eval::check_consts` under one shared `eval::check_comptime` entry point) rather than inline per-call execution: `interp::exec_stmt`'s own arm for this node is a no-op, with a comment explaining why — a `comptime assert` must prove something even for a fn/method/instantiation nothing else in the program ever calls (`ROADMAP.md`/plans/M3.md's own \"comptime assert proves\"), which ordinary per-call evaluation could never guarantee, and its own vocabulary (module consts/literals only, via `eval::interp::eval_standalone` with zero locals bound — referencing a local is refused up front by `eval::check_one_comptime_assert`'s `first_runtime_local` pre-check with the categorized diagnostic naming the rule `comptime if` already draws (plans/M9.md item NN) — never `internal error: unbound local`) never depends on a specific call's own arguments anyway. The whole-program walk (`check_comptime_asserts`) collects every `TypedStmtKind::ComptimeAssert` site from every fn/method/instantiation body — `eval/mod.rs`'s own `collect_asserts_stmts`/`collect_asserts_expr`, an exhaustive walk mirroring `eval::legal`'s own `scan_stmt`/`scan_expr` shape so a new node kind forces a compile error here too, kept as its own small walk rather than widening `legal::BodyScan` with a lifetime parameter every existing call site would then have to thread through — in the same `BTreeMap` order `legal::classify` itself enumerates nodes (fns, then structs' methods/assoc-fns/init, then instantiations), depth-first in source order; fail-fast. Legality (plans/M3.md item C, this item's own C×D wiring): every direct callee an assert's own condition/message reaches (`legal::direct_callees`, a new small public helper reusing `legal::scan_expr`'s existing exhaustive match verbatim) is `require_legal`'d against one program-wide `legal::classify` computed once and shared with `check_consts` (context `\"comptime assert\"`, the exact wording `eval::legal`'s own doc comment names). golden/check-comptime-assert-pass: `comptime assert LIMIT > 0, \"LIMIT must be positive\"` with `LIMIT: u64 = 10` — accepted. golden/err-comptime-assert-fail: the identical assert with `LIMIT = 0` — `error[comptime]: comptime assert failed: LIMIT must be positive at 6:5`, the message and a real location both present (contrast `comptime.eval.abandonment-is-build-error`'s own `error[comptime]: assertion failed: ...` with no location at all — that is a plain runtime-shaped `assert` executed *during* comptime evaluation of a const, a different node with no span to give; this one is a `comptime assert`'s own dedicated diagnostic, which does have one). `cargo xtask fuzz sema --iters 200000` clean; `cargo xtask check`'s bench-compiler check lane (now walking every fn/method/instantiation body for `comptime assert` sites on every golden `--stage=check` run) stays within its locked threshold (29.4ms median against 40ms). plans/M9.md item NN: goldens err-comptime-assert-{param,local,loop,field,self,for-var} pin the visibility refusal; check-comptime-assert-call is the legal call twin; `fuzz sema`/`eval` generate the refusal shapes every fourth iteration."

# --- M3: hardening + measurement ---------------------------------------

[[clause]]
id = "comptime.fstring.bounds"
doc = "02-language.md#12"
status = "test"
tests = [
  "golden/check-fstring-bounds",
  "golden/check-format-fstring-guest",
  "golden/err-fstring-unbounded-operand",
  "golden/err-fstring-secret",
  "golden/err-fstring-no-widen",
  "golden/err-fstring-in-isr",
  "golden/err-fstring-bound-overflow",
  "golden/err-string-concat-overflow",
  "golden/err-string-capacity-build-limit",
]
note = """02-language.md §1.1 / 05-library.md §6: `f\"...\"` type-checks every interpolation and sums literal bytes plus each operand's `max_formatted_len` into `String[..N]`. plans/M9.md item D (decisions 260–264).

**Desugar (decision 261).** `f\"...\"` becomes a left-fold of `String` concat over literal pieces and `expr.format()` — C2's Format + concat surface. Empty-spec only; nonempty `{expr:spec}` refuses. `{{`/`}}` already unescaped by the parser into literal braces.

**Exact capacity (decision 260).** `String[..N]` does not widen to `String[..M]` for `M > N`. Rejected: capacity-widening coercion (would need a layout copy and undo C2's exact Format bounds).

**Refusals.** No Format → f-string operand of type T has no Format (unbounded / no max_formatted_len; 05-library.md §6) (`err-fstring-unbounded-operand`, `err-fstring-secret` against a no-Format type until item G lands Secret[T]). ISR formatting → uses formatting (f-string / Format) (`err-fstring-in-isr`). Assert messages stay text-literal-only.

**Pinned.** `check-fstring-bounds`: `f\"{42}\"` settle `2052050`; inferred `f\"a={a}\"` → `4097061`; `f\"n={42u32} ok={false}\"` → `13110061` (value `n=42 ok=false`), braces `9123108`, `label(7)` → `4105100`, bound `21` (eval/value pins; mwir stays comptime-only `Store.init` by design — guest f-string / Format lowering is owned by `check-format-fstring-guest`, plans/M9.md item KK decision 365). Item D2 extended the golden to lead with the literal/inferred spellings.

**Guest tier (plans/M9.md item D3, decision 320).** Same `check-format-fstring-guest` pins f-string lowering in a guest-reachable `@actor` method (mwir `FormatScalar`/`StringConcat`, boot `19`).

**plans/M9.md item K1 (decisions 540–544).** A summed / concatenated capacity must be layout-representable: `8*(1+N)` fits in `usize` (`string_capacity_fits`). Pre-fix accepted i128 sums (including `2^60+2^60`) and then panicked at lowering (`capacity overflow`). Pinned: `golden/err-fstring-bound-overflow`, `golden/err-string-concat-overflow`. Literal `String[..N]` annotations and Format bounds use the same gate.\n\n**Corrected 2026-07-26 by `cargo xtask fuzz lower --seed 101` (iteration 6134), during M9's closing deep soak.** K1's predicate checked that `8 * (1 + N)` does not overflow `usize`, which admits `N = 2^60`: the byte count is computable, and then `lower::emit_string_aggregate` calls `Vec::with_capacity(1 + N)` and Rust aborts with `capacity overflow` — a bare panic, not an `internal error:` diagnostic, so K1's own fail-open was still open through a door it did not cover. The fuzzer found it by truncating `err-fstring-bound-overflow` so the *declared* `String[..2^60]` survived without the concat sum K1 did guard. The rule is now a **build limit** (`MAX_STRING_CAPACITY = 65_536`), reusing the number and the reasoning `[elem; N]` already carries — a `String[..N]` is one length word plus `N` byte slots, so `N` is an element count in exactly the sense an array's is; at the limit the aggregate is 512 KiB. Pinned at the declaration site by `golden/err-string-capacity-build-limit`. **Both pre-existing goldens had silently become tests of the wrong error** — the declaration-site limit fires before their sums do — so both were re-based onto individually-legal operands (40000) whose sum (80000) exceeds the limit; their pinned messages are unchanged and only their line numbers moved. That re-basing is the point worth keeping: tightening a guard can make an older guard's golden vacuous, and nothing in the harness would have said so."""

