note = """plans/M11.md item D / decisions 702 / 763: the generated `core.__image_runtime` module is facts only — module header + version comment, `const` bindings, `@layout(runtime)` types, exactly one `@placed` static at `RTDATA_BASE`, and (later) exhaustive `match` ladders. It may not contain `while`/`for`/`async`/`@actor` or other decisions. Pinned by `expected/rtconfig.txt` on `boot-actors` (N_CORES=1) and `boot-cross-core` (N_CORES=3); unit test `rtconfig::tests::facts_only_forbids_control_and_actors` refuses those constructs in generator output. Opaque `RuntimeTables.bytes: [u8; RTDATA_BYTES]` overlay for item D; structured fields land as E–J migrate emitters.

**plans/M12.md item A (decision 870) — generator cap constants (`rtconfig.rs:134–152`), recorded in the 06 §2 style (named ceiling; build fails closed when exceeded):** a build that needs more than **`SELECT_STUB_COUNT` (32)** select stubs fails closed at generation — honest fail-closed scaffolding. A build that needs more than **`RESUME_STUB_COUNT` (16)** resume stubs fails closed at generation — honest fail-closed scaffolding. **`RING_POOL_COUNT` (8)** is special: after plans/M12.md item C it caps the dispatch trampoline pool (`__wrela_xsend_0..7`), not the data representation — the numbered ring data statics die; the trampoline pool stays as dispatch. A build that needs more than **`ENQUEUE_STUB_COUNT` (32)** enqueue stubs fails closed at generation — honest fail-closed scaffolding. A build that needs more than **`MB_POOL_COUNT` (32)** mailbox-root overlays fails closed at generation — honest fail-closed scaffolding. A build that needs more than **`METHOD_CALL_POOL_COUNT` (128)** method-call stubs fails closed at generation — honest fail-closed scaffolding. A build that needs more than **`BOOT_CALL_POOL_COUNT` (32)** boot `init` call stubs fails closed at generation — honest fail-closed scaffolding. A build that needs more than **`IRQ_CALL_POOL_COUNT` (8)** IRQ handler stubs fails closed at generation — honest fail-closed scaffolding. **`WAKE_CALL_POOL_COUNT` (8)** is special after plans/M12.md item D: it caps the wake `@task` dispatch trampoline pool (`__wake_call_0..7` / `__wrela_wake_invoke`), not the data representation — the numbered `WAKE_PEND*` statics and load/store ladders die; sticky bits live in one `WAKE.wake_pending` array. A build that needs more than **`TEST_CALL_POOL_COUNT` (16)** `@test(runtime)` call / prefix stubs fails closed at generation — honest fail-closed scaffolding.

**plans/M12.md item C (decisions 875–879) / item D (decisions 880–882) / item E (decisions 883–885):** a generated dispatch ladder is forced; a generated data ladder is a defect. Init zero-fill sorts/merges adjacent `(addr, nwords)` into maximal `INIT_SPAN{k}` overlays (`N_INIT_SLOTS` = live span count; `INIT_SPAN_POOL_COUNT` (8) is the fixed import/placeholder ceiling). `__wrela_init_nwords` / `__wrela_init_store_word` shrink to the live span count — still dispatch ladders over spans, not per-actor numbered data statics."""

