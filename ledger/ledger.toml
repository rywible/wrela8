note = "FLIPPED from `gap` to `test` (2026-07-24, M6 item D's own verification follow-up): the runtime-test handle rule (02 §12.2, decision 11b) is implemented end to end. Sema: `test_attr_kind`'s runtime arm now allows params (the arity restriction stays for bare `@test`); `check_runtime_test_params` (`sema/bodies.rs`, mirroring `check_exhaustive_test_params`'s own \"arity at the attribute, shape against the resolved declaration\" split) requires every param mode `read` and type exactly `Actor[T]` — `T` itself is already guaranteed a real `@actor`/`@driver` struct by `types::validate_fn_actor_types`, unconditional at declare time, so this fn only checks *shape*, not re-deriving \"is T an actor\" a second time. `golden/err-test-runtime-param-nonhandle` (a bare `u64` param) / `golden/err-test-runtime-param-mut` (a `mut Actor[T]` param) pin the two rejections.\n\nBuild/test-image wiring: `bin/wrela.rs::test_cmd` now evaluates `@image` (if any) via `eval::interp::eval_image` before laying out the test image (previously never called at all in this path — no existing `@test(runtime)` golden declared an actor, so nothing regressed by its absence), then `resolve_runtime_test_args` (new) resolves each runtime test's own `Actor[T]` params against the image graph's own declared instances — `T`'s *unique* match across `graph.actors`/`graph.drivers` (04 §6's own \"Actor as-if\": a handle is just a build-time-constant index) by name equality (`types::render_type`); zero or more than one is a real `error[build]` line naming every candidate (`actor#i`/`driver#i`, the identical spelling `eval::image::dump`'s own edge lines use). A handle-param test with no `@image` in its own closure gets the identical `error[build]` (0 candidates found) — verified directly, reads sane, not pinned as a separate golden (the message is exactly `resolve_runtime_test_args`'s own ordinary \"found 0\" case, no special wording needed). Resolved values (build-time actor indices) thread through `layout::layout_test_image`'s new `test_args: &BTreeMap<String, Vec<u64>>` parameter into `build_entry_driver`'s own per-test call site, loaded into `x0..` (declared param order) immediately before `bl_call_key(name)` — a zero-param test (every pre-decision-11b test) loads nothing, byte-identical.\n\n`golden/boot-actor-smoke` (new) is the down payment: one actor (`Store`, a zero-arg `init` plus a sync `pub fn get`) and an async `@test(runtime) fn smoke(store: Actor[Store])` that `await`s a real message through the resolved handle and asserts the reply — boots for real on Hypervisor.framework, `test smoke: ok` / `1 passed, 0 failed`, pinned as `expected/test.txt`.\n\n**Three real, previously-unexercised bugs this exact boot found and fixed** (this crate's own established \"behavior is the oracle\" precedent, `actors.runtime.static-tables`'s own note has two earlier instances of the identical pattern): (1) `layout::build_boot_init` never saved/restored `x30` around its own `bl_call_key` call into a declared `init` — the *exact* mistake `build_rt_select_and_run_core`'s own module doc already named as a hard-won lesson, reintroduced here and caught the same way (a real boot hanging forever, this time the whole entry driver looping from its own start once `init` returned into the wrong return address). (2) `codegen::is_aggregate` classified `Actor[T]` (and every other M6 builtin-pseudo-type) as a by-pointer aggregate, since `Type::Named(..)` was aggregate unconditionally — invisible until this item's own first real boot of an `Actor[T]`-typed `@test(runtime)` parameter, which faulted dereferencing the handle's own small integer value as an address (`ipa=0x0`); fixed by exempting `Actor`/`Group`/`Instant`/`Duration`/`Admission`/`Peer`/`Rejected` (mirroring `mwir::size_of`'s own already-established exemption list). (3) `codegen::emit_await`'s own `AwaitKind::ActorCall` codegen wrote the bare scalar reply straight into `result_temp`'s own slot with no `Result` envelope at all — `result_temp`'s real type is always the composed `Result[T, CallError[E]]` (02 §9.4), so the reply's own bit pattern landed in the *tag* field; a `match` on the awaited value then found neither `Ok` nor `Err` and failed closed (`golden/asm-async-basic`'s own diff shows the fix precisely: tag `0` written first, the reply moved to the payload offset). All three found via real HVF boots, not dump review — `objdump`/Capstone-assisted disassembly of the actual emitted image bytes is what isolated each one; recorded here rather than silently fixed away, matching this file's own established practice. `golden/asm-async-basic`/`golden/asm-async-loop-checkpoint` moved once more for fix (3) (reviewed: only the reply-composition sequence widened, checkpoint placement unchanged) — cited in `actors.codegen.state-machines`'s own note-update.\n\nA fourth latent bug fixed in passing, found by code review while wiring this item rather than by a boot (recorded regardless, per house rule): `build_runtime_glue_block`'s own `build_rt_select_and_run_symbolic` output (a real `Reloc::Call` per dispatch entry) was never collected into `layout_test_image`'s own `harness_relocs` at all — every prior actor-bearing test image's dispatch `BL` would have stayed an unresolved, self-referencing placeholder the first time anything actually called it; `boot-actor-smoke` is the first case that exercises a dispatch call at all, so this was caught before it could bite silently.\n\nDisclosed, unresolved gap surfaced by this same item, fixed alongside it (`xtask`'s own fuzz-lower lane, `compiler.lower.no-panics`): that lane's own pipeline never calls `flowwir_lower`/`codegen_program_with_async` (sync-only, by its own long-standing design), so an async `@test(runtime)` fn joining the fuzz corpus (via this item's own new goldens) made `attempt_layout` report a spurious `\"internal error: ... was never codegen'd\"` — fixed by skipping the layout attempt whenever any runtime test is async (an honest `Skipped`, not a crash); extending that lane to the async pipeline is real, further, undated work, named here rather than silently patched over.\n\nFuzz lower/eval/sema re-run clean at 200k iterations, 2 fresh seeds each (201/202), after every fix above landed. `cargo xtask check` green; `boot-hello`/`boot-many-tests` transcripts untouched (git-verified byte-identical, not just golden-suite-green).\n\n**Note-update (plans/M6.md item H, 2026-07-24, orchestrator verification): the rule's *more-than-one* branch had no test at all.** 02-language.md \u00a712.2's own sentence covers two failure modes \u2014 \"zero or more than one instance of `T`\" \u2014 and only the zero branch was pinned (`golden/err-image-actor-undeclared`, cited on `image.layout.sections-verified`). Half of a rule this repo itself introduced (decision 11b) was therefore unverified. `golden/err-image-actor-ambiguous` closes it: two `Store` instances, one `Actor[Store]` test parameter, and the runner fails naming both candidates (`found 2 (actor#0, actor#1)`) rather than silently picking one \u2014 which is exactly the \"searched for or mocked\" behaviour the sentence forbids. Recorded while pinning it, because it is a real scope boundary and not obvious: `wrela build` on the identical file **succeeds** (`actors=2`), and correctly so \u2014 building the appliance image never involves a `@test(runtime)` fn's parameters at all, so this diagnostic belongs to the runner (`resolve_runtime_test_args`) and the golden pins `expected/test.txt`, not `build-err.txt`."

