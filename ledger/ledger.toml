note = "Pre-M3 adversarial sweep of feature *intersections* (M2's own goldens each test one feature singly; wrong-accepts live where passes hand off) across generics×flow, generics×access, closures×moves/exclusivity, defer×flow, match/patterns×moves, init×flow, `?`×moves, for/while×exclusivity, receiver-inference×generics, and struct-literal/enum-payload×access — roughly 30 probes plus their legal twins, classified CORRECT/WRONG-ACCEPT/WRONG-REJECT/PANIC. Four real bugs found and fixed narrowly (no existing golden's expectation changed): (1) `flow.rs`'s `place_type` returned `None` for any field reached through an *instantiated* generic struct (non-empty type args), silently skipping the resource overwrite-live and implicit-copy checks for e.g. `Box[DmaBlock].item` — fixed by substituting the field's type through the struct's own generics via a new `generics::subst_field_type`, widened `pub(crate)` for the reuse (golden/err-x-generic-flow-overwrite, golden/err-x-generic-flow-copy, golden/check-x-generic-flow-restore). (2) `check_takeable` only forbade a whole/field `take` when the underlying root was `mut`-mode, never `read`-mode; ordinary `take place` expressions are already rejected against a `read` root by `access.rs`, but a `take` written inside a `match`/`is` *pattern* payload (`Pattern::Take`, a different AST node `access.rs` never re-derives root mode for) bypassed that check entirely, letting a resource be stolen out of a merely-borrowed scrutinee — fixed by extending the same root-mode check in `check_takeable` to also reject `read` (golden/err-x-match-take-read). (3) the loop fixed-point re-walk (`walk_while`/`walk_for`) carried a resource local first bound *inside* the loop body forward across fixed-point passes as if it were live cross-iteration state, so `q = make(i)` inside any loop body spuriously failed `check_overwrite_live` starting on the second pass — fixed by pruning every path whose root wasn't present in the pre-loop state from the candidate before each pass (`prune_loop_locals`), since such a root is, semantically, reintroduced fresh every real iteration (golden/check-x-loop-fresh-resource). (4) a `mut` marker was accepted on a struct-literal field / enum payload / builtin pseudo-constructor argument — positions plan item D deliberately never mirrors against a declared parameter — which bypassed both the implicit-copy check (only checked for the unmarked/`Read` shape) and `take`'s own deinitialization, letting a resource end up with two simultaneously live owners; fixed by a new `access::check_payload_arg` (rejects `mut` outright; `take`/unmarked still legal per §3's \"a literal operand\") swapped in at the four synthetic/payload call sites (golden/err-x-payload-mut-marker). Two more intersections were judged correct-but-newly-covered and pinned without any fix: instantiated-generic-method call-site mirroring/receiver-mutability (golden/err-x-generic-access-mirror, golden/err-x-generic-access-receiver), a closure capturing a moved-from local and the same resource taken by two closures across separate calls (golden/err-x-closure-take-twice), a closure `mut` parameter that does not overlap its call's own lent place (golden/check-x-closure-mut-receiver), and `init`'s whole-`self` check firing even when the use is indirect, through a method call on `self` before every field is assigned (golden/err-x-init-flow-selfmethod). One further finding was judged structural (new cross-exit bookkeeping, not a missed condition) and is recorded, minimized, in plans/pre-M3-findings.md rather than patched: `defer`'s body is validated once at registration state, not re-checked against every real exit, so a place taken after registration on one path but not another is not caught. The sibling finding recorded alongside it — `for`/`while`'s `take_binding` AST field (`for take x in ...`) parsed and pretty-printed but never checked by any sema pass — has since been fixed (values.resource.move-spells-take's own note; golden/err-x-for-take-borrowed, golden/err-x-for-take-mismatch, golden/err-x-for-take-element-borrowed, golden/check-x-for-take-consume, golden/err-x-for-take-reuse) and is marked fixed in plans/pre-M3-findings.md rather than removed from that record."

# --- syntax hardening (post-M2, pre-M3) ------------------------------------

[[clause]]
id = "syntax.lexer.layout-islands"
doc = "02-language.md#1"
status = "test"
tests = [
  "golden/lex-layout-island",
  "golden/err-inline-suite-two-stmts",
  "golden/check-embedded-suite", "golden/err-empty-embedded-suite",
  "golden/err-closure-suite-comma-trail",
  "golden/check-closure-suite-non-last-arg",
  "xtask:fuzz",
  "xtask:roundtrip",
]
note = "Closes the roundtrip ambiguity plans/pre-M3-findings.md recorded as finding 3 (a place-postfix ambiguity inside a bracket-suppressed embedded suite lets a `take`/`mut` place's call-shaped postfix parse silently swallow the next, unrelated statement's leading token, found by `xtask fuzz sema` deep, seed=1, iteration=76076 mutating golden/err-x-closure-take-twice). Root cause was the lexer, not the parser: `()[]{}` fully suppress NEWLINE/INDENT/DEDENT, so a multi-statement suite embedded in an enclosing call's argument list (a closure body, docs/language/examples/virtio-storage.wr's `BlockCache.edit`/`peek`) had no separator token at all between its statements, and several tokens (`(`, `[`, `-`, `.`, `|`) both continue an expression and start a statement — genuinely ambiguous, not fixable by a smarter heuristic. Fix: layout islands in the lexer (crates/wrela-compiler/src/syntax/lexer.rs). A `:` immediately followed by a newline while bracket depth > 0 (checked via `last_token_is_colon`, so `:  # comment` before the newline still counts, and same-line content after `:` never triggers this) opens an island (`open_layout_island`): a fresh indentation sub-stack (`Island.indents`), seeded from whatever the innermost enclosing context's own current level already was (`innermost_indent`), pinned to the bracket depth the `:` was seen at (`Island.open_depth`). While `depth == open_depth` (`layout_active`), NEWLINE/INDENT/DEDENT tracking behaves exactly like the top-level stack (`apply_island_indent` mirrors `apply_top_level_indent`), so a multi-statement embedded suite now gets real separators instead of heuristics. A bracket opened deeper than the active island suppresses layout again immediately — no bookkeeping needed, `layout_active` just stops matching — and a further `:`-newline found there opens a nested island the same way, so islands stack arbitrarily deep; a `:`-newline seen while an island (or the top level) is already active is not a new island, just an ordinary deeper level on the same indent stack (ledger: a nested `if`/`while`/`defer` inside an already-open closure suite). An island closes two ways: (a) a later line's indentation falls back to (or below) its own base level, same dedent loop as the top level but stopping at the island's own floor and popping the `Island` itself instead of erroring; (b) a closing bracket drives `depth` below `open_depth` before the island's own indentation ever got a further line to dedent on — the `))`-on-one-line shape in `BlockCache.edit`/`peek` — force-emitting the balancing DEDENT/NEWLINE pairs immediately before that bracket's own token (`close_layout_islands_before_bracket_close`, called from `lex_operator`). Verified against the grammar and full corpus (docs/language/*.md fenced blocks + docs/language/examples/virtio-storage.wr + every tests/golden/*/input.wr) that no non-suite `:` inside brackets is ever immediately followed by a newline — the only bracket-nested colon-newline pairs found were the two multi-line closure suites already in virtio-storage.wr (`BlockCache.edit`/`peek`, now lexing through islands with byte-identical token positions and an unchanged ast-virtio golden) and golden/err-x-closure-take-twice's own two-statement closures; type-annotation colons (`const N: usize` inside `[...]`) are always followed by same-line content in every corpus instance, so no false-positive island ever opens there. Parser follow-up (crates/wrela-compiler/src/syntax/parser.rs): `parse_stmt_suite`'s `Newline` branch is unchanged and now handles every multi-line embedded suite via real INDENT/DEDENT, bracketed or not; `parse_inline_stmt_seq` (the no-`Newline` branch — now reachable only for a `:` followed by real content on the very same physical line, since any `:`-newline opens an island or an ordinary block instead) is restricted to exactly one statement — a second statement's leading tokens are rejected as `error[parse]: an embedded suite on one line holds one statement; use an indented block` (golden/err-inline-suite-two-stmts) rather than guessed at. `end_of_simple_stmt`'s `inline_depth` tolerance is unchanged (still needed: it lets the suite's one statement finish parsing without demanding a terminator token that was never going to exist; `parse_inline_stmt_seq` itself now does the actual end-of-suite check once that one statement returns) and its depth-0 nested-suite fallback (a top-level statement whose own trailing expression is a `|params|: suite`, ast-expressions golden) is untouched and still exercised. golden/lex-layout-island pins the token stream for a closure suite embedded in a call's argument list, including a nested inner call with its own multi-line argument list to prove suppression resumes correctly one bracket deeper, and exercises closing case (b) exactly (the closure's last statement and the enclosing call's own closing paren share one physical line). golden/check-embedded-suite pins a multi-statement embedded closure suite (three statements, the shape that was ambiguous) parsing and checking clean. All existing goldens — ast-virtio, ast-expressions, err-x-closure-take-twice, every lex-*/pretty-* expectation — are byte-identical with no `--update` needed: real content tokens' line:col are computed by the same source-scanning code as before, unaffected by the extra layout bookkeeping in previously-suppressed regions. `cargo xtask corpus` unchanged (lexed 30, parsed 23, fragments skipped 7). One further, genuinely new finding surfaced by this session's own required deep-fuzz gate (not by the two-statement ambiguity this clause was scoped to fix): `cargo xtask fuzz sema` (seed=2, 2_000_000 iterations) failed at iteration 1184050, mutating golden/check-embedded-suite, minimized to golden/err-closure-suite-comma-trail's own repro. Root cause was in the *printer*, not the lexer/parser: `print_closure`'s `Suite` variant (crates/wrela-compiler/src/syntax/printer.rs) unconditionally dropped the trailing newline `print_stmts` left, on the assumption (true for every prior corpus/golden case, where a suite-closure is always its call's last argument) that only closing delimiters ever follow — but a suite-closure can legally be a *non-final* call argument, and gluing a following `, next_arg` directly onto the suite's last statement's own printed line reintroduces the exact one-line-two-things ambiguity this clause closes, just from the printer's side: reparsing lands on the stray `,` with no statement boundary before it, `error[parse]: expected an expression, found ','`. Fixed by keeping the trailing newline unconditionally (removed the `out.pop()`): the suite's last statement always gets a real terminator before anything else continues, so a following `, next_arg)` or bare `)` lands on its own fresh line, closing the island via its ordinary dedent-to-base path first. Costs one blank line when a suite-closure is a whole statement's bare RHS (harmless — blank lines are layout-transparent, and no golden pins exact `pretty`-stage text). Confirmed this was reachable from hand-written source directly, independent of the printer (golden/err-closure-suite-comma-trail: a suite-closure's last statement followed, same physical line, by the enclosing call's own `, next_arg)` with no newline between them at all — genuinely ambiguous by the same reasoning as the inline single-statement case, so intentionally rejected rather than special-cased); the well-formed twin, the comma-continuation dedented onto its own line (exactly what the fixed printer now always produces), parses and checks clean (golden/check-closure-suite-non-last-arg). Verification at commit time: `cargo xtask check` green (98 golden expectations, all pre-existing ones byte-identical); `cargo xtask corpus` unchanged (lexed 30, parsed 23, fragments skipped 7); `cargo xtask roundtrip` clean (103 entries ok, 77 sema-roundtrip-checked); `cargo xtask fuzz sema` clean at both seed=1 and seed=2, 2_000_000 iterations each — seed=1 is the exact campaign that previously failed at iteration 76076 (the lexer/parser ambiguity this clause is named for) and seed=2 is the exact campaign that failed at iteration 1184050 (the printer finding just above), both re-run clean after both fixes; `cargo xtask fuzz lexer` (seed=1, 200_000 iterations) clean, its existing INDENT/DEDENT-balance invariant (`check_ok_invariants`) unchanged but now also exercising island bookkeeping on every bracket-nested iteration; `cargo xtask fuzz parser` (seed=1, 100_000 iterations) clean. plans/pre-M3-findings.md's finding 3 is marked fixed, pointing here. The normative doc sentence this clause hangs off (02-language.md §1: \"A newline ends a simple statement unless it is inside `()`, `[]`, or `{}`.\") already literally contradicted the docs' own multi-statement closure example (virtio-storage.wr's `BlockCache.edit`) before this session; one clarifying sentence was appended immediately after it in the same commit — flagged for human review as a normative change, per CLAUDE.md's doc-change rule."

