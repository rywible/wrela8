note = "05-library.md \u00a72 (added by plans/M8.md item D, decision 19; REVIEW-QUEUE'd): \"A `@driver` is an actor root and is messageable exactly when its declaration carries `mailbox=n` (\u00a79): it then owns a bounded mailbox and runs admitted messages as ordinary turns on its own core \u2014 identical to an `@actor`, with one admission, one turn, and one reply. Its `pub` methods are the whole exported surface and carry no authority in either direction: no capability, sealed queue value, protocol state, receipt, or interrupt cell crosses a driver mailbox, and its interrupt handlers and `@task` bottom half are never admissible. Device completions are not messages and keep their own path. A driver declared without `mailbox=` cannot be sent to at all.\"\n\n**What this lifted.** M7 decision 22 left `golden/err-image-driver-message` as the M6-D floor: nothing could message a `@driver` at all, and caller-side `await receipt` stayed lowered but unreachable from the flagship for exactly that reason. Item D lifts the floor; the golden is **retargeted**, not deleted \u2014 it now pins the narrower surviving rule (a driver with no `mailbox=` is still unmessageable, with a diagnostic naming the label that fixes it).\n\n**One mechanism, not two (decision 12).** A messageable driver reaches the *identical* `layout::build_rt_enqueue` and `build_rt_select_and_run_symbolic` every `@actor` reaches, through one loop over `mailbox_root_names` (actors, then messageable drivers). Its mailbox is sized by the same arithmetic, placed in the same five-region order, dispatched from the same `merge_actor_pub_methods` shapes, and selected by the same `rt_run_one` round robin. Nothing below admission can tell the two root kinds apart.\n\n**Accepting oracle.** `golden/boot-driver-message` \u2014 an HVF boot of a driver holding `DeviceCap`/`Mmio`/`IrqCap`/`DmaPool`/`VirtQueue`/`RunningDevice` *and* `mailbox=4`, with a private ISR and a private `@task`. Three runtime tests: an `@actor` relays a driver reply (actor \u2192 driver, parking on its own turn), a root messages the driver directly (root \u2192 driver), and a root observes `ready() == 1` \u2014 03-hardware.md \u00a79's bring-up chain completed before any turn was admitted. Vacuity twin `golden/err-boot-driver-message` inverts the relayed value and pins the FAILED line.\n\n**The security surface, arm by arm.**\n0. *Nothing sealed crosses the mailbox, in either direction* — the arm the whole list is an enumeration of. A sweep over every prelude type a driver could name on a `pub` method, in both directions, refuses: `Mmio[L]`, `RunningDevice[D]`, `IrqCap[V]`, `VirtQueue[..N]`, `QueuePermit`, `DeviceCap[D]`, `Receipt[P]`, `Actor[T]`, and `InterruptCell[T]`. `Untrusted[T]` is accepted as a parameter and that is deliberate: 03 §8 / 05 §6 make marked values ordinary message-legal data behind a gate, not authority.\n1. *No authority in a message.* `golden/err-driver-message-capability` \u2014 a messageable driver's `pub` method replying a wrapper struct carrying `Mmio[L]` is refused by `sema::types::validate_fn_capability_types`, the same pass that already policed every `pub` actor/driver signature (M7 decision 3: do not build a second mechanism). Item D **narrowed** that pass: `QueuePermit`/`QueueOp` were whitelisted ahead of the pub-method arm, which let a `pub` driver method declare a sealed queue value as its reply \u2014 harmless while no driver could be messaged, a laundering channel the moment one can be. They now fall through on an exported reply and stay permitted on a private method, which is the only place 03 \u00a74 needs them.\n1a. *No interrupt cell across the mailbox* (decision 16, added after the orchestrator's capability-escape sweep found it). `InterruptCell[T]` is deliberately **not** sealed authority (M7 decision 17: source-constructible, an `@actor` may hold one), so every containment rule the sealed-authority list drives is blind to it — but 03 §6 calls it \"the **sole** ISR/ordinary-code channel\", which is a channel between one driver's ISR and that driver's own ordinary code, not between principals. Refused in both directions (`golden/err-driver-message-interrupt-cell` / `-arg`), each `boot-driver-message`'s source with one method added. Latent rather than live when found — the cell's four ops lower against `self.<field>`, so a received cell's `swap_acquire` stops at `error[unimplemented]`, and the value is copied so it does not alias — but the value itself already crossed, and it goes live the day method calls through arbitrary base expressions land. The leaf set is a parameter to `sema::types::type_carries_named`, so containment and the message shape share one traversal and cannot disagree about `Option[...]` or a plain wrapper struct.\n2. *No receipt across the mailbox.* `golden/err-driver-message-receipt` \u2014 `check-receipt-handoff`'s own source with `mailbox=4` added and nothing else. 03-hardware.md \u00a75 blesses `take p: P -> Receipt[P]` on a public driver method by name, and that convention needs the caller-side `await receipt` plans/M8.md item E owns. Refused at the image, naming item E.\n3. *No wrong effect set.* `golden/err-driver-message-task-pub` (a `pub` `@task` bottom half \u2014 one turn body with both a wake and an admission entry) and `golden/err-driver-message-isr-pub` (a `pub` `irq.bind` handler \u2014 device acknowledge work as an admitted turn). The latter is `boot-driver-message`'s source with one declaration exported.\n4. *No mailbox inside the ISR effect set.* `golden/err-driver-message-isr-sends` \u2014 an ISR `send`ing at a genuinely messageable driver. Three rules refuse it and the shape rule (`send`/`await` need an `async fn`; 03 \u00a76 requires an ISR to be a plain `fn`) fires first; `hardware.isr.effect-restriction` and `hardware.bottom-half` hold the effect half.\n5. *No reentry mid-bring-up.* `boot-driver-message`'s `root_never_reenters_bring_up`: boot runs every `init` to completion before the scheduler's first tick, so the first admissible message already sees `Running`. Asserted through a field written as the last statement of the chain, not assumed.\n\n**Report surface.** A messageable driver's `Driver name=\u2026 state=\u2026` line gains `mailbox=/slot=/frame=`, and its `Placement` line's `bytes_mailbox` stops being 0 (04 \u00a73 packs on owned image + mailbox bytes). A driver without `mailbox=` prints exactly what it printed before \u2014 every pre-item-D golden is byte-identical.\n\n**Left closed, named.** Caller-side `await receipt` execution and 03 \u00a75's handoff convention (item E \u2014 arm 2 above is its floor). Cross-core admission to a driver mailbox (item C2/C3; a messageable driver is an ordinary mailbox root, so it inherits whatever C lands). Mailbox capacity derivation (still the declared bound, M6 decision 3).\n\n**Updated by plans/M8.md item E (decision 33; 05-library.md §2 edited, REVIEW-QUEUE'd).** Arm 2 above was written under item D's floor and refused a `Receipt[P]` in *either* direction. §2's sentence now reads \"no capability, sealed queue value, protocol state, or interrupt cell crosses a driver mailbox, **no message parameter carries a receipt**\", with 03 §5's handoff reply named as the exception. Two consequences, both pinned:\n\n- The reply direction is **accepted** and boots (`golden/boot-receipt-handoff`). `layout::check_driver_message_surface` no longer probes a handoff method's reply at all, and the reason is structural rather than an exemption: §5's signature is \"exactly one `take p: P` parameter and result `Receipt[P]`\" — the *same* `P` — so the parameter loop has already walked the entire payload with the same leaf set. Probing `Receipt[P]` again could only ever refuse the wrapper, which is the convention. The `@task`/ISR arms are untouched for such a method (a `pub` `@task` is synchronous and would otherwise be handoff-shaped by signature).\n- The parameter direction is **still refused**, and `golden/err-driver-message-receipt` is retargeted onto it rather than deleted. Working this found that the refusal does not come from the mailbox check at all: `sema::types::validate_fn_capability_types` already rejects a `Receipt` parameter on *every* `pub` method of *every* `@actor`/`@driver`, messageable or not — its `Receipt` whitelist was only ever for the reply position. So the layout-tier parameter arm is unreachable for a receipt, and the golden pins the diagnostic that really fires. Item D's expectation about *where* this was enforced was wrong; the property held anyway.\n\n**Updated by plans/M8.md item H attack 6.** Decision 22 recorded that `resolve_runtime_test_args` (and `boot_init_arg_word`) gave `actor#i` and `driver#i` the same handle word — \"harmless only while nothing reads a handle word\". The guest *does* read them via the `u32` `decl.handle()` spelling. Closed with one shared index space (`layout::actor_driver_handle_word`: actors `0..n_actors`, drivers `n_actors..`); `golden/boot-handle-index-distinct` is the HVF witness (`actor_id != driver_id`, and the concrete words 0 and 2). Collateral: every `Storage` that field-wired `disk=disk` without an `init` had been relying on `driver#0 == 0` matching zero-fill — those goldens gained an `init`. **Follow-up (orchestrator spot-probe):** the first fix left devices kind-local; `decl.handle()` on `device#0` collided with `actor#0` at word 0. Closed by `layout::image_decl_handle_word` (actors, then drivers, then devices; Pool/DmaPool fail closed). `golden/boot-handle-index-distinct` now asserts concrete words 0/2/3 for marker/stub/device.\n\n**Updated by plans/M8.md item H attack 5.** C2's thin list: no boot golden sent cross-core to a *driver* mailbox. `golden/boot-cross-core-driver-mailbox` is that boot: `Probe` on core 1 one-way-`send`s into `Stub` on core 0; the root asserts `Stub.count == 1`, impossible without `Ring kind=request src=1 dst=0 target=Stub`. An await-from-core-1 shape is still refused (decision 31 — await-resume is a checkpoint); the satisfiable lift is per-core checkpoint services.\n\n**Updated by plans/M13.md item O.** The messageable-driver forbidden leaf (`holds_authority` ∨ `InterruptCell`) is re-derived from computed type classes (`sema::classes::name_forbidden_in_driver_message`), dual-run against the prior sealed-authority∨InterruptCell name list. `golden/err-interruptcell-in-message` pins the same refusal via the class path; the 56 InterruptCell goldens stay byte-identical."

[[clause]]
id = "sema.flow.never-ends-the-path"
doc = "02-language.md#11"
status = "test"
tests = ["golden/check-panic-diverges"]
note = "02-language.md §11, verbatim: \"`panic(message)`, failed `assert`, checked-arithmetic failure, out-of-bounds access, and violated invariants **abandon** the actor: the turn stops, generated cleanup runs (it can never skip resource teardown), and the supervisor applies its declared policy. Abandonment is not catchable.\" The static consequence this clause covers is the narrow one: **a statement whose type is `never` has no fallthrough** — the path ends there, exactly as at a `return`.\n\nOpened by plans/M8.md item E (decision 34) as a defect fix the item tripped over rather than went looking for. `sema::flow::walk_stmt`'s `Stmt::Expr` arm returned `fallthrough(state)` unconditionally, so a `panic` arm neither supplied totality for a value-returning body nor dropped out of a join. The gap was invisible because the only source that relies on it is the **normative worked example** — `docs/language/examples/virtio-storage.wr` uses six `panic(...)` sites exactly this way (`panic(\"cache line has no payload\")` and friends) — and that example is a parse-tier golden (`golden/ast-virtio`), so nothing had ever put one through the flow pass. Item E needed it because 02 §9.2 requires `self` to be whole at every suspension, which forces a caller that lends a DMA payload across a handoff to unwrap its `Option[own[P] T]` inside a *synchronous* helper, whose impossible arm has nothing to return.\n\n**Oracle.** `golden/check-panic-diverges` — a `panic` arm supplying totality for a `-> u64` body, and a `panic` as a plain statement. Mutation-verified: with the arm disabled, both become `error[init]: missing return of type `u64` on some path`, and `golden/boot-receipt-handoff` stops building for the same reason.\n\n**Deliberately narrow.** Only the type is consulted (`Type::Never`), so this is one rule with one producer today (`panic`); `assert` stays conditional and is untouched. The runtime half of §11 — the turn actually stopping, cleanup running, the supervisor deciding — is **not** covered here: an abandon is still image-fatal (plans/M8.md shape decision 4 / M6 decision 12), and quarantine/recovery is item F.\n\n**Found and left alone.** §11's other static shape is *not* constructible in this compiler and is recorded rather than silently fixed: a name first bound inside one `match` arm and read after the join — which is what virtio-storage.wr's `data = take block` actually does — is out of scope at the read (`sema.names.resolution`'s own scope-leak fix), so it is `error[name]` one pass earlier, `panic` or no `panic`. That is a real doc/compiler disagreement on a parse-tier example; naming it is item E's contribution, closing it is not."

[[clause]]
id = "machine.cross-core.publish-acquire-barrier"
doc = "04-compiler.md#3"
status = "gap"
tests = []
note = """04-compiler.md §3: "Cross-core actor edges keep identical message semantics, lowered to compiler-generated bounded SPSC rings in guest memory with sealed publish/acquire ordering — no app-visible atomics or fences exist."

plans/M8.md item H attack 4 (2026-07-25). Item C2 discharged the sentence by *ordering the stores* (publish into the ring, then raise the pending word) and by never letting one core write another's turn record, and emitted **no** AArch64 barrier. Under decision 11's baton exactly one vCPU is inside `hv_vcpu_run` at a time, so a missing barrier is unobservable on this machine — recorded as a claim not yet tested rather than as one satisfied.

**Owner (plans/M15.md items H–K, 2026-07-27):** inline runtime-only `@dmb`, baton deletion + Yield-`Progress` replay, barrier-deletion golden. Publish/acquire remains promised in 04 §3 through the normative cut (item A); the barriers land when H–K flip this clause.

**Satisfiable flip condition (all required).** (1) True concurrent `hv_vcpu_run` on ≥2 host threads under Hypervisor.framework (the baton retired; Yield-`Progress` makes the concurrent schedule enumerable for replay; exhaustive schedule exploration remains a later intention). (2) The encoder emits a `DMB ISHST` (or stronger) after ring payload/`count` stores and before the pending-word raise in enqueue/`xsend`, and a matching acquire barrier after the occupancy/pending load and before payload reads in the drain. (3) A boot golden whose transcript can fail under concurrent execution when those barriers are deleted (store-store / load-load reordering across occupancy and payload) and cannot fail under the baton alone.

**(1) and (2) are discharged (M15 items H/I).** Item K (2026-07-27, decision 1098) landed the mutation front-door (`wrela … --omit-dmb`; unit `omit_dmb_strips_barrier_words_from_asm`; image bytes lose all `DMB ISHST`/`ISHLD` encodings) and the witness `golden/boot-cross-core-publish-acquire` (intact → `ok` under concurrent record). **(3) is BLOCKED on this macOS/HVF host:** mutated (DMBs omitted) also passes at `ITERS=65536` — the park/wake host path serializes visibility before the consumer runs, so reordering is not guest-observable. Recorded in `plans/REVIEW-QUEUE.md`. Status stays `gap`; do not weaken to "barriers present in asm only." Flip when a test host observes the mutated checksum failure."""


[[clause]]
id = "library.intrinsics.closed-surface"
doc = "05-library.md#9"
status = "test"
tests = [
  "unit:intrinsic_surface_equals_the_written_down_list",
  "unit:format_key_guards_are_locked",
  "unit:bodies_rs_is_the_only_producer",
  "unit:image_builder_surface_matches_the_restriction_predicate",
  "unit:unproduced_consumer_keys_are_still_unproduced",
]
note = """05-library.md §9, verbatim: "`Image`, `group`, actor admission, and pool construction **are compiler-recognized intrinsics** even when a package supplies their surface". §9 then enumerates that surface one bullet at a time. This clause holds the *complement* of that sentence: everything else the compiler recognizes by name is an exception, and the exception set is closed, enumerated, and justified line by line.

Opened by plans/M9.md item AA (decisions 56–59). Its premise, restated: ROADMAP M10 warns that migrating item-by-item while adding whatever intrinsic each item needs "designs the permanent surface by accretion, in the one place this project can least afford it." That pressure is in **M9** — every stdlib item can reach for a compiler-recognized name instead of writing wrela. plans/M9.md shape decision 1 forbids it in prose; nothing enforced it.

**The census (2026-07-25, at c714491).** 44 distinct intrinsic keys, from 38 construction sites in `sema/bodies.rs` — 34 literal `key: "..."` sites plus four that build the key with `format!`, which is why the surface could not be counted by grepping. All four templated sites are statically knowable and were resolved by reading: `Image.{mname}` → `device`/`pool`/`dma_pool`; `Mmio.{op}` → `read`/`write`; `InterruptCell.{method}` → `store_release`/`swap_acquire`/`fetch_or_release`; `Image.{name}` → `driver`/`actor`. Of the 44, **10 are §9's builder surface** (identical to `sema::typed::is_restricted_intrinsic`'s set) and **34 are exceptions**, grouped as time (3), builder vocabulary (1), typed MMIO (2), marked values (1), device bring-up (7), queues/receipts (10), interrupts and bottom halves (8), scoped concurrency (2). **plans/M9.md item E (2026-07-25) deletes `ms`/`seconds`: surface is now 42 (10 + 32); `now` remains the one time exception.**

**Where it is written down.** `crates/wrela-compiler/src/sema/intrinsics.rs` — `IMAGE_BUILDER_SURFACE` (§9, stays intrinsic: comptime-only, emits no code, effects land on the compiler's own image graph, and making it ordinary wrela would mean exposing the image IR as a language type) and `EXCEPTIONS`, one line of justification each. The bar: an intrinsic is justified when wrela source *cannot* express the thing (no expression form, a build-time graph edge, a sealed wrapper, a recorded effect), not when writing it in wrela would merely be inconvenient.

**The guard, and why it is a unit test rather than a golden.** There is no artifact to dump: the live set exists only while a program is being checked, so the honest oracle is over compiler *source*. `sema/bodies.rs` is embedded with `include_str!` (a missing file is a build error, never an empty scan), and every occurrence of the node's type name followed by `{` — **any prefix, any path qualification** — is located. Each occurrence's brace-balanced field region is then classified (decision 59a): a `key:` bound to a string literal or a `format!` is a census entry; no `key:` at all is an ordinary pattern match and is ignored; a `key:` bound to anything else **fails closed**, because a computed key is surface the census cannot resolve. The same scan runs over the whole workspace, where the only permitted key sites are the enumerated `ALLOWED_OFFSITE_KEY_SITES`.

Holes found by mutation-testing the guard itself, and closed:

- *A widened `format!` guard.* The four expansions are hand-resolved, so adding a fourth `InterruptCell` method to its match arm produces a new key from an unchanged construction site. `format_key_guards_are_locked` pins each bounding guard's exact source text, which fails on exactly that edit.
- *A construction site in another file, after that file's `#[cfg(test)]` module.* The first version truncated each file at `#[cfg(test)]` and was defeated by an intrinsic appended past it.
- *Marker-spelling evasion* — the serious one, found by the orchestrator's independent verification rather than by the author. The scan originally matched the whole line `kind: TypedExprKind::Intrinsic {`, and three spellings walked past it with all six tests green: a bare construction with no `kind:` prefix, a `kind:`-prefixed one with a path-qualified type, and a bare construction **inside `bodies.rs` itself** — a false negative in the primary closure test. Closed by decision 59a's weak marker plus classification.
- *A field reorder, and a computed key.* Both now land in the census (the key is found wherever in the region it sits) or fail closed by name.

**Mutation evidence (each run, each fails as intended, tree restored after each):** a new `List.push` key → "in the compiler, not in the list"; a deleted `ms` arm → "in the list, not in the compiler"; `VirtQueue.publish` renamed → both directions in one run; a widened `InterruptCell` match arm, and independently a widened `Image.{mname}` guard → guard-lock failure (the closure test alone passes, which is why that test exists); `key:` moved out of first position → `SlotMap.insert` enters the census; a key computed from a variable → "an intrinsic is built with a `key` this census cannot resolve"; and the three marker-spelling evasions above → off-site key site named with file and line, or the new name in the census.

**This clause is the first user of the ledger's `unit:` reference type, and that type had to be fixed before it could carry a clause honestly (decision 59b).** `xtask ledger` originally verified `unit:<name>` by looking for `fn <name>(` anywhere under `crates/`, so `unit:main` satisfied this clause and it still counted among the tested ones — strictly weaker than the sibling `golden/<name>`, which must exist as a real directory under `tests/`. The check now requires a literal `#[test]` followed, past whitespace only, by `fn <name>(`; `unit:main` and `unit:written_down_surface` (a real `pub fn` beside the tests) are both rejected by name. Not an attribute parser: a test carrying a second attribute in between reports as missing, a false negative and the safe direction.

**Disclosed residue.** The `format!` guard lock is brittle to reformatting those four lines (loud, and it says re-resolve the range). A *pattern* written `{ key: k, .. }` — a shape no file uses today — would trip the cannot-resolve panic and need a new classifier arm; a false positive, which is the safe direction. The scan is textual: a macro expanding to an intrinsic construction would be invisible, and none exists.

**Recorded, not acted on** (AA measures and locks; it removes nothing):

- ~~`ms` and `seconds` are marked `ACCRETION` in `EXCEPTIONS` and cite plans/M9.md item E, which deletes both arms for `stdlib/core/time.wr`. That removal is a two-line diff here.~~ **Done by plans/M9.md item E (2026-07-25):** both arms deleted; surface is now **42** keys (10 builder + 32 exceptions). `now` stays — sealed recorded effect.
- `is_queue_op_deferred` accepts `VirtQueue.poll_sources` and `VirtQueue.completions_pending`, which **no construction site produces** — `check_virtqueue_method` rejects both methods with `unimplemented_at` first, so the consumer arms in `lower.rs`/`flowwir_lower.rs` are unreachable. Kept as `UNPRODUCED_CONSUMER_KEYS` with a test that fails if either gains a producer or loses its consumer.
- `InterruptCell.new` is the weakest exception: it lowers to a plain `Copy`, unlike its four siblings which lower to dedicated ordered instructions. Named in its own justification line as the answer to item E's "investigate, don't presume" question — the *ops* genuinely need compiler knowledge (wrela has no atomic or ordering expression form, and ROADMAP M10's floor says so); the *constructor* is intrinsic only because the type is compiler-known. **Item E confirms AA's answer and does not change it.**

**Deliberately not covered.** `sema::prelude`'s bare-name table is a different surface — resolution, not meaning — and the two are not in bijection (`Target` is a prelude name with no intrinsic key; `Mmio.read` is an intrinsic key that is not a prelude name). plans/M9.md item I owns shrinking `prelude.rs`; this clause owns holding the intrinsic surface still while that happens.

**plans/M9.md item F3**: `Array.map_take` / `Array.try_map_take` added to EXCEPTIONS (05 §7 sealed methods on builtin `[T; N]`)."""

