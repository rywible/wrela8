[[clause]]
id = "machine.boot.no-discovery"
doc = "06-machine.md#3"
status = "test"
tests = ["golden/boot-hello", "golden/check-tests-mixed", "golden/boot-actor-smoke"]
note = "plans/M5.md item E: FLIPPED from `gap` to `test` — the *boot* half item D's own note on this clause left open (\"the VMM actually starting vCPU 0 there, reading the machine-info page live, draining the console ring\") is now real, on real Hypervisor.framework, on this machine. `wrela-vmm` (new crate content: `hv.rs`'s raw FFI, `lib.rs`'s `boot_image`) consumes exactly two inputs — the compiler-emitted image blob and its own report text — with no discovery whatsoever: `parse_report` reads the machine revision, the input digest line(s), the section table, and the entry address; `boot_image` allocates and zeroes one host DRAM region (`06 §3`'s own \"zeroes the declared reservations\"), `hv_vm_map`s it at the fixed `DRAM_BASE`, copies the image blob to `IMAGE_BASE`, writes the machine-info page (revision string + a wall-seed of `0`, deterministic at M5), points `x0` at it, sets `PC`/`CPSR`/`CPACR_EL1`, and runs vCPU 0 — no negotiation, no probing, exactly 06 §3's own three boot steps. `golden/boot-hello` (new) is the dedicated golden: three `@test(runtime)` fns (checked arithmetic, a struct paired with an exhaustive `match` over an enum, and one deliberate `assert`-with-message failure exercising the landing-pad path, plans/M5.md decision 15) boot for real, in declaration order, five repeated `cargo xtask golden` runs byte-identical. `golden/check-tests-mixed` (moved, cited above too) is the second, pre-existing case this same boot path now actually executes for the first time (`test_needs_the_machine`, a trivially passing `@test(runtime)`, previously pinned as the M5 fail-closed placeholder `wrela test`'s own comptime tier prints when no runtime tier exists — decision 1/9's own boundary, unchanged in wording, now genuinely superseded because a runtime tier exists).\n\nA real, previously undetectable bug surfaced by this exact oracle (06 §9/decision 5's own \"HVF execution is the behavioral oracle\", not a hypothetical): `encode.rs`'s `enc_umulh` had the signed/unsigned distinction in the wrong bit field (`op54` instead of `op31`'s own top bit) — self-consistent with its own hand-derived unit tests (same reasoning error baked into both), so `cargo test` passed while every 64-bit unsigned checked multiplication decoded as a different, unrelated instruction on real silicon. No dump-only golden from items A-D ever caught it (nothing before this item ever *executed* emitted bytes); the boot golden did, immediately, the first time a `u64` checked `*` was exercised through it. Fixed and re-verified against `clang -target arm64-apple-macos`'s own assembler output for two independent register triples (`crates/wrela-compiler/src/encode.rs`); `golden/asm-calls`/`golden/asm-enum-match` moved their own pinned `umulh` hex word accordingly (the only bytes affected).\n\n**Note-update, plans/M6.md item D (2026-07-24), boot got richer, still zero discovery**: `layout::layout_test_image` now takes an `Option<layout::BootCtx>` and, whenever an actor exists, actually runs a boot sequence before any root turn: every actor's own `rtdata` state slot is zero-initialized (`layout::build_boot_init`, called from `build_entry_driver`'s own new `boot_init_start` hook, right after the console/test-counter zeroing it already did) and every actor's own `rt_enqueue`/`rt_select_and_run`/`__await_actor_*` runtime-glue routine is hand-assembled and registered as an ordinary `Reloc::Call` target (`layout::build_runtime_glue_block`) so a compiled async fn's `Send`/`Await{ActorCall}` op resolves to it exactly like any other symbolic call. Still zero discovery: every fact this sequence uses (which actors exist, their own addresses, their own dispatch tables) is a build-time constant baked in by the compiler, never probed or negotiated at boot; the VMM itself is entirely unchanged by this item (per plans/M6.md's own item-D boundary, `wrela-vmm` is item E's). **Disclosed, not silently narrowed**: (1) actor init runs in `ImageGraph::actors`' own declaration order, not a real topological sort of the supervision/handle-dependency graph — no M6-D required case has cross-actor init dependencies, so this is untested past the trivial case; (2) a declared `init` is never called during boot — every actor's own state is plain zero-initialized fields only; materializing `ActorDecl::args` against a real `init`'s own declared parameters (by label, mirroring `flowwir_lower::lower_aligned_args`'s own alignment convention) is real, further work, named here rather than assumed solved; (3) no dedicated \"mailboxes open\" flag word was added — `rt_enqueue` does not yet gate admission on any such flag (the identical precedent `RuntimeTables::ready_queue_capacity` already set at item C: reserved facts may exist before every consumer of them does), so this item does not spend a `rtdata` word on a fact nothing reads yet. Verified via two new `layout::harness_jit` JIT tests (`await_actor_glue_enqueues_drains_and_returns_the_dispatched_reply`, `await_actor_glue_carries_one_scalar_argument_through_to_the_dispatched_method`) exercising the new glue routine directly on real ARM64 execution.\n\n**Note-update (2026-07-24, same-day verification follow-up)**: the blocked question this paragraph named — how a zero-argument free test fn obtains an `Actor[T]` handle — is resolved: 02-language.md §12.2 gained a normative sentence (decision 11b, `comptime.tests.runtime-actor-params`) letting a `@test(runtime)` fn declare `Actor[T]` params, the runner supplying the image's unique declared instance's handle. `golden/boot-actor-smoke` (new, cited above) is the real end-to-end boot this paragraph previously reported missing: a real `.wr` source file's `@test(runtime) async fn` declaring an `Actor[T]` param, awaiting a real image-declared actor's sync method, booted via `wrela test`/HVF, transcript pinned. Three real bugs this exact boot found and fixed (`comptime.tests.runtime-actor-params`'s own note has the full detail: a missing `x30` save/restore in `build_boot_init`, `Actor[T]` mis-classified as a by-pointer aggregate, and `Await`'s own reply missing its `Result` tag envelope) — none reachable by dump review alone, only by real execution. Points (1)/(3) above (declaration-order init, no mailboxes-open flag) stand unchanged; point (2) (a declared `init` taking no further params now runs during boot, `layout::actor_zero_arg_init_keys` — an `init` *with* params still gets none of this, plain zero-init only, the still-real remaining floor).\n\n**Note-update (2026-07-24, the park-and-resume redesign)**: this note's earlier mentions of the `__await_actor_*` glue routine (and its two JIT tests) describe machinery that no longer exists — the nested-drain placeholder died with the turn-suspension rewrite (`actors.codegen.state-machines`'s own rewritten note). The boot sequence's shape is unchanged in spirit but its glue block is now `rt_enqueue`/`rt_select_and_run` per actor plus one shared `rt_run_one` scheduler tick, the entry driver additionally drives a per-async-test scheduler loop (park/resume the root turn, named deadlock diagnostic), and `Reloc::TurnFrameAddr` resolution joined the boot-time relocation set. Still zero discovery: every new fact (turn-area addresses, the RR cursor word, per-test async-ness) is a build-time constant baked at layout time."

[[clause]]
id = "machine.console.transcript-pinned"
doc = "06-machine.md#6"
status = "test"
tests = ["golden/boot-hello", "golden/boot-many-tests", "golden/err-test-output-bound"]
note = "plans/M5.md item E (original): the generated runtime's `__wrela_ring_write` (`layout.rs`) published one virtio-shaped split-ring descriptor per *call*; `wrela-vmm`'s own console model (`drain_console`, `lib.rs`) reads the ring only after the guest halts, walking descriptors `0..avail.idx` directly by index (a disclosed simplification, unchanged by the fix below: this producer never reorders or skips an index, so `avail.ring[]` itself is never populated or read) and copying each one's own bytes into the transcript, in order. `golden/boot-hello`'s own `expected/test.txt` pinned the resulting merged stdout (`wrela test`'s own decision-1 shape: comptime lines, then runtime lines, then one summary) byte-for-byte, proven stable across 5 repeated `cargo xtask golden` runs.\n\n**M5-G adversarial-sweep find/fix (this commit)**: the original item-E design's own disclosed bound — 'at most `console::QUEUE_SIZE` (16) `__wrela_ring_write` calls ... per boot, and an over-long write silently truncates' — was a real, live bug, not a merely theoretical one: since a call, not a printed *line*, consumed a descriptor, and every failing test's own report line took 3-4 calls (prefix, `FAILED `, message, newline) while even a passing one took 2 (prefix, `ok\\n`), a plain 7-8-test `@test(runtime)` file — nothing adversarial — silently exhausted the 16-descriptor queue mid-summary (`\"7 passed,\"` then nothing), and `wrela test` failed with \"the wrela VMM's own transcript is not well-formed\". Root-caused and reproduced with an 8-trivial-test file (`assert 1 == 1`-shaped) before any fix landed, per house rule.\n\nThe fix makes 02 §12.2's \"statically bounded output\" literally true, in `wrela-compiler/src/layout.rs` (full design in that file's own module doc) and `wrela-machine/src/lib.rs`: (1) **one descriptor per printed LINE, never per call** — three routines (`__wrela_line_begin`/`__wrela_ring_append`/`__wrela_line_commit`) replace the old combined `__wrela_ring_write`, composing a whole report line across one or more appends before publishing exactly one descriptor for it; (2) **a static bound, checked at test-image build time** (`layout::check_transcript_bound`, called before `layout_test_image` assembles a single instruction) — `lines = runtime_tests.len() + 1` must not exceed `console::QUEUE_SIZE`, and a documented, sound over-approximation of the worst-case byte total (every test's own worst-case line, bounded by the longest string already interned in the program's own rodata pool, doubled to cover an `AbortVal` prefix+suffix pair, plus up to 20 interpolated digits) must not exceed `console::DATA_SIZE` — violating either fails the BUILD closed with a named diagnostic (`\"this test image's worst-case transcript (N byte(s) across L line(s)) exceeds the machine's console bound (M byte(s) across Q line(s))\"`), never a runtime truncation; (3) `console::QUEUE_SIZE` grew 16 -> 256 (`wrela-machine`'s own module doc has the resulting ring-geometry consequences: `console::RING_SIZE` grew from one page to two, `console::DATA_BASE` moved accordingly — the four pre-existing image-report goldens' own `Section name=pages` size line moved from 24576 to 28672 as a result, cited in this same commit); (4) the old silent no-op/clamp is gone — an over-capacity append or commit now `BRK`s as a should-be-unreachable internal-error guard, since `check_transcript_bound` having passed already proves neither can happen in practice.\n\n`golden/boot-hello` stays byte-identical (verified, not asserted) — its transcript content never depended on the old per-call accounting. `golden/boot-many-tests` (new) pins the sweep's own exact failure shape — 12 trivially-passing tests, well past the old 7-8-test failure point — now green. `golden/err-test-output-bound` (new) pins the named build-time diagnostic firing for real: one test whose own assert message alone is 20000 bytes, far exceeding `console::DATA_SIZE`.\n\n**Note-update, plans/M13.md item D (2026-07-27):** 06 §6's device table splits into machine-v1 (`blk`, `console`, `clock`, `entropy`, `input`, `display`) and future-revision (`net`, `sound` — contracts preserved as written, **non-normative until revised** under 06 §10's additive-revision rule). 06 §10's conformance sentence binds to the v1 set. This clause's `console` contract remains machine-v1; no test motion. `machine.display.golden-frames` (display is v1) is deliberately unchanged by this item."

[[clause]]
id = "machine.clock.trap-logged"
doc = "06-machine.md#6"
status = "test"
tests = ["golden/boot-deadline-cancel", "xtask:repro"]
note = "plans/M5.md item E built the VMM half: a load from `mmio::CLOCK_MMIO_ADDR` returns `monotonic_ns()` into the faulting register (decoded by `hv.rs`'s own unit-tested ESR data-abort decoder) and the value joins the recorded choice sequence. It stayed `gap` through M6-E for a **citability** reason, stated each time rather than glossed: no `@test(runtime)` fn could *issue* a clock read, so the only coverage was a hand-assembled guest inside a `cargo test -p wrela-vmm` unit test, which `xtask ledger`'s validator cannot cite (no `tests/` path, no `xtask:<command>`).\n\n**plans/M6.md item F (2026-07-24) flips it, because both halves of that reason are now false.** `golden/boot-deadline-cancel` is real `.wr` source whose `with group(deadline=now() + ms(0))` compiles `now()` to that exact trapping load (`codegen::emit_now`), and whose *observable behaviour* depends on the value the trap returns — the group's deadline, and therefore whether and when its child is cancelled. The scheduler's own deadline poll (`layout::emit_deadline_poll`) issues further real reads every tick while a deadline is live. And `cargo xtask repro` — a citable harness check — exercises the whole path end to end in `repro_deadline_cancel_replay_is_clock_log_driven`: it asserts the recording carries several `ClockRead` choices, that replaying them is clean, and that moving the *first* logged value to the far future changes the guest's own behaviour and is caught as a divergence (proving the replayed clock is the logged one, not the host's).\n\nOne coherence fix this required, recorded: `monotonic_ns()` now floors at `1`. `0` is the deadline protocol's own \"no deadline\" sentinel in both `machine_info::OFF_NEXT_DEADLINE` (item E's park contract) and the group arena's `deadline_ns` word, so a guest computing `now() + ms(0)` at the very first instant of the epoch would otherwise arm a deadline indistinguishable from none. The machine's monotonic clock is defined to start at 1ns; the sentinel keeps its one meaning and no second sentinel value is needed anywhere. The epoch is also now established before the guest's first instruction, so `now()` measures from the machine coming up rather than from whichever guest read happened to be first.\n\nAlso fixed here, and required for `ms()` to mean anything: `codegen`'s `FlowInst::Duration` lowered `ms(n)` as an opaque passthrough while the comptime evaluator had scaled it to `n * 1_000_000` since item A. The two tiers disagreed. Codegen now scales too — 06 §5/decision 13 define the clock as monotonic **nanoseconds**, so 02 §9.5's own `now() + ms(50)` example is only meaningful once `ms` is milliseconds on both sides.\n\n**Note-update, plans/M13.md item D (2026-07-27):** 06 §6's device table splits into machine-v1 (`blk`, `console`, `clock`, `entropy`, `input`, `display`) and future-revision (`net`, `sound` — contracts preserved as written, **non-normative until revised** under 06 §10's additive-revision rule). 06 §10's conformance sentence binds to the v1 set. This clause's `clock` contract remains machine-v1; no test motion. `machine.display.golden-frames` (display is v1) is deliberately unchanged by this item."


[[clause]]
id = "machine.replay.clock-log"
doc = "06-machine.md#8"
status = "test"
tests = ["xtask:repro"]
note = "plans/M5.md item F, decision 13/06 §8, grown by plans/M6.md item E into the choice-sequence shape (decision 9): the recorder/replayer (`crates/wrela-vmm/src/record.rs`) is real, not a stub — `RecordFile` (an ordered `ChoiceEntry` sequence — `ClockRead`/`DeadlineWake`/`VectorRaise`/the format-only `Admission` — plus a non-cryptographic FNV-1a transcript digest, exit code, exits count; `to_text`/`parse` round-trip a stable, timestamp-free, versioned (`ChoiceLog v1`) `key=value` text format — clock/deadline values are wall-clock-dependent and vary run to run, so nothing here is ever a golden), `record`/`replay` (boots live or replayed, via the shared `boot_image_core` — `replay_choices: Option<Vec<ChoiceEntry>>` feeds `record::Chooser::choose_next`'s replay arm instead of the live clock/sleep), and `Divergence` (`ChoiceLogUnderrun`/`ChoiceLogOverrun`/`ChoiceTagMismatch`/`TranscriptDigestMismatch`/`ExitCodeMismatch` — the M5 pair's own tags, grown per this clause's own prior note's named flip condition: \"the M5 Divergence variants grow tags\"). `wrela-vmm`'s own binary's `--record <path>`/`--replay <path>` (`main.rs`) are unchanged in shape, now speaking the grown format.\n\n**FLIPPED from `gap` to `test`**: this clause's own prior note recorded real, unit-tested coverage (`lib.rs::record_replay_roundtrips_and_detects_every_divergence_shape`) that stayed `gap` purely on citability (no `tests/` path, no `xtask:<command>` reached the same code). Item E adds exactly that missing citable path: `xtask repro` now also runs `repro_choice_log_roundtrip` (`crates/xtask/src/main.rs`) — records `tests/golden/boot-hello`'s own real, already-citable test image live via the signed `wrela-vmm` binary's `--record`, asserts the written file starts with the versioned `ChoiceLog v1` header, then replays it via `--replay` and asserts the CLI's own exit code matches the recorded boot's own guest-authored exit (`1` here — `boot-hello` deliberately fails one test — never unconditionally `0`) — a genuine end-to-end exercise of `Chooser::choose_next`'s record and replay arms over a real compiled image, reachable via `cargo xtask repro`, not only a bare `cargo test`. `boot-hello` declares no actors, so this particular run's own choice sequence is `ClockRead`-shaped only; the fuller `DeadlineWake`/`VectorRaise` tag coverage lives in `wrela-vmm`'s own conformance suite (named in full under `machine.interrupts.checkpoint-injection`'s own note-update, below) — real, current, wired into `check` via `test_wrela_vmm_signed`, but not individually citable here for the same reason `machine.clock.trap-logged`'s own note already gives. Recorded honestly, not silently implied fully covered by this one citation alone.\n\n**Note-update (2026-07-24, verification's own fail-closed finding)**: `main.rs`'s own process-level exit-code mapping was under-tested and, for one real path, wrong — a *clean* (non-diverging) `--replay` unconditionally returned `ExitCode::SUCCESS` regardless of the guest's own reported outcome, so replaying a guest that had reported nonzero still exited `0`. Fixed in the same commit: a clean replay now collapses `recorded.exit_code` through the identical `0`/`1` rule a plain boot uses (zero divergence guarantees `recorded.exit_code` already equals the fresh boot's own actual exit — no `ExitCodeMismatch` was found). `main.rs` gained named constants (`EXIT_VMM_FAILURE = 2`, `EXIT_REPLAY_DIVERGENCE = 3`) and a module-doc section spelling out the whole guest-authored (`0`/`1`) vs runner-authored (`2`/`3`) contract explicitly, including that a no-runtime-tests image's own `EXIT_CODE_NO_RUNTIME = 0xE0000001` placeholder halt is guest data collapsing to the ordinary `1`, never a VMM failure. Two new tests pin the whole contract at the process level: `lib.rs::replay_divergence_and_record_failures_exit_nonzero_through_the_real_binary` (builds+codesigns the real binary, spawns it, asserts every documented exit code including the regression this note names) and `xtask::repro_replay_exit_code_contract` (the identical proof, wired into `cargo xtask repro`, cited alongside `repro_choice_log_roundtrip` above).\n\n**plans/M6.md item F note-update (2026-07-24)**: this clause's coverage stops being incidental. Through item E the only clock reads in any recording came from hand-assembled conformance guests, so \"the clock log replays\" was true but never load-bearing for any guest's behaviour. `golden/boot-deadline-cancel` is the first boot whose *schedule* depends on the logged values — the group's deadline and the point at which its child is cancelled — and `cargo xtask repro`'s own `repro_deadline_cancel_replay_is_clock_log_driven` proves the dependency directly: tampering the first logged `ClockRead` to a far-future value changes the replayed guest's behaviour and is caught as a divergence. See `machine.clock.trap-logged`, which flips on the same evidence."


[[clause]]
id = "machine.bench.guest-lane-locked"
doc = "06-machine.md#8"
status = "test"
tests = ["xtask:bench", "golden/boot-actors"]
note = "plans/M5.md item F, decision 14, extending `compiler.bench.build-lane-locked`'s own precedent to the guest side: `cargo xtask bench guest` boots a golden `@test(runtime)` image via the codesigned `wrela-vmm` binary, `--record`ed every timed iteration (2 warmup + 5 timed — fewer than the compiler lanes' 3+15, since each iteration is a real `hv_vm_create`/1 GiB zeroed `alloc_zeroed`/`hv_vm_map`/vCPU-run/`hv_vm_destroy` cycle, not an in-process call), reporting min/median/max wall time and comparing the median against `bench/thresholds.toml`'s `[guest]` table. Also asserts, across every timed boot of the identical image, byte-identical transcripts and identical exit codes/vCPU exit counts (decision 14's own \"exact replay counts\" half — parsed back out of each boot's own `--record` file via a small hand-rolled `key=value` reader, `parse_guest_record` in `crates/xtask/src/main.rs`, deliberately not a dependency on the `wrela-vmm` crate itself — see `GuestRecord`'s own doc comment). Wired into `cargo xtask check`, immediately after `bench build`. As locked at M5 the workload was `tests/golden/boot-hello` against `boot_hello_median_us = 600000` (measured median ~50-52ms on the locking machine; that boot's `exit_code=1` is its own correct outcome — its `deliberate_fail` test deliberately fails).\n\n**plans/M10.md decision 661 note-update (recorded at item M, sweep find L-18)**: the locked workload is now `tests/golden/boot-actors` against `boot_actors_median_us = 700000` — a workload *change*, not a raise: `boot-hello` declares no actors, so its wall time was almost entirely HVF create / 1 GiB zeroing / destroy and a scheduler regression of any size was invisible at any threshold. `boot-actors` exercises two actors, mailbox FIFO, await park/resume, non-reentrancy; its choice-sequence count joins the exact-count assertion set, so the lane is a real scheduler-path signal. Pre-migration baseline medians 66644/70885/70084/67609/67287us across five 5-iteration runs (quiet ~67ms); threshold 10x, rounded up, same rationale as every lock in the file. This entry's `tests` previously still cited `golden/boot-hello` and this note described `boot_hello_median_us` only — stale since the 661 commit, corrected here without any behaviour change (`xtask:bench` ran `boot-actors` the whole time; `bench_guest_lane` in `crates/xtask/src/main.rs` is the code path)."


[[clause]]
id = "machine.interrupts.checkpoint-injection"
doc = "06-machine.md#4"
status = "test"
tests = [
  "golden/boot-deadline-cancel",
  "golden/boot-deadline-inherit",
  "golden/boot-cancel-cleanup",
  "golden/boot-secondary-core-vector",
]
note = "plans/M6.md item F (2026-07-24), decision 7: **flipped on a source-level witness**, which is exactly what item E's own note said the flip was waiting for. The mechanism item E built is unchanged (`__wrela_checkpoint_service`'s mask-arm-recheck loop over the per-core pending word, its single relocated `BL` to `__wrela_vector0_service`, and that routine's own \"clobber x0..x14, preserve x28/sp, clearing is the service's job\" contract); item F replaced the routine's *body*, exactly as E predicted, and added the one producer a real `.wr` program can reach.\n\n**The vector-0 body** (`layout::emit_deadline_scan_and_delivery`): a fully-unrolled linear scan of the static group arena — every `in_use`, not-yet-cancelled slot whose nonzero `deadline_ns` the clock has passed gets `cancelled = 1` — followed by a second unrolled scan over every turn area that makes a *parked* turn whose ambient group just got cancelled `resume_ready`, so it can observe and terminate. The clock read is the ordinary trapping `CLOCK_MMIO_ADDR` load, so it is a real recorded `ClockRead` and replays from the log.\n\n**The producer, and why it is not the VMM here** (recorded, because it is a real departure from the shape decision 7 sketched): decision 7 named \"a parked guest writes its next deadline; the VMM wakes it at that deadline\" as M6's injector, and that path is real and conformance-tested (item E's own `park_conformance_wakes_at_the_deadline_and_resumes_over_hvf`). But **no M6 `.wr` program can ever park**: parking requires \"nothing ready\" with work outstanding, and at M6 nothing can block a turn forever — the image graph's own construction DAG makes handle cycles unconstructible, so item D's finding that \"no deadlock is constructible at M6's acyclic-handle source surface\" cuts both ways. A child spinning past its deadline is precisely the case where the guest never stops having ready work. So the scheduler itself is the second producer: `layout::emit_deadline_poll` (`__wrela_deadline_poll`), called once per entry-driver scheduler tick, computes the minimum live deadline, writes it to `machine_info::OFF_NEXT_DEADLINE` (arming the park path unchanged, 06 §5), reads the clock, and — if that minimum has already passed — **sets this core's own pending word**, the identical word the VMM's raise writes. Routing through the pending word rather than calling the scan inline is the load-bearing part, not ceremony: it is what makes the cancellation land at a *checkpoint* (02 §9.5's \"never between arbitrary instructions\") instead of at whatever instruction the scheduler happened to reach, and it is why the injection point is deterministic and replay-identical.\n\n**The flip witness, `golden/boot-deadline-cancel`**: a group with a zero-budget deadline (`now() + ms(0)`); a `g.start` child running a bounded 8-iteration loop, each iteration awaiting an actor so the scheduler regains control between them. The transcript proves both halves: `CallError::Cancelled` surfaced (the join result's own `Err` arm ran) and cancellation landed at the child's *first* checkpoint past the deadline — a `Counter` actor whose state counts completed iterations reads exactly `1`, never the loop's own bound of `8`. Both assertions are load-bearing (asserting `2` fails; a far-future deadline makes the child complete and the `Err` arm never run — both verified directly, not assumed). Byte-identical across 3 boots. `golden/boot-deadline-inherit` cites the same mechanism through the narrowing rule, and `golden/boot-cancel-cleanup` through the cleanup chain.\n\n**Replay payoff** (`cargo xtask repro`'s own `repro_deadline_cancel_replay_is_clock_log_driven`): this is the first boot in the repo whose *behaviour* depends on the clock, so it is the real test of decision 9's claim that replay takes its time from the ChoiceLog. It records (4 `ClockRead` choices, no `DeadlineWake` — this boot genuinely never parks, recorded rather than claiming a skipped sleep that never existed), replays clean with zero divergence and the same guest-authored exit code, and — the part that cannot be faked — a replay whose *first* logged `ClockRead` is tampered to a far-future value changes the guest's own behaviour (the child runs to completion, the assertion fails) and is therefore caught, exiting `EXIT_REPLAY_DIVERGENCE`. If replay were quietly reading the host clock, that tamper would change nothing.\n\n**plans/M13.md item B note-update (2026-07-27)**: vector service runs where `__wrela_rt_checkpoint` runs — core 0's entry driver — so a vector-owning `@driver` placed off core 0 is unserviced today. Flip condition is plans/M13.md item N's per-core checkpoint (`__wrela_rt_checkpoint` takes `core` and services `PENDING.words[core]`). **No new check**: plans/M8.md item C1 already refuses any `@driver` placed off core 0 at layout time (`actors.scheduling.per-core-loop`). This note only records the connection so item N knows which refusal it relaxes and which note it flips.\n\n**plans/M13.md item N (2026-07-27) — flipped:** `__wrela_rt_checkpoint` takes `core` and services `PENDING.words[core]`. Core 0 keeps the vector0/IRQ/wake ladders; secondary cores consume their wake doorbell at the loop-head BL. The async/IRQ trampoline materializes `x0 = 0`. Witness: `golden/boot-secondary-core-vector`. The M8 C1 `@driver` off-core-0 refusal is unchanged (drivers still core 0); this flip is the per-core *pending-word service* path, not driver placement."


[[clause]]
id = "machine.replay.choice-sequence"
doc = "06-machine.md#8"
status = "test"
tests = ["xtask:repro", "golden/boot-cross-core-admission-order", "golden/boot-cross-core-mailbox-depth"]
note = "plans/M6.md item E, decision 9 (the ROADMAP's own non-negotiable recorded-design constraint: the schedule representation must be an enumerable choice sequence, not a bare log). `record::ChoiceEntry` is the tagged sequence itself (`ClockRead`/`DeadlineWake`/`VectorRaise`/`Admission` — the last format-only at M6 and made real at M8 item C3, below: one core makes admission order deterministic program order, so at M6 the VMM had no admission choice to observe; the FORMAT still parses/round-trips the tag, disclosed and pinned in `choice_log_format_is_pinned_including_every_tag`, a hand-built log compared against an exact string literal — 'structure, not timestamps', the plan's own instruction, exactly `record.rs`'s established M5 house style for this kind of format pin). `record::Chooser::choose_next` is the single-point-of-choice structure CLAUDE.md names as the one piece of architecture the ROADMAP explicitly bought: one function, taking a `ChoiceRequest` (what's being asked, for tag-checking) and a `live` closure (invoked only in record mode — real clock read, real sleep — never in replay, which is exactly why a deadline wake's own sleep is skipped under replay); every nondeterministic decision `boot_image_core`'s exit loop makes flows through this one call, so a later milestone's schedule enumerator is a third implementation of the identical interface with zero call-site changes. Divergence is named per-choice (`ChoiceTagMismatch`/`ChoiceLogUnderrun`/`ChoiceLogOverrun`), never a single opaque bit.\n\nCited via `xtask:repro` (`repro_choice_log_roundtrip`, `crates/xtask/src/main.rs`) — records and replays `tests/golden/boot-hello`'s own real image live through the signed `wrela-vmm` binary, asserting the versioned `ChoiceLog v1` header and a replay exit code matching the recorded boot's own guest-authored outcome (zero divergence); the fuller multi-tag conformance evidence (a real `DeadlineWake`/`VectorRaise` sequence, recorded and replayed byte-stable with tamper detection) is `record_replay_of_the_park_wake_scenario_is_byte_stable_and_detects_tamper` plus the `Chooser` unit-test suite in `record.rs` itself (`recorder_logs_every_live_value_in_order`, `replayer_never_invokes_live_and_feeds_the_recorded_value_back`, `replayer_diverges_loudly_on_underrun_but_still_completes`, `replayer_diverges_loudly_on_a_tag_mismatch`, `replayer_diverges_loudly_on_overrun`) — real, current, run on every `cargo xtask check` (`cargo test --workspace`/`test_wrela_vmm_signed`), not individually citable here for the established `tests/`-path-or-`xtask:<command>`-only reason, recorded honestly rather than silently folded into the one citation above.\n\n**Note-update (2026-07-24, verification's own fail-closed finding)**: the choice sequence's own record/replay machinery was already sound (`Chooser::choose_next`'s own divergence detection was never the bug), but the *process-level* mapping of a clean replay's own outcome in `main.rs` was — a clean replay unconditionally returned exit `0` regardless of the guest's own reported result. Fixed alongside `machine.replay.clock-log`'s own note-update (full detail there): `main.rs` now collapses a clean replay through `recorded.exit_code` exactly like a plain boot, never unconditionally `SUCCESS`. `repro_choice_log_roundtrip`'s own assertion was updated to match (`replay_exit == record_exit`, not `replay_exit == 0`) and a sibling check, `repro_replay_exit_code_contract` (`xtask`) plus `lib.rs::replay_divergence_and_record_failures_exit_nonzero_through_the_real_binary`, now pins the whole process-level exit-code contract (guest-authored `0`/`1`, runner-authored `EXIT_VMM_FAILURE=2`/`EXIT_REPLAY_DIVERGENCE=3`) so a caller checking only `$?` can trust it — the single-point-of-choice structure's own correctness was never in question, only its outermost, previously-untested CLI-level consumer.\n\n**Item C3 (plans/M8.md, 2026-07-25, decision 42) — `Admission` stops being format-only.** M6 shipped the tag with nothing to put in it (one core, so no cross-core admission exists to observe); M8 item C2 built the cross-core SPSC rings, which manufactured the fact this tag names. The recorder now emits one `Admission mailbox=<root> sender=core<N>` per message a core's own drain hands to a mailbox root, in admission order. The field set is M6's unchanged — no timestamp, no address, no interleaving trace — so no pre-existing recording needs a format migration and §8's enumerable-choice-sequence requirement is preserved by construction; `sender` is a *core* because plans/M8.md decision 28 settled that a cross-core ring's producer is a core, not an actor.\n\n**Witness, not injection — stated in those words because they are not the same claim.** The admission is performed by guest code (`layout::build_rt_drain`) in guest memory. The VMM neither writes a mailbox nor reorders a ring, in record mode or replay mode, so replay does **not** feed the recorded order back to the guest — under decision 11's baton exactly one vCPU runs at a time and there is no alternative order to feed. What replay does is re-witness and **check**: a disagreement is `Divergence::AdmissionMismatch`, named exactly like a device completion's. Divergence detection is therefore the entire enforcement, which is why this item's exit criterion is a tamper oracle rather than a behaviour change.\n\n**Mechanism.** The report's `Ring` lines gained `base=` (item C3) so the VMM can address a ring at all; `parse_report` keeps the request lanes in report order and derives each one's occupancy word (`base + cap*slot + 16` — `place_runtime_tables`'s own slots/head/tail/count layout), refusing a same-core ring, an unknown lane kind, a request ring with no target, a ring with no `base=`, and a ring naming a core the image never brings up. `witness_admissions` runs at **every** vCPU exit, before that exit is decoded. The count is exact rather than sampled, and the reason is an invariant rather than luck: a ring's producer and consumer are different cores and the baton means at most one core ran since the last observation, so a ring whose *consumer* just ran can only have shrunk, by exactly the number of messages that core admitted. If that ever stops holding, the witness fails the boot closed by name rather than under-recording (`admission_witness_fails_closed_if_a_consumed_ring_grows`). The order is exact for the same reason: `build_rt_drain` walks its inbound lanes in `RuntimeTables::rings` order and drains each to empty, and the report lists them in that order (`admission_witness_counts_only_the_running_core_s_own_drain`).\n\n**Evidence, and the mutation each arm survived.** `cargo xtask repro`'s `repro_cross_core_admission_replay` over `tests/golden/boot-cross-core-admission-order` — a workload written for this lane because none existed that could falsify an *order*: `boot-cross-core-two-senders` carries two cross-core messages to one mailbox but both from core 0, so its two entries are byte-identical and a swap of them is unobservable. In the new workload `Near` sits on core 0 and `Far` on core 2 and both message `Sink` on core 1, so the recording is `Far/core0`, `Sink/core0`, `Sink/core2` — entries that differ, in an order the boot's own transcript independently states (`Near`'s await returns 1, not 11, because core 2's earlier-*published* +10 is admitted *second*: publication order belongs to the producers, admission order to the consumer's drain, and this is the smallest image in which the two visibly differ). The lane checks that exact sequence, replays it clean, then **inverts the two `Sink` entries' producing cores** — each tampered line individually plausible, only the order wrong — and requires exit `EXIT_REPLAY_DIVERGENCE` (3) with `admission mismatch` on stderr. Mutations applied to the tree and re-run: making `witness_admissions` a no-op -> the lane fails with `recorded []`; deleting the recorded-vs-witnessed comparison -> the inverted log replays **clean, exit 0** and the lane fails (this is also the direct evidence that the guest does not consume the log — witness-only); counting on the producing core instead of the consuming one, or watching `head` instead of `count` -> the boot fails closed by name; reversing the lane walk -> both the repro lane and the unit test fail, and the recorded sequence is exactly the inverted one. A single-core image has no request ring at all, so its choice sequence is byte-identical to its pre-C3 one (every M5-M7 golden, and `bench guest`'s `choices=0`).\n\n**Thin, honest.** The witness observes at vCPU exits, and an exit is the only point at which guest execution stops, so a drain cannot hide between two of them *under the baton*. The day three vCPUs genuinely run at once (decision 11's own 'the day the baton goes') this reconstruction is the first thing to re-examine, because both the exact count and the lane ordering rest on 'at most one core ran'. Recorded here rather than discovered then. Reply rings are deliberately not recorded: a reply is delivered to a turn record, not admitted to a mailbox, and §8 names per-mailbox admission order.\n\n**`repro` is wired into `cargo xtask check` (orchestrator, 2026-07-25).** Item C3 found and correctly left alone that `check` ran `report_determinism` — which proves the *build* is byte-reproducible — but never `repro`, where all four **tamper** lanes live: a tampered clock read, a tampered device completion, a tampered exit code, and this clause's tampered admission order, each of which must be caught *by name*. Those are the strongest oracles in this repo and every one of them was opt-in while CLAUDE.md called `check` the gate, so a regression that let a tampered log replay clean would have passed every gate run anyone made. The cost argument did not survive measurement: `repro` is ~1.8s wall against a `check` of minutes, and it adds no new dependency class (`check` already runs `test_wrela_vmm_signed` and `bench_guest_lane` over Hypervisor.framework). Proved load-bearing rather than assumed: with the recorded-vs-witnessed comparison disabled, `cargo xtask check` now exits 1 on `a tampered admission choice replayed with exit 0, expected 3` — before the wiring, the identical tree passed the gate.\n\nplans/M8.md item H Target B (2026-07-25): admission tampers are caught by named field — `AdmissionMismatch` Display says `(mailbox)`/`(sender)`/`(mailbox+sender)`; drop/add produce `AdmissionCountMismatch` rather than a generic choice-log underrun/overrun. Oracle: `xtask repro`'s six named tampers over `golden/boot-cross-core-admission-order` (invert order, tamper sender, tamper mailbox, drop, add spurious, reorder across mailboxes); unit pins `admission_mismatch_display_names_the_diverging_field` / `admission_count_tampers_are_named_not_generic`."

[[clause]]
id = "machine.display.golden-frames"
doc = "06-machine.md#7"
status = "gap"
note = """
**No milestone owns this** (recorded 2026-07-25, human decision). Display and input were rung 9 of the ROADMAP ladder — display + input devices, a dumb scalar tile compositor, golden frame digests — and were then taken off it entirely; pixels lives in ROADMAP's "Recorded language intentions", human-gated, with the derivation. Recorded here for the same reason `compiler.progress.wait-for-graph` once recorded its own (that clause is now owned by M14's constructive theorem): so the ledger states that a normative clause has no owner rather than implying a rung will get to it.

The scope of the gap, unchanged by the descheduling: 06 §7's whole section — framebuffers as blob resources the VMM scans out directly, the tile scatter-gather list a frame actor submits, one doorbell per flush, vsync on the frame vector — plus the sentence this clause is named for, "CI can assert golden-image digests through the VMM". Nothing of it exists: `wrela-vmm` models one device family (`blk`), and 06 §6's `display` and `input` contracts have no driver in `stdlib/` and no model in the VMM.

Two consequences worth stating rather than leaving to be rediscovered. (1) 06 §10 names the golden-image display tests as part of the machine conformance suite, so **machine v1 is not conformant while this is a gap** — in the company of `input` (this clause) and, until M17 lands, `entropy` (thin recorded-source device; not a `@driver`; owner **M17** after the 2026-07-28 ladder insert). `net`/`sound` are outside machine-v1 after M13 item D. **Display and input stay on the pixels intention** (not M16–M19). (2) `hardware.dma.pool-reachability`'s symmetric half (a device refused access to another device's pool, observed *by* the second device) is a unit oracle only, and becomes a boot when any second device model exists — this one or another.

Flips when a frame is actually computed in the guest, scanned out through a display model, and its digest pinned as a golden that replay reproduces.
"""

# --- sema torture corpus ----------------------------------------------------

[[clause]]
id = "sema.coverage.torture"
doc = "02-language.md#3"
status = "test"
tests = ["golden/check-torture-block-cache", "golden/check-torture-rate-limiter", "golden/check-torture-command-parser", "golden/check-torture-frame-ledger"]
note = "four large (140-175 line), coherent, sema-valid programs — the biggest the checker has faced (prior check-* goldens top out around 80 lines) — pinning the resolved-signature dump for cross-feature combinations no single small golden exercises together, and doubling as fuzz-mutation seeds (plans/M2.md item I) that enrich the sema fuzzer's corpus with realistic structure. check-torture-block-cache: a fixed-capacity DMA block cache with eviction — own[P] handles threaded through field take/restore cycles and take-self consuming methods, a generic struct (Slot[T, const N]) instantiated once as data (Slot[u64,2]) and once as a transitive resource (Slot[Handle,2]), private methods with inferred receiver effect. check-torture-rate-limiter: a token-bucket rate limiter driving a gate state machine — operator methods (add/subtract/less_than) on a user struct, a generic fn (earlier[T]) instantiated at two distinct struct types both explicitly and inferred, a Result-returning init, deriving(From) chained through two hops consumed by `?`, closures as scoped accessors (fn(mut TokenBucket) -> bool/unit params), exhaustive match with a guard and a `|` alternative over enum payloads, a resource (Ticket) moved through Result[Option[_], _]. check-torture-command-parser: a command parser over fixed byte arrays with validation results — named-field enum variants, a second Result-returning init and deriving(From) chain, exhaustive match with guard and multi-arm `|` (including a three-way alternative with no bindings), a resource (Reply) moved through a tuple (constructed and later destructured via a `take`-marked tuple pattern) and through Option, a generic fn instantiated over array element type at two different concrete types. check-torture-frame-ledger: a double-buffered frame ledger with resource handoff — own[P] handles again, the front/back double-buffer flip implemented as the textbook take-swap-take-restore over two resource fields, field take/restore split across match arms in one arm only, a resource-carrying enum variant (PresentOutcome.Delivered(FrameSlot), enum itself classified resource), a second generic struct (Cell[T, const N]) instantiated data and resource, defer-based cleanup. All four check clean via `wrela dump --stage=check` with no changes needed to any existing golden, compiler source, or xtask. Two checker-vs-doc disagreements were found and minimized while writing these (both routed around here, not silently accepted): (1) a struct method's own generic parameter (02-language.md §8.3's own `fn entry[R](mut self, ..., body: fn(mut Item) -> R) -> R` worked example) hits `error[unimplemented]: generic instantiation is not checked yet` — this one is already the documented scope boundary sema.generics.structural's note calls out (\"a method's own generic parameters ... are never instantiated\"), independently rediscovered here via the doc's own example; (2) unlike that documented case, using an already-constructed generic-struct value's concrete instantiation outside the generic's own re-checked body does not appear to substitute the type argument — `struct Slot[T, const N: usize]: items: [Option[T]; N]` then `slots = Slot[u64, 2]([None, None]); v = slots.items[0]` reports `error[type]: expected \\`Option[u64]\\`, found \\`Option[T]\\`` at the field access, and returning a fresh `Slot[u64, 2](...)` construction from a function declared to return `Slot[u64, 2]` reports `error[type]: expected \\`Slot[u64, 2]\\`, found \\`Slot\\`` — i.e. the construction expression's own synthesized type does not carry its instantiation args either. golden/check-generics never accesses a field or matches an expected type against an instantiated generic value (only binds the construction to an untyped local and discards it), so this call-site substitution path looks untested rather than deliberately scoped out; not fixed here per this session's remit (no compiler-source changes), so both torture programs bind generic-struct instantiations to untyped locals without further field/method use or expected-type matching, mirroring check-generics' existing pattern. Fixed in a later session (sema.generics.structural's own note; golden/check-generic-use) — the torture programs themselves are left unchanged (still binding to untyped locals) since regenerating them would touch goldens outside this fix's narrow scope, but the underlying gap they describe is closed."

# --- oracle hardening (post-M2) --------------------------------------------

[[clause]]
id = "sema.check.roundtrip-stable"
doc = "02-language.md#2"
status = "test"
tests = ["golden/err-empty-body-continuation", "golden/ast-const-closure-suite", "xtask:roundtrip", "xtask:fuzz"]
note = "Two new sema oracles, both riding the frozen pass order's own guarantee that a `check` outcome is a pure function of the parsed `Module` (collect-then-resolve module-scope declarations are order-independent by construction; forward references between fns/consts/structs already checked clean in M2). (1) Sema roundtrip: for an input that parses, A = sema outcome of the original module, B = sema outcome of parse(pretty(A's module)); A and B must agree — both Ok with a byte-identical sema::dump (exact, since the check dump carries no spans, decision 8), or both Err with the same category and message. Line/col are never compared (the printer relayouts source positions); `extra_lines` (item H's `required by`/`instantiated at` chain, sema.generics.structural) are compared after stripping each line's trailing ` at <path>:<line>` tail, since both sides of every comparison are checked against the same fixed placeholder path (`<roundtrip>`/`<fuzz>`) and only the line number legitimately moves — the stricter of the two comparisons plans/M2.md's follow-up allows (vs. dropping extra_lines from the comparison entirely). Wired into `xtask roundtrip` for every golden input and corpus entry that parses as a whole `Module` — not just `ast-*`: `check-*`/`err-type-*`/etc. golden inputs are exactly the sema-meaningful corpus (valid syntax, sema accepts or rejects) this oracle needs, so the golden half of `roundtrip` no longer filters to `ast-*` only — and into `xtask fuzz sema` as an extra invariant on every iteration whose input parses, whether sema then accepts or rejects it. (2) Item-rotation acceptance invariance (`xtask fuzz sema` only — `xtask roundtrip` has no rotation counterpart, since item order there always matches the pretty-printed source): rotating a parsed module's top-level items by one (the first item moved to the end; `imports` is a separate `Module` field, left untouched) and rechecking must not flip Ok to Err or vice versa, even though the dump/diagnostic content is allowed to differ (order follows source). Re-measured cost after adding both invariants to `fuzz sema`: ~61us/iteration (500_000 iters in ~31.0s, 2_000_000 in ~125.3s), up from ~38-39us/iteration before (sema.no-panics' own measurement) — about 1.6x, not the full 2x a naive doubling would predict, since most mutated/soup iterations never reach a parseable module at all; 2_000_000 still lands the deep default at a bit over two minutes, inside the 1-3 minute band, so `FUZZ_SEMA_DEEP_ITERS` is unchanged. Clean-run evidence at commit time: `xtask fuzz sema` (seed=1, 2_000_000 iterations, zero findings from either new invariant) and `xtask roundtrip` (79 corpus/golden entries checked, 53 sema-roundtrip-checked, zero mismatches). Both oracles found one genuine, pre-existing parser bug during development (fuzz sema's roundtrip oracle, via corpus mutation of the virtio-storage worked example): 02-language.md §1's multi-line declaration-header continuation (`fn`/`init` whose signature continues onto an indented `-> Ret:` line) shares its one INDENT with the body itself, so a comment-only (token-free) body left `parse_stmts_until_dedent` accepting zero statements — silently, with no diagnostic — instead of requiring the explicit `pass` every real body needs (the ordinary, non-continuation path never has this hole, since a truly empty body there never produces an INDENT token at all, so its own `expect_indent()` already failed closed). Fixed narrowly in `parse_fn_tail` (crates/wrela-compiler/src/syntax/parser.rs): an empty body parsed via the continuation branch is now `error[parse]: expected a statement, found ...`, pinned by golden/err-empty-body-continuation. Multi-seed campaign evidence (pre-M3 shoring wrap-up): fuzz sema deep at 2_000_000 iterations clean on seeds 1, 2, 3, 4, 5, 11, 17 (14M total with both oracles active; seed=5 first found the empty-embedded-suite parse hole, fixed and pinned by golden/err-empty-embedded-suite, then ran clean), fuzz lexer 200_000 clean on seeds 1-3, fuzz parser 100_000 clean on seeds 1-3.\n\nPost-M4 fuzz find (2026-07-24, `cargo xtask fuzz sema --seed 11`, iteration 955154, mutating golden/check-comptime-if-module — `const DEBUG: bool = true` mutated to `const DEBUG: bo = |x: u64| x + ol = true`): `sema-roundtrip: pretty-printed output failed to reparse: expected end of line, found \\`comptime\\` at 7:1`. Root cause was the parser, not the printer, once traced all the way through: `|params| target op value` (no colon, no indent — parser.rs's own `parse_closure_short_body`, 02-language.md §8.3's compound-assignment example) legitimately produces `ClosureBody::Suite(vec![Stmt::Assign(...)])` with *no* real layout tokens at all — it is parsed as a plain expression on one physical line. `print_closure`'s `Suite` arm (syntax/printer.rs) cannot distinguish that shape from a real `|params|: suite` (colon + indented block) and always re-renders it as the latter. That is fine wherever the closure sits inside a statement parsed via `parse_stmt`, because `end_of_simple_stmt` (parser.rs) already has a depth-0 fallback for exactly this: a simple statement's own trailing expression ending in a nested suite has already had its logical line closed by that suite's own `Dedent`, so nothing is left to consume, regardless of what token (even an unrelated one like the next item's `pub`/`comptime`) follows. `parse_const_item` and `parse_member`'s field-default value, though, terminated their own declaration with a bare `self.expect_newline()?` — never `end_of_simple_stmt`'s lenient sibling — so a suite-bodied closure as a `const`/field initializer's value hit the strict check and failed on whatever real token happened to follow (the next item's leading keyword). Fixed by adding `Parser::expect_declaration_terminator` (parser.rs, right after `expect_newline`): identical to `end_of_simple_stmt`'s own final fallback (`Newline`, or the immediately-preceding consumed token already being one) minus the statement-only bracket/`,`/`inline_depth` tolerances a declaration's value is never parsed inside — swapped in at both `parse_const_item` and the struct-field-default call site. Minimized to golden/ast-const-closure-suite (`const F = |x: u64| x = true` followed by a `pub fn`, dropping the type annotation and the module's other machinery — the closure's short-form assignment body and a following item are the whole reproduction), pinning the parsed `ast.txt`; `xtask roundtrip`'s own walk over every golden input (this clause's own oracle) now exercises this shape's pretty/reparse cycle on every run, so a regression here fails `xtask check` directly, no separate mechanism needed. `cargo xtask fuzz sema --seed 11` re-run clean at the full 2_000_000-iteration deep default after this fix (see comptime.eval.no-panics for the second, unrelated native-stack finding the same deep run then surfaced)."

