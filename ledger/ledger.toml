note = "plans/M6.md item C, decision 3: the guest runtime core's own static layout, computed once (`layout::compute_runtime_tables`, new — a pure fn of `(ImageGraph, the build closure's raw modules, mwir::LayoutCtx)`) and consumed by both halves decision 3 names: the emitted image's own `rtdata` section (`layout::layout_program`/`layout_test_image`, both grown a `runtime: Option<&RuntimeTables>` parameter — reserved, zeroed bytes, sized exactly `RuntimeTables::total_bytes`, present the moment `ImageGraph::actors` is nonempty, build or test image alike — the plan's own \"runtime tables are emitted for any image with actors, tests or not\") and the report's own new accounting section (`layout::render_layout_section`, reading `ImageLayout::runtime`): one `Actor name=<type> mailbox=<cap> slot=<bytes> frame=<bytes> state=<bytes>` line per declared actor instance, then one `Totals actors=<n> ready_queue=<n+1> group_arena=<static with-site count> bytes=<total>` line — facts only, absent entirely for a sync-only image (no placeholder ever rendered).\n\nPer-actor sizing, all real (never invented) numbers: `state_size` is the actor struct's own field storage (`mwir::size_of` over `LayoutCtx`, the same one-8-byte-slot rule every other aggregate in this compiler already uses); `mailbox_capacity` is the declared `mailbox=` argument (`ImageGraph::actors[i].args`) — M6's own dumbest-sound floor (04 §2's real *derivation* is out of scope, recorded in plans/M6.md), fail-closed named if a build ever declares an actor with no `mailbox=` at all; `slot_size` is 8 (a plain `u64` method-index tag) plus the widest `pub` method's own param blob, in bytes (`sema::types::declare`'s own `DeclFn::receiver.is_pub`/`params`, re-derived per module exactly the way `mwir::build_layout_ctx` already re-derives declare-phase facts from raw source rather than threading extra state out of an earlier pass) — a private method never widens a slot (02 §9.2: only a `pub` method is ever a message shape). `frame_size` is fixed at `TURN_FRAME_BOOKKEEPING_SIZE` (8 bytes, the one in-use/busy word `rt_select_and_run` actually reads/writes today) — the frame-arena reading recorded verbatim in plans/M6.md: non-reentrancy means at most one active/suspended turn per actor, so exactly one frame slot per actor, never one per queued message; this is real, used-today bookkeeping, not a placeholder, and is expected to grow the day item D lowers a real async state-machine frame into it. Scheduler tables: `ready_queue_capacity = actors + 1` (the root test turn), reserved as a real table not yet populated (`rt_select_and_run`'s own O(actor-count) round-robin scan is the dumbest correct selection at M6's own actor counts — recorded, not silently assumed); `group_arena_capacity` is a real (not hand-waved) static count of `with group(...)` sites across every raw module in the build closure (`layout::count_with_group_sites`, an honest AST walk — `0` in every actor-bearing golden today, since none uses `with group` yet; the disclosed gap — no descent into closures/`comptime if` — is inert at C, since no group actually executes against this arena until item F wires it).\n\nThe one necessary, disclosed deviation from this item's own file-boundary list: `layout::try_layout_program` gained two parameters, `graph: &ImageGraph` and `modules: &BTreeMap<String, Module>` — the only facts (which struct each declared actor instance names, its own `mailbox=` value, which methods are `pub`) that never reach this fn through its existing, otherwise-untouched inputs. Its two call sites (`bin/wrela.rs::build_report`, `xtask`'s determinism oracle) each pass one already-in-scope local variable one call deeper — the smallest possible edit, chosen over re-running `eval::interp::eval_image` a second time inside `layout.rs` purely to avoid touching `bin/wrela.rs` (which would duplicate comptime evaluation for data its own caller already computed once, a real architectural smell CLAUDE.md's own \"no layers for their own sake\" warns against, not a lesser evil). `layout_program`/`try_layout_program`'s own pre-existing unit tests, and every existing report golden without actors, are untouched.\n\n`golden/appliance` (2 actors, `CacheActor`/`StatsActor`), `golden/image-project` (1 actor, `Store`), and `golden/image-helper-accept` (1 actor, `Store`) each moved once, additively only — every pre-existing line byte-identical, the new `Section name=rtdata ...` line and the `Actor`/`Totals` lines appended after the pre-existing `Entry base=...` line, never reordering anything. `golden/image-basic` does NOT move (its own report never renders at all — the pre-existing `image.report.layout-asserts` gap fires first, decision 10, unchanged by this item).\n\nConformance (the M5-E precedent: real execution is the oracle, not hand-verified bytes) — `layout::build_rt_enqueue`/`layout::build_rt_select_and_run` (new, hand-assembled via `Asm`, the identical M5 harness style; one specialized enqueue/select pair per actor rather than one generic address-indexed pair, 04 §6's own \"Actor as-if\" license exercised at its simplest, since every actor's own ring address is already a build-time constant): `wrela-compiler/src/layout.rs`'s own `harness_jit` module (JIT-executed against host-mmap'd stand-in memory) proves admission (FIFO, always inserted at `tail`/drained from `head`), ring-full rejection (`count == capacity` leaves `tail`/`count` untouched), non-reentrancy (a `busy` actor admits nothing, not even a peek at `count`), and dispatch at the smallest possible ring shape (`capacity=1`, `slot_size=8`, no args) — the last of which caught and fixed a real out-of-bounds arg-word read (`rt_select_and_run` previously read two fixed 8-byte words past the method-index tag regardless of `slot_size`, reading into `head`/`tail` themselves for any narrower slot; now bounded by `(slot_size-8)/8`, capped at 2). `crates/wrela-vmm/src/lib.rs`'s own two new `#[test]`s are real HVF boots of hand-assembled guest programs (no compiled `.wr` source can reach this machinery yet — async lowering is items B/D's own in-flight/future work, so every 'actor method' here is a hand-assembled stand-in, exactly the clock-reading test's own established precedent): `actor_runtime_enqueue_select_fifo_and_ring_full_over_hvf` proves enqueue -> select -> run a sync method end-to-end, FIFO order across two queued messages, and ring-full rejection, all folded branch-free into one exit code; `actor_turn_abandon_exits_the_image_nonzero_and_never_resumes` proves decision 12's own structural claim (an actor turn that aborts exits the image nonzero and never resumes `rt_select_and_run` — the turn-kind-aware console line naming *which* actor faulted is staged follow-up work for whenever item D's real dispatch exists to route through it, recorded, not silently dropped). Neither test is separately citable above (`xtask ledger`'s own validator has no way to name a bare `cargo test` unit test — `machine.clock.trap-logged`'s own note already established this exact precedent), so they are recorded here in full instead of invented into the `tests` list. Boot process note: `wrela-vmm`'s own test binaries need the hypervisor entitlement `xtask`'s `test_wrela_vmm_signed` codesigns them with — an ad-hoc `cargo test -p wrela-vmm` invocation fails closed with `HV_DENIED`, exactly as `xtask::main.rs`'s own doc comment on that fn already explains; both new tests were run and verified green through the signed path.\n\nMachine-contract addition, coherent with item C's own instruction to add the pending-word page now: `wrela_machine::pending` (one `u64` per core, `pending::core_word_addr(core)`, placed in the pre-existing `0x4000_7000..0x4001_0000` reserved gap, non-overlap tested alongside every other region in `regions_do_not_overlap`) — item E's own vector-delivery contract (06 §4), un-consumed by anything at M6-C (this item's own event loop never truly parks, decision 7's own module-doc note explains why), added now so item D's checkpoint-emitted mask-arm-recheck sequence and item E's VMM-side raise agree on the same address from the start.\n\n**Note-update, plans/M6.md item D (2026-07-24)**: `ActorRuntimeLayout::frame_size` did NOT grow past `TURN_FRAME_BOOKKEEPING_SIZE` (8 bytes) — a disclosed departure from this clause's own earlier \"expected to grow the day item D lowers a real async state-machine frame into it\" prediction, recorded honestly rather than silently kept true by omission. Reason: item D's own `Await{ActorCall}` mechanism (`actors.codegen.state-machines`, opened this session, has the full design) resumes inline, within one native call, rather than truly suspending across a native-call boundary and re-entering from a separate top-level scheduler tick — so an async fn's own live temps never need to survive past that one call's own lifetime, and live in an ordinary SP-relative stack frame (`codegen.rs`'s ordinary `Frame`/`build_frame`, reused verbatim) exactly like a sync fn's, never in the actor's own persistent per-actor `rtdata` slot. `dispatch`'s own targets (`build_rt_select_and_run_symbolic`, new) are now real `Reloc::Call`s into `program.fns` — a sync method's real compiled body or an async method's real compiled state-machine entry, both ordinary entries in the same table, no color-based special-casing — replacing item C's own named `build_async_dispatch_abort_stub` placeholder for the first time.\n\n**Note-update (2026-07-24, the park-and-resume redesign — the M6 turn-suspension mandate; `actors.codegen.state-machines` carries the mechanism's own full record)**: the static tables grew exactly the fields real suspension needs, all still sized at build time, nothing dynamic. (1) **Mailbox slot layout**: `[0..8)` method index, `[8..16)` the message's own **waker** word (the awaiting turn's turn-area address, 0 for a one-way `send`), `[16..slot_size)` the args blob — `slot_size = 16 + widest pub method's params` (was `8 + ...`); `rt_enqueue` gained the matching `x3 = waker` argument and stores it into the slot, admission otherwise unchanged (and still deliberately independent of `busy`: a message to a busy-suspended actor QUEUES — decision 4 lives in selection alone). (2) **The per-actor frame slot became the turn area**: a fixed 48-byte turn record (`codegen::OFF_TURN_*`: busy/suspended/resume_ready/reply/waker/cur_method — `TURN_FRAME_BOOKKEEPING_SIZE`'s 8-byte busy word grown into a real record) followed by the widest persistent frame of that actor's own async methods (`codegen::async_frame_sizes`, threaded into `compute_runtime_tables` as a new parameter) — the growth this clause's item-C paragraph predicted, real at last. (3) **Free-turn areas** (`RuntimeTables::free_turns`): every non-actor-owned async fn — `@test(runtime)` roots foremost — gets its own turn area, so the root test turn parks/resumes through the identical machinery an actor turn uses (decision 3's own '+1 root' ready-queue slot made concrete); the report gains one additive `Turn fn=<key> frame=<bytes>` line per free turn (none in today's report-bearing corpus — no golden shows one yet). (4) **`last_result` is deleted** with the nested-drain placeholder that consumed it: a completing turn's reply is delivered to the *waker's* own reply slot (`rt_select_and_run`'s delivery tail), never to a per-actor side channel; `MAILBOX_BOOKKEEPING_SIZE` shrank to head/tail/count. (5) **The reserved RR cursor word is consumed for the first time**: `rt_run_one` (new, one per image) is 04 §2's deterministic round-robin tie-breaker over per-actor readiness, fully unrolled at build time. `place_actor_addrs` became `place_runtime_tables` (returning actor addrs + free-turn addrs + the cursor address). Report goldens moved once more, additively re-cited: `golden/appliance`/`golden/image-project`/`golden/image-helper-accept` (slot +8 for the waker, frame 8 -> 48 for the record, totals accordingly). Conformance moved with the mechanism: the `harness_jit` suite now proves waker-carrying admission, delivery-to-waker, busy-suspended non-reentrancy, the full fresh->park->deliver->resume->complete lifecycle against a hand-built async-contract stub, and `rt_run_one`'s cursor order; `wrela-vmm`'s HVF pair was updated to the new ABI and four new real-source HVF conformance boots were added (that clause's own note lists them).\n\n**plans/M6.md item F note-update (2026-07-24)**: the group arena record grew `owner_turn` (`codegen::OFF_GROUP_OWNER_TURN`), so `GROUP_SLOT_SIZE` is 88 -> 96 bytes and the child result slots moved to `+64`. No report golden moved: every one of them has `group_arena=0`, so their `rtdata` totals are untouched. `build_rt_select_and_run` also grew a `frame_area_size` parameter — a freshly selected turn now zeroes its own two lineage slots (02 §9.5: a message carries no group; an actor turn's lineage is its own), but only when the actor's turn area actually has frame slots past the 48-byte record, which an actor with no `async` method does not (`actors.codegen.state-machines`'s own note has the incident this guard came from).\n\nNOTE-UPDATE (2026-07-24, plans/M6.md item F/G follow-up — a found-and-fixed defect): this clause's own rule — the runtime tables are part of the image, tests or not — had only ever been true of the `rtdata` *reservation*. The code that addresses those tables was built by `layout_test_image` alone, so the ordinary `wrela build`/`wrela dump --stage=report` path could not resolve a compiled `await`/`send`'s own `codegen::rt_enqueue_symbol` call target and failed with `internal error: call target `__rt_enqueue_X` was never codegen'd` on any image that actually messaged an actor. Both halves of the rule are now honored by construction: `RuntimeWiring::derive` and `build_runtime_block` are the single shared derivation/assembler, `layout_program` takes the same `Option<BootCtx>` `layout_test_image` does, and the assembled routines ship in a new `rtcode` section (between `checkpoint` and `rtdata`) for the build path and inside the combined harness section for the test path. The one legitimate difference between the flavors is the entry driver. Full mechanism, the golden moves, the before/after evidence and the accompanying internal-error audit live in `image.layout.sections-verified`'s own note-update; recorded here because it is this clause's rule that was under-implemented.\n\n**plans/M7.md item Z1 note-update (2026-07-24) — the turn record grew a sixth word.** `reply_slot` (`codegen::OFF_TURN_REPLY_SLOT = 48`; `TURN_RECORD_SIZE` 48 -> 56): while a turn is parked on an actor `await` whose *declared* reply is an aggregate, this word holds the address of that turn's own reply staging slot (`codegen::Frame::reply_stage_off`, an area-interior offset past the record). The callee's dispatch arm loads it into `x8` — this machine's aggregate-return-pointer register — before `BL`ing the method, so the method writes its declared reply straight into the awaiting frame and nothing is copied at delivery. The record's own scalar `reply` word (+24) is untouched and still carries every scalar reply exactly as M6 left it.\n\n**The invariant, stated once (plans/M7.md decision 9a): written only by its own suspend path, read only by its callee's dispatch while it is parked.** It holds because a parked turn cannot begin a second await — the fn has genuinely `ret`urned to the scheduler at its one suspension point, and non-reentrancy (`busy`) admits no second activation — so between the store and the load there is exactly one writer and one reader. Nothing ever clears the word, and nothing needs to: an arm loads it only when its own method's declared reply is an aggregate, which is a build-time property of the CALLEE, and every caller that can reach such an arm is a turn awaiting exactly that method, so it stored the word immediately before `rt_enqueue` on the same activation. A scalar-reply arm never reads it at all, so whatever an older aggregate-reply await left behind is dead rather than dangerous; `rtdata` starts zeroed, so the boot state stays fully deterministic.\n\n**The staging slot is one per async fn, not one per await site** (decision 9b), sized to the widest declared reply over that fn's own `Await{ActorCall}` sites — a turn has at most one outstanding await, so one slot cannot be aliased. It is a `Frame` field, a sibling of `ret_ptr_off` (same register, same \"who owns the destination memory\" answer; the difference is that `ret_ptr_off` is where a fn spills the address its *caller* handed it, and this is the address it hands a *callee*). Its size is derived by inverting the composition sema already applied — `sema::bodies::decompose_call_error`, new, placed immediately under `compose_call_error` so the pair cannot drift: `Result[T, CallError[never]] -> T`, `Result[T, CallError[E]] -> Result[T, E]`. No new plumbing through FlowWir; the composed type is already in the frame. The identical predicate decides, per site, whether the wide transport is used at all, so the sizing pass, the suspend path and the resume stub can never disagree about one site.\n\n**Rejected alternative, recorded:** widening the mailbox slot to carry the pointer (a fifth `rt_enqueue` argument, a `slot_size` of 24 + args). It moves the same word through one more place and would have changed every mailbox-slot offset in the hand-assembled runtime for nothing — the pointer is a property of the *parked caller*, which the waker already names. `rt_enqueue`'s ABI (`x0=method_idx, x1=args_ptr, x2=nargs_words, x3=waker (the M7-era shape; superseded by plans/M10.md item D0, which removed the pointer, and item 0c1, which split the waker — see the M10 paragraphs below for the current ABI)`) and the mailbox slot layout (`[0]=method_idx, [8]=waker, [16..]=args`) are byte-for-byte unchanged by this item.\n\n**The regression oracle, run and reported (decision 9c).** The record grew, so every turn area, every `rtdata` size and every address downstream of one shifts; the honest claim is not \"no golden moved\" but \"no existing actor golden's emitted *instruction sequence* changed.\" Checked mechanically rather than by eye: `golden/asm-async-basic` (183 lines, 53 changed) and `golden/asm-async-loop-checkpoint` (241 lines, 68 changed) have identical line counts and are byte-identical after normalizing the encoding word and every numeric immediate, and every changed immediate moved by exactly +8 — the record's growth showing up in `X_FRAME`-relative frame-slot offsets. The five report goldens moved by exactly `+8 x (turn areas)`: `appliance` 448 -> 464 (two actors), `boot-actor-smoke` 456 -> 472 (one actor + one free turn), `boot-group-join` 1296 -> 1328 (one actor + three free turns), `image-helper-accept` 360 -> 368, `image-project` 368 -> 376 — each `Actor ... frame=48` became `frame=56` and each `Turn fn=... frame=N` became `N+8`. **No runtime transcript changed at all**: every `boot-*` `test.txt` is byte-identical, `boot-actors`/`boot-actor-chain`/`boot-send`/`boot-group-join`/`boot-cancel-cleanup`/`boot-deadline-*` included.\n\n**What is NOT claimed.** `build_rt_select_and_run` — the JIT/HVF-facing entry point `wrela-vmm`'s conformance pair and this file's own `harness_jit` suite call — still takes `(target, is_async)` pairs and passes `reply_is_aggregate = false` for every arm: every dispatch target it is ever handed is a hand-built scalar-reply stub, so the flag is false by construction rather than by convention, and the aggregate arm is exercised only through the real image path (`build_rt_select_and_run_symbolic`) and `golden/boot-actor-reply-struct`'s own boot. The new `brk 0xACD6` guard on a waker-less aggregate-reply dispatch is unreachable by construction — 02-language.md §9.4 makes `send`'s target unit-returning, enforced in `sema::bodies` — so it is an internal-error guard of the same class as the dispatch table's `brk 0xACD0`, not a diagnosable path, and no test enters it."


[[clause]]
id = "actors.codegen.state-machines"
doc = "04-compiler.md#2, 04-compiler.md#8"
status = "test"
tests = [
  "golden/asm-async-basic",
  "golden/asm-async-loop-checkpoint",
  "golden/boot-actor-smoke",
  "golden/boot-actor-chain",
  "golden/boot-group-join",
]
note = "plans/M6.md item D (2026-07-24): every async fn/method now compiles to a real machine-code state machine (`codegen::emit_flowwir_fn`, `crates/wrela-compiler/src/codegen.rs`'s own \"FlowWir -> machine code\" module doc has the full design), called through the identical ABI a sync fn/method already uses — self ptr in x0, up to 2 scalar args in x1/x2, a scalar result in x0, an ordinary `ret`. Three parts, all reusing the existing per-instruction emission (`emit_one`, never forked — the task's own explicit instruction): (1) a dispatch header — a dedicated frame slot (\"which state\", zero-initialized in the prologue) plus a compare-and-branch chain, one arm per state, in state order (the dumbest shape the plan names); (2) every state's own straight-line ops, flattened into one contiguous instruction stream (`codegen::flatten`/`remap_local_jumps`) so `emit_one` drives every embedded `flowwir::FlowInst::Mwir` op exactly as it would for an ordinary sync fn; (3) each state's own `Transition`, compiled as one more flat position immediately after its state's own ops — `Return` reuses `emit_one`'s own `Inst::Return` path verbatim, `Jump`/`Branch` compile to direct branches to the target state's flat position, and a `Transition::Jump` that is a loop back-edge (the exact shape an async `while`'s own state-cycle repeat takes, `flowwir_lower::lower_while_split`) gets decision 6's checkpoint sequence via the identical `target <= this` position test sync fns' own back-edges already use.\n\n**`Send`**: marshals `arg_temps` into a small owned scratch buffer and calls the target actor's own `rt_enqueue` routine — a symbolic call (`codegen::rt_enqueue_symbol`), resolved by `layout.rs` exactly like an ordinary `Reloc::Call`; `dst` gets a minimal tag-only `Result[unit,Rejected]` (real payload composition is item G's own send-proof job — no required M6-D case ever fills a mailbox).\n\n**`Await{ActorCall}`: genuine park-and-resume (rewritten 2026-07-24 — the M6 turn-suspension mandate). History, kept honestly: item D originally shipped a disclosed placeholder here (a nested, synchronous drain — `layout::build_await_actor_glue` enqueued the message, drained the target's own mailbox in the same native call, and read the reply back from a per-actor `last_result` slot); the orchestrator's review correctly named it an under-implementation of 04 §2 (only the awaited target could run, and the turn never actually left its native call stack), and it died in this rewrite — the glue routine, its `__await_actor_*` symbol, and `last_result` are deleted outright, no second mechanism remains.** The shipped design: (1) **Turn identity/waker** — every turn-capable entity (each declared actor; each free async fn, `@test(runtime)` roots foremost) owns one static **turn area** in `rtdata`: a fixed 48-byte turn record (`codegen::OFF_TURN_*`: busy/suspended/resume_ready/reply/waker/cur_method) followed by that entity's statically reserved frame slots. Turn identity IS the area address (static bijection at M6, one area per entity — an index would need a runtime index->address table nothing else requires; recorded as the deliberate call). Nested chains fall out for free: each turn has its own record, so root->A->B is just two independent waker links (root's area in A's message, A's area in B's). (2) **All-temps-in-frame does the heavy lifting** — an async fn's `Frame` is addressed through a dedicated base register (`x28`, `FnCtx::slot_base`), loaded at every entry from a baked-in constant patched by the new `Reloc::TurnFrameAddr{word,key}` (resolved to the owning actor's area for `Actor.method` keys, the fn's own free-turn area otherwise — `layout::turn_owner`, one shared rule for sizing and resolution); no `sub sp` exists at all, so suspension saves exactly one fact: the state index. (3) **The dispatch discriminant** — the fn's entry reads its own record's `suspended` word: zero -> fresh path (spill self/params into the persistent frame, state=0, jump to state 0); nonzero -> resume path (clear `suspended`+`resume_ready`, load the saved state index, compare-and-branch to that await's own resume stub). (4) **Suspend** compiles to: save `resume_state`; marshal args; `rt_enqueue_<Target>(method_idx, args_ptr, nargs, waker=x28)`; `cbz`/`BRK #0xACD3` on rejection (the same disclosed admission floor as before, item G's job); `suspended=1`; return `x0 = TURN_STATUS_SUSPENDED (1)` to the scheduler — a REAL return, which is the whole point. (5) **Resume stub** (its own flat position per await, the dispatch chain's target for `resume_state`): compose `Ok([x28+reply])` into `result_temp`, run decision 6's checkpoint (await resume points are checkpoints by construction), jump to the resumed state. (6) **Completion** (the shared async epilogue at the `Return` sentinel): `x1 = value`, mut-receiver writeback (completion is when actor state becomes observable again), `x0 = TURN_STATUS_COMPLETED (0)`, `ret`. (7) **`rt_select_and_run`'s final responsibilities** — readiness (`busy && suspended && resume_ready` -> resume; `!busy && count>0` -> fresh; else 0), fresh selection (FIFO pop; `head`/`count` advanced AT selection, 04 §2's 'admission occupies one slot until selection'; waker+method saved into the record; busy=1), dispatch (per-arm color knowledge: a sync method's return IS completion with the reply in x0 — sync pub methods run as complete turns; an async method's x0 is the status), and **delivery** (a completing turn's reply written to `[waker+reply]`, `[waker+resume_ready]=1`, waker 0 = a `send`, delivered nowhere; then busy=0). `rt_enqueue` is admission alone (bounded FIFO ring insert + the waker word; deliberately independent of `busy` — a second message to a busy-suspended actor QUEUES, decision 4's non-reentrancy lives wholly in selection). (8) **`rt_run_one`** (new): 04 §2's selection across the core at M6 defaults (all normal band, deadline=infinity -> every key equal), i.e. the deterministic round-robin cursor over per-actor readiness, fully unrolled; the entry driver's per-async-test scheduler loop drives it between the root turn's own suspend points — the root parks/resumes through the identical record machinery via its own free-turn area. (9) **Deadlock** — root suspended && !root.resume_ready && rt_run_one()==0 is a proof no progress is possible: the driver aborts through the ordinary `__wrela_abort` path with the named line `layout::DEADLOCK_MSG` ('runtime deadlock: no turn is ready and the root turn has not completed') on the failing test's own transcript line, image exits nonzero, deterministic (`compute_transcript_bound` accounts for the message explicitly). Deadlock is NOT constructible from source at M6's surface — `@image` wiring is the only handle distributor, its args evaluate in declaration order with no post-hoc rebinding (an acyclic handle graph; every await chain bottoms out), messages cannot carry handles, groups fail closed — so the diagnostic is pinned by `wrela-vmm`'s `deadlock_diagnostic_prints_the_named_line_and_exits_nonzero_over_hvf`: a REAL compiled image whose rtdata is patched pre-boot to a busy-suspended-forever turn record (the mandate's own hand-built-table-state fallback, disclosed as such). Conformance (real HVF boots of real compiled source, `wrela-vmm/src/lib.rs`): `park_and_resume_two_hop_await_chain_over_hvf` (root->Outer->Inner nested suspension), `park_and_resume_fifo_second_message_waits_for_the_suspended_turn_over_hvf` (two sends queue behind a busy-SUSPENDED turn; second starts only after the first completes — `actors.turns.non-reentrant`'s witness shape, proven now, golden pinned at item F), `park_and_resume_interleaves_a_third_actor_while_suspended_over_hvf` (a third actor's send-queued turn runs WHILE the chain is parked, its stamp landing between the chain's two — the exact property the nested drain faked), plus the JIT `harness_jit` lifecycle/round-robin suite and the updated hand-built HVF pair. `golden/boot-actor-chain` pins the chain transcript; `golden/boot-actor-smoke` unchanged byte-for-byte; `golden/asm-async-basic`/`asm-async-loop-checkpoint` moved once (reviewed: the whole state-machine shape — x28-based slots, entry discriminant, suspend/resume tails — replaced the sp-frame + glue-call shape). Disclosed floors kept/added: scalar replies only (an async fn returning an aggregate now fails closed by name); rejection-on-await still aborts (item G); free async fns that never run as turns still get areas (their relocs must resolve; bytes are facts in the report).\n\n**`Now`/`Duration`/`SelfPath`**: a trapping clock MMIO load (`wrela_machine::mmio::CLOCK_MMIO_ADDR`), an opaque `u64` tick-count passthrough (`ms(n)`'s own real unit conversion has no required golden to derive one from), and self-rooted field-chain re-derivation walking a new `mwir::LayoutCtx::struct_field_names` table (added this item — the one fact neither `LayoutCtx::structs` (types only) nor the typed tree, gone by codegen time, carries together) via the same `field_offset_size` helper `Project` already uses.\n\n**Group ops (`GroupCreate`/`GroupStart`/`GroupClose`, `AwaitKind::GroupJoin`) fail closed, named `item F`** — no group-arena runtime consumer exists anywhere yet (`actors.runtime.static-tables`'s own `group_arena_capacity` doc comment: sized, never consumed), and the task's own instruction is explicit: decide the dumbest honest line, do not half-implement cancellation. This is that line.\n\n**Supporting, disclosed additions**: `lower.rs::lower_program`/`lower_struct_members` now skip every `is_async` fn/method (previously, ANY async body choked `lower.rs` on its first `await`/`send`/`with group` construct — meaning a *mixed* sync+async program's sync half could not lower at all before this item); `mwir::size_of` gained sizing rules for the M6 builtin-pseudo-type vehicle (`Actor`/`Group`/`Instant`/`Duration`/`Admission`/`Peer`/`Rejected` as one opaque 8-byte slot regardless of any type argument, `CallError[E]` as one tag slot plus the widest of `size_of(E)`/one slot) — no earlier item's own required golden ever ran one of these types through codegen's frame builder, so this is the first exercise of (and fix for) a real, previously-latent gap.\n\nGoldens: `golden/asm-async-basic` (`flowwir-basic`'s own input, copied verbatim — an actor method awaiting another actor's sync method, matched over the composed `Result`) pins the dispatch header + await-glue call + checkpoint-on-resume shape; `golden/asm-async-loop-checkpoint` (`flowwir-loop-await`'s own input, copied verbatim — a free async fn awaiting inside a `while` loop) pins both the loop-back-edge checkpoint AND the await-resume checkpoint in the same fn. `bin/wrela.rs --stage=asm` now runs both `lower::lower_program` and `flowwir_lower::lower_program` over the checked program and merges them via the new `codegen::codegen_program_with_async`, so an async fn's compiled form dumps alongside its sync siblings. No existing golden moved from this item's own codegen changes (no pre-existing `asm.txt` covered an async input). `cargo xtask check` green; every fuzz lane re-run clean (2 fresh seeds each, this session).\n\n**Note-update (2026-07-24, closing the loop)**: the orchestrator review that first named the nested-drain gap, and the design it scoped, are resolved by the rewrite above — the placeholder existed from item D's landing until this same day, and every behavior it faked is now proven by real HVF execution instead (the conformance list above). The dispatch-header/checkpoint shape the two asm goldens pinned survived in spirit (the resume chain is the same compare-and-branch ladder) but the goldens moved once with the mechanism, reviewed line-by-line.\n\n**plans/M6.md item F (2026-07-24): the group ops' own first real boot (`golden/boot-group-join`) found two genuine codegen bugs, both invisible to every dump review and both recorded here rather than silently fixed.** (1) `emit_compose_group_join_result` loaded each child's own tag/payload into `X_A`/`X_B` while both call sites passed `X_B` as the group-arena base register \u2014 so child 0's payload load overwrote the base itself, and child 1 addressed the arena from `payload_of_child_0`. (2) The same fn wrote elements at a hardcoded 16-byte stride with the payload as a bare scalar; a composed element is `Result[T, CallError[E]]`, whose real size is `8 + max(size_of(T), size_of(CallError[E]))` \u2014 `8 + max(8, 16) = 24` here \u2014 so element 1 landed 8 bytes short and its tag read back as the previous element's payload (`40`), aborting on `match: no arm matched`. The stride is now derived from the array temp's own `size_of`, the tag/payload split follows `enum_payload_offset`'s own one fixed rule (tag at `+0`, payload area at `+8`), the `Err` arm composes a real `CallError::Cancelled` (`codegen::CALL_ERROR_TAG_CANCELLED`, 02-language.md \u00a79.4's declared variant order) instead of a raw scalar, the padding beyond the payload word is zeroed for determinism, and the base register's disjointness from the two value registers is now *checked* (an internal-error diagnostic) rather than trusted.\n\n**The debugging oracle this cost, made permanent** (`wrela-vmm::el1_exception_note`, tested by `an_el1_fault_into_the_absent_vector_table_names_the_original_esr_over_hvf`): bug (1) surfaced as `guest fault: unhandled exception (esr=0x82000006, ipa=0x200, pc=0x200)`, which describes only the *second* fault. 06-machine.md \u00a74 gives this machine no vector table at all, so an EL1 synchronous exception the guest takes itself \u2014 here an unaligned 64-bit access, the MMU being off and every access therefore Device-nGnRnE and alignment-checked \u2014 vectors to `VBAR_EL1 + 0x200` with `VBAR_EL1` never installed, and it is the *resulting* instruction abort on that unmapped page that reaches the VMM. The original fault's own state is still intact in `ESR_EL1`/`ELR_EL1`/`FAR_EL1` (nothing at the vector address ran), so the VMM now reports all three, plus the slot, whenever `pc` lands on a `VBAR_EL1` vector slot. `hv.rs` grew exactly one new FFI call for it, `hv_vcpu_get_sys_reg` (read-only, diagnostics only), plus the four sys-reg ids it reads.\n\n**plans/M6.md item F, the cancellation half (2026-07-24)**: three more real bugs, all in already-landed item-F code, none reachable by dump review, all found by the first goldens that actually armed a deadline. (1) `emit_group_create`'s deadline narrowing used `Cond::Le` — a **signed** compare — against a `u64::MAX` \"no deadline\" sentinel, which as a signed value is `-1`; so `min(none, own)` picked the sentinel and the remap turned it straight back into `0`, meaning every top-level `with group(deadline=..)` stored \"no deadline\" and could never expire. Now `Cond::Ls`. (2) `emit_checkpoint_cancellation_test` branched to `word_offsets.len() - 2`, which is the shared *completion* epilogue, not `len() - 1`, the cancellation tail — so a cancelled child returned `TURN_STATUS_COMPLETED` with a garbage reply and its group's child slot harvested as `Ok`, exactly as if it had finished. (3) `rt_select_and_run`'s new lineage zeroing, added unguarded, stored two words past a turn area that an actor with no `async` method sizes at exactly `TURN_RECORD_SIZE` — scribbling on whatever `place_runtime_tables` put next; three regions later the group arena's own `in_use` words came back set and `GroupCreate` reported \"arena capacity exceeded\". Now guarded on the area actually having those slots.\n\nShipped alongside them, all in `codegen.rs`: the group record's `OFF_GROUP_OWNER_TURN` (whose whole reasoning lives in `actors.groups.cancellation-order`), `emit_group_cancelled_flags` (the one shared \"is my ambient group cancelled / do I own it\" read, branch-free at every use site), admission-closing in `emit_group_start`, `Err(CallError::Cancelled)` composition at an `ActorCall` await-resume, and the real millisecond scaling of `FlowInst::Duration`. Every one of these emits *zero* words when the whole build's group arena capacity is `0`, which is what keeps every pre-item-F async golden byte-identical — verified, not assumed: `cargo xtask check` moved no existing expectation."



