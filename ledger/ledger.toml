id = "compiler.eval.matches-backend"
doc = "04-compiler.md#6"
status = "test"
tests = ["xtask:diff-eval", "golden/boot-hello", "golden/check-tests-arith", "golden/check-tests-program"]
note = "plans/M5.md item F, decision 9: FLIPPED from `gap` to `test` — `cargo xtask diff-eval` (`crates/xtask/src/main.rs`) is the batch oracle: for every golden case whose input typechecks and declares at least one bare `@test` (`TestKind::Comptime` — decision 2's own \"the comptime tier's own set\"; `@test(exhaustive)` is deliberately excluded from the comparison itself and counted in its own `exhaustive-skips` category instead, per the plan's own decision-2 sub-note), it compiles those same test fns into one runtime-test image (`layout::layout_test_image`, item E's own harness, reused verbatim — a bare `@test` fn is exactly the zero-arg shape that harness already runs), boots it once via the codesigned `wrela-vmm` binary, and compares each guest-printed report line against `eval::run_tests`'s own line for the same fn, byte for byte. Output: `diff-eval: <N> test(s) agree across <C> case(s), <S1> lowering-skips, <S2> exhaustive-skips, <S3> quota-skips` (every skip counted AND printed as it happens, never silent — the plan's own instruction). Full-corpus run this session: `16 test(s) agree across 3 case(s), 1 lowering-skips, 6 exhaustive-skips, 1 quota-skips` — zero disagreements found (the two implementations of the evaluator's own executable subset genuinely agree on every comptime-legal test that can be compared). The `1 lowering-skips` is `check-const-generic-struct`'s own already-disclosed item-B gap (\"lowering a struct-valued module `const` is not implemented yet\" — one of decision 2's sub-note's own named \"exotic const shapes\"), not a new finding. The `6 exhaustive-skips` are `check-tests-exhaustive`/`check-tests-exhaustive-counterexample`'s six `@test(exhaustive)` fns, per decision 2's own sub-note.\n\nA genuine, plan-unanticipated finding made while building this oracle, disclosed rather than silently worked around: `check-tests-mixed`'s `test_quota_exceeded` (a bare `while true: total = total + 1`) is comptime-legal and fails the evaluator with `eval::quota::MAX_STEPS`' own \"step quota exceeded\" — but the step/memory quota is a *comptime-tier-only* resource bound with no backend equivalent whatsoever (the naive A76 codegen has no step counter), so this fn lowers and codegens perfectly cleanly, then would spin forever on real hardware rather than ever disagree meaningfully. `diff_eval_over_cases` detects this from `eval::run_tests`'s own report line (the fixed substring `\"quota exceeded\"`) *before* ever building an image, excludes the fn from the image entirely, and counts it in a third, plan-unanticipated `quota-skips` category (`DiffEvalTally::quota_skips`, its own doc comment names this reasoning in full) rather than either attempting to boot it (a 30-second `WALL_CAP` timeout on every run, and a category error even if it completed) or silently folding it into `lowering-skips` (a materially different, dishonest reason: lowering does not fail here at all). Recorded here since the plan's own decision 9/2 text named only two skip categories; a third was a genuine, load-bearing discovery, not an invented one.\n\nSmoke subset wired into `check` (`diff_eval_smoke`, `DIFF_EVAL_SMOKE_CASES`): `boot-hello` (proves the whole build+sign+boot chain still works end to end on every `check` run, even though it contributes zero comptime tests of its own — decision 1's own runtime-only scope), `check-tests-arith`, `check-tests-program` (15 comptime tests between them: checked/wrapping arithmetic at every named boundary, structs, enums, `match`, loops, a generic fn) — the plan's own item-F text names these three cases by name. Smoke result this session: `14 test(s) agree across 2 case(s), 0 lowering-skips, 0 exhaustive-skips, 0 quota-skips`, `cargo xtask check` green with this step wired in immediately after `report-determinism`."

