[[clause]]
id = "comptime.eval.no-panics"
doc = "04-compiler.md#8"
status = "test"
tests = ["xtask:fuzz", "xtask:bench", "golden/check-const-generic-struct"]
note = "`cargo xtask fuzz eval` (plans/M3.md item F, `crates/xtask/src/main.rs`'s \"fuzz: eval\" section): a fourth fuzz lane, same corpus-mutation + token-soup strategies and the same seed inputs (`corpus_seed_inputs`, `mutate_seed_input`, `token_soup`) `fuzz sema` already uses — the seed set's every `tests/golden/*/input.wr` includes the real `@test`-bearing `check-tests-*` goldens, so mutating them exercises the evaluator on inputs that actually run, not only ones the lexer/parser/sema alone would generate. Pipeline: lex, then (on success) parse a whole module, then `sema::check_typed` (which already runs `eval::check_comptime` — every module-level `const` initializer and `comptime assert` — as its own final step per `sema::mod::check_typed`'s own doc comment, so \"sema accepts\" already implies const/assert evaluation ran clean), then, on a successful typecheck, `eval::run_tests` over every comptime-legal `@test` fn, each under its own existing small fixed quota (`eval::quota::Quota::new()`, `MAX_STEPS = 20_000` — comptime.eval.quotas's own note already explains why this is deliberately kept small; reused as-is rather than growing a second, fuzz-only quota constant, since CLAUDE.md rules out a knob nothing else needs). Four invariants, checked every iteration (`check_eval_invariants`): (a) never panics — the whole pipeline runs under `catch_unwind`, mirroring every other lane's own panic-detection story (this harness runs in-process, so a real Rust panic is caught here rather than crashing the fuzz loop; `with_silenced_panic_hook` suppresses the default backtrace noise the same way `fuzz_lexer`/`fuzz_parser`/`fuzz_sema` already do); (b) deterministic — the whole pipeline runs twice and the two outcomes are byte-compared (lex/parse/sema-check errors compared field-by-field exactly like `fuzz sema`'s own `check_sema_invariants`; a successful typecheck's `run_tests` report text compared byte-for-byte); (c) always terminates within quota — not a runtime check (no wall clock anywhere, by doctrine) but a structural guarantee: every evaluator loop iteration and call ticks `Quota::tick_step` (comptime.eval.quotas), so a diverging comptime program always *returns* (`Ok` or an `EvalError`) once its step budget is spent rather than looping forever — invariants (a)+(b) are what actually observe this on every iteration, since the alternative (an escaped infinite loop) would simply stall the fuzz loop itself rather than report anything; (d) abandonment is always a well-formed diagnostic, never an internal panic message leaking through — a `sema::check_typed` `Err`'s `category` must be one of the fixed `SEMA_CATEGORIES` set (identical check to, and reusing, `fuzz sema`'s own; `comptime` is already in that set per comptime.eval.abandonment-is-build-error), and a successful typecheck's `run_tests` report must match its one pinned shape (comptime.tests.build-tier) line for line — `report_is_well_formed`/`test_line_well_formed`/`summary_line_well_formed` check every line is `test <name>: ok`, `test <name>: FAILED <message>`, or the final `<N> passed, <M> failed` summary, never anything else. A find writes the input to `target/fuzz/eval-crash-<n>.wr` (`report_fuzz_failure`, the same numbering convention every other lane uses) and reports the seed + iteration; every find is minimized by hand into a `tests/golden/eval-fuzz-*` case before its fix lands (plans/M3.md item F's own rule) — none found by the fuzz lanes this session. M3-G's hand-adversarial sweep (plans/M3.md item G) found the one real crash of the milestone, outside the fuzzer's mutation reach: a `const` whose initializer constructs a *generic struct* (`const A: Array[10] = Array[10](dummy=7)`) overflowed the compiler's own native stack — `sema::generics::build_consts_program` re-type-checked every const initializer while resolving the const argument of exactly such an initializer, re-entering const-argument resolution (`eval_const_expr`) with no base case. Fixed at the producer (`sema::generics::contains_generic_brackets`): the throwaway consts-only program omits any const whose raw initializer contains a generic bracket anywhere — outside 02-language.md §6.3's const-argument value vocabulary to begin with, and fail-closed (an omitted const referenced from a const-arg expression gets the evaluator's own \"unknown const\" diagnostic) rather than lossy, while the const itself still checks and evaluates normally in the real pipeline, which owns the instantiations. Pinned: golden/check-const-generic-struct (the exact crash shape, now accepted, its `@test` proving the evaluated field value survives). Smoke budget wired into `cargo xtask check` (`fuzz_eval_smoke`, alongside the lexer/parser/sema smokes): 2 fixed seeds (1, 2), 1_000 iterations apiece, matching every other lane's own smoke shape exactly. Deep default `FUZZ_EVAL_DEEP_ITERS = 2_000_000` (`fuzz_eval`'s own measurement comment: ~59us/iteration on the authoring machine, essentially identical to `fuzz sema`'s own ~61us — `check_typed` already pays for everything `sema::check` does, and `run_tests` only adds real cost on the rare mutation that both fully typechecks and still carries a `@test` fn, tightly bounded by the quota) — chosen to match `fuzz sema`'s own deep default exactly rather than picking a new number, landing in the identical \"roughly a minute or two\" band. Verification this session: `cargo xtask fuzz eval` (2_000_000 iterations) clean at three seeds (1, 2, 3, ~117-121s apiece); `cargo xtask fuzz sema --iters 500000` clean (seed=1, re-run per this item's own instructions); `cargo xtask check` green with the new smoke wired in. `xtask:bench` (compiler.bench.compiler-lane-locked's own new eval lane) is cited alongside `xtask:fuzz` here since the two together are what actually exercise \"never panics\"/determinism *and* a real measured-performance lock on the identical evaluator code path — a fuzz lane alone would prove correctness but say nothing about whether that correctness stays cheap.\n\nplans/M4.md item E extension (2026-07-23): `run_eval_pipeline_once`'s successful outcome now also runs the image pipeline (`run_image_pipeline_once`, `crates/xtask/src/main.rs`) whenever the just-typechecked single module declares exactly one reachable `@image` fn — `eval::interp::eval_image` -> `eval::image_checks::check_sealed` -> `report::render`, the identical sequence `wrela build`/`wrela dump --stage=report` run, under the same `Quota::new()` every other comptime entry point already builds internally, and under the same `catch_unwind`/run-twice coverage this lane's outer loop already provides (no second mechanism — this is one more step inside the same pipeline fn). Two new invariants, both checked only when the module has an `@image` fn (`None` otherwise, the overwhelmingly common case, so this stays a rare-cost addition exactly like `run_tests` itself already was): the image outcome text must be well-formed (`image_outcome_is_well_formed` — either the versioned report header `\"ImageReport v0\"` or a one-line diagnostic whose category is in the same fixed `SEMA_CATEGORIES` set every `SemaErr` outcome is already checked against), and the two runs' image outcome text must agree byte-for-byte (folded into the existing `Ok`/`Ok` determinism arm, which now destructures both the test report and the image outcome). Seed corpus grown accordingly: `corpus_seed_inputs` gained `project_seed_inputs` (plans/M4.md item E), feeding every `src/*.wr` file (recursively) from four project-shaped golden cases — `appliance`/`image-project` for the builder-intrinsic/`@image` shapes, `multi-module-accept`/`import-cycle-accept` for the loader's own import machinery — each fuzzed as its own standalone single-file seed, never assembled into a whole closure (a real `from ... import ...` in one of these simply fails closed at `check_typed`, honest and already covered, not a bug this lane works around); the single-file `image-basic`/`image-helper-accept` golden inputs were already walked by the pre-existing `tests/golden/*/input.wr` scan, confirmed present, not re-added. Seed count: 168 before this addition, 179 after (11 new project module files). Verified this session: `cargo xtask fuzz eval --iters 2000000` clean at three seeds (1, 2, 3); `cargo xtask check` green with the extended smoke (`fuzz_eval_smoke`, unchanged shape/budget) still wired in.\n\nPost-M4 fuzz find (2026-07-24), sibling to syntax.parser.no-panics' own same-session finding: once that clause's new expression-nesting guard let `cargo xtask fuzz sema --seed 11`'s deep run get past the parser overflow, it still aborted natively further in (`thread 'main' has overflowed its stack`), mutating golden/check-const-eval's own recursive `factorial` (`factorial(n - 1)` mutated to `factorial(n ^ 1)`, which never reaches the `n == 0` base case). Root cause: `eval::quota::MAX_CALL_DEPTH = 1_000`'s own doc comment claims it is \"chosen to stay well inside this process's own native stack\" — false in fact. Verified by hand, independent of any fuzz mutation: a *legitimate*, correctly-terminating recursive `const` initializer (`sum(n-1)` with a real `n == 0` base case) already overflowed the native stack around n=95-100 on the authoring machine's default thread stack — nowhere near the 1_000-call budget `Interp::enter`'s own depth check is supposed to reject at, so the guard's diagnostic never got a chance to fire before the process aborted. `MAX_CALL_DEPTH` itself was deliberately left untouched rather than lowered to match reality: three existing goldens (`appliance`, `image-project`, `image-helper-accept`) pin its exact value verbatim in a rendered report line (`Quota max_call_depth=1000`), and this is a native-stack-safety bug, not evidence the language's own call-depth budget was ever too generous. Fixed instead by giving every top-level comptime evaluation (`eval::interp::eval_top`/`eval_test`/`eval_test_case`/`eval_image` — the four entry points `Interp`/`Quota` are freshly built at) a dedicated, generously sized native stack to run on: a new `run_on_guarded_stack` helper (`eval/interp.rs`) runs its closure via `std::thread::scope` + `Builder::spawn_scoped` (the one stable API combining a custom `stack_size` with borrowing non-`'static` data, needed since every entry point borrows `&TypedProgram`/`&TypedExpr` from its caller) on a 256 MiB stack — comfortably above the roughly 80-90 MiB the empirically-observed ~840KB/100-levels cost projects for the full 1_000-call budget, with a wide margin left over. A panic inside the spawned closure (there should never be one — every real failure is an `Err`, never a panic) is re-raised on the calling thread via `resume_unwind` rather than swallowed, so the fuzz harness's own `catch_unwind`-wrapped invariants still observe it exactly as if the closure had run inline; `MAX_CALL_DEPTH`'s own value, diagnostic text, and every golden that pins it are unchanged. No new golden needed for this half specifically (the guard's own `error[comptime]: recursion depth exceeded 1000 while evaluating ...` diagnostic is unchanged and already reachable, now safely, from a genuinely divergent recursive `const`; the ~1000-line `while evaluating` chain a full-depth trigger produces is not a practical golden shape, unlike syntax.parser.no-panics' own much shallower `MAX_EXPR_DEPTH = 100` case). Verified clean at the full 2_000_000-iteration deep default after both this and the parser fix: `fuzz sema --seed 11`, `fuzz eval --seed 11`, `fuzz eval --seed 12`, `fuzz eval --seed 13` (the seed originally reported for this finding, itself already clean on this checkout by the time both fixes landed — plausibly because corpus growth between milestones shifted that seed's own mutation stream past whatever iteration first triggered it; `fuzz sema --seed 11`'s own deep run remains the live, reproducible repro this fix is verified against directly)."

