note = "FLIPPED from `gap` to `test` (plans/M9.md item H, 2026-07-25). 02-language.md §12/§12.1's `@layout_assert` (\"Post-layout build assertion over ImageReport\") now runs end to end: `stdlib/core/image_report.wr` defines a real `ImageReport` struct (fixed section bases/sizes + `machine_revision` — decision 220; name-keyed helpers wait on `String[..N]`); `img.check_layout(f)` still registers; after layout, `eval::layout_assert::run` synthesizes one `Value::Struct` from the real `ImageLayout` and evaluates each registered fn under a fresh comptime quota. Failure is `error[build]: \\`@layout_assert\\` fn \\`<name>\\` failed: ...` naming the fn (golden/err-layout-assert-fails). Success leaves the report text and emitted image bytes untouched (golden/check-layout-assert-passes pins report + `img.hex`). `report::render`'s decision-10 report-boundary refusal is retired — a registered assert no longer blocks the report; `golden/image-basic/expected/report.txt` moved from that refusal diagnostic to a successful full report (the vacuous `check_limits` registration was removed so the basic fixture stays import-free; the clause's own pins are the two new goldens). Never a partial/fake `ImageReport`: synthesis requires a laid-out image with a `code` section and a stdlib struct whose fields match the fixed set.\n\n**Note-update (plans/M9.md item H2 commit 1, 2026-07-25):** `@layout_assert` bodies were being lowered/codegen'd into the guest image, so a code-budget assertion true of the real program failed only because declaring it inflated `code` (measured 128 → 656 on a one-actor Store). Decision 240: `TypedFn::is_layout_assert` + `lower::lower_program` skips them (host-only, same gate as `@image`/`async`). Decision 241: `golden/check-layout-assert-budget` asserts `code_size < 200` on that shape — fails before the skip, passes after with `code` still 128. Item H's own goldens were blind to the inflation (monotone facts / impossible budget).\n\n**Note-update (plans/M9.md item H2 commit 2, 2026-07-25):** comptime-legal bare `@test` (`TestKind::Comptime`) likewise skipped at lower (decision 242 / 02 §12.2). `@test(runtime)` and `@test(exhaustive)` still emit. `diff-eval` opts back in via `lower::LowerOpts { emit_comptime_tests: true }` so the evaluator-vs-backend oracle still boots those bodies. Moved goldens are `asm.txt`/`mwir.txt` dumps that listed the host-only test fns (pure deletions); no `boot-*` transcript moved.\n\n**Note-update (plans/M9.md item H3, 2026-07-25):** call-graph reachability (decisions 280–285). H2's disclosed leak — helpers only reachable from host-only fns, and every imported fn whether called or not — still entered MWIR because lower walked every declaration. Fix: dumb fixed-point from guest entry points (actor/driver `init`, `pub` message methods, `@task`, all `@driver` methods for ISR conservatism, runtime/exhaustive tests); host-only never seeds; whole-closure set for `try_layout_program`. `golden/check-layout-assert-budget-helper` — assert calls `under_budget`; before, code 188 and cap-150 failed; after, code 128 and passes. `golden/check-import-reachable-only` — imports `used`/`never_called_a`/`never_called_b`, calls only `used`; asm pins the uncalled names absent. `boot-*` transcripts must stay byte-identical."

