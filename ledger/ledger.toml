]
note = """02-language.md §7.4 desugars `Err(e)?` needing conversion to `TargetError.from(take e)`; §7.5 / 05-library.md §8 say `deriving(From)` requires exactly one variant/field and generates that `from`. plans/M9.md item B (decisions 105–108) closed the conversion path; item B3 (decisions 137–146) makes the generated `from` a real TypedFn and deletes the structural wrap.

**Half A — spelling.** `from` remains a reserved word for `from path import Name` (§2). After `fn` it is accepted as an associated-fn name (`parser::expect_fn_name`). Pinned by `check-from-explicit` (`fn from(take source: LoadError) -> WrapError` with body `code = n + 100`, image arg `converted=107`).

**Half B — deriving generates a real `from` (B3; supersedes decision 106).** `declare_struct`/`declare_enum` inject a DeclFn `from(take source: Source) -> Self`; `build_module_ctx` appends the matching FnItem whose body is ordinary construction (`Self(field=source)` / `Self.Variant(source)`). Body-checking yields a TypedFn in `assoc_fns`. `?`'s Err path Calls that key in eval, lower, and flowwir_lower — the same one `Type.from(take e)` reaches. The structural wrap (`Value::Struct([e])` / `MakeAggregate` / `MakeEnum tag=0` on a resolve miss) is gone.

**Conflict (decision 137).** A type may not both `deriving(From)` and declare its own `from` — 02 §7.5's closed list is not a merge. Pinned by `err-deriving-from-conflict`.

**Single-field/variant restriction.** `err-deriving-from-two-fields` / `err-deriving-from-two-variants`.

**Pinned by value.** `check-deriving-from`: `CONVERTED=1000`, `OK=7`, `DIRECT=2505` (generated enum `from` called directly). `check-deriving-from-struct`: same offsets for the struct shape. `check-import-deriving-from`: `DIRECT=404`. `check-import-alias-deriving-from`: `DIRECT=504`, asm pins `bl <Box.from>`. Guest `@test(runtime)` paths (plans/M9.md item KK) restore mwir/asm pins for `WrapError.from` / `Box.from` after H3 dropped comptime-only callees.

**Retired.** `err-try-from-underived` (BB decision 61). Decision 106's structural wrap (B3)."""

