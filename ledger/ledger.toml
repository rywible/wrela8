note = "plans/M5.md item B, decisions 2/3: typed tree -> `mwir::MwirProgram` (`crates/wrela-compiler/src/mwir.rs` + `lower.rs`, new), a flat, linear, explicitly-ordered instruction list per fn/method/`init`/generic instantiation — plain enum, no basic-block graph — dumped stably via `wrela dump --stage=mwir` (`bin/wrela.rs`'s new stage arm, structurally parallel to `--stage=typed`: lex/parse/`check_typed`, then `lower::lower_program`, then `mwir::dump`; a lowering rejection prints the exact same one-line `error[unimplemented]: ...` house style every other fail-closed stage already uses — `lower::LowerError` carries no location, matching the typed tree's own \"no spans\" decision). `mwir.rs`'s own module doc carries the full instruction set (`ConstInt`/`ConstBool`/`ConstFloat`/`ConstChar`/`ConstUnit`/`ConstText`, `Copy`, `MakeAggregate`/`Project`/`SetField` for struct/tuple/array-by-value construction and static-offset access, `IndexGet`/`IndexSet` for dynamic bounds-checked array indexing, `MakeEnum`/`EnumTag`/`EnumPayload`, the 02-language.md §6.1 arithmetic family in checked (`ArithChecked`), wrapping-*and*-float (`ArithWrapping`, doubling as ordinary never-abandoning float `+ - * / %`), div/rem (`DivRem`), shift (`Shift`), bitwise (`Bitwise`), and conversion (`Convert`, `.to[T]()`) forms, `Compare`, `Not`/`BoolAnd`, `Jump`/`JumpIfFalse`, `Call`/`Return`, `AssertFail`) and the aggregate layout rule (`mwir::size_of`: every scalar is one fixed 8-byte slot, `[T; N]` is `size_of(T) * N`, a tuple/struct is the sum of its components' sizes in order, an enum is one 8-byte tag slot plus the *widest* variant's own payload size — \"tag + max-payload union\", the plan's own words — `LayoutCtx`/`build_layout_ctx` recompute the one whole-program struct/enum field-type fact the typed tree itself does not keep, the same dumb \"recompute, don't thread state\" pattern `sema::dump`/`sema::check` already use for `specialize`/`declare`). Every checked-arithmetic/negation/conversion abort message that never embeds a runtime value is precomputed once at lowering time and locked byte-identical against `eval::value`'s own wording by six dedicated unit tests (`mwir::abort_message_tests`, task note 6 — `abort_message`/`neg_abort_message`/`div_zero_message`/`shift_lost_message`/`convert_abort_message`, each asserted equal to the real `eval::value::eval_ordinary`/`eval_neg`/`eval_div_rem`/`eval_shift`/`eval_to_scalar` failure at the identical input); the two cases whose own wording embeds a *runtime* value (a shift's own out-of-range count, an index's own out-of-bounds value) carry only their compile-time half (`bits`/`len`) for codegen (item C) to interpolate. `lower::builder_tests::patch_jump_resolves_a_forward_jump_to_the_patched_index` is the task's own \"label resolution\" unit test — every structured construct (`if`/`while`/`for`/`match`/short-circuit `and`/`or`) backpatches a placeholder jump exactly this way, one assembler, no two-pass resolution step. `layout_tests`/`abort_message_tests` (`mwir.rs`) plus `builder_tests`/`integration_tests` (`lower.rs`) — 23 unit/integration tests total, all green.\n\nFail-closed set (decision 2, `lower.rs`'s own module doc carries the full reasoning for each): closures and any indirect call (`CallValue`, a bare `FnRef` used as a value) — the evaluator's own closure support is real but narrow (`Value::Closure`, direct-application-only per its own doc comment), and mapping it here would need a first-class captured-environment value plus an indirect-call instruction neither decision 3's instruction list nor decision 4's calling convention accounts for, so this is an honest fail-closed rather than an invented ABI (`closures_fail_closed`, `lower.rs`); the `?` operator (its own early exit needs to thread defer/loop context through expression lowering, which this pass keeps strictly statement-level); a non-literal `assert`/`panic` message (the evaluator falls back to Rust's own `{:?}` `Debug` formatting for a non-`Str` message value — reproducing arbitrary `Debug` output in machine code is not a real lowering); an `|` (or) pattern (every other pattern shape's sub-tests are safe to compute unconditionally thanks to the enum \"tag + max-payload union\" layout — reading a non-live variant's payload is always in-bounds, never a fault — but an `|` pattern is the one shape where that trick breaks correctness for its own *bindings*, since two alternatives can bind the same name to two structurally different values and only the one that actually matched may survive; doing this right needs real per-alternative branching); assigning through, or calling a `mut self` method through, a nested field/index chain (`self.inner.field = ...`) — only a chain rooted directly at a bare local is implemented; indexing a `Bytes` value, and an array/`Bytes` length that is not a literal; a struct/enum/fn/closure/`@image`-decl-valued module `const` (a *scalar*, or `Str`/`Bytes`/array-or-tuple-of-scalars, const folds to a literal at its use site exactly, since a const's value is always comptime-fixed by the time `check_typed` succeeds — an aggregate-valued one would need the same struct/enum field-type table `size_of` needs, deliberately not threaded through this pass); `Intrinsic`/`PoolName` (the `@image` builder surface, reachable only from the one `@image` fn this pass already skips outright per decision 2 — \"an `@image` fn is never lowered, it already ran at comptime\" — present only as a defensive, should-be-unreachable guard). Async/await/send/with/actor-turn/pool-and-group-runtime/f-string-shaped constructs are **not** in this list because they cannot reach this pass at all: `sema::bodies::check_expr`'s own `Await`/`Send` arms, `Stmt::With`'s own arm, and f-strings never producing a typed `Str` node already reject every one of them at `check_typed` time — there is no typed-tree node shape left for them to arrive here as.\n\nThe err-golden question, answered honestly rather than faked (the task's own explicit instruction): the originally-suggested f-string construct fails at `check_typed` itself and never reaches this pass, so `golden/err-mwir-dynamic-panic` picks the one construct this session actually found that *passes* `check_typed` but this pass cannot lower — `panic(msg)`'s own message only has to type as `Static[Str]` (`sema::bodies`'s own `\"panic\"` call-by-name arm), unlike `assert`'s (`sema::bodies::check_assert` requires a text *literal*, so a non-literal `assert` message can never reach this pass in the first place — verified directly: an early attempt to build this golden with `assert x > 0, label()` was rejected at `check_typed` with `error[type]: assert message must be a text literal`, confirmed dead-end, not asserted from the doc alone). Every other enumerated fail-closed construct above is checkable (accepted by `sema::check_typed`) and genuinely unlowerable by this pass today; none of them is invented or unreachable in the other direction (every one has, or trivially could have, its own `check_typed`-accepted source triggering it — `lower.rs`'s own `integration_tests` module exercises `closures_fail_closed`/`a_non_literal_panic_message_fails_closed` directly). Closures — the one construct with real (if narrow) evaluator support — fell out fail-closed rather than lowered, for the reason above; recorded per the task's own \"lowered or fail-closed, and why\" instruction.\n\nGolden family (mirrors the check-tests-*/check-x-* program shapes, plans/M5.md item B's own required list): `golden/mwir-arith` (checked + wrapping arithmetic mix across widths), `golden/mwir-struct` (`init` plus `mut self`/`read self` methods), `golden/mwir-enum-match` (a payload-carrying-and-bare-variant enum, exhaustively matched), `golden/mwir-loop` (a `while` accumulator plus a `for`-over-fixed-array loop), `golden/mwir-calls` (nested plain-fn calls), `golden/mwir-generic` (a generic fn instantiated at a concrete scalar type, keyed `fn:identity[u64]`), `golden/mwir-take` (a scalar take, a struct take, and `for take x in take arr`). `cargo xtask golden` confirms all eight new expectations plus every pre-existing case unmoved (194 expectations total, 0 moved beyond the 8 additions this note lists)."


