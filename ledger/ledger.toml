note = "**History (plans/M15.md item C, 2026-07-27):** placement domain is the image's sealed N (`ImageGraph.cores` / `PlacementTable.cores == N` always). The M8-B binary floor (`{0}` vs `VCPUS`) is deleted; `core=` range is `0..N` (diagnostic names `0..N` and `Image cores=N`). Oracles: `golden/check-placement-cores-2` (cores=2, pin core=1, only `CoreEntry core=1` — not forced to 3), `golden/err-placement-core-ge-n`, `golden/err-placement-cores1-pin1`, retargeted `golden/err-placement-core-range`. Pre-existing `check-placement-cross` / cross-core boots that pin `core≥1` without `cores=` are deferred to item L (default N=1 now refuses those pins).\n\nplans/M8.md item B (2026-07-25) **opens** this clause with dump/report oracles; it does **not** flip. Flip conditions (both required, recorded so item C cannot claim the flip on a thinner surface): (1) item B's placement table is load-bearing in the image report — every `@actor`/`@driver` has a `Placement` line naming `core`/`source`/`work`/`bytes` with causality (04 §3 / §7), proved by `golden/check-placement`, `golden/check-placement-cross`, `golden/check-placement-pinned-blk`, and the err pins `golden/err-placement-core-range` / `golden/err-placement-virtio-blk-core`; (2) item C's multicore boot transcript exercises a cross-core send and a recorded `ChoiceEntry::Admission` against that sealed placement. Until (2) lands the clause stays `gap` — a report that names cores is not yet the ROADMAP sentence \"placement inference ... flips\".\n\n**What item B shipped** (mechanism: `crates/wrela-compiler/src/placement.rs`, called from `bin/wrela.rs::build_report` / xtask's report determinism path after `enrich_layout_ctx_with_instantiations`; annotation checks also run inside `eval::image_checks::check_sealed` so `--stage=image` rejects bad `core=`): every driver/actor gets exactly one core in `0..VCPUS`. Explicit `core=N` is fixed first; a VirtioBlock-bound driver is pinned to core 0 (`source=pinned-virtio-blk`, refuses `core≠0`); unfixed placeables are sorted by descending `(work, bytes)` then ascending `ImageDeclRef` identity and assigned to the core whose resulting `(work, bytes)` load is lexicographically smallest. `work` is `0` with `work_source=unproved` until the cost model (M11 / honest-scope OUT) proves maximum uninterrupted turn work — equal work, never an invented ranking. `bytes` = state + mailbox physical bytes + DMA-pool bytes attributed via `device=` to the bound driver. **Single-core floor:** when no declaration carries `core=` ≥ 1, the live domain is `{0}` so existing M6/M7 boots keep working (secondary vCPUs are not started until item C). A graph with any `core=` ≥ 1 opens the full three-core packing domain for the unfixed rest (report oracle only at B).\n\n**Item C1 (2026-07-25) — still `gap`, deliberately.** C1 makes the secondary vCPUs execute (`machine.boot.secondary-core-release`) and makes the placement table load-bearing at runtime: each core's event loop scans only the actors placed there, and a message edge that crosses a core boundary is now a build error rather than a silent demotion to core 0 (`actors.scheduling.per-core-loop`, `golden/err-placement-cross-core-send` — the hole that clause's note describes was live and unguarded until C1). Flip condition (2) is untouched: no message crosses a core yet, so no cross-core admission exists to record. Per plans/M8.md decision 10 this clause flips at **C2**, on a multicore boot that makes a cross-core call and observes its reply.\n\n**FLIPPED at item C2 (2026-07-25), gap -> test.** plans/M8.md decision 10 fixed C2 as the flip point and stated the bar: \"a multicore boot that makes a cross-core call and observes its reply\". `golden/boot-cross-core-call` is that boot, over Hypervisor.framework: the root turn on core 0 `await`s an actor declared `core=1` and asserts a value (`77`) that only that actor's own state can produce, so a pass is evidence that a message crossed to the placed core, ran there, and its reply crossed back. Placement is load-bearing in the strongest available sense — the report's Placement line is the *only* thing that decides which ring the call site is redirected to and which core's loop drains it.\n\n**The one honest deviation from this clause's own earlier flip condition, stated rather than glossed.** Condition (2) above was written at item B and bundles two facts: a cross-core send, and \"a recorded `ChoiceEntry::Admission`\". plans/M8.md decision 10 later **split item C into C1/C2/C3** precisely because those are independent machines with independent oracles, and put the Admission recording in C3. The Admission half is not claimed here and is not covered by this clause: it belongs to the record/replay surface, and C3 owns it. **C3 landed it (2026-07-25)** under `machine.replay.choice-sequence`, where it belongs; this clause's own subject was and remains placement. What this clause is about — placement being a deterministic build output that the running machine actually obeys — is what the C2 boots prove.\n\n**Mechanism (item C2).** 04 \u00a73: \"Cross-core actor edges keep identical message semantics, lowered to compiler-generated bounded SPSC rings in guest memory with sealed publish/acquire ordering.\" Rings are derived from the sealed graph crossed with the compiled call sites (`layout::cross_core_rings`) and published in the report as `Ring kind= src= dst= target= cap= slot= bytes= base=` lines (`base=` added by item C3, which needs to address the ring to witness its admissions). **One request ring per (sending core, target mailbox root)** — per *core*, not per sending actor, which is what keeps the producer single (decision 28); `golden/boot-cross-core-two-senders` has two actors on core 0 messaging one on core 1 and pins exactly one request ring. A **separate reply lane** per core pair (decision 29): a completing turn whose waker carries another core's tag (decision 30, the top three bits of the waker word, `+1` so untagged still means local) pushes `(turn area, reply word)` onto the reply ring and raises that core's pending word, rather than storing into a remote turn record. The consumer drains both lanes at the top of its own `rt_run_one` and hands each request to the *same* `__rt_enqueue_<A>` a same-core send would have called.\n\n**Fail closed on every bound.** A full request ring is a rejection carried back to the sender exactly as a full mailbox is (02 \u00a79.4's `NotAdmitted`/`Rejected` path; `build_rt_enqueue`'s body is literally shared, `build_ring_enqueue`) — `golden/boot-cross-core-ring-full` asserts one admitted and one rejected against a one-slot ring. A full *mailbox* on the far side back-pressures the ring instead of dropping: the drain leaves the message where it is and stops that lane. Ring capacity comes from the sealed graph (a request ring is as deep as the mailbox it feeds; a reply ring is as deep as the number of turn areas on the destination core, which is a hard bound on outstanding replies since non-reentrancy caps in-flight activations at one per turn area), and an edge whose capacity cannot be derived is a build error naming the edge.\n\n**Two shapes still refused, each because the oracle does not exist** (decision 31). (a) An aggregate reply across a core boundary (`golden/err-cross-core-aggregate-reply`): the aggregate is written straight into the awaiting turn's frame through `x8`, which does not travel the reply ring. Under decision 11's baton it would pass on this host, and that is the reason to refuse it — a green boot would be evidence of the baton, not of correct publication. (b) A checkpoint (loop back-edge) inside a turn placed on a secondary core (`golden/err-cross-core-checkpoint`): `__wrela_checkpoint_service` names **core 0's** pending word by a baked-in constant and clears the whole word, so servicing one from core 1 would eat the wake a reply ring just raised for core 0 — the one way this item could still lose a wake. Both name the fn, the cores, and what lifting them costs.\n\n**Honest about ordering.** \u00a73's \"sealed publish/acquire ordering\" is the compiler's obligation, and this item discharges it by *ordering the stores* (publish into the ring, then raise the pending word) and by never letting one core write another's turn record. It emits **no barriers**, and there is no oracle here that could show a missing one: decision 11's baton means exactly one vCPU is inside `hv_vcpu_run` at a time, so a mis-ordered publication cannot be observed on this machine. Recorded as a claim not yet tested rather than as a claim satisfied.\n\n**A single-core image emits no ring machinery at all**, which is again mechanical rather than measured: `cargo xtask golden` moved **zero** pre-existing expectation files across this item (the only tracked changes are the retired guard and the four new cases). `cargo xtask repro` green; every existing recording replays unchanged.\n\n**Mutation-tested, not assumed** — each break applied, the gate re-run, and the named oracle observed to fail; see plans/M8.md item C2's self-audit table for the full list.\n\nplans/M8.md item H Target C (2026-07-25): `golden/boot-cross-core-mailbox-depth` — Sink mailbox=1 on core 1, two producers on cores 0 and 2; transcript asserts Near returns 1 then Sink.total==11, which is impossible if the drain drops a rejected ring message instead of holding it (decision 29 back-pressure). Ring cap equals mailbox (cap=1). Choice sequence records the two eventual Admissions; the hold itself is not a choice (deterministic under the baton)."

