note = "Legality inference (plans/M3.md item C, decision 7): whole-graph comptime-callable classification computed directly from the typed tree's own callee keys, no annotation, no constraint solver — crates/wrela-compiler/src/eval/legal.rs. `classify(&TypedProgram) -> Legality` registers one node per classifiable key (a top-level fn by its bare name, a plain struct's method/assoc-fn/init as `Struct.member`, and every `TypedProgram::instantiations` entry — a struct instantiation's own methods the same `key.member` way — all identical to `CalleeKey::spelling()`'s own strings, one shared namespace), scans each node's own body once for a decision-7 illegal operation and for its own direct callees (folding any `TypedExprKind::Closure` encountered straight into the enclosing node's scan — decision 4: a closure has no graph node of its own), then propagates illegality through the callee graph to a fixed point (recursion/cycles are legal per decision 7; a plain whole-pass-per-iteration fixpoint terminates in at most one pass per node since illegality only ever grows). `require_legal(&Legality, key, context, span) -> Result<(), SemaError>` is the M3-D/E-facing consumer: `Verdict::Legal` is `Ok`; `Verdict::Illegal{path, reason}` renders `error[comptime]: \\`<context>\\` requires a comptime-legal closure, but \\`<key>\\` is not comptime-callable at <line>:<col>` (the context's own span, since a typed node carries none of its own — typed.rs decision 1) plus one extra line per call-chain hop (`  \\`a\\` calls \\`b\\``) ending `  \\`z\\` uses <reason>`, the generics requirement-chain diagnostic's own extra_lines/omit_location mechanism (sema/mod.rs), reused verbatim rather than grown a second way. Left `status = \"gap\"` rather than `\"test\"` deliberately: `xtask ledger`'s own validator (crates/xtask/src/main.rs) requires every `status = \"test\"` clause's `tests` entries to be an `xtask:<known-command>` or an existing path under `tests/` — golden dirs, always — and this item ships no golden (the plan's own item C scope: `comptime if`/`comptime assert`/const-initializer surfaces that would make `classify`/`require_legal` observable through a pinned dump land in M3-D); citing bare Rust unit test names would not satisfy that check (they run via `cargo test`, already part of `xtask check`, but are not a `tests/`-rooted path), and inventing one to satisfy the format would be exactly the kind of gamed coverage the ledger exists to catch. The actual coverage today is eleven unit tests in `eval/legal.rs`'s own `#[cfg(test)] mod tests`, built from real source through the real `sema::check_typed` pipeline wherever the construct is representable (`plain_fn_is_legal`, `transitive_chain_is_legal`, `recursion_is_legal`, `mutual_recursion_is_legal`, `method_calls_are_classified_by_struct_dot_member_key`, `generic_fn_instantiation_is_classified_independently`, `generic_struct_instantiation_method_is_classified_independently`, `closure_body_folds_into_enclosing_fn_closure_set` — this one asserts the scan's own callee set directly, not just the (trivially Legal either way) verdict, to prove a closure's inner call is actually captured — `require_legal_accepts_a_legal_key`, `unknown_key_defaults_to_legal`), plus one (`require_legal_reports_illegal_verdicts_with_a_call_path_diagnostic`) that exercises the diagnostic's own multi-hop rendering against a hand-built `Legality` value, since no real program can produce an `Illegal` verdict yet to build a fixture from. That gap is real and named here rather than argued around: every operation decision 7 names as illegal — `await`/`send`/actor calls, `with` group/pool, pool operations, `@image` bodies — is still unrepresentable in the typed tree (`bodies.rs` fails closed — `error[unimplemented]` — on each before a typed node is ever built: `Expr::Unary(_, UnaryOp::Await, _)`, `Expr::Send`, `Stmt::With`, `is_image_fn`; golden/err-unimplemented-await already pins the first), so `sema::check_typed` never returns `Ok` for a program containing one — `classify` cannot classify what cannot exist yet. `eval/legal.rs`'s own illegal-op scan (`expr_illegal_reason`/`stmt_illegal_reason`) is an exhaustive match over every current `TypedExprKind`/`TypedStmtKind` variant (not a wildcard), so it stops compiling — rather than silently defaulting new variants to \"legal\" — the moment M5 lifts any of those fail-closed diagnostics and typed.rs gains a real node for one; that is the honest present shape of \"the illegal-op detection for the node kinds that can appear\" the M3-C task asked for. Flips to `status = \"test\"` citing real goldens once M3-D's `comptime if`/`comptime assert`/const-initializer surfaces make a `require_legal` diagnostic (and a genuinely reachable `Illegal` verdict, once M5 lifts a fail-closed case) pinnable end to end. M3-D update (the wiring this note's last paragraph asked for, now live — status stays `\"gap\"`, honestly, since the underlying fact this whole clause tracks has not changed): `eval::legal::classify` is now called exactly once per build, from `eval::check_comptime` (`sema::mod::check_typed`'s own final step, right after `generics::check`), and its `Legality` is threaded through both consumers M3-D added — `eval::check_consts` (`legal::direct_callees` on each `const`'s own initializer, context `\"const <name>\"`) and `eval::check_comptime_asserts` (`legal::direct_callees` on each `comptime assert`'s condition/message, context `\"comptime assert\"`) — via `require_legal`, before either ever evaluates anything (see `comptime.specialize.selected-branch-only`/`comptime.assert.build-error` above for the call sites). `comptime if` conditions are the one context M3-D's own task brief named that does *not* get this treatment: `sema::specialize`'s chosen vocabulary (literals + top-level consts only, no calls at all — see `comptime.specialize.selected-branch-only`) means a condition can structurally never reach a callee, so there is nothing for `require_legal` to gate there; wiring it in anyway would be a dead, untestable call, which CLAUDE.md's \"no seams for their own sake\" argues against. None of this flips any verdict from `Legal` to `Illegal` in practice, for the identical reason the paragraph above already gives: every M3-D golden's own callees (`label`, `use_limit`'s implicit closure, ...) are ordinary deterministic fns, and nothing decision 7 names as illegal is representable in the typed tree yet. So the wiring is real and exercised on every `xtask check` run (every golden with a `const`/`comptime assert` now runs through `classify`+`require_legal` on the way to its pinned output, not just a bare `eval::check_consts`/`check_comptime_asserts` call) but still cannot produce a pinnable `Illegal`-path golden — the same honest gap, now with its consumer side actually built rather than merely anticipated. Flips to `status = \"test\"` the same way this note has always said: once M5 lifts a fail-closed case and a real `Illegal` verdict becomes constructible end to end.\n\nM4-B update (the flip this whole note has deferred to, now live): plans/M4.md item B lifts the fail-closed on `@image` bodies and adds the builder surface (`typed::TypedExprKind::Intrinsic`) as the first *representable* decision-7-shaped illegal operation — `eval::legal::expr_illegal_reason` gains its first real (non-`None`) arm, exactly as this note's own module-doc excerpt said it would: the exhaustive match stopped compiling the moment `typed.rs` grew the new variant, forcing this arm rather than silently defaulting it to legal. The ten graph-building intrinsics (`typed::is_restricted_intrinsic` — `Image`, `img.device`, `img.driver`, `img.actor`, `img.pool`, `img.dma_pool`, `img.on_failure`, `img.check_layout`, `img.seal`, `decl.handle()`) are illegal everywhere except the one reachable `@image` fn; `classify` builds every node's verdict exactly as before and then, once, clears the flag on the specific node named by the new `TypedProgram::image_fn` (set by `sema::bodies::check` when it recognizes the `@image` attribute) — no context threaded through the scan itself, so the existing whole-graph classify/propagate shape is unchanged, only the one exemption is new. Two `Illegal`-verdict paths are now genuinely reachable end to end, both pinned: a `@test` fn whose own body directly contains a builder intrinsic (`golden/err-image-intrinsic-in-test` — `check_test_legality`, `eval/mod.rs`'s own new addition to `check_comptime`, `require_legal`s every comptime-run `@test` unconditionally now, not just lazily inside `wrela test`'s report, so the diagnostic fires at `--stage=check`/`--stage=typed` too) and a `const` initializer that directly uses one (`golden/err-image-intrinsic-in-const` — a `const`'s own initializer carries no `CalleeKey` for an intrinsic use, since `TypedExprKind::Intrinsic` is not a `Call`, so `legal::direct_callees` alone could never have caught it; `legal::scan_standalone` replaces it, returning both the callee set *and* whether the expression itself directly commits a decision-7 violation, and `eval::check_consts` now checks both). The accept side is the same mechanism proving the *positive* case: `golden/image-basic` (single-module) and `golden/image-project` (multi-module, the `@image` fn's own module importing an actor struct from another) both call every restricted intrinsic directly inside the one `@image` fn and check/evaluate clean — the node exists, is scanned, is marked illegal by the same rule as everything else, and is then exempted, all observably through `--stage=check`/`--stage=typed`/`--stage=image` succeeding. `cargo xtask check` green (fuzz/bench/corpus/ledger all included) confirms no existing goldens moved. Known, disclosed scope boundary (not a silent gap): only the `@image` fn's *own* body is exempted — a helper fn it merely calls that itself uses an intrinsic is still `Illegal` (every worked example spells the whole sequence directly in the `@image` fn's own body; factoring builder calls into a helper is not yet supported).\n\nPost-review fix (2026-07-23, same session): the disclosed boundary above was *stated* but not *enforced* — `classify` correctly computed an `Illegal` verdict for the `@image` fn itself once a callee it called was illegal (ordinary fixed-point propagation, unchanged), but nothing ever called `require_legal` against the `@image` fn's own key, so the verdict was computed and then ignored; a helper fn calling a builder intrinsic on a `mut img: Image` parameter checked and evaluated anyway, silently widening the exemption in practice. Fixed in `eval::check_image_legality` (`eval/mod.rs`, wired into `check_comptime` right after `check_test_legality`): every direct callee of the one reachable `@image` fn's own body (`legal::direct_callees_of_body`, a new small public helper reusing `classify`'s own `scan_stmts`) is checked against this module's own `Legality` *before* `require_legal` runs on the `@image` fn's own (whole-transitive-closure) verdict — reusing the identical chain-diagnostic machinery `@test`/`const` already get, not a new shape. `golden/err-image-intrinsic-in-helper` pins the exact reviewer-reported probe (a helper fn taking `mut img: Image` and calling `img.actor(...)`, called once from the `@image` body): `error[comptime]: \\`@image fn build\\` requires a comptime-legal closure, but \\`build\\` is not comptime-callable at 0:0` / `  \\`build\\` calls \\`add_actor\\`` / `  \\`add_actor\\` uses an \\`@image\\` builder intrinsic` — fails identically at `--stage=check` and `--stage=image`, so the checked graph and the actual evaluated behavior can no longer disagree. `golden/image-helper-accept` is the accept-side proof this fix does not over-reject: an ordinary comptime-legal helper fn (arithmetic over a `const`) called directly from the `@image` body still checks and evaluates. The cross-module case is a second, genuinely different gap, disclosed rather than silently passed: a callee imported from another module is invisible to this module's own `classify` (`sema::bodies::check`'s per-item loop only ever populates `TypedProgram::fns`/`structs` from `module.items`, never from an import binding — a spliced entry's *body* is reachable for ordinary type-checking, per item A, but its own comptime-legality classification lives only in the *exporting* module's separate `TypedProgram`, which `check_image_legality` has no access to here), so `Legality::verdict`'s own documented \"unknown key defaults to legal\" would have silently passed a cross-module intrinsic-using helper straight through — `check_image_legality` refuses that default for this one path specifically, failing closed instead with `error[unimplemented]: \\`@image\\` fn \\`build\\` calls \\`add_actor\\`, declared in another module; checking a cross-module callee's comptime legality from an \\`@image\\` fn is not supported yet`, pinned by `golden/err-image-intrinsic-in-cross-module-helper` (a project case: the `@image` module importing a helper from another module that itself calls a builder intrinsic). `cargo xtask check` green; `golden/image-basic`/`golden/image-project` (this clause's own pre-existing accept goldens) are byte-identical, confirming the fix rejects only what it must.\n\nM6-A note-update (plans/M6.md item A — the plan's own \"note-update `comptime.legality.inferred` (new real illegal arms)\" instruction; the full account lives in the new `actors.calls.callerror-composition` clause, cited rather than duplicated here): `eval::legal`'s exhaustive scan gained its second and third representable illegal ops since the M5 paragraph above — `TypedExprKind::Await`/`Send` (\"an `await`/`send` expression\"), `TypedStmtKind::WithGroup` (\"a `with group` block\"), and two new `Intrinsic`-key arms (`now()` — decision 11's own dedicated runtime-only reason; `Group.start`/`Group.join_all` — \"a `group` construct\") — plus one rule that is not node-kind-shaped at all: `insert_fn_node` now marks every `async fn`'s own node illegal unconditionally, independent of body content (02-language.md §12 names the fn's own color, not merely its statements). `check_test_legality` (this clause's own M4-B-era mechanism, unchanged in shape) gets its first exercise of a *declared*-`Comptime` `@test` turning out illegal for a reason besides a directly-written `@image` intrinsic: a bare `@test` on an `async fn` (`golden/err-test-async-bare-illegal`) — same hard-build-error treatment, no new code path. `ms(n)` deliberately stays legal (a real, comptime-evaluable `Intrinsic`, `eval::interp::eval_intrinsic`'s new arm) — decision 11's own \"pure comptime-legal duration constructor\" — so the exhaustive-match discipline this note has tracked since M3-C keeps doing its job: three new representable illegal shapes, three forced real arms, zero silent defaults.\n\nNote-update (plans/M6.md item G, 2026-07-24): `stmt_illegal_reason` gained its second real arm — `TypedStmtKind::BareSend` -> \"a `send` statement\" — joining `WithGroup`'s. Redundant for the *verdict* (the `TypedExprKind::Send` inside would flag the same node either way, and a `send` already requires an `async fn`, whose own color item A made unconditionally illegal), kept because this module's exhaustive-match discipline is the mechanism that forces every new node kind to be classified on purpose rather than by a wildcard, and because the diagnostic should name the statement the author wrote."

